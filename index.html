// Böylece R, C ve hedef mevcut formülle kendiliğinden doğru çıkar (formüle dokunulmadı).
const _forcedNightDays = {};   // yalnız cheats.forceNight() doldurur; normal oyunda boş
// Nöbet sıklığı geç oyunda artar (bkz. CONFIG.nightDutyEveryLate).
function nightDutyEveryFor(day) {
  return day >= CONFIG.nightDutyLateFromDay ? CONFIG.nightDutyEveryLate : CONFIG.nightDutyEvery;
}
function isNightDutyDay(day) {
  if (_forcedNightDays[day]) return true;
  const every = nightDutyEveryFor(day);
  return every > 0 && day % every === 0;
}
function nightPatientsFor(day) {
  if (!isNightDutyDay(day)) return 0;
  return Math.max(CONFIG.nightPatientMin, Math.round(patientLimitFor(day) * CONFIG.nightPatientRatio));
}
// GÜNDÜZ sahte reçete ihtimali — gün numarasına bağlı rampa (bkz. CONFIG.fakeChanceLate).
// Gün 1'de CONFIG.fakeChance, fakeChanceLateDay'de fakeChanceLate, üstü fakeChanceMax'ta durur.
function fakeChanceFor(day) {
  const d0 = Math.max(1, CONFIG.fakeChanceLateDay - 1);
  const step = (CONFIG.fakeChanceLate - CONFIG.fakeChance) / d0;
  return Math.min(CONFIG.fakeChanceMax, CONFIG.fakeChance + (day - 1) * step);
}
// Gecenin gündüze göre FAZLASI — sezon boyunca doğrusal büyür (Early → Late).
// Çarpan yerine fark kullanılmasının sebebi: çarpan taban rampasını ölçekleyip tavana
// yapıştırıyordu, fark ise tabanın üstünde kendi eğrisini korur.
function nightFakeBonusFor(day) {
  const d0 = Math.max(1, CONFIG.seasonDays - 1);
  const t = clamp((day - 1) / d0, 0, 1);
  return lerp(CONFIG.nightFakeBonusEarly, CONFIG.nightFakeBonusLate, t);
}
// gece sahte reçete ihtimali = gündüz rampası + gece farkı, tavanla sınırlı
function nightFakeChance(day) {
  return Math.min(CONFIG.nightFakeRateCap, fakeChanceFor(day) + nightFakeBonusFor(day));
}

// hasta başına izinli hata oranı — gün ilerledikçe daralır, floor'un altına inmez.
// Daralma hızı CONFIG'te elle verilmez: tabana missRateFloorDay'de varacak şekilde türetilir.
function missRateDecayPerDay() {
  const d0 = Math.max(1, CONFIG.missRateFloorDay - 1);
  return (CONFIG.missRateBase - CONFIG.missRateFloor) / d0;
}
function missRateFor(day) {
  return Math.max(CONFIG.missRateFloor, CONFIG.missRateBase - (day - 1) * missRateDecayPerDay());
}
// SAHTE HASTANIN "KAÇIRMA MALİYETİ" GERÇEK HASTANINKİ DEĞİLDİR (miss-maliyeti harmanlaması).
//
// Eski hâl: izinliHata = N × missRate ve her hata missCost = (R+C)/geçerli ile fiyatlanırdı.
// İki kusuru vardı. (1) N sahteleri de sayar, ama sahtede hata etmek BAŞKA bir kalemdir:
// kaçan ciro yoktur (sahte zaten R'ye 0 katkı yapıyor), yerine para cezası ödenir ve
// yakalama ikramiyesi kaçar. (2) Gün sahte-ağırlıklı olunca geçerli hasta sayısı düşer,
// missCost fırlar ve tolerans absürtleşirdi; alt güvenlik bandı bunu kesiyordu (ölçüldü:
// günlerin %3,8'i). Yani bandın asıl işi bir formül kusurunu örtmekti.
//
// Şimdi tolerans SINIF BAŞINA ayrı fiyatlanıyor ve toplam bir ₺ tutarı olarak çıkıyor.
function fakeMissCost() {
  // Sahteyi onaylamanın bilançosu: ödenen ceza + kaçan yakalama ikramiyesi.
  return CONFIG.fakeApproveMoneyPenalty + CONFIG.fakeCatchBonus;
}
function missAllowanceFor(day, validN, fakeN, missCost) {
  return missRateFor(day) * (validN * missCost + fakeN * fakeMissCost());
}

// =====================================================================
//  FİYAT GÜNCELLEMELERİ — taban fiyat × çarpan
// =====================================================================
// TASARIM: çarpan durumu MUTABLE DEĞİL. priceStateFor(gün) saf bir fonksiyondur:
// (runSeed, gün) → çarpanlar. Gün 1'den o güne kadarki turlar sırayla yeniden oynanır.
// Sebep: buildDaySchedule(30) gün 1'de de çağrılabiliyor (hedef sorgusu, self-test) ve
// o günün R/C/hedefi O GÜNÜN fiyatlarıyla hesaplanmalı. Mutable birikim olsaydı önden
// üretilen gün yanlış fiyatla cache'lenirdi.
//
// Hangi günün fiyatı okunuyor? genDay() — buildDaySchedule içindeysek üretilen gün,
// değilse oynanan gün. Sahte oranı ve reçete tarihi ile TAM AYNI mekanizma.
const PRICE_IDENTITY = { p: 1, c: 1 };
const PRICE_SEED_SALT = 0x9E3779B9;   // gün tohumundan AYRI akış: fiyat turu hasta üretimini kaydırmasın

// Gün 1 asla güncelleme günü değildir (öğretici gün). every=5 → 6, 11, 16, 21, 26.
function isPriceUpdateDay(day) {
  const e = CONFIG.priceUpdateEvery;
  return e > 0 && day >= 2 && (day - 1) % e === 0;
}
function priceSeedFor(day) {
  let h = ((game.runSeed >>> 0) ^ (CONFIG.daySeedBase >>> 0) ^ (PRICE_SEED_SALT >>> 0)) >>> 0;
  h = (h ^ Math.imul(day, 0x85EBCA77)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x2545F491);
  h = Math.imul(h ^ (h >>> 13), 0xC2B2AE3D);
  return (h ^ (h >>> 16)) >>> 0;
}

// Bir turu uygula. SEÇİM KATEGORİ KÜMELİDİR: rastgele ilaç serpmek yerine kategoriler
// bütün olarak seçilir ve kota dolana kadar eklenir (tur başına ~2-3 kategori).
// SEBEP (ölçüldü): haber "hangi kategoriler" diye veriliyor. Payı 39 ilaca serpince bir tur
// 8 kategoriye dokunuyordu; "her şey oynadı" demek oyuncuya karar bırakmaz. Kümeleme haberi
// eyleme dönüştürülebilir kılar — "yarın Vitamin'e zam" duyan oyuncu bugün vitamin stoklar.
//
// ALIŞ yönü KATEGORİDEN gelir (haberin doğru olması için), büyüklüğü ilaçtan.
// SATIŞ adımı ilaç başına TAMAMEN BAĞIMSIZ çekilir — marjların birbirinden ayrışması
// (bazı ilaç kârlı, bazısı kâra yakın) bu bağımsızlıktan doğar.
function applyPriceRound(mul, day) {
  return withSeed(priceSeedFor(day), function () {
    const quota = clamp(Math.round(MEDICINES.length * CONFIG.priceUpdateShare), 1, MEDICINES.length);
    const items = [], cats = [];
    let taken = 0;
    for (const cat of shuffledCopy(MED_CATEGORIES)) {
      if (taken >= quota) break;
      const meds = MEDICINES.filter(m => m.category === cat);
      if (!meds.length) continue;
      const costUp = rng() < 0.5;                 // kategorinin ALIŞ yönü — DAYEND haberi bunu söyler
      for (const m of meds) {
        const cur = mul[m.id];
        const pFrom = cur.p, cFrom = cur.c;
        const cStep = 1 + (costUp ? 1 : -1) * rng() * CONFIG.priceStepMax;
        const pStep = 1 + (rng() * 2 - 1) * CONFIG.priceStepMax;
        let nc = clamp(cFrom * cStep, CONFIG.priceDriftMin, CONFIG.priceDriftMax);
        let np = clamp(pFrom * pStep, CONFIG.priceDriftMin, CONFIG.priceDriftMax);
        // Zararına satış rayı: önce SATIŞI yükselterek dene, yetmezse ALIŞI düşür — ikisi de
        // bantta kalır. Bağımsızlığı bozmaz, yalnız patolojik uca (satış < alış) çarpı koyar.
        const need = (m.cost * nc) * (1 + CONFIG.priceMinMargin) / m.price;
        if (np < need) {
          np = Math.min(CONFIG.priceDriftMax, need);
          const back = (m.price * np) / (1 + CONFIG.priceMinMargin) / m.cost;
          if (nc > back) nc = Math.max(CONFIG.priceDriftMin, back);
        }
        cur.p = np; cur.c = nc;
        items.push({ id: m.id, name: m.name, category: cat,
                     pFrom: pFrom, pTo: np, cFrom: cFrom, cTo: nc });
        taken++;
      }
      cats.push({ category: cat, up: costUp });
    }
    return { day: day, items: items, cats: cats };
  });
}

const _priceStateCache = {};
function invalidatePriceStates() { for (const k in _priceStateCache) delete _priceStateCache[k]; }
function buildPriceState(day) {
  const mul = {};
  for (const m of MEDICINES) mul[m.id] = { p: 1, c: 1 };
  let lastRound = null, roundCount = 0;
  for (let d = 2; d <= day; d++) {
    if (!isPriceUpdateDay(d)) continue;
    lastRound = applyPriceRound(mul, d);
    roundCount++;
  }
  return { day: day, mul: mul, lastRound: lastRound, roundCount: roundCount };
}
function priceStateFor(day) {
  const d = Math.max(1, Math.floor(day) || 1);
  if (!_priceStateCache[d]) _priceStateCache[d] = buildPriceState(d);
  return _priceStateCache[d];
}
// day'de uygulanan tur; day güncelleme günü değilse null. Gün başı bilgi şeridi,
// depo ekranındaki ↑/↓ ve bir gün önceden haber veren DAYEND uyarısı hep bunu okur.
function priceRoundOn(day) {
  if (!isPriceUpdateDay(day)) return null;
  const r = priceStateFor(day).lastRound;
  return r && r.day === day ? r : null;
}

// Haber metni: kategori adı yerine DEPO SEKMESİ etiketi kullanılır — oyuncunun alışveriş
// yaptığı dil bu (kategori ↔ sekme 1:1; self-test bu eşleşmeyi garanti ediyor).
function groupLabelForCategory(cat) {
  const m = MEDICINES.find(x => x.category === cat);
  const g = m ? GROUPS.find(x => x.id === m.group) : null;
  return g ? g.label : cat;
}
// "Vitamin ↑ · Alerji ↓ · Mide ↑" — YALNIZ yön, tutar YOK. Kesin tutarı vermek kararı
// hesaba indirir; yön vermek karar bırakır (ucuz stokla, ya da nakiti başka yere ayır).
function priceRoundLabel(round) {
  if (!round || !round.cats.length) return "";
  return round.cats.map(c => groupLabelForCategory(c.category) + (c.up ? " ↑" : " ↓")).join(" · ");
}
// Bir ilacın SON turdaki alış yönü (depo ekranındaki ↑/↓ göstergesi bunu okur).
// Yalnız GÜNCELLEME GÜNÜNDE döner: gösterge o günün haberi, kalıcı bir etiket değil.
function priceMoveToday(id) {
  const r = priceRoundOn(game.dayNumber);
  if (!r) return 0;
  for (const it of r.items) if (it.id === id) return it.cTo > it.cFrom ? 1 : (it.cTo < it.cFrom ? -1 : 0);
  return 0;
}

// --- GÜNCEL FİYAT: oyun içinde fiyat SADECE buradan okunur ---
function priceMulOf(id) {
  const st = priceStateFor(genDay());
  return st.mul[id] || PRICE_IDENTITY;
}
function medPrice(m) { return Math.max(1, Math.round(m.price * priceMulOf(m.id).p)); }
function medCost(m)  { return Math.max(1, Math.round(m.cost  * priceMulOf(m.id).c)); }

// =====================================================================
//  DİLENCİ — günün programına AİT DEĞİL
// =====================================================================
// KRİTİK: dilenci daySchedule'a HİÇ girmez. N, R, C, missCost, hedef, konsantrasyon
// tavanı ve gün sonu sayacı onu görmez — cheat ile enjekte edilen bonus hastalarla
// tam aynı yol (patient.bonus = true). Aksi halde hedef bozulurdu.
//
// Buna rağmen GELİŞİ DETERMİNİSTİKTİR: (runSeed, gün) → gelir mi, kaçıncı hastadan
// sonra, hangi replikle. Kendi tohum akışında (BEGGAR_SEED_SALT) üretildiği için hasta
// listesinin RNG akışını kaydırmaz — aynı koşuda aynı günler aynı hastaları verir.
const BEGGAR_SEED_SALT = 0x27D4EB2F;
function beggarSeedFor(day) {
  let h = ((game.runSeed >>> 0) ^ (CONFIG.daySeedBase >>> 0) ^ (BEGGAR_SEED_SALT >>> 0)) >>> 0;
  h = (h ^ Math.imul(day, 0x7FEB352D)) >>> 0;
  h = Math.imul(h ^ (h >>> 15), 0x846CA68B);
  h = Math.imul(h ^ (h >>> 13), 0x9E3779B1);
  return (h ^ (h >>> 16)) >>> 0;
}
const _beggarPlanCache = {};
function invalidateBeggarPlans() { for (const k in _beggarPlanCache) delete _beggarPlanCache[k]; }
// null => o gün dilenci gelmez. Gün 1'de ASLA gelmez (öğretici gün).
function buildBeggarPlan(day) {
  if (day < 2 || !(CONFIG.beggarChance > 0)) return null;
  return withSeed(beggarSeedFor(day), function () {
    if (rng() >= CONFIG.beggarChance) return null;
    const n = Math.max(1, patientLimitFor(day));
    return {
      day: day,
      after: 1 + rand(Math.max(1, n - 1)),   // kaçıncı hasta TAMAMLANDIKTAN sonra girsin
      line: pick(BEGGAR_LINES)
    };
  });
}
function beggarPlanFor(day) {
  if (!(day in _beggarPlanCache)) _beggarPlanCache[day] = buildBeggarPlan(day);
  return _beggarPlanCache[day];
}

// Verilecek ilaç: STOKTAKİ en ucuz kalem (güncel alış fiyatına göre). Stok boşsa null
// döner ve "İLAÇ VER" seçeneği pasif olur. Her frame okunur, saklanmaz — oyuncu arada
// depodan sipariş verirse seçenek kendiliğinden açılır.
function beggarGiftMedicine() {
  let best = null, bestCost = Infinity;
  for (const m of MEDICINES) {
    if ((game.stock[m.id] || 0) <= 0) continue;
    const c = medCost(m);
    if (c < bestCost) { bestCost = c; best = m; }
  }
  return best;
}
// Dilenci ailesinin İKİ tipi var: "beggar" (yardım isteyen) ve "beggarpay" (borcunu
// ödemeye gelen). İkisi de günün programının DIŞINDADIR ve hasta mantığının hiçbir
// yoluna (sahtelik, servis, sepet, hedef) girmez — bu yardımcı o ortak dışlamayı taşır.
function isBeggarType(t) { return t === "beggar" || t === "beggarpay"; }
function activeBeggar() {
  const p = activePatient();
  return p && p.request.type === "beggar" ? p : null;
}
function activeBeggarPay() {
  const p = activePatient();
  return p && p.request.type === "beggarpay" ? p : null;
}

// --- GERİ ÖDEME DEFTERİ ---
// SGK alacak defteriyle AYNI kalıp: [{ dueDay, amount }], kariyer boyu kalıcı, sezon
// geçişinde vadesi yeniden tabanlanır (bkz. beginSeason). Fark: bu defter kasaya
// kendiliğinden akmaz — borçlu TEZGAHA GELİR ve oyuncu ödemeyi almak için ona bakar.
//
// SEED: zar, yardımın YAPILDIĞI güne bağlı kendi tohum akışında atılır (günde en fazla
// bir dilenci olduğu için gün tek başına anahtar). Böylece aynı runSeed + aynı yardım
// kararları her zaman aynı geri dönüşleri verir, ve zar hasta üretim akışını kaydırmaz.
function beggarReturnSeedFor(day) {
  let h = ((game.runSeed >>> 0) ^ (CONFIG.daySeedBase >>> 0) ^ 0x1B873593) >>> 0;
  h = (h ^ Math.imul(day, 0xCC9E2D51)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x21F0AAAD);
  h = Math.imul(h ^ (h >>> 15), 0x735A2D97);
  return (h ^ (h >>> 15)) >>> 0;
}
// Yardım edildi: geri dönüş zarını at ve tutarsa deftere yaz. value = verilenin ₺ değeri.
function scheduleBeggarReturn(value) {
  if (!(value > 0) || !(CONFIG.beggarReturnChance > 0)) return null;
  return withSeed(beggarReturnSeedFor(game.dayNumber), function () {
    if (rng() >= CONFIG.beggarReturnChance) return null;
    const lo = Math.max(1, Math.round(CONFIG.beggarReturnDelayMin));
    const hi = Math.max(lo, Math.round(CONFIG.beggarReturnDelayMax));
    const delay = lo + rand(hi - lo + 1);
    const amount = Math.max(1, Math.round(value * CONFIG.beggarReturnMul));
    const row = { dueDay: game.dayNumber + delay, amount: amount, line: pick(BEGGAR_PAY_LINES) };
    game.beggarReturns.push(row);
    return row;
  });
}
function pendingBeggarReturns() {
  let t = 0;
  for (const r of game.beggarReturns) t += r.amount;
  return Math.round(t);
}
function makeBeggarPay(row) {
  return {
    avatar: BEGGAR_AVATAR.emoji,
    avatarKey: BEGGAR_AVATAR.assetKey,
    request: { type: "beggarpay", amount: row.amount },
    line: row.line || pick(BEGGAR_PAY_LINES),
    decided: null,
    maxPatience: CONFIG.basePatience,
    patience: CONFIG.basePatience,
    enterT: 0,
    posCurrent: 0,
    bonus: true,                      // GÜNÜN PROGRAMINA SAYILMAZ (hedef/gün sonu etkilenmez)
    night: false
  };
}
// Vadesi gelen borçlulardan birini tezgaha al. Günde en fazla bir tane: yardım eden
// oyuncu ödül yağmuruna değil, düzenli küçük bir akışa kavuşsun.
function maybeSpawnBeggarPay() {
  if (game.beggarPayDay === game.dayNumber) return;
  if (game.queue.length >= effMaxQueue()) return;
  let idx = -1;
  for (let i = 0; i < game.beggarReturns.length; i++) {
    if (game.beggarReturns[i].dueDay <= game.dayNumber) { idx = i; break; }
  }
  if (idx < 0) return;
  const row = game.beggarReturns.splice(idx, 1)[0];
  game.beggarPayDay = game.dayNumber;
  enqueuePatient(makeBeggarPay(row));
}
// Ödemeyi al. Kasaya girer VE günün kazanç sayacına yazılır (hedef FORMÜLÜNE dokunulmaz —
// hedef o günün hasta listesinden hesaplanıyor, bu bonus hasta o listede yok, yani
// ödeme hedefi kolaylaştıran serbest bir paydır).
function beggarPayCollect() {
  const b = activeBeggarPay();
  if (!b || game.feedback) return;
  const amount = Math.max(0, Math.round(b.request.amount || 0));
  game.money += amount;
  addDayMoney(amount);
  game.dayStats.beggarRepaid++;
  game.dayStats.beggarRepaidMoney += amount;
  updateCareerPeak();
  game.feedback = { ok: true, angry: false, text: "💵 Borcunu ödedi!  +" + amount + "₺", t: 0 };
}
function makeBeggar(line) {
  return {
    avatar: BEGGAR_AVATAR.emoji,
    avatarKey: BEGGAR_AVATAR.assetKey,
    request: { type: "beggar" },      // sahtelik/inceleme alanları YOK — o mantığa hiç girmez
    line: line || pick(BEGGAR_LINES),
    decided: null,
    maxPatience: CONFIG.basePatience,
    patience: CONFIG.basePatience,
    enterT: 0,
    posCurrent: 0,
    bonus: true,                      // GÜNÜN PROGRAMINA SAYILMAZ (hedef/gün sonu etkilenmez)
    night: false
  };
}
// Gün içinde uygun an geldiyse dilenciyi kuyruğa al. Günde en fazla bir kez.
function maybeSpawnBeggar() {
  if (game.beggarDay === game.dayNumber) return;          // bugün geldi
  const plan = beggarPlanFor(game.dayNumber);
  if (!plan || game.dayCompleted < plan.after) return;
  if (game.queue.length >= effMaxQueue()) return;         // tezgah dolu, bir sonraki fırsatta
  const b = makeBeggar(plan.line);
  game.beggarDay = game.dayNumber;
  enqueuePatient(b);
}

// --- Üç karar. Hepsi tek yerden sayaç yazar (dilenci istatistikleri hasta
//     istatistiklerinden AYRI: served/correct/wrong/angry'ye dokunulmaz). ---
function beggarGiveMedicine() {
  const b = activeBeggar();
  if (!b || game.feedback) return;
  const m = beggarGiftMedicine();
  if (!m) return;                                          // seçenek pasif
  game.stock[m.id] = Math.max(0, (game.stock[m.id] || 0) - 1);
  game.dayStats.beggarGave++;
  game.dayStats.beggarRep += gainReputation(CONFIG.beggarRepGive);
  // Borcun değeri, dilencinin ELİNE GEÇEN değerdir: ilacın RAF fiyatı (medPrice), alış
  // maliyeti değil. Kişi aldığı şeyin karşılığını öder, senin tedarik maliyetini bilmez.
  scheduleBeggarReturn(medPrice(m));
  game.feedback = { ok: true, angry: false, text: "🤝 " + m.name + " verdin", t: 0 };
}
function beggarGiveMoney() {
  const b = activeBeggar();
  if (!b || game.feedback) return;
  const amount = Math.min(game.money, CONFIG.beggarMoneyGive);
  if (amount <= 0) return;                                 // kasa boş => seçenek pasif
  game.money -= amount;
  game.dayStats.beggarGave++;
  game.dayStats.beggarRep += gainReputation(CONFIG.beggarRepGive);
  scheduleBeggarReturn(amount);
  game.feedback = { ok: true, angry: false, text: "🤝 " + amount + "₺ verdin", t: 0 };
}
// Reddetme ve SABRIN BİTMESİ aynı sonucu verir (aynı ceza) — bekleyip görmezden gelmek
// reddetmenin ucuz yolu olmasın.
// REDDEDİLEN DİLENCİ GERİ DÖNMEZ: buradan scheduleBeggarReturn ÇAĞRILMAZ.
function beggarRefuse(timedOut) {
  const b = activeBeggar();
  if (!b || (game.feedback && !timedOut)) return;
  game.dayStats.beggarRefused++;
  game.dayStats.beggarRep -= CONFIG.beggarRepReject;
  game.feedback = { ok: false, angry: false,
    text: timedOut ? "Dilenci bekleyemedi, gitti" : "Dilenciyi geri çevirdin", t: 0 };
  loseReputation(CONFIG.beggarRepReject);
}

// --- Bir siparişin referans değeri (doğru servis edilirse ciro / mal maliyeti) ---
// Reçete: kalemlerin adetli price/cost toplamı — kesin.
// Semptom: o kategorideki ilaçların ORTALAMASI; oyuncu kategoriden herhangi birini
// verebilir ve hepsi doğru sayılır, tek "doğru fiyat" yoktur. Kategori içi fiyat
// yayılımı genel havuzdan çok daha dar olduğu için tahmin hatası küçüktür.
// priceMul: gece hastalarında CONFIG.nightPriceMultiplier (nöbet farkı). Yalnız SATIŞ
// fiyatına uygulanır — mal maliyeti (cost) değişmez.
function refValuesFor(request, priceMul) {
  const mul = priceMul || 1;
  // Dilenci gün listesine hiç girmediği için buraya normalde DÜŞMEZ; savunma amaçlı
  // sıfır katkı döner ki yanlışlıkla listeye sızsa bile R/C/hedefi kirletmesin.
  if (isBeggarType(request.type)) return { rev: 0, cost: 0, valid: false };
  // Medula: kağıt reçete gibi hesaplanır, ASLA sahte olmaz => daima geçerli
  if (request.type === "prescription" || request.type === "medula") {
    if (request.fake) return { rev: 0, cost: 0, valid: false };   // doğru oynanış = reddetmek
    let rev = 0, cost = 0;
    for (const it of request.items) {
      const m = getMedicine(it.id);
      if (m) { rev += medPrice(m) * it.qty; cost += medCost(m) * it.qty; }
    }
    return { rev: rev * mul, cost, valid: true };
  }
  // Semptomlu hasta: her kalem için o kategorinin ORTALAMASI × adet.
  let rev = 0, cost = 0;
  for (const it of (request.items || [{ symptom: request.symptom, qty: 1 }])) {
    const cands = MEDICINES.filter(m => m.category === it.symptom.category);
    if (!cands.length) return { rev: 0, cost: 0, valid: false };
    let r = 0, c = 0;
    for (const m of cands) { r += medPrice(m); c += medCost(m); }
    rev += (r / cands.length) * it.qty;
    cost += (c / cands.length) * it.qty;
  }
  return { rev: rev * mul, cost, valid: true };
}

// =====================================================================
//  SİPARİŞ KONSANTRASYON TAVANI
//  Tek hastanın günün R'sinde tuttuğu payı sınırlar. Tavan adil paya oranlıdır
//  (bkz. CONFIG.concentrationCap*). Ölçüm NİHAİ değer üzerinden yapılır: nöbet
//  farkı (×1.25) uygulanmış hâli, ham fiyat değil.
// =====================================================================
function concentrationCapFor(validN) {
  if (validN <= 0) return CONFIG.concentrationCapMax;
  return clamp(CONFIG.concentrationCapFactor / validN, CONFIG.concentrationCapMin, CONFIG.concentrationCapMax);
}

// Listenin R'si, geçerli hasta sayısı ve EN YÜKSEK paylı geçerli hastası.
// Sahteler (refValuesFor → valid:false) hem R'ye hem sayıma hem adaylığa girmez.
function concScan(list) {
  let R = 0, validN = 0, wi = -1, wv = -1;
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const v = refValuesFor(p.request, p.night ? effNightPriceMul() : 1);
    if (!v.valid) continue;
    R += v.rev; validN++;
    if (v.rev > wv) { wv = v.rev; wi = i; }
  }
  return { R, validN, wi, wv };
}

// Siparişin İÇERİĞİNİ yeniden üretir; TİPİ KORUNUR (reçeteli/semptomlu, sahte/gerçek,
// gündüz/gece). Tip değişirse yukarıdaki garantiler — her günde ≥1 gerçek reçete,
// 2. günden itibaren ≥1 sahte, nöbet gecesinde ≥1 gerçek — bozulur.
function concRegenRequest(p) {
  const t = p.request.type;
  if (t === "symptom") {
    p.request = makeSymptomRequest();
    p.line = p.request.line;                          // balon repliği semptomları anlatır
  } else if (t === "medula") {
    p.request = makeMedulaRequest();                  // Medula asla sahte olmaz
  } else {
    p.request = makePrescription(p.request.fake, 0);  // sahte/gerçek bayrağı aynen korunur
  }
}

// ZORLA SIĞDIRMA: en pahalı kalemi bir kademe küçültür (adet −1; adet 1'de kalemi çıkarır).
// Her çağrı siparişi kesin küçültür, küçültülemiyorsa false döner => döngü mutlaka durur.
function concShrinkOnce(p) {
  const request = p.request;
  const items = request.items;
  if (!items || !items.length) return false;
  const unitPrice = it => {
    if (request.type === "symptom") {
      const cands = MEDICINES.filter(m => m.category === it.symptom.category);
      if (!cands.length) return 0;
      let r = 0; for (const m of cands) r += medPrice(m);
      return r / cands.length;                        // semptomda kategori ORTALAMASI
    }
    const m = getMedicine(it.id);
    return m ? medPrice(m) : 0;
  };
  let bi = -1, bv = -1;
  for (let i = 0; i < items.length; i++) {
    const v = unitPrice(items[i]) * items[i].qty;
    if (v > bv) { bv = v; bi = i; }
  }
  if (bi < 0) return false;
  if (items[bi].qty > 1) items[bi].qty--;
  else if (items.length > 1) items.splice(bi, 1);
  else return false;                                  // tek kalem ×1 — daha fazla küçülemez
  if (request.type === "symptom") {
    request.symptom = items[0].symptom;               // geriye uyum alanı (tek kalemli yollar/emoji)
    request.line = buildSymptomLine(items);
    p.line = request.line;
  }
  return true;
}

// Tavanı uygular. Önce yeniden üretme (en fazla concentrationMaxPasses tur), sonra
// hâlâ aşan varsa zorla sığdırma. withSeed İÇİNDE çağrılır => determinizm korunur.
function applyConcentrationCap(list) {
  let regen = 0, forced = 0;
  // Matematiksel olarak sağlanamayan günlerde kural hiç uygulanmaz: geçerli hasta
  // sayısı validN ise en iyi ihtimalle (herkes eşit) en yüksek pay 1/validN olur.
  // tavan × validN ≤ 1 ise hiçbir dağılım tavanı sağlayamaz (validN ≤ 2) — sonsuz döngü
  // yerine dokunmadan çıkılır.
  const satisfiable = s => concentrationCapFor(s.validN) * s.validN > 1;

  for (let pass = 0; pass < CONFIG.concentrationMaxPasses; pass++) {
    const s = concScan(list);
    if (s.wi < 0 || s.R <= 0 || !satisfiable(s)) break;
    if (s.wv <= s.R * concentrationCapFor(s.validN)) break;   // tavan sağlandı
    concRegenRequest(list[s.wi]);
    regen++;
  }
  // 25 tur yetmediyse: kalemleri düşürerek zorla sığdır (her adım R'yi kesin küçültür)
  for (let guard = 0; guard < 200; guard++) {
    const s = concScan(list);
    if (s.wi < 0 || s.R <= 0 || !satisfiable(s)) break;
    if (s.wv <= s.R * concentrationCapFor(s.validN)) break;
    if (!concShrinkOnce(list[s.wi])) break;                   // daha fazla küçülemiyor
    forced++;
  }
  return { regen, forced };
}

// --- Günün tam listesini seed'li üret ve ekonomisini çıkar ---
// Aynı seed + aynı gün => aynı liste (test edilebilirlik).
function buildDaySchedule(day) {
  const dayN = patientLimitFor(day);
  const nightN = nightPatientsFor(day);
  const N = dayN + nightN;
  const prevDateDay = _dateDayOverride;
  _dateDayOverride = day;                 // reçete tarihleri o güne göre damgalansın
  // O günün fiyatları üretimden ÖNCE hazırlansın: konsantrasyon tavanı üretimin İÇİNDE
  // refValuesFor çağırıyor ve orada iç içe withSeed açmak (zararsız olsa da) gereksiz.
  priceStateFor(day);
  let patients, concRegen = 0, concForced = 0;
  let R = 0, C = 0, validCount = 0;
  try {
    const built = withSeed(daySeedFor(day), function () {
      const out = [];
      for (let i = 0; i < dayN; i++) out.push(makePatient());
      // NÖBET bölümü — listenin sonuna eklenir, spawn sırayla çektiği için gece sonra gelir
      for (let i = 0; i < nightN; i++) out.push(makePatient({ night: true }));

      // --- Reçete garantileri (hepsi withSeed içinde => determinizm bozulmaz) ---
      const isRx = p => p.request.type === "prescription";
      const isReal = p => isRx(p) && !p.request.fake;
      const isFake = p => isRx(p) && p.request.fake;

      // (a) Günde EN AZ BİR gerçek reçete: yoksa ilk gündüz hastası gerçek reçeteli olur.
      if (!out.some(isReal)) out[0] = makePatient({ forcePrescription: true, forceFake: false });

      // (b) 2. GÜNDEN İTİBAREN günde en az bir SAHTE reçete: inceleme mekaniği her gün
      // devreye girsin. Gün 1 öğretici kalır, garanti uygulanmaz.
      // Hedef olarak SON gündüz hastası seçilir — (a)'nın koyduğu 0. indeks korunur.
      if (day >= 2 && !out.some(isFake) && dayN >= 2) {
        out[dayN - 1] = makePatient({ forcePrescription: true, forceFake: true });
      }

      // (c) Gece bölümünde EN AZ BİR gerçek reçete: aksi halde nöbet yalnızca red
      // kararlarından ibaret olabiliyor (servis yok, ciro yok, karşıt örnek yok).
      if (nightN > 0 && !out.slice(dayN).some(isReal)) {
        out[out.length - 1] = makePatient({ night: true, forcePrescription: true, forceFake: false });
      }

      // (d) Sipariş konsantrasyon tavanı — GARANTİLERDEN SONRA çalışır ve yalnız sipariş
      // içeriğini değiştirir, tipleri korur; (a)(b)(c) bozulmaz.
      const conc = applyConcentrationCap(out);
      return { out, conc };
    });
    patients = built.out;
    concRegen = built.conc.regen;
    concForced = built.conc.forced;

    // R/C ÖLÇÜMÜ DE _dateDayOverride PENCERESİNİN İÇİNDE OLMAK ZORUNDA. refValuesFor
    // fiyatı genDay() üzerinden okuyor: pencere burada kapanırsa konsantrasyon tavanı
    // O GÜNÜN fiyatıyla ölçülür ama R/C oynanan günün fiyatıyla hesaplanır ve ikisi
    // birbirini tutmaz (ölçüldü: gün 8'de tavan aşımı uyarısı). Fiyat güncellemeleri
    // gelmeden önce ikisi de sabit olduğu için bu fark görünmüyordu.
    for (const p of patients) {
      // nöbet farkı: gece hastalarının satış fiyatı çarpanlı olarak R'ye girer
      const v = refValuesFor(p.request, p.night ? effNightPriceMul() : 1);
      p.refRevenue = v.rev;               // teşhis/doğrulama için hastada da dursun
      p.refCost = v.cost;
      p.refValid = v.valid;
      if (v.valid) { R += v.rev; C += v.cost; validCount++; }
    }
  } finally { _dateDayOverride = prevDateDay; }

  // o güne özel gerçek hata maliyeti: kaçan ciro + yazılan cost zararı, geçerli hasta başına
  const missCost = validCount > 0 ? (R + C) / validCount : 0;
  const allowance = missAllowanceFor(day, validCount, N - validCount, missCost);
  // `misses` artık EŞDEĞER GEÇERLİ-HATA SAYISI: allowance / missCost. Bu tanımla
  // raw = R − misses × missCost eşitliği aynen korunur, yani verifyGoalBalance,
  // simulateDayScenario ve neededCorrectFor tek satır değişmeden çalışmaya devam eder.
  const misses = missCost > 0 ? allowance / missCost : 0;
  const lo = CONFIG.goalRatioClamp[0], hi = CONFIG.goalRatioClamp[1];
  const raw = R - allowance;
  // 10'a AŞAĞI yuvarla: yukarı yuvarlamak formülün az önce verdiği toleransın bir kısmını
  // geri alır (gün 1'de hedefi 648.6 → 650 yapıp gereken doğruyu 6'dan 7'ye çıkarıyordu).
  const goal = Math.floor(clamp(raw, R * lo, R * hi) / 10) * 10;

  // Güvenlik bandı devreye girdi mi? (girdiyse hedef artık tolerans türevli DEĞİLDİR)
  const clampedAt = raw < R * lo ? "lo" : (raw > R * hi ? "hi" : null);
  return { day, patients, N, dayN, nightN, isNight: nightN > 0,
           R, C, validCount, fakeCount: N - validCount, misses, missCost, allowance, raw, goal, clampedAt,
           // konsantrasyon tavanı teşhisi (cheats.concentration / verifyConcentrationCap)
           concCap: concentrationCapFor(validCount), concRegen, concForced };
}

// gün listesi cache'i — hedef sorulunca üretilir, oynanınca AYNI liste kullanılır (iki kez üretilmez)
const _dayScheduleCache = {};
// Vitrin seviyesi hasta karışımını değiştirir => önden üretilmiş günler ve hedefleri
// geçersizleşir. Oynanan gün game.daySchedule snapshot'ından okunduğu için etkilenmez.
function invalidateDaySchedules() {
  for (const k in _dayScheduleCache) delete _dayScheduleCache[k];
  // Fiyat durumu ve dilenci planı da (runSeed, gün) türevi: koşu tohumu değişince
  // yeniden türetilmeli. Saf fonksiyon oldukları için gereksiz temizlik zararsız.
  invalidatePriceStates();
  invalidateBeggarPlans();
}
function getDaySchedule(day) {
  if (!_dayScheduleCache[day]) _dayScheduleCache[day] = buildDaySchedule(day);
  return _dayScheduleCache[day];
}

// günlük para hedefi — o günün gerçek hasta listesinden
function dailyGoalFor(day) { return getDaySchedule(day).goal; }

// hedefin fiilen karşılık geldiği oran (hedef / geçerli ciro) — teşhis için
function effectiveGoalRatio(day) {
  const sch = getDaySchedule(day);
  return sch.R > 0 ? sch.goal / sch.R : 0;
}
function goalForDay() {
  if (game.daySchedule && game.daySchedule.day === game.dayNumber) return game.daySchedule.goal;
  return dailyGoalFor(game.dayNumber);
}

// --- tarih sistemi: gün 1 = 17 Haziran 2026, her gün +1 ---
const MONTHS_TR = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
// Gün listesi önden üretilirken (buildDaySchedule) reçetelere O GÜNÜN tarihi basılmalı,
// oynanan günün değil. Üretim sırasında bu override doldurulur.
let _dateDayOverride = 0;
// ÜRETİLEN gün: buildDaySchedule içindeysek o gün, değilse oynanan gün. Sahte oranı gibi
// güne bağlı üretim parametreleri bunu okur — böylece önden üretilen her gün KENDİ
// gününün oranlarıyla kurulur, oynanan günün oranlarıyla değil.
function genDay() { return _dateDayOverride || game.dayNumber; }
function gameDate(offsetDays) {
  const d = new Date(2026, 5, 17);
  d.setDate(d.getDate() + ((_dateDayOverride || game.dayNumber) - 1) + (offsetDays || 0));
  return d;
}
// gün değişmediği sürece cache'lenir (HUD her frame çağırır; frame'de new Date olmasın)
let _dateCacheDay = 0, _dateCacheStr = "";
function dateShort() {
  if (_dateCacheDay === game.dayNumber) return _dateCacheStr;
  _dateCacheDay = game.dayNumber;
  const d = gameDate(0);
  _dateCacheStr = d.getDate() + " " + MONTHS_TR[d.getMonth()];
  return _dateCacheStr;
}

// Türkçe binlik ayraçlı para formatı: 1100 → "1.100₺" (toLocaleString YOK — her ortamda
// aynı görünüm). Basit cache: para değişmediği sürece string yeniden hesaplanmaz.
let _moneyCacheVal = null, _moneyCacheStr = "";
function formatMoney(n) {
  if (n === _moneyCacheVal) return _moneyCacheStr;
  _moneyCacheVal = n;
  let s = String(Math.abs(Math.trunc(n)));
  let out = "";
  while (s.length > 3) { out = "." + s.slice(-3) + out; s = s.slice(0, -3); }
  _moneyCacheStr = (n < 0 ? "-" : "") + s + out + "₺";
  return _moneyCacheStr;
}
function dateRx(offsetDays) {
  const d = gameDate(offsetDays);
  return d.getDate() + " " + MONTHS_TR[d.getMonth()] + " '" + String(d.getFullYear()).slice(2);
}

// ardışık aynı doktoru seçmeden tanınan doktor seç
function pickKnownDoctor() {
  let d;
  do { d = pick(KNOWN_DOCTORS); } while (KNOWN_DOCTORS.length > 1 && d.name === game.lastDoctor);
  game.lastDoctor = d.name;
  return d;
}

// --- Kusur sınıfları ---
// DETECTABLE: yalnız reçete kağıdına + doktor defterine bakarak doğrulanabilir.
// SUBTLE: alan bilgisi ister (ilaç etkileşimi); tek başına kusur olarak KULLANILMAZ.
// NOT: "overdose" (aşırı adet) KUSUR OLMAKTAN ÇIKARILDI. Yüksek adet artık normal bir
// reçete özelliğidir — doktor 5-6 kutu yazabilir ve bu reçeteyi sahte yapmaz.
const DETECTABLE_FLAWS = ["fake_doctor", "expired", "no_stamp", "bad_signature"];
const SUBTLE_FLAWS = ["conflict"];

// bir reçetede oyuncunun kağıttan tespit edebileceği kusurları döndür (teşhis + self-test)
function detectableFlawsOf(req) {
  const out = [];
  if (!req || req.type !== "prescription") return out;
  const known = KNOWN_DOCTORS.some(d => d.name === req.doctor);
  if (!known) out.push("doktor defterde yok (" + req.doctor + ")");
  if (req.hasStamp === false) out.push("kaşe yok");
  if (req.sig === "???" || req.sig === "—" || req.sig === "") out.push("imza geçersiz");
  if (req.expired) out.push("tarihi geçmiş (" + req.date + ")");
  return out;
}

// Medula panellerinin ÖLÇÜLEN çakışma denetimi — göz kararı değil, rect kesişimi.
// Hasta başına bir kez uyarır (her frame konsolu doldurmasın).
const _medulaLayoutChecked = {};
function rectsHit(a, b) {
  return !!(a && b && a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h);
}
function checkMedulaLayout(code) {
  if (_medulaLayoutChecked[code]) return true;
  _medulaLayoutChecked[code] = true;
  const hud = layout._hud, bub = layout.medulaBubbleRect, card = layout.medulaCardRect;
  const pairs = [["HUD", hud, "kod balonu", bub], ["HUD", hud, "kayıt kartı", card],
                 ["kod balonu", bub, "kayıt kartı", card]];
  let ok = true;
  for (const [n1, r1, n2, r2] of pairs) {
    if (r1 && r2 && rectsHit(r1, r2)) {
      ok = false;
      console.warn("[medula] Panel çakışması: " + n1 + " ↔ " + n2 +
        "  " + n1 + "=" + JSON.stringify(rectRound(r1)) + "  " + n2 + "=" + JSON.stringify(rectRound(r2)));
    }
  }
  return ok;
}
function rectRound(r) { return { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.w), h: Math.round(r.h) }; }

// Sorgulanmış kod kaydı — gün+kod ile anahtarlanır (istek nesnesi cache'le PAYLAŞILDIĞI
// için oraya YAZILMAZ; yoksa yeni oyunda eski sorgular açık gelirdi).
function medulaKey(code) { return game.dayNumber + ":" + code; }
function medulaIsRevealed(code) { return !!game.medulaRevealed[medulaKey(code)]; }
function medulaReveal(code) { game.medulaRevealed[medulaKey(code)] = true; }

// --- MEDULA KODU ---
// 6 karakter, DAİMA "2" ile başlar. Alfabe TAM: 0-9 + A-Z (36 karakter) — klavyede eksik
// tuş kalmasın diye karıştırılabilir karakterler de dahil edildi.
const MEDULA_ALPHABET = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
function makeMedulaCode() {
  let out = "2";
  for (let i = 1; i < CONFIG.medulaCodeLen; i++) out += MEDULA_ALPHABET.charAt(rand(MEDULA_ALPHABET.length));
  return out;
}

// Karıştırma yardımcısı (semptom kategorisi seçiminde ve Medula kodunda kullanılır)
function shuffledCopy(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

// reçete üret (gerçek/sahte + kusurlar). fakeForce: true/false => zorla; undefined => rastgele
function makePrescription(fakeForce, fakeChance) {
  const count = CONFIG.minPrescriptionItems +
    rand(CONFIG.maxPrescriptionItems - CONFIG.minPrescriptionItems + 1);
  const pool = MEDICINES.slice();
  const items = [];
  for (let i = 0; i < count && pool.length; i++) {
    const m = pool.splice(rand(pool.length), 1)[0];
    // adet dağılımı — yüksek adet NORMAL bir reçete özelliği (sahtelikle ilgisi yok)
    const roll = rng();
    const qty = roll < 0.70 ? 1 : roll < 0.90 ? 2 : roll < 0.97 ? 3 : pick([4, 5, 6]);
    items.push({ id: m.id, qty });
  }

  const chance = (fakeChance === undefined) ? CONFIG.fakeChance : fakeChance;
  const fake = (fakeForce === undefined) ? (rng() < chance) : !!fakeForce;
  const flaws = [];
  if (fake) {
    // Sahte reçetenin EN AZ BİR kusuru kağıda bakarak doğrulanabilir olmalı.
    // "conflict" (uyku ilacı + enerji takviyesi bir arada) oyunun hiçbir yerinde
    // öğretilmiyor: doktor gerçek, kaşe var, imza düzgün, adetler ×1 → oyuncu için
    // görünmez bir kusurdu ve tek kusur olarak çıkabiliyordu. Artık yalnız EK kusur.
    const detectable = DETECTABLE_FLAWS.slice();
    for (let i = detectable.length - 1; i > 0; i--) { const j = rand(i + 1); [detectable[i], detectable[j]] = [detectable[j], detectable[i]]; }
    flaws.push(detectable[0]);        // garanti: tespit edilebilir 1 kusur
    if (rand(2) === 0) {              // %50 ihtimalle 2. kusur (ince kusur da olabilir)
      const rest = detectable.slice(1).concat(SUBTLE_FLAWS);
      flaws.push(rest[rand(rest.length)]);
    }
  }

  // varsayılan (gerçek) üst bilgi
  let doc = pickKnownDoctor();
  let doctor = doc.name, sig = doc.sig;
  let date = dateRx(0);               // güncel tarih
  let hasStamp = true, expired = false;

  // kusurları uygula
  if (flaws.includes("conflict")) {
    const sleepIds = MEDICINES.filter(m => m.group === "uyku_sinir").map(m => m.id);
    const energyIds = ["med_b12guc", "med_dvitamin", "cvitamin"].filter(id => getMedicine(id));
    items.length = 0;
    items.push({ id: pick(sleepIds), qty: 1 });
    items.push({ id: pick(energyIds), qty: 1 });
  }
  if (flaws.includes("fake_doctor")) { const f = pick(FAKE_DOCTORS); doctor = f.name; sig = f.sig; }
  if (flaws.includes("expired")) { expired = true; date = dateRx(-183); }  // ~6 ay önce
  if (flaws.includes("no_stamp")) { hasStamp = false; }
  if (flaws.includes("bad_signature")) { sig = pick(["???", "—", ""]); }

  return { type: "prescription", items, fake, flaws, doctor, sig, date, hasStamp, expired };
}

// --- SEMPTOMLU HASTA İSTEĞİ ---
// 1-3 kalem; her kalem FARKLI kategoriden (oyuncu birden çok sekmeye gitmek zorunda kalsın).
// Adet semptomlu hastada 1 veya 2 ile sınırlı.
function trLower1(str) { return str.charAt(0).toLocaleLowerCase("tr") + str.slice(1); }

// Doğal Türkçe cümle — her kombinasyon için şablon yazmak yerine 2-3 kalıptan kurulur.
function buildSymptomLine(items) {
  const L = items.map(it => it.symptom.label);
  if (items.length === 1) {
    if (items[0].qty === 2) return L[0] + ", iki kutu alayım.";
    return pick([L[0] + ".", L[0] + ", bir şey verir misiniz?", L[0] + ", ne önerirsiniz?"]);
  }
  if (items.length === 2) {
    return pick([
      "Hem " + trLower1(L[0]) + " hem " + trLower1(L[1]) + ", ikisine de bakar mısınız?",
      L[0] + ", ayrıca " + trLower1(L[1]) + ". İkisi için de lazım.",
      L[0] + " bir de " + trLower1(L[1]) + ", ikisini de alayım."
    ]);
  }
  return pick([
    L[0] + ", " + trLower1(L[1]) + ", bir de " + trLower1(L[2]) + ". Üçüne de bakar mısınız?",
    "Hem " + trLower1(L[0]) + " hem " + trLower1(L[1]) + " hem de " + trLower1(L[2]) + ", hepsine bir şey lazım."
  ]);
}

function makeSymptomRequest() {
  const roll = rng();
  const n = roll < 0.60 ? 1 : roll < 0.90 ? 2 : 3;   // %60 / %30 / %10
  // farklı KATEGORİLERDEN seç: önce kategorileri karıştır, sonra her birinden bir semptom
  const cats = shuffledCopy(SYMPTOM_CATEGORIES);
  const items = [];
  for (let i = 0; i < n && i < cats.length; i++) {
    const pool = SYMPTOMS.filter(x => x.category === cats[i]);
    if (!pool.length) continue;
    const qty = rng() < 0.20 ? 2 : 1;               // ara sıra "iki kutu"
    items.push({ symptom: pick(pool), qty });
  }
  return {
    type: "symptom",
    items,
    symptom: items[0].symptom,        // geriye uyum: tek kalemli yollar ve emoji
    line: buildSymptomLine(items)
  };
}

// Çok kalemli semptom hastası daha uzun bekler: tek ilaç isteyenle aynı sürede
// beklemek haksızlık — oyuncunun birden çok sekmeye gitmesi gerekiyor.
// 1 kalem ×1, 2 kalem ×1.25, 3 kalem ×1.5. Reçete ve Medula hastalarına uygulanmaz.
function symptomPatienceMul(request) {
  // Dilencinin sabrı ayrı çarpanla ölçeklenir (normal hastadan kısa)
  if (request && isBeggarType(request.type)) return CONFIG.beggarPatienceMul;
  if (!request || request.type !== "symptom") return 1;
  const n = (request.items || []).length;
  return n >= 3 ? 1.5 : n === 2 ? 1.25 : 1;
}

// semptomlu hastanın istediği KATEGORİ çoklu-kümesi (adet dahil, id tekrarlı liste kalıbı)
function expectedCategoryList(request) {
  const out = [];
  for (const it of (request.items || [{ symptom: request.symptom, qty: 1 }])) {
    for (let i = 0; i < it.qty; i++) out.push(it.symptom.category);
  }
  return out;
}

// tek hasta nesnesi üret (kuyruğa EKLEMEZ). opts: {forcePrescription, forceFake}
// Gün listesi bunu seed altında toplu çağırır; cheat'ler tek tek çağırır.
// Medula (e-reçete) isteği — kağıt YOK, kod var. ASLA sahte değildir: sahtelik kontrolü,
// doktor defteri ve kusur mantığı bu hastada hiç çalışmaz.
function makeMedulaRequest() {
  const count = CONFIG.minPrescriptionItems +
    rand(CONFIG.maxPrescriptionItems - CONFIG.minPrescriptionItems + 1);
  const pool = MEDICINES.slice();
  const items = [];
  for (let i = 0; i < count && pool.length; i++) {
    const m = pool.splice(rand(pool.length), 1)[0];
    const roll = rng();
    const qty = roll < 0.70 ? 1 : roll < 0.90 ? 2 : roll < 0.97 ? 3 : pick([4, 5, 6]);
    items.push({ id: m.id, qty });
  }
  return { type: "medula", items, code: makeMedulaCode(), fake: false };
}

// opts: {forcePrescription, forceFake, forceMedula, night}
function makePatient(opts) {
  opts = opts || {};
  const night = !!opts.night;
  const avatarDef = pick(availableAvatars());
  const day = genDay();
  // Reçeteli payı VİTRİN seviyesiyle yükselir (semptomlu payı vitrinSymptomFloor'da korunur)
  const isPrescription = opts.forcePrescription ? true : (rng() < effPrescriptionChance());

  let request;
  if (isPrescription) {
    // Terminal açıksa reçeteli hastaların bir kısmı kağıt yerine Medula kodu getirir.
    // forceFake verilmişse (garanti mekanizması) Medula'ya çevrilmez — Medula sahte olamaz.
    const medula = opts.forceMedula ||
      (medulaUnlocked() && opts.forceFake === undefined && rng() < CONFIG.medulaPatientRatio);
    if (medula) request = makeMedulaRequest();
    // gece: sahte reçete girişimi artar (tavanla sınırlı)
    else request = makePrescription(opts.forceFake,
      (night ? nightFakeChance(day) : fakeChanceFor(day)) * vitrinFakeDilution());
  } else {
    request = makeSymptomRequest();
  }

  return {
    avatar: avatarDef.emoji,
    avatarKey: avatarDef.assetKey,
    request,
    line: request.type === "prescription" ? pick(PRESCRIPTION_LINES)
        : request.type === "medula" ? pick(MEDULA_LINES) : request.line,   // balon repliği (üretimde sabitlenir)
    decided: null,            // reçeteliler için: null | "approve" | "reject"
    maxPatience: CONFIG.basePatience,   // taban; enqueuePatient güncel seviyeyle ezer
    patience: CONFIG.basePatience,
    enterT: 0,
    posCurrent: 0,            // kuyruğa girerken ayarlanır
    bonus: false,             // true => cheat ile enjekte, günün programı dışında
    night: night              // true => günün NÖBET bölümüne ait
  };
}

// hastayı kuyruğa al (giriş animasyonu + sayaç). Program dışı (bonus) hastalar sayılmaz.
function enqueuePatient(patient) {
  // Sabır sahneye çıkış anındaki Bekleme Alanı seviyesine göre kurulur (gün ortasında
  // yükseltme yapılırsa sonraki hastalar hemen faydalanır). Çarpanlar BİRBİRİYLE ÇARPILIR,
  // biri diğerinin yerine geçmez: geliştirme × nöbet × kalem sayısı.
  patient.maxPatience = effPatience()
    * (patient.night ? CONFIG.nightPatienceMultiplier : 1)
    * symptomPatienceMul(patient.request);
  patient.patience = patient.maxPatience;
  assignDialog(patient);                           // ağız + duruma göre söz (kozmetik; dengeye dokunmaz)
  patient.posCurrent = game.queue.length + 0.85;   // sağdan kayarak girsin
  game.queue.push(patient);
  if (!patient.bonus) game.daySpawned++;
}

// Sıradaki hastayı sahneye çıkar.
// opts YOKSA: günün ÖNCEDEN ÜRETİLMİŞ listesinden sıradakini çeker (hedef bu listeden hesaplandı).
// opts VARSA: cheat enjeksiyonu — anlık üretilir, bonus işaretlenir, hedefe/sayaca karışmaz.
function spawnPatient(opts) {
  if (game.queue.length >= effMaxQueue()) return;

  if (opts) {
    const p = makePatient(opts);
    p.bonus = true;
    enqueuePatient(p);
    return p;
  }

  const sch = game.daySchedule;
  if (!sch || game.dayScheduleIdx >= sch.patients.length) return;
  // Nöbet günü: gündüz bölümü bitene kadar gece müşterileri kapıda bekler (beginNightShift açar).
  // Eskiden gündüzün son müşterileri sırada beklerken gece müşterileri gündüz içeri giriyordu.
  if (game.phase === "day" && sch.nightN > 0 && game.dayScheduleIdx >= sch.dayN) return;
  const p = sch.patients[game.dayScheduleIdx++];
  enqueuePatient(p);
  return p;
}

// aktif hastanın beklediği ilaç çoklu-kümesi (adetli => id tekrarlı liste)
function expectedMedicineIds() {
  const p = activePatient();
  if (!p) return [];
  if (isBeggarType(p.request.type)) return [];   // dilencinin "beklediği ilaç" listesi yok
  if (p.request.type === "prescription" || p.request.type === "medula") {
    const out = [];
    for (const it of p.request.items) for (let i = 0; i < it.qty; i++) out.push(it.id);
    return out;
  }
  // Semptomlu hasta: kategoride birden çok ilaç doğru kabul edilir, tek "doğru liste" yok.
  // Burada TEMSİLİ bir doğru cevap döndürülür (her kalem için o kategorinin ilk ilacı, adetli);
  // gerçek karar checkOrder içinde KATEGORİ çoklu-kümesi karşılaştırmasıyla verilir.
  const out = [];
  for (const it of (p.request.items || [{ symptom: p.request.symptom, qty: 1 }])) {
    const m = MEDICINES.find(x => x.category === it.symptom.category);
    if (m) for (let i = 0; i < it.qty; i++) out.push(m.id);
  }
  return out;
}

// iki listeyi çoklu-küme olarak karşılaştır (sıra önemsiz, adet önemli)
function sameMultiset(a, b) {
  if (a.length !== b.length) return false;
  const m = {};
  for (const x of a) m[x] = (m[x] || 0) + 1;
  for (const x of b) { if (!m[x]) return false; m[x]--; }
  return true;
}

// reçeteli hasta henüz ONAYLA/REDDET kararı bekliyor mu?
function activeNeedsDecision() {
  const p = activePatient();
  // Medula hastasında sahtelik incelemesi YOKTUR — ONAYLA/REDDET fazı hiç çalışmaz.
  return !!(p && !game.feedback && p.request.type === "prescription" && !p.decided);
}
// ilaç seçip servis edilebilir mi? (semptom => evet; reçete => onaylanmışsa)
function servingAllowed() {
  const p = activePatient();
  if (!p || game.feedback) return false;
  // Dilencinin kendi üç butonu var: raf/sepet/SATIŞ yolu onda hiç çalışmaz.
  if (isBeggarType(p.request.type)) return false;
  if (p.request.type === "prescription") return p.decided === "approve";
  return true;
}

function approvePrescription() {
  const p = activePatient();
  if (!activeNeedsDecision() || p.request.type !== "prescription") return;
  p.decided = "approve";          // ilaç verme moduna geç
  game.counter = [];
}

function rejectPrescription() {
  const p = activePatient();
  if (!activeNeedsDecision() || p.request.type !== "prescription") return;
  p.decided = "reject";
  game.dayStats.served++;
  if (p.request.fake) {
    // doğru yakalama
    game.money += CONFIG.fakeCatchBonus;
    addDayMoney(CONFIG.fakeCatchBonus);
    game.dayStats.correct++;
    game.dayStats.fakeCaught++;      // sezon kartı: YAKALANAN sahte
    gainReputation(CONFIG.fakeCatchRepGain);
    game.feedback = { ok: true, angry: false, text: "✓ Sahte reçete yakaladın!  +" + CONFIG.fakeCatchBonus + "₺", t: 0 };
    patientReact(p, "caught");
    sfx("coin");
    explainDecision(p, [], "DOĞRU", "sahte reçete reddedildi (+" + CONFIG.fakeCatchBonus + "₺)");
  } else {
    // gerçeği boşuna reddetti
    game.dayStats.wrong++;
    game.feedback = { ok: false, angry: false, text: "Müşteriyi boşuna çevirdin", t: 0 };
    patientReact(p, "wrongReject");
    explainDecision(p, [], "YANLIŞ", "geçerli reçete reddedildi (satış kaybı + itibar)");
    loseReputation(CONFIG.wrongRejectRepLoss);
  }
}

// kısa uyarı toast'u — game.feedback'i EZMEZ (ayrı, süreli flash)
function flashStockToast(txt) {
  game.stockToast = { text: txt, until: game.clock + CONFIG.stockToastDuration };
}

// --- SEPET ---
// game.counter DEĞİŞMEDİ: hâlâ düz id listesi (aynı ilaç birden çok kez geçer).
// checkOrder / sameMultiset / expectedMedicineIds bu biçime bağlı olduğu için eşleşme
// mantığına hiç dokunulmadı — değişen yalnız sepetin nasıl doldurulup gösterildiği.
function cartCount(id) {
  let n = 0;
  for (const cId of game.counter) if (cId === id) n++;
  return n;
}
// Sepeti (id, adet) satırlarına indirger — ekleme SIRASI korunur (SATIŞ ekranı bunu çizer).
function cartRows() {
  const order = [], byId = {};
  for (const id of game.counter) {
    if (!(id in byId)) { byId[id] = 0; order.push(id); }
    byId[id]++;
  }
  return order.map(id => ({ id, qty: byId[id], med: getMedicine(id) }));
}

// Rafa dokunuş: STOK KONTROL EDİLİR ama DÜŞÜLMEZ. Gerçek stok düşümü yalnız
// checkOrder içinde, SERVİS ET anında olur — sepet boşaltılırsa hiçbir stok kaybı olmaz.
function tapMedicine(id) {
  if (!servingAllowed()) return;
  const stock = game.stock[id] || 0;
  const m = getMedicine(id);
  if (stock <= 0) { flashStockToast("⛔ " + (m ? m.name : "İlaç") + " — Stok yok!"); return; }
  if (cartCount(id) >= stock) { flashStockToast("⛔ " + (m ? m.name : "İlaç") + " — Stok yetersiz!"); return; }
  game.counter.push(id);
  return true;                      // çağıran uçuş animasyonunu bu dönüşe göre başlatır
}

// SATIŞ ekranındaki − / + . delta +1 stok tavanına takılır; adet 0'a inince satır düşer.
function cartChange(id, delta) {
  if (delta > 0) { tapMedicine(id); return; }
  const idx = game.counter.lastIndexOf(id);
  if (idx >= 0) game.counter.splice(idx, 1);
}
function clearCart() { game.counter = []; }

// Gün/oyun geçişlerinde ve oyun bitiminde geçici animasyonları söndür.
// KRİTİK: yarım kalmış bir bagAnim, gün değişince checkOrder()'ı BAŞKA bir hastaya
// uygulardı (kuyruk sıfırlanmış olur). Geçişin parçası olarak mutlaka sıfırlanmalı.
function resetTransientAnims() {
  game.bagAnim = null;
  game.flyAnims = [];
}

// --- Ecza deposu (PC sipariş ekranı) ---
function openDepot() {
  if (!game.depotGroup) { const g = groupsWithMeds()[0]; game.depotGroup = g ? g.id : null; }
  game.depotPending = {};      // sepet her açılışta temiz
  game.depotOpen = true;
  game.pcScreen = "depot";
}
// SATIŞ ekranı: seçilen ilaçların onayı ve adet düzenlemesi. Hizmet anının parçası
// olduğu için oyunu DONDURMAZ (bkz. pcFreezesGame).
function openSale() {
  game.depotPending = {};
  game.depotOpen = true;
  game.pcScreen = "sale";
}
// SATIŞ ekranı açık mı? (sabır/spawn akışı bu ekranda devam eder)
function isSaleOpen() { return game.depotOpen && game.pcScreen === "sale"; }
// PC paneli oyunu donduruyor mu? SATIŞ hariç hepsi dondurur — depo, geliştirme ve
// Medula ekranları hizmet anının parçası değil, oyuncu orada zaman baskısı hissetmemeli.
function pcFreezesGame() { return game.depotOpen && game.pcScreen !== "sale"; }

// PC'ye dokununca: doğrudan depo değil, dört butonlu ANA EKRAN
function openPc() {
  game.depotPending = {};
  game.depotOpen = true;
  game.pcScreen = "home";
}
function openUpgrades() {
  game.depotPending = {};      // depo sepetini taşıma
  game.depotOpen = true;
  game.pcScreen = "upgrades";
}
// NOT: girilen kod BURADA TEMİZLENMEZ — oyuncu koda tekrar bakmak için PC'yi kapatıp
// açtığında yazdıkları durmalı. Temizlenme yalnız şurada olur: başarılı sorgu,
// "Kayıt bulunamadı", SİL tuşu, gün değişimi ve yeni oyun.
function openMedulaScreen() {
  game.depotPending = {};
  game.depotOpen = true;
  game.pcScreen = "medula";
}
// SERVİS ET (SATIŞ ekranı): panel kapanır, tezgahta poşet belirip hastaya kayar,
// uçuş bitince update() checkOrder()'ı çağırır — karar/ekonomi/itibar mantığı
// DEĞİŞMEDİ, yalnız araya kısa bir görsel gecikme girdi.
function serveFromSale() {
  if (!servingAllowed() || game.counter.length === 0) return;
  game.depotOpen = false;
  game.pcScreen = "home";
  game.flyAnims = [];
  game.bagAnim = { t: 0 };
}

function pcHome() { game.depotPending = {}; game.pcScreen = "home"; }
function closeDepot() { game.depotOpen = false; game.depotPending = {}; game.pcScreen = "home"; }

// sepetteki adedi değiştir: 0..(maxStock - mevcut stok) aralığına clamp
function changePending(id, delta) {
  const cur = game.depotPending[id] || 0;
  const maxAdd = Math.max(0, effMaxStock() - (game.stock[id] || 0));
  game.depotPending[id] = clamp(cur + delta, 0, maxAdd);
}

// sepet toplamı (₺) — ilaç bazında alış fiyatı (cost) üzerinden
// Depo BİRİM fiyatı: güncel alış × Toptancı indirimi. Depo ekranı ve sipariş toplamı
// bunu okur; oyunun geri kalanı (C, yanlış servis zararı, dilencinin ilaç değeri)
// indirimsiz medCost'u okumaya devam eder.
function depotUnitCost(m) {
  return Math.max(1, Math.round(medCost(m) * (1 - effDepotDiscount())));
}
function depotOrderTotal() {
  let sum = 0;
  for (const id in game.depotPending) {
    const q = game.depotPending[id];
    if (!q) continue;
    const m = getMedicine(id);
    if (m) sum += depotUnitCost(m) * q;
  }
  return sum;
}

// tüm bekleyen siparişleri tek seferde uygula (para düşer, stoklar artar, sepet sıfırlanır)
function placeDepotOrder() {
  const total = depotOrderTotal();
  if (total <= 0 || game.money < total) return;
  game.money -= total;
  for (const id in game.depotPending) {
    const q = game.depotPending[id];
    if (!q) continue;
    game.stock[id] = Math.min(effMaxStock(), (game.stock[id] || 0) + q);
  }
  game.depotPending = {};
}

// --- Geliştirme satın alma ---
// Kasadan düşer, kasa negatife inemez. Vitrin seviyesi gün üretimini etkilediği için
// önden üretilmiş günler geçersiz kılınır (oynanan gün snapshot'tan okunduğu için değişmez).
function buyUpgrade(id) {
  const u = UPGRADE_BY_ID[id];
  if (!u) return false;
  const cur = upgradeLevel(id);
  if (cur >= u.maxLevel) return false;              // TAM — satın alınamaz
  if (!upgradeUnlocked(id)) return false;           // sezon kilidi
  const cost = upgradeCost(id, cur + 1);
  if (game.money < cost) return false;              // yetersiz bakiye
  game.money -= cost;
  game.upgrades[id] = cur + 1;
  // Vitrin hasta KARIŞIMINI (reçeteli payı), Medula ise reçeteli hastaların tipini
  // değiştirir => önden üretilmiş günler geçersizleşir. Oynanan gün snapshot'tan
  // okunduğu için etkilenmez.
  // Vitrin hasta karışımını, Medula hasta tipini, Nöbet Ruhsatı ise gece CİROSUNU
  // (dolayısıyla R ve hedefi) değiştirir => önden üretilmiş günler geçersizleşir.
  if (id === "vitrin" || id === "medula" || id === "nobet") invalidateDaySchedules();
  return true;
}

// --- MEDULA SORGUSU ---
// Kod KUYRUKTAKİ hastalar arasında aranır (gelmemiş hastanın kodunu oyuncu zaten bilemez).
// Bulunursa kayıt açılır ve o hasta için kalıcı olur; bulunmazsa giriş temizlenir.
function medulaSubmit() {
  const code = game.medulaInput;
  if (code.length !== CONFIG.medulaCodeLen) return;
  const hit = game.queue.find(p => p.request.type === "medula" && p.request.code === code);
  if (!hit) {
    game.medulaResult = { error: "Kayıt bulunamadı" };
    game.medulaInput = "";
    return;
  }
  medulaReveal(code);                       // zaten girilmişse de sorun değil, yine gösterilir
  game.medulaResult = { code: code, items: hit.request.items.slice() };
  game.medulaInput = "";
}
function medulaKeyPress(ch) {
  if (game.medulaInput.length >= CONFIG.medulaCodeLen) return;
  game.medulaInput += ch;
  if (game.medulaResult && game.medulaResult.error) game.medulaResult = null;
}
function medulaBackspace() { game.medulaInput = game.medulaInput.slice(0, -1); }

// --- TEŞHİS: her servis/red kararında tek okunabilir blok ---
// countList: ["a","a","b"] -> "a×2, b×1" (ilaç ADI ile, id de parantezde)
function fmtCounts(ids) {
  if (!ids || !ids.length) return "(boş)";
  const order = [], n = {};
  for (const id of ids) { if (!(id in n)) { n[id] = 0; order.push(id); } n[id]++; }
  return order.map(id => {
    const m = getMedicine(id);
    return (m ? m.name : "?") + "×" + n[id] + " [" + id + "]";
  }).join(", ");
}

function explainDecision(p, given, verdict, reason) {
  if (!CONFIG.debugDecisions || !p) return;
  const r = p.request;
  const L = [];
  L.push("── KARAR · Gün " + game.dayNumber + " · " + (p.bonus ? "BONUS hasta (cheat)" : "programlı hasta"));
  if (r.type === "medula") {
    const need = [];
    for (const it of r.items) for (let i = 0; i < it.qty; i++) need.push(it.id);
    L.push("   tip      : MEDULA (e-reçete) · kod " + r.code + " · sorgulandı: " + (medulaIsRevealed(r.code) ? "evet" : "hayır"));
    L.push("   istenen  : " + fmtCounts(need));
    L.push("   verilen  : " + fmtCounts(given));
    L.push("   not      : Medula reçetesi asla sahte değildir; sahtelik/doktor kontrolü çalışmaz.");
    L.push("   ödeme    : gün kazancına BUGÜN, kasaya gün " + (game.dayNumber + CONFIG.medulaPayDelayDays) + "'de");
  } else if (r.type === "prescription") {
    const need = [];
    for (const it of r.items) for (let i = 0; i < it.qty; i++) need.push(it.id);
    L.push("   tip      : reçete" + (r.fake ? " (SAHTE)" : " (gerçek)") + " · karar: " + (p.decided || "—"));
    L.push("   istenen  : " + fmtCounts(need));
    L.push("   verilen  : " + fmtCounts(given));
    const known = KNOWN_DOCTORS.some(d => d.name === r.doctor);
    L.push("   doktor   : " + JSON.stringify(r.doctor) + " → defterde " + (known ? "VAR" : "YOK"));
    const today = dateRx(0);
    L.push("   kusurlar : " +
      "doktor " + (known ? "✓" : "✗") +
      " | kaşe " + (r.hasStamp === false ? "✗ (yok)" : "✓") +
      " | imza " + ((r.sig === "???" || r.sig === "—" || r.sig === "") ? "✗ " + JSON.stringify(r.sig) : "✓ " + JSON.stringify(r.sig)) +
      " | doz " + Math.max.apply(null, r.items.map(it => it.qty)) + " (kusur değil) " +
      " | tarih " + (r.expired ? "✗" : "✓") + " (reçete " + r.date + " ↔ oyun " + today + ")");
    L.push("   iç bayrak: fake=" + r.fake + " flaws=[" + (r.flaws || []).join(", ") + "]");
    L.push("   tespit edilebilir kusur: " + (detectableFlawsOf(r).join(" · ") || "(yok)"));
  } else {
    const items = r.items || [{ symptom: r.symptom, qty: 1 }];
    L.push("   tip      : semptom · " + items.length + " kalem · " + JSON.stringify(r.line || ""));
    for (const it of items) {
      const cands = MEDICINES.filter(m => m.category === it.symptom.category);
      L.push("     · " + JSON.stringify(it.symptom.label) + " ×" + it.qty +
        " [" + it.symptom.category + "] → kabul: " + cands.map(m => m.name).join(", "));
    }
    L.push("   istenen kategoriler: " + expectedCategoryList(r).join(", "));
    L.push("   verilen  : " + fmtCounts(given));
    L.push("   verilen kategoriler: " + given.map(id => { const m = getMedicine(id); return m ? m.category : "?"; }).join(", "));
  }
  L.push("   SONUÇ    : " + verdict + " — " + reason);
  console.log(L.join("\n"));
}

// --- SGK ALACAK DEFTERİ ---
// Medula satışının parası kasaya GECİKMELİ girer. Günün kazanç sayacına (hedefin ölçüldüğü
// dayStats.money) hizmet günü yazılır — hedef formülü, R ve missCost hiç etkilenmez.
function addReceivable(amount) {
  if (!(amount > 0)) return;
  const due = game.dayNumber + CONFIG.medulaPayDelayDays;
  const row = game.receivables.find(r => r.dueDay === due);
  if (row) row.amount += amount;
  else game.receivables.push({ dueDay: due, amount: amount });
  game.medulaBooked += amount;
}

// Defter bütünlüğü: deftere yazılan toplam === kasaya giren + hâlâ bekleyen.
// Bir kuruş kaybolursa/iki kez sayılırsa burada yakalanır.
function verifyMedulaLedger() {
  const diff = game.medulaBooked - (game.medulaCollected + pendingReceivables());
  if (Math.abs(diff) > 0.5) {
    console.warn("[medula] Alacak defteri tutmuyor: yazılan " + Math.round(game.medulaBooked) +
      "₺ ≠ yatan " + Math.round(game.medulaCollected) + "₺ + bekleyen " + pendingReceivables() +
      "₺ (fark " + Math.round(diff) + "₺)");
    return false;
  }
  return true;
}

// Gün başında o güne (ve geçmişe kalmışsa ona) düşen alacakları kasaya aktar.
function collectReceivables() {
  let total = 0;
  game.receivables = game.receivables.filter(r => {
    if (r.dueDay <= game.dayNumber) { total += r.amount; return false; }
    return true;
  });
  game.collectedToday = Math.round(total);
  if (game.collectedToday > 0) {
    game.money += game.collectedToday;
    game.medulaCollected += game.collectedToday;
    flashInfoToast("🏦 SGK ödemesi yattı: +" + formatMoney(game.collectedToday));
  }
  verifyMedulaLedger();
  return game.collectedToday;
}
function pendingReceivables() {
  let t = 0;
  for (const r of game.receivables) t += r.amount;
  return Math.round(t);
}

// Fiyat turu olan günün başında kısa bilgi şeridi. SGK şeridiyle AYNI kanalı kullanır ve
// bilinçli olarak ondan SONRA yazılır: çakışırsa fiyat haberi kazanır, çünkü fiyat bugün
// karar gerektirir. Kaybolan SGK bilgisi kaybolmuş değil — gün sonu kartında satır olarak
// duruyor (game.collectedToday).
function announcePriceUpdate() {
  const r = priceRoundOn(game.dayNumber);
  if (!r) return;
  flashInfoToast("💱 Fiyatlar güncellendi: " + priceRoundLabel(r));
}

// bilgi şeridi — stok uyarısından ayrı kanal (birbirini ezmezler)
function flashInfoToast(txt) {
  game.infoToast = { text: txt, until: game.clock + CONFIG.medulaToastDuration };
}

// Günlük kazanç sayacına yaz — aktif bölüme (gündüz/gece) de ayrı işlenir.
function addDayMoney(delta) {
  game.dayStats.money += delta;
  if (game.phase === "night") game.dayStats.moneyNight += delta;
  else game.dayStats.moneyDay += delta;
}

function checkOrder() {
  const p = activePatient();
  if (!servingAllowed() || !p) return;
  if (game.counter.length === 0) return;

  // onaylanmış SAHTE reçeteye ilaç verme => ağır ceza (ilaç doğru olsa bile)
  if (p.request.type === "prescription" && p.request.fake) {
    game.dayStats.served++;
    game.dayStats.wrong++;
    game.dayStats.fakeMissed++;      // sezon kartı: KAÇAN sahte (ilaç verildi)
    game.money = Math.max(0, game.money - CONFIG.fakeApproveMoneyPenalty);
    addDayMoney(-CONFIG.fakeApproveMoneyPenalty);
    game.feedback = { ok: false, angry: false, text: "⚠️ Sahte reçeteye ilaç verdin!  -" + CONFIG.fakeApproveMoneyPenalty + "₺", t: 0 };
    patientReact(p, "sly");
    sfx("wrong");
    explainDecision(p, game.counter.slice(), "YANLIŞ", "reçete SAHTE — ilaçlar doğru olsa bile onaylamak hatalı");
    loseReputation(CONFIG.fakeApproveRepLoss);
    return;
  }

  const expected = expectedMedicineIds();
  const given = game.counter.slice();

  let correct = false;
  if (p.request.type === "prescription" || p.request.type === "medula") {
    correct = sameMultiset(expected, given);   // doğru ilaçlar + doğru adet
  } else {
    // Semptomlu hasta: verilen ilaçların KATEGORİ çoklu-kümesi, istenen semptomların
    // kategori çoklu-kümesiyle birebir eşleşmeli (aynı sameMultiset kalıbı, id yerine kategori).
    const wantCats = expectedCategoryList(p.request);
    const gotCats = given.map(id => { const m = getMedicine(id); return m ? m.category : "?"; });
    correct = sameMultiset(wantCats, gotCats);
  }

  game.dayStats.served++;
  if (correct) {
    // stok tüketimi — verilen her ilaç stoktan düşer (negatife inmez; ekleme zaten stokla sınırlı)
    for (const gid of given) game.stock[gid] = Math.max(0, (game.stock[gid] || 0) - 1);
    // kazanç = servis edilen ilaçların satış fiyatı toplamı (adet dahil; given id tekrarlı liste)
    let earn = 0;
    for (const gid of given) { const gm = getMedicine(gid); if (gm) earn += medPrice(gm); }
    if (p.night) earn = Math.round(earn * effNightPriceMul());   // nöbet farkı (Medula'ya da uygulanır)
    if (p.request.type === "medula") {
      // SGK ödemesi GECİKMELİ: günün kazancına BUGÜN yazılır (hedef ölçümü değişmez),
      // kasaya medulaPayDelayDays gün sonra girer.
      addReceivable(earn);
      game.dayStats.medulaAccrued += earn;
    } else {
      game.money += earn;
    }
    addDayMoney(earn);
    game.dayStats.correct++;
    gainReputation(CONFIG.repGainCorrect);
    sfx("kasa");                                        // doğru satış: yazar kasa
    game.feedback = p.request.type === "medula"
      ? { ok: true, angry: false, text: "✓ Meluda kaydı işlendi!  +" + earn + "₺ (SGK, gün " + (game.dayNumber + CONFIG.medulaPayDelayDays) + ")", t: 0 }
      : { ok: true, angry: false, text: "✓ Teşekkürler!  +" + earn + "₺", t: 0 };
    patientReact(p, "thanks");
    explainDecision(p, given, "DOĞRU", "istenen ilaç(lar) tam eşleşti (+" + earn + "₺)");
  } else {
    // yanlış ilaç: kutu açıldı sayılır — stok düşer, para GELMEZ, üstüne o ilaçların
    // alış maliyeti (cost) zarar olarak yazılır.
    let loss = 0;
    for (const gid of given) {
      game.stock[gid] = Math.max(0, (game.stock[gid] || 0) - 1);
      const gm = getMedicine(gid);
      if (gm) loss += medCost(gm);
    }
    loss = Math.round(loss);
    game.money = Math.max(0, game.money - loss);
    addDayMoney(-loss);
    game.dayStats.wrong++;
    game.feedback = { ok: false, angry: false, text: "✗ Yanlış ilaç!  -" + loss + "₺", t: 0 };
    patientReact(p, "wrong");
    sfx("wrong");
    explainDecision(p, given, "YANLIŞ",
      (p.request.type === "prescription" || p.request.type === "medula")
        ? "kalem/adet eşleşmedi (istenen ile verilen farklı)"
        : "verilen ilaçların kategorileri istenen semptomlarla eşleşmedi");
    loseReputation(CONFIG.repLossWrong);
  }
}

// feedback bitince aktif hasta çıkar (tamamlandı), sıra kayar; hedef dolduysa gün biter
function onFeedbackEnd() {
  // feedback bitiminde oyun bittiyse kuyruk kaydırma / yeni gün mantığı çalışmaz
  if (game.state === STATE.SEASONEND) { game.feedback = null; return; }
  const done = game.queue.shift();
  game.counter = [];
  game.feedback = null;
  if (done && done.bonus) {                // dilenci / borçlu / cheat hastası: programa sayılmaz
    // günün son müşterisinden sonra sırada bekleyen dilenci de görüldükten SONRA gün biter
    if (game.dayCompleted >= patientsForDay() && !game.queue.length) endDay();
    return;
  }
  game.dayCompleted++;
  const sch = game.daySchedule;
  // gündüz bölümü bitti ve o gün nöbetçiyse: DAYEND'e gitme, gece bölümüne geç
  if (sch && game.phase === "day" && sch.nightN > 0 && game.dayCompleted >= sch.dayN) {
    beginNightShift();
    return;
  }
  if (game.dayCompleted >= patientsForDay()) {
    if (game.queue.some(q => q.bonus)) return;   // sırada dilenci/borçlu var: önce o (gün sonra biter)
    endDay();
  }
}

// Gündüz bitti → NÖBET bölümü. Kuyruk boş, kısa geçiş kartı, sahne kararır.
function beginNightShift() {
  game.phase = "night";
  game.nightIntro = 0;                       // geçiş kartı açılır (tap ya da süreyle kapanır)
  game.spawnTimer = CONFIG.spawnInterval;    // gece ilk hasta hemen dalmasın
}

// Üst üste `streak` gün hedef kaçtığında o günün itibar cezası.
// grace kadarı bedava; sonrası adım adım artar, tavanda durur.
function goalMissPenaltyFor(streak) {
  const over = streak - CONFIG.goalMissGraceDays;
  if (over <= 0) return 0;
  return Math.min(CONFIG.goalMissRepMax, over * CONFIG.goalMissRepStep);
}

function endDay() {
  game.feedback = null;
  const goal = goalForDay();
  const met = game.dayStats.money >= goal;
  // Hedef tutan gün itibar kazandırır (tavan korunur => zaten 100'deyse kazanç 0 olur).
  // Kaçıran gün CEZA ALMAZ. Buraya konması cheat ile atlanan günlerde de tutarlı çalışmasını
  // sağlar: skipDay da endDay üzerinden geçer.
  // yumuşak tavan yüzünden fiilen eklenen değer repGain'e yazılır (kart bunu gösterir)
  const repGain = met ? gainReputation(CONFIG.goalMetReputation) : 0;
  // Üst üste kaçırma sayacı: tutturan gün SIFIRLAR (ceza birikmez, seri kırılınca biter).
  game.goalMissStreak = met ? 0 : (game.goalMissStreak || 0) + 1;
  const repLoss = met ? 0 : goalMissPenaltyFor(game.goalMissStreak);
  game.dayResult = { goal: goal, met: met, repGain: repGain,
                     repLoss: repLoss, missStreak: game.goalMissStreak };
  foldDayIntoSeason(met);
  // KARİYER SKORU = ulaşılan EN YÜKSEK kasa. Her gün sonunda güncellenir (istenen kadans).
  updateCareerPeak();
  // Ceza itibarı sıfırlayıp sezonu (ve kariyeri) KAPATABİLİR. O yüzden fold/peak'ten
  // SONRA uygulanır ve hemen ardından state kontrol edilir: kapanmışsa DAYEND'e çekmek
  // finishSeason'ın kurduğu bitiş state'ini sessizce ezerdi.
  // Para kalemi: açığın oranı. İtibardan ÖNCE uygulanır ki kasa hareketi bitiş
  // state'ini kuran çağrıdan sonra sessizce kalmasın.
  let moneyLoss = 0;
  if (!met && CONFIG.goalMissMoneyShare > 0 && game.goalMissStreak > CONFIG.goalMissGraceDays) {
    const shortfall = Math.max(0, goal - game.dayStats.money);
    moneyLoss = Math.round(shortfall * CONFIG.goalMissMoneyShare);
    if (moneyLoss > 0) {
      moneyLoss = Math.min(moneyLoss, game.money);
      game.money -= moneyLoss;
      game.dayResult.moneyLoss = moneyLoss;
    }
  }
  if (repLoss > 0) loseReputation(repLoss);
  if (game.state === STATE.SEASONEND || game.state === STATE.CAREEREND) return;
  // SEZON SONU: son gün bitince DAYEND kartı HİÇ gösterilmez, doğrudan sezon kartı gelir.
  // Sebep: "Sonraki Gün →" butonu 31. günü başlatmamalı; olmayan bir günün kapısı da olmaz.
  if (game.dayNumber >= CONFIG.seasonDays) { finishSeason("completed"); return; }
  game.state = STATE.DAYEND;
  game.resumeState = STATE.DAYEND;
  saveRun("dayend");
}

// =====================================================================
//  SEZON — sabit uzunlukta koşu; sezon sonunda KASA = SKOR
// =====================================================================
function newSeasonStats() {
  return { served: 0, correct: 0, wrong: 0, angry: 0, fakeCaught: 0, fakeMissed: 0,
           earned: 0, daysGoalMet: 0,
           beggarGave: 0, beggarRefused: 0, beggarRep: 0,
           beggarRepaid: 0, beggarRepaidMoney: 0 };
}
// Günün istatistiğini sezon toplamına ekle. İKİ çağıran var: endDay (normal yol) ve
// finishSeason (itibar gün ortasında tükendiğinde). dayFolded bayrağı aynı günün iki kez
// sayılmasını engeller; startNextDay bayrağı sıfırlar.
function foldDayIntoSeason(goalMet) {
  if (game.dayFolded) return;
  game.dayFolded = true;
  if (!game.seasonStats) game.seasonStats = newSeasonStats();
  const s = game.dayStats, t = game.seasonStats;
  t.served += s.served;
  t.correct += s.correct;
  t.wrong += s.wrong;
  t.angry += s.angry;
  t.fakeCaught += s.fakeCaught;
  t.fakeMissed += s.fakeMissed;
  t.beggarGave += s.beggarGave;
  t.beggarRefused += s.beggarRefused;
  t.beggarRep += s.beggarRep;      // net itibar bilançosu (verilen artı − reddedilen eksi)
  t.beggarRepaid += s.beggarRepaid;
  t.beggarRepaidMoney += s.beggarRepaidMoney;
  t.earned += s.money;
  if (goalMet) t.daysGoalMet++;
}

// LEADERBOARD HAZIRLIĞI — skor ve tüm istatistikler TEK nesnede toplanır. Şimdilik
// hiçbir yere GÖNDERİLMEZ; sonraki turda bu nesne olduğu gibi listeye yazılabilsin diye
// yapı burada kuruluyor (version alanı şema değişirse ayırt etmek için).
// SKOR = KASA. Tahsil edilmemiş SGK alacağı skora GİRMEZ — yatmamış para kasada değildir.
// Ayrı alanda taşınır (pendingReceivables) ve kartta ayrı satırda gösterilir.
function buildSeasonResult(reason) {
  const t = game.seasonStats || newSeasonStats();
  return {
    version: 1,
    reason: reason,                             // "completed" | "reputation"
    endedEarly: reason !== "completed",
    seasonDays: CONFIG.seasonDays,
    daysPlayed: game.dayNumber,
    score: Math.round(game.money),              // = son kasa
    pendingReceivables: pendingReceivables(),   // skora DAHİL DEĞİL
    reputation: Math.round(game.reputation * 10) / 10,
    served: t.served,
    correct: t.correct,
    wrong: t.wrong,
    angry: t.angry,
    fakeCaught: t.fakeCaught,
    fakeMissed: t.fakeMissed,
    earned: Math.round(t.earned),
    daysGoalMet: t.daysGoalMet,
    beggarSeen: t.beggarGave + t.beggarRefused,
    beggarGave: t.beggarGave,
    beggarRefused: t.beggarRefused,
    beggarRep: Math.round(t.beggarRep * 10) / 10,
    beggarRepaid: t.beggarRepaid,
    beggarRepaidMoney: Math.round(t.beggarRepaidMoney),
    beggarReturnsPending: pendingBeggarReturns(),
    priceRounds: priceStateFor(game.dayNumber).roundCount,
    medulaBooked: Math.round(game.medulaBooked),
    medulaCollected: Math.round(game.medulaCollected),
    upgrades: UPGRADES.map(u => ({ id: u.id, name: u.name, emoji: u.emoji,
                                   level: upgradeLevel(u.id), maxLevel: u.maxLevel })),
    runSeed: game.runSeed
  };
}

// Sezonu kapat. İki yol buraya gelir: son gün tamamlandı ("completed") ya da itibar
// tükendi ("reputation"). İTİBAR ÇÖKÜŞÜ ARTIK KARİYERİ DE BİTİRİR — o yol SEASONEND'de
// durmaz, doğrudan CAREEREND'e geçer. Yani SEASONEND yalnız "completed" ile görünür.
function finishSeason(reason) {
  if (game.state === STATE.SEASONEND || game.state === STATE.CAREEREND) return;   // iki kez kapanmasın
  foldDayIntoSeason(false);                     // yarım gün varsa (itibar 0) o da toplama girsin
  updateCareerPeak();
  game.seasonResult = buildSeasonResult(reason);
  foldSeasonIntoCareer(game.seasonResult);
  game.hasRun = false;              // BİTMİŞ sezon sürdürülemez => menüde DEVAM ET pasif
  game.feedback = null;
  // SATIŞ ekranı oyunu DONDURMADIĞI için itibar panel açıkken de tükenebilir. Panel açık
  // kalırsa handleTap onu modal sayıp tüm dokunuşları yutar ve karta ulaşılamaz.
  game.depotOpen = false;
  game.pcScreen = "home";
  game.nightIntro = null;
  game.bookState = "closed";        // açık defter kartın üstünde kalıp ilk dokunuşu yutmasın
  resetTransientAnims();            // havadaki poşet kararı ölü kuyruğa uygulamasın
  if (reason === "reputation") { finishCareer("reputation"); return; }
  game.state = STATE.SEASONEND;
  game.resumeState = STATE.SEASONEND;   // menüye çıkılsa da DEVAM ET bu karta döner
  // Kariyer sürerken de o ana kadarki skor gider (uzun kariyer sıralamada görünsün; GC en iyisini tutar)
  if (!_noRecords && game.career) GC.submit(game.career.peakMoney);
  saveRun("seasonend");
}

// =====================================================================
//  KARİYER — sezonların üstündeki katman
// =====================================================================
// RUHSAT YENİLEME BEDELİ. 1. sezon bedelsizdir (kariyerin açılışı); bedel 2. sezondan
// itibaren alınır ve sezon numarasıyla geometrik büyür. Formül CONFIG'den ayarlanır.
function seasonFeeFor(season) {
  if (season <= 1) return 0;
  const raw = CONFIG.seasonFeeBase * Math.pow(CONFIG.seasonFeeGrowth, season - 2);
  const step = Math.max(1, CONFIG.seasonFeeRound);
  return Math.round(raw / step) * step;
}
function careerSeason() { return game.career ? game.career.season : 1; }
// ÖDENECEK bedel: taban × Mali Müşavir indirimi. seasonFeeFor SAF kalır (self-test
// formülün kendisini — 1. sezon bedelsiz, kesin artan, yuvarlı — onun üzerinden denetler);
// indirim yalnız ödeme anında ve kartlarda uygulanır.
function effSeasonFeeFor(season) {
  const base = seasonFeeFor(season);
  if (base <= 0) return 0;
  const step = Math.max(1, CONFIG.seasonFeeRound);
  return Math.max(step, Math.round(base * (1 - effFeeDiscount()) / step) * step);
}
function nextSeasonFee() { return effSeasonFeeFor(careerSeason() + 1); }
function canAffordNextSeason() { return game.money >= nextSeasonFee(); }

// Her sezon KENDİ tohumunu alır; hepsi tek kariyer tohumundan türer. Böylece kariyer bir
// bütün olarak tekrarlanabilir kalır AMA sezonlar birbirinin günlerini tekrar etmez
// (tek tohum olsaydı 2. sezon 1. sezonun aynı 30 gününü oynatırdı).
function seasonSeedFor(careerSeed, season) {
  let h = ((careerSeed >>> 0) ^ 0x5BF03635) >>> 0;
  h = (h ^ Math.imul(season, 0x9E3779B1)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 13), 0xC2B2AE35);
  return ((h ^ (h >>> 16)) >>> 0) || 1;
}

function newCareerTotals() {
  return { seasonsPlayed: 0, daysPlayed: 0, served: 0, correct: 0, wrong: 0, angry: 0,
           fakeCaught: 0, fakeMissed: 0, earned: 0, feePaid: 0,
           beggarGave: 0, beggarRefused: 0, beggarRep: 0,
           beggarRepaid: 0, beggarRepaidMoney: 0 };
}
function newCareer() {
  return { seed: newRunSeed(), season: 1, completed: 0, peakMoney: 0,
           totals: newCareerTotals(), seasons: [] };
}

// KARİYER SKORU = kariyer boyunca ULAŞILAN EN YÜKSEK kasa. O anki kasa DEĞİL: kariyer
// zaten parasızlıktan bittiği için bitiş anındaki kasa neredeyse sıfırdır ve beceriyi
// ölçmez. Peak monoton arttığı için her yerden çağrılması güvenlidir.
function updateCareerPeak() {
  if (!game.career) return;
  if (game.money > game.career.peakMoney) game.career.peakMoney = game.money;
}

function foldSeasonIntoCareer(res) {
  const cr = game.career;
  if (!cr) return;
  const t = cr.totals;
  t.seasonsPlayed++;
  t.daysPlayed += res.daysPlayed;
  t.served += res.served;
  t.correct += res.correct;
  t.wrong += res.wrong;
  t.angry += res.angry;
  t.fakeCaught += res.fakeCaught;
  t.fakeMissed += res.fakeMissed;
  t.earned += res.earned;
  t.beggarGave += res.beggarGave;
  t.beggarRefused += res.beggarRefused;
  t.beggarRep += res.beggarRep;    // FİİLEN uygulanan itibar (yumuşak tavan kırpması dahil)
  t.beggarRepaid += res.beggarRepaid;
  t.beggarRepaidMoney += res.beggarRepaidMoney;
  if (!res.endedEarly) cr.completed++;
  cr.seasons.push({ season: cr.season, score: res.score, earned: res.earned,
                    daysPlayed: res.daysPlayed, reason: res.reason,
                    served: res.served, correct: res.correct, wrong: res.wrong,
                    fee: Math.round(game.seasonFeePaid || 0) });
}

// LEADERBOARD HAZIRLIĞI (seasonResult'ın kariyer eşleniği). Hiçbir yere GÖNDERİLMEZ.
// "En iyi sezon" o sezonun KAZANCINA (earned) göre seçilir, bitiş kasasına göre değil:
// kasa sezonlar arası devrettiği için en yüksek bitiş kasası her zaman SON sezon olurdu
// ve sezonların kendi performansını hiç ölçmezdi.
function buildCareerResult(reason) {
  const cr = game.career || newCareer();
  const t = cr.totals;
  let best = null;
  for (const sx of cr.seasons) if (!best || sx.earned > best.earned) best = sx;
  return {
    version: 1,
    reason: reason,                          // "reputation" | "fee"
    seasonsCompleted: cr.completed,
    seasonsPlayed: t.seasonsPlayed,
    lastSeason: cr.season,
    score: Math.round(cr.peakMoney),         // KARİYER SKORU = peak kasa
    finalMoney: Math.round(game.money),
    unpaidFee: effSeasonFeeFor(cr.season + 1),  // ödenemeyen bedel ("fee" bitişinde anlamlı)
    totalFeePaid: Math.round(t.feePaid),
    daysPlayed: t.daysPlayed,
    served: t.served,
    correct: t.correct,
    wrong: t.wrong,
    angry: t.angry,
    fakeCaught: t.fakeCaught,
    fakeMissed: t.fakeMissed,
    earned: Math.round(t.earned),
    beggarGave: t.beggarGave,
    beggarRefused: t.beggarRefused,
