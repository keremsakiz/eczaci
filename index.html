}

function drawFeedback() {
  if (!game.feedback) return;
  const c = CONFIG.colors;
  const f = game.feedback;
  const S = layout.stage;

  const t = clamp(f.t / CONFIG.feedbackDuration, 0, 1);
  const pop = t < 0.25 ? (t / 0.25) : 1;
  const fade = t > 0.75 ? (1 - (t - 0.75) / 0.25) : 1;
  const scale = 0.7 + 0.3 * pop;

  ctx.save();
  ctx.globalAlpha = fade;
  const cx = S.x + S.w / 2;
  const cy = layout._patientArea.y + layout._patientArea.h * 0.58;
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.translate(-cx, -cy);

  const boxW = S.w * 0.74;
  const boxH = S.h * 0.10;
  const col = f.ok ? c.good : c.bad;

  ctx.shadowColor = "rgba(0,0,0,0.18)";
  ctx.shadowBlur = 20;
  ctx.shadowOffsetY = 6;
  fillRoundRect(cx - boxW / 2, cy - boxH / 2, boxW, boxH, boxH * 0.32, col);
  ctx.shadowColor = "transparent";
  text(f.text, cx, cy, boxH * 0.32, "#ffffff", "center", "800");
  ctx.restore();
}

// ---- Gün sonu özet kartı ----
// Kart yüksekliği İÇERİKTEN hesaplanır (başlık + satırlar + rozet + butonlar + boşluklar).
// Sıkışıklık boşlukla çözülür, punto küçültülmez; taşma olursa yalnız alt boşluktan kırpılır.
function drawDayEnd() {
  const w = layout.w, h = layout.h, c = CONFIG.colors;
  const S = layout.stage;
  const s = game.dayStats;
  const res = game.dayResult || { goal: goalForDay(), met: s.money >= goalForDay(), repGain: 0 };

  // tüm ekranı karart
  ctx.fillStyle = "rgba(10, 8, 16, 0.55)";
  ctx.fillRect(0, 0, w, h);

  // --- içerik ölçüleri (puntolar eski kartla aynı ya da daha büyük) ---
  const fs = S.h * 0.028;             // istatistik satırı puntosu
  const rowStep = fs * 2.1;           // satır aralığı (≥ 1.8× punto)
  const gap = rowStep * 0.5;          // blok arası nefes payı (rozet/buton/pill)
  const headerH = fs * 3.0;           // amber başlık şeridi
  const padTop = rowStep * 0.8;
  const goalH = fs * 1.8;
  const btnH = fs * 2.2;
  const pillH = fs * 1.3;
  let padBottom = rowStep * 0.6;
  const wasNight = !!(game.daySchedule && game.daySchedule.day === game.dayNumber && game.daySchedule.isNight);
  const nextIsNight = isNightDutyDay(game.dayNumber + 1);
  const accrued = Math.round(s.medulaAccrued || 0);
  const collected = Math.round(game.collectedToday || 0);
  const nRows = 5 + (wasNight ? 2 : 0) + (collected > 0 ? 1 : 0) + (accrued > 0 ? 1 : 0);
  const warnH = nextIsNight ? fs * 1.5 : 0;        // "yarın nöbetçisin" uyarı şeridi
  const warnGap = nextIsNight ? gap * 0.7 : 0;
  // hedef tutan günde itibar ödülü şeridi (kaçıran günde HİÇ gösterilmez — ceza mesajı yok)
  const showRep = !!res.met;
  const repH = showRep ? fs * 1.5 : 0;
  const repGap = showRep ? gap * 0.7 : 0;
  const stackH = () => headerH + padTop + nRows * rowStep + gap + goalH + repGap + repH + warnGap + warnH + gap + btnH + gap + pillH + padBottom;
  let cardH = stackH();
  const maxH = S.h * 0.88;
  if (cardH > maxH) {                 // taşma: satır aralığından değil, alt boşluktan kırp
    padBottom = Math.max(gap * 0.4, padBottom - (cardH - maxH));
    cardH = stackH();
  }

  const cardW = S.w * 0.82;
  const cardX = S.x + (S.w - cardW) / 2;
  const cardY = S.y + (S.h - cardH) / 2;   // dikeyde ortalı
  const cr = cardW * 0.08;

  // koyu kart + amber kenarlık
  drawPanel(cardX, cardY, cardW, cardH, cr, c.panelBgSolid);

  // başlık şeridi (amber)
  ctx.save();
  roundRect(cardX, cardY, cardW, cardH, cr);
  ctx.clip();
  ctx.fillStyle = c.accent;
  ctx.fillRect(cardX, cardY, cardW, headerH);
  ctx.restore();
  text((wasNight ? "🌙 Gün " + game.dayNumber + " + Nöbet Bitti" : "🌙 Gün " + game.dayNumber + " Bitti"),
    cardX + cardW / 2, cardY + headerH / 2, fs * 1.2, "#1a1410", "center", "800");

  // istatistik satırları
  const lx = cardX + cardW * 0.12;
  const rx = cardX + cardW * 0.88;
  let ly = cardY + headerH + padTop + rowStep * 0.5;
  const SYSFONT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  const row = (icon, label, val) => {
    // emoji metin akışında değil, kendi kare kutusunda ortalanır (glif yüksekliği
    // farkları satırı kaydırmasın); etiket emojinin sağından başlar
    drawEmoji(icon, lx + fs * 0.5, ly, fs, c.cream);
    const labelX = lx + fs * 1.35;
    text(label, labelX, ly, fs, c.cream, "left", "600");
    // Uzun değer ("220₺ (gün 5)" gibi) sağa dayalı olduğu için etiketin ÜSTÜNE biniyordu.
    // Etiketin bittiği yerden sağa kalan boşluğa sığana kadar yalnız DEĞERİN puntosu kısılır;
    // kısa değerlerde hiç devreye girmez, diğer satırların yerleşimi değişmez.
    ctx.font = "600 " + fs + "px " + SYSFONT;
    const avail = Math.max(fs * 2, rx - (labelX + ctx.measureText(label).width + fs * 0.5));
    let vs = fs;
    ctx.font = "800 " + vs + "px " + SYSFONT;
    while (vs > fs * 0.55 && ctx.measureText(val).width > avail) {
      vs -= 0.5;
      ctx.font = "800 " + vs + "px " + SYSFONT;
    }
    text(val, rx, ly, vs, c.neon, "right", "800");
    ly += rowStep;
  };
  row("👥", "Servis edilen", String(s.served));
  row("✓", "Doğru", String(s.correct));
  row("✗", "Yanlış", String(s.wrong));
  row("😠", "Küsen müşteri", String(s.angry));
  if (wasNight) {
    row("☀️", "Gündüz kazancı", Math.round(s.moneyDay) + "₺");
    row("🌙", "Gece kazancı", Math.round(s.moneyNight) + "₺");
  }
  row("💰", "Günlük kazanç", s.money + "₺");
  if (collected > 0) row("🏦", "SGK ödemesi yattı", "+" + collected + "₺");
  if (accrued > 0) row("🧾", "SGK alacağı", accrued + "₺ (gün " + (game.dayNumber + CONFIG.medulaPayDelayDays) + ")");

  // hedef durumu rozeti
  const rowsBottom = cardY + headerH + padTop + nRows * rowStep;
  const goalY = rowsBottom + gap;
  const goalCol = res.met ? c.good : c.bad;
  const goalTxt = res.met
    ? "🎯 Hedef tuttu! (" + res.goal + "₺)"
    : "⚠️ Hedef tutmadı (" + res.goal + "₺)";
  fillRoundRect(cardX + cardW * 0.08, goalY, cardW * 0.84, goalH, goalH * 0.5,
    res.met ? "rgba(94,196,138,0.18)" : "rgba(232,115,107,0.18)");
  strokeRoundRect(cardX + cardW * 0.08, goalY, cardW * 0.84, goalH, goalH * 0.5, goalCol, 1.5);
  text(goalTxt, cardX + cardW / 2, goalY + goalH / 2, fs * 0.95, goalCol, "center", "800");

  // Hedef ödülü şeridi — oyuncu kuralı buradan öğrenir, gizli kalmasın
  if (showRep) {
    const rY = goalY + goalH + repGap;
    fillRoundRect(cardX + cardW * 0.08, rY, cardW * 0.84, repH, repH * 0.5, "rgba(94,196,138,0.18)");
    strokeRoundRect(cardX + cardW * 0.08, rY, cardW * 0.84, repH, repH * 0.5, c.good, 1.5);
    fitText(res.repGain > 0 ? "⭐ Hedef tutturuldu · +" + (Math.round(res.repGain * 10) / 10) + " itibar"
                            : "⭐ Hedef tutturuldu · itibar tavanda",
      cardX + cardW / 2, rY + repH / 2, cardW * 0.78, fs * 0.88, c.good, "center", "800");
  }

  // "Yarın nöbetçisin" uyarısı — oyuncu depoya gidip hazırlanabilsin
  if (nextIsNight) {
    const wY = goalY + goalH + repGap + repH + warnGap;
    fillRoundRect(cardX + cardW * 0.08, wY, cardW * 0.84, warnH, warnH * 0.5, "rgba(90, 74, 150, 0.30)");
    strokeRoundRect(cardX + cardW * 0.08, wY, cardW * 0.84, warnH, warnH * 0.5, "rgba(160, 140, 235, 0.85)", 1.5);
    fitText("🌙 Yarın nöbetçisin — stoklarını kontrol et", cardX + cardW / 2, wY + warnH / 2,
      cardW * 0.78, fs * 0.88, "#d8ccff", "center", "800");
  }

  // Sonraki Gün butonu (neon)
  const bW = cardW * 0.7;
  const bX = cardX + (cardW - bW) / 2;
  const bY = goalY + goalH + repGap + repH + warnGap + warnH + gap;
  layout.nextDayBtn = { x: bX, y: bY, w: bW, h: btnH };
  fillRoundRect(bX, bY, bW, btnH, btnH * 0.34, c.btnDark);
  ctx.save();
  const pulse = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(game.clock * 4));
  ctx.shadowColor = c.neonGlow;
  ctx.shadowBlur = 20 * pulse;
  strokeRoundRect(bX, bY, bW, btnH, btnH * 0.34, c.neon, Math.max(2, bW * 0.008));
  ctx.restore();
  ctx.save();
  ctx.shadowColor = c.neonGlow;
  ctx.shadowBlur = 14;
  text("Sonraki Gün →", bX + bW / 2, bY + btnH / 2, btnH * 0.40, c.neon, "center", "800");
  ctx.restore();

  // 📦 Depodan Sipariş — Sonraki Gün'ün altında soluk pill (aynı depo panelini açar)
  const dW = cardW * 0.62;
  const dX = cardX + (cardW - dW) / 2;
  const dY = bY + btnH + gap;
  layout.depotFromDayEndBtn = { x: dX, y: dY, w: dW, h: pillH };
  fillRoundRect(dX, dY, dW, pillH, pillH * 0.4, c.btnDark);
  strokeRoundRect(dX, dY, dW, pillH, pillH * 0.4, "rgba(245,170,70,0.55)", 1.5);
  text("📦 Depodan Sipariş", dX + dW / 2, dY + pillH / 2, pillH * 0.5, c.neon, "center", "800");
}

// Tezgahın SAĞ tarafında duran bilgisayar (kapalı defterin simetriği) — depo
// sipariş ekranını açar. Defterle benzer görsel ağırlıkta (küçük), bandın EN SAĞINA
// yaslı (sağ boşluk = defterin sol boşluğu, S.w*0.02) ve alt kenarı defterin alt
// kenarıyla aynı hizada (tezgah yüzeyi) — ortadaki hastanın önünü kesmez.
// CONFIG.pcScale / pcOffsetX ile elle ince ayar. Rect burada hesaplanır.
function drawCounterPC() {
  const b = layout._band, S = layout.stage;
  if (!b) return;
  const scale = CONFIG.pcScale || 1;
  const pw = S.w * 0.21 * scale, ph = S.h * 0.10 * scale;
  const px = b.x + b.w - pw - S.w * 0.02 + (CONFIG.pcOffsetX || 0);
  const surfaceY = b.y + b.h * 0.58;    // defterin oturduğu tezgah yüzey çizgisi (aynı hiza)
  const py = surfaceY - ph;
  // tıklama alanı görselden her yönde ~9px geniş (dokunma kolaylığı)
  const hitPad = 9;
  layout.pcBtn = { x: px - hitPad, y: py - hitPad, w: pw + hitPad * 2, h: ph + hitPad * 2 };
  drawGroundShadow(px + pw / 2, surfaceY - ph * 0.04, pw * 0.5, ph * 0.14);
  const img = Assets.images["pc"];
  if (img && img.complete && img.naturalWidth > 0) {
    // Defterle aynı oturma mantığı: görsel ALT KENARA yaslanır (contain ortalayıp
    // havada bırakabiliyordu). Genişliğe sığdır, oran koru; alt kenar = yüzey çizgisi.
    let dw = pw, dh = pw * (img.naturalHeight / img.naturalWidth);
    const maxDh = ph * 1.35;            // aşırı dik görselde tavan (oran korunarak)
    if (dh > maxDh) { dw *= maxDh / dh; dh = maxDh; }
    ctx.drawImage(img, px + (pw - dw) / 2, surfaceY - dh, dw, dh);
  } else {
    // fallback: koyu monitör + soluk yeşilimsi ekran + ayak + 🖥️ (taban yüzey çizgisinde biter)
    const mh = ph * 0.78;
    fillRoundRect(px, py, pw, mh, mh * 0.12, "#241d30");
    strokeRoundRect(px, py, pw, mh, mh * 0.12, "rgba(245,170,70,0.4)", 1.5);
    const inPad = pw * 0.06;
    fillRoundRect(px + inPad, py + mh * 0.12, pw - inPad * 2, mh * 0.70, mh * 0.08, "rgba(120,180,150,0.28)");
    text("🖥️", px + pw / 2, py + mh * 0.47, mh * 0.48, "#000", "center", "400");
    // monitör ayağı + taban
    fillRoundRect(px + pw * 0.42, py + mh, pw * 0.16, ph * 0.12, 2, "#1c1626");
    fillRoundRect(px + pw * 0.30, py + ph * 0.92, pw * 0.40, ph * 0.08, 2, "#2a2138");
  }
}

// Kısa stok uyarısı toast'u (feedback'ten bağımsız, süreli; random yok — clock ile fade).
// Bilgi şeridi (SGK ödemesi vb.) — stok uyarısından AYRI kanal, birbirini ezmez.
function drawInfoToast() {
  const t = game.infoToast;
  if (!t || game.clock > t.until) return;
  const S = layout.stage, c = CONFIG.colors;
  const left = Math.max(0, t.until - game.clock);
  const a = clamp(Math.min(left / 0.4, 1), 0, 1);
  const boxW = S.w * 0.76, boxH = S.h * 0.052;
  const bx = S.x + (S.w - boxW) / 2;
  const by = layout._hud ? layout._hud.y + layout._hud.h + S.h * 0.015 : S.y + S.h * 0.12;
  ctx.save();
  ctx.globalAlpha = a;
  fillRoundRect(bx, by, boxW, boxH, boxH * 0.32, "rgba(26, 60, 42, 0.94)");
  strokeRoundRect(bx, by, boxW, boxH, boxH * 0.32, "rgba(140, 220, 170, 0.8)", Math.max(1.5, boxW * 0.004));
  fitText(t.text, bx + boxW / 2, by + boxH / 2, boxW * 0.9, boxH * 0.42, "#d8f0e0", "center", "800");
  ctx.restore();
}

function drawStockToast() {
  const t = game.stockToast;
  if (!t) return;
  const remain = t.until - game.clock;
  if (remain <= 0) { game.stockToast = null; return; }
  const c = CONFIG.colors, S = layout.stage;
  const dur = CONFIG.stockToastDuration;
  const alpha = clamp(remain / (dur * 0.4), 0, 1);   // son %40'ta yumuşak sönme
  const boxW = S.w * 0.62, boxH = S.h * 0.055;
  const bx = S.x + (S.w - boxW) / 2;
  const by = layout.gridArea ? layout.gridArea.y - boxH - S.h * 0.008 : S.y + S.h * 0.5;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
  fillRoundRect(bx, by, boxW, boxH, boxH * 0.4, "rgba(40,18,18,0.94)");
  ctx.shadowColor = "transparent";
  strokeRoundRect(bx, by, boxW, boxH, boxH * 0.4, c.bad, 1.5);
  text(t.text, bx + boxW / 2, by + boxH / 2, boxH * 0.42, "#f4d8d4", "center", "800");
  ctx.restore();
}

// PC ekranı kapsayıcısı: karartma + koyu panel + yeşilimsi sistem başlık şeridi + ✕.
// İleride Medula / E-reçete gibi ekranlar da bu kapsayıcıyla çizilecek; içerik rect'i döner.
function drawPcScreen(title) {
  const w = layout.w, h = layout.h, c = CONFIG.colors, S = layout.stage;

  // tam ekran karartma (modal) — sahnenin TAMAMEN üstüne (REDDET/ONAYLA dahil tüm
  // arka butonları örter); arka plan seçilebilir ama tıklanabilir hissi vermez
  ctx.fillStyle = "rgba(8,6,12,0.80)";
  ctx.fillRect(0, 0, w, h);

  const panelW = S.w * 0.90, panelH = S.h * 0.80;
  const panelX = S.x + (S.w - panelW) / 2, panelY = S.y + (S.h - panelH) / 2;
  layout.depotPanel = { x: panelX, y: panelY, w: panelW, h: panelH };
  drawPanel(panelX, panelY, panelW, panelH, panelW * 0.05, c.panelBgSolid);

  // sistem başlık şeridi (yeşilimsi, soluk — eski terminal hissi)
  const barH = panelH * 0.065;
  ctx.save();
  roundRect(panelX, panelY, panelW, panelH, panelW * 0.05);
  ctx.clip();
  ctx.fillStyle = "rgba(38, 74, 54, 0.92)";
  ctx.fillRect(panelX, panelY, panelW, barH);
  ctx.fillStyle = "rgba(140, 220, 170, 0.30)";
  ctx.fillRect(panelX, panelY + barH - Math.max(1, panelH * 0.004), panelW, Math.max(1, panelH * 0.004));
  ctx.restore();
  // sistem ışığı + başlık
  ctx.beginPath(); ctx.arc(panelX + panelW * 0.045, panelY + barH * 0.5, barH * 0.16, 0, Math.PI * 2);
  ctx.fillStyle = "#7ee2a8"; ctx.fill();
  fitText(title, panelX + panelW * 0.5, panelY + barH * 0.5, panelW * 0.78, barH * 0.42, "#d8f0e0", "center", "800");

  // kapat butonu (✕) — defter kalıbı
  const cs = S.w * 0.085;
  layout.depotCloseBtn = { x: panelX + panelW - cs * 0.85, y: panelY - cs * 0.35, w: cs, h: cs };
  const cb = layout.depotCloseBtn;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
  ctx.beginPath(); ctx.arc(cb.x + cb.w / 2, cb.y + cb.h / 2, cb.w / 2, 0, Math.PI * 2);
  ctx.fillStyle = "#3a2230"; ctx.fill();
  ctx.restore();
  ctx.strokeStyle = "#e8736b"; ctx.lineWidth = Math.max(2, cs * 0.06);
  ctx.beginPath(); ctx.arc(cb.x + cb.w / 2, cb.y + cb.h / 2, cb.w / 2, 0, Math.PI * 2); ctx.stroke();
  text("✕", cb.x + cb.w / 2, cb.y + cb.h / 2, cs * 0.5, "#e8736b", "center", "800");

  return { x: panelX, y: panelY + barH, w: panelW, h: panelH - barH };
}

// PC ANA EKRANI — iki büyük buton. Depo ekranıyla aynı panel/başlık şeridi kalıbı.
function drawPcHome() {
  const c = CONFIG.colors;
  const r = drawPcScreen("ECZANE SİSTEMİ — Ana Menü");

  text("💰 " + formatMoney(game.money), r.x + r.w * 0.05, r.y + r.h * 0.05, r.h * 0.032, c.cream, "left", "700");

  const bw = r.w * 0.80, bh = r.h * 0.155;
  const bx = r.x + (r.w - bw) / 2;
  const gap = r.h * 0.045;
  const by0 = r.y + r.h * 0.18;

  layout.pcMenuBtns = [];
  const unlocked = medulaUnlocked();
  const items = [
    { key: "depot",    emoji: "📦", label: "ECZA DEPOSU",       sub: "İlaç siparişi ver", on: true },
    { key: "upgrades", emoji: "🔧", label: "ECZANE GELİŞTİRME", sub: "Kalıcı yükseltmeler", on: true },
    { key: "medula",   emoji: "🖥️", label: "MEDULA SİSTEMİ",
      sub: unlocked ? "E-reçete kodu sorgula" : "🔒 Geliştirme'den satın al", on: unlocked }
  ];
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const by = by0 + i * (bh + gap);
    layout.pcMenuBtns.push({ key: it.key, x: bx, y: by, w: bw, h: bh, enabled: it.on });
    fillRoundRect(bx, by, bw, bh, bh * 0.22, c.btnDark);
    ctx.save();
    if (it.on) { ctx.shadowColor = c.neonGlow; ctx.shadowBlur = 12; }
    strokeRoundRect(bx, by, bw, bh, bh * 0.22, it.on ? c.neon : c.neonDim, Math.max(1.5, bw * 0.004));
    ctx.restore();
    ctx.globalAlpha = it.on ? 1 : 0.55;
    drawEmoji(it.emoji, bx + bw * 0.12, by + bh * 0.5, bh * 0.42, c.cream);
    fitText(it.label, bx + bw * 0.22, by + bh * 0.38, bw * 0.72, bh * 0.26, it.on ? c.neon : c.neonDim, "left", "800");
    fitText(it.sub, bx + bw * 0.22, by + bh * 0.68, bw * 0.72, bh * 0.19, c.creamSoft, "left", "600");
    ctx.globalAlpha = 1;
  }

  // bekleyen SGK alacağı özeti (varsa) — ana ekranın altında tek satır
  const pend = pendingReceivables();
  if (pend > 0) {
    const rows = game.receivables.slice().sort((a, b) => a.dueDay - b.dueDay)
      .map(x => "gün " + x.dueDay + ": " + Math.round(x.amount) + "₺").join("   ");
    fitText("🏦 Bekleyen SGK alacağı: " + formatMoney(pend), r.x + r.w / 2,
      by0 + 3 * (bh + gap) + r.h * 0.02, r.w * 0.86, r.h * 0.030, c.cream, "center", "700");
    fitText(rows, r.x + r.w / 2, by0 + 3 * (bh + gap) + r.h * 0.058, r.w * 0.86, r.h * 0.024,
      c.creamSoft, "center", "600");
  }
}

// --- MEDULA SİSTEMİ ekranı: kod girişi + tuş takımı + sonuç ---
function drawMedula() {
  const c = CONFIG.colors;
  const r = drawPcScreen("MEDULA SİSTEMİ — E-Reçete Sorgu");

  // GERİ (depo/geliştirme ekranlarıyla aynı buton dili)
  const backW = r.w * 0.26, backH = r.h * 0.055;
  const backX = r.x + r.w * 0.95 - backW, backY = r.y + r.h * 0.028;
  layout.pcBackBtn = { x: backX, y: backY, w: backW, h: backH };
  fillRoundRect(backX, backY, backW, backH, backH * 0.35, c.btnDark);
  strokeRoundRect(backX, backY, backW, backH, backH * 0.35, "rgba(245,170,70,0.55)", 1.5);
  text("‹ GERİ", backX + backW / 2, backY + backH / 2, backH * 0.46, c.neon, "center", "800");

  if (!medulaUnlocked()) {
    fitText("🔒 Medula terminali kurulu değil", r.x + r.w / 2, r.y + r.h * 0.42, r.w * 0.8, r.h * 0.045, c.creamSoft, "center", "800");
    fitText("ECZANE GELİŞTİRME → Medula Terminali", r.x + r.w / 2, r.y + r.h * 0.50, r.w * 0.8, r.h * 0.032, c.creamSoft, "center", "600");
    layout.medulaKeys = null; layout.medulaOk = null; layout.medulaDel = null;
    return;
  }

  // --- giriş kutusu ---
  const inW = r.w * 0.72, inH = r.h * 0.075;
  const inX = r.x + (r.w - inW) / 2, inY = r.y + r.h * 0.10;
  fillRoundRect(inX, inY, inW, inH, inH * 0.22, "rgba(20, 40, 30, 0.92)");
  strokeRoundRect(inX, inY, inW, inH, inH * 0.22, "rgba(140, 220, 170, 0.65)", 2);
  const shown = game.medulaInput + "_".repeat(Math.max(0, CONFIG.medulaCodeLen - game.medulaInput.length));
  fitText(shown.split("").join(" "), inX + inW / 2, inY + inH / 2, inW * 0.9, inH * 0.55, "#d8f0e0", "center", "800");

  // --- sonuç / uyarı alanı ---
  const resY = inY + inH + r.h * 0.022;
  const resH = r.h * 0.20;
  const res = game.medulaResult;
  if (res && res.error) {
    fillRoundRect(inX, resY, inW, r.h * 0.052, r.h * 0.026, "rgba(232,115,107,0.16)");
    strokeRoundRect(inX, resY, inW, r.h * 0.052, r.h * 0.026, "rgba(232,115,107,0.75)", 1.5);
    fitText("⚠️ " + res.error, inX + inW / 2, resY + r.h * 0.026, inW * 0.9, r.h * 0.030, c.bad, "center", "800");
  } else if (res && res.items) {
    fillRoundRect(inX, resY, inW, resH, r.h * 0.02, "rgba(255,255,255,0.05)");
    strokeRoundRect(inX, resY, inW, resH, r.h * 0.02, "rgba(140, 220, 170, 0.5)", 1.5);
    fitText("Kayıt: " + res.code, inX + inW * 0.5, resY + resH * 0.14, inW * 0.8, r.h * 0.028, "#8fe3a8", "center", "800");
    const n = res.items.length;
    const lh = (resH * 0.72) / Math.max(1, n);
    const fs = Math.min(lh * 0.58, r.h * 0.030);
    let ly = resY + resH * 0.30;
    for (const it of res.items) {
      const m = getMedicine(it.id);
      fitText(m ? m.name : it.id, inX + inW * 0.06, ly, inW * 0.62, fs, c.cream, "left", "700");
      fitText("× " + it.qty, inX + inW * 0.94, ly, inW * 0.2, fs, c.neon, "right", "800");
      ly += lh;
    }
  } else {
    fitText("Hastanın verdiği 6 haneli kodu gir", inX + inW / 2, resY + r.h * 0.026, inW * 0.9, r.h * 0.028, c.creamSoft, "center", "600");
  }

  // --- tuş takımı: alfabe + SİL + TAMAM ---
  const padTop = resY + resH + r.h * 0.02;
  const padBot = r.y + r.h * 0.97;
  // 36 karakter = 6×6 tam ızgara (eksik/boş tuş kalmaz), +1 satır SİL/SORGULA için
  const cols = 6;
  const chars = MEDULA_ALPHABET.split("");
  const rowsN = Math.ceil(chars.length / cols) + 1;          // +1: aksiyon satırı
  const gapK = r.w * 0.012;
  const kw = (r.w * 0.90 - gapK * (cols - 1)) / cols;
  const kh = Math.min(kw, (padBot - padTop - gapK * (rowsN - 1)) / rowsN);
  const padX0 = r.x + (r.w - (kw * cols + gapK * (cols - 1))) / 2;

  layout.medulaKeys = [];
  for (let i = 0; i < chars.length; i++) {
    const cx = i % cols, cy = Math.floor(i / cols);
    const kx = padX0 + cx * (kw + gapK), ky = padTop + cy * (kh + gapK);
    const on = game.medulaInput.length < CONFIG.medulaCodeLen;
    layout.medulaKeys.push({ ch: chars[i], x: kx, y: ky, w: kw, h: kh, enabled: on });
    fillRoundRect(kx, ky, kw, kh, kh * 0.22, c.btnDark);
    strokeRoundRect(kx, ky, kw, kh, kh * 0.22, on ? "rgba(245,170,70,0.55)" : c.neonDim, 1.2);
    fitText(chars[i], kx + kw / 2, ky + kh / 2, kw * 0.7, kh * 0.52, on ? c.cream : c.neonDim, "center", "800");
  }

  // aksiyon satırı: SİL (sol yarı) + TAMAM (sağ yarı)
  const ay = padTop + Math.ceil(chars.length / cols) * (kh + gapK);
  const aW = (kw * cols + gapK * (cols - 1) - gapK) / 2;
  const delOn = game.medulaInput.length > 0;
  const okOn = game.medulaInput.length === CONFIG.medulaCodeLen;
  layout.medulaDel = { x: padX0, y: ay, w: aW, h: kh, enabled: delOn };
  fillRoundRect(padX0, ay, aW, kh, kh * 0.22, c.btnDark);
  strokeRoundRect(padX0, ay, aW, kh, kh * 0.22, delOn ? "rgba(232,115,107,0.75)" : c.neonDim, 1.5);
  fitText("⌫ SİL", padX0 + aW / 2, ay + kh / 2, aW * 0.8, kh * 0.42, delOn ? c.bad : c.neonDim, "center", "800");

  const okX = padX0 + aW + gapK;
  layout.medulaOk = { x: okX, y: ay, w: aW, h: kh, enabled: okOn };
  fillRoundRect(okX, ay, aW, kh, kh * 0.22, c.btnDark);
  ctx.save();
  if (okOn) { ctx.shadowColor = c.neonGlow; ctx.shadowBlur = 12; }
  strokeRoundRect(okX, ay, aW, kh, kh * 0.22, okOn ? c.neon : c.neonDim, 1.5);
  ctx.restore();
  fitText("✓ SORGULA", okX + aW / 2, ay + kh / 2, aW * 0.86, kh * 0.42, okOn ? c.neon : c.neonDim, "center", "800");
}

// ECZANE GELİŞTİRME — seviyeli kalemler; satırda seviye, etki ve sonraki seviyenin fiyatı.
function drawUpgrades() {
  const c = CONFIG.colors;
  const r = drawPcScreen("ECZANE GELİŞTİRME");

  text("💰 " + formatMoney(game.money), r.x + r.w * 0.05, r.y + r.h * 0.05, r.h * 0.032, c.cream, "left", "700");

  // GERİ butonu (ana ekrana) — depo ekranındaki buton diliyle aynı
  const backW = r.w * 0.26, backH = r.h * 0.055;
  const backX = r.x + r.w * 0.95 - backW, backY = r.y + r.h * 0.028;
  layout.pcBackBtn = { x: backX, y: backY, w: backW, h: backH };
  fillRoundRect(backX, backY, backW, backH, backH * 0.35, c.btnDark);
  strokeRoundRect(backX, backY, backW, backH, backH * 0.35, "rgba(245,170,70,0.55)", 1.5);
  text("‹ GERİ", backX + backW / 2, backY + backH / 2, backH * 0.46, c.neon, "center", "800");

  const rowH = r.h * 0.132, rowGap = r.h * 0.018;
  const rx0 = r.x + r.w * 0.05, rw = r.w * 0.90;
  let ry = r.y + r.h * 0.115;

  layout.upgradeRows = [];
  for (const u of UPGRADES) {
    const lv = upgradeLevel(u.id);
    const maxed = lv >= u.maxLevel;
    const cost = maxed ? 0 : upgradeCost(u.id, lv + 1);
    const afford = game.money >= cost;
    const enabled = !maxed && afford;

    fillRoundRect(rx0, ry, rw, rowH, rowH * 0.20, "rgba(255,255,255,0.05)");
    strokeRoundRect(rx0, ry, rw, rowH, rowH * 0.20, "rgba(245,170,70,0.28)", 1);

    // sol: emoji + ad + etki
    drawEmoji(u.emoji, rx0 + rw * 0.07, ry + rowH * 0.42, rowH * 0.34, c.cream);
    const nameX = rx0 + rw * 0.14;
    fitText(u.name, nameX, ry + rowH * 0.26, rw * 0.42, rowH * 0.24, c.cream, "left", "800");
    fitText(u.desc, nameX, ry + rowH * 0.52, rw * 0.46, rowH * 0.17, c.creamSoft, "left", "600");
    fitText("Şu an: " + u.valueAt(lv), nameX, ry + rowH * 0.78, rw * 0.46, rowH * 0.19, c.good, "left", "700");

    // seviye noktaları (Lv göstergesi)
    const dotR = rowH * 0.055, dotGap = dotR * 2.8;
    const dotsW = (u.maxLevel - 1) * dotGap;
    const dotsX = rx0 + rw * 0.66 - dotsW / 2;
    for (let i = 0; i < u.maxLevel; i++) {
      ctx.beginPath();
      ctx.arc(dotsX + i * dotGap, ry + rowH * 0.28, dotR, 0, Math.PI * 2);
      ctx.fillStyle = i < lv ? c.neon : "rgba(255,255,255,0.18)";
      ctx.fill();
    }
    fitText("Lv " + lv + "/" + u.maxLevel, rx0 + rw * 0.66, ry + rowH * 0.50, rw * 0.20, rowH * 0.17, c.creamSoft, "center", "700");

    // sağ: satın alma butonu ya da TAM
    const bW = rw * 0.24, bH = rowH * 0.44;
    const bX = rx0 + rw - bW - rw * 0.02, bY = ry + (rowH - bH) / 2;
    layout.upgradeRows.push({ id: u.id, enabled, maxed, btn: { x: bX, y: bY, w: bW, h: bH } });
    if (maxed) {
      fillRoundRect(bX, bY, bW, bH, bH * 0.30, "rgba(94,196,138,0.16)");
      strokeRoundRect(bX, bY, bW, bH, bH * 0.30, "rgba(94,196,138,0.65)", 1.5);
      text("TAM", bX + bW / 2, bY + bH / 2, bH * 0.40, c.good, "center", "800");
    } else {
      fillRoundRect(bX, bY, bW, bH, bH * 0.30, c.btnDark);
      ctx.save();
      if (enabled) { ctx.shadowColor = c.neonGlow; ctx.shadowBlur = 10; }
      strokeRoundRect(bX, bY, bW, bH, bH * 0.30,
        enabled ? c.neon : "rgba(232,115,107,0.55)", Math.max(1.2, bW * 0.012));
      ctx.restore();
      fitText("Lv " + (lv + 1), bX + bW / 2, bY + bH * 0.32, bW * 0.8, bH * 0.30,
        enabled ? c.neon : c.neonDim, "center", "800");
      fitText(formatMoney(cost), bX + bW / 2, bY + bH * 0.70, bW * 0.86, bH * 0.30,
        enabled ? c.neon : c.bad, "center", "800");
    }
    ry += rowH + rowGap;
  }

  // kasa yetmeyen (ama TAM olmayan) kalem varsa depo ekranıyla AYNI biçimde uyarı
  const short = layout.upgradeRows.some(x => !x.maxed && !x.enabled);
  if (short) {
    text("⛔ Yetersiz bakiye — kasa: " + formatMoney(game.money),
      rx0 + rw / 2, ry + r.h * 0.022, r.h * 0.022, c.bad, "center", "700");
  }
}

// Ecza deposu — PC sipariş ekranı. Satır başına −/+ adımlayıcı ile sepet (pendingQty),
// altta tek "SİPARİŞ VER" butonu. Rect'ler burada hesaplanır.
function drawDepot() {
  const c = CONFIG.colors;
  const r = drawPcScreen("ECZA DEPOSU — Sipariş Ekranı");

  // kasa (sol üst)
  text("💰 " + game.money + "₺", r.x + r.w * 0.05, r.y + r.h * 0.045, r.h * 0.032, c.cream, "left", "700");

  // GERİ butonu (PC ana ekranına)
  {
    const backW = r.w * 0.22, backH = r.h * 0.048;
    const backX = r.x + r.w * 0.95 - backW, backY = r.y + r.h * 0.022;
    layout.pcBackBtn = { x: backX, y: backY, w: backW, h: backH };
    fillRoundRect(backX, backY, backW, backH, backH * 0.35, c.btnDark);
    strokeRoundRect(backX, backY, backW, backH, backH * 0.35, "rgba(245,170,70,0.55)", 1.5);
    text("‹ GERİ", backX + backW / 2, backY + backH / 2, backH * 0.46, c.neon, "center", "800");
  }

  // --- kategori sekmeleri (tek satır, eşit bölünmüş; depoya özel aktif grup) ---
  const groups = groupsWithMeds();
  if (!game.depotGroup && groups.length) game.depotGroup = groups[0].id;
  const tabsX = r.x + r.w * 0.05, tabsW = r.w * 0.90;
  const tabsY = r.y + r.h * 0.085, tabsH = r.h * 0.062;
  const tGap = tabsW * 0.012;
  const tW = (tabsW - tGap * (groups.length - 1)) / Math.max(1, groups.length);
  layout.depotTabs = [];
  for (let i = 0; i < groups.length; i++) {
    const g = groups[i];
    const tx = tabsX + i * (tW + tGap);
    const active = g.id === game.depotGroup;
    const tr = tabsH * 0.28;
    const tcx = tx + tW / 2, tcy = tabsY + tabsH / 2;
    if (active) {
      ctx.save(); ctx.shadowColor = c.neonGlow; ctx.shadowBlur = 8;
      fillRoundRect(tx, tabsY, tW, tabsH, tr, "rgba(58,40,20,0.95)"); ctx.restore();
      strokeRoundRect(tx, tabsY, tW, tabsH, tr, c.neon, Math.max(1.2, tabsH * 0.05));
      drawTabLabel(g.emoji, g.label, tcx, tcy, tW * 0.86, tabsH * 0.34, c.neon, "800");
    } else {
      fillRoundRect(tx, tabsY, tW, tabsH, tr, "rgba(26,21,36,0.82)");
      strokeRoundRect(tx, tabsY, tW, tabsH, tr, "rgba(245,170,70,0.25)", 1);
      drawTabLabel(g.emoji, g.label, tcx, tcy, tW * 0.86, tabsH * 0.32, c.creamSoft, "700");
    }
    layout.depotTabs.push({ group: g, x: tx, y: tabsY, w: tW, h: tabsH });
  }

  // --- ilaç satırları: sabit oranlı sütunlar (metin ölçüsüne göre kaydırma YOK) ---
  //   SOL  (%46'ya kadar) : emoji + ilaç adı (üst) + "Stok x/30" (alt)
  //   ORTA (%60'ta biter) : birim alış (üst) + seçim varsa satır tutarı / DOLU (alt)
  //   SAĞ  (sağa yaslı)   : −/+ adımlayıcı
  const meds = medsInGroup(game.depotGroup);
  const obH = r.h * 0.085;
  const obY = r.y + r.h - obH - r.h * 0.03;
  const listTop = tabsY + tabsH + r.h * 0.02;
  const listBot = obY - r.h * 0.02;
  const rowGap = r.h * 0.01;
  // satır yüksekliği alandan türetilir: 6 satır en kötü ihtimalle sığar,
  // az satırlı kategorilerde üst sınıra kadar genişler (metinler nefes alır)
  let rowH = Math.min(r.h * 0.12, (listBot - listTop - rowGap * Math.max(0, meds.length - 1)) / Math.max(1, meds.length));
  const rx0 = r.x + r.w * 0.05, rw = r.w * 0.90;
  const colNameR = rx0 + rw * 0.46;   // sol sütunun sağ sınırı
  const colCostR = rx0 + rw * 0.60;   // orta sütunun sağ sınırı (fiyat/tutar sağa hizalı)
  layout.depotRows = [];
  let ry = listTop;
  for (const m of meds) {
    const stock = game.stock[m.id] || 0;
    const pending = game.depotPending[m.id] || 0;
    const full = stock + pending >= effMaxStock();
    fillRoundRect(rx0, ry, rw, rowH, rowH * 0.20, "rgba(26,21,36,0.5)");

    // SOL: emoji + ad (üst; uzunsa "…" ile kısalır, taşmaz) + stok (alt, soluk)
    drawEmoji(m.emoji, rx0 + rowH * 0.42, ry + rowH * 0.5, rowH * 0.40, "#f2e6d4");
    const nameX = rx0 + rowH * 0.80;
    ellipsisText(m.name, nameX, ry + rowH * 0.30, colNameR - nameX, rowH * 0.28, c.cream, "left", "700");
    fitText("Stok " + stock + "/" + effMaxStock(), nameX, ry + rowH * 0.70, colNameR - nameX,
      rowH * 0.22, stock <= 0 ? c.bad : c.creamSoft, "left", "600");

    // ORTA: birim alış (üst) + satır tutarı / DOLU (alt) — kendi alanında, adın üzerine binmez
    fitText(m.cost + "₺", colCostR, ry + rowH * 0.30, rw * 0.12, rowH * 0.26, c.creamSoft, "right", "700");
    if (pending > 0) {
      fitText("= " + (m.cost * pending) + "₺", colCostR, ry + rowH * 0.70, rw * 0.12, rowH * 0.22, c.neon, "right", "800");
    } else if (full) {
      fitText("DOLU", colCostR, ry + rowH * 0.70, rw * 0.12, rowH * 0.22, "rgba(150,200,165,0.75)", "right", "800");
    }

    // SAĞ: −/+ adımlayıcı (satırın sağ kenarına yaslı; davranış aynı)
    const sq = rowH * 0.56;
    const qtyW = sq * 0.9;
    const sY = ry + (rowH - sq) / 2;
    const pX = rx0 + rw * 0.99 - sq;
    const mX = pX - qtyW - sq;
    const minusOn = pending > 0, plusOn = !full;
    fillRoundRect(mX, sY, sq, sq, sq * 0.28, c.btnDark);
    strokeRoundRect(mX, sY, sq, sq, sq * 0.28, minusOn ? c.neon : "rgba(245,170,70,0.22)", 1.2);
    text("−", mX + sq / 2, sY + sq / 2, sq * 0.55, minusOn ? c.neon : c.neonDim, "center", "800");
    text(String(pending), mX + sq + qtyW / 2, ry + rowH * 0.5, rowH * 0.30,
      pending > 0 ? c.neon : c.creamSoft, "center", "800");
    fillRoundRect(pX, sY, sq, sq, sq * 0.28, c.btnDark);
    strokeRoundRect(pX, sY, sq, sq, sq * 0.28, plusOn ? c.neon : "rgba(245,170,70,0.22)", 1.2);
    text("+", pX + sq / 2, sY + sq / 2, sq * 0.55, plusOn ? c.neon : c.neonDim, "center", "800");

    layout.depotRows.push({
      id: m.id, minusOn, plusOn,
      minusBtn: { x: mX - sq * 0.15, y: sY - sq * 0.15, w: sq * 1.3, h: sq * 1.3 },
      plusBtn:  { x: pX - sq * 0.15, y: sY - sq * 0.15, w: sq * 1.3, h: sq * 1.3 }
    });
    ry += rowH + rowGap;
  }

  // --- SİPARİŞ VER (toplam) — tüm sepet tek seferde ---
  const total = depotOrderTotal();
  const afford = game.money >= total;
  const enabled = total > 0 && afford;
  layout.depotOrderBtn = { x: rx0, y: obY, w: rw, h: obH, enabled };
  fillRoundRect(rx0, obY, rw, obH, obH * 0.32, c.btnDark);
  ctx.save();
  if (enabled) { ctx.shadowColor = c.neonGlow; ctx.shadowBlur = 14; }
  strokeRoundRect(rx0, obY, rw, obH, obH * 0.32,
    enabled ? c.neon : (total > 0 ? "rgba(232,115,107,0.55)" : c.neonDim), Math.max(1.5, rw * 0.006));
  ctx.restore();
  text("SİPARİŞ VER", rx0 + rw * 0.05, obY + obH / 2, obH * 0.36, enabled ? c.neon : c.neonDim, "left", "800");
  if (total > 0) {
    // para yetmiyorsa toplam kırmızımsı
    text(total + "₺", rx0 + rw * 0.95, obY + obH / 2, obH * 0.38, afford ? c.neon : c.bad, "right", "800");
  }
  // kasa yetmiyorsa açık uyarı — buton zaten pasif (enabled=false), sebebi yazıyla söyle
  if (total > 0 && !afford) {
    text("⛔ Yetersiz bakiye — kasa: " + formatMoney(game.money),
      rx0 + rw / 2, obY + obH + r.h * 0.015, r.h * 0.022, c.bad, "center", "700");
  }
}

// PC modal'ı: hangi ekran açıksa onu çiz. Rect'ler ilgili draw fonksiyonunda hesaplanır,
// bu yüzden her frame önce eskiler temizlenir (kapalı ekranın butonu tıklanabilir kalmasın).
function drawPcPanel() {
  layout.pcMenuBtns = null;
  layout.pcBackBtn = null;
  layout.upgradeRows = null;
  layout.depotTabs = null;
  layout.depotRows = null;
  layout.depotOrderBtn = null;
  layout.medulaKeys = null;
  layout.medulaOk = null;
  layout.medulaDel = null;
  if (game.pcScreen === "home") drawPcHome();
  else if (game.pcScreen === "upgrades") drawUpgrades();
  else if (game.pcScreen === "medula") drawMedula();
  else drawDepot();
}

// PC ekranı açıkken dokunuşlar — önce ortak (kapat/geri/menü), sonra ekrana özel
function handlePcTap(px, py) {
  if (layout.depotCloseBtn && pointInRect(px, py, layout.depotCloseBtn)) { closeDepot(); return; }
  if (layout.pcBackBtn && pointInRect(px, py, layout.pcBackBtn)) { pcHome(); return; }
  if (game.pcScreen === "home") {
    if (layout.pcMenuBtns) {
      for (const b of layout.pcMenuBtns) {
        if (!pointInRect(px, py, b)) continue;
        if (!b.enabled) return;                       // kilitli sekme: dokunuş yutulur
        if (b.key === "depot") openDepot();
        else if (b.key === "upgrades") openUpgrades();
        else openMedulaScreen();
        return;
      }
    }
    if (layout.depotPanel && !pointInRect(px, py, layout.depotPanel)) { closeDepot(); return; }
    return;
  }
  if (game.pcScreen === "medula") {
    if (layout.medulaKeys) {
      for (const k of layout.medulaKeys) {
        if (pointInRect(px, py, k)) { if (k.enabled) medulaKeyPress(k.ch); return; }
      }
    }
    if (layout.medulaDel && pointInRect(px, py, layout.medulaDel)) { if (layout.medulaDel.enabled) medulaBackspace(); return; }
    if (layout.medulaOk && pointInRect(px, py, layout.medulaOk)) { if (layout.medulaOk.enabled) medulaSubmit(); return; }
    if (layout.depotPanel && !pointInRect(px, py, layout.depotPanel)) { closeDepot(); return; }
    return;
  }
  if (game.pcScreen === "upgrades") {
    if (layout.upgradeRows) {
      for (const row of layout.upgradeRows) {
        if (pointInRect(px, py, row.btn)) { if (row.enabled) buyUpgrade(row.id); return; }
      }
    }
    if (layout.depotPanel && !pointInRect(px, py, layout.depotPanel)) { closeDepot(); return; }
    return;
  }
  handleDepotTap(px, py);
}

// depo ekranı açıkken dokunuşlar (adımlayıcı / sipariş / sekme / kapat / dışarı)
function handleDepotTap(px, py) {
  if (layout.depotCloseBtn && pointInRect(px, py, layout.depotCloseBtn)) { closeDepot(); return; }
  if (layout.depotTabs) {
    for (const t of layout.depotTabs) {
      if (pointInRect(px, py, t)) { game.depotGroup = t.group.id; return; }
    }
  }
  if (layout.depotRows) {
    for (const row of layout.depotRows) {
      if (row.minusBtn && pointInRect(px, py, row.minusBtn)) { if (row.minusOn) changePending(row.id, -1); return; }
      if (row.plusBtn && pointInRect(px, py, row.plusBtn)) { if (row.plusOn) changePending(row.id, 1); return; }
    }
  }
  if (layout.depotOrderBtn && pointInRect(px, py, layout.depotOrderBtn)) {
    if (layout.depotOrderBtn.enabled) placeDepotOrder();
    return;
  }
  // panel dışına tıkla → kapat; panel içi boşluk → yut
  if (layout.depotPanel && !pointInRect(px, py, layout.depotPanel)) { closeDepot(); return; }
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, layout.w, layout.h);
  drawBackground();
  if (game.state !== STATE.MENU) drawNightOverlay();   // nöbet gecesi tonlaması

  if (game.state === STATE.PLAYING) {
    drawHUD();
    drawQueue();        // DEV müşteri (tezgah çizgisinde kırpılı)
    drawCounter();      // ahşap bant müşterinin önünde + seçilen ilaçlar
    drawClosedBook();   // tezgahtaki kapalı defter (obje)
    drawCounterPC();    // tezgahtaki bilgisayar (depo sipariş ekranını açar)
    drawTabs();         // kategori sekmeleri
    drawShelf();        // seçili kategorinin ilaçları
    if (activeNeedsDecision()) drawDecisionButtons(); else drawServeButton();
    drawStockToast();   // kısa stok uyarısı (feedback'ten bağımsız)
    drawInfoToast();    // SGK ödeme bildirimi (ayrı kanal)
    drawFeedback();
  } else if (game.state === STATE.DAYEND) {
    // arka planda son kareyi koru + kart
    drawHUD();
    drawQueue();
    drawCounter();
    drawClosedBook();
    drawTabs();
    drawShelf();
    if (activeNeedsDecision()) drawDecisionButtons(); else drawServeButton();
    drawDayEnd();
  } else if (game.state === STATE.MENU) {
    // oyun dünyası çizilmesin; arka plan + menü kartı
    drawMenu();
  } else if (game.state === STATE.GAMEOVER) {
    // arka planda son PLAYING karesini koru + üstüne oyun bitti kartı
    drawHUD();
    drawQueue();
    drawCounter();
    drawClosedBook();
    drawTabs();
    drawShelf();
    if (activeNeedsDecision()) drawDecisionButtons(); else drawServeButton();
    drawGameOver();
  }

  drawNightIntro();                   // "NÖBET BAŞLIYOR" geçiş kartı (modal)
  if (game.depotOpen) drawPcPanel();  // PC paneli (PLAYING/DAYEND üstünde modal)
  drawBookOverlay();   // defter açılma animasyonu + açık panel (en üstte)
}

// ---- Açılış menüsü (drawDayEnd kart diliyle aynı) ----
function drawMenu() {
  const w = layout.w, h = layout.h, c = CONFIG.colors;
  const S = layout.stage;

  // tüm ekranı hafifçe karart (kart öne çıksın)
  ctx.fillStyle = "rgba(10, 8, 16, 0.55)";
  ctx.fillRect(0, 0, w, h);

  const cardW = S.w * 0.82;
  const cardH = S.h * 0.56;
  const cardX = S.x + (S.w - cardW) / 2;
  const cardY = S.y + (S.h - cardH) / 2;

  // koyu kart + amber kenarlık
  drawPanel(cardX, cardY, cardW, cardH, cardW * 0.08, c.panelBgSolid);

  // büyük başlık + alt başlık
  text("ECZACI", cardX + cardW / 2, cardY + cardH * 0.20, cardH * 0.13, c.neon, "center", "800");
  text("Eczane Simülasyonu", cardX + cardW / 2, cardY + cardH * 0.32, cardH * 0.05, c.creamSoft, "center", "600");

  // BAŞLA butonu (drawDayEnd'deki Sonraki Gün ile aynı nabız) — her zaman TAM RESET
  const bW = cardW * 0.7, bH = cardH * 0.12;
  const bX = cardX + (cardW - bW) / 2;
  const bY = cardY + cardH * 0.46 - bH / 2;
  layout.menuStartBtn = { x: bX, y: bY, w: bW, h: bH };
  fillRoundRect(bX, bY, bW, bH, bH * 0.34, c.btnDark);
  ctx.save();
  const pulse = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(game.clock * 4));
  ctx.shadowColor = c.neonGlow;
  ctx.shadowBlur = 20 * pulse;
  strokeRoundRect(bX, bY, bW, bH, bH * 0.34, c.neon, Math.max(2, bW * 0.008));
  ctx.restore();
  ctx.save();
  ctx.shadowColor = c.neonGlow;
  ctx.shadowBlur = 14;
  text("BAŞLA", bX + bW / 2, bY + bH / 2, bH * 0.40, c.neon, "center", "800");
  ctx.restore();

  // DEVAM ET — sadece devam eden oyun varsa (ev butonuyla menüye dönüldüyse); reset yok
  if (game.hasRun) {
    const rH = cardH * 0.095;
    const rW = cardW * 0.58;
    const rX = cardX + (cardW - rW) / 2;
    const rY = cardY + cardH * 0.62 - rH / 2;
    layout.menuResumeBtn = { x: rX, y: rY, w: rW, h: rH };
    fillRoundRect(rX, rY, rW, rH, rH * 0.34, c.btnDark);
    strokeRoundRect(rX, rY, rW, rH, rH * 0.34, "rgba(245,170,70,0.6)", Math.max(1.5, rW * 0.008));
    text("DEVAM ET  (Gün " + game.dayNumber + ")", rX + rW / 2, rY + rH / 2, rH * 0.38, c.cream, "center", "800");
  } else {
    layout.menuResumeBtn = null;   // bayat rect kalmasın (ilk açılış / gameover sonrası)
  }

  // kilitli, soluk, dokunulamaz placeholder satırlar (layout rect verilmez)
  text("⚙️ Ayarlar 🔒", cardX + cardW / 2, cardY + cardH * 0.78, cardH * 0.05, c.creamSoft, "center", "600");
  text("🏆 En Yüksek Skor 🔒", cardX + cardW / 2, cardY + cardH * 0.88, cardH * 0.05, c.creamSoft, "center", "600");
}

// ---- Oyun bitti ekranı (kırmızımsı vurgulu koyu kart) ----
function drawGameOver() {
  const w = layout.w, h = layout.h, c = CONFIG.colors;
  const S = layout.stage;

  // tüm ekranı karart
  ctx.fillStyle = "rgba(10, 8, 16, 0.62)";
  ctx.fillRect(0, 0, w, h);

  const cardW = S.w * 0.82;
  const cardH = S.h * 0.56;
  const cardX = S.x + (S.w - cardW) / 2;
  const cardY = S.y + (S.h - cardH) / 2;

  // koyu kart + kırmızımsı kenarlık
  drawPanel(cardX, cardY, cardW, cardH, cardW * 0.08, c.panelBgSolid, "rgba(232,115,107,0.85)");

  // başlık
  text("💔 Oyun Bitti", cardX + cardW / 2, cardY + cardH * 0.18, cardH * 0.085, c.bad, "center", "800");

  // satırlar
  let ly = cardY + cardH * 0.34;
  const step = cardH * 0.095;
  const fs = cardH * 0.05;
  text("Ulaşılan gün", cardX + cardW * 0.12, ly, fs, c.cream, "left", "600");
  text("Gün " + game.dayNumber, cardX + cardW * 0.88, ly, fs, c.neon, "right", "800");
  ly += step;
  text("💰 Toplam para", cardX + cardW * 0.12, ly, fs, c.cream, "left", "600");
  text(game.money + "₺", cardX + cardW * 0.88, ly, fs, c.neon, "right", "800");
  ly += step;
  text("⚠️ Sebep", cardX + cardW * 0.12, ly, fs, c.cream, "left", "600");
  text("İtibarın tükendi", cardX + cardW * 0.88, ly, fs, c.bad, "right", "800");

  // TEKRAR DENE butonu (neon, nabız)
  const bW = cardW * 0.7, bH = cardH * 0.12;
  const bX = cardX + (cardW - bW) / 2;
  const bY = cardY + cardH * 0.74 - bH / 2;
  layout.retryBtn = { x: bX, y: bY, w: bW, h: bH };
  fillRoundRect(bX, bY, bW, bH, bH * 0.34, c.btnDark);
  ctx.save();
  const pulse = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(game.clock * 4));
  ctx.shadowColor = c.neonGlow;
  ctx.shadowBlur = 20 * pulse;
  strokeRoundRect(bX, bY, bW, bH, bH * 0.34, c.neon, Math.max(2, bW * 0.008));
  ctx.restore();
  ctx.save();
  ctx.shadowColor = c.neonGlow;
  ctx.shadowBlur = 14;
  text("TEKRAR DENE", bX + bW / 2, bY + bH / 2, bH * 0.36, c.neon, "center", "800");
  ctx.restore();

  // Ana Menü (küçük, soluk)
  const mW = cardW * 0.5, mH = cardH * 0.08;
  const mX = cardX + (cardW - mW) / 2;
  const mY = cardY + cardH * 0.90 - mH / 2;
  layout.menuFromGameOverBtn = { x: mX, y: mY, w: mW, h: mH };
  text("Ana Menü", mX + mW / 2, mY + mH / 2, mH * 0.42, c.creamSoft, "center", "700");
}

// =====================================================================
//  DOKUNMA / TIKLAMA GİRİŞİ
// =====================================================================
function pointInRect(px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

// sekme şeridine dokunulduğunda o kategoriyi seç
function selectTabAt(px, py) {
  const ta = layout.tabsArea;
  if (!ta || !layout.tabs) return;
  const off = layout.tabsOffset || 0;
  for (const t of layout.tabs) {
    const sx = ta.x + off + t.x - (layout.tabScroll || 0);
    if (px >= sx && px <= sx + t.w && py >= ta.y && py <= ta.y + ta.h) {
      if (game.activeGroup !== t.group.id) {
        game.activeGroup = t.group.id;
        layout.shelfScroll = 0;      // yeni grup baştan görünsün
        buildShelf();
        ensureActiveTabVisible();
      }
      return;
    }
  }
}

function handleTap(px, py) {
  // defter animasyon sırasında tüm dokunuşları yut
  if (game.bookState === "opening" || game.bookState === "closing") return;

  // defter açıkken modal: kitabın İÇİ (✕ hariç) açık tutar; ✕ veya dışarı = kapat
  if (game.bookState === "open") {
    const insideBook = layout.bookBox && pointInRect(px, py, layout.bookBox);
    const onClose = layout.bookCloseBtn && pointInRect(px, py, layout.bookCloseBtn);
    if (!insideBook || onClose) game.bookState = "closing";   // ters animasyon
    return;
  }

  // depo paneli açıkken modal: içi işle, ✕/dışarı kapat, gerisini yut
  if (game.nightIntro !== null) { game.nightIntro = null; return; }   // geçiş kartı: tek dokunuş
  if (game.depotOpen) { handlePcTap(px, py); return; }

  if (game.state === STATE.MENU) {
    if (layout.menuStartBtn && pointInRect(px, py, layout.menuStartBtn)) startNewGame();
    else if (game.hasRun && layout.menuResumeBtn && pointInRect(px, py, layout.menuResumeBtn)) game.state = STATE.PLAYING;  // reset YOK
    return;   // başka dokunuş yutulur
  }
  if (game.state === STATE.GAMEOVER) {
    if (layout.retryBtn && pointInRect(px, py, layout.retryBtn)) startNewGame();
    else if (layout.menuFromGameOverBtn && pointInRect(px, py, layout.menuFromGameOverBtn)) game.state = STATE.MENU;
    return;   // başka dokunuş yutulur
  }
  if (game.state === STATE.DAYEND) {
    if (layout.depotFromDayEndBtn && pointInRect(px, py, layout.depotFromDayEndBtn)) { openDepot(); return; }
    if (pointInRect(px, py, layout.nextDayBtn)) startNextDay();
    return;
  }
  if (game.state !== STATE.PLAYING) return;

  // HUD ev butonu → menüye dön (oyun verisi SİLİNMEZ; menüden DEVAM ET ile geri gelinir)
  if (layout.homeBtn && pointInRect(px, py, layout.homeBtn)) { game.state = STATE.MENU; return; }

  // tezgahtaki PC'ye dokun → depo sipariş ekranını aç
  if (layout.pcBtn && pointInRect(px, py, layout.pcBtn)) { openPc(); return; }

  // tezgahtaki kapalı deftere dokun → açılma animasyonunu başlat
  if (layout.bookClosedRect && pointInRect(px, py, layout.bookClosedRect)) {
    game.bookState = "opening";
    return;
  }

  // sekmeler feedback sırasında da değiştirilebilir
  if (layout.tabsArea && pointInRect(px, py, layout.tabsArea)) { selectTabAt(px, py); return; }

  if (game.feedback) return;

  // reçete karar fazı: önce ONAYLA/REDDET
  if (activeNeedsDecision()) {
    if (pointInRect(px, py, layout.approveBtn)) approvePrescription();
    else if (pointInRect(px, py, layout.rejectBtn)) rejectPrescription();
    return;
  }

  if (pointInRect(px, py, layout.serveBtn)) { checkOrder(); return; }

  // dokunma alanı slot karesi değil, çizilen görselin kutusu (counterItemRects.hit) —
  // çizim ile tıklama tek kaynaktan gelsin, dar şişede boşluğa basınca ilaç düşmesin
  for (const slot of layout.counterSlots) {
    if (pointInRect(px, py, counterItemRects(slot).hit)) { removeOneFromCounter(slot.id); return; }
  }
  // raf kartları: içerik koordinatında saklanır, scroll düşülür; gridArea dışı (kırpılan kısım) tıklanamaz
  const shelfScroll = layout.shelfScroll || 0;
  for (const btn of layout.shelfButtons) {
    const r2 = { x: btn.x, y: btn.y - shelfScroll, w: btn.w, h: btn.h };
    if (pointInRect(px, py, r2) && layout.gridArea && pointInRect(px, py, layout.gridArea)) {
      tapMedicine(btn.id);
      return;
    }
  }
}

function getEventPos(e) {
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;
  if (e.changedTouches && e.changedTouches.length) {
    clientX = e.changedTouches[0].clientX;
    clientY = e.changedTouches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return { x: clientX - rect.left, y: clientY - rect.top };
}

// işaretçi: tap + sekme şeridinde YATAY, ilaç grid'inde DİKEY kaydırma (drag)
const pointer = { down: false, startX: 0, startY: 0, dragging: false, inTabs: false, inGrid: false, scrollStart: 0, scrollStartY: 0 };

function onDown(x, y) {
  pointer.down = true;
  pointer.startX = x;
  pointer.startY = y;
  pointer.dragging = false;
  const interactive = game.bookState === "closed" && !game.depotOpen && game.state === STATE.PLAYING;
  pointer.inTabs = interactive && layout.tabsArea && pointInRect(x, y, layout.tabsArea);
  pointer.inGrid = interactive && !pointer.inTabs && layout.gridArea && pointInRect(x, y, layout.gridArea);
  pointer.scrollStart = layout.tabScroll || 0;
  pointer.scrollStartY = layout.shelfScroll || 0;
}
function onMove(x, y) {
  if (!pointer.down) return;
  if (pointer.inTabs) {
    const dx = x - pointer.startX;
    if (Math.abs(dx) > 6) pointer.dragging = true;
    if (pointer.dragging) {
      const ta = layout.tabsArea;
      const maxS = Math.max(0, (layout.tabsTotal || 0) - ta.w);
      layout.tabScroll = clamp(pointer.scrollStart - dx, 0, maxS);
    }
  } else if (pointer.inGrid) {
    const dy = y - pointer.startY;
    if (Math.abs(dy) > 6) pointer.dragging = true;
    if (pointer.dragging) {
      layout.shelfScroll = clamp(pointer.scrollStartY - dy, 0, layout.shelfMaxScroll || 0);
    }
  }
}
function onUp(x, y) {
  if (!pointer.down) return;
  pointer.down = false;
  if (!pointer.dragging) handleTap(x, y);  // kaydırma değilse tap
}

canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  const p = getEventPos(e);
  onDown(p.x, p.y);
}, { passive: false });
canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();
  const p = getEventPos(e);
  onMove(p.x, p.y);
}, { passive: false });
canvas.addEventListener("touchend", (e) => {
  e.preventDefault();
  const p = getEventPos(e);
  onUp(p.x, p.y);
}, { passive: false });

canvas.addEventListener("mousedown", (e) => { const p = getEventPos(e); onDown(p.x, p.y); });
canvas.addEventListener("mousemove", (e) => { if (pointer.down) { const p = getEventPos(e); onMove(p.x, p.y); } });
canvas.addEventListener("mouseup", (e) => { const p = getEventPos(e); onUp(p.x, p.y); });

let lastTime = performance.now();
function loop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

// hedefi tutturmak için gereken en az DOĞRU işlem sayısı (N üzerinden).
// Geçerli hastalarda: k×ortCiro − (V−k)×ortCost ≥ hedef  →  k ≥ (hedef + C) / missCost
// Sahte reçeteler zaten reddedilmek zorunda (0₺ katkı) — onlar da doğru işlem sayılır.
function neededCorrectFor(day) {
  const sch = getDaySchedule(day);
  if (sch.missCost <= 0) return sch.N;
  const k = Math.ceil((sch.goal + sch.C) / sch.missCost - 1e-9);
  return Math.min(sch.N, Math.max(0, k) + sch.fakeCount);
}

// --- Üretilmiş günde senaryo kazancı ---
// missCount kadar geçerli hasta yanlış ilaç alır (ciro kaçar + cost zararı yazılır),
// kalan geçerli hastalar doğru servis edilir. order: hataların hangi hastalara düştüğü.
//   "ucuz"   = en düşük swing'li hastalarda hata (oyuncu lehine EN İYİ hâl)
//   "pahalı" = en yüksek swing'li hastalarda hata (EN KÖTÜ hâl)
//   "ortalama" = hatalar ortalama değerli hastalara düşer (formülün varsaydığı hâl)
// Sahte reçetelerin yakalama bonusu (fakeCatchBonus) KASITLI sayılmaz — hedef de onları
// 0₺ kabul ediyor; bonus oyuncu lehine ekstra paydır.
function simulateDayScenario(day, missCount, order) {
  const sch = getDaySchedule(day);
  if (order === "ortalama") return sch.R - missCount * sch.missCost;
  const swing = p => p.refRevenue + p.refCost;
  const list = sch.patients.filter(p => p.refValid).slice()
    .sort((a, b) => order === "pahalı" ? swing(b) - swing(a) : swing(a) - swing(b));
  const m = clamp(missCount, 0, list.length);
  let earn = sch.R;
  for (let i = 0; i < m; i++) earn -= swing(list[i]);
  return earn;
}

// --- Denge doğrulaması: KESİN (üretilmiş gün listesinden; olasılık/örnekleme yok) ---
// İki ayrı ölçüt:
//  1) FORMÜL ÖLÇÜTÜ — hatalar ortalama değerli hastalara düştüğünde izinli hata kadar hata
//     hedefi tutturmalı, bir fazlası tutturmamalı. (round/clamp bunu bozarsa yakalanır.)
//  2) ZARF — hatalar EN UCUZ/EN PAHALI hastalara düşerse ne olur. Hastalar heterojen
//     olduğu için (reçete hastası semptom hastasının ~2.8 katı değerinde) bu aralık geniştir;
//     sadece patolojik uçlarda uyarı verilir: izinli hata kadar hata EN İYİ hâlde bile
//     tutmuyorsa hedef imkânsız, bir fazlası EN KÖTÜ hâlde bile tutuyorsa hedef anlamsız.
function verifyGoalBalance(verbose, days) {
  days = days || 10;
  let allOk = true;
  for (let d = 1; d <= days; d++) {
    const sch = getDaySchedule(d);
    const mInt = Math.floor(sch.misses + 1e-9);
    const g = sch.goal;

    // Güvenlik bandı devreye girdiyse hedef KASITLI olarak tolerans değerinde değildir;
    // tolerans ölçütü bu günde geçerli olmaz. Tipik sebep: günün büyük kısmı sahte reçete
    // olduğunda R küçülür, izinli hata (N × missRate, N sahteleri de sayar) geçerli hasta
    // sayısına göre absürtleşir ve alt bant hedefi yukarı çeker. Bu bir denge hatası değil,
    // bandın işini yapmasıdır — ama sessiz geçmesin diye verbose'ta bildirilir.
    if (sch.clampedAt) {
      if (verbose) {
        console.log("Gün " + d + " | hedef " + g + "₺ | GÜVENLİK BANDI (" + sch.clampedAt +
          ") devrede: ham hedef " + Math.round(sch.raw) + "₺ → banda çekildi" +
          " (geçerli hasta " + sch.validCount + "/" + sch.N + ", izinli hata " + sch.misses.toFixed(2) + ")");
      }
      continue;
    }

    // 1) formül ölçütü (kesin)
    const avgPass = simulateDayScenario(d, mInt, "ortalama");
    const avgFail = simulateDayScenario(d, mInt + 1, "ortalama");
    if (!(avgPass >= g)) {
      allOk = false;
      console.warn("[denge] Gün " + d + ": izinli " + sch.misses.toFixed(2) + " hataya rağmen " +
        mInt + " ortalama hata (" + Math.round(avgPass) + "₺) hedefi (" + g + "₺) TUTMUYOR." +
        " R=" + Math.round(sch.R) + "₺ C=" + Math.round(sch.C) + "₺ missCost=" + Math.round(sch.missCost) + "₺");
    }
    // "bir fazlası tutmamalı" — ama izinli hata 2.99 gibi tam sayıya çok yakınsa, 3. hatanın
    // beklenen açığı (0.01 × missCost) 10'a yuvarlama adımından küçük olur. Yuvarlamanın
    // açıklayabildiği ihlal gerçek denge hatası değildir; yalnız onu aşanı bildir.
    const failMargin = (mInt + 1 - sch.misses) * sch.missCost;
    if (!(avgFail < g) && failMargin > 10) {
      allOk = false;
      console.warn("[denge] Gün " + d + ": " + (mInt + 1) + " ortalama hata (" + Math.round(avgFail) +
        "₺) hâlâ hedefi (" + g + "₺) tutuyor — hedef fazla GEVŞEK." +
        " (izinli hata " + sch.misses.toFixed(2) + ", beklenen açık " + Math.round(failMargin) + "₺)");
    }

    // 2) zarf (patolojik uçlar)
    const best = simulateDayScenario(d, mInt, "ucuz");
    const worst = simulateDayScenario(d, mInt, "pahalı");
    const worstNext = simulateDayScenario(d, mInt + 1, "pahalı");
    if (best < g) {
      allOk = false;
      console.warn("[denge] Gün " + d + ": " + mInt + " hata EN İYİ hâlde bile (" + Math.round(best) +
        "₺) hedefi (" + g + "₺) tutmuyor — hedef imkânsız.");
    }
    if (worstNext >= g) {
      allOk = false;
      console.warn("[denge] Gün " + d + ": " + (mInt + 1) + " hata EN KÖTÜ hâlde bile (" +
        Math.round(worstNext) + "₺) hedefi (" + g + "₺) tutuyor — hedef anlamsız.");
    }

    if (verbose) {
      const kesin = worst >= g ? "garanti geçer" : (best < g ? "garanti kalır" : "hangi hastada hata yaptığına bağlı");
      console.log("Gün " + d + " | hedef " + g + "₺ | ortalama " + mInt + " hata: " + Math.round(avgPass) +
        "₺ " + (avgPass >= g ? "✓" : "✗") + " | " + (mInt + 1) + " hata: " + Math.round(avgFail) +
        "₺ " + (avgFail < g ? "✓" : "✗") + " | " + mInt + " hata zarfı: " + Math.round(worst) + "–" +
        Math.round(best) + "₺ → " + kesin);
    }
  }
  if (verbose) console.log(allOk ? "Denge doğrulaması: TÜM GÜNLER GEÇTİ ✓" : "Denge doğrulaması: BAŞARISIZ ✗");
  return allOk;
}
// Belirli geliştirme seviyeleri altında fn'i çalıştır (gün cache'i her iki yönde de
// geçersiz kılınır — vitrin seviyesi hasta karışımını değiştirir).
function withUpgradeLevels(levels, fn) {
  const prev = game.upgrades;
  const prevSch = game.daySchedule;
  game.upgrades = levels;
  game.daySchedule = null;          // snapshot sabitlemesi doğrulamayı maskelemesin
  invalidateDaySchedules();
  try { return fn(); }
  finally {
    game.upgrades = prev;
    game.daySchedule = prevSch;
    invalidateDaySchedules();
  }
}
function allLevels(pick) {
  const o = {};
  for (const u of UPGRADES) o[u.id] = pick(u);
  return o;
}

// --- Konsantrasyon tavanı doğrulaması ---
// Hiçbir GEÇERLİ hastanın payı o günün tavanını aşmamalı. Sahteler kapsam dışı.
function concItemsLabel(request) {
  const items = request.items || [];
  if (request.type === "symptom") return items.map(it => it.symptom.label + "×" + it.qty).join(" + ");
  return items.map(it => { const m = getMedicine(it.id); return (m ? m.name : it.id) + "×" + it.qty; }).join(", ");
}
function verifyConcentrationCap(verbose, days) {
  days = days || 10;
  let ok = true;
  for (let d = 1; d <= days; d++) {
    const sch = getDaySchedule(d);
    const cap = sch.concCap;
    // sağlanamaz gün (tavan × geçerli hasta ≤ 1, yani ≤2 geçerli hasta): kural uygulanmadı,
    // ölçüt de geçerli değil
    if (cap * sch.validCount <= 1 || sch.R <= 0) {
      if (verbose) console.log("Gün " + d + " | geçerli hasta " + sch.validCount + " — tavan sağlanamaz, kural uygulanmadı");
      continue;
    }
    let top = null;
    for (const p of sch.patients) {
      if (!p.refValid) continue;
      const share = p.refRevenue / sch.R;
      if (!top || p.refRevenue > top.refRevenue) top = p;
      if (share > cap + 1e-9) {
        ok = false;
        console.warn("[konsantrasyon] Gün " + d + ": bir hasta R'nin %" + (share * 100).toFixed(1) +
          "'ini tutuyor — tavan %" + (cap * 100).toFixed(1) + " (geçerli hasta " + sch.validCount +
          ", R " + Math.round(sch.R) + "₺, sipariş " + Math.round(p.refRevenue) + "₺)" +
          " | ilaçlar: " + concItemsLabel(p.request));
      }
    }
    if (verbose) {
      console.log("Gün " + d + " | geçerli hasta " + sch.validCount + " | tavan %" + (cap * 100).toFixed(1) +
        " | en yüksek pay %" + (top ? ((top.refRevenue / sch.R) * 100).toFixed(1) : "0") +
        " (" + (top ? Math.round(top.refRevenue) : 0) + "₺) " +
        (top && top.refRevenue / sch.R <= cap + 1e-9 ? "✓" : "✗") +
        " | yeniden üretilen " + sch.concRegen + ", zorla sığdırma " + sch.concForced);
    }
  }
  if (verbose) console.log(ok ? "Konsantrasyon tavanı: TÜM GÜNLER GEÇTİ ✓" : "Konsantrasyon tavanı: BAŞARISIZ ✗");
  return ok;
}

function symptomAnswerCombos(items) {
  const mk = pickIdx => {
    const out = [];
    for (const it of items) {
      const cands = MEDICINES.filter(m => m.category === it.symptom.category);
      if (!cands.length) return null;
      const m = cands[pickIdx === "last" ? cands.length - 1 : 0];
      for (let i = 0; i < it.qty; i++) out.push(m.id);
    }
    return out;
  };
  return [mk("first"), mk("last")].filter(Boolean);
}

// Her emojiyi referans kutuya çizip GERÇEK glif kutusunu ölç: kutunun içinde mi,
// merkezde mi? Sapan varsa hangi emoji ve nerede kullanıldığı bildirilir.
function selfTestEmoji() {
  const warn = [];
  const box = 64;                    // referans kutu (ölçüm punto ile doğrusal ölçeklenir)
  const tol = box * 0.06;            // merkez sapma toleransı (~4 px)
  const seen = {};
  for (const e of allGameEmoji()) {
    if (seen[e.ch]) continue;
    seen[e.ch] = true;
    const m = emojiMetrics(e.ch, box, "400");
    if (!m) continue;                // tarayıcı actualBoundingBox vermiyorsa denetim atlanır
    const r = drawEmoji(e.ch, 0, 0, box, "#000");   // merkez (0,0) hedefli ölçüm çizimi
    if (!r) continue;
    const ccx = r.x + r.w / 2, ccy = r.y + r.h / 2;
    if (Math.abs(ccx) > tol || Math.abs(ccy) > tol) {
      warn.push("Emoji '" + e.ch + "' kutusunda ortalanmıyor (sapma x=" + ccx.toFixed(1) +
        " y=" + ccy.toFixed(1) + " px, tolerans " + tol.toFixed(1) + ") — kullanıldığı yer: " + e.where);
    }
    if (r.w > box + 0.5 || r.h > box + 0.5) {
      warn.push("Emoji '" + e.ch + "' kutuya sığmıyor (" + r.w.toFixed(1) + "×" + r.h.toFixed(1) +
        " > " + box + ") — kullanıldığı yer: " + e.where);
    }
  }
  for (const w of warn) console.warn("[emoji] " + w);
  return warn.length === 0;
}

  const groupToCats = {};
  for (const m of MEDICINES) (groupToCats[m.group] = groupToCats[m.group] || new Set()).add(m.category);

      if (fb === kb) warn.push("Sahte doktor '" + f.name + "' defterde de var — ayırt edilemez");
      else if (ff === kf && (fl.startsWith(kl) || kl.startsWith(fl)))
        warn.push("Sahte doktor '" + f.name + "' ile defterdeki '" + k + "' ad aynı + soyad öneki — ayırt edilemez");
    }
  }

  // 0c) geliştirmeler: her seviye geçerli efektif değer üretmeli, maks seviyede satın alma yok
  const prevUp = game.upgrades, prevMoney = game.money;
  for (const u of UPGRADES) {
    if (!(u.maxLevel >= 2)) warn.push("Geliştirme '" + u.id + "' maxLevel geçersiz: " + u.maxLevel);

    let prevCost = -1;
    for (let lv = 1; lv <= u.maxLevel; lv++) {
      game.upgrades = allLevels(x => x.id === u.id ? lv : 1);
      const vals = { tezgah: effMaxQueue(), depo: effMaxStock(), vitrin: effPrescriptionChance(), bekleme: effPatience(), medula: medulaUnlocked() ? 1 : 0 };
      for (const k in vals) {
        const v = vals[k];
        if (typeof v !== "number" || !isFinite(v) || v < 0)
          warn.push("Geliştirme '" + u.id + "' Lv" + lv + " geçersiz efektif değer (" + k + "=" + v + ")");
      }
      if (effMaxQueue() < 1) warn.push("'" + u.id + "' Lv" + lv + ": kuyruk kapasitesi 1'in altına düştü");
      if (effMaxStock() < CONFIG.startStock) warn.push("'" + u.id + "' Lv" + lv + ": stok tavanı başlangıç stoğunun altına düştü");
      if (effPatience() <= 0) warn.push("'" + u.id + "' Lv" + lv + ": sabır süresi pozitif değil");
      if (patientLimitFor(1) < 1) warn.push("'" + u.id + "' Lv" + lv + ": gün 1 müşteri sayısı 1'in altına düştü");

      if (lv < u.maxLevel) {

        if (cost <= prevCost) warn.push("'" + u.id + "' Lv" + (lv + 1) + " fiyatı bir öncekinden yüksek değil (" + prevCost + " → " + cost + ")");

        game.money = 9e9;
        if (buyUpgrade(u.id) !== false) warn.push("'" + u.id + "' maks seviyedeyken satın alınabildi");
        if (upgradeLevel(u.id) !== u.maxLevel) warn.push("'" + u.id + "' maks seviyede satın alma seviyeyi değiştirdi");
        if (upgradeCost(u.id, u.maxLevel + 1) !== 0) warn.push("'" + u.id + "' maks üstü seviye için fiyat üretiliyor");
      }
    }
  }
  game.upgrades = prevUp; game.money = prevMoney;
  invalidateDaySchedules();

  // 0c2) GÜN BÜYÜKLÜĞÜ TAVANI + GEÇ OYUN KOMPOZİSYON EĞRİSİ
  // Ana kural: 30 günün TAMAMI boyunca en az bir eksen ilerlemeli. Tavan müşteri
  // sayısını dondurduğu için ilerlemeyi kompozisyon eksenleri taşır (sahte oranı,
  // izinli hata, nöbet sıklığı). Bu blok o eksenlerin gerçekten ilerlediğini denetler.
  {
    const cap = CONFIG.maxPatientsPerDay;
    const LAST = 30;                       // kampanya uzunluğu (ölçüm ve hedef davranış bu ufukta)
    if (!(cap >= CONFIG.patientsPerDayBase))
      warn.push("maxPatientsPerDay (" + cap + ") gün 1 müşteri sayısının (" + CONFIG.patientsPerDayBase + ") altında");

    // (i) tavan bağlayıcı, aşılamıyor, dizi hiç azalmıyor
    let capHitDay = null, prevN = 0;
    for (let d = 1; d <= 40; d++) {
      const n = patientLimitFor(d);
      if (n > cap) warn.push("gün " + d + ": müşteri sayısı tavanı aştı (" + n + " > " + cap + ")");
      if (n < prevN) warn.push("gün " + d + ": müşteri sayısı bir önceki günden AZALDI (" + prevN + " → " + n + ")");
      if (n >= cap && capHitDay === null) capHitDay = d;
      prevN = n;
    }
    if (capHitDay === null) warn.push("maxPatientsPerDay (" + cap + ") 40 gün içinde hiç devreye girmiyor — tavan işlevsiz");

    // (ii) VİTRİN müşteri sayısına DOKUNMAMALI (yeni işlevi karışım) ve payı floor'u delmemeli
    const prevUp2 = game.upgrades;
    const nAtLv = [];
    for (const lv of [1, UPGRADE_BY_ID.vitrin.maxLevel]) {
      game.upgrades = allLevels(x => x.id === "vitrin" ? lv : 1);
      invalidateDaySchedules();
      nAtLv.push([5, 15, 30].map(d => patientLimitFor(d)).join(","));
    }
    game.upgrades = prevUp2; invalidateDaySchedules();
    if (nAtLv[0] !== nAtLv[1])
      warn.push("Vitrin hâlâ müşteri SAYISINI değiştiriyor (Lv1: " + nAtLv[0] + " / Lv3: " + nAtLv[1] + ")");
    let prevShare = -1;
    for (let lv = 1; lv <= UPGRADE_BY_ID.vitrin.maxLevel; lv++) {
      const sh = vitrinRxShare(lv);
      if (1 - sh < CONFIG.vitrinSymptomFloor - 1e-9)
        warn.push("Vitrin Lv" + lv + ": semptomlu payı tabanın altına indi (%" + Math.round((1 - sh) * 100) + " < %" + Math.round(CONFIG.vitrinSymptomFloor * 100) + ")");
      if (sh <= prevShare)
        warn.push("Vitrin Lv" + lv + ": reçeteli payı bir önceki seviyeden yüksek değil — geliştirme ölü");
      prevShare = sh;
    }

    // (iii) İZİNLİ HATA ekseni kampanya boyunca daralmalı — tabana LAST'tan önce oturmamalı
    if (!(missRateFor(LAST - 1) > CONFIG.missRateFloor))
      warn.push("missRate " + (LAST - 1) + ". günden önce tabana oturuyor (missRateFloorDay=" +
        CONFIG.missRateFloorDay + ") — geç oyunda hata toleransı ekseni ilerlemiyor");
    if (!(missRateFor(1) > missRateFor(LAST)))
      warn.push("missRate hiç daralmıyor");

    // (iv) SAHTE ORANI ekseni artmalı, tavanı aşmamalı, geceyi bozmamalı
    if (!(fakeChanceFor(LAST) > fakeChanceFor(1)))
      warn.push("sahte oranı gün boyunca artmıyor — kompozisyon ekseni ilerlemiyor");
    for (let d = 1; d <= LAST; d++) {
      if (fakeChanceFor(d) > CONFIG.fakeChanceMax + 1e-9)
        warn.push("gün " + d + ": sahte oranı tavanı aştı (" + fakeChanceFor(d).toFixed(3) + " > " + CONFIG.fakeChanceMax + ")");
      if (d > 1 && fakeChanceFor(d) < fakeChanceFor(d - 1) - 1e-9)
        warn.push("gün " + d + ": sahte oranı bir önceki günden AZALDI");
      if (nightFakeChance(d) > CONFIG.nightFakeRateCap + 1e-9)
        warn.push("gün " + d + ": gece sahte oranı nightFakeRateCap'i aştı");
      if (nightFakeChance(d) < fakeChanceFor(d) - 1e-9)
        warn.push("gün " + d + ": gece sahte oranı gündüzün altına düştü");
    }

    // (v) NÖBET SIKLIĞI geç oyunda artmalı (aynı uzunlukta pencerede daha çok nöbet)
    const lateFrom = CONFIG.nightDutyLateFromDay;
    let early = 0, late = 0;
    for (let d = 1; d < lateFrom; d++) if (isNightDutyDay(d)) early++;
    for (let d = lateFrom; d <= LAST; d++) if (isNightDutyDay(d)) late++;
    const earlyRate = early / Math.max(1, lateFrom - 1), lateRate = late / Math.max(1, LAST - lateFrom + 1);
    if (!(lateRate > earlyRate))
      warn.push("nöbet sıklığı geç oyunda artmıyor (erken %" + Math.round(earlyRate * 100) +
        " / geç %" + Math.round(lateRate * 100) + ")");

    // (vi) NİHAİ KURAL: tavan bağlandıktan SONRAKİ her gün için en az bir eksen hâlâ hareketli mi
    for (let d = Math.max(2, capHitDay || 2); d <= LAST; d++) {
      const moved = missRateFor(d) < missRateFor(d - 1) - 1e-9 ||
                    fakeChanceFor(d) > fakeChanceFor(d - 1) + 1e-9 ||
                    nightDutyEveryFor(d) < nightDutyEveryFor(d - 1);
      if (!moved) warn.push("gün " + d + ": hiçbir zorluk ekseni ilerlemiyor (düz plato)");
    }
  }

  // 0d2) REÇETE GARANTİLERİ — her günde ≥1 gerçek reçete; 2. günden itibaren ≥1 sahte
  for (let d = 1; d <= days; d++) {
    const sch = getDaySchedule(d);
    const rx = sch.patients.filter(p => p.request.type === "prescription");
    if (!rx.some(p => !p.request.fake) && !sch.patients.some(p => p.request.type === "medula"))
      warn.push("Gün " + d + ": günde hiç GERÇEK reçete yok");
    if (d >= 2 && !rx.some(p => p.request.fake))
      warn.push("Gün " + d + ": günde hiç SAHTE reçete yok (2. günden itibaren en az 1 olmalı)");
    // aşırı adet artık kusur değil: yüksek adetli GERÇEK reçete olabilmeli, ceza olmamalı
    for (const p of rx) {
      if (!p.request.fake && (p.request.flaws || []).length)
        warn.push("Gün " + d + ": gerçek reçetede kusur bayrağı var");
      if ((p.request.flaws || []).indexOf("overdose") >= 0)
        warn.push("Gün " + d + ": 'overdose' kusuru hâlâ üretiliyor (kaldırılmalıydı)");
    }
  }

  // 0d3) MEDULA kuralları — terminal AÇIKKEN üretilen günler üzerinden
  {
    const prevUp3 = game.upgrades;
    game.upgrades = allLevels(x => x.id === "medula" ? x.maxLevel : 1);
    invalidateDaySchedules();
    let mtot = 0;
    for (let d = 1; d <= days; d++) {
      const sch = getDaySchedule(d);
      const med = sch.patients.filter(p => p.request.type === "medula");
      mtot += med.length;
      const seen = {};
      for (const p of med) {
        const code = p.request.code;
        // kod biçimi
        if (typeof code !== "string" || code.length !== CONFIG.medulaCodeLen)
          warn.push("Gün " + d + ": Medula kodu " + CONFIG.medulaCodeLen + " karakter değil: " + JSON.stringify(code));
        else {
          if (code.charAt(0) !== "2") warn.push("Gün " + d + ": Medula kodu '2' ile başlamıyor: " + code);
          for (const ch of code) {
            if (MEDULA_ALPHABET.indexOf(ch) < 0)
              warn.push("Gün " + d + ": Medula kodunda yasak karakter '" + ch + "' (" + code + ")");
          }
        }
        // gün içinde benzersiz
        if (seen[code]) warn.push("Gün " + d + ": aynı Medula kodu iki hastada: " + code);
        seen[code] = true;
        // asla sahte olamaz
        if (p.request.fake) warn.push("Gün " + d + ": Medula hastası sahte işaretli (" + code + ")");
        if ((p.request.flaws || []).length) warn.push("Gün " + d + ": Medula isteğinde kusur bayrağı var");
        if (!p.request.items || !p.request.items.length) warn.push("Gün " + d + ": Medula isteğinde kalem yok (" + code + ")");
        if (!p.refValid) warn.push("Gün " + d + ": Medula hastası geçersiz sayılıyor (R'ye girmiyor)");
      }
    }
    if (medulaUnlocked() && mtot === 0) warn.push("Terminal açıkken gün 1.." + days + " içinde hiç Medula hastası üretilmedi");
    // Terminal KİLİTLİYKEN tek bir Medula hastası bile olmamalı
    game.upgrades = allLevels(() => 1);
    invalidateDaySchedules();
    let lockedM = 0;
    for (let d = 1; d <= days; d++) lockedM += getDaySchedule(d).patients.filter(p => p.request.type === "medula").length;
    if (lockedM > 0) warn.push("Terminal KİLİTLİ olmasına rağmen " + lockedM + " Medula hastası üretildi");
    // alacak defteri bütünlüğü: yazılan toplam = yatan + bekleyen
    if (!verifyMedulaLedger()) warn.push("Medula alacak defteri tutarları tutmuyor (yukarıdaki [medula] uyarısına bakın)");
    game.upgrades = prevUp3;
    invalidateDaySchedules();
  }

  // 0d4) ÇOK KALEMLİ SEMPTOM SABRI — 3 kalemli hasta 1 kalemliden KESİN olarak uzun
  // beklemeli ve bu, Bekleme Alanı seviyesinden bağımsız olmalı.
  {
    const prevUp4 = game.upgrades;
    for (const lv of [1, 2, 3]) {
      game.upgrades = allLevels(x => x.id === "bekleme" ? lv : 1);
      const mk = n => ({ type: "symptom", items: new Array(n).fill(0).map(() => ({ symptom: SYMPTOMS[0], qty: 1 })) });
      const p1 = effPatience() * symptomPatienceMul(mk(1));
      const p2 = effPatience() * symptomPatienceMul(mk(2));
      const p3 = effPatience() * symptomPatienceMul(mk(3));
      if (!(p3 > p1)) warn.push("Bekleme Lv" + lv + ": 3 kalemli semptom sabrı (" + p3.toFixed(1) + ") 1 kalemliden (" + p1.toFixed(1) + ") uzun değil");
      if (!(p2 > p1)) warn.push("Bekleme Lv" + lv + ": 2 kalemli semptom sabrı 1 kalemliden uzun değil");
      if (!(p3 > p2)) warn.push("Bekleme Lv" + lv + ": 3 kalemli semptom sabrı 2 kalemliden uzun değil");
      if (Math.abs(p3 / p1 - 1.5) > 1e-6) warn.push("Bekleme Lv" + lv + ": 3 kalem çarpanı 1.5 değil (" + (p3 / p1).toFixed(3) + ") — geliştirme çarpanı yerine geçmiş olabilir");
      // reçete/Medula sabrına dokunulmamalı
      if (symptomPatienceMul({ type: "prescription", items: [] }) !== 1) warn.push("Reçete hastasının sabrına kalem çarpanı uygulanıyor");
      if (symptomPatienceMul({ type: "medula", items: [] }) !== 1) warn.push("Medula hastasının sabrına kalem çarpanı uygulanıyor");
    }
    game.upgrades = prevUp4;
    invalidateDaySchedules();
  }

  // 0e) NÖBET kuralları
  if (nightFakeChance() > CONFIG.nightFakeRateCap + 1e-9)
    warn.push("Gece sahte oranı tavanı aşıyor: " + nightFakeChance().toFixed(3) + " > " + CONFIG.nightFakeRateCap);
  if (CONFIG.nightFakeRateCap > 0.6 + 1e-9)
    warn.push("Gece sahte tavanı %60'ı aşıyor — gecede en az %40 gerçek reçete kalmalı");
  for (let d = 1; d <= days; d++) {
    const sch = getDaySchedule(d);
    const nightPs = sch.patients.filter(p => p.night);
    if (isNightDutyDay(d)) {
      if (sch.nightN < CONFIG.nightPatientMin)
        warn.push("Gün " + d + " nöbetçi ama gece hastası " + sch.nightN + " (< " + CONFIG.nightPatientMin + ")");
      if (nightPs.length !== sch.nightN)
        warn.push("Gün " + d + ": night işaretli hasta sayısı (" + nightPs.length + ") nightN (" + sch.nightN + ") ile uyuşmuyor");
      const nightRx = nightPs.filter(p => p.request.type === "prescription" || p.request.type === "medula");
      if (!nightRx.some(p => !p.request.fake))
        warn.push("Gün " + d + " gece bölümünde hiç GERÇEK reçete yok (nöbet yalnız redden ibaret kalır)");
      if (sch.patients.slice(0, sch.dayN).some(p => p.night))
        warn.push("Gün " + d + ": gündüz bölümünde night:true hasta var (sıralama bozuk)");
    } else {
      if (nightPs.length)
        warn.push("Gün " + d + " nöbetçi DEĞİL ama " + nightPs.length + " gece hastası var");
      if (sch.nightN !== 0) warn.push("Gün " + d + " nöbetçi değil ama nightN=" + sch.nightN);
    }
  }

  // 1..4) üretilmiş günlerdeki her hasta
  for (let d = 1; d <= days; d++) {
    const sch = getDaySchedule(d);
    for (let i = 0; i < sch.patients.length; i++) {
      const tag = "Gün " + d + " hasta #" + (i + 1) + ": ";
      const r = sch.patients[i].request;

      if (r.type === "symptom") {
        const items = r.items || [{ symptom: r.symptom, qty: 1 }];
        if (!items.length) { warn.push(tag + "semptom isteğinde hiç kalem yok"); continue; }
        if (items.length > 3) warn.push(tag + "semptom isteğinde " + items.length + " kalem (en fazla 3 olmalı)");
        // (i) her kalem FARKLI kategoriden olmalı
        const cats = items.map(it => it.symptom.category);
        if (new Set(cats).size !== cats.length)
          warn.push(tag + "çok kalemli semptom isteğinde AYNI kategoriden iki kalem var: " + cats.join(", "));
        // (ii) her kalem için o kategoride en az bir ilaç olmalı + adet 1..2
        for (const it of items) {
          const cands = MEDICINES.filter(m => m.category === it.symptom.category);
          if (!cands.length) warn.push(tag + "semptom '" + it.symptom.label + "' için hiç ilaç yok (kategori: " + it.symptom.category + ")");
          if (!(it.qty === 1 || it.qty === 2)) warn.push(tag + "semptom kaleminde geçersiz adet: " + it.qty + " (1 veya 2 olmalı)");
        }
        if (!r.line) warn.push(tag + "semptom isteğinde konuşma cümlesi (line) üretilmemiş");
        // (iii) TAM DOĞRU servis daima doğru sayılmalı — gerçek eşleşme koduyla sınanır
        const want = expectedCategoryList(r);
        for (const combo of symptomAnswerCombos(items)) {
          const got = combo.map(id => { const m = getMedicine(id); return m ? m.category : "?"; });
          if (!sameMultiset(want, got))
            warn.push(tag + "doğru servis yanlış sayılıyor: [" + combo.join(", ") + "] ↔ istenen [" + want.join(", ") + "]");
        }
        continue;
      }

      if (r.type === "medula") continue;   // Medula kuralları 0d3'te ayrıca sınanıyor

      // reçete: tam kalem+adet verilince eşleşme doğru olmalı
      const need = [];
      for (const it of r.items) for (let q = 0; q < it.qty; q++) need.push(it.id);
      if (!sameMultiset(need, need.slice().reverse()))
        warn.push(tag + "çoklu-küme karşılaştırması sıralamaya duyarlı");
      if (!r.items.length) warn.push(tag + "reçetede hiç kalem yok");
      for (const it of r.items) {
        if (!getMedicine(it.id)) warn.push(tag + "reçetede bilinmeyen ilaç id'si: " + it.id);
        if (!(it.qty >= 1)) warn.push(tag + "reçete kalemi geçersiz adet: " + it.id + "×" + it.qty);
      }

      if (r.fake) {
        // sahte => oyuncunun tespit edebileceği en az 1 kusur ŞART
        if (detectableFlawsOf(r).length === 0)
          warn.push(tag + "SAHTE ama tespit edilebilir kusuru yok (flaws=[" + (r.flaws || []).join(", ") +
            "], doktor=" + r.doctor + ", kaşe=" + r.hasStamp + ", imza=" + JSON.stringify(r.sig) + ", tarih=" + r.date + ")");
        // doktoru defterde olan sahte, yalnızca BAŞKA bir kusurla sahte sayılabilmeli
        if (bookNames.indexOf(r.doctor) >= 0 && (r.flaws || []).indexOf("fake_doctor") >= 0)
          warn.push(tag + "fake_doctor kusuru var ama doktor defterde: " + r.doctor);
      } else {
        // gerçek => hiçbir kusur bayrağı olmamalı ve kağıt temiz olmalı
        if (r.flaws && r.flaws.length) warn.push(tag + "GERÇEK ama kusur bayrağı var: [" + r.flaws.join(", ") + "]");
        const fl = detectableFlawsOf(r);
        if (fl.length) warn.push(tag + "GERÇEK reçetede kusur görünüyor: " + fl.join(" · "));
        if (bookNames.indexOf(r.doctor) < 0) warn.push(tag + "GERÇEK reçetenin doktoru defterde yok: " + r.doctor);
        // tarih o günün tarihi olmalı (önden üretimde damgalama doğru mu)
        const prevOv = _dateDayOverride; _dateDayOverride = d;
        const expDate = dateRx(0);
        _dateDayOverride = prevOv;
        if (r.date !== expDate) warn.push(tag + "GERÇEK reçete tarihi " + r.date + ", oysa o günün tarihi " + expDate);
      }
    }
  }

  for (const w of warn) console.warn("[self-test] " + w);
  return warn.length === 0;
}
selfTestPatients();
selfTestEmoji();

// --- Veri sağlık kontrolü: kategori eşleşmeleri (SADECE konsol; oyuncuya görünmez) ---
function checkDataHealth() {
  const medCats = new Set(MEDICINES.map(m => m.category));
  const symCats = new Set(SYMPTOMS.map(s => s.category));
  for (const cat of medCats) {
    if (!symCats.has(cat)) console.warn("[veri] Bu ilaç kategorisinin SYMPTOMS karşılığı yok:", cat);
  }
  for (const cat of symCats) {
    if (!medCats.has(cat)) console.warn("[veri] Bu semptom kategorisinin ilacı yok:", cat);
  }
}
checkDataHealth();

loadAssets();
resize();
game.spawnTimer = CONFIG.spawnInterval;
requestAnimationFrame(loop);

</script>
