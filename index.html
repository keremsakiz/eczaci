// Her emojiyi referans kutuya çizip GERÇEK glif kutusunu ölç: kutunun içinde mi,
// merkezde mi? Sapan varsa hangi emoji ve nerede kullanıldığı bildirilir.
function selfTestEmoji() {
  const warn = [];
  const box = 64;                    // referans kutu (ölçüm punto ile doğrusal ölçeklenir)
  const tol = box * 0.06;            // merkez sapma toleransı (~4 px)
  const seen = {};
  for (const e of allGameEmoji()) {
    if (seen[e.ch]) continue;
    seen[e.ch] = true;
    const m = emojiMetrics(e.ch, box, "400");
    if (!m) continue;                // tarayıcı actualBoundingBox vermiyorsa denetim atlanır
    const r = drawEmoji(e.ch, 0, 0, box, "#000");   // merkez (0,0) hedefli ölçüm çizimi
    if (!r) continue;
    const ccx = r.x + r.w / 2, ccy = r.y + r.h / 2;
    if (Math.abs(ccx) > tol || Math.abs(ccy) > tol) {
      warn.push("Emoji '" + e.ch + "' kutusunda ortalanmıyor (sapma x=" + ccx.toFixed(1) +
        " y=" + ccy.toFixed(1) + " px, tolerans " + tol.toFixed(1) + ") — kullanıldığı yer: " + e.where);
    }
    if (r.w > box + 0.5 || r.h > box + 0.5) {
      warn.push("Emoji '" + e.ch + "' kutuya sığmıyor (" + r.w.toFixed(1) + "×" + r.h.toFixed(1) +
        " > " + box + ") — kullanıldığı yer: " + e.where);
    }
  }
  for (const w of warn) console.warn("[emoji] " + w);
  return warn.length === 0;
}

// =====================================================================
//  KALICI SELF-TEST — boot'ta sessiz çalışır, yalnız sorun varsa console.warn
// =====================================================================
// Üretilmiş gün 1..10'daki HER hastayı gerçek eşleşme koduyla sınar.
function selfTestPatients(days) {
  return withRunSeed(TEST_RUN_SEED, function () { return selfTestPatientsInner(days); });
}
function selfTestPatientsInner(days) {
  days = days || 10;
  const warn = [];
  const bookNames = KNOWN_DOCTORS.map(d => d.name);

  // 0) taksonomi: kategori ↔ sekme 1:1 olmalı (aynı sekmede iki kategori = doğru ilaç yanlış sayılır)
  const catToGroups = {};
  for (const m of MEDICINES) (catToGroups[m.category] = catToGroups[m.category] || new Set()).add(m.group);
  const groupToCats = {};
  for (const m of MEDICINES) (groupToCats[m.group] = groupToCats[m.group] || new Set()).add(m.category);
  for (const c in catToGroups) if (catToGroups[c].size > 1)
    warn.push("Kategori '" + c + "' birden çok sekmeye dağılmış: " + [...catToGroups[c]].join(", "));
  for (const g in groupToCats) if (groupToCats[g].size > 1)
    warn.push("Sekme '" + g + "' birden çok kategori taşıyor (" + [...groupToCats[g]].join(" | ") +
      ") — aynı sekmedeki doğru görünen ilaç yanlış sayılır");

  // 0b) doktor adları ayırt edilebilir mi (ad aynı + soyad öneki = oyuncu ayıramaz)
  for (const f of FAKE_DOCTORS) {
    const fb = f.name.replace("Dr. ", ""), ff = fb.split(" ")[0], fl = fb.slice(ff.length + 1);
    for (const k of bookNames) {
      const kb = k.replace("Dr. ", ""), kf = kb.split(" ")[0], kl = kb.slice(kf.length + 1);
      if (fb === kb) warn.push("Sahte doktor '" + f.name + "' defterde de var — ayırt edilemez");
      else if (ff === kf && (fl.startsWith(kl) || kl.startsWith(fl)))
        warn.push("Sahte doktor '" + f.name + "' ile defterdeki '" + k + "' ad aynı + soyad öneki — ayırt edilemez");
    }
  }

  // 0c) geliştirmeler: her seviye geçerli efektif değer üretmeli, maks seviyede satın alma yok
  const prevUp = game.upgrades, prevMoney = game.money;
  for (const u of UPGRADES) {
    if (!(u.maxLevel >= 2)) warn.push("Geliştirme '" + u.id + "' maxLevel geçersiz: " + u.maxLevel);
    if (u.costK.length !== u.maxLevel - 1) warn.push("Geliştirme '" + u.id + "' costK uzunluğu (" + u.costK.length + ") satın alma sayısı (maxLevel-1 = " + (u.maxLevel - 1) + ") ile uyuşmuyor");
    let prevCost = -1;
    for (let lv = 1; lv <= u.maxLevel; lv++) {
      game.upgrades = allLevels(x => x.id === u.id ? lv : 1);
      const vals = { tezgah: effMaxQueue(), depo: effMaxStock(), vitrin: effPrescriptionChance(), bekleme: effPatience(), medula: medulaUnlocked() ? 1 : 0 };
      for (const k in vals) {
        const v = vals[k];
        if (typeof v !== "number" || !isFinite(v) || v < 0)
          warn.push("Geliştirme '" + u.id + "' Lv" + lv + " geçersiz efektif değer (" + k + "=" + v + ")");
      }
      if (effMaxQueue() < 1) warn.push("'" + u.id + "' Lv" + lv + ": kuyruk kapasitesi 1'in altına düştü");
      if (effMaxStock() < CONFIG.startStock) warn.push("'" + u.id + "' Lv" + lv + ": stok tavanı başlangıç stoğunun altına düştü");
      if (effPatience() <= 0) warn.push("'" + u.id + "' Lv" + lv + ": sabır süresi pozitif değil");
      if (patientLimitFor(1) < 1) warn.push("'" + u.id + "' Lv" + lv + ": gün 1 müşteri sayısı 1'in altına düştü");
      if (typeof u.valueAt(lv) !== "string" || !u.valueAt(lv)) warn.push("'" + u.id + "' Lv" + lv + ": etki metni üretilemedi");
      if (lv < u.maxLevel) {
        const cost = upgradeCost(u.id, lv + 1);
        if (!(cost > 0)) warn.push("'" + u.id + "' Lv" + (lv + 1) + " fiyatı geçersiz: " + cost);
        if (cost <= prevCost) warn.push("'" + u.id + "' Lv" + (lv + 1) + " fiyatı bir öncekinden yüksek değil (" + prevCost + " → " + cost + ")");
        prevCost = cost;
      } else {
        // maks seviyede satın alma DENENEMEZ olmalı
        game.money = 9e9;
        if (buyUpgrade(u.id) !== false) warn.push("'" + u.id + "' maks seviyedeyken satın alınabildi");
        if (upgradeLevel(u.id) !== u.maxLevel) warn.push("'" + u.id + "' maks seviyede satın alma seviyeyi değiştirdi");
        if (upgradeCost(u.id, u.maxLevel + 1) !== 0) warn.push("'" + u.id + "' maks üstü seviye için fiyat üretiliyor");
      }
    }
  }
  game.upgrades = prevUp; game.money = prevMoney;
  invalidateDaySchedules();

  // 0c2) GÜN BÜYÜKLÜĞÜ TAVANI + GEÇ OYUN KOMPOZİSYON EĞRİSİ
  // Ana kural: 30 günün TAMAMI boyunca en az bir eksen ilerlemeli. Tavan müşteri
  // sayısını dondurduğu için ilerlemeyi kompozisyon eksenleri taşır (sahte oranı,
  // izinli hata, nöbet sıklığı). Bu blok o eksenlerin gerçekten ilerlediğini denetler.
  {
    const cap = CONFIG.maxPatientsPerDay;
    const LAST = CONFIG.seasonDays;        // SEZON uzunluğu — eğriler bu ufukta tamamlanmalı
    if (!(LAST >= 2)) warn.push("CONFIG.seasonDays geçersiz: " + LAST);

    // (0) SEZON ↔ EĞRİ UYUMU: hiçbir zorluk ekseni sezon BİTMEDEN doymamalı, ve her eksen
    // sezonun İÇİNDE devreye girmeli. Sezon uzunluğu değişirse buradan haber alınır.
    if (CONFIG.missRateFloorDay < LAST)
      warn.push("missRateFloorDay (" + CONFIG.missRateFloorDay + ") sezondan kısa (" + LAST +
        " gün) — izinli hata ekseni sezon bitmeden tabana oturuyor");
    if (fakeChanceFor(LAST) >= CONFIG.fakeChanceMax - 1e-9)
      warn.push("sahte oranı rampası sezon içinde tavana oturuyor (gün " + LAST + ": " +
        fakeChanceFor(LAST).toFixed(3) + " ≥ fakeChanceMax " + CONFIG.fakeChanceMax + ")");
    if (!(CONFIG.nightDutyLateFromDay < LAST))
      warn.push("nightDutyLateFromDay (" + CONFIG.nightDutyLateFromDay + ") sezonun (" + LAST +
        " gün) içinde değil — nöbet sıklığı hiç artmıyor");
    {
      let lateNights = 0;
      for (let d = CONFIG.nightDutyLateFromDay; d <= LAST; d++) if (isNightDutyDay(d)) lateNights++;
      if (lateNights < 2)
        warn.push("sezonun geç bölümünde (" + CONFIG.nightDutyLateFromDay + "–" + LAST +
          ") yalnız " + lateNights + " nöbet günü var — artan sıklık pratikte görünmüyor");
    }

    if (!(cap >= CONFIG.patientsPerDayBase))
      warn.push("maxPatientsPerDay (" + cap + ") gün 1 müşteri sayısının (" + CONFIG.patientsPerDayBase + ") altında");

    // (i) tavan bağlayıcı, aşılamıyor, dizi hiç azalmıyor
    let capHitDay = null, prevN = 0;
    for (let d = 1; d <= 40; d++) {
      const n = patientLimitFor(d);
      if (n > cap) warn.push("gün " + d + ": müşteri sayısı tavanı aştı (" + n + " > " + cap + ")");
      if (n < prevN) warn.push("gün " + d + ": müşteri sayısı bir önceki günden AZALDI (" + prevN + " → " + n + ")");
      if (n >= cap && capHitDay === null) capHitDay = d;
      prevN = n;
    }
    if (capHitDay === null) warn.push("maxPatientsPerDay (" + cap + ") 40 gün içinde hiç devreye girmiyor — tavan işlevsiz");

    // (ii) VİTRİN müşteri sayısına DOKUNMAMALI (yeni işlevi karışım) ve payı floor'u delmemeli
    const prevUp2 = game.upgrades;
    const nAtLv = [];
    for (const lv of [1, UPGRADE_BY_ID.vitrin.maxLevel]) {
      game.upgrades = allLevels(x => x.id === "vitrin" ? lv : 1);
      invalidateDaySchedules();
      nAtLv.push([5, 15, 30].map(d => patientLimitFor(d)).join(","));
    }
    game.upgrades = prevUp2; invalidateDaySchedules();
    if (nAtLv[0] !== nAtLv[1])
      warn.push("Vitrin hâlâ müşteri SAYISINI değiştiriyor (Lv1: " + nAtLv[0] + " / Lv3: " + nAtLv[1] + ")");
    let prevShare = -1;
    for (let lv = 1; lv <= UPGRADE_BY_ID.vitrin.maxLevel; lv++) {
      const sh = vitrinRxShare(lv);
      if (1 - sh < CONFIG.vitrinSymptomFloor - 1e-9)
        warn.push("Vitrin Lv" + lv + ": semptomlu payı tabanın altına indi (%" + Math.round((1 - sh) * 100) + " < %" + Math.round(CONFIG.vitrinSymptomFloor * 100) + ")");
      if (sh <= prevShare)
        warn.push("Vitrin Lv" + lv + ": reçeteli payı bir önceki seviyeden yüksek değil — geliştirme ölü");
      prevShare = sh;
    }

    // (iii) İZİNLİ HATA ekseni kampanya boyunca daralmalı — tabana LAST'tan önce oturmamalı
    if (!(missRateFor(LAST - 1) > CONFIG.missRateFloor))
      warn.push("missRate " + (LAST - 1) + ". günden önce tabana oturuyor (missRateFloorDay=" +
        CONFIG.missRateFloorDay + ") — geç oyunda hata toleransı ekseni ilerlemiyor");
    if (!(missRateFor(1) > missRateFor(LAST)))
      warn.push("missRate hiç daralmıyor");

    // (iv) SAHTE ORANI ekseni artmalı, tavanı aşmamalı, geceyi bozmamalı
    if (!(fakeChanceFor(LAST) > fakeChanceFor(1)))
      warn.push("sahte oranı gün boyunca artmıyor — kompozisyon ekseni ilerlemiyor");
    for (let d = 1; d <= LAST; d++) {
      if (fakeChanceFor(d) > CONFIG.fakeChanceMax + 1e-9)
        warn.push("gün " + d + ": sahte oranı tavanı aştı (" + fakeChanceFor(d).toFixed(3) + " > " + CONFIG.fakeChanceMax + ")");
      if (d > 1 && fakeChanceFor(d) < fakeChanceFor(d - 1) - 1e-9)
        warn.push("gün " + d + ": sahte oranı bir önceki günden AZALDI");
      if (nightFakeChance(d) > CONFIG.nightFakeRateCap + 1e-9)
        warn.push("gün " + d + ": gece sahte oranı nightFakeRateCap'i aştı");
      if (nightFakeChance(d) < fakeChanceFor(d) - 1e-9)
        warn.push("gün " + d + ": gece sahte oranı gündüzün altına düştü");
      if (d > 1 && nightFakeChance(d) < nightFakeChance(d - 1) - 1e-9)
        warn.push("gün " + d + ": gece sahte oranı bir önceki günden AZALDI");
    }
    // GECE KOMPOZİSYON EKSENİ İLERLEMELİ. Eski çarpanlı hâlde gece oranı 1. günden
    // beri tavandaydı ve bu kontrol olsaydı o hatayı yakalardı — o yüzden buraya kondu.
    const nFirst = nightFakeChance(1), nLast = nightFakeChance(LAST);
    if (!(nLast > nFirst + 1e-9))
      warn.push("gece sahte oranı sezon boyunca ilerlemiyor (gün 1 " + nFirst.toFixed(3) +
                " → gün " + LAST + " " + nLast.toFixed(3) + ") — nöbet sıklaşıyor ama zorlaşmıyor");
    // Gece hep gündüzden zor olmalı (fark hiçbir gün kapanmamalı)
    for (let d = 1; d <= LAST; d++) {
      if (nightFakeChance(d) <= fakeChanceFor(d) + 1e-9)
        warn.push("gün " + d + ": gece ile gündüz sahte oranı eşitlendi — nöbetin farkı kalmadı");
    }

    // (v) NÖBET SIKLIĞI geç oyunda artmalı (aynı uzunlukta pencerede daha çok nöbet)
    const lateFrom = CONFIG.nightDutyLateFromDay;
    let early = 0, late = 0;
    for (let d = 1; d < lateFrom; d++) if (isNightDutyDay(d)) early++;
    for (let d = lateFrom; d <= LAST; d++) if (isNightDutyDay(d)) late++;
    const earlyRate = early / Math.max(1, lateFrom - 1), lateRate = late / Math.max(1, LAST - lateFrom + 1);
    if (!(lateRate > earlyRate))
      warn.push("nöbet sıklığı geç oyunda artmıyor (erken %" + Math.round(earlyRate * 100) +
        " / geç %" + Math.round(lateRate * 100) + ")");

    // (vi) NİHAİ KURAL: tavan bağlandıktan SONRAKİ her gün için en az bir eksen hâlâ hareketli mi
    for (let d = Math.max(2, capHitDay || 2); d <= LAST; d++) {
      const moved = missRateFor(d) < missRateFor(d - 1) - 1e-9 ||
                    fakeChanceFor(d) > fakeChanceFor(d - 1) + 1e-9 ||
                    nightDutyEveryFor(d) < nightDutyEveryFor(d - 1);
      if (!moved) warn.push("gün " + d + ": hiçbir zorluk ekseni ilerlemiyor (düz plato)");
    }
  }

  // 0c3) FİYAT GÜNCELLEMELERİ
  // (i) BANT: sezon sonunda hiçbir ilaç priceDriftMin..priceDriftMax dışına çıkmamalı.
  // (ii) DETERMİNİZM: aynı koşu + aynı gün aynı fiyatı vermeli (cache temizlense de).
  // (iii) SABİTLER: geliştirme fiyatı ve startMoney fiyat turlarından ETKİLENMEMELİ.
  // (iv) MARJ RAYI: güncel satış hiçbir gün güncel alışın altına düşmemeli.
  {
    const LAST_S = CONFIG.seasonDays;
    if (!(CONFIG.priceDriftMin > 0 && CONFIG.priceDriftMin < 1))
      warn.push("priceDriftMin bandı geçersiz: " + CONFIG.priceDriftMin);
    if (!(CONFIG.priceDriftMax > 1))
      warn.push("priceDriftMax bandı geçersiz: " + CONFIG.priceDriftMax);
    if (isPriceUpdateDay(1)) warn.push("gün 1 fiyat güncelleme günü olmamalı (öğretici gün)");
    let rounds = 0;
    for (let d = 1; d <= LAST_S; d++) if (isPriceUpdateDay(d)) rounds++;
    if (rounds < 2)
      warn.push("sezonda yalnız " + rounds + " fiyat turu var (priceUpdateEvery=" +
        CONFIG.priceUpdateEvery + ") — sistem karar üretmiyor");

    for (let d = 1; d <= LAST_S; d++) {
      const st = priceStateFor(d);
      const prevOv = _dateDayOverride;
      _dateDayOverride = d;
      try {
        for (const m of MEDICINES) {
          const mu = st.mul[m.id];
          if (!mu) { warn.push("gün " + d + ": '" + m.id + "' için fiyat çarpanı yok"); continue; }
          for (const [k, v] of [["satış", mu.p], ["alış", mu.c]]) {
            if (!(v >= CONFIG.priceDriftMin - 1e-9 && v <= CONFIG.priceDriftMax + 1e-9))
              warn.push("gün " + d + ": '" + m.name + "' " + k + " çarpanı bandın dışına çıktı (" +
                v.toFixed(4) + " ∉ [" + CONFIG.priceDriftMin + ", " + CONFIG.priceDriftMax + "])");
            if (!isFinite(v) || v <= 0)
              warn.push("gün " + d + ": '" + m.name + "' " + k + " çarpanı geçersiz: " + v);
          }
          if (medPrice(m) < medCost(m))
            warn.push("gün " + d + ": '" + m.name + "' ZARARINA satılıyor (satış " + medPrice(m) +
              "₺ < alış " + medCost(m) + "₺) — priceMinMargin rayı tutmuyor");
        }
      } finally { _dateDayOverride = prevOv; }
    }

    // (ii) determinizm: cache'i temizleyip aynı günü yeniden türet, birebir aynı olmalı
    {
      const before = JSON.stringify(priceStateFor(LAST_S).mul);
      invalidatePriceStates();
      const after = JSON.stringify(priceStateFor(LAST_S).mul);
      if (before !== after)
        warn.push("fiyat durumu deterministik değil: aynı koşu + gün " + LAST_S + " iki farklı sonuç verdi");
    }

    // (v) MARJ RAYININ YAN ETKİSİ. priceMinMargin rayı satışı yukarı / alışı aşağı
    // ittiği için ASİMETRİKTİR: adımlar simetrik olsa bile ortalama marjı yukarı şişirir.
    // ÖLÇÜLDÜ: priceStepMax 0.22'de şişme +0,23 puan (ihmal edilebilir), 0.35'te +1,64,
    // 0.50'de +3,17 puan — yani büyük adım sezon skorunu enflasyonla yukarı çeker ve
    // "yüksek skor" beceriden değil ayardan gelir. Ray %1 puanı aşarsa haber ver.
    // TEK tohumla ölçmek gürültülüydü (ölçüldü: 200 tohumda ortalama ≈ 0 puan ama tohumların
    // ~%35'i tek başına %1'i aşıyor) — kategori eklemek bile uyarıyı açıp kapatıyordu.
    // Artık 24 koşu tohumunun ortalaması ölçülür; ray gerçekten asimetrikse ortalama da kayar.
    {
      let base = 0, endM = 0, k = 0;
      const prevOv = _dateDayOverride, prevSeed = game.runSeed;
      try {
        for (let sd = 1; sd <= 24; sd++) {
          game.runSeed = sd * 7919;
          invalidatePriceStates();
          _dateDayOverride = LAST_S;
          for (const m of MEDICINES) {
            base += 1 - m.cost / m.price;
            endM += 1 - medCost(m) / medPrice(m);
            k++;
          }
        }
      } finally { _dateDayOverride = prevOv; game.runSeed = prevSeed; invalidatePriceStates(); }
      const drift = (endM - base) / Math.max(1, k);
      if (drift > 0.01)
        warn.push("marj rayı ortalama kâr oranını " + (drift * 100).toFixed(2) +
          " puan şişiriyor (priceStepMax=" + CONFIG.priceStepMax +
          ") — skor beceriden değil ayardan geliyor; adımı küçült ya da rayı gözden geçir");
    }

    // (iii) sabitler: fiyat turları geliştirme fiyatını ve startMoney'yi oynatmamalı
    {
      const upgBefore = UPGRADES.map(u => upgradeCost(u.id, 2)).join(",");
      const smBefore = CONFIG.startMoney;
      const prevOv = _dateDayOverride;
      _dateDayOverride = LAST_S;               // sezon sonu fiyatlarıyla bak
      const upgAfter = UPGRADES.map(u => upgradeCost(u.id, 2)).join(",");
      _dateDayOverride = prevOv;
      if (upgBefore !== upgAfter)
        warn.push("geliştirme fiyatları fiyat turlarından etkileniyor (" + upgBefore + " → " +
          upgAfter + ") — oyuncu plan yapamaz");
      if (CONFIG.startMoney !== smBefore)
        warn.push("startMoney fiyat turlarından etkilendi");
      const avgNow = MEDICINES.reduce((a, m) => a + m.price, 0) / MEDICINES.length;
      if (Math.abs(avgNow - avgPrice) > 1e-9)
        warn.push("MEDICINES taban fiyatları runtime'da DEĞİŞTİRİLMİŞ — avgPrice artık tabanı temsil etmiyor");
    }
  }

  // 0c5) KARİYER
  // (i) BEDEL FORMÜLÜ: 1. sezon bedelsiz, sonra kesin artan ve sonlu.
  // (ii) DEVREDENLER/DEVRETMEYENLER: sezon geçişinde ne taşınıyor, ne sıfırlanıyor.
  // (iii) ALACAK DEFTERİ: sezon geçişi bir kuruş kaybetmemeli (vade yeniden tabanlanıyor).
  // (iv) PEAK: monoton, sezonlar arası korunuyor.
  {
    if (seasonFeeFor(1) !== 0) warn.push("1. sezon bedelsiz olmalı, " + seasonFeeFor(1) + "₺ hesaplandı");
    if (!(CONFIG.seasonFeeGrowth > 1))
      warn.push("seasonFeeGrowth 1'den büyük olmalı (" + CONFIG.seasonFeeGrowth + ") — bedel büyümezse kariyer hiç bitmez");
    if (!(CONFIG.seasonFeeBase > 0))
      warn.push("seasonFeeBase türetilmemiş: " + CONFIG.seasonFeeBase);
    let prevFee = -1;
    for (let n = 2; n <= 20; n++) {
      const f = seasonFeeFor(n);
      if (!isFinite(f) || f <= 0) warn.push("sezon " + n + " bedeli geçersiz: " + f);
      if (f <= prevFee) warn.push("sezon " + n + " bedeli bir öncekinden yüksek değil (" + prevFee + " → " + f + ")");
      prevFee = f;
    }

    // Canlı state ile oynayacağız: önce yedekle, sonunda geri koy.
    const bak = {
      career: game.career, careerResult: game.careerResult, money: game.money,
      rep: game.reputation, day: game.dayNumber, upg: game.upgrades, stock: game.stock,
      rec: game.receivables, booked: game.medulaBooked, collected: game.medulaCollected,
      state: game.state, seed: game.runSeed, sStats: game.seasonStats, sRes: game.seasonResult,
      dStats: game.dayStats, folded: game.dayFolded, sched: game.daySchedule,
      queue: game.queue, counter: game.counter, hasRun: game.hasRun, fee: game.seasonFeePaid,
      revealed: game.medulaRevealed, beggarDay: game.beggarDay
    };
    try {
      startNewCareer();
      game.money = 500000;                       // bedel kesin ödenebilsin
      game.upgrades.depo = 3;                    // devretmesi gerekenler işaretlensin
      game.stock[MEDICINES[0].id] = 7;
      game.receivables = [{ dueDay: CONFIG.seasonDays + 1, amount: 1234 }];
      game.medulaBooked = 1234;
      game.reputation = 12;                      // sezona özel: DEVRETMEMELİ
      game.dayNumber = CONFIG.seasonDays;
      const beforeMoney = game.money, beforeSeed = game.runSeed;
      const beforeLedger = game.medulaBooked - (game.medulaCollected + pendingReceivables());
      const fee2 = effSeasonFeeFor(2);   // fiilen ödenen (Mali Müşavir indirimi dahil)
      beginSeason(2);
      if (game.career.season !== 2) warn.push("beginSeason sezon numarasını ilerletmedi");
      if (game.dayNumber !== 1) warn.push("yeni sezon 1. günden başlamadı: " + game.dayNumber);
      if (game.reputation !== CONFIG.startReputation)
        warn.push("itibar yeni sezonda başlangıç değerine dönmedi: " + game.reputation);
      if (upgradeLevel("depo") !== 3) warn.push("geliştirme seviyesi sezonlar arası DEVRETMEDİ");
      if ((game.stock[MEDICINES[0].id] || 0) < 7 - 3)
        warn.push("stok sezonlar arası devretmedi (" + game.stock[MEDICINES[0].id] + ")");
      // kasa: bedel düştü + devreden alacak yattı
      if (game.money !== beforeMoney - fee2 + 1234)
        warn.push("sezon geçişinde kasa beklenenden farklı: " + game.money +
          " (beklenen " + (beforeMoney - fee2 + 1234) + " = " + beforeMoney + " − bedel " + fee2 + " + alacak 1234)");
      const afterLedger = game.medulaBooked - (game.medulaCollected + pendingReceivables());
      if (Math.abs(afterLedger - beforeLedger) > 0.5)
        warn.push("sezon geçişi SGK defterini bozdu (fark " + Math.round(afterLedger - beforeLedger) + "₺)");
      if (game.receivables.length)
        warn.push("31. güne yazılı alacak yeni sezonda tahsil edilmedi — vade yeniden tabanlanmıyor");
      if (game.runSeed === beforeSeed)
        warn.push("yeni sezon aynı tohumla başladı — 30 gün birebir tekrarlanır");
      if (game.seasonStats.served !== 0) warn.push("sezon istatistiği yeni sezonda sıfırlanmadı");
      if (game.seasonFeePaid !== fee2) warn.push("ödenen bedel kaydedilmedi");
      // peak: monoton ve sezonlar arası korunur
      const peak = game.career.peakMoney;
      game.money = 1;
      updateCareerPeak();
      if (game.career.peakMoney !== peak) warn.push("peak kasa düştü — monoton olmalı");
      // bedel ödenemezse kariyer biter
      game.money = 0;
      const ok2 = tryStartNextSeason();
      if (ok2 !== false) warn.push("bedel ödenemezken yeni sezon başlatılabildi");
      if (game.state !== STATE.CAREEREND) warn.push("bedel ödenemedi ama kariyer sonu ekranına geçilmedi");
      if (!game.careerResult || game.careerResult.reason !== "fee")
        warn.push("kariyer bitiş sebebi 'fee' değil: " + (game.careerResult && game.careerResult.reason));
      const cres = game.careerResult;
      for (const k of ["version", "reason", "seasonsCompleted", "seasonsPlayed", "score",
                       "finalMoney", "unpaidFee", "totalFeePaid", "daysPlayed", "served",
                       "correct", "wrong", "earned", "bestSeason", "seasons", "careerSeed"])
        if (!(k in cres)) warn.push("careerResult'ta '" + k + "' alanı yok");
      try { JSON.parse(JSON.stringify(cres)); }
      catch (e) { warn.push("careerResult JSON-serileşmiyor: " + e.message); }
      if (cres.score < cres.finalMoney)
        warn.push("kariyer skoru (peak) bitiş kasasının altında — peak yanlış izleniyor");
    } finally {
      game.career = bak.career; game.careerResult = bak.careerResult; game.money = bak.money;
      game.reputation = bak.rep; game.dayNumber = bak.day; game.upgrades = bak.upg;
      game.stock = bak.stock; game.receivables = bak.rec; game.medulaBooked = bak.booked;
      game.medulaCollected = bak.collected; game.state = bak.state; game.runSeed = bak.seed;
      game.seasonStats = bak.sStats; game.seasonResult = bak.sRes; game.dayStats = bak.dStats;
      game.dayFolded = bak.folded; game.daySchedule = bak.sched; game.queue = bak.queue;
      game.counter = bak.counter; game.hasRun = bak.hasRun; game.seasonFeePaid = bak.fee;
      game.medulaRevealed = bak.revealed; game.beggarDay = bak.beggarDay;
      invalidateDaySchedules(); invalidateBeggarPlans();
    }
  }

  // 0c6) İŞLETME KATMANI — sezon kilidi ve etkilerin SIZMAMASI
  {
    const t2 = UPGRADES.filter(u => (u.tier || 1) >= 2);
    if (!t2.length) warn.push("İŞLETME katmanında hiç kalem yok — geliştirme ağacı 2. sezondan sonra ölü kalır");
    const prevUp6 = Object.assign({}, game.upgrades);
    const prevCareer = game.career;
    const prevMoney6 = game.money;

    for (const u of t2) {
      if (!(u.unlockSeason >= 2))
        warn.push(u.id + ": İŞLETME kalemi 1. sezonda açık — katmanın anlamı sezonla açılması");
      if (u.costK.length !== u.maxLevel - 1)
        warn.push(u.id + ": costK uzunluğu maxLevel-1 değil");
      // sezon kilidi GERÇEKTEN satın almayı engelliyor mu
      game.career = { seed: 1, season: 1, completed: 0, peakMoney: 0, totals: newCareerTotals(), seasons: [] };
      game.money = 10000000;
      game.upgrades[u.id] = 1;
      if (buyUpgrade(u.id) !== false)
        warn.push(u.id + ": 1. sezonda satın alınabildi — sezon kilidi çalışmıyor");
      game.career.season = u.unlockSeason;
      if (buyUpgrade(u.id) !== true)
        warn.push(u.id + ": açılış sezonunda satın alınamadı");
    }

    // --- TOPTANCI: indirim YALNIZ depo sipariş ekranında geçerli olmalı ---
    // Sızarsa C, hedef ve yanlış servis zararı birlikte kayar; indirim oyuncuyu kendi
    // hatasından da korumaya başlar. Bu yüzden ayrı ve katı denetleniyor.
    game.career.season = 9;
    const m0 = MEDICINES[0];
    game.upgrades.toptanci = 1;
    const costPlain = medCost(m0), depotPlain = depotUnitCost(m0);
    invalidateDaySchedules();
    const goalPlain = getDaySchedule(5).goal, cPlain = getDaySchedule(5).C;
    game.upgrades.toptanci = 3;
    invalidateDaySchedules();
    if (medCost(m0) !== costPlain)
      warn.push("Toptancı indirimi medCost'a SIZDI: " + costPlain + " → " + medCost(m0));
    if (!(depotUnitCost(m0) < depotPlain))
      warn.push("Toptancı indirimi depo fiyatına yansımıyor");
    if (getDaySchedule(5).goal !== goalPlain || Math.abs(getDaySchedule(5).C - cPlain) > 0.5)
      warn.push("Toptancı indirimi hedef/C'yi değiştirdi — sipariş ekranıyla sınırlı kalmalı");
    game.upgrades.toptanci = 1;

    // --- NÖBET RUHSATI: gece cirosunu (dolayısıyla R ve hedefi) BÜYÜTMELİ ---
    // DİKKAT — TEK GÜN ÖLÇÜLMEZ. Konsantrasyon tavanı, payı aşan hastanın siparişini
    // yeniden üretir ve bu withSeed içinde RNG tüketir; çarpan değişince o günün
    // TAMAMI farklı üretilebilir. Tek günde R'nin düşmesi bu yüzden anlamlı bir sinyal
    // değildir (ölçüldü: bir günde 2160 → 1557, oysa toplamda gece cirosu +%34).
    // Değişmez sezon toplamında tanımlıdır.
    {
      const nightDays = [];
      for (let d = 2; d <= CONFIG.seasonDays; d++) if (isNightDutyDay(d)) nightDays.push(d);
      if (nightDays.length) {
        const sumNight = () => nightDays.reduce((a, d) => {
          const sch = getDaySchedule(d);
          return a + sch.patients.filter(p => p.night && p.refValid).reduce((x, p) => x + p.refRevenue, 0);
        }, 0);
        game.upgrades.nobet = 1; invalidateDaySchedules();
        const nPlain = sumNight();
        game.upgrades.nobet = 3; invalidateDaySchedules();
        const nBoost = sumNight();
        if (!(nBoost > nPlain))
          warn.push("Nöbet Ruhsatı sezon boyu gece cirosunu artırmıyor (" +
                    Math.round(nPlain) + "₺ → " + Math.round(nBoost) + "₺)");
        if (effNightPriceMul() <= CONFIG.nightPriceMultiplier)
          warn.push("effNightPriceMul seviyeyle artmıyor");
        game.upgrades.nobet = 1;
      }
    }

    // --- MALİ MÜŞAVİR: bedel indirimi TABAN formüle dokunmamalı ---
    game.upgrades.musavir = 1;
    const feeBase = seasonFeeFor(4), feePlain = effSeasonFeeFor(4);
    game.upgrades.musavir = 3;
    if (seasonFeeFor(4) !== feeBase)
      warn.push("Mali Müşavir indirimi seasonFeeFor'a SIZDI — taban formül saf kalmalı");
    if (!(effSeasonFeeFor(4) < feePlain))
      warn.push("Mali Müşavir indirimi ödenen bedele yansımıyor");
    if (effSeasonFeeFor(1) !== 0)
      warn.push("indirimle birlikte 1. sezon bedelsizliği bozuldu");
    game.upgrades.musavir = 1;

    game.upgrades = prevUp6;
    game.career = prevCareer;
    game.money = prevMoney6;
    invalidateDaySchedules();
  }

  // 0c4) DİLENCİ — günün programına SIZMAMALI
  {
    for (let d = 1; d <= days; d++) {
      const sch = getDaySchedule(d);
      if (sch.patients.some(p => p.request.type === "beggar"))
        warn.push("Gün " + d + ": dilenci gün listesine sızmış — N/R/C/hedef bozulur");
    }
    if (beggarPlanFor(1)) warn.push("gün 1'de dilenci geliyor (gelmemeli)");
    const b = makeBeggar();
    if (!b.bonus) warn.push("dilenci bonus işaretli değil — gün sonu sayacına ve hedefe karışır");
    if (b.request.fake !== undefined) warn.push("dilencide 'fake' alanı var — inceleme mantığına sızabilir");
    const rv = refValuesFor(b.request, 1);
    if (rv.valid || rv.rev !== 0 || rv.cost !== 0)
      warn.push("dilenci refValuesFor'da sıfır katkı vermiyor: " + JSON.stringify(rv));
    if (!(CONFIG.beggarMoneyGive > 0))
      warn.push("beggarMoneyGive türetilmemiş (deriveEconomy çalışmadı mı?): " + CONFIG.beggarMoneyGive);
    if (!(CONFIG.beggarRepGive > 0) || !(CONFIG.beggarRepReject > 0))
      warn.push("dilenci itibar değerleri geçersiz");
    // sabır: dilencinin sabır çarpanı devrede olmalı
    if (Math.abs(symptomPatienceMul(b.request) - CONFIG.beggarPatienceMul) > 1e-9)
      warn.push("dilencinin sabır çarpanı uygulanmıyor");
    // servis yolları kapalı mı
    const prevQ = game.queue;
    game.queue = [b];
    if (servingAllowed()) warn.push("dilenciye SATIŞ/servis yolu açık — kendi üç butonu olmalı");
    if (activeNeedsDecision()) warn.push("dilenci ONAYLA/REDDET (reçete inceleme) fazına giriyor");
    if (expectedMedicineIds().length) warn.push("dilencinin beklenen ilaç listesi boş değil");
    game.queue = prevQ;

    // --- GERİ ÖDEME ---
    if (!(CONFIG.beggarReturnMul > 1))
      warn.push("beggarReturnMul 1'den büyük olmalı (" + CONFIG.beggarReturnMul +
        ") — geri ödeme verilenin üstünde olmazsa yardım hep zarar");
    if (!(CONFIG.beggarReturnChance > 0 && CONFIG.beggarReturnChance <= 1))
      warn.push("beggarReturnChance geçersiz: " + CONFIG.beggarReturnChance);
    if (!(CONFIG.beggarReturnDelayMin >= 1) || !(CONFIG.beggarReturnDelayMax >= CONFIG.beggarReturnDelayMin))
      warn.push("geri dönüş gecikme aralığı geçersiz: " + CONFIG.beggarReturnDelayMin + "–" + CONFIG.beggarReturnDelayMax);
    if (CONFIG.beggarReturnDelayMax >= CONFIG.seasonDays)
      warn.push("beggarReturnDelayMax (" + CONFIG.beggarReturnDelayMax + ") sezon uzunluğuna yakın/eşit — " +
        "geri dönüşlerin çoğu sezon dışına taşar");
    // Borçlu da dilenci gibi hasta mantığının dışında olmalı
    const bp = makeBeggarPay({ dueDay: 1, amount: 100 });
    if (!bp.bonus) warn.push("borçlu bonus işaretli değil — hedefe/gün sonu sayacına karışır");
    if (bp.request.fake !== undefined) warn.push("borçluda 'fake' alanı var");
    const rv2 = refValuesFor(bp.request, 1);
    if (rv2.valid || rv2.rev !== 0 || rv2.cost !== 0)
      warn.push("borçlu refValuesFor'da sıfır katkı vermiyor: " + JSON.stringify(rv2));
    game.queue = [bp];
    if (servingAllowed()) warn.push("borçluya SATIŞ/servis yolu açık");
    if (activeNeedsDecision()) warn.push("borçlu reçete inceleme fazına giriyor");
    if (expectedMedicineIds().length) warn.push("borçlunun beklenen ilaç listesi boş değil");
    if (!activeBeggarPay()) warn.push("activeBeggarPay borçluyu tanımıyor");
    if (activeBeggar()) warn.push("activeBeggar borçluyu dilenci sanıyor — üç butonlu şerit açılır");
    game.queue = prevQ;
    // Zar deterministik olmalı: aynı gün + aynı tohum aynı sonucu vermeli
    {
      const prevRet = game.beggarReturns, prevDay = game.dayNumber;
      game.dayNumber = 5;
      game.beggarReturns = []; const r1 = scheduleBeggarReturn(100);
      game.beggarReturns = []; const r2 = scheduleBeggarReturn(100);
      if (JSON.stringify(r1) !== JSON.stringify(r2))
        warn.push("geri dönüş zarı deterministik değil (aynı gün iki farklı sonuç)");
      if (r1 && !(r1.amount > 100))
        warn.push("geri ödeme verilenin üstünde değil: " + r1.amount + " ≤ 100");
      if (r1 && !(r1.dueDay > 5)) warn.push("geri ödeme vadesi bugüne/geçmişe yazıldı: " + r1.dueDay);
      game.beggarReturns = prevRet; game.dayNumber = prevDay;
    }
  }

  // 0d2) REÇETE GARANTİLERİ — her günde ≥1 gerçek reçete; 2. günden itibaren ≥1 sahte
  for (let d = 1; d <= days; d++) {
    const sch = getDaySchedule(d);
    const rx = sch.patients.filter(p => p.request.type === "prescription");
    if (!rx.some(p => !p.request.fake) && !sch.patients.some(p => p.request.type === "medula"))
      warn.push("Gün " + d + ": günde hiç GERÇEK reçete yok");
    if (d >= 2 && !rx.some(p => p.request.fake))
      warn.push("Gün " + d + ": günde hiç SAHTE reçete yok (2. günden itibaren en az 1 olmalı)");
    // aşırı adet artık kusur değil: yüksek adetli GERÇEK reçete olabilmeli, ceza olmamalı
    for (const p of rx) {
      if (!p.request.fake && (p.request.flaws || []).length)
        warn.push("Gün " + d + ": gerçek reçetede kusur bayrağı var");
      if ((p.request.flaws || []).indexOf("overdose") >= 0)
        warn.push("Gün " + d + ": 'overdose' kusuru hâlâ üretiliyor (kaldırılmalıydı)");
    }
  }

  // 0d3) MEDULA kuralları — terminal AÇIKKEN üretilen günler üzerinden
  {
    const prevUp3 = game.upgrades;
    game.upgrades = allLevels(x => x.id === "medula" ? x.maxLevel : 1);
    invalidateDaySchedules();
    let mtot = 0;
    for (let d = 1; d <= days; d++) {
      const sch = getDaySchedule(d);
      const med = sch.patients.filter(p => p.request.type === "medula");
      mtot += med.length;
      const seen = {};
      for (const p of med) {
        const code = p.request.code;
        // kod biçimi
        if (typeof code !== "string" || code.length !== CONFIG.medulaCodeLen)
          warn.push("Gün " + d + ": Medula kodu " + CONFIG.medulaCodeLen + " karakter değil: " + JSON.stringify(code));
        else {
          if (code.charAt(0) !== "2") warn.push("Gün " + d + ": Medula kodu '2' ile başlamıyor: " + code);
          for (const ch of code) {
            if (MEDULA_ALPHABET.indexOf(ch) < 0)
              warn.push("Gün " + d + ": Medula kodunda yasak karakter '" + ch + "' (" + code + ")");
          }
        }
        // gün içinde benzersiz
        if (seen[code]) warn.push("Gün " + d + ": aynı Medula kodu iki hastada: " + code);
        seen[code] = true;
        // asla sahte olamaz
        if (p.request.fake) warn.push("Gün " + d + ": Medula hastası sahte işaretli (" + code + ")");
        if ((p.request.flaws || []).length) warn.push("Gün " + d + ": Medula isteğinde kusur bayrağı var");
        if (!p.request.items || !p.request.items.length) warn.push("Gün " + d + ": Medula isteğinde kalem yok (" + code + ")");
        if (!p.refValid) warn.push("Gün " + d + ": Medula hastası geçersiz sayılıyor (R'ye girmiyor)");
      }
    }
    if (medulaUnlocked() && mtot === 0) warn.push("Terminal açıkken gün 1.." + days + " içinde hiç Medula hastası üretilmedi");
    // Terminal KİLİTLİYKEN tek bir Medula hastası bile olmamalı
    game.upgrades = allLevels(() => 1);
    invalidateDaySchedules();
    let lockedM = 0;
    for (let d = 1; d <= days; d++) lockedM += getDaySchedule(d).patients.filter(p => p.request.type === "medula").length;
    if (lockedM > 0) warn.push("Terminal KİLİTLİ olmasına rağmen " + lockedM + " Medula hastası üretildi");
    // alacak defteri bütünlüğü: yazılan toplam = yatan + bekleyen
    if (!verifyMedulaLedger()) warn.push("Medula alacak defteri tutarları tutmuyor (yukarıdaki [medula] uyarısına bakın)");
    game.upgrades = prevUp3;
    invalidateDaySchedules();
  }

  // 0d4) ÇOK KALEMLİ SEMPTOM SABRI — 3 kalemli hasta 1 kalemliden KESİN olarak uzun
  // beklemeli ve bu, Bekleme Alanı seviyesinden bağımsız olmalı.
  {
    const prevUp4 = game.upgrades;
    for (const lv of [1, 2, 3]) {
      game.upgrades = allLevels(x => x.id === "bekleme" ? lv : 1);
      const mk = n => ({ type: "symptom", items: new Array(n).fill(0).map(() => ({ symptom: SYMPTOMS[0], qty: 1 })) });
      const p1 = effPatience() * symptomPatienceMul(mk(1));
      const p2 = effPatience() * symptomPatienceMul(mk(2));
      const p3 = effPatience() * symptomPatienceMul(mk(3));
      if (!(p3 > p1)) warn.push("Bekleme Lv" + lv + ": 3 kalemli semptom sabrı (" + p3.toFixed(1) + ") 1 kalemliden (" + p1.toFixed(1) + ") uzun değil");
      if (!(p2 > p1)) warn.push("Bekleme Lv" + lv + ": 2 kalemli semptom sabrı 1 kalemliden uzun değil");
      if (!(p3 > p2)) warn.push("Bekleme Lv" + lv + ": 3 kalemli semptom sabrı 2 kalemliden uzun değil");
      if (Math.abs(p3 / p1 - 1.5) > 1e-6) warn.push("Bekleme Lv" + lv + ": 3 kalem çarpanı 1.5 değil (" + (p3 / p1).toFixed(3) + ") — geliştirme çarpanı yerine geçmiş olabilir");
      // reçete/Medula sabrına dokunulmamalı
      if (symptomPatienceMul({ type: "prescription", items: [] }) !== 1) warn.push("Reçete hastasının sabrına kalem çarpanı uygulanıyor");
      if (symptomPatienceMul({ type: "medula", items: [] }) !== 1) warn.push("Medula hastasının sabrına kalem çarpanı uygulanıyor");
    }
    game.upgrades = prevUp4;
    invalidateDaySchedules();
  }

  // 0e) NÖBET kuralları
  if (nightFakeChance() > CONFIG.nightFakeRateCap + 1e-9)
    warn.push("Gece sahte oranı tavanı aşıyor: " + nightFakeChance().toFixed(3) + " > " + CONFIG.nightFakeRateCap);
  // Gece pür "reddet" bloğuna dönüşmesin: tavan, gerçek reçete payı tabanını delmemeli.
  if (1 - CONFIG.nightFakeRateCap < CONFIG.nightMinRealRxShare - 1e-9)
    warn.push("Gece sahte tavanı çok yüksek: gerçek reçete payı %" +
      Math.round((1 - CONFIG.nightFakeRateCap) * 100) + " < taban %" +
      Math.round(CONFIG.nightMinRealRxShare * 100));
  for (let d = 1; d <= days; d++) {
    const sch = getDaySchedule(d);
    const nightPs = sch.patients.filter(p => p.night);
    if (isNightDutyDay(d)) {
      if (sch.nightN < CONFIG.nightPatientMin)
        warn.push("Gün " + d + " nöbetçi ama gece hastası " + sch.nightN + " (< " + CONFIG.nightPatientMin + ")");
      if (nightPs.length !== sch.nightN)
        warn.push("Gün " + d + ": night işaretli hasta sayısı (" + nightPs.length + ") nightN (" + sch.nightN + ") ile uyuşmuyor");
      const nightRx = nightPs.filter(p => p.request.type === "prescription" || p.request.type === "medula");
      if (!nightRx.some(p => !p.request.fake))
        warn.push("Gün " + d + " gece bölümünde hiç GERÇEK reçete yok (nöbet yalnız redden ibaret kalır)");
      if (sch.patients.slice(0, sch.dayN).some(p => p.night))
        warn.push("Gün " + d + ": gündüz bölümünde night:true hasta var (sıralama bozuk)");
    } else {
      if (nightPs.length)
        warn.push("Gün " + d + " nöbetçi DEĞİL ama " + nightPs.length + " gece hastası var");
      if (sch.nightN !== 0) warn.push("Gün " + d + " nöbetçi değil ama nightN=" + sch.nightN);
    }
  }

  // 1..4) üretilmiş günlerdeki her hasta
  for (let d = 1; d <= days; d++) {
    const sch = getDaySchedule(d);
    for (let i = 0; i < sch.patients.length; i++) {
      const tag = "Gün " + d + " hasta #" + (i + 1) + ": ";
      const r = sch.patients[i].request;

      if (r.type === "symptom") {
        const items = r.items || [{ symptom: r.symptom, qty: 1 }];
        if (!items.length) { warn.push(tag + "semptom isteğinde hiç kalem yok"); continue; }
        if (items.length > 3) warn.push(tag + "semptom isteğinde " + items.length + " kalem (en fazla 3 olmalı)");
        // (i) her kalem FARKLI kategoriden olmalı
        const cats = items.map(it => it.symptom.category);
        if (new Set(cats).size !== cats.length)
          warn.push(tag + "çok kalemli semptom isteğinde AYNI kategoriden iki kalem var: " + cats.join(", "));
        // (ii) her kalem için o kategoride en az bir ilaç olmalı + adet 1..2
        for (const it of items) {
          const cands = MEDICINES.filter(m => m.category === it.symptom.category);
          if (!cands.length) warn.push(tag + "semptom '" + it.symptom.label + "' için hiç ilaç yok (kategori: " + it.symptom.category + ")");
          if (!(it.qty === 1 || it.qty === 2)) warn.push(tag + "semptom kaleminde geçersiz adet: " + it.qty + " (1 veya 2 olmalı)");
        }
        if (!r.line) warn.push(tag + "semptom isteğinde konuşma cümlesi (line) üretilmemiş");
        // (iii) TAM DOĞRU servis daima doğru sayılmalı — gerçek eşleşme koduyla sınanır
        const want = expectedCategoryList(r);
        for (const combo of symptomAnswerCombos(items)) {
          const got = combo.map(id => { const m = getMedicine(id); return m ? m.category : "?"; });
          if (!sameMultiset(want, got))
            warn.push(tag + "doğru servis yanlış sayılıyor: [" + combo.join(", ") + "] ↔ istenen [" + want.join(", ") + "]");
        }
        continue;
      }

      if (r.type === "medula") continue;   // Medula kuralları 0d3'te ayrıca sınanıyor

      // reçete: tam kalem+adet verilince eşleşme doğru olmalı
      const need = [];
      for (const it of r.items) for (let q = 0; q < it.qty; q++) need.push(it.id);
      if (!sameMultiset(need, need.slice().reverse()))
        warn.push(tag + "çoklu-küme karşılaştırması sıralamaya duyarlı");
      if (!r.items.length) warn.push(tag + "reçetede hiç kalem yok");
      for (const it of r.items) {
        if (!getMedicine(it.id)) warn.push(tag + "reçetede bilinmeyen ilaç id'si: " + it.id);
        if (!(it.qty >= 1)) warn.push(tag + "reçete kalemi geçersiz adet: " + it.id + "×" + it.qty);
      }

      if (r.fake) {
        // sahte => oyuncunun tespit edebileceği en az 1 kusur ŞART
        if (detectableFlawsOf(r).length === 0)
          warn.push(tag + "SAHTE ama tespit edilebilir kusuru yok (flaws=[" + (r.flaws || []).join(", ") +
            "], doktor=" + r.doctor + ", kaşe=" + r.hasStamp + ", imza=" + JSON.stringify(r.sig) + ", tarih=" + r.date + ")");
        // doktoru defterde olan sahte, yalnızca BAŞKA bir kusurla sahte sayılabilmeli
        if (bookNames.indexOf(r.doctor) >= 0 && (r.flaws || []).indexOf("fake_doctor") >= 0)
          warn.push(tag + "fake_doctor kusuru var ama doktor defterde: " + r.doctor);
      } else {
        // gerçek => hiçbir kusur bayrağı olmamalı ve kağıt temiz olmalı
        if (r.flaws && r.flaws.length) warn.push(tag + "GERÇEK ama kusur bayrağı var: [" + r.flaws.join(", ") + "]");
        const fl = detectableFlawsOf(r);
        if (fl.length) warn.push(tag + "GERÇEK reçetede kusur görünüyor: " + fl.join(" · "));
        if (bookNames.indexOf(r.doctor) < 0) warn.push(tag + "GERÇEK reçetenin doktoru defterde yok: " + r.doctor);
        // tarih o günün tarihi olmalı (önden üretimde damgalama doğru mu)
        const prevOv = _dateDayOverride; _dateDayOverride = d;
        const expDate = dateRx(0);
        _dateDayOverride = prevOv;
        if (r.date !== expDate) warn.push(tag + "GERÇEK reçete tarihi " + r.date + ", oysa o günün tarihi " + expDate);
      }
    }
  }

  for (const w of warn) console.warn("[self-test] " + w);
  return warn.length === 0;
}
_noRecords = true;      // denetimlerin sahte kariyerleri rekor defterine yazılmasın
bootCheck("hasta", selfTestPatients);
bootCheck("emoji", selfTestEmoji);

// --- Veri sağlık kontrolü: kategori eşleşmeleri (SADECE konsol; oyuncuya görünmez) ---
function checkDataHealth() {
  const medCats = new Set(MEDICINES.map(m => m.category));
  const symCats = new Set(SYMPTOMS.map(s => s.category));
  for (const cat of medCats) {
    if (!symCats.has(cat)) console.warn("[veri] Bu ilaç kategorisinin SYMPTOMS karşılığı yok:", cat);
  }
  for (const cat of symCats) {
    if (!medCats.has(cat)) console.warn("[veri] Bu semptom kategorisinin ilacı yok:", cat);
  }
}
bootCheck("veri", checkDataHealth);

// --- KAYIT gidiş-dönüş denetimi: kontrol noktası yazılıp geri okununca AYNI oyun mu? ---
// Diske DOKUNMAZ (_saveReady henüz false). Canlı state yedeklenip sonunda geri konur.
function verifySaveRoundtrip() {
  const warn = [], bak = Object.assign({}, game);
  try {
    startNewCareer();
    game.money = 12345; game.upgrades.vitrin = 2; game.stock[MEDICINES[1].id] = 3;
    game.receivables = [{ dueDay: 4, amount: 250 }]; game.medulaBooked = 250;   // defter denk kalsın
    game.dayNumber = 4; game.dayFolded = false;
    game.state = STATE.PLAYING; startNextDay();          // gün 5 başı → "start" noktası
    const snap = runSnapshot("start"), goal = game.daySchedule.goal, first = game.queue[0];
    game.money = 1; game.stock[MEDICINES[1].id] = 99; game.dayNumber = 9; game.queue = [];
    invalidateDaySchedules();
    if (!applyRun(JSON.parse(JSON.stringify(snap)))) warn.push("start kaydı geri kurulamadı");
    else {
      if (game.money !== snap.data.money) warn.push("kasa geri gelmedi: " + game.money);
      if (game.dayNumber !== 5) warn.push("gün geri gelmedi: " + game.dayNumber);
      if (game.stock[MEDICINES[1].id] !== snap.data.stock[MEDICINES[1].id]) warn.push("stok geri gelmedi");
      if (game.upgrades.vitrin !== 2) warn.push("geliştirme geri gelmedi");
      if (game.daySchedule.goal !== goal) warn.push("gün listesi aynı üretilmedi (hedef " + goal + " → " + game.daySchedule.goal + ")");
      const q = game.queue[0];
      if (!q || !first || q.request.type !== first.request.type) warn.push("günün ilk müşterisi farklı");
      if (game.resumeState !== STATE.PLAYING || !canResume()) warn.push("DEVAM ET gün başına dönmüyor");
    }
    // gün sonu ve sezon sonu noktaları
    game.state = STATE.DAYEND; game.dayResult = { goal: 100, met: true, repGain: 1, repLoss: 0, missStreak: 0 };
    const s2 = runSnapshot("dayend");
    game.dayResult = null;
    if (!applyRun(JSON.parse(JSON.stringify(s2))) || game.resumeState !== STATE.DAYEND || !game.dayResult)
      warn.push("gün sonu kaydı geri kurulamadı");
    game.seasonResult = { score: 1 };
    const s3 = runSnapshot("seasonend");
    game.hasRun = false; game.resumeState = null;
    if (!applyRun(JSON.parse(JSON.stringify(s3))) || !canResume() || game.resumeState !== STATE.SEASONEND)
      warn.push("sezon sonu kaydı DEVAM ET'e bağlanmadı");
    if (applyRun({ v: 99, at: "start", data: {} })) warn.push("tanımsız sürüm kabul edildi");
    if (applyRun({ v: SAVE_VERSION, at: "start", data: { career: {}, dayNumber: 0, money: 1 } })) warn.push("bozuk kayıt kabul edildi");
  } catch (e) { warn.push("istisna: " + (e && e.message)); }
  finally {
    for (const k in game) if (!(k in bak)) delete game[k];
    Object.assign(game, bak);
    invalidateDaySchedules();
    _lastRunJson = "";
  }
  for (const w of warn) console.warn("[kayıt] " + w);
  return warn.length === 0;
}
bootCheck("kayıt", verifySaveRoundtrip);
bootCheck("diyalog", verifyDialog);
_noRecords = false;

loadAssets();
resize();
bootCheck("menü yerleşimi", verifyMenuLayout);   // yerleşim denetimi: layout ancak resize()'dan SONRA vardır
bootCheck("radyo yerleşimi", verifyRadioLayout);  // tezgahtaki radyo defter/PC ile çakışmasın, dokunma alanı 44 pt olsun
game.spawnTimer = CONFIG.spawnInterval;
// Kayıt: profil (ad, rekorlar, ses) + süren kariyer. Self-test'lerden SONRA okunur.
loadSave();
GC.init();            // iOS'ta Game Center oturumu (tarayıcıda sessizce devre dışı)
Intro.start();        // COSMIC INTERACTION logo açılışı (menü altta hazırlanır)
// İlk açılış: eczanenin adı yoksa doğrudan ad ekranı.
if (!game.pharmacyName) game.state = STATE.NAMING;
requestAnimationFrame(loop);

</script>
