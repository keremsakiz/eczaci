    // NOMİNAL değil FİİLEN uygulanan itibar: itibar tavanındaki oyuncuda yardımın
    // itibar karşılığı ~0'a düşer (geri ödemenin var olma sebebi tam olarak bu).
    beggarRep: Math.round(t.beggarRep * 10) / 10,
    beggarRepaid: t.beggarRepaid,
    beggarRepaidMoney: Math.round(t.beggarRepaidMoney),
    bestSeason: best ? { season: best.season, earned: best.earned, score: best.score } : null,
    seasons: cr.seasons.slice(),
    upgrades: UPGRADES.map(u => ({ id: u.id, name: u.name, emoji: u.emoji,
                                   level: upgradeLevel(u.id), maxLevel: u.maxLevel })),
    careerSeed: cr.seed
  };
}

// Kariyeri kapat. İki sebep: "reputation" (itibar 0) ve "fee" (ruhsat bedeli ödenemedi).
function finishCareer(reason) {
  if (game.state === STATE.CAREEREND) return;
  game.careerResult = buildCareerResult(reason);
  updateRecords(game.careerResult);
  if (!_noRecords) GC.submit(game.careerResult.score);   // dünya sıralaması: kariyer skoru
  game.state = STATE.CAREEREND;
  game.hasRun = false;
  game.resumeState = null;
  clearRun();                       // biten kariyer sürdürülemez; rekorlar profilde kaldı
  game.feedback = null;
  game.depotOpen = false;
  game.pcScreen = "home";
  game.nightIntro = null;
  game.bookState = "closed";
  resetTransientAnims();
}

// YEREL rekorlar. Sunucu yok, kalıcı depolama da HENÜZ yok — sayfa yenilenince sıfırlanır.
// Ana ekrandaki panel bunu okur; rekor yoksa panel "henüz kariyer tamamlamadın" der.
// Boot self-test'leri SAHTE kariyerler kapatıyor (bedel ödenemeyince kariyerin
// bittiğini denetlemek için) ve o uydurma kasa rekor defterine yazılıyordu: oyuncu
// hiç oynamadan ana ekranda 493.234₺ "rekor" görüyordu. Defter OYUNCUNUN
// kariyerlerini tutar; denetimler boyunca bayrak kapalı kalır.
let _noRecords = false;
function updateRecords(res) {
  if (_noRecords || !res) return;
  const r = game.records;
  if (res.score > r.peak) r.peak = res.score;
  if (res.seasonsCompleted > r.seasons) r.seasons = res.seasonsCompleted;
  const best = (res.bestSeason && res.bestSeason.earned) || 0;
  if (best > r.bestSeason) r.bestSeason = best;
  saveProfile();
}

// =====================================================================
//  GAME CENTER — "EN İYİ ECZACI KARİYERLERİ" dünya sıralaması
// =====================================================================
// Yerel eklenti: ios/App/App/GameCenterPlugin.swift (Capacitor.Plugins.GameCenter).
// Tarayıcıda / eklenti yokken GC.available = false → panel yerel rekorları gösterir, oyun
// aynen oynanır. Skor = KARİYER SKORU (kariyer boyunca ulaşılan en yüksek kasa, tam sayı ₺);
// sezon sonunda ve kariyer bitince gönderilir, Game Center oyuncunun en iyisini tutar.
// Oturum yoksa skor GC.pending'de bekler (profil kaydında kalıcı), oturum açılınca gider.
// App Store Connect'teki sıralama kimliği BİREBİR bu olmalı (IOS.md §9):
const GC_LEADERBOARD_ID = "com.kerem.eczaci.kariyer";
const GC_TOP_N = 3;
const GC_CACHE_KEY = "eczaci.gc.v1";
const GC = {
  plugin: null, available: false, authed: false, needSettings: false, sending: false,
  board: null,            // { entries:[{rank, score, displayName, isLocal}], local, total, at }
  loading: false, lastFetch: 0, pending: 0,
  init() {
    const C = typeof window !== "undefined" ? window.Capacitor : null;
    const P = C && C.Plugins && C.Plugins.GameCenter;
    try { const c = JSON.parse(localStorage.getItem(GC_CACHE_KEY) || "null"); if (c && Array.isArray(c.entries)) this.board = c; }
    catch (e) { /* önbellek yok */ }
    if (!P || typeof P.signIn !== "function") return;
    this.plugin = P; this.available = true;
    try { if (P.addListener) P.addListener("authChanged", d => this.onAuth(d)); } catch (e) {}
    this.signIn();
  },
  // fromTap: oyuncu panele dokundu. GameKit giriş ekranını bir kez kapatılınca bir daha
  // göstermez (Apple kuralı) → o zaman panel "Ayarlar › Game Center" yol tarifini yazar.
  signIn(fromTap) {
    if (!this.plugin) return;
    this.plugin.signIn({})
      .then(d => { this.onAuth(d); if (fromTap && !this.authed) this.needSettings = true; })
      .catch(() => { this.onAuth(null); if (fromTap) this.needSettings = true; });
  },
  onAuth(d) {
    const was = this.authed;
    this.authed = !!(d && d.authenticated);
    if (this.authed) this.needSettings = false;
    if (this.authed && !was) {
      if (this.pending > 0) this.submit(this.pending);
      this.refresh(true);
    }
  },
  refresh(force) {
    if (!this.authed) return;
    if (this.pending > 0 && !this.sending) this.submit(this.pending);   // gidemeyen skor: yeniden dene
    if (this.loading) return;
    const now = Date.now();
    if (!force && now - this.lastFetch < 60000) return;
    this.loading = true; this.lastFetch = now;
    this.plugin.loadTopScores({ leaderboardId: GC_LEADERBOARD_ID, count: GC_TOP_N })
      .then(r => {
        const pack = e => e && { rank: +e.rank, score: +e.score, displayName: String(e.displayName || "Eczacı"), isLocal: !!e.isLocal };
        this.board = { entries: (r.entries || []).map(pack).slice(0, GC_TOP_N), local: pack(r.local), total: +r.total || 0, at: now };
        try { localStorage.setItem(GC_CACHE_KEY, JSON.stringify(this.board)); } catch (e) {}
      })
      .catch(() => {})
      .then(() => { this.loading = false; });
  },
  submit(score) {
    score = Math.round(+score || 0);
    if (!(score > 0)) return;
    if (score > this.pending) { this.pending = score; saveProfile(); }
    if (!this.authed || !this.plugin) return;          // oturum açılınca onAuth gönderir
    const sent = this.pending;
    this.sending = true;
    this.plugin.submitScore({ leaderboardId: GC_LEADERBOARD_ID, score: sent })
      .then(() => { this.sending = false; if (this.pending <= sent) { this.pending = 0; saveProfile(); } this.refresh(true); })
      .catch(() => { this.sending = false; });           // kalır; menüye dönüşte (refresh) yeniden denenir
  },
  // Menüdeki panele dokunuş: oturum yoksa giriş, varsa Apple'ın sıralama ekranı.
  tap() {
    if (!this.plugin) return false;
    if (!this.authed) { this.signIn(true); return true; }
    this.plugin.showLeaderboard({ leaderboardId: GC_LEADERBOARD_ID }).catch(() => {});
    return true;
  }
};

// Paneldeki satırlar: [sol, sağ, bayrak] — bayrak "me" (oyuncunun kendi satırı) | "hint".
function scoreboardRows() {
  const rc = game.records, rows = [];
  const b = GC.board;
  if (GC.available && GC.authed && b && b.entries.length) {
    for (const e of b.entries) rows.push([e.rank + ". " + e.displayName, formatMoney(e.score), e.isLocal ? "me" : ""]);
    const me = b.local;
    if (me && !b.entries.some(e => e.isLocal)) rows.push(["Sen · " + me.rank + ". sıra", formatMoney(me.score), "me"]);
    else if (!me && rc.peak > 0) rows.push(["Senin rekorun", formatMoney(rc.peak), "me"]);
    return rows;
  }
  if (GC.available && GC.authed) {
    rows.push(["Sıralama henüz boş — ilk sen ol!", "", "hint"]);
    if (rc.peak > 0) rows.push(["Senin rekorun", formatMoney(rc.peak), "me"]);
    return rows;
  }
  if (rc.peak > 0) {
    rows.push(["En yüksek kasa", formatMoney(rc.peak), "me"]);
    rows.push(["En uzun kariyer", rc.seasons + " sezon"]);
    rows.push(["En iyi sezon kazancı", formatMoney(rc.bestSeason)]);
  }
  if (GC.available) rows.push([GC.needSettings ? "🌍 Giriş için: Ayarlar › Game Center"
                                                : "🌍 Dünya sıralaması için Game Center'a dokun", "", "hint"]);
  return rows;
}

// =====================================================================
//  KAYIT — uygulama kapanıp açılınca kaldığı yerden
// =====================================================================
// İKİ AYRI KAYIT:
//  profil  — eczane adı, rekorlar, SES levhası, radyo (açık mı + istasyon). Değiştiği an yazılır.
//  koşu    — süren kariyer. GÜN ORTASI YAZILMAZ: kuyruktaki hastalar, uçan poşet, açık reçete
//            gibi anlık durumu diske dökmek kırılgan. Onun yerine üç KONTROL NOKTASI:
//              "start"     günün başı (beginSeason / startNextDay bittiği an)
//              "dayend"    gün sonu kartı (depo siparişleri de burada; periyodik tazelenir)
//              "seasonend" sezon sonu kartı (YENİ SEZON kararı henüz verilmedi)
//            Uygulama gün ortasında kapanırsa o GÜN baştan oynanır (kasa/stok/geliştirme de
//            gün başındaki hâline döner — tutarlı). Gün listesi saklanmaz: tohum + gün +
//            geliştirmelerden aynen yeniden üretilir (buildDaySchedule deterministik).
// Depo: localStorage. iOS'ta @capacitor/preferences kuruluysa ona da AYNA yazılır ve
// localStorage boş açılırsa (WebView verisi silinmişse) oradan geri gelir.
const SAVE_KEYS = { profile: "eczaci.profile.v1", run: "eczaci.run.v1" };
const SAVE_VERSION = 1;
// Boot self-test'leri sahte kariyerler oynatıyor; kayıt ancak boot bitince açılır.
let _saveReady = false;
let _lastRunJson = "", _runSaveClock = 0;
const RUN_FIELDS = ["money", "reputation", "dayNumber", "goalMissStreak", "seasonStats", "dayFolded",
  "dayResult", "career", "seasonFeePaid", "stock", "upgrades", "runSeed", "receivables",
  "beggarReturns", "medulaBooked", "medulaCollected", "collectedToday", "dayStats",
  "beggarDay", "beggarPayDay", "seasonResult", "phase", "activeGroup", "depotGroup", "upgradeTier"];

function nativePrefs() {
  const C = typeof window !== "undefined" && window.Capacitor;
  return (C && C.Plugins && C.Plugins.Preferences) || null;
}
const SaveStore = {
  get(k) {
    try { const s = localStorage.getItem(k); return s ? JSON.parse(s) : null; }
    catch (e) { return null; }
  },
  set(k, v) {
    const s = v == null ? null : JSON.stringify(v);
    let ok = true;
    try { if (s == null) localStorage.removeItem(k); else localStorage.setItem(k, s); }
    catch (e) { ok = false; /* özel sekme / dolu depo: oyun kayıtsız sürer */ }
    const P = nativePrefs();
    if (P) {
      try { const pr = s == null ? P.remove({ key: k }) : P.set({ key: k, value: s }); if (pr && pr.catch) pr.catch(() => {}); }
      catch (e) { /* eklenti yok */ }
    }
    return ok;
  }
};

function saveProfile() {
  if (!_saveReady) return;
  SaveStore.set(SAVE_KEYS.profile, {
    v: SAVE_VERSION, name: game.pharmacyName, records: game.records,
    sound: MenuMusic.on, radio: Radio.on, station: Radio.station,
    gcPending: GC.pending || 0      // Game Center'a henüz gidemeyen en iyi kariyer skoru
  });
}
function applyProfile(p) {
  if (!p || p.v !== SAVE_VERSION) return false;
  if (typeof p.name === "string" && p.name.trim()) game.pharmacyName = p.name.trim().slice(0, NAME_MAX);
  if (p.records) for (const k of ["peak", "seasons", "bestSeason"]) {
    const n = +p.records[k];
    if (isFinite(n) && n > game.records[k]) game.records[k] = n;
  }
  if (typeof p.sound === "boolean") MenuMusic.on = p.sound;
  if (Number.isFinite(p.gcPending) && p.gcPending > 0) GC.pending = Math.round(p.gcPending);
  if (typeof p.radio === "boolean") Radio.on = p.radio;
  if (Number.isInteger(p.station) && p.station >= 0 && p.station < RADIO_STATIONS.length) {
    Radio.station = p.station;
    Radio.toast = null;
  }
  return true;
}

// Süren koşunun o anki kontrol noktası. Oyun gün ORTASINDAYSA null (yazılmaz).
function runSnapshot(at) {
  if (!game.career) return null;
  const data = {};
  for (const k of RUN_FIELDS) data[k] = game[k];
  return JSON.parse(JSON.stringify({ v: SAVE_VERSION, at: at, data: data }));
}
function saveRun(at) {
  if (!_saveReady) return;
  const s = runSnapshot(at);
  if (!s) return;
  const j = JSON.stringify(s);
  if (j === _lastRunJson) return;
  if (SaveStore.set(SAVE_KEYS.run, s)) _lastRunJson = j;   // yazılamadıysa sonraki turda yeniden dene
}
function clearRun() {
  if (!_saveReady) return;
  _lastRunJson = "";
  SaveStore.set(SAVE_KEYS.run, null);
}
// Kart ekranlarında oyuncu depodan sipariş verebilir → kayıt bir buçuk saniyede bir tazelenir
// (değişmediyse yazmaz). Gün içi ASLA yazılmaz.
function tickRunSave(dt) {
  if (!_saveReady) return;
  _runSaveClock += dt;
  if (_runSaveClock < 1.5) return;
  _runSaveClock = 0;
  const at = checkpointNow();
  if (at) saveRun(at);
}
function checkpointNow() {
  const st = game.state === STATE.MENU || game.state === STATE.HOWTO || game.state === STATE.ABOUT ? game.resumeState : game.state;
  if (st === STATE.DAYEND) return "dayend";
  if (st === STATE.SEASONEND) return "seasonend";
  return null;
}

// Diskteki koşuyu oyuna kur. Başarılıysa oyuncu menüde DEVAM ET ile kaldığı yere döner.
function applyRun(s) {
  if (!s || s.v !== SAVE_VERSION || !s.data || !s.data.career) return false;
  const at = s.at;
  if (at !== "start" && at !== "dayend" && at !== "seasonend") return false;
  const d = s.data;
  if (!(d.dayNumber >= 1 && d.dayNumber <= CONFIG.seasonDays) || !isFinite(d.money)) return false;
  for (const k of RUN_FIELDS) if (k in d) game[k] = d[k];
  // Sonraki sürümlerde eklenen/çıkan ilaç ve geliştirmeler: eksik olan varsayılanla dolar,
  // artık olmayan silinir.
  const stock = {};
  for (const m of MEDICINES) stock[m.id] = Number.isFinite(game.stock && game.stock[m.id]) ? game.stock[m.id] : CONFIG.startStock;
  game.stock = stock;
  const up = {};
  for (const u of UPGRADES) up[u.id] = clamp(Math.floor((game.upgrades && game.upgrades[u.id]) || 1), 1, u.maxLevel);
  game.upgrades = up;
  game.receivables = Array.isArray(game.receivables) ? game.receivables : [];
  game.beggarReturns = Array.isArray(game.beggarReturns) ? game.beggarReturns : [];
  if (!game.seasonStats) game.seasonStats = newSeasonStats();
  if (game.phase !== "night") game.phase = "day";
  game.nightT = game.phase === "night" ? 1 : 0;

  invalidateDaySchedules();
  beginDaySchedule(game.dayNumber);
  game.queue = [];
  game.counter = [];
  resetTransientAnims();
  game.feedback = null;
  game.stockToast = null;
  game.infoToast = null;
  game.nightIntro = null;
  game.depotOpen = false;
  game.pcScreen = "home";
  game.depotPending = {};
  game.medulaRevealed = {};
  game.medulaInput = "";
  game.medulaResult = null;
  game.careerResult = null;
  if (at === "start") {
    game.dayScheduleIdx = 0;
    game.daySpawned = 0;
    game.dayCompleted = 0;
    game.spawnTimer = CONFIG.spawnInterval;
    game.hasRun = true;
    game.resumeState = STATE.PLAYING;
    spawnPatient();                 // gün başındaki ilk müşteri (startNextDay'in yaptığı gibi)
  } else {
    const n = game.daySchedule ? game.daySchedule.patients.length : 0;
    game.dayScheduleIdx = n;
    game.daySpawned = n;
    game.dayCompleted = n;
    game.hasRun = at === "dayend";  // sezon sonu: sezon bitti, kariyer sürüyor (canResume bakar)
    game.resumeState = at === "dayend" ? STATE.DAYEND : STATE.SEASONEND;
  }
  _lastRunJson = JSON.stringify(s);
  return true;
}

// Boot'un SON adımı: self-test'lerden sonra, ilk kareden önce.
function loadSave() {
  game.resumeState = game.hasRun ? STATE.PLAYING : null;   // self-test artığı kalmasın
  let prof = SaveStore.get(SAVE_KEYS.profile), run = SaveStore.get(SAVE_KEYS.run);
  let okP = false, okR = false;
  try { okP = applyProfile(prof); } catch (e) { console.warn("[kayıt] profil okunamadı", e); }
  try { okR = applyRun(run); } catch (e) { console.warn("[kayıt] koşu okunamadı", e); okR = false; }
  _saveReady = true;
  // localStorage boşsa (iOS WebView verisi silinmiş olabilir) yerel ayna denenir
  const P = nativePrefs();
  if (P && (!prof || !run)) {
    Promise.all([P.get({ key: SAVE_KEYS.profile }), P.get({ key: SAVE_KEYS.run })]).then(([a, b]) => {
      const pa = a && a.value ? JSON.parse(a.value) : null, rb = b && b.value ? JSON.parse(b.value) : null;
      const onMenu = game.state === STATE.MENU || game.state === STATE.NAMING;
      if (!prof && pa && applyProfile(pa)) {
        try { localStorage.setItem(SAVE_KEYS.profile, a.value); } catch (e) {}
        if (game.state === STATE.NAMING && game.pharmacyName) game.state = STATE.MENU;
      }
      if (!run && rb && onMenu && !game.hasRun && applyRun(rb)) {
        try { localStorage.setItem(SAVE_KEYS.run, b.value); } catch (e) {}
      }
    }).catch(() => {});
  }
  return { profile: okP, run: okR };
}

// Menüde DEVAM ET: süren gün, gün sonu kartı ya da sezon sonu kartı (YENİ SEZON kararı).
function canResume() {
  return !!(game.hasRun || (game.resumeState === STATE.SEASONEND && game.career && game.seasonResult));
}
function resumeRun() {
  const st = game.resumeState;
  game.state = (st === STATE.DAYEND || st === STATE.SEASONEND) ? st : STATE.PLAYING;
}
if (typeof window !== "undefined" && window.addEventListener) {
  // arka plana alınırken kart ekranındaki son hâl (ör. depo siparişi) kaçmasın
  const flush = () => { const at = checkpointNow(); if (at) saveRun(at); };
  window.addEventListener("pagehide", flush);
  document.addEventListener("visibilitychange", () => { if (document.hidden) flush(); });
}

// SEZON SONU ekranındaki "YENİ SEZON" buradan geçer. Bedel karşılanmıyorsa kariyer biter.
function tryStartNextSeason() {
  if (!game.career) { startNewCareer(); return true; }
  if (!canAffordNextSeason()) { finishCareer("fee"); return false; }
  beginSeason(game.career.season + 1);
  return true;
}

// günün listesini hazırla ve sayaçları sıfırla (hedef artık bu listeden geliyor).
// Cache'teki hasta nesneleri OYNANIRKEN değişir (sabır, decided); aynı gün tekrar
// oynanabildiği için (yeni oyun) her seferinde taze kopya verilir. request paylaşılır —
// oynanış sırasında değiştirilmez, sadece okunur.
function beginDaySchedule(day) {
  const sch = getDaySchedule(day);
  game.daySchedule = Object.assign({}, sch, {
    patients: sch.patients.map(p => Object.assign({}, p))
  });
  game.dayScheduleIdx = 0;
}

function startNextDay() {
  // 31. GÜN YOKTUR. endDay son günü zaten sezon sonuna çeviriyor; bu ikinci kapı cheat ve
  // uç yollardan sezon dışına taşmayı engeller (tek doğruluk kaynağı CONFIG.seasonDays).
  if (game.dayNumber >= CONFIG.seasonDays) { finishSeason("completed"); return; }
  game.dayNumber++;
  game.dayFolded = false;        // yeni günün istatistiği henüz sezon toplamına girmedi
  game.phase = "day";
  game.nightIntro = null;
  collectReceivables();          // vadesi gelen SGK alacakları kasaya girer
  announcePriceUpdate();         // fiyat turu varsa gün başı şeridi (SGK şeridinden SONRA)
  game.beggarDay = 0;            // yeni günde dilenci tekrar gelebilir
  game.beggarPayDay = 0;         // …borçlu da
  game.medulaInput = "";         // gün değişti: yarım kalan kod girişi anlamını yitirir
  game.medulaResult = null;
  beginDaySchedule(game.dayNumber);
  game.spawnTimer = CONFIG.spawnInterval;
  game.daySpawned = 0;
  game.dayCompleted = 0;
  game.queue = [];
  game.counter = [];
  game.feedback = null;
  resetTransientAnims();
  game.dayStats = { served: 0, correct: 0, wrong: 0, angry: 0, money: 0, moneyDay: 0, moneyNight: 0, medulaAccrued: 0, fakeCaught: 0, fakeMissed: 0, beggarGave: 0, beggarRefused: 0, beggarRep: 0, beggarRepaid: 0, beggarRepaidMoney: 0 };
  game.state = STATE.PLAYING;
  spawnPatient();
  game.resumeState = STATE.PLAYING;
  saveRun("start");              // kontrol noktası: yeni gün başladı
}

// Geliştirmeleri Lv1'e kur. Stok ile AYNI kalıcılık yolu: yalnız startNewCareer çağırır,
// beginSeason ve startNextDay dokunmaz => günler VE SEZONLAR arası korunur, DEVAM ET'te
// korunur, yalnız YENİ KARİYER'de sıfırlanır.
function initUpgrades() {
  game.upgrades = {};
  for (const u of UPGRADES) game.upgrades[u.id] = 1;
  invalidateDaySchedules();
}

// Stoğu başlangıç değerine kur (her ilaç ayrı). MEDICINES dizisi değişmez; runtime obje.
function initStock() {
  game.stock = {};
  for (const m of MEDICINES) game.stock[m.id] = CONFIG.startStock;
}

// --- BİR SEZONU BAŞLAT (kariyerin içinde) ---
// SIFIRLANAN yalnız SEZONA ÖZEL olanlardır. Kasa, geliştirme seviyeleri, stok ve SGK
// alacak defteri BURADA HİÇ DOKUNULMAZ — devretmelerinin tek sebebi bu.
//
// İTİBAR HER SEZON BAŞLANGIÇ DEĞERİNE DÖNER. Bilinçli karar: sezonu bitiren şey itibar
// çöküşü olabilmeli (o yüzden sezon içinde 0'a inmek kariyeri bitirir), ama çökmemiş bir
// sezonun yorgun itibarı sonraki sezona CEZA olarak taşınmamalı. Taşınsaydı kötü bir
// sezon bir sonrakini de sakatlar ve kariyer tek bir kötü günden geri dönülemez hâle
// gelirdi; devreden şey PARA ve ECZANE, itibar ise her sezon yeniden kazanılır.
function beginSeason(n) {
  const cr = game.career;
  cr.season = n;

  // RUHSAT YENİLEME BEDELİ — sezon BAŞLARKEN kasadan düşer. 1. sezon bedelsiz.
  // Ödenebilirlik burada DEĞİL, tryStartNextSeason'da kontrol edilir: bu fonksiyon
  // çağrıldığında bedelin karşılandığı garantidir (state bozulmasın diye tek kapı).
  const fee = effSeasonFeeFor(n);
  game.seasonFeePaid = fee;
  if (fee > 0) {
    game.money = Math.max(0, game.money - fee);
    cr.totals.feePaid += fee;
  }

  game.reputation = CONFIG.startReputation;   // bkz. yukarıdaki not
  game.goalMissStreak = 0;                    // kaçırma serisi de itibarla aynı ölçekte
  game.dayNumber = 1;
  game.seasonStats = newSeasonStats();
  game.seasonResult = null;
  game.dayFolded = false;
  game.phase = "day";
  game.nightIntro = null;
  game.nightT = 0;

  // SIRA ÖNEMLİ: sezon tohumu, gün 1 listesi kurulmadan ÖNCE ayarlanır.
  game.runSeed = seasonSeedFor(cr.seed, n);
  invalidateDaySchedules();
  invalidateBeggarPlans();

  // SGK alacakları DEVREDER ama vadeleri sezona GÖRELİ gün numarasıdır. Gün sayacı 1'e
  // döndüğü için 31/32. güne yazılmış bir alacak "dueDay <= dayNumber" koşulunu bir daha
  // asla sağlamaz ve para sonsuza kadar askıda kalırdı. Yeni sezona taşınırken vade bir
  // sezon geriye çekilir; en erken 1. gün. Defter bütünlüğü korunur (tutar değişmiyor).
  for (const r of game.receivables) r.dueDay = Math.max(1, r.dueDay - CONFIG.seasonDays);
  // Dilenci geri ödemeleri de aynı sebeple tabanlanır: sezon sonunda yardım edildiyse
  // vade 31/33. güne düşer ve borçlu bir daha asla gelmezdi.
  for (const r of game.beggarReturns) r.dueDay = Math.max(1, r.dueDay - CONFIG.seasonDays);
  game.medulaRevealed = {};   // kodlar yeni tohumla yeniden üretiliyor, eski kayıt anlamsız
  game.medulaInput = "";
  game.medulaResult = null;
  game.beggarDay = 0;
  game.beggarPayDay = 0;

  beginDaySchedule(1);
  game.spawnTimer = 0;
  game.daySpawned = 0;
  game.dayCompleted = 0;
  game.queue = [];
  game.counter = [];
  resetTransientAnims();
  game.feedback = null;
  game.stockToast = null;
  game.depotOpen = false;
  game.pcScreen = "home";
  game.depotPending = {};
  game.collectedToday = 0;
  game.infoToast = null;
  game.dayStats = { served: 0, correct: 0, wrong: 0, angry: 0, money: 0, moneyDay: 0, moneyNight: 0, medulaAccrued: 0, fakeCaught: 0, fakeMissed: 0, beggarGave: 0, beggarRefused: 0, beggarRep: 0, beggarRepaid: 0, beggarRepaidMoney: 0 };
  game.state = STATE.PLAYING;
  game.hasRun = true;               // menüde DEVAM ET görünebilir

  collectReceivables();             // devreden alacaklar 1. günde kasaya girsin
  // Bedel şeridi SGK şeridinden SONRA yazılır: çakışırsa oyuncunun görmesi gereken haber
  // "ne için ödendiği"dir. Yatan SGK zaten gün sonu kartında satır olarak duruyor.
  if (fee > 0) flashInfoToast("🧾 Ruhsat yenileme (Sezon " + n + "): −" + formatMoney(fee));
  updateCareerPeak();
  spawnPatient();
  game.resumeState = STATE.PLAYING;
  saveRun("start");                 // kontrol noktası: sezonun 1. günü başladı
}

// --- YENİ KARİYER (MENU/CAREEREND → PLAYING) ---
// DEVREDEN her şeyin sıfırlandığı TEK yer. Geliştirme/stok/alacak/kasa yalnız burada
// başa döner; beginSeason ve startNextDay onlara dokunmaz.
function startNewCareer() {
  game.career = newCareer();
  game.careerResult = null;
  game.money = CONFIG.startMoney;
  initUpgrades();         // geliştirmeler yalnız YENİ KARİYERDE sıfırlanır (sezonlar arası kalıcı)
  initStock();            // stok da öyle
  game.receivables = [];  // SGK alacakları da öyle
  game.beggarReturns = [];// dilenci geri ödeme defteri de öyle
  // Medula defter sayaçları KARİYER ölçeğindedir: alacaklar sezonlar arası devrettiği
  // için (yazılan = yatan + bekleyen) denkliği ancak kariyer boyunca toplanınca tutar.
  game.medulaBooked = 0;
  game.medulaCollected = 0;
  game.career.peakMoney = game.money;
  beginSeason(1);
}

// İtibar KAZANCINI tek noktadan uygula (yumuşak tavan).
// repSoftCap'e kadar tam değer, üstü repOverflowFactor ile kısılmış; toplam repMax'i aşmaz.
// Örnek: itibar 98, kazanç +6 -> 2 puan tam (100'e kadar) + 4 puanın yarısı = 102.
// Uygulanan GERÇEK artışı döndürür (DAYEND kartı bunu gösterir).
function gainReputation(amount) {
  if (!(amount > 0)) return 0;
  const before = game.reputation;
  let rep = before, left = amount;
  if (rep < CONFIG.repSoftCap) {                 // yumuşak tavanın altı: tam değer
    const take = Math.min(left, CONFIG.repSoftCap - rep);
    rep += take;
    left -= take;
  }
  if (left > 0) rep += left * CONFIG.repOverflowFactor;   // tavan üstü: kısılarak
  game.reputation = clamp(rep, CONFIG.minReputation, CONFIG.repMax);
  return game.reputation - before;
}

// Oyuncuya gösterilen itibar yüzdesi: 0–100 (arkadaki yastık görünmez).
const REP_SHOWN_MAX = 100;
function repShown(v) { return clamp(Math.round(v), 0, REP_SHOWN_MAX); }

// İtibar kaybını tek noktadan uygula: TAM değer (yumuşatma yok), sıfıra inince oyun biter.
// Üst sınır repMax'tir; maxReputation olsaydı 100 üstü yastık ilk kayıpta silinirdi.
function loseReputation(amount) {
  game.reputation = clamp(game.reputation - amount, CONFIG.minReputation, CONFIG.repMax);
  if (game.reputation <= CONFIG.minReputation) triggerGameOver();
}

// İtibar tükendi: sezon erken biter ve KARİYER DE BİTER (finishSeason o yolu
// finishCareer'a devreder). Kuyruk olduğu yerde donar (update PLAYING dışında çalışmaz).
// Kariyer skoru peak kasadır — çöküş biriktirileni silmez, kariyeri kapatır.
function triggerGameOver() { finishSeason("reputation"); }

// =====================================================================
//  UPDATE
// =====================================================================
function update(dt) {
  game.clock += dt;
  tickRunSave(dt);                // kart ekranlarındaki değişiklik (depo siparişi) kayda geçsin

  // doktor defteri açılma/kapanma animasyonu
  if (game.bookState === "opening") {
    game.bookT += dt / CONFIG.bookAnimTime;
    if (game.bookT >= 1) { game.bookT = 1; game.bookState = "open"; }
  } else if (game.bookState === "closing") {
    game.bookT -= dt / CONFIG.bookAnimTime;
    if (game.bookT <= 0) { game.bookT = 0; game.bookState = "closed"; }
  }

  // gece katmanı yumuşak otursun (panel açıkken de ilerlesin; ani geçiş olmasın)
  {
    const target = (game.phase === "night" && game.state !== STATE.MENU) ? 1 : 0;
    const step = dt / Math.max(0.01, CONFIG.nightFadeTime);
    if (game.nightT < target) game.nightT = Math.min(target, game.nightT + step);
    else if (game.nightT > target) game.nightT = Math.max(target, game.nightT - step);
  }

  // Poşet uçuşu (SERVİS ET → checkOrder arası ~0,6 sn). Sonunda kararı UYGULAR.
  // Uçuş sırasında sabır işlemez: aksi halde poşet havadayken hasta küsüp kuyruktan
  // düşebilir ve checkOrder BAŞKA bir hastaya uygulanırdı.
  if (game.bagAnim) {
    game.bagAnim.t += dt;
    if (game.bagAnim.t >= CONFIG.bagFlyTime) { game.bagAnim = null; checkOrder(); }
    return;
  }
  // sepete ekleme geri bildirimi (salt görsel; oyunu etkilemez, donmuşken de sönümlenir)
  if (game.flyAnims.length) {
    for (const f of game.flyAnims) f.t += dt;
    game.flyAnims = game.flyAnims.filter(f => f.t < CONFIG.flyTime);
  }

  // PC paneli açıkken oyun donsun — AMA SATIŞ ekranı hariç. Satış hizmet anının
  // parçasıdır: sabır işlemeye devam eder. Depo/geliştirme/Medula dondurur.
  if (pcFreezesGame()) return;

  // "NÖBET BAŞLIYOR" kartı açıkken oyun donar (depo paneliyle aynı kalıp)
  if (game.nightIntro !== null) {
    game.nightIntro += dt;
    if (game.nightIntro >= CONFIG.nightIntroDuration) game.nightIntro = null;
    return;
  }

  if (game.state !== STATE.PLAYING) return;

  // hasta spawn — günün hedef müşteri sayısı kadar üret, kuyruk doluysa bekle
  const goalN = patientsForDay();
  game.spawnTimer += dt;
  const prog = goalN > 0 ? game.dayCompleted / goalN : 0;       // gün ilerledikçe hızlan
  const interval = lerp(CONFIG.spawnInterval, CONFIG.minSpawnInterval, prog);
  if (game.spawnTimer >= interval && game.queue.length < effMaxQueue() && game.daySpawned < goalN) {
    game.spawnTimer = 0;
    spawnPatient();
  }
  // Dilenci — programın DIŞINDA, kendi planına göre girer (spawn sayacına karışmaz)
  maybeSpawnBeggar();
  maybeSpawnBeggarPay();      // vadesi gelen borçlu (aynı bonus hasta yolu)

  // pozisyon + giriş animasyonları
  for (let i = 0; i < game.queue.length; i++) {
    const p = game.queue[i];
    p.posCurrent += (i - p.posCurrent) * Math.min(1, dt * 10);
    if (p.enterT < CONFIG.patientEnterTime) p.enterT += dt;
  }

  // sabır + feedback
  if (game.feedback) {
    game.feedback.t += dt;
    if (game.feedback.t >= CONFIG.feedbackDuration) onFeedbackEnd();
  } else {
    // tezgaha YENİ gelen hasta: bekleyişte tükenen sabır tabana çekilir (bir kez)
    const front = activePatient();
    if (front && !front.atCounter) {
      front.atCounter = true;
      front.patience = Math.max(front.patience, front.maxPatience * CONFIG.counterPatienceFloor);
    }
    for (let i = 0; i < game.queue.length; i++) {
      const p = game.queue[i];
      let rate = i === 0 ? 1 : CONFIG.queuePatienceMultiplier;
      // reçete inceleme fazında aktif hastanın sabrı DONUK (acele baskısı yok)
      if (i === 0 && p.request.type === "prescription" && !p.decided) rate = 0;
      p.patience -= dt * rate;
    }
    const act = activePatient();
    if (act && act.patience <= 0 && act.request.type === "beggarpay") {
      // Borcunu ödemeye gelen bekleyemedi: para ALINMAZ, ama CEZA DA YOK. Bu bir ödül
      // hastası; kaçırmanın bedeli ödülün kendisidir. Küsen müşteri sayacına da girmez.
      act.patience = 0;
      game.feedback = { ok: false, angry: false, text: "Borçlu bekleyemedi, gitti", t: 0 };
    } else if (act && act.patience <= 0 && act.request.type === "beggar") {
      // Dilencinin sabrı bitti: REDDETMİŞ sayılır (aynı ceza). "Küsen müşteri"
      // sayacına GİRMEZ — o gün programının müşterisi değil.
      act.patience = 0;
      beggarRefuse(true);
    } else if (act && act.patience <= 0) {
      act.patience = 0;
      game.dayStats.angry++;
      // Hasta gitti: onun için kurulan sepet anlamını yitirdi. Stok DÜŞMEDİĞİ için
      // (düşüm yalnız checkOrder'da) kayıp yok, sadece seçim sıfırlanır.
      clearCart();
      game.flyAnims = [];
      // SATIŞ ekranı açıksa orada durmanın anlamı kalmadı — ana ekrana dön.
      // (Depo/geliştirme/Medula zaten oyunu dondurduğu için buraya hiç düşemez.)
      if (isSaleOpen()) game.pcScreen = "home";
      game.feedback = { ok: false, angry: true, text: "😠 Çok beklettin!", t: 0 };
      patientReact(act, "angry");
      loseReputation(CONFIG.angryRepLoss);
    }
  }
}

// =====================================================================
//  RENDER YARDIMCILARI
// =====================================================================
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fillRoundRect(x, y, w, h, r, color) {
  roundRect(x, y, w, h, r);
  ctx.fillStyle = color;
  ctx.fill();
}
function strokeRoundRect(x, y, w, h, r, color, lineW) {
  roundRect(x, y, w, h, r);
  ctx.lineWidth = lineW;
  ctx.strokeStyle = color;
  ctx.stroke();
}
// Büfeci tarzı koyu yarı saydam panel: yumuşak gölge + ince amber kenarlık
function drawPanel(x, y, w, h, r, fill, border) {
  const c = CONFIG.colors;
  ctx.save();
  ctx.shadowColor = c.panelShadow;
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 5;
  fillRoundRect(x, y, w, h, r, fill || c.panelBg);
  ctx.restore();
  strokeRoundRect(x, y, w, h, r, border || c.panelBorder, Math.max(1, w * 0.004));
}
function text(str, x, y, size, color, align, weight) {
  ctx.fillStyle = color;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  ctx.font = uiFont(weight || "600", size);
  ctx.fillText(str, x, y);
  if (_crtAlerts) crtNote(str, x, y, color, size * UI_FONT_K);
}

// =====================================================================
//  RENDER — bölümler
// =====================================================================
// Oyun içi arka plan. ECZACININ GÖZÜNDEN: tezgahın arkasından müşteri tarafına bakılır, müşterinin
// arkasında eczanenin giriş kapısı ve vitrin görünür (Kerem isteği). Yeni görseller:
//   assets/bg_shop_day.png   — gündüz: kapıdan güneşli sokak
//   assets/bg_shop_night.png — nöbet gecesi: kapıdan gece sokağı (aynı kompozisyon)
// Yoksa eski bg_pharmacy.png (raflar) kullanılır. Gece görseli varsa nöbet bölümünde gündüz
// görselinin üstüne nightT ile yumuşakça biner; gece tonlaması (drawNightOverlay) o zaman hafifler.
function shopBgKeys() {
  const day = imgReady("shop_day") ? "shop_day" : "bg_pharmacy";
  const night = imgReady("shop_night") ? "shop_night" : null;
  return { day, night };
}
function drawBackground() {
  const w = layout.w, h = layout.h;
  const k = shopBgKeys(), nt = game.nightT || 0;
  if (k.night && nt >= 0.999) { Sprite.draw(ctx, k.night, 0, 0, w, h, null, "cover"); return; }
  Sprite.draw(ctx, k.day, 0, 0, w, h, (ctx, x, y, bw, bh) => {
    const g = ctx.createLinearGradient(0, 0, 0, bh);
    g.addColorStop(0, CONFIG.colors.bgTop);
    g.addColorStop(0.5, CONFIG.colors.bg);
    g.addColorStop(1, CONFIG.colors.bg);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, bw, bh);
  }, "cover");
  if (k.night && nt > 0.002) {
    ctx.save(); ctx.globalAlpha = nt; Sprite.draw(ctx, k.night, 0, 0, w, h, null, "cover"); ctx.restore();
  }
}

// Retro kart HUD (Büfeci düzeni): iki koyu, kalın kenarlıklı iki satırlı kutu + ortada EV.
// SOL: [GÜN N | tarih] / [HAVA ADI | hava emojisi] — SAĞ: [😊 | %N] / [💵 | 1.100₺]
function drawHUD() {
  const hud = layout._hud;
  const c = CONFIG.colors;
  const r = hud.h * 0.16;                    // köşeli-yumuşak
  const bw = Math.max(2, hud.h * 0.055);     // kalın retro kenarlık

  // Kutular ana ekranın dolap dilinde: ceviz yüz + pirinç çerçeve; yazılar tabela (Oswald)
  // ve plaka (Zilla Slab) fontuyla. Yerleşim, ölçüler ve satırlar eskisiyle BİREBİR aynı.
  const retroBox = (bx, bwid) => {
    woodPanel(bx, hud.y, bwid, hud.h, false, bw * 1.25);
    ctx.save(); roundRect(bx + bw, hud.y + bw, bwid - bw * 2, hud.h - bw * 2, 4); ctx.clip();   // okunurluk için hafif koyulaştır
    ctx.fillStyle = "rgba(18,9,3,0.28)"; ctx.fillRect(bx, hud.y, bwid, hud.h); ctx.restore();
  };
  const HUD_GOLD = "#f3cf7a", HUD_CREAM = "#e6d3ad", HUD_GREEN = "#a6e6a0";
  const hudNum = (str, x, y, maxW, px, col, align) => {        // sayı satırı: Oswald
    let sz = px * 1.08;
    ctx.font = "600 " + sz + "px " + SIGN_FONT;
    while (sz > px * 0.5 && ctx.measureText(str).width > maxW) { sz -= 0.5; ctx.font = "600 " + sz + "px " + SIGN_FONT; }
    ctx.save(); ctx.shadowColor = "rgba(0,0,0,0.6)"; ctx.shadowOffsetY = 1; ctx.shadowBlur = 1.5;
    ctx.fillStyle = col; ctx.textAlign = align; ctx.textBaseline = "middle"; ctx.fillText(str, x, y); ctx.restore();
  };

  const y1 = hud.y + hud.h * 0.30;   // üst satır
  const y2 = hud.y + hud.h * 0.71;   // alt satır
  const fs1 = hud.h * 0.26, fs2 = hud.h * 0.23;

  // SOL kutu: satır1 GÜN (sezon içindeki konum), satır2 tarih. Gün satırı artık
  // "GÜN 12 / 30" taşıdığı için kutu 0.36 → 0.38 genişletildi ve satıra kutunun daha
  // büyük payı verildi (0.82 → 0.90). DAHA FAZLA genişletilemez: nöbet rozeti sol kutu
  // ile EV butonu arasındaki boşlukta yaşıyor ve 0.40'ta o boşluk rozetin alt eşiğinin
  // (hud.h*0.18) altına düşüp rozeti görünmez yapıyor.
  const lw = hud.w * 0.38;
  const lpad = lw * 0.09;
  retroBox(hud.x, lw);
  // SEZON NUMARASI 2. satıra, tarihin önüne kondu. 1. satıra ("SEZON 3 · GÜN 12 / 30")
  // sığdırmak denendi: fitText o metni kutuya sokmak için puntoyu 2. satırın ALTINA
  // düşürüyor, yani birincil satır ikincilden küçük görünüyordu. Böyle her iki bilgi de
  // kendi puntosunda okunur kalıyor ve HUD düzeni hiç değişmiyor.
  hudNum("GÜN " + game.dayNumber + " / " + CONFIG.seasonDays,
    hud.x + lpad, y1, lw * 0.82, fs1 * 1.06, HUD_GOLD, "left");
  fitTextF("Sezon " + careerSeason() + " · " + dateShort(),
    hud.x + lpad, y2, lw * 0.82, fs2, HUD_CREAM, "left", "600", SLAB_FONT);

  // SAĞ kutu: satır1 solda itibar emojisi, sağda %N; satır2 solda 💵, sağda para
  const rw = hud.w * 0.36;
  const rx = hud.x + hud.w - rw;
  const rpad = rw * 0.09;
  retroBox(rx, rw);
  // İtibar arkada %100'ü aşabilir (yumuşak tavan, repMax'e kadar yastık) ama GÖSTERGE en fazla
  // %100 yazar (Kerem kararı). Yastık oyunda aynen çalışır; yalnız sayı 100'de durur.
  const pct = repShown(game.reputation);
  const repEmoji = pct < 35 ? "😡" : pct < 70 ? "😑" : pct < 100 ? "😊" : "😄";
  drawEmoji(repEmoji, rx + rpad + fs1 * 0.5, y1, fs1, "#000");
  hudNum("%" + pct, rx + rw - rpad, y1, rw * 0.5, fs1, HUD_GOLD, "right");
  drawEmoji("💵", rx + rpad + fs2 * 0.5, y2, fs2, "#000");
  hudNum(formatMoney(game.money), rx + rw - rpad, y2, rw * 0.62, fs2, HUD_GREEN, "right");

  // NÖBET rozeti — sol kutu ile EV butonu arasındaki boşlukta (HUD düzeni değişmez).
  // Nöbet günü boyunca durur; gece bölümünde dolgusu parlar.
  if (isNightDutyDay(game.dayNumber)) {
    // Rozet, sol kutu ile EV butonu arasındaki BOŞLUĞA sığdırılır (ikisine de binmez).
    const homeS = hud.h * 0.78;                       // EV butonu ölçüsü (aşağıda aynısı)
    const gapL = hud.x + lw;                          // sol kutunun sağ kenarı
    const gapR = hud.x + hud.w / 2 - homeS / 2;       // EV butonunun sol kenarı
    const bs = Math.min(hud.h * 0.56, Math.max(0, gapR - gapL) * 0.78);
    const bx = gapL + ((gapR - gapL) - bs) / 2;       // boşlukta ortala
    const by = hud.y + (hud.h - bs) / 2;
    if (bs > hud.h * 0.18) {
    const on = game.phase === "night";
    ctx.save();
    ctx.globalAlpha = on ? 1 : 0.8;
    enamelPlate(bx, by, bs, bs, "navy");                     // lacivert emaye (menüdeki NÖBETÇİ levhası)
    if (on) { ctx.shadowColor = "rgba(255,230,150,0.9)"; ctx.shadowBlur = bs * 0.35; }
    drawEmoji("🌙", bx + bs / 2, by + bs / 2, bs * 0.52, "#000");
    ctx.restore();
    }
  }

  // ORTA: kare EV butonu — menüye döner (oyun verisi silinmez)
  const hs = hud.h * 0.78;
  const hx = hud.x + hud.w / 2 - hs / 2;
  const hy = hud.y + (hud.h - hs) / 2;
  layout.homeBtn = { x: hx, y: hy, w: hs, h: hs };
  woodPanel(hx, hy, hs, hs, false);                    // ceviz + pirinç (ana ekran dili)
  // emoji tam merkez + minik optik offset (emoji baseline'ı hafif yukarı render olur)
  drawEmoji("🏠", hx + hs / 2, hy + hs / 2, hs * 0.48, "#000");
}

// ---- kuyruk yerleşimi: pozisyon değerini sahne koordinatına çevir ----
//  Aktif müşteri: DEV, ortada, tezgah bandının ardına göğüsten gömülü.
//  Bekleyenler: görünmez (tezgahın altında); öne gelince banttan yükselir.
function slotLayout(i) {
  const S = layout.stage;
  const counterLine = layout._counterLine;
  // reçeteli aktif hastada sol panel açılır => müşteri küçülüp sağa kayar
  const ap = activePatient();
  const presc = !!(ap && ap.request.type === "prescription");
  const cx = presc ? S.x + S.w * 0.745 : S.x + S.w * 0.5;
  const charH = presc ? S.h * 0.40 : S.h * 0.675;
  if (i <= 0) {
    return {
      cx,
      baseY: presc ? counterLine + S.h * 0.13 : counterLine + S.h * 0.345,
      charH,
      alpha: 1,
      active: 1
    };
  }
  // bekleyen: aynı konumda ama tezgahın altında ve görünmez (öne gelince yükselir)
  return {
    cx,
    baseY: counterLine + S.h * 0.55,
    charH,
    alpha: 0,
    active: 0
  };
}
function getPatientLayout(pos) {
  const i0 = Math.floor(pos), f = pos - i0;
  const a = slotLayout(i0), b = slotLayout(i0 + 1);
  return {
    cx: lerp(a.cx, b.cx, f),
    baseY: lerp(a.baseY, b.baseY, f),
    charH: lerp(a.charH, b.charH, f),
    alpha: lerp(a.alpha, b.alpha, f),
    active: lerp(a.active, b.active, f)
  };
}

// şeffaf karakterler için yumuşak, sıcak elips zemin gölgesi
function drawGroundShadow(cx, cy, rx, ry) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, "rgba(70, 45, 25, 0.38)");
  g.addColorStop(0.55, "rgba(70, 45, 25, 0.18)");
  g.addColorStop(1, "rgba(70, 45, 25, 0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, rx, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Sabır barı ÇİZİLMİYOR (görsel olarak gizli) — sabır sistemi aynen işler:
// update() azaltır, biten hasta küser, itibar düşer, reçete incelemede donar.
// Konsoldan takip: cheats.setPatience(n) ve cheats.state().activePatience

function drawOnePatient(p) {
  const counterLine = layout._counterLine;
  const L = getPatientLayout(p.posCurrent);
  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const ease = 1 - Math.pow(1 - enter, 3);
  const alpha = L.alpha * ease;

  const ratio = clamp(p.patience / p.maxPatience, 0, 1);
  // sabır azaldıkça hafif titreme (kızgınlık)
  let dx = 0;
  if (ratio < 0.35) dx = Math.sin(game.clock * 24) * L.charH * 0.018 * (1 - ratio / 0.35);

  const cx = L.cx + dx;
  const charH = L.charH;

  ctx.globalAlpha = alpha;

  // 1) zemin gölgesi (tezgah çizgisinde, karakterin yere/tezgaha bastığı his)
  drawGroundShadow(cx, counterLine - charH * 0.012, charH * 0.34, charH * 0.075);

  // 2) karakter — şeffaf PNG, contain (oran korunur, gerilme/kırpma yok)
  //    Kutu kare; 3:4 karakter yükseklikten sınırlanır => yatayda ortalı oturur.
  const boxX = cx - charH / 2;
  const boxY = L.baseY - charH;
  Sprite.draw(ctx, p.avatarKey, boxX, boxY, charH, charH, () => {
    drawEmoji(p.avatar, cx, L.baseY - charH * 0.5, charH * 0.82, "#000");
  }, "contain");

  ctx.globalAlpha = 1;
  // (sabır barı bilinçli olarak çizilmiyor; sabır mantığı update()'te aynen işler)
}

// semptomlu hasta — baş üstü konuşma balonu (reçetelilerde sol panel kullanılır)
function drawSymptomBubble(p) {
  const area = layout._patientArea;
  const counterLine = layout._counterLine;
  const areaH = counterLine - area.y;
  const L = getPatientLayout(p.posCurrent);
  if (L.active < 0.12) return;

  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const a = L.active * (1 - Math.pow(1 - enter, 3));
  const headTop = L.baseY - L.charH;
  const cx = L.cx;

  const bubbleW = Math.min(area.w * 0.76, areaH * 1.6);
  const bubbleH = areaH * 0.28;
  let bubbleY = headTop - areaH * 0.03 - bubbleH;
  if (bubbleY < area.y) bubbleY = area.y;
  const bubbleX = cx - bubbleW / 2;
  ctx.globalAlpha = a;
  drawSpeechBubble(bubbleX, bubbleY, bubbleW, bubbleH, cx, bubbleY + bubbleH);
  drawSymptom(p.request, bubbleX, bubbleY, bubbleW, bubbleH, p.line);
  layout._talkRect = { x: bubbleX, y: bubbleY, w: bubbleW, h: bubbleH };
  ctx.globalAlpha = 1;
}

// dilenci — baş üstü replik balonu. Semptom balonuyla AYNI yerleşim (ortada, başın
// üstünde): reçete paneli olmadığı için sağa kaçırmaya gerek yok. İçerik ikon değil metin,
// balon iki satıra kadar taşıyabilsin diye semptom balonundan biraz alçak.
function drawBeggarBubble(p, say) {
  const area = layout._patientArea;
  const counterLine = layout._counterLine;
  const areaH = counterLine - area.y;
  const L = getPatientLayout(p.posCurrent);
  if (L.active < 0.12) return;
  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const a = L.active * (1 - Math.pow(1 - enter, 3));
  const headTop = L.baseY - L.charH;
  const cx = L.cx;

  const bubbleW = Math.min(area.w * 0.84, areaH * 1.7);
  const bubbleH = areaH * 0.20;
  let bubbleY = headTop - areaH * 0.03 - bubbleH;
  if (bubbleY < area.y) bubbleY = area.y;
  const bubbleX = cx - bubbleW / 2;
  ctx.globalAlpha = a;
  drawSpeechBubble(bubbleX, bubbleY, bubbleW, bubbleH, cx, bubbleY + bubbleH);
  // Replik uzun (tam cümle): iki satıra bölünür, sığmazsa fitText puntoyu kısar.
  const lines = wrapToLines(say || p.line, bubbleW * 0.86, bubbleH * 0.30, 2);
  const lineH = bubbleH * 0.34;
  const startY = bubbleY + bubbleH / 2 - (lines.length - 1) * lineH / 2;
  for (let i = 0; i < lines.length; i++) {
    fitText(lines[i], bubbleX + bubbleW / 2, startY + i * lineH, bubbleW * 0.86,
      bubbleH * 0.28, "#3a3326", "center", "700");
  }
  ctx.globalAlpha = 1;
}

// Metni verilen genişliğe göre en çok maxLines satıra böl (kelime bazlı; sığmayan
// kalan son satıra eklenir — fitText orada puntoyu kısar, taşma olmaz).
function wrapToLines(str, maxW, px, maxLines) {
  const words = String(str || "").split(" ");
  ctx.font = UI_FONT ? uiFont("700", px) : "700 " + px + "px " + RX_FONT;   // çizilecek fontla ölç
  const lines = [];
  let cur = "";
  for (const w of words) {
    const test = cur ? cur + " " + w : w;
    if (cur && ctx.measureText(test).width > maxW && lines.length < maxLines - 1) {
      lines.push(cur);
      cur = w;
    } else {
      cur = test;
    }
  }
  if (cur) lines.push(cur);
  return lines;
}

// reçeteli hasta — baş üstü kısa replik balonu (replik spawn'da seçilir, p.line).
// Reçete paneli SOLDA (stage %4-46); balon hastanın üstünde sağda, panele girmez.
function drawPrescriptionBubble(p) {
  if (!p.line) return;
  const area = layout._patientArea;
  const S = layout.stage;
  const L = getPatientLayout(p.posCurrent);
  if (L.active < 0.12) return;
  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const a = L.active * (1 - Math.pow(1 - enter, 3));

  const bubbleW = S.w * 0.42, bubbleH = S.h * 0.072;
  let bx = L.cx - bubbleW / 2;
  bx = Math.min(bx, S.x + S.w * 0.97 - bubbleW);   // sağdan taşmasın
  bx = Math.max(bx, S.x + S.w * 0.48);             // reçete panelinin (sağ kenar %46) sağında kal
  const headTop = L.baseY - L.charH;
  let by = headTop - bubbleH - S.h * 0.015;
  if (by < area.y) by = area.y;
  const tailX = clamp(L.cx, bx + bubbleW * 0.15, bx + bubbleW * 0.85);

  ctx.globalAlpha = a;
  drawSpeechBubble(bx, by, bubbleW, bubbleH, tailX, by + bubbleH);
  // tepki (karar anı) > sabırsızlık > ilk söz. Reçete balonunda yalnız söz var, bilgi yok →
  // sabırsızlık sözü doğrudan yerine geçebilir.
  const imp = impatienceLine(p), say = p.reaction || imp || p.line;
  fitText(say, bx + bubbleW / 2, by + bubbleH / 2, bubbleW * 0.88, bubbleH * 0.30,
    !p.reaction && imp ? "#9a2f24" : "#3a3326", "center", "700");
  ctx.globalAlpha = 1;
}

// reçeteli hasta — stage SOL ÜST köşesinde, sabit makul boyutlu DÜZ reçete paneli
function drawPrescriptionPanel(p) {
  const S = layout.stage;
  const area = layout._patientArea;
  const L = getPatientLayout(p.posCurrent);
  if (L.active < 0.12) return;
  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const a = L.active * (1 - Math.pow(1 - enter, 3));

  const w = S.w * 0.42;
  const h = Math.min(S.h * 0.40, area.h * 0.94);
  const x = S.x + S.w * 0.04;
  const top = area.y + S.h * 0.006;
  drawPrescriptionPaper(p, x + w / 2, top, w, h, a);
}

function drawQueue() {
  const area = layout._patientArea;
  const counterLine = layout._counterLine;
  if (game.queue.length === 0) {
    text("🚪 Müşteri bekleniyor...", area.x + area.w / 2, area.y + area.h * 0.6,
      area.h * 0.06, CONFIG.colors.cream, "center", "600");
    return;
  }
  // Sadece AKTİF müşteriyi çiz; tezgah çizgisinde kırp (göğüsten gömülü).
  // Bekleyenler görünmez (banttan yükselerek öne gelirler).
  ctx.save();
  ctx.beginPath();
  ctx.rect(area.x, area.y - area.h * 0.2, area.w, counterLine - (area.y - area.h * 0.2));
  ctx.clip();
  drawOnePatient(game.queue[0]);
  ctx.restore();

  // reçeteli => sol büyük panel + baş üstü replik balonu; semptomlu => baş üstü balon
  const p0 = game.queue[0];
  layout._talkRect = null;
  if (isBeggarType(p0.request.type)) {
    drawBeggarBubble(p0);      // iki dilenci tipi aynı balon yerleşimini paylaşır
  } else if (p0.reaction && p0.request.type !== "prescription") {
    drawBeggarBubble(p0, p0.reaction);   // karar anı: müşterinin cevabı (semptom / Meluda)
  } else if (p0.request.type === "prescription") {
    drawPrescriptionPanel(p0);
    drawPrescriptionBubble(p0);
  } else if (p0.request.type === "medula") {
    layout.medulaCardRect = null;
    if (medulaIsRevealed(p0.request.code)) drawMedulaRecordPanel(p0);   // sorgulanmışsa liste solda kalır
    drawMedulaBubble(p0);
    checkMedulaLayout(p0.request.code + (layout.medulaCardRect ? ":k" : ""));
  } else {
    drawSymptomBubble(p0);
  }
  // Sabırsızlık etiketi: semptom / Meluda balonunun üst köşesine iliştirilir (balondaki
  // semptom bilgisi örtülmez). Reçetelide söz balonun kendisinde.
  const imp = p0.request.type !== "prescription" ? impatienceLine(p0) : null;
  if (imp && layout._talkRect) drawImpatienceTag(imp, layout._talkRect, p0.patience / p0.maxPatience, p0.request.type === "medula");
  // (bekleyen "+N" rozeti kaldırıldı — kuyruk bilgisi oyuncuya sızdırılmıyor)
}

// Balonun sağ üst köşesine iliştirilen küçük "sabırsızlık" etiketi. Sabır çubuğu bilerek
// gizli; bu etiket yalnız hasta zaten titremeye başladığında (%35) görünür, %15'te kızarır.
function drawImpatienceTag(txt, r, ratio, below) {
  const S = layout.stage, hard = ratio < 0.15;
  const th = S.h * 0.034;
  ctx.font = "800 " + (th * 0.46) + "px " + RX_FONT;
  const tw = Math.min(r.w * 0.8, ctx.measureText("⏳ " + txt).width + th * 0.9);
  const wob = Math.sin((game.clock || 0) * (hard ? 14 : 7)) * th * (hard ? 0.06 : 0.03);
  const hudBot = layout._hud ? layout._hud.y + layout._hud.h + th * 0.15 : S.y;   // HUD'a binmesin
  const tx = Math.min(r.x + r.w - tw * 0.85, S.x + S.w * 0.98 - tw);
  // below: balonun ALT köşesi (Meluda balonunun üstünde replik satırı var, örtülmesin)
  const ty = (below ? r.y + r.h - th * 0.35 : Math.max(hudBot, r.y - th * 0.9)) + wob;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.3)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
  fillRoundRect(tx, ty, tw, th, th * 0.5, hard ? "#b8352a" : "#f3d9a0");
  ctx.shadowColor = "transparent";
  strokeRoundRect(tx, ty, tw, th, th * 0.5, hard ? "#6e1a12" : "#8a5a22", 1.2);
  fitText("⏳ " + txt, tx + tw / 2, ty + th / 2, tw * 0.9, th * 0.46, hard ? "#fff2dc" : "#6a2a14", "center", "800");
  ctx.restore();
}

// tezgahta duran kapalı defter (yalnız bookState === "closed" iken)
function drawClosedBook() {
  if (game.bookState !== "closed") return;
  const b = layout.bookClosedRect;
  if (!b) return;
  // yumuşak zemin gölgesi (tezgaha yaslanmış his)
  drawGroundShadow(b.x + b.w / 2, b.y + b.h * 0.96, b.w * 0.5, b.h * 0.16);
  Sprite.draw(ctx, "doctor_book_closed", b.x, b.y, b.w, b.h, () => {
    // fallback: koyu kapalı defter + "Doktorlar"
    fillRoundRect(b.x, b.y, b.w, b.h, b.h * 0.18, "#6b4a2f");
    strokeRoundRect(b.x, b.y, b.w, b.h, b.h * 0.18, "rgba(245,200,140,0.5)", 2);
    // fitText: kutuya sığdır — önceden taşıyordu, yanındaki radyonun üstüne biniyordu
    fitText("📕 Doktorlar", b.x + b.w / 2, b.y + b.h / 2, b.w * 0.86, b.h * 0.42, "#f8ecd9", "center", "800");
  }, "contain");
}

// açık defterin ekran ortasındaki hedef dikdörtgeni (contain)
function openBookBox() {
  const S = layout.stage;
  const boxW = S.w * 0.94, boxH = S.h * 0.64;
  const boxX = S.x + (S.w - boxW) / 2, boxY = S.y + (S.h - boxH) / 2;
  const img = Assets.images["doctor_book"];
  const aspect = (img && img.naturalWidth) ? (img.naturalWidth / img.naturalHeight) : 1.5;
  let dw, dh;
  if (boxW / boxH > aspect) { dh = boxH; dw = dh * aspect; } else { dw = boxW; dh = dw / aspect; }
  return { x: boxX + (boxW - dw) / 2, y: boxY + (boxH - dh) / 2, w: dw, h: dh };
}

// açık defter içeriği — 20 doktor, iki sütun; her isim kağıttaki ÇİZGİNİN üstüne
// oturur (baseline çizgide). Hiza CONFIG.bookTextStartY / bookLineStep ile elle ayarlanır
// (ikisi de kitap yüksekliğine oran). Başlık kitabın DIŞINDA (drawBookOverlay'de plaka).
function drawBookContent(r) {
  const ink = "#3a3326";
  const names = KNOWN_DOCTORS.map(d => d.name).slice().sort((a, b) => a.localeCompare(b, "tr"));
  const perCol = Math.ceil(names.length / 2);
  const startY = r.y + r.h * CONFIG.bookTextStartY;
  const step = r.h * CONFIG.bookLineStep;
  const colX = [r.x + r.w * 0.15, r.x + r.w * 0.55];   // sol/sağ sayfa iç kenarları
  const colW = r.w * 0.30;
  const fsMax = step * 0.52;
  ctx.save();
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";           // baseline = kağıt çizgisi
  ctx.fillStyle = ink;
  for (let i = 0; i < names.length; i++) {
    const col = i < perCol ? 0 : 1;
    const rowI = i % perCol;
    const ny = startY + rowI * step;
    // sütuna sığdır: punto gerekirse hafif küçülür, taşma yok
    let s = fsMax;
    ctx.font = "600 " + s + "px " + RX_FONT;
    while (s > 6 && ctx.measureText(names[i]).width > colW) { s -= 0.5; ctx.font = "600 " + s + "px " + RX_FONT; }
    ctx.fillText(names[i], colX[col], ny);
  }
  ctx.restore();
}

// açık defter çizim yardımcısı (contain + krem fallback)
function drawOpenBookImage(r) {
  Sprite.draw(ctx, "doctor_book", r.x, r.y, r.w, r.h, () => {
    fillRoundRect(r.x, r.y, r.w, r.h, r.w * 0.03, "#efe2c8");
    strokeRoundRect(r.x, r.y, r.w, r.h, r.w * 0.03, "rgba(120,90,50,0.5)", 2);
    ctx.strokeStyle = "rgba(120,90,50,0.35)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(r.x + r.w / 2, r.y + r.h * 0.06); ctx.lineTo(r.x + r.w / 2, r.y + r.h * 0.94); ctx.stroke();
  }, "contain");
}

// açılma/kapanma animasyonu + açık panel (en üstte)
function drawBookOverlay() {
  if (game.bookState === "closed") return;
  // eased ilerleme
  const t = game.bookT;
  const prog = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  // arka karartma (modal)
  ctx.fillStyle = "rgba(8,6,12," + (0.6 * prog).toFixed(3) + ")";
  ctx.fillRect(0, 0, layout.w, layout.h);

  const start = layout.bookClosedRect;
  const end = openBookBox();
  const cur = {
    x: lerp(start.x, end.x, prog),
    y: lerp(start.y, end.y, prog),
    w: lerp(start.w, end.w, prog),
    h: lerp(start.h, end.h, prog)
  };

  if (game.bookState === "open") {
    // tam açık: net açık defter + içerik + kapatma
    drawOpenBookImage(end);
    drawBookContent(end);
    // "Tanınan Doktorlar" başlığı — kitabın DIŞINDA, üst kenarın hemen üstünde krem plaka
    const plW = end.w * 0.56, plH = end.h * 0.075;
    const plX = end.x + (end.w - plW) / 2;

    const cb = layout.bookCloseBtn;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    ctx.beginPath(); ctx.arc(cb.x + cb.w / 2, cb.y + cb.h / 2, cb.w / 2, 0, Math.PI * 2);
    ctx.fillStyle = "#3a2230"; ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "#e8736b"; ctx.lineWidth = Math.max(2, cs * 0.06);
    ctx.beginPath(); ctx.arc(cb.x + cb.w / 2, cb.y + cb.h / 2, cb.w / 2, 0, Math.PI * 2); ctx.stroke();
    text("✕", cb.x + cb.w / 2, cb.y + cb.h / 2, cs * 0.5, "#e8736b", "center", "800");
  } else {
    // geçiş (opening/closing): kapalı defter fade-out, açık defter fade-in (crossfade + scale)
    ctx.globalAlpha = 1 - prog;
    Sprite.draw(ctx, "doctor_book_closed", cur.x, cur.y, cur.w, cur.h, () => {
      fillRoundRect(cur.x, cur.y, cur.w, cur.h, cur.h * 0.18, "#6b4a2f");

    ctx.globalAlpha = prog;
    drawOpenBookImage(cur);
    ctx.globalAlpha = 1;
  }
}

// --- GECE KATMANI ---
// Yeni asset yok: mevcut sahnenin üzerine koyu mavi/mor bir katman + tezgahta sıcak ışık.
// drawBackground'ın hemen ardından çizilir; hasta/tezgah/UI üstte kalır (lambanın altı).
function drawNightOverlay() {
  const t = game.nightT || 0;
  if (t <= 0.002) return;
  const w = layout.w, h = layout.h;

  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  // gece görseli varsa sahne zaten gece: tonlama yalnız hafif bir birlik katmanı
  ctx.globalAlpha = (shopBgKeys().night ? 0.22 : 0.66) * t;
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#2a2560");      // üstte gece mavisi
  g.addColorStop(0.55, "#3b2f6b");   // ortada mor
  g.addColorStop(1, "#4a3a70");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();

  // tezgah aydınlatması sıcak kalsın — bandın üstüne yumuşak amber hâle
  const b = layout._band;
  if (b) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.30 * t;
    const cx = b.x + b.w / 2, cy = b.y;
    const rad = Math.max(b.w * 0.75, b.h * 3);
    const rg = ctx.createRadialGradient(cx, cy, b.h * 0.15, cx, cy, rad);
    rg.addColorStop(0, "rgba(255, 196, 120, 0.95)");
    rg.addColorStop(0.55, "rgba(255, 170, 80, 0.28)");
    rg.addColorStop(1, "rgba(255, 160, 70, 0)");
    ctx.fillStyle = rg;
    ctx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
    ctx.restore();
  }
}
