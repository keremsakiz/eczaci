  const shown = game.medulaInput + "_".repeat(Math.max(0, CONFIG.medulaCodeLen - game.medulaInput.length));
  fitText(shown.split("").join(" "), inX + inW / 2, inY + inH / 2, inW * 0.9, inH * 0.55, "#d8f0e0", "center", "800");

  // --- sonuç / uyarı alanı ---
  const resY = inY + inH + r.h * 0.022;
  const resH = r.h * 0.20;
  const res = game.medulaResult;
  if (res && res.error) {
    fillRoundRect(inX, resY, inW, r.h * 0.052, r.h * 0.026, "rgba(232,115,107,0.16)");
    strokeRoundRect(inX, resY, inW, r.h * 0.052, r.h * 0.026, "rgba(232,115,107,0.75)", 1.5);
    fitText("⚠️ " + res.error, inX + inW / 2, resY + r.h * 0.026, inW * 0.9, r.h * 0.030, c.bad, "center", "800");
  } else if (res && res.items) {
    fillRoundRect(inX, resY, inW, resH, r.h * 0.02, "rgba(255,255,255,0.05)");
    strokeRoundRect(inX, resY, inW, resH, r.h * 0.02, "rgba(140, 220, 170, 0.5)", 1.5);
    fitText("Kayıt: " + res.code, inX + inW * 0.5, resY + resH * 0.14, inW * 0.8, r.h * 0.028, "#8fe3a8", "center", "800");
    const n = res.items.length;
    const lh = (resH * 0.72) / Math.max(1, n);
    const fs = Math.min(lh * 0.58, r.h * 0.030);
    let ly = resY + resH * 0.30;
    for (const it of res.items) {
      const m = getMedicine(it.id);
      fitText(m ? m.name : it.id, inX + inW * 0.06, ly, inW * 0.62, fs, c.cream, "left", "700");
      fitText("× " + it.qty, inX + inW * 0.94, ly, inW * 0.2, fs, c.neon, "right", "800");
      ly += lh;
    }
  } else {
    fitText("Hastanın verdiği 6 haneli kodu gir", inX + inW / 2, resY + r.h * 0.026, inW * 0.9, r.h * 0.028, c.creamSoft, "center", "600");
  }

  // --- tuş takımı: alfabe + SİL + TAMAM ---
  const padTop = resY + resH + r.h * 0.02;
  const padBot = r.y + r.h * 0.97;
  // 36 karakter = 6×6 tam ızgara (eksik/boş tuş kalmaz), +1 satır SİL/SORGULA için
  const cols = 6;
  const chars = MEDULA_ALPHABET.split("");
  const rowsN = Math.ceil(chars.length / cols) + 1;          // +1: aksiyon satırı
  const gapK = r.w * 0.012;
  const kw = (r.w * 0.90 - gapK * (cols - 1)) / cols;
  const kh = Math.min(kw, (padBot - padTop - gapK * (rowsN - 1)) / rowsN);
  const padX0 = r.x + (r.w - (kw * cols + gapK * (cols - 1))) / 2;

  layout.medulaKeys = [];
  for (let i = 0; i < chars.length; i++) {
    const cx = i % cols, cy = Math.floor(i / cols);
    const kx = padX0 + cx * (kw + gapK), ky = padTop + cy * (kh + gapK);
    const on = game.medulaInput.length < CONFIG.medulaCodeLen;
    layout.medulaKeys.push({ ch: chars[i], x: kx, y: ky, w: kw, h: kh, enabled: on });
    fillRoundRect(kx, ky, kw, kh, kh * 0.22, c.btnDark);
    strokeRoundRect(kx, ky, kw, kh, kh * 0.22, on ? "rgba(245,170,70,0.55)" : c.neonDim, 1.2);
    fitText(chars[i], kx + kw / 2, ky + kh / 2, kw * 0.7, kh * 0.52, on ? c.cream : c.neonDim, "center", "800");
  }

  // aksiyon satırı: SİL (sol yarı) + TAMAM (sağ yarı)
  const ay = padTop + Math.ceil(chars.length / cols) * (kh + gapK);
  const aW = (kw * cols + gapK * (cols - 1) - gapK) / 2;
  const delOn = game.medulaInput.length > 0;
  const okOn = game.medulaInput.length === CONFIG.medulaCodeLen;
  layout.medulaDel = { x: padX0, y: ay, w: aW, h: kh, enabled: delOn };
  fillRoundRect(padX0, ay, aW, kh, kh * 0.22, c.btnDark);
  strokeRoundRect(padX0, ay, aW, kh, kh * 0.22, delOn ? "rgba(232,115,107,0.75)" : c.neonDim, 1.5);
  fitText("⌫ SİL", padX0 + aW / 2, ay + kh / 2, aW * 0.8, kh * 0.42, delOn ? c.bad : c.neonDim, "center", "800");

  const okX = padX0 + aW + gapK;
  layout.medulaOk = { x: okX, y: ay, w: aW, h: kh, enabled: okOn };
  fillRoundRect(okX, ay, aW, kh, kh * 0.22, c.btnDark);
  ctx.save();
  if (okOn) { ctx.shadowColor = c.neonGlow; ctx.shadowBlur = 12; }
  strokeRoundRect(okX, ay, aW, kh, kh * 0.22, okOn ? c.neon : c.neonDim, 1.5);
  ctx.restore();
  fitText("✓ SORGULA", okX + aW / 2, ay + kh / 2, aW * 0.86, kh * 0.42, okOn ? c.neon : c.neonDim, "center", "800");
}

// ECZANE GELİŞTİRME — seviyeli kalemler; satırda seviye, etki ve sonraki seviyenin fiyatı.
function drawUpgrades() {
  const c = CONFIG.colors;
  const r = drawPcScreen("ECZANE GELİŞTİRME");

  text("💰 " + formatMoney(game.money), r.x + r.w * 0.05, r.y + r.h * 0.05, r.h * 0.032, c.cream, "left", "700");

  // GERİ butonu (ana ekrana) — depo ekranındaki buton diliyle aynı
  const backW = r.w * 0.26, backH = r.h * 0.055;
  const backX = r.x + r.w * 0.95 - backW, backY = r.y + r.h * 0.028;
  layout.pcBackBtn = { x: backX, y: backY, w: backW, h: backH };
  fillRoundRect(backX, backY, backW, backH, backH * 0.35, c.btnDark);
  strokeRoundRect(backX, backY, backW, backH, backH * 0.35, "rgba(245,170,70,0.55)", 1.5);
  text("‹ GERİ", backX + backW / 2, backY + backH / 2, backH * 0.46, c.neon, "center", "800");

  // --- KATMAN SEKMELERİ ---
  // Sekme, ağaç 5 kalemden 8'e çıkınca kondu: tek listede satır yüksekliği okunamayacak
  // kadar küçülüyordu (ölçüldü). Depo ekranının sekme diliyle aynı.
  const TIERS = [{ id: 1, label: "🏪 ECZANE" }, { id: 2, label: "💼 İŞLETME" }];
  const tabsX = r.x + r.w * 0.05, tabsW = r.w * 0.90;
  const tabsY = r.y + r.h * 0.105, tabsH = r.h * 0.062;
  const tGap = tabsW * 0.02;
  const tW = (tabsW - tGap * (TIERS.length - 1)) / TIERS.length;
  layout.upgradeTabs = [];
  for (let i = 0; i < TIERS.length; i++) {
    const t = TIERS[i];
    const tx = tabsX + i * (tW + tGap);
    const active = game.upgradeTier === t.id;
    layout.upgradeTabs.push({ tier: t.id, x: tx, y: tabsY, w: tW, h: tabsH });
    if (active) {
      ctx.save(); ctx.shadowColor = c.neonGlow; ctx.shadowBlur = 8;
      fillRoundRect(tx, tabsY, tW, tabsH, tabsH * 0.28, "rgba(58,40,20,0.95)"); ctx.restore();
    } else {
      fillRoundRect(tx, tabsY, tW, tabsH, tabsH * 0.28, "rgba(255,255,255,0.04)");
    }
    strokeRoundRect(tx, tabsY, tW, tabsH, tabsH * 0.28,
      active ? c.neon : "rgba(245,170,70,0.22)", active ? 2 : 1);
    fitText(t.label, tx + tW / 2, tabsY + tabsH / 2, tW * 0.86, tabsH * 0.42,
      active ? c.neon : c.creamSoft, "center", "800");
  }

  const list = UPGRADES.filter(u => (u.tier || 1) === game.upgradeTier);
  const rowH = r.h * 0.128, rowGap = r.h * 0.018;
  const rx0 = r.x + r.w * 0.05, rw = r.w * 0.90;
  let ry = tabsY + tabsH + r.h * 0.025;

  layout.upgradeRows = [];
  for (const u of list) {
    const lv = upgradeLevel(u.id);
    const maxed = lv >= u.maxLevel;
    const locked = !upgradeUnlocked(u.id);
    const cost = maxed ? 0 : upgradeCost(u.id, lv + 1);
    const afford = game.money >= cost;
    const enabled = !maxed && !locked && afford;

    fillRoundRect(rx0, ry, rw, rowH, rowH * 0.20, "rgba(255,255,255,0.05)");
    strokeRoundRect(rx0, ry, rw, rowH, rowH * 0.20, "rgba(245,170,70,0.28)", 1);

    // sol: emoji + ad + etki
    drawEmoji(u.emoji, rx0 + rw * 0.07, ry + rowH * 0.42, rowH * 0.34, c.cream);
    const nameX = rx0 + rw * 0.14;
    fitText(u.name, nameX, ry + rowH * 0.26, rw * 0.42, rowH * 0.24, c.cream, "left", "800");
    fitText(u.desc, nameX, ry + rowH * 0.52, rw * 0.46, rowH * 0.17, c.creamSoft, "left", "600");
    fitText("Şu an: " + u.valueAt(lv), nameX, ry + rowH * 0.78, rw * 0.46, rowH * 0.19, c.good, "left", "700");

    // seviye noktaları (Lv göstergesi)
    const dotR = rowH * 0.055, dotGap = dotR * 2.8;
    const dotsW = (u.maxLevel - 1) * dotGap;
    const dotsX = rx0 + rw * 0.66 - dotsW / 2;
    for (let i = 0; i < u.maxLevel; i++) {
      ctx.beginPath();
      ctx.arc(dotsX + i * dotGap, ry + rowH * 0.28, dotR, 0, Math.PI * 2);
      ctx.fillStyle = i < lv ? c.neon : "rgba(255,255,255,0.18)";
      ctx.fill();
    }
    fitText("Lv " + lv + "/" + u.maxLevel, rx0 + rw * 0.66, ry + rowH * 0.50, rw * 0.20, rowH * 0.17, c.creamSoft, "center", "700");

    // sağ: satın alma butonu ya da TAM
    const bW = rw * 0.24, bH = rowH * 0.44;
    const bX = rx0 + rw - bW - rw * 0.02, bY = ry + (rowH - bH) / 2;
    // Dokunma kutusu ÇİZİLEN butondan büyük: buton satıra sığsın diye 29px'e kadar
    // inebiliyor, oysa iOS asgarisi 44pt. Depo adımlayıcılarındaki kalıbın aynısı —
    // görsel aynı kalır, hedef büyür (eşmerkezli, satır aralığını aşmaz).
    const hitH = Math.max(bH, Math.min(rowH, 44));
    const hitW = Math.max(bW, Math.min(rw * 0.34, 44));
    const hit = { x: bX + (bW - hitW) / 2, y: bY + (bH - hitH) / 2, w: hitW, h: hitH };
    layout.upgradeRows.push({ id: u.id, enabled, maxed, locked,
                              btn: { x: bX, y: bY, w: bW, h: bH }, hit: hit });
    if (locked) {
      // Kilitli kalem GÖRÜNÜR kalır: oyuncu ağacın devamı olduğunu ve ne zaman
      // açılacağını bilsin. Buton yerinde durur ama pasiftir.
      fillRoundRect(bX, bY, bW, bH, bH * 0.30, "rgba(255,255,255,0.04)");
      strokeRoundRect(bX, bY, bW, bH, bH * 0.30, "rgba(245,170,70,0.28)", 1.2);
      fitText("🔒", bX + bW / 2, bY + bH * 0.32, bW * 0.6, bH * 0.30, c.creamSoft, "center", "800");
      fitText("Sezon " + upgradeUnlockSeason(u.id), bX + bW / 2, bY + bH * 0.72, bW * 0.86, bH * 0.28,
        c.creamSoft, "center", "800");
    } else if (maxed) {
      fillRoundRect(bX, bY, bW, bH, bH * 0.30, "rgba(94,196,138,0.16)");
      strokeRoundRect(bX, bY, bW, bH, bH * 0.30, "rgba(94,196,138,0.65)", 1.5);
      text("TAM", bX + bW / 2, bY + bH / 2, bH * 0.40, c.good, "center", "800");
    } else {
      fillRoundRect(bX, bY, bW, bH, bH * 0.30, c.btnDark);
      ctx.save();
      if (enabled) { ctx.shadowColor = c.neonGlow; ctx.shadowBlur = 10; }
      strokeRoundRect(bX, bY, bW, bH, bH * 0.30,
        enabled ? c.neon : "rgba(232,115,107,0.55)", Math.max(1.2, bW * 0.012));
      ctx.restore();
      fitText("Lv " + (lv + 1), bX + bW / 2, bY + bH * 0.32, bW * 0.8, bH * 0.30,
        enabled ? c.neon : c.neonDim, "center", "800");
      fitText(formatMoney(cost), bX + bW / 2, bY + bH * 0.70, bW * 0.86, bH * 0.30,
        enabled ? c.neon : c.bad, "center", "800");
    }
    ry += rowH + rowGap;
  }

  // kasa yetmeyen (ama TAM/kilitli olmayan) kalem varsa depo ekranıyla AYNI biçimde uyarı
  const short = layout.upgradeRows.some(x => !x.maxed && !x.locked && !x.enabled);
  if (short) {
    text("⛔ Yetersiz bakiye — kasa: " + formatMoney(game.money),
      rx0 + rw / 2, ry + r.h * 0.022, r.h * 0.022, c.bad, "center", "700");
  }
}

// Ecza deposu — PC sipariş ekranı. Satır başına −/+ adımlayıcı ile sepet (pendingQty),
// altta tek "SİPARİŞ VER" butonu. Rect'ler burada hesaplanır.
function drawDepot() {
  const c = CONFIG.colors;
  const r = drawPcScreen("ECZA DEPOSU — Sipariş Ekranı");

  // kasa (sol üst)
  text("💰 " + game.money + "₺", r.x + r.w * 0.05, r.y + r.h * 0.045, r.h * 0.032, c.cream, "left", "700");

  // GERİ butonu (PC ana ekranına)
  {
    const backW = r.w * 0.22, backH = r.h * 0.048;
    const backX = r.x + r.w * 0.95 - backW, backY = r.y + r.h * 0.022;
    layout.pcBackBtn = { x: backX, y: backY, w: backW, h: backH };
    fillRoundRect(backX, backY, backW, backH, backH * 0.35, c.btnDark);
    strokeRoundRect(backX, backY, backW, backH, backH * 0.35, "rgba(245,170,70,0.55)", 1.5);
    text("‹ GERİ", backX + backW / 2, backY + backH / 2, backH * 0.46, c.neon, "center", "800");
  }

  // --- kategori seçici: ◀ [ kategori · i/N ] ▶ (Kerem: yan yana sekmeler yerine ileri/geri) ---
  // Uçlarda başa/sona sarar. layout.depotTabs'a iki ok girer; handleDepotTap her birini
  // "o gruba geç" diye işler (eski sekme dokunma kodu aynen çalışır).
  const groups = groupsWithMeds();
  if (!game.depotGroup && groups.length) game.depotGroup = groups[0].id;
  const tabsX = r.x + r.w * 0.05, tabsW = r.w * 0.90;
  // Fiyat güncellemesi günü başlığın altına bir satır not düşer; seçici o notun ALTINA iner
  // (eskiden not, kategori seçicinin üstüne biniyordu).
  const priceToday = priceRoundOn(game.dayNumber);
  const tabsY = r.y + r.h * (priceToday ? 0.108 : 0.085), tabsH = r.h * 0.072;
  layout.depotTabs = [];
  if (groups.length) {
    let gi = groups.findIndex(g => g.id === game.depotGroup);
    if (gi < 0) { gi = 0; game.depotGroup = groups[0].id; }
    const n = groups.length, cur = groups[gi];
    const prev = groups[(gi - 1 + n) % n], next = groups[(gi + 1) % n];
    const aW = Math.max(tabsH * 1.5, 44), tr = tabsH * 0.28;
    const arrow = (x, dir, target) => {
      fillRoundRect(x, tabsY, aW, tabsH, tr, c.btnDark);
      strokeRoundRect(x, tabsY, aW, tabsH, tr, c.neon, Math.max(1.2, tabsH * 0.05));
      text(dir < 0 ? "◀" : "▶", x + aW / 2, tabsY + tabsH / 2, tabsH * 0.46, c.neon, "center", "800");
      // dokunma alanı 44 pt'nin altına düşmesin
      const ey = Math.max(0, (44 - tabsH) / 2);
      layout.depotTabs.push({ group: target, x: x, y: tabsY - ey, w: aW, h: tabsH + ey * 2 });
    };
    arrow(tabsX, -1, prev);
    arrow(tabsX + tabsW - aW, 1, next);
    // ortadaki etiket: seçili kategori + sıra + nokta göstergesi
    const lx = tabsX + aW + tabsW * 0.02, lw = tabsW - (aW + tabsW * 0.02) * 2;
    ctx.save(); ctx.shadowColor = c.neonGlow; ctx.shadowBlur = 8;
    fillRoundRect(lx, tabsY, lw, tabsH, tr, "rgba(58,40,20,0.95)"); ctx.restore();
    strokeRoundRect(lx, tabsY, lw, tabsH, tr, c.neon, Math.max(1.2, tabsH * 0.05));
    drawTabLabel(cur.emoji, cur.label + "  " + (gi + 1) + "/" + n, lx + lw / 2, tabsY + tabsH * 0.40, lw * 0.86, tabsH * 0.52, c.neon, "800");
    const dr = Math.max(1.2, tabsH * 0.045), dg = dr * 3.2, d0 = lx + lw / 2 - (n - 1) * dg / 2;
    for (let k = 0; k < n; k++) {
      ctx.beginPath(); ctx.arc(d0 + k * dg, tabsY + tabsH * 0.82, dr, 0, Math.PI * 2);
      ctx.fillStyle = k === gi ? c.neon : "rgba(245,170,70,0.3)"; ctx.fill();
    }
  }

  // --- ilaç satırları: sabit oranlı sütunlar (metin ölçüsüne göre kaydırma YOK) ---
  //   SOL  (%46'ya kadar) : emoji + ilaç adı (üst) + "Stok x/30" (alt)
  //   ORTA (%60'ta biter) : birim alış (üst) + seçim varsa satır tutarı / DOLU (alt)
  //   SAĞ  (sağa yaslı)   : −/+ adımlayıcı
  const meds = medsInGroup(game.depotGroup);
  // Güncelleme günüyse başlığın altına tek satır not: ↑/↓ okları ne demek, kimden geliyor.
  {
    const today = priceRoundOn(game.dayNumber);
    if (today) {
      fitText("💱 Bugün fiyat güncellemesi: " + priceRoundLabel(today),
        r.x + r.w / 2, r.y + r.h * 0.088, r.w * 0.86, r.h * 0.024, "#ffe0a8", "center", "700");
    }
  }
  const obH = r.h * 0.085;
  const obY = r.y + r.h - obH - r.h * 0.058;   // altta ⛔ uyarı satırına (ters video) yer kalsın
  const listTop = tabsY + tabsH + r.h * 0.02;
  const listBot = obY - r.h * 0.02;
  const rowGap = r.h * 0.01;
  // satır yüksekliği alandan türetilir: 6 satır en kötü ihtimalle sığar,
  // az satırlı kategorilerde üst sınıra kadar genişler (metinler nefes alır)
  let rowH = Math.min(r.h * 0.12, (listBot - listTop - rowGap * Math.max(0, meds.length - 1)) / Math.max(1, meds.length));
  const rx0 = r.x + r.w * 0.05, rw = r.w * 0.90;
  const colNameR = rx0 + rw * 0.46;   // sol sütunun sağ sınırı
  const colCostR = rx0 + rw * 0.60;   // orta sütunun sağ sınırı (fiyat/tutar sağa hizalı)
  layout.depotRows = [];
  let ry = listTop;
  for (const m of meds) {
    const stock = game.stock[m.id] || 0;
    const pending = game.depotPending[m.id] || 0;
    const full = stock + pending >= effMaxStock();
    fillRoundRect(rx0, ry, rw, rowH, rowH * 0.20, "rgba(26,21,36,0.5)");

    // SOL: emoji + ad (üst; uzunsa "…" ile kısalır, taşmaz) + stok (alt, soluk)
    drawEmoji(m.emoji, rx0 + rowH * 0.42, ry + rowH * 0.5, rowH * 0.40, "#f2e6d4");
    const nameX = rx0 + rowH * 0.80;
    ellipsisText(m.name, nameX, ry + rowH * 0.30, colNameR - nameX, rowH * 0.28, c.cream, "left", "700");
    fitText("Stok " + stock + "/" + effMaxStock(), nameX, ry + rowH * 0.70, colNameR - nameX,
      rowH * 0.22, stock <= 0 ? c.bad : c.creamSoft, "left", "600");

    // ORTA: birim alış (üst) + satır tutarı / DOLU (alt) — kendi alanında, adın üzerine binmez
    // Fiyat GÜNCEL değerden okunur; Toptancı indirimi dahil (depotUnitCost — SİPARİŞ VER toplamıyla
    // aynı kaynak). Eskiden satır indirimsiz medCost gösteriyordu. Güncelleme gününde ↑/↓ durur.
    const unit = depotUnitCost(m);
    const move = priceMoveToday(m.id);
    if (move !== 0) {
      const mv = move > 0 ? "↑" : "↓";
      text(mv, colCostR + rw * 0.035, ry + rowH * 0.30, rowH * 0.30,
        move > 0 ? c.bad : c.good, "center", "800");
    }
    fitText(unit + "₺", colCostR, ry + rowH * 0.30, rw * 0.12, rowH * 0.26, c.creamSoft, "right", "700");
    if (pending > 0) {
      fitText("= " + (unit * pending) + "₺", colCostR, ry + rowH * 0.70, rw * 0.12, rowH * 0.22, c.neon, "right", "800");
    } else if (full) {
      fitText("DOLU", colCostR, ry + rowH * 0.70, rw * 0.12, rowH * 0.22, "rgba(150,200,165,0.75)", "right", "800");
    }

    // SAĞ: −/+ adımlayıcı (satırın sağ kenarına yaslı; davranış aynı)
    const sq = rowH * 0.56;
    const qtyW = sq * 0.9;
    const sY = ry + (rowH - sq) / 2;
    const pX = rx0 + rw * 0.99 - sq;
    const mX = pX - qtyW - sq;
    const minusOn = pending > 0, plusOn = !full;
    fillRoundRect(mX, sY, sq, sq, sq * 0.28, c.btnDark);
    strokeRoundRect(mX, sY, sq, sq, sq * 0.28, minusOn ? c.neon : "rgba(245,170,70,0.22)", 1.2);
    text("−", mX + sq / 2, sY + sq / 2, sq * 0.55, minusOn ? c.neon : c.neonDim, "center", "800");
    text(String(pending), mX + sq + qtyW / 2, ry + rowH * 0.5, rowH * 0.30,
      pending > 0 ? c.neon : c.creamSoft, "center", "800");
    fillRoundRect(pX, sY, sq, sq, sq * 0.28, c.btnDark);
    strokeRoundRect(pX, sY, sq, sq, sq * 0.28, plusOn ? c.neon : "rgba(245,170,70,0.22)", 1.2);
    text("+", pX + sq / 2, sY + sq / 2, sq * 0.55, plusOn ? c.neon : c.neonDim, "center", "800");

    layout.depotRows.push({
      id: m.id, minusOn, plusOn,
      minusBtn: { x: mX - sq * 0.15, y: sY - sq * 0.15, w: sq * 1.3, h: sq * 1.3 },
      plusBtn:  { x: pX - sq * 0.15, y: sY - sq * 0.15, w: sq * 1.3, h: sq * 1.3 }
    });
    ry += rowH + rowGap;
  }

  // --- SİPARİŞ VER (toplam) — tüm sepet tek seferde ---
  const total = depotOrderTotal();
  const afford = game.money >= total;
  const enabled = total > 0 && afford;
  layout.depotOrderBtn = { x: rx0, y: obY, w: rw, h: obH, enabled };
  fillRoundRect(rx0, obY, rw, obH, obH * 0.32, c.btnDark);
  ctx.save();
  if (enabled) { ctx.shadowColor = c.neonGlow; ctx.shadowBlur = 14; }
  strokeRoundRect(rx0, obY, rw, obH, obH * 0.32,
    enabled ? c.neon : (total > 0 ? "rgba(232,115,107,0.55)" : c.neonDim), Math.max(1.5, rw * 0.006));
  ctx.restore();
  text("SİPARİŞ VER", rx0 + rw * 0.05, obY + obH / 2, obH * 0.36, enabled ? c.neon : c.neonDim, "left", "800");
  if (total > 0) {
    // para yetmiyorsa toplam kırmızımsı
    text(total + "₺", rx0 + rw * 0.95, obY + obH / 2, obH * 0.38, afford ? c.neon : c.bad, "right", "800");
  }
  // kasa yetmiyorsa açık uyarı — buton zaten pasif (enabled=false), sebebi yazıyla söyle
  if (total > 0 && !afford) {
    text("⛔ Yetersiz bakiye — kasa: " + formatMoney(game.money),
      rx0 + rw / 2, obY + obH + r.h * 0.026, r.h * 0.022, c.bad, "center", "700");
  }
}

  layout.pcBackBtn = null;

  layout.depotTabs = null;
  layout.depotRows = null;

  try {
    if (game.pcScreen === "home") drawPcHome();
    else if (game.pcScreen === "sale") drawSale();

  // kapat düğmesi fosfor filtresinin DIŞINDA (kasada) — filtre ekran camına kırpılı olduğu için korunur
}

// PC ekranı açıkken dokunuşlar — önce ortak (kapat/geri/menü), sonra ekrana özel
function handlePcTap(px, py) {
  if (layout.depotCloseBtn && pointInRect(px, py, layout.depotCloseBtn)) { sfx("back"); closeDepot(); return; }
  if (layout.pcBackBtn && pointInRect(px, py, layout.pcBackBtn)) { sfx("pckey"); pcHome(); return; }
  if (game.pcScreen === "home") {
    if (layout.pcMenuBtns) {
      for (const b of layout.pcMenuBtns) {
        if (!pointInRect(px, py, b)) continue;
        if (!b.enabled) { sfx("deny"); return; }      // kilitli sekme: dokunuş yutulur
        sfx("pc");
        if (b.key === "sale") openSale();
        else if (b.key === "depot") openDepot();
        else if (b.key === "upgrades") openUpgrades();
        else openMedulaScreen();
        return;
      }
    }
    if (layout.depotPanel && !pointInRect(px, py, layout.depotPanel)) { sfx("back"); closeDepot(); return; }
    return;
  }
  if (game.pcScreen === "sale") {
    if (layout.saleRows) {
      for (const b of layout.saleRows) {
        if (pointInRect(px, py, b)) { if (b.on) { sfx(b.delta > 0 ? "plus" : "minus"); cartChange(b.id, b.delta); } else sfx("deny"); return; }
      }
    }
    if (layout.saleServeBtn && pointInRect(px, py, layout.saleServeBtn)) {
      if (layout.saleServeBtn.enabled) { sfx("box"); serveFromSale(); } else sfx("deny");
      return;
    }
    if (layout.depotPanel && !pointInRect(px, py, layout.depotPanel)) { sfx("back"); closeDepot(); return; }
    return;
  }
  if (game.pcScreen === "medula") {
    if (layout.medulaKeys) {
      for (const k of layout.medulaKeys) {
        if (pointInRect(px, py, k)) { if (k.enabled) { sfx("pckey"); medulaKeyPress(k.ch); } else sfx("deny"); return; }
      }
    }
    if (layout.medulaDel && pointInRect(px, py, layout.medulaDel)) { if (layout.medulaDel.enabled) { sfx("pckey"); medulaBackspace(); } else sfx("deny"); return; }
    if (layout.medulaOk && pointInRect(px, py, layout.medulaOk)) { if (layout.medulaOk.enabled) { sfx("pc"); medulaSubmit(); } else sfx("deny"); return; }
    if (layout.depotPanel && !pointInRect(px, py, layout.depotPanel)) { sfx("back"); closeDepot(); return; }
    return;
  }
  if (game.pcScreen === "upgrades") {
    if (layout.upgradeTabs) {
      for (const t of layout.upgradeTabs) {
        if (pointInRect(px, py, t)) { if (game.upgradeTier !== t.tier) sfx("tab"); game.upgradeTier = t.tier; return; }
      }
    }
    if (layout.upgradeRows) {
      for (const row of layout.upgradeRows) {
        if (pointInRect(px, py, row.hit || row.btn)) { if (row.enabled) { sfx("upgrade"); buyUpgrade(row.id); } else sfx("deny"); return; }
      }
    }
    if (layout.depotPanel && !pointInRect(px, py, layout.depotPanel)) { sfx("back"); closeDepot(); return; }
    return;
  }
  handleDepotTap(px, py);
}

// depo ekranı açıkken dokunuşlar (adımlayıcı / sipariş / sekme / kapat / dışarı)
function handleDepotTap(px, py) {
  if (layout.depotCloseBtn && pointInRect(px, py, layout.depotCloseBtn)) { sfx("back"); closeDepot(); return; }
  if (layout.depotTabs) {
    for (const t of layout.depotTabs) {
      if (pointInRect(px, py, t)) { if (game.depotGroup !== t.group.id) sfx("tab"); game.depotGroup = t.group.id; return; }
    }
  }
  if (layout.depotRows) {
    for (const row of layout.depotRows) {
      if (row.minusBtn && pointInRect(px, py, row.minusBtn)) { if (row.minusOn) { sfx("minus"); changePending(row.id, -1); } else sfx("deny"); return; }
      if (row.plusBtn && pointInRect(px, py, row.plusBtn)) { if (row.plusOn) { sfx("plus"); changePending(row.id, 1); } else sfx("deny"); return; }
    }
  }
  if (layout.depotOrderBtn && pointInRect(px, py, layout.depotOrderBtn)) {
    if (layout.depotOrderBtn.enabled) { sfx("order"); placeDepotOrder(); } else sfx("deny");
    return;
  }
  // panel dışına tıkla → kapat; panel içi boşluk → yut
  if (layout.depotPanel && !pointInRect(px, py, layout.depotPanel)) { closeDepot(); return; }
}

// =====================================================================
//  ANA EKRAN — gece sokağı, tabela, ad girişi, nasıl oynanır
// =====================================================================
// TASARIM NOTU: bu ekranların tamamı KODLA çizilir, yeni PNG yok. Sebep ikili —
// (a) asset turu gerektirmiyor, (b) tabela oyuncunun yazdığı ada göre değiştiği için
// zaten bir görselle karşılanamaz.

// Sokak her açılışta AYNI görünmeli ve oyunun rastgelelik akışını KAYDIRMAMALI:
// bu yüzden rng() değil, indeksten türeyen saf bir karıştırıcı kullanılıyor.
function streetRand(i) {
  let h = Math.imul((i | 0) + 1, 0x9E3779B1);
  h = Math.imul(h ^ (h >>> 15), 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 13), 0xC2B2AE35);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}

// Harf aralıklı metin. Canvas'ta letterSpacing her yerde yok (eski iOS Safari),
// o yüzden harf harf çizilir. Toplam genişliği döndürür.
function spacedText(str, cx, cy, size, color, spacing, weight, align) {
  ctx.font = (weight || "600") + " " + size + "px " + RX_FONT;
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.fillStyle = color;
  const chars = Array.from(str);
  let total = 0;
  for (const ch of chars) total += ctx.measureText(ch).width + spacing;
  total = Math.max(0, total - spacing);
  let x = align === "center" ? cx - total / 2 : cx;
  for (const ch of chars) { ctx.fillText(ch, x, cy); x += ctx.measureText(ch).width + spacing; }
  return total;
}

// Gece sokağı: gökyüzü → apartmanlar → kaldırım → cephe → tente → fenerler → vitrin.
// Tüm ölçüler sahne dikdörtgenine (9:16 kolon) oranlıdır.
// DİKEY YERLEŞİM (sahne oranı). İlk denemede apartmanların tabanı cephe duvarının
// ALTINDA kalıyordu ve skyline hiç görünmüyordu — ölçüm değil, ekran görüntüsü yakaladı.
// Menünün AYARLANABİLİR sayılarının tamamı burada. Tek yerde toplanmasının sebebi:
// canlı ayar panelı (tools/tuner) bu nesneyi oynatıp anında yeniden çiziyor; sayılar
// çizim fonksiyonlarının içine gömülü olsaydı el yordamıyla denemek gerekirdi.
const ST = { roof: 0.325, wallTop: 0.35, wallBot: 0.99, awning: 0.325,
             lamp: 0.530, lampX: 0.046, lampW: 0.052, vitrin: 0.39, vitrinH: 0.105,
             tabela: 0.085, tabelaH: 0.115, tabelaW: 0.80,
             moonX: 0.71, moonY: 0.05, moonR: 0.052,
             btnTop: 0.515, btnGap: 0.024, btnH1: 0.072, btnH2: 0.064, btnH3: 0.066,
             recBottom: 0.965, nobetY: 0.355 };
const STREET_BLD = [
  { x: -0.06, w: 0.18, h: 0.070, lit: 0.16 },
  { x:  0.10, w: 0.13, h: 0.122, lit: 0.34 },
  { x:  0.21, w: 0.16, h: 0.052, lit: 0.16 },
  { x:  0.35, w: 0.12, h: 0.146, lit: 0.34 },
  { x:  0.45, w: 0.18, h: 0.080, lit: 0.16 },
  { x:  0.61, w: 0.14, h: 0.130, lit: 0.34 },
  { x:  0.73, w: 0.17, h: 0.058, lit: 0.16 },
  { x:  0.88, w: 0.20, h: 0.104, lit: 0.34 }
];
// ---- PNG ARKA PLANLI ana ekran yerleşimi ----
// Arka plan görseli (assets/menu_bg.jpg) yüklüyse menü BU sayıları kullanır; yüklenmezse
// yukarıdaki ST ile kodla çizilen sokağa düşer. İki ayrı nesne: biri öbürünün ayarını bozmasın.
// band*: görseldeki BOŞ tabela şeridinin sahne oranı cinsinden yeri (piksel ölçümüyle bulundu).
// lamp/lampX: görseldeki boyalı fenerlerin ışık merkezi — titreme efekti oraya biner.
const STB = { signStyle: "lightbox",
              tabela: 0.226, tabelaH: 0.108, tabelaW: 0.80,
              bandY0: 0.2442, bandY1: 0.3150, bandX0: 0.015, bandX1: 0.984,
              lamp: 0.511, lampX: 0.056, lampGlow: 0.20,
              btnTop: 0.600, btnGap: 0.012, btnH1: 0.072, btnH2: 0.064, btnH3: 0.064,
              btnSplit: 1, recBottom: 0.982, nobetY: 0.345 };
// ---- GÜNDÜZ / GECE ----
// Ana ekran, cihazın YEREL saatine göre iki arka plandan birini gösterir:
// 06:00–16:59 gündüz (güneşli), 17:00–05:59 gece. Gündüz görseli yoksa gece görseli kalır.
// Menü açıkken saat eşiği geçilirse 2 sn'lik geçişle değişir (sert kesme olmasın).
const MENU_DAY_FROM = 6, MENU_NIGHT_FROM = 17;
const MENU_BG_KEY = { day: "menu_bg_day", night: "menu_bg" };
// Gündüz görseli gece görselinden türetildi ama yapay zekâ kompozisyonu biraz kaydırabilir:
// şerit/fener yeri farklıysa buraya yazılır, STB'nin üstüne biner.
const STB_DAY = {};
let menuTimeOverride = null;           // "day" | "night" | null — test ve ayar panelı için
const menuSky = { phase: null, from: null, t0: 0, checkedAt: -99 };
function setMenuTime(v) { menuTimeOverride = v || null; menuSky.checkedAt = -99; }
function menuPhaseNow() {
  if (menuTimeOverride) return menuTimeOverride;
  const h = new Date().getHours();
  return (h >= MENU_DAY_FROM && h < MENU_NIGHT_FROM) ? "day" : "night";
}
function imgReady(key) {
  const i = Assets.images[key];
  return i && i.complete && i.naturalWidth > 0 ? i : null;
}
// Saat en fazla 5 sn'de bir okunur; değişirse geçiş başlar.
function menuPhase() {
  const t = game.clock || 0;
  if (menuSky.phase === null || t - menuSky.checkedAt > 5 || t < menuSky.checkedAt) {
    menuSky.checkedAt = t;
    const p = menuPhaseNow();
    if (menuSky.phase !== null && p !== menuSky.phase && menuTimeOverride === null) {
      menuSky.from = menuSky.phase; menuSky.t0 = t;
    } else if (menuTimeOverride !== null) menuSky.from = null;   // elle seçimde anında
    menuSky.phase = p;
  }
  return menuSky.phase;
}
// Ekranda GERÇEKTEN görünen evre (gündüz istenip görseli yoksa gece).
function menuShownPhase() {
  const p = menuPhase();
  return imgReady(MENU_BG_KEY[p]) ? p : "night";
}
function menuBg() { return imgReady(MENU_BG_KEY[menuShownPhase()]) || imgReady("menu_bg"); }
function menuST() { return menuBg() ? STB : ST; }
// Tabela şeridi/fener: görünen evrenin ölçüleri (gündüzde STB_DAY üstüne biner).
function menuGeo() {
  return menuShownPhase() === "day" ? Object.assign({}, STB, STB_DAY) : STB;
}

// Görseli sahneye oturt + canlı katman (fener titremesi, yıldız parıltısı).
// Letterbox bantları: üst/alt bantta görselin kenar satırı esnetilir (gök ve asfalt
// kesintisiz devam eder); yan bantta (iPad, yatay) görselin karartılmış büyütmesi.
function paintMenuImage(img, alpha) {
  const S = layout.stage, W = layout.w, H = layout.h;
  const iw = img.naturalWidth, ih = img.naturalHeight;
  // kaynağı sahne oranına kırp (cover)
  const sa = S.w / S.h, ia = iw / ih;
  let sx = 0, sy = 0, sw = iw, sh = ih;
  if (ia > sa) { sw = ih * sa; sx = (iw - sw) / 2; } else { sh = iw / sa; sy = (ih - sh) / 2; }
  ctx.save();
  ctx.globalAlpha = alpha;
  if (S.x > 0.5) {
    const k = Math.max(W / iw, H / ih);
    ctx.drawImage(img, (W - iw * k) / 2, (H - ih * k) / 2, iw * k, ih * k);
    ctx.fillStyle = "rgba(6,4,12,0.84)";      // yan bant: gölgede kalan devam, dikkat çekmesin
    ctx.fillRect(0, 0, W, H);
  }
  if (S.y > 0.5) {
    ctx.drawImage(img, sx, sy, sw, 2, S.x, 0, S.w, S.y + 1);
    ctx.drawImage(img, sx, sy + sh - 2, sw, 2, S.x, S.y + S.h - 1, S.w, H - (S.y + S.h) + 1);
  }
  ctx.drawImage(img, sx, sy, sw, sh, S.x, S.y, S.w, S.h);
  ctx.restore();
}

function drawMenuBackdrop() {
  const S = layout.stage, M = menuGeo();
  const X = f => S.x + S.w * f, Y = f => S.y + S.h * f;
  const p = menuShownPhase();
  const img = imgReady(MENU_BG_KEY[p]) || imgReady("menu_bg");
  // evre geçişi: eski görsel altta, yenisi üstte giderek belirir
  let k = 1;
  const fromImg = menuSky.from ? imgReady(MENU_BG_KEY[menuSky.from]) : null;
  if (fromImg && fromImg !== img) {
    k = clamp(((game.clock || 0) - menuSky.t0) / 2.0, 0, 1);
    if (k >= 1) menuSky.from = null;
  } else menuSky.from = null;
  if (k < 1) paintMenuImage(fromImg, 1);
  paintMenuImage(img, k);
  // gecelik: yıldız ve fener ışığı yalnız gece — gündüz fenerler sönük, gök güneşli
  const night = p === "night" ? k : 1 - k;
  if (night <= 0.01) return;

  const t = game.clock || 0;
  // yıldız parıltısı — gökyüzünün açık kalan kısmında, sabit yerlerde
  for (let i = 0; i < 11; i++) {
    const fy = 0.012 + streetRand(i + 300) * 0.11;
    const fx = fy > 0.06 ? 0.22 + streetRand(i + 340) * 0.56 : 0.05 + streetRand(i + 340) * 0.9;
    const a = night * Math.max(0, Math.sin(t * (0.9 + streetRand(i + 380) * 1.6) + i * 2.3));
    if (a < 0.05) continue;
    const r = S.w * (0.004 + streetRand(i + 420) * 0.004) * (0.6 + a * 0.6);
    const px = X(fx), py = Y(fy);
    ctx.fillStyle = "rgba(255,248,225," + (a * 0.85).toFixed(3) + ")";
    ctx.beginPath();
    ctx.moveTo(px, py - r * 2.2); ctx.lineTo(px + r * 0.45, py - r * 0.45);
    ctx.lineTo(px + r * 2.2, py); ctx.lineTo(px + r * 0.45, py + r * 0.45);
    ctx.lineTo(px, py + r * 2.2); ctx.lineTo(px - r * 0.45, py + r * 0.45);
    ctx.lineTo(px - r * 2.2, py); ctx.lineTo(px - r * 0.45, py - r * 0.45);
    ctx.closePath(); ctx.fill();
  }
  // fener titremesi — boyalı fenerin üstüne sıcak, nefes alan bir hale
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  [M.lampX, 1 - M.lampX].forEach((fx, k) => {
    const a = night * (0.13 + 0.05 * Math.sin(t * 6.1 + k * 1.7) + 0.035 * Math.sin(t * 15.3 + k * 4.1)
            + 0.02 * Math.sin(t * 2.3 + k));
    const lx = X(fx), ly = Y(M.lamp), R = S.w * M.lampGlow;
    const g = ctx.createRadialGradient(lx, ly, 0, lx, ly, R);
    g.addColorStop(0, "rgba(255,176,86," + a.toFixed(3) + ")");
    g.addColorStop(0.4, "rgba(255,150,60," + (a * 0.4).toFixed(3) + ")");
    g.addColorStop(1, "rgba(255,150,60,0)");
    ctx.fillStyle = g;
    ctx.fillRect(lx - R, ly - R, R * 2, R * 2);
  });
  ctx.restore();
}

// Cephe (fascia) tabelası: görseldeki boş şeride TAM oturan tek satır —
// "DEVA ECZANESİ". Ad siyah, ECZANESİ kırmızı kabartma. Lightbox'a alternatif.
function drawFascia(x, y, w, h, name, caret) {
  const c = CONFIG.colors, r = h * 0.08;
  ctx.save();
  ctx.shadowColor = "rgba(255,246,225,0.45)";
  ctx.shadowBlur = h * 0.5;
  const face = ctx.createLinearGradient(0, y, 0, y + h);
  face.addColorStop(0, c.signFace); face.addColorStop(0.6, c.signFace2); face.addColorStop(1, c.signFace3);
  fillRoundRect(x, y, w, h, r, face);
  ctx.restore();
  strokeRoundRect(x, y, w, h, r, c.signEdge, 1.2);
  ctx.fillStyle = c.rxRed;                              // alt kırmızı şerit
  ctx.fillRect(x + r, y + h - h * 0.10, w - r * 2, h * 0.06);

  const nm = (name || "") + (caret ? "|" : "");
  const suffix = "ECZANESİ";
  let fs = h * 0.54;
  const measure = () => {
    ctx.font = "800 " + fs + "px " + RX_FONT; const a = ctx.measureText(nm + " ").width;
    ctx.font = "900 " + fs + "px " + RX_FONT; return a + ctx.measureText(suffix).width;
  };
  while (fs > 7 && measure() > w * 0.9) fs -= 0.5;
  const total = measure();
  ctx.textBaseline = "middle"; ctx.textAlign = "left";
  const cy = y + h * 0.46;
  let x0 = x + (w - total) / 2;
  ctx.font = "800 " + fs + "px " + RX_FONT;
  ctx.fillStyle = c.signInk;
  ctx.fillText(nm + " ", x0, cy);
  x0 += ctx.measureText(nm + " ").width;
  ctx.font = "900 " + fs + "px " + RX_FONT;
  const depth = Math.max(1.2, fs * 0.07), steps = Math.max(5, Math.round(depth * 2.2));
  for (let i = steps; i >= 1; i--) {
    const k = i / steps;
    ctx.fillStyle = k > 0.55 ? c.rxRedDeep : c.rxRedMid;
    ctx.fillText(suffix, x0 + depth * k, cy + depth * k);
  }
  ctx.fillStyle = c.rxRed;
  ctx.fillText(suffix, x0, cy);
}

// Stil seçimine göre tabela çiz (ana ekran ve ad girişi AYNI çağrıyı kullanır).
function drawMenuSign(name, caret) {
  const S = layout.stage, M = menuBg() ? menuGeo() : ST;
  if (menuBg() && M.signStyle === "fascia") {
    const x = S.x + S.w * M.bandX0, y = S.y + S.h * M.bandY0;
    drawFascia(x, y, S.w * (M.bandX1 - M.bandX0), S.h * (M.bandY1 - M.bandY0), name, caret);
    return;
  }
  const tw = S.w * M.tabelaW;
  drawTabela(S.x + S.w * 0.5 - tw / 2, S.y + S.h * M.tabela, tw, S.h * M.tabelaH, name, caret);
}

function drawStreet() {
  const bgi = menuBg();
  if (bgi) { drawMenuBackdrop(); return; }
  const S = layout.stage, c = CONFIG.colors;
  const X = f => S.x + S.w * f, Y = f => S.y + S.h * f;

  // --- gökyüzü ---
  // Kolonun DIŞI da boyanır: 9:19,5 telefonda üstte/altta letterbox bandı var ve orada
  // oyun arka planı (bg_pharmacy) görünürse menü iki ayrı sahneye bölünmüş gibi durur.
  const sky = ctx.createLinearGradient(0, S.y, 0, S.y + S.h);
  sky.addColorStop(0.00, c.skyTop);
  sky.addColorStop(0.30, "#191233");
  sky.addColorStop(0.52, c.skyMid);
  sky.addColorStop(0.68, c.skyWarm);
  sky.addColorStop(0.80, "#201422");
  sky.addColorStop(1.00, c.skyLow);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, layout.w, layout.h);
  // şehrin üstündeki mor hava
  const haze = ctx.createRadialGradient(X(0.5), Y(0.40), 0, X(0.5), Y(0.40), S.w * 0.85);
  haze.addColorStop(0, "rgba(120,70,140,0.34)");
  haze.addColorStop(1, "rgba(120,70,140,0)");
  ctx.fillStyle = haze;
  ctx.fillRect(S.x, S.y, S.w, S.h);

  // Ufuk parıltısı — şehrin ışığı. Siluetler ANCAK arkaları aydınlıksa okunur;
  // ilk denemede apartmanlar gökyüzüyle aynı koyulukta kaybolmuştu.
  const hz = ctx.createRadialGradient(X(0.5), Y(ST.roof), 0, X(0.5), Y(ST.roof), S.w * 0.95);
  hz.addColorStop(0, "rgba(122,82,150,0.42)");
  hz.addColorStop(0.55, "rgba(96,58,116,0.16)");
  hz.addColorStop(1, "rgba(96,58,116,0)");
  ctx.fillStyle = hz;
  ctx.fillRect(0, 0, layout.w, Y(ST.roof));

  // --- yıldızlar (sabit) ---
  for (let i = 0; i < 14; i++) {
    const sx = X(0.04 + streetRand(i) * 0.92), sy = Y(0.02 + streetRand(i + 40) * 0.10);
    ctx.fillStyle = "rgba(255,245,225," + (0.35 + streetRand(i + 80) * 0.45).toFixed(2) + ")";
    ctx.fillRect(sx, sy, 1.6, 1.6);
  }

  // --- ay ---
  const mr = S.w * ST.moonR, mx = X(ST.moonX), my = Y(ST.moonY);
  const glow = ctx.createRadialGradient(mx, my, mr * 0.6, mx, my, mr * 5);
  glow.addColorStop(0, "rgba(255,236,190,0.22)");
  glow.addColorStop(1, "rgba(255,236,190,0)");
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(mx, my, mr * 5, 0, Math.PI * 2); ctx.fill();
  const mg = ctx.createRadialGradient(mx - mr * 0.3, my - mr * 0.3, 0, mx, my, mr);
  mg.addColorStop(0, "#fff6df"); mg.addColorStop(0.62, "#e8d3a8"); mg.addColorStop(1, "#cdb282");
  ctx.fillStyle = mg;
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, Math.PI * 2); ctx.fill();

  // --- apartmanlar + pencereler ---
  const base = Y(ST.roof);
  let wi = 0;
  for (let b = 0; b < STREET_BLD.length; b++) {
    const B = STREET_BLD[b];
    const bx = X(B.x), bw = S.w * B.w, bh = S.h * B.h;
    ctx.fillStyle = "#080513";                       // neredeyse siyah siluet
    ctx.fillRect(bx, base - bh, bw, bh);
    ctx.fillStyle = "rgba(150,110,180,0.20)";        // çatı kenarı (gökyüzünden ayırır)
    ctx.fillRect(bx, base - bh, bw, 1.2);
    ctx.fillStyle = "rgba(0,0,0,0.35)";              // yan gölge
    ctx.fillRect(bx + bw - 1.5, base - bh, 1.5, bh);
    // pencere ızgarası
    const pad = S.w * 0.016, cw = S.w * 0.0105, ch = S.h * 0.0058;
    const colGap = cw * 2.6, rowGap = ch * 3.0;
    for (let y = base - bh + pad; y < base - pad; y += rowGap) {
      for (let x = bx + pad; x < bx + bw - pad - cw; x += colGap) {
        const r = streetRand(wi++);
        if (r > B.lit) continue;
        ctx.fillStyle = c.bldWin + (0.28 + r * 0.5).toFixed(2) + ")";
        ctx.fillRect(x, y, cw, ch);
      }
    }
    // çatıda su deposu / çanak anten
    if (b === 1 || b === 3) {
      const tw = S.w * 0.034, th = S.h * 0.012, tx = bx + bw * 0.35, ty = base - bh - th;
      ctx.fillStyle = c.bldDark;
      ctx.fillRect(tx, ty, tw, th);
      ctx.fillRect(tx + tw * 0.2, ty - th * 0.7, 1.5, th * 0.7);
    }
  }

  // --- kaldırım + ışık havuzu ---
  const pave = ctx.createLinearGradient(0, Y(ST.wallBot), 0, S.y + S.h);
  pave.addColorStop(0, c.paveTop); pave.addColorStop(1, c.paveLow);
  const pb = Y(ST.wallBot);
  ctx.fillStyle = pave;
  ctx.fillRect(0, pb, layout.w, S.y + S.h - pb + (layout.h - (S.y + S.h)));
  const pool = ctx.createRadialGradient(X(0.5), pb, 0, X(0.5), pb, S.w * 0.7);
  pool.addColorStop(0, "rgba(255,180,90,0.17)");
  pool.addColorStop(1, "rgba(255,180,90,0)");
  ctx.fillStyle = pool;
  ctx.fillRect(0, pb, layout.w, layout.h - pb);

  // --- dükkân cephesi: dikey ahşap kaplama ---
  const wy = Y(ST.wallTop), wh = S.h * (ST.wallBot - ST.wallTop);
  const wall = ctx.createLinearGradient(0, wy, 0, wy + wh);
  wall.addColorStop(0, c.wallTop); wall.addColorStop(0.55, c.wallMid); wall.addColorStop(1, c.wallLow);
  ctx.fillStyle = wall;
  ctx.fillRect(0, wy, layout.w, wh);
  const plank = S.w * 0.085;
  for (let x = 0; x < layout.w; x += plank) {
    ctx.fillStyle = "rgba(0,0,0,0.22)"; ctx.fillRect(x, wy, 1.5, wh);
    ctx.fillStyle = "rgba(255,210,150,0.045)"; ctx.fillRect(x + 1.5, wy, 1, wh);
  }
  ctx.fillStyle = "rgba(0,0,0,0.16)";           // alt gölge (kaldırıma geçiş)
  ctx.fillRect(0, wy + wh - S.h * 0.012, layout.w, S.h * 0.012);

  // --- tente (şeritli + saçaklı) ---
  const ay = Y(ST.awning), ah = S.h * 0.026, stripe = S.w * 0.038;
  for (let x = 0, i = 0; x < layout.w; x += stripe, i++) {
    ctx.fillStyle = i % 2 ? c.awningCream : c.awningRed;
    ctx.fillRect(x, ay, Math.min(stripe, layout.w - x), ah);
  }
  ctx.fillStyle = "rgba(0,0,0,0.26)";
  ctx.fillRect(0, ay + ah * 0.72, layout.w, ah * 0.28);
  const sc = stripe * 0.5;                           // saçak
  for (let x = sc * 0.5, i = 0; x < layout.w + sc; x += sc * 2, i++) {
    ctx.fillStyle = i % 2 ? c.awningRed : "#7d211d";
    ctx.beginPath(); ctx.arc(x, ay + ah, sc, 0, Math.PI); ctx.fill();
  }
  ctx.fillStyle = "rgba(255,255,255,0.12)";          // üst kenar parlaması
  ctx.fillRect(0, ay, layout.w, 1.5);

  // --- duvar fenerleri: tenteden sarkan iki fener ---
  for (const side of [ST.lampX, 1 - ST.lampX]) {
    const lx = X(side), ly = Y(ST.lamp), lw = S.w * ST.lampW, lh = S.h * (ST.lampW * 0.654);
    const lg = ctx.createRadialGradient(lx, ly + lh * 0.55, 0, lx, ly + lh * 0.55, S.w * 0.26);
    lg.addColorStop(0, "rgba(255,178,80,0.40)");
    lg.addColorStop(0.45, "rgba(255,168,70,0.14)");
    lg.addColorStop(1, "rgba(255,178,80,0)");
    ctx.fillStyle = lg;
    ctx.fillRect(lx - S.w * 0.26, ly - S.w * 0.26, S.w * 0.52, S.w * 0.52);
    ctx.fillStyle = "#6b4b22";                                    // askı
    ctx.fillRect(lx - 1, ly - S.h * 0.012, 2, S.h * 0.012);
    ctx.fillStyle = "#8a6430";                                    // şapka
    ctx.beginPath(); ctx.moveTo(lx - lw * 0.6, ly + lh * 0.2);
    ctx.lineTo(lx + lw * 0.6, ly + lh * 0.2); ctx.lineTo(lx, ly); ctx.closePath(); ctx.fill();
    const body = ctx.createLinearGradient(0, ly + lh * 0.2, 0, ly + lh);
    body.addColorStop(0, "#ffe6a8"); body.addColorStop(0.5, "#ffb347"); body.addColorStop(1, "#c9772a");
    fillRoundRect(lx - lw * 0.36, ly + lh * 0.2, lw * 0.72, lh * 0.72, lw * 0.2, body);
  }

  // --- vitrin: iki raf dolusu ilaç kutusu ---
  const vx = X(0.055), vw = S.w * 0.89, vy = Y(ST.vitrin), vh = S.h * ST.vitrinH;
  const vg = ctx.createLinearGradient(0, vy, 0, vy + vh);
  vg.addColorStop(0, "rgba(255,206,132,0.26)"); vg.addColorStop(1, "rgba(20,12,8,0.55)");
  fillRoundRect(vx, vy, vw, vh, S.w * 0.01, vg);
  strokeRoundRect(vx, vy, vw, vh, S.w * 0.01, "rgba(255,196,120,0.26)", 1);
  // Kutular ilk denemede ince ve eşit aralıklıydı, ekolayzer gibi duruyordu:
  // genişlikleri de değişken, aralar daha büyük.
  const BOXC = ["#dce8ee", "#eccca6", "#cfe2cd", "#ead3d9", "#d7d1e7", "#e6ddc4", "#cee5e7", "#e9d7b9"];
  for (let r = 0; r < 2; r++) {
    const shelfY = vy + vh * (r === 0 ? 0.46 : 0.93);
    ctx.fillStyle = "rgba(90,58,30,0.75)";                 // raf tahtası
    ctx.fillRect(vx + S.w * 0.014, shelfY, vw - S.w * 0.028, S.h * 0.0045);
    ctx.fillStyle = "rgba(255,210,150,0.25)";
    ctx.fillRect(vx + S.w * 0.014, shelfY, vw - S.w * 0.028, 1);
    let x = vx + S.w * 0.028;
    for (let i = 0; i < 40; i++) {
      const rw2 = streetRand(r * 61 + i);
      const bw2 = S.w * (0.020 + rw2 * 0.016);
      if (x + bw2 > vx + vw - S.w * 0.028) break;
      const hh = vh * (0.20 + streetRand(r * 97 + i) * 0.20);
      ctx.fillStyle = BOXC[(r * 3 + i) % BOXC.length];
      ctx.fillRect(x, shelfY - hh, bw2, hh);
      ctx.fillStyle = "rgba(0,0,0,0.18)";                  // kutu gölgesi
      ctx.fillRect(x + bw2 - 1.5, shelfY - hh, 1.5, hh);
      x += bw2 + S.w * (0.006 + streetRand(r * 13 + i) * 0.008);
    }
  }
  fillRoundRect(vx, vy, vw, vh * 0.30, S.w * 0.01, "rgba(255,214,150,0.07)");   // cam yansıması
}

// TABELA — ışıklı beyaz kutu + kırmızı kabartma ECZANE + siyah ad + kırmızı kanatlar.
// Tek fonksiyon; ana ekran da ad girişi de bunu çağırır (iki yerde iki ayrı çizim
// tutmak, adın nasıl duracağını yazarken göstermeyi imkânsız kılardı).
function drawTabela(x, y, w, h, name, caret) {
  const c = CONFIG.colors;
  const r = h * 0.07;

  // yan kanatlar: montaj bandı. İlk denemede geniş ve parlak kırmızı levhalardı,
  // tabelanın önüne geçiyordu — daraldı ve koyulaştı.
  const ww = w * 0.055, wy = y + h * 0.30, wh2 = h * 0.40;
  for (const wx of [x - ww * 0.9, x + w - ww * 0.1]) {
    const g = ctx.createLinearGradient(0, wy, 0, wy + wh2);
    g.addColorStop(0, "#c2191f"); g.addColorStop(0.5, "#9c0f16"); g.addColorStop(1, "#6f0a10");
    fillRoundRect(wx, wy, ww, wh2, ww * 0.22, g);
  }

  // ışık taşması (arkadan aydınlatmalı kutu)
  ctx.save();
  ctx.shadowColor = "rgba(255,246,225,0.55)";
  ctx.shadowBlur = h * 0.55;
  const face = ctx.createLinearGradient(0, y, 0, y + h);
  face.addColorStop(0, c.signFace); face.addColorStop(0.55, c.signFace2); face.addColorStop(1, c.signFace3);
  fillRoundRect(x, y, w, h, r, face);
  ctx.restore();
  strokeRoundRect(x, y, w, h, r, c.signEdge, 1.2);
  ctx.fillStyle = "rgba(255,255,255,0.9)";           // üst kenar parlaması
  ctx.fillRect(x + r, y + 1, w - r * 2, 1.2);

  // ECZANE — kabartma: koyu kırmızı katmanlar sağa-aşağı kaydırılıp üstüne parlak kırmızı
  const cx = x + w / 2, ey = y + h * 0.40;
  let fs = h * 0.42;
  ctx.font = "900 " + fs + "px " + RX_FONT;
  while (fs > 8 && ctx.measureText("ECZANE").width > w * 0.82) { fs -= 0.5; ctx.font = "900 " + fs + "px " + RX_FONT; }
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  // KABARTMA: üç kalın katman merdiven gibi duruyordu. Aynı derinlik, çok sayıda
  // küçük adımla — kenar pürüzsüz çıkıyor.
  const depth = Math.max(1.5, fs * 0.075), steps = Math.max(6, Math.round(depth * 2.2));
  for (let i = steps; i >= 1; i--) {
    const t = i / steps;
    ctx.fillStyle = t > 0.55 ? c.rxRedDeep : c.rxRedMid;
    ctx.fillText("ECZANE", cx + depth * t, ey + depth * t);
  }
  ctx.fillStyle = c.rxRed;
  ctx.fillText("ECZANE", cx, ey);
  ctx.fillStyle = "rgba(255,255,255,0.22)";        // üst yüzey parlaması
  ctx.fillText("ECZANE", cx, ey - fs * 0.028);
  ctx.fillStyle = c.rxRed;
  ctx.fillText("ECZANE", cx, ey);

  // ad — ince, harf aralıklı, siyaha yakın. Uzun adda punto küçülür, kutu taşmaz.
  const shown = (name || "") + (caret ? "|" : "");
  let ns = h * 0.165, sp = ns * 0.24;
  const fits = () => {
    ctx.font = "600 " + ns + "px " + RX_FONT;
    let t = 0; for (const ch of Array.from(shown)) t += ctx.measureText(ch).width + sp;
    return t - sp;
  };
  while (ns > 6 && fits() > w * 0.86) { ns -= 0.5; sp = ns * 0.24; }
  spacedText(shown, cx, y + h * 0.755, ns, c.signInk, sp, "600", "center");
}

// ---- Ana ekran butonu (menü dilinin tek kaynağı) ----
// =====================================================================
//  ANA EKRAN BUTON / KUTU STİLİ
// =====================================================================
// MENU_UI.style: "karma"  — SEÇİLEN (Kerem): butonlar ve rekor kutusu ECZANE DOLABI (ceviz + pirinç,
//                           EczSlab); birincil buton (YENİ KARİYER / ANLADIM) aynı tarzda ama KIRMIZI
//                           lake panel (Kerem: "tarzı diğer butonlarla olsun, rengi kırmızı").
//                           NÖBETÇİ levhası lacivert EMAYE (EczSign) — SES levhasıyla aynı dil.
//                "emaye" — hepsi emaye levha, "eczane" — hepsi ahşap + pirinç,
//                "neon"  — ilk hali (koyu kutu + turuncu neon kenar).
// Yazı tipleri <style>'da gömülü: EczSign (Oswald, dar tabela harfi), EczSlab (Zilla Slab).
const MENU_UI = { style: "karma" };
const SIGN_FONT = "EczSign, 'Arial Narrow', " + RX_FONT;
const SLAB_FONT = "EczSlab, Georgia, serif";
if (typeof document !== "undefined" && document.fonts && document.fonts.load) {
  for (const f of ["700 20px EczSign", "600 20px EczSign", "700 20px EczSlab", "600 20px EczSlab", "400 20px EczTerm", "400 20px EczSig"])
    document.fonts.load(f, "ĞŞİÇÖÜ").catch(() => {});
}
// Aile seçilebilen fitText: sığmazsa punto küçülür. Gölge/kabartma isteğe bağlı.
function fitTextF(str, x, y, maxW, px, color, align, weight, family, fx) {
  let s = px;
  const wgt = weight || "700", fam = family || RX_FONT;
  ctx.font = wgt + " " + s + "px " + fam;
  while (s > 6 && ctx.measureText(str).width > maxW) { s -= 0.5; ctx.font = wgt + " " + s + "px " + fam; }
  ctx.textAlign = align || "left"; ctx.textBaseline = "middle";
  if (fx === "engrave") {                     // oyma: altta açık, üstte koyu gölge
    ctx.fillStyle = "rgba(255,240,200,0.35)"; ctx.fillText(str, x, y + Math.max(1, s * 0.05));
    ctx.fillStyle = "rgba(0,0,0,0.45)"; ctx.fillText(str, x, y - Math.max(0.6, s * 0.03));
  } else if (fx === "emboss") {               // kabartma: altta koyu gölge
    ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.fillText(str, x, y + Math.max(1, s * 0.05));
  }
  ctx.fillStyle = color; ctx.fillText(str, x, y);
  return s;
}
// konumdan türetilen sabit "rastgele" (her karede aynı çizik/damar yerleri)
function uiHash(a, b) { const v = Math.sin(a * 12.9898 + b * 78.233) * 43758.5453; return v - Math.floor(v); }
function uiScrew(cx, cy, r, brass) {
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  const g = ctx.createRadialGradient(cx - r * 0.3, cy - r * 0.3, r * 0.1, cx, cy, r);
  g.addColorStop(0, brass ? "#fff1b8" : "#f2efe8"); g.addColorStop(1, brass ? "#8a6420" : "#8d887e");
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "rgba(30,24,16,0.7)"; ctx.lineWidth = 0.6; ctx.stroke();
  const a = uiHash(cx, cy) * Math.PI;
  ctx.beginPath(); ctx.moveTo(cx - Math.cos(a) * r * 0.7, cy - Math.sin(a) * r * 0.7);
  ctx.lineTo(cx + Math.cos(a) * r * 0.7, cy + Math.sin(a) * r * 0.7);
  ctx.strokeStyle = "rgba(30,24,16,0.85)"; ctx.lineWidth = Math.max(0.7, r * 0.3); ctx.stroke();
}
function uiScrews(x, y, w, h, r, brass) {
  const ix = Math.min(w, h) * 0.16 + r, iy = h * 0.5;
  if (h < 70) { uiScrew(x + ix, y + iy, r, brass); uiScrew(x + w - ix, y + iy, r, brass); return; }
  for (const [px, py] of [[x + ix, y + ix], [x + w - ix, y + ix], [x + ix, y + h - ix], [x + w - ix, y + h - ix]]) uiScrew(px, py, r, brass);
}
// emaye kopukları: kenarda 2–3 küçük pas lekesi
function uiChips(x, y, w, h) {
  ctx.save(); ctx.fillStyle = "rgba(70,40,22,0.8)";
  const n = 2 + Math.floor(uiHash(x, w) * 2);
  for (let i = 0; i < n; i++) {
    const t = uiHash(x + i * 7, y + i * 3), side = Math.floor(uiHash(w + i, h) * 4), r = Math.max(1.2, h * (0.03 + 0.03 * uiHash(i, x)));
    let cx, cy;
    if (side === 0) { cx = x + w * (0.1 + t * 0.8); cy = y + r * 0.4; }
    else if (side === 1) { cx = x + w * (0.1 + t * 0.8); cy = y + h - r * 0.4; }
    else if (side === 2) { cx = x + r * 0.4; cy = y + h * (0.2 + t * 0.6); }
    else { cx = x + w - r * 0.4; cy = y + h * (0.2 + t * 0.6); }
    ctx.beginPath(); ctx.ellipse(cx, cy, r * 1.4, r, t * 3, 0, Math.PI * 2); ctx.fill();
  }
  ctx.restore();
}
function uiShadow(fn) {
  ctx.save(); ctx.shadowColor = "rgba(0,0,0,0.55)"; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3; fn(); ctx.restore();
}
// --- EMAYE levha ---
// tone: "navy" (lacivert zemin, krem yazı — birincil) | "cream" (krem zemin, lacivert yazı) | "off" (soluk)
function enamelPlate(x, y, w, h, tone) {
  const r = Math.min(h * 0.2, 14);
  const navy = tone === "navy";
  uiShadow(() => {
    const g = ctx.createLinearGradient(0, y, 0, y + h);
    if (navy) { g.addColorStop(0, "#2d57a8"); g.addColorStop(0.5, "#1b3f86"); g.addColorStop(1, "#122e66"); }
    else { g.addColorStop(0, "#fbf5e4"); g.addColorStop(0.55, "#efe4c8"); g.addColorStop(1, "#dccfae"); }
    fillRoundRect(x, y, w, h, r, g);
  });
  strokeRoundRect(x, y, w, h, r, navy ? "rgba(8,18,40,0.95)" : "rgba(70,56,34,0.7)", 1);
  const ins = Math.max(3, Math.min(h, w) * 0.09);
  strokeRoundRect(x + ins, y + ins, w - ins * 2, h - ins * 2, r * 0.6,
    navy ? "rgba(246,242,230,0.95)" : "#1b3f86", Math.max(1.3, h * 0.035));
  ctx.fillStyle = "rgba(255,255,255," + (navy ? 0.10 : 0.35) + ")";                 // cam parlaması
  ctx.fillRect(x + ins * 1.6, y + ins * 1.3, w - ins * 3.2, Math.max(1, h * 0.12));
  uiChips(x, y, w, h);
  return ins;
}
// --- ECZANE dolabı: ceviz ahşap + pirinç çerçeve ---
function brassGrad(y, h) {
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, "#fbe7a6"); g.addColorStop(0.35, "#d9ad55"); g.addColorStop(0.6, "#a8792a"); g.addColorStop(1, "#e2bd6a");
  return g;
}
// face: false = ceviz ahşap, true = pirinç plaka, "red" = kırmızı lake ahşap (birincil buton)
function woodPanel(x, y, w, h, brassFace, frame) {
  const r = Math.min(h * 0.14, 10);
  uiShadow(() => fillRoundRect(x, y, w, h, r, brassGrad(y, h)));                      // pirinç dış çerçeve
  const b = frame || Math.max(3, Math.min(h, w) * 0.08);   // büyük kartlar çerçeveyi kendisi verir
  if (brassFace === true) {
    fillRoundRect(x + b, y + b, w - b * 2, h - b * 2, r * 0.6, brassGrad(y + b, h - b * 2));
    strokeRoundRect(x + b, y + b, w - b * 2, h - b * 2, r * 0.6, "rgba(90,60,20,0.7)", 1);
  } else {
    const red = brassFace === "red", green = brassFace === "green", lake = red || green;
    const g = ctx.createLinearGradient(0, y + b, 0, y + h - b);
    if (red) { g.addColorStop(0, "#c8323a"); g.addColorStop(0.5, "#a3202a"); g.addColorStop(1, "#7a141c"); }
    else if (green) { g.addColorStop(0, "#3f8f5a"); g.addColorStop(0.5, "#2a6e42"); g.addColorStop(1, "#1a4a2b"); }
    else { g.addColorStop(0, "#6b4428"); g.addColorStop(0.5, "#4d2f1a"); g.addColorStop(1, "#3a2213"); }
    fillRoundRect(x + b, y + b, w - b * 2, h - b * 2, r * 0.6, g);
    ctx.save(); roundRect(x + b, y + b, w - b * 2, h - b * 2, r * 0.6); ctx.clip();          // ahşap damarları
    ctx.strokeStyle = red ? "rgba(60,4,8,0.22)" : green ? "rgba(4,30,12,0.22)" : "rgba(20,10,4,0.28)"; ctx.lineWidth = 1;
    const lines = Math.max(4, Math.floor(h / 7));
    for (let i = 0; i < lines; i++) {
      const yy = y + b + (h - b * 2) * (i + 0.5) / lines, a = (uiHash(x + i, y) - 0.5) * 4;
      ctx.beginPath(); ctx.moveTo(x, yy);
      ctx.bezierCurveTo(x + w * 0.3, yy + a, x + w * 0.6, yy - a, x + w, yy + a * 0.5); ctx.stroke();
    }
    if (lake) {                                                                 // lake parlaması
      ctx.fillStyle = "rgba(255,255,255,0.10)";
      ctx.fillRect(x + b, y + b, w - b * 2, (h - b * 2) * 0.38);
    }
    ctx.restore();
    strokeRoundRect(x + b, y + b, w - b * 2, h - b * 2, r * 0.6, "rgba(0,0,0,0.55)", 1.2);
  }
  return b;
}

function menuButton(b, label, kind, pulse) {
  const strong = kind === "primary";
  let st = MENU_UI.style;
  if (st === "karma") {
    // Kerem: birincil buton da diğerleriyle aynı dolap tarzı, ama KIRMIZI lake panel
    woodPanel(b.x, b.y, b.w, b.h, strong ? "red" : false);
    if (strong && pulse !== false) {                                             // yavaş ışık süzülmesi
      const t = ((game.clock || 0) * 0.35) % 1.6 - 0.3;
      ctx.save(); roundRect(b.x, b.y, b.w, b.h, Math.min(b.h * 0.14, 10)); ctx.clip();
      const gx = b.x + b.w * t, g = ctx.createLinearGradient(gx - b.h, 0, gx + b.h, 0);
      g.addColorStop(0, "rgba(255,230,180,0)"); g.addColorStop(0.5, "rgba(255,230,180,0.16)"); g.addColorStop(1, "rgba(255,230,180,0)");
      ctx.fillStyle = g; ctx.fillRect(b.x, b.y, b.w, b.h); ctx.restore();
    }
    uiScrews(b.x, b.y, b.w, b.h, Math.max(1.5, b.h * 0.045), true);
    fitTextF(label, b.x + b.w / 2, b.y + b.h / 2, b.w * 0.76, b.h * (strong ? 0.46 : 0.38),
      strong ? "#fbe7a6" : "#f0cf82", "center", "700", SLAB_FONT, "emboss");
    return;
  }
  if (st === "emaye") {
    enamelPlate(b.x, b.y, b.w, b.h, strong ? "navy" : "cream");
    if (strong && pulse !== false) {                                             // birincil: hafif ışık süzülmesi
      const t = ((game.clock || 0) * 0.35) % 1.6 - 0.3;
      ctx.save(); roundRect(b.x, b.y, b.w, b.h, Math.min(b.h * 0.2, 14)); ctx.clip();
      const gx = b.x + b.w * t, g = ctx.createLinearGradient(gx - b.h, 0, gx + b.h, 0);
      g.addColorStop(0, "rgba(255,255,255,0)"); g.addColorStop(0.5, "rgba(255,255,255,0.13)"); g.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = g; ctx.fillRect(b.x, b.y, b.w, b.h); ctx.restore();
    }
    uiScrews(b.x, b.y, b.w, b.h, Math.max(1.6, b.h * 0.05), false);
    fitTextF(label, b.x + b.w / 2, b.y + b.h / 2 + b.h * 0.02, b.w * 0.74, b.h * (strong ? 0.50 : 0.42),
      strong ? "#f6f2e6" : "#1b3f86", "center", "700", SIGN_FONT, strong ? "emboss" : null);
    return;
  }
  if (st === "eczane") {
    woodPanel(b.x, b.y, b.w, b.h, strong);
    uiScrews(b.x, b.y, b.w, b.h, Math.max(1.5, b.h * 0.045), true);
    fitTextF(label, b.x + b.w / 2, b.y + b.h / 2, b.w * 0.76, b.h * (strong ? 0.44 : 0.38),
      strong ? "#3a2213" : "#f0cf82", "center", "700", SLAB_FONT, strong ? "engrave" : "emboss");
    return;
  }
  // "neon" — ilk hali
  const c = CONFIG.colors;
  fillRoundRect(b.x, b.y, b.w, b.h, b.h * 0.26, "rgba(16,12,20,0.93)");
  ctx.save();
  if (strong) {
    const p = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(game.clock * 4));
    ctx.shadowColor = c.neonGlow; ctx.shadowBlur = 20 * (pulse === false ? 1 : p);
  }
  strokeRoundRect(b.x, b.y, b.w, b.h, b.h * 0.26,
    strong ? c.neon : (kind === "tertiary" ? "rgba(245,170,70,0.22)" : "rgba(245,170,70,0.5)"),
    strong ? Math.max(2, b.w * 0.006) : 1.5);
  ctx.restore();
  // Üçüncül butonun punto oranı daha küçük: dokunma yüksekliği diğerleriyle aynı
  // olduğu için, hiyerarşiyi ancak TİPOGRAFİ taşıyabilir.
  fitText(label, b.x + b.w / 2, b.y + b.h / 2, b.w * 0.88,
    b.h * (kind === "tertiary" ? 0.26 : 0.40),
    strong ? c.neon : (kind === "tertiary" ? c.creamSoft : c.cream), "center", strong ? "800" : "700");
}
// pasif buton (DEVAM ET, sürmekte olan sezon yokken)
function menuButtonOff(b, label) {
  const st = MENU_UI.style === "karma" ? "eczane" : MENU_UI.style;

    else { woodPanel(b.x, b.y, b.w, b.h, false); uiScrews(b.x, b.y, b.w, b.h, Math.max(1.5, b.h * 0.045), true); }
    fitTextF(label, b.x + b.w / 2, b.y + b.h / 2, b.w * 0.74, b.h * 0.40,

// =====================================================================
//  OYUN İÇİ BUTONLAR — ana ekranla aynı "eczane dolabı" dili (Kerem isteği)
// =====================================================================
// tone: "red" (kırmızı lake — ret / birincil), "green" (yeşil lake — onay / ver),
//       "brass" (pirinç plaka — para), "wood" (ceviz — ikincil). opts: { sub, disabled, glint }
function cabinetButton(b, label, tone, opts) {
  const o = opts || {}, dis = !!o.disabled;
  ctx.save();
  if (dis) ctx.globalAlpha = 0.5;
  woodPanel(b.x, b.y, b.w, b.h, dis ? false : tone === "brass" ? true : tone === "wood" ? false : tone);
  if (o.glint && !dis) {                                                        // yavaş sıcak ışık süzülmesi
    const t = ((game.clock || 0) * 0.35) % 1.6 - 0.3;
    ctx.save(); roundRect(b.x, b.y, b.w, b.h, Math.min(b.h * 0.14, 10)); ctx.clip();
    const gx = b.x + b.w * t, g = ctx.createLinearGradient(gx - b.h, 0, gx + b.h, 0);
    g.addColorStop(0, "rgba(255,230,180,0)"); g.addColorStop(0.5, "rgba(255,230,180,0.16)"); g.addColorStop(1, "rgba(255,230,180,0)");
    ctx.fillStyle = g; ctx.fillRect(b.x, b.y, b.w, b.h); ctx.restore();
  }
  if (b.h >= 30) uiScrews(b.x, b.y, b.w, b.h, Math.max(1.4, b.h * 0.042), true);
  const onBrass = tone === "brass" && !dis;
  const col = onBrass ? "#3a2213" : (tone === "wood" || dis) ? "#f0cf82" : "#fbe7a6";
  const subCol = onBrass ? "rgba(58,34,19,0.8)" : "rgba(251,231,166,0.78)";
  const fx = onBrass ? "engrave" : "emboss";
  const mw = b.w * (b.h >= 30 ? 0.78 : 0.84);
  if (o.sub) {
    fitTextF(label, b.x + b.w / 2, b.y + b.h * 0.38, mw, b.h * 0.30, col, "center", "700", SLAB_FONT, fx);
    fitTextF(o.sub, b.x + b.w / 2, b.y + b.h * 0.70, mw, b.h * 0.22, subCol, "center", "600", SLAB_FONT);
  } else {
    fitTextF(label, b.x + b.w / 2, b.y + b.h / 2, mw, b.h * (o.size || 0.40), col, "center", "700", SLAB_FONT, fx);
  }
  ctx.restore();
}

// rekor paneli: başlık + satırlar (rows boşsa "henüz yok" yazısı)
function menuRecordsPanel(rx, ry, rw, rh, titleH, rowH, rows, emptyText) {
  const st = MENU_UI.style === "karma" ? "eczane" : MENU_UI.style, c = CONFIG.colors, S = layout.stage;
  if (st === "emaye") {
    enamelPlate(rx, ry, rw, rh, "cream");
    const ins = Math.max(3, Math.min(rh, rw) * 0.09);
    // lacivert başlık şeridi (sokak tabelası başlığı gibi)
    const bh = titleH * 1.05, by = ry + ins * 1.6;
    fillRoundRect(rx + ins * 1.8, by, rw - ins * 3.6, bh, bh * 0.2, "#1b3f86");
    fitTextF("EN İYİ ECZACI KARİYERLERİ", rx + rw / 2, by + bh / 2, rw * 0.7, bh * 0.66, "#f6f2e6", "center", "700", SIGN_FONT);
    uiScrews(rx, ry, rw, rh, Math.max(1.6, rowH * 0.12), false);
    let yy = by + bh + rowH * 0.62;
    if (rows) for (let i = 0; i < rows.length; i++) {
      if (i > 0) { ctx.fillStyle = "rgba(27,63,134,0.18)"; ctx.fillRect(rx + rw * 0.1, yy - rowH * 0.5, rw * 0.8, 1); }
      fitTextF(rows[i][0], rx + rw * 0.11, yy, rw * 0.5, rowH * 0.56, "#3d4a66", "left", "600", SIGN_FONT);
      fitTextF(rows[i][1], rx + rw * 0.89, yy, rw * 0.34, rowH * 0.62, "#1b3f86", "right", "700", SIGN_FONT);
      yy += rowH;
    }
    else fitTextF(emptyText, rx + rw / 2, yy, rw * 0.76, rowH * 0.56, "#3d4a66", "center", "600", SIGN_FONT);
    return;
  }
  if (st === "eczane") {
    const b = woodPanel(rx, ry, rw, rh, false);
    uiScrews(rx, ry, rw, rh, Math.max(1.5, rowH * 0.11), true);
    // pirinç isim plakası
    const pw = rw * 0.80, ph = titleH * 1.1, px = rx + (rw - pw) / 2, py = ry + b * 1.8;
    uiShadow(() => fillRoundRect(px, py, pw, ph, ph * 0.18, brassGrad(py, ph)));
    strokeRoundRect(px, py, pw, ph, ph * 0.18, "rgba(90,60,20,0.8)", 1);
    fitTextF("EN İYİ ECZACI KARİYERLERİ", px + pw / 2, py + ph / 2, pw * 0.84, ph * 0.62, "#3a2213", "center", "700", SLAB_FONT, "engrave");
    let yy = py + ph + rowH * 0.62;
    if (rows) for (let i = 0; i < rows.length; i++) {
      const fl = rows[i][2] || "";
      if (i > 0) { ctx.fillStyle = "rgba(240,207,130,0.14)"; ctx.fillRect(rx + rw * 0.1, yy - rowH * 0.5, rw * 0.8, 1); }
      if (fl === "hint") {            // tek satırlık bilgi/çağrı (ör. "Game Center'a bağlanmak için dokun")
        fitTextF(rows[i][0], rx + rw / 2, yy, rw * 0.8, rowH * 0.5, "#cdb68f", "center", "600", SLAB_FONT);

        fitTextF(rows[i][0], rx + rw * 0.11, yy, rw * 0.52, rowH * 0.54, fl === "me" ? "#f3cf7a" : "#e8d6b0", "left", fl === "me" ? "700" : "600", SLAB_FONT);
        // sayılar tabela fontuyla (Zilla Slab'ın rakamları eski usul)
        fitTextF(rows[i][1], rx + rw * 0.89, yy, rw * 0.32, rowH * 0.62, "#f0cf82", "right", "600", SIGN_FONT, "emboss");
      }
      yy += rowH;
    }
    else fitTextF(emptyText, rx + rw / 2, yy, rw * 0.76, rowH * 0.54, "#e8d6b0", "center", "600", SLAB_FONT);
    return;
  }
  fillRoundRect(rx, ry, rw, rh, S.w * 0.028, "rgba(16,12,20,0.94)");

    fitText(rows[i][0], rx + rw * 0.06, yy, rw * 0.55, rowH * 0.46, c.creamSoft, "left", "600");
    fitText(rows[i][1], rx + rw * 0.94, yy, rw * 0.36, rowH * 0.5, c.cream, "right", "700");

  else fitText(emptyText, rx + rw / 2, ry + titleH + rowH * 0.5, rw * 0.86, rowH * 0.46, c.creamSoft, "center", "600");

// panel yüksekliği stile göre (emaye/eczane başlık şeridi + kenar payı ister)
function menuRecordsHeight(S, has, titleH, rowH, nRows) {

// =====================================================================
//  ANA EKRAN
// =====================================================================
// Tabela ekranın kalıcı üstbilgisi. Altında dükkân cephesi, sonra buton yığını,
// en altta YEREL rekor paneli (sunucu yok — uydurma bir dünya sıralaması konmadı).
function drawMenu() {
  const c = CONFIG.colors, S = layout.stage;
  const X = f => S.x + S.w * f, Y = f => S.y + S.h * f;

  const ST = menuST();          // PNG arka plan yüklüyse STB, değilse kod sokağının ST'si
  drawStreet();

  // --- tabela ---
  drawMenuSign(game.pharmacyName || NAME_FALLBACK, false);

  // --- yarın nöbetçiysen asılı levha (menüden bile hazırlanmayı hatırlatır) ---
  if (game.hasRun && isNightDutyDay(game.dayNumber + 1)) {
    const nw = S.w * 0.26, nh = S.h * 0.026, nx = X(0.94) - nw, ny = Y(ST.nobetY);
    if (MENU_UI.style === "emaye" || MENU_UI.style === "karma") {
      enamelPlate(nx, ny, nw, nh * 1.25, "navy");
      fitTextF("NÖBETÇİ", nx + nw / 2, ny + nh * 0.64, nw * 0.7, nh * 0.72, "#f6f2e6", "center", "700", SIGN_FONT);
    } else if (MENU_UI.style === "eczane") {
      woodPanel(nx, ny, nw, nh * 1.25, true);
      fitTextF("NÖBETÇİ", nx + nw / 2, ny + nh * 0.64, nw * 0.7, nh * 0.7, "#3a2213", "center", "700", SLAB_FONT, "engrave");
    } else {
      fillRoundRect(nx, ny, nw, nh, nh * 0.25, "rgba(10,8,14,0.9)");
      strokeRoundRect(nx, ny, nw, nh, nh * 0.25, c.neon, 1.2);
      fitText("🌙 NÖBETÇİ", nx + nw / 2, ny + nh / 2, nw * 0.86, nh * 0.5, c.neon, "center", "800");
    }
  }

  // --- buton yığını ---
  const bx = X(0.09), bw = S.w * 0.82;
  // Buton yükseklikleri 44 pt dokunma hedefini karşılar (boot denetimi kontrol eder).
  // Üçüncül buton GÖRSEL olarak daha hafif (ince kenar, küçük punto) ama dokunma
  // yüksekliği diğerleriyle aynı: göze küçük, parmağa küçük değil.
  let by = Y(ST.btnTop);
  const gap = S.h * ST.btnGap;
  const h1 = S.h * ST.btnH1, h2 = S.h * ST.btnH2, h3 = S.h * ST.btnH3;

  layout.menuStartBtn = { x: bx, y: by, w: bw, h: h1 };
  const asking = game.newCareerAskUntil > game.clock;
  menuButton(layout.menuStartBtn, asking ? "ESKİSİ SİLİNİR · TEKRAR DOKUN" : "YENİ KARİYER", "primary");
  by += h1 + gap;

  // DEVAM ET — yalnız SÜREN bir sezon sürdürülebilir. Bitmişse PASİF çizilir:
  // görünür ama rect verilmez, yani tıklanamaz. Gizlemek yerine soluk göstermek
  // oyuncuya neden geçemediğini anlatır.
  const resume = { x: bx, y: by, w: bw, h: h2 };
  layout.menuResumeRect = resume;     // pasifken dokunulursa "olmaz" tıkı için
  if (canResume()) {
    layout.menuResumeBtn = resume;
    const where = game.resumeState === STATE.SEASONEND
      ? "S" + careerSeason() + " tamam"
      : "S" + careerSeason() + " · Gün " + game.dayNumber + "/" + CONFIG.seasonDays;
    menuButton(resume, "DEVAM ET  ·  " + where, "secondary");
  } else {
    layout.menuResumeBtn = null;
    menuButtonOff(resume, "DEVAM ET");
  }
  by += h2 + gap;

  // btnSplit: son iki buton yan yana (yarım en) — bir sıra kazanılır, arka plandaki
  // vitrin görünür kalır. Dokunma yüksekliği değişmez.
  if (ST.btnSplit) {
    const hw = (bw - gap) / 2, hh = Math.max(h2, h3);
    layout.menuHowBtn = { x: bx, y: by, w: hw, h: hh };
    menuButton(layout.menuHowBtn, "NASIL OYNANIR", "secondary");
    layout.menuNameBtn = { x: bx + hw + gap, y: by, w: hw, h: hh };
    menuButton(layout.menuNameBtn, "✎ ADI DEĞİŞTİR", "secondary");
  } else {
    layout.menuHowBtn = { x: bx, y: by, w: bw, h: h2 };
    menuButton(layout.menuHowBtn, "NASIL OYNANIR", "secondary");
    by += h2 + gap;

    layout.menuNameBtn = { x: bx, y: by, w: bw, h: h3 };
    menuButton(layout.menuNameBtn, "✎ ECZANE ADINI DEĞİŞTİR", "tertiary");
  }

  // --- EN İYİ ECZACI KARİYERLERİ: Game Center dünya sıralaması (yoksa yerel rekorlar) ---
  GC.refresh(false);                 // dakikada en fazla bir kez tazelenir
  const rows = scoreboardRows();
  const rw = S.w * 0.86, rx = X(0.07);
  const rowH = S.h * (rows.length > 3 ? 0.0235 : 0.026), titleH = S.h * 0.028;   // 4 satırda butonlara yaklaşmasın
  const rh = menuRecordsHeight(S, rows.length > 0, titleH, rowH, rows.length);
  // 4 satırlık sıralama (ilk 3 + "Sen") butonlara yaklaşmasın: altındaki kaldırıma doğru biraz iner
  const drop = rows.length > 3 ? Math.min(S.h * 0.02, layout.h - (window.__safeRawBottom || 0) - 8 - Y(ST.recBottom)) : 0;
  const ry = Y(ST.recBottom) - rh + Math.max(0, drop);
  menuRecordsPanel(rx, ry, rw, rh, titleH, rowH, rows.length ? rows : null, "Henüz kariyer tamamlamadın");
  layout.menuBoardBtn = GC.available ? { x: rx, y: ry, w: rw, h: rh } : null;   // dokun → Game Center

  // --- SES levhası (sağ üst) ---
  drawMenuSoundPlate();
  drawMenuAboutPlate();   // sol üst: hakkında / lisanslar
}

// =====================================================================
//  ECZANE ADI — aynı sokak, üstüne karartma, tabela canlı önizleme
// =====================================================================
// Klavye TÜRKÇE Q düzenindedir. İlk tasarım 6×5 alfabe ızgarasıydı ve kimse harfini
// bulamıyordu; telefon klavyesinin yerleşimi zaten herkesin ezberinde.
const KB_ROWS = ["QWERTYUIOPĞÜ", "ASDFGHJKLŞİ", "ZXCVBNMÖÇ"];
const NAME_MAX = 14;
const NAME_FALLBACK = "AİLE";          // ad girilmezse (Kerem: başlangıçta "AİLE ECZANESİ")

function openNaming() {
  game.nameInput = game.pharmacyName || "";
  game.state = STATE.NAMING;
}
function setPharmacyName(v) {
  const s = String(v || "").trim().slice(0, NAME_MAX);
  game.pharmacyName = s || NAME_FALLBACK;
}
function confirmName() {
  setPharmacyName(game.nameInput);
  game.state = STATE.MENU;
  saveProfile();
}

function drawNaming() {
  const c = CONFIG.colors, S = layout.stage;
  const X = f => S.x + S.w * f, Y = f => S.y + S.h * f;

  drawStreet();
  // Karartma TÜM tuvale: yalnız sahneye uygulanınca letterbox bandı aydınlık kalıyor
  // ve ekranın tepesinde görünür bir dikiş çizgisi oluşuyordu.
  ctx.fillStyle = "rgba(8,6,14,0.72)";
  ctx.fillRect(0, 0, layout.w, layout.h);

  // tabela: yazılan ad CANLI görünür — oyuncu onaylamadan önce sonucu görür
  const blink = (game.clock % 1) < 0.55;
  drawMenuSign(game.nameInput, blink);

  fitTextF("ECZANENİN ADINI YAZ", X(0.5), Y(0.60), S.w * 0.8, S.h * 0.030, "#f3cf7a", "center", "700", SLAB_FONT, "emboss");
  fitTextF("En fazla " + NAME_MAX + " harf · boş bırakırsan “" + NAME_FALLBACK + "” olur",
    X(0.5), Y(0.645), S.w * 0.86, S.h * 0.020, "#e6d3ad", "center", "600", SLAB_FONT);

  // --- klavye ---
  const kb = S.w * 0.95, kx0 = X(0.025);
  const gap = S.w * 0.008;
  const kw = (kb - gap * 11) / 12;               // en uzun sıra 12 tuş
  const kh = S.h * 0.052, vgap = S.h * 0.012;
  const top = Y(0.705);
  layout.kbKeys = [];

  for (let r = 0; r < KB_ROWS.length; r++) {
    const chars = Array.from(KB_ROWS[r]);
    const rowW = chars.length * kw + (chars.length - 1) * gap;
    const rx = kx0 + (kb - rowW) / 2;
    const ry = top + r * (kh + vgap);
    for (let i = 0; i < chars.length; i++) {
      const x = rx + i * (kw + gap);
      woodPanel(x, ry, kw, kh, false, Math.max(2, kw * 0.07));   // ceviz tuş + pirinç kenar
      fitTextF(chars[i], x + kw / 2, ry + kh / 2 + kh * 0.02, kw * 0.74, kh * 0.46, "#f0cf82", "center", "700", SLAB_FONT, "emboss");
      // DOKUNMA KUTUSU çizilen tuştan büyük: tuş 390px'te ~28px kalıyor, satır
      // aralığının tamamı hedefe verilir (telefon klavyelerinin yaptığının aynısı).
      layout.kbKeys.push({ ch: chars[i], x: x - gap / 2, y: ry - vgap / 2, w: kw + gap, h: kh + vgap });
    }
  }

  // aksiyon sırası: ⌫ · BOŞLUK · ✓ TAMAM
  const ay = top + 3 * (kh + vgap);
  const delW = kb * 0.20, okW = kb * 0.30, spW = kb - delW - okW - gap * 2;
  const hitY = ay - vgap / 2, hitH = kh + vgap;   // çizim kh, HEDEF satır adımı kadar
  layout.kbDel = { x: kx0, y: hitY, w: delW, h: hitH };
  cabinetButton({ x: kx0, y: ay, w: delW, h: kh }, "⌫ SİL", "red", { size: 0.38 });

  layout.kbSpace = { x: kx0 + delW + gap, y: hitY, w: spW, h: hitH };
  cabinetButton({ x: layout.kbSpace.x, y: ay, w: spW, h: kh }, "BOŞLUK", "wood", { size: 0.36 });

  layout.kbOk = { x: kx0 + kb - okW, y: hitY, w: okW, h: hitH };
  cabinetButton({ x: layout.kbOk.x, y: ay, w: okW, h: kh }, "✓ TAMAM", "green", { size: 0.40, glint: true });
  drawMenuSoundPlate();   // ilk açılışta oyuncu buradan başlar: sesi burada da kapatabilsin
}
