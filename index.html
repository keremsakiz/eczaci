//  NASIL OYNANIR — tek ekran, kaydırma yok
// =====================================================================
// Sayılar METNE GÖMÜLMEZ, CONFIG'ten okunur: denge değişince açıklama da değişir.
// Medula, dilenci ve geliştirme ağacı KASTEN yok — oyun onları kendi zamanında açıyor,
// başlangıçta anlatmak gürültü olur.
function howToRules() {
  return [
    ["💊", "DOĞRU İLACI VER",
     "Hasta reçete uzatır, derdini anlatır ya da e-reçete kodu verir. Alttaki raftan seç, tezgahtaki PC'den servis et."],
    ["🔍", "REÇETEYİ İNCELE",
     "Onaylamadan önce dört şeye bak: doktor defterde mi, tarih bugün mü, kaşe var mı, imza düzgün mü. Sahtenin en az biri bozuktur."],
    // Oyundaki e-reçete sisteminin adı MELUDA (Kerem kararı; kod içi adlar "medula" kaldı).
    ["🖥️", "MELUDA — E-REÇETE SİSTEMİ",
     "Meluda, eczanenin e-reçete sistemidir. Kodla gelen hastanın ilaçlarını PC'deki MELUDA'dan sorgula, sonra ver. " +
     "E-reçete asla sahte olmaz; ödemesi SGK'dan " + CONFIG.medulaPayDelayDays + " gün sonra kasaya girer. " +
     "Geliştirme'den Meluda Terminali alınca açılır."],
    ["🎯", "GÜNLÜK HEDEFİ TUTTUR",
     "Tutturursan +" + CONFIG.goalMetReputation + " itibar. Bir gün kaçırmak serbest — üst üste kaçırmak " +
     CONFIG.goalMissRepStep + " itibardan başlayıp artar."],
    ["⭐", "İTİBARI KORU",
     CONFIG.startReputation + "'de başlar, sıfıra inerse KARİYER BİTER. Her sezon başında yeniden " + CONFIG.startReputation + "."],
    ["🌙", "NÖBET GECESİ",
     "Günün ikinci bölümü. Fiyatlar %" + Math.round((CONFIG.nightPriceMultiplier - 1) * 100) +
     " yüksek ama sahte reçete de çok daha fazla."]
  ];
}
function howToTally() {
  return [
    ["Doğru servis", "+" + CONFIG.repGainCorrect + " itibar", true],
    ["Sahteyi reddettin", "+" + CONFIG.fakeCatchBonus + "₺ · +" + CONFIG.fakeCatchRepGain + " itibar", true],
    ["Yanlış ilaç", "−" + CONFIG.repLossWrong + " itibar", false],
    ["Sahteye ilaç verdin", "−" + CONFIG.fakeApproveMoneyPenalty + "₺ · −" + CONFIG.fakeApproveRepLoss + " itibar", false],
    ["Hastayı beklettin", "−" + CONFIG.angryRepLoss + " itibar", false]
  ];
}
function openHowTo() { game.howtoBack = game.state; game.state = STATE.HOWTO; }

// Ana ekran dili: eczanenin içi (karartılmış), ceviz kartlar, pirinç yazı, Zilla Slab.
function drawHowTo() { withCardFont(drawHowToInner); }
function drawHowToInner() {
  const c = cardColors(), S = layout.stage;
  const X = f => S.x + S.w * f, Y = f => S.y + S.h * f;

  drawBackground();
  ctx.fillStyle = "rgba(14, 8, 4, 0.74)";
  ctx.fillRect(0, 0, layout.w, layout.h);

  fitTextF("NASIL OYNANIR", X(0.5), Y(0.048), S.w * 0.8, S.h * 0.036, "#f3cf7a", "center", "700", SLAB_FONT, "emboss");
  fitText(CONFIG.seasonDays + " günlük sezonlar. Her sezon başında ruhsat bedeli ödenir —",
    X(0.5), Y(0.086), S.w * 0.9, S.h * 0.019, c.creamSoft, "center", "600");
  fitText("ödeyemediğin gün kariyer biter.",
    X(0.5), Y(0.111), S.w * 0.9, S.h * 0.019, c.creamSoft, "center", "600");

  // KART YÜKSEKLİĞİ İÇERİKTEN gelir. Sabit yükseklikte üç satıra taşan gövde bir
  // sonraki kartın üstüne biniyordu (ekran görüntüsü yakaladı). Önce satırlara bölünür,
  // yükseklikler toplanır, sığmazsa punto topluca küçültülür — aralıklar bozulmaz.
  const rules = howToRules();
  const cx0 = X(0.07), cw = S.w * 0.86;
  let cg = S.h * 0.011;
  const padY = S.h * 0.016;
  const top = Y(0.145), bottom = Y(0.645);
  let fs = S.h * 0.0158, titleFs = S.h * 0.019, lineH, cards;
  for (let pass = 0; pass < 12; pass++) {
    lineH = fs * 1.42;
    cards = rules.map(([ic, title, body]) => ({
      ic, title, lines: wrapToLines(body, cw * 0.83, fs, 4)
    }));
    let tot = 0;
    for (const cd of cards) tot += padY * 2 + titleFs * 1.25 + cd.lines.length * lineH;
    tot += cg * (cards.length - 1);
    if (tot <= bottom - top) {
      // Artan boşluk kart ARALARINA eşit dağıtılır: kartlar yukarıda toplanıp altta
      // koca bir delik bırakmasın (ilk denemede öyle oluyordu).
      const slack = (bottom - top) - tot;
      if (cards.length > 1) cg += slack / (cards.length - 1);
      break;
    }
    fs *= 0.94; titleFs *= 0.94;
  }
  let cy = top;
  for (const cd of cards) {
    const ch = padY * 2 + titleFs * 1.25 + cd.lines.length * lineH;
    woodPanel(cx0, cy, cw, ch, false, Math.max(2, S.w * 0.007));
    ctx.fillStyle = "rgba(18,9,3,0.30)"; ctx.fillRect(cx0 + 3, cy + 3, cw - 6, ch - 6);   // okunurluk
    ctx.fillStyle = c.neon;
    ctx.fillRect(cx0 + S.w * 0.012, cy + ch * 0.18, 2, ch * 0.64);
    drawEmoji(cd.ic, cx0 + cw * 0.065, cy + padY + titleFs * 0.5, titleFs * 1.5, c.cream);
    const tx2 = cx0 + cw * 0.125;
    fitText(cd.title, tx2, cy + padY + titleFs * 0.5, cw * 0.84, titleFs, c.cream, "left", "800");
    let ly = cy + padY + titleFs * 1.25 + lineH * 0.5;
    for (const ln of cd.lines) { fitText(ln, tx2, ly, cw * 0.85, fs, c.creamSoft, "left", "600"); ly += lineH; }
    cy += ch + cg;
  }

  // --- puan cetveli ---
  const tally = howToTally();
  const tH = S.h * 0.028 + tally.length * S.h * 0.0265 + S.h * 0.018;
  const tY = Y(0.895) - tH;
  woodPanel(cx0, tY, cw, tH, false, Math.max(3, S.w * 0.01));
  ctx.fillStyle = "rgba(18,9,3,0.30)"; ctx.fillRect(cx0 + 4, tY + 4, cw - 8, tH - 8);
  fitTextF("PUAN CETVELİ", cx0 + cw / 2, tY + S.h * 0.018, cw * 0.6, S.h * 0.018, "#f3cf7a", "center", "700", SLAB_FONT, "emboss");
  let ty2 = tY + S.h * 0.040;
  for (let i = 0; i < tally.length; i++) {
    if (i > 0) { ctx.fillStyle = "rgba(240,207,130,0.14)"; ctx.fillRect(cx0 + cw * 0.04, ty2 - S.h * 0.0133, cw * 0.92, 1); }
    fitText(tally[i][0], cx0 + cw * 0.05, ty2, cw * 0.5, S.h * 0.0172, c.cream, "left", "600");
    fitText(tally[i][1], cx0 + cw * 0.95, ty2, cw * 0.44, S.h * 0.0172, tally[i][2] ? "#a6e6a0" : "#ff9f8f", "right", "700");
    ty2 += S.h * 0.0265;
  }

  layout.howBackBtn = { x: X(0.09), y: Y(0.908), w: S.w * 0.82, h: S.h * 0.066 };
  menuButton(layout.howBackBtn, "ANLADIM", "primary", false);
}


// ---- SEZON SONU ekranı ----
// Kart dili DAYEND'den gelir (koyu kart + başlık şeridi + emoji'li istatistik satırları +
// neon buton + soluk pill). Yeni tasarım dili İCAT EDİLMEDİ; tek özel öğe baskın SKOR
// bloğu ve sonraki sezonun bedel şeridi.
//
// Buraya YALNIZ "completed" yolundan gelinir: itibar çöküşü finishSeason tarafından
// finishCareer'a devredilir (bkz. drawCareerEnd). Bu yüzden erken bitiş varyantı YOK.
//
// ÖLÇÜLER fs BİRİMİNDE toplanır, sonra fs karta sığacak şekilde seçilir (DAYEND'de kart
// yüksekliği sabit puntodan türeyip taşarsa alt boşluktan kırpılıyordu; burada satır sayısı
// daha fazla olduğu için tersi yapılır: yığın yüksekliği önce birim olarak toplanır,
// punto ona göre küçültülür. Böylece satır aralıkları hiç bozulmaz).
function drawSeasonEnd() {
  const w = layout.w, h = layout.h, c = cardColors();
  const S = layout.stage;
  // Kart, seasonResult'ı OKUR (canlı game alanlarını değil): sezon kapandığı andaki
  // fotoğraf gösterilmeli ve aynı nesne sonraki turda leaderboard'a gidecek.
  const r = game.seasonResult || buildSeasonResult("completed");
  const season = careerSeason();
  const fee = nextSeasonFee();
  const afford = game.money >= fee;

  ctx.fillStyle = "rgba(10, 8, 16, 0.62)";
  ctx.fillRect(0, 0, w, h);

  const rows = [
    ["📅", "Oynanan gün", r.daysPlayed + " / " + r.seasonDays],
    ["👥", "Toplam servis", String(r.served)],
    ["✓", "Doğru", String(r.correct)],
    ["✗", "Yanlış", String(r.wrong)],
    ["🔎", "Yakalanan sahte", String(r.fakeCaught)],
    ["🚨", "Kaçan sahte", String(r.fakeMissed)],
    ["⭐", "Son itibar", "%" + repShown(r.reputation)]
  ];
  // Dilenci hiç gelmediyse satır çizilmez (kart yüksekliği içerikten türüyor).
  if (r.beggarSeen > 0) {
    rows.push(["🤝", "Dilenciye yardım", r.beggarGave + " / " + r.beggarSeen]);
    // Geri ödeme yardımın itibar tavanından BAĞIMSIZ karşılığı — dilenci satırı varsa
    // görünsün, oyuncu yardımın neye yaradığını kartta görebilsin.
    if (r.beggarRepaid > 0) {
      rows.push(["💵", "Dilenci geri ödemesi", "+" + formatMoney(r.beggarRepaidMoney) + " (" + r.beggarRepaid + ")"]);
    }
  }
  // Geliştirmeler satır satır değil, satıra İKİ kalem sığdırılarak yazılır (5 kalem = 3
  // satır). fitText her satırı genişliğe kısar, yani kalem adı uzasa da taşma olmaz.
  const upgList = (r.upgrades || []).map(u => u.emoji + " " + u.name + " Lv" + u.level);
  const upgLines = [];
  for (let i = 0; i < upgList.length; i += 2) upgLines.push(upgList.slice(i, i + 2).join("   ·   "));
  const showPend = r.pendingReceivables > 0;

  // --- yığın (fs birimi) ---
  const U_HEADER = 2.6, U_PADTOP = 1.0, U_SCORE = 4.2, U_GAP = 0.85,
        U_ROW = 1.85, U_UPGTITLE = 1.3, U_UPGLINE = 1.3, U_PEND = 1.6,
        U_FEE = 2.5, U_BTN = 2.2, U_PILL = 1.45, U_PADBOT = 1.0;
  const units = U_HEADER + U_PADTOP + U_SCORE + U_GAP
              + rows.length * U_ROW + U_GAP
              + U_UPGTITLE + upgLines.length * U_UPGLINE
              + (showPend ? U_GAP + U_PEND : 0)
              + U_GAP + U_FEE
              + U_GAP + U_BTN + U_GAP + U_PILL + U_PADBOT;
  const fs = Math.min(S.h * 0.026, (S.h * 0.94) / units);   // kart ekranın %94'ünü geçmez
  const cardH = units * fs;
  const cardW = S.w * 0.86;
  const cardX = S.x + (S.w - cardW) / 2;
  const cardY = S.y + (S.h - cardH) / 2;
  const cr = cardW * 0.08;

  // ceviz kart + YEŞİL lake başlık (sezon başarıyla bitti) — sezon numarası burada görünür
  const headerH = U_HEADER * fs;
  cabinetCard(cardX, cardY, cardW, cardH, headerH, "Sezon " + season + " Tamamlandı", "green");

  // --- BASKIN ÖĞE: SEZON SKORU (= sezon sonu kasa) ---
  let y = cardY + headerH + U_PADTOP * fs;
  text("SEZON SKORU", cardX + cardW / 2, y + fs * 0.75, fs * 0.92, c.creamSoft, "center", "700");
  ctx.save();
  ctx.shadowColor = c.neonGlow;
  ctx.shadowBlur = 18;
  fitText(formatMoney(r.score), cardX + cardW / 2, y + fs * 2.85, cardW * 0.80, fs * 2.35,
    c.neon, "center", "800");
  ctx.restore();
  y += U_SCORE * fs + U_GAP * fs;

  y = drawStatRows(rows, cardX, cardW, y, fs, U_ROW);
  y += U_GAP * fs;
  y = drawUpgradeBlock(upgLines, cardX, cardW, y, fs, U_UPGTITLE, U_UPGLINE);

  // --- Tahsil edilmemiş SGK alacağı: AYRI satır, SKORA DAHİL DEĞİL ---
  if (showPend) {
    y += U_GAP * fs;
    const pH = U_PEND * fs;
    fillRoundRect(cardX + cardW * 0.08, y, cardW * 0.84, pH, pH * 0.5, "rgba(245,170,70,0.12)");
    strokeRoundRect(cardX + cardW * 0.08, y, cardW * 0.84, pH, pH * 0.5, "rgba(245,170,70,0.55)", 1.5);
    fitText("🧾 Tahsil edilmemiş SGK: " + formatMoney(r.pendingReceivables) + " · skora dahil değil",
      cardX + cardW / 2, y + pH / 2, cardW * 0.78, fs * 0.86, c.creamSoft, "center", "800");
    y += pH;
  }

  // --- SONRAKİ SEZONUN BEDELİ — ne için ödendiği açıkça yazılı ---
  // Karşılanmıyorsa şerit kırmızıya döner ve kasadaki tutar da yazılır: oyuncu butonun
  // neden pasif olduğunu tahmin etmek zorunda kalmasın.
  y += U_GAP * fs;
  {
    const feH = U_FEE * fs;
    const bg = afford ? "rgba(150, 110, 40, 0.28)" : "rgba(232,115,107,0.18)";
    const bd = afford ? "rgba(245, 190, 90, 0.85)" : "rgba(232,115,107,0.85)";
    fillRoundRect(cardX + cardW * 0.08, y, cardW * 0.84, feH, feH * 0.28, bg);
    strokeRoundRect(cardX + cardW * 0.08, y, cardW * 0.84, feH, feH * 0.28, bd, 1.5);
    fitText("🧾 Sezon " + (season + 1) + " ruhsat yenileme bedeli",
      cardX + cardW / 2, y + feH * 0.32, cardW * 0.78, fs * 0.88,
      afford ? "#ffe0a8" : "#ffd0cc", "center", "800");
    fitText(afford ? formatMoney(fee)
                   : formatMoney(fee) + " · kasada " + formatMoney(game.money),
      cardX + cardW / 2, y + feH * 0.72, cardW * 0.78, fs * 0.95,
      afford ? c.neon : c.bad, "center", "800");
    y += feH;
  }

  // --- YENİ SEZON (bedel karşılanmıyorsa PASİF) ---
  y += U_GAP * fs;
  const btnH = U_BTN * fs;
  const bW = cardW * 0.70;
  const bX = cardX + (cardW - bW) / 2;
  layout.seasonNewBtn = { x: bX, y: y, w: bW, h: btnH, enabled: afford };
  cabinetButton(layout.seasonNewBtn, afford ? "YENİ SEZON  (−" + formatMoney(fee) + ")" : "YENİ SEZON  (bedel yetmiyor)",
    "red", { glint: afford, disabled: !afford, size: 0.36 });
  y += btnH + U_GAP * fs;

  // --- Alt pill satırı. Bedel karşılanıyorsa tek pill (ANA MENÜ); karşılanmıyorsa
  //     iki pill yan yana: KARİYERİ BİTİR + ANA MENÜ. ---
  const pillH = U_PILL * fs;
  if (afford) {
    const mW = cardW * 0.52;
    const mX = cardX + (cardW - mW) / 2;
    layout.seasonQuitBtn = null;
    layout.seasonMenuBtn = { x: mX, y: y, w: mW, h: pillH };
    drawPill(layout.seasonMenuBtn, "ANA MENÜ", "rgba(245,170,70,0.45)", c.creamSoft, pillH);
  } else {
    const gap2 = cardW * 0.03;
    const pW = (cardW * 0.84 - gap2) / 2;
    const pX = cardX + cardW * 0.08;
    layout.seasonQuitBtn = { x: pX, y: y, w: pW, h: pillH };
    layout.seasonMenuBtn = { x: pX + pW + gap2, y: y, w: pW, h: pillH };
    drawPill(layout.seasonQuitBtn, "KARİYERİ BİTİR", "rgba(232,115,107,0.75)", c.bad, pillH);
    drawPill(layout.seasonMenuBtn, "ANA MENÜ", "rgba(245,170,70,0.45)", c.creamSoft, pillH);
  }
}

// ---- KARİYER SONU ekranı ----
// Aynı kart dili; kırmızımsı kenarlık ve başlık şeridi (eski GAMEOVER'ın rengi) çünkü bu
// gerçekten bir bitiş. İki sebep ayrı şeritte açıklanır: itibar çöküşü ya da ödenemeyen
// ruhsat bedeli. SKOR = kariyer boyunca ulaşılan EN YÜKSEK kasa (peak).
function drawCareerEnd() {
  const w = layout.w, h = layout.h, c = cardColors();
  const S = layout.stage;
  const r = game.careerResult || buildCareerResult("fee");
  const byFee = r.reason === "fee";

  ctx.fillStyle = "rgba(10, 8, 16, 0.66)";
  ctx.fillRect(0, 0, w, h);

  const rows = [
    ["🏆", "Tamamlanan sezon", String(r.seasonsCompleted)],
    ["📅", "Toplam oynanan gün", String(r.daysPlayed)],
    ["👥", "Toplam servis", String(r.served)],
    ["✓", "Doğru", String(r.correct)],
    ["✗", "Yanlış", String(r.wrong)],
    ["🔎", "Yakalanan sahte", String(r.fakeCaught)],
    ["🚨", "Kaçan sahte", String(r.fakeMissed)],
    ["🧾", "Ödenen ruhsat bedeli", formatMoney(r.totalFeePaid)]
  ];
  if (r.beggarRepaid > 0) {
    rows.push(["💵", "Dilenci geri ödemesi", "+" + formatMoney(r.beggarRepaidMoney) + " (" + r.beggarRepaid + ")"]);
  }
  if (r.bestSeason) {
    rows.push(["⭐", "En iyi sezon", "S" + r.bestSeason.season + " · " + formatMoney(r.bestSeason.earned)]);
  }
  const upgList = (r.upgrades || []).map(u => u.emoji + " " + u.name + " Lv" + u.level);
  const upgLines = [];
  for (let i = 0; i < upgList.length; i += 2) upgLines.push(upgList.slice(i, i + 2).join("   ·   "));

  const U_HEADER = 2.6, U_PADTOP = 1.0, U_SCORE = 4.2, U_GAP = 0.85,
        U_ROW = 1.85, U_UPGTITLE = 1.3, U_UPGLINE = 1.3, U_WHY = 2.5,
        U_BTN = 2.2, U_PILL = 1.45, U_PADBOT = 1.0;
  const units = U_HEADER + U_PADTOP + U_SCORE + U_GAP
              + rows.length * U_ROW + U_GAP
              + U_UPGTITLE + upgLines.length * U_UPGLINE
              + U_GAP + U_WHY
              + U_GAP + U_BTN + U_GAP + U_PILL + U_PADBOT;
  const fs = Math.min(S.h * 0.026, (S.h * 0.94) / units);
  const cardH = units * fs;
  const cardW = S.w * 0.86;
  const cardX = S.x + (S.w - cardW) / 2;
  const cardY = S.y + (S.h - cardH) / 2;
  const crr = cardW * 0.08;

  // ceviz kart + KIRMIZI lake başlık
  const headerH = U_HEADER * fs;
  cabinetCard(cardX, cardY, cardW, cardH, headerH, "Kariyer Bitti", "red");

  // --- BASKIN ÖĞE: KARİYER SKORU = peak kasa ---
  let y = cardY + headerH + U_PADTOP * fs;
  text("KARİYER SKORU", cardX + cardW / 2, y + fs * 0.75, fs * 0.92, c.creamSoft, "center", "700");
  ctx.save();
  ctx.shadowColor = c.neonGlow;
  ctx.shadowBlur = 18;
  // skor ile alt yazı eskiden üst üste biniyordu: skor biraz küçüldü, alt yazı aşağı indi
  fitText(formatMoney(r.score), cardX + cardW / 2, y + fs * 2.55, cardW * 0.80, fs * 2.1,
    c.neon, "center", "800");
  ctx.restore();
  fitText("kariyer boyunca ulaşılan en yüksek kasa", cardX + cardW / 2, y + fs * 3.95,
    cardW * 0.80, fs * 0.78, c.creamSoft, "center", "600");
  y += U_SCORE * fs + U_GAP * fs;

  y = drawStatRows(rows, cardX, cardW, y, fs, U_ROW);
  y += U_GAP * fs;
  y = drawUpgradeBlock(upgLines, cardX, cardW, y, fs, U_UPGTITLE, U_UPGLINE);

  // --- NASIL BİTTİ ---
  y += U_GAP * fs;
  {
    const wH = U_WHY * fs;
    fillRoundRect(cardX + cardW * 0.08, y, cardW * 0.84, wH, wH * 0.28, "rgba(232,115,107,0.18)");
    strokeRoundRect(cardX + cardW * 0.08, y, cardW * 0.84, wH, wH * 0.28, "rgba(232,115,107,0.85)", 1.5);
    fitText(byFee ? "🔒 Ruhsat yenileme bedeli ödenemedi" : "💔 İtibarın tükendi",
      cardX + cardW / 2, y + wH * 0.32, cardW * 0.78, fs * 0.92, "#ffd0cc", "center", "800");
    fitText(byFee
        ? "Sezon " + (r.lastSeason + 1) + " için " + formatMoney(r.unpaidFee) + " gerekiyordu · kasada " + formatMoney(r.finalMoney)
        : "Sezon " + r.lastSeason + ", gün " + (r.seasons.length ? r.seasons[r.seasons.length - 1].daysPlayed : 1),
      cardX + cardW / 2, y + wH * 0.72, cardW * 0.78, fs * 0.86, c.bad, "center", "800");
    y += wH;
  }

  // --- YENİ KARİYER (neon, nabız) ---
  y += U_GAP * fs;
  const btnH = U_BTN * fs;
  const bW = cardW * 0.70;
  const bX = cardX + (cardW - bW) / 2;
  layout.careerNewBtn = { x: bX, y: y, w: bW, h: btnH };
  cabinetButton(layout.careerNewBtn, "YENİ KARİYER", "red", { glint: true });
  y += btnH + U_GAP * fs;

  const pillH = U_PILL * fs;
  const mW = cardW * 0.52;
  const mX = cardX + (cardW - mW) / 2;
  layout.careerMenuBtn = { x: mX, y: y, w: mW, h: pillH };
  drawPill(layout.careerMenuBtn, "ANA MENÜ", "rgba(245,170,70,0.45)", c.creamSoft, pillH);
}

// --- İki bitiş kartının PAYLAŞTIĞI parçalar (kart dili tek yerden gelsin) ---
// DAYEND'in row() kalıbı: emoji kendi kare kutusunda ortalanır, etiket solda, değer sağda
// ve yalnız DEĞERİN puntosu kalan boşluğa kısılır (uzun değer etiketin üstüne binmesin).
function drawStatRows(rows, cardX, cardW, y, fs, uRow) {
  const c = cardColors();
  const lx = cardX + cardW * 0.11;
  const rx = cardX + cardW * 0.89;
  const rowStep = uRow * fs;
  let ly = y + rowStep * 0.5;
  for (const row of rows) {
    const icon = row[0], label = row[1], val = row[2];
    drawEmoji(icon, lx + fs * 0.5, ly, fs, c.cream);
    const labelX = lx + fs * 1.35;
    text(label, labelX, ly, fs, c.cream, "left", "600");
    ctx.font = uiFont("600", fs);
    const avail = Math.max(fs * 2, rx - (labelX + ctx.measureText(label).width + fs * 0.5));
    let vs = fs;
    ctx.font = cardNumFont("800", vs);
    while (vs > fs * 0.55 && ctx.measureText(val).width > avail) {
      vs -= 0.5;
      ctx.font = cardNumFont("800", vs);
    }
    ctx.fillStyle = c.neon; ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.font = cardNumFont("800", vs); ctx.fillText(val, rx, ly);
    ly += rowStep;
  }
  return y + rows.length * rowStep;
}
function drawUpgradeBlock(upgLines, cardX, cardW, y, fs, uTitle, uLine) {
  const c = cardColors();
  const lx = cardX + cardW * 0.11;
  drawEmoji("🔧", lx + fs * 0.5, y + uTitle * fs * 0.5, fs * 0.95, c.cream);
  text("Geliştirmeler", lx + fs * 1.35, y + uTitle * fs * 0.5, fs * 0.95, c.cream, "left", "700");
  y += uTitle * fs;
  for (const line of upgLines) {
    fitText(line, cardX + cardW / 2, y + uLine * fs * 0.5, cardW * 0.84, fs * 0.90,
      c.creamSoft, "center", "700");
    y += uLine * fs;
  }
  return y;
}
function drawPill(b, label, borderCol, textCol, pillH) {
  // ikincil butonlar: ceviz panel (ana ekran dili); KARİYERİ BİTİR gibi ret anlamlılar kırmızı lake
  cabinetButton(b, label, textCol === CONFIG.colors.bad ? "red" : "wood", { size: 0.46 });
}

// =====================================================================
//  DOKUNMA / TIKLAMA GİRİŞİ
// =====================================================================
function pointInRect(px, py, r) {
  return px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
}

// sekme şeridine dokunulduğunda o kategoriyi seç
function selectTabAt(px, py) {
  const ta = layout.tabsArea;
  if (!ta || !layout.tabs) return;
  const off = layout.tabsOffset || 0;
  for (const t of layout.tabs) {
    const sx = ta.x + off + t.x - (layout.tabScroll || 0);
    if (px >= sx && px <= sx + t.w && py >= ta.y && py <= ta.y + ta.h) {
      if (game.activeGroup !== t.group.id) {
        game.activeGroup = t.group.id;
        layout.shelfScroll = 0;      // yeni grup baştan görünsün
        buildShelf();
        ensureActiveTabVisible();
      }
      return;
    }
  }
}

function handleTap(px, py) {
  noteState();
  if (performance.now() - _stateWatch.at < TAP_GUARD_MS) return;   // ekran az önce değişti
  // defter animasyon sırasında tüm dokunuşları yut
  if (game.bookState === "opening" || game.bookState === "closing") return;

  // defter açıkken modal: kitabın İÇİ (✕ hariç) açık tutar; ✕ veya dışarı = kapat
  if (game.bookState === "open") {
    const insideBook = layout.bookBox && pointInRect(px, py, layout.bookBox);
    const onClose = layout.bookCloseBtn && pointInRect(px, py, layout.bookCloseBtn);
    if (!insideBook || onClose) { sfx("page"); game.bookState = "closing"; }   // ters animasyon
    return;
  }

  // depo paneli açıkken modal: içi işle, ✕/dışarı kapat, gerisini yut
  if (game.nightIntro !== null) { sfx("tap"); game.nightIntro = null; return; }   // geçiş kartı: tek dokunuş
  if (game.depotOpen) { handlePcTap(px, py); return; }

  if (game.state === STATE.NAMING) {
    if (layout.menuSoundBtn && pointInRect(px, py, layout.menuSoundBtn)) { toggleSound(); return; }
    if (layout.kbOk && pointInRect(px, py, layout.kbOk)) { sfx("tap"); confirmName(); return; }
    if (layout.kbDel && pointInRect(px, py, layout.kbDel)) { sfx("key"); game.nameInput = game.nameInput.slice(0, -1); return; }
    if (layout.kbSpace && pointInRect(px, py, layout.kbSpace)) {
      sfx("key");
      // Baştaki boşluk ve üst üste boşluk yok: ad tabelada tek satır duracak.
      if (game.nameInput.length && game.nameInput.length < NAME_MAX && game.nameInput.slice(-1) !== " ")
        game.nameInput += " ";
      return;
    }
    if (layout.kbKeys) {
      for (const k of layout.kbKeys) {
        if (pointInRect(px, py, k)) {
          if (game.nameInput.length < NAME_MAX) { sfx("key"); game.nameInput += k.ch; } else sfx("deny");
          return;
        }
      }
    }
    return;   // başka dokunuş yutulur
  }
  if (game.state === STATE.HOWTO) {
    if (layout.howBackBtn && pointInRect(px, py, layout.howBackBtn)) sfx("tap");
    if (layout.howBackBtn && pointInRect(px, py, layout.howBackBtn))
      game.state = (game.howtoBack === STATE.PLAYING) ? STATE.MENU : (game.howtoBack || STATE.MENU);
    return;
  }
  if (game.state === STATE.ABOUT) {
    if (layout.aboutBackBtn && pointInRect(px, py, layout.aboutBackBtn)) { sfx("back"); game.state = STATE.MENU; }
    return;
  }
  if (game.state === STATE.MENU) {
    if (layout.menuSoundBtn && pointInRect(px, py, layout.menuSoundBtn)) { toggleSound(); return; }
    if (layout.menuAboutBtn && pointInRect(px, py, layout.menuAboutBtn)) { sfx("tap"); game.state = STATE.ABOUT; return; }
    if (layout.menuBoardBtn && pointInRect(px, py, layout.menuBoardBtn)) { sfx("tap"); GC.tap(); return; }
    if (layout.menuStartBtn && pointInRect(px, py, layout.menuStartBtn)) {
      // Kayıt artık kalıcı: süren kariyer varken tek dokunuş onu silmesin → ikinci dokunuş onaylar
      if (canResume() && !(game.newCareerAskUntil > game.clock)) {
        sfx("deny"); game.newCareerAskUntil = game.clock + 3; game.newCareerAskAt = performance.now();
      } else if (canResume() && performance.now() - (game.newCareerAskAt || 0) < 400) {
        /* çift dokunuşun ikincisi onay sayılmaz — süren kariyer yanlışlıkla silinmesin */
      } else { game.newCareerAskUntil = 0; sfx("door"); startNewCareer(); }
    }
    else if (canResume() && layout.menuResumeBtn && pointInRect(px, py, layout.menuResumeBtn)) { sfx("tap"); resumeRun(); }  // reset YOK
    else if (layout.menuHowBtn && pointInRect(px, py, layout.menuHowBtn)) { sfx("tap"); openHowTo(); }
    else if (layout.menuNameBtn && pointInRect(px, py, layout.menuNameBtn)) { sfx("tap"); openNaming(); }
    else if (layout.menuResumeBtn === null && layout.menuResumeRect && pointInRect(px, py, layout.menuResumeRect)) sfx("deny");
    return;   // başka dokunuş yutulur
  }
  if (game.state === STATE.SEASONEND) {
    if (layout.seasonNewBtn && pointInRect(px, py, layout.seasonNewBtn)) {
      if (layout.seasonNewBtn.enabled) { sfx("door"); tryStartNextSeason(); } else sfx("deny");   // pasifse dokunuş yutulur
    } else if (layout.seasonQuitBtn && pointInRect(px, py, layout.seasonQuitBtn)) {
      sfx("back"); finishCareer("fee");                        // bedel ödenemiyor: kariyeri kapat
    } else if (layout.seasonMenuBtn && pointInRect(px, py, layout.seasonMenuBtn)) {
      sfx("back"); game.state = STATE.MENU;
    }
    return;   // başka dokunuş yutulur
  }
  if (game.state === STATE.CAREEREND) {
    if (layout.careerNewBtn && pointInRect(px, py, layout.careerNewBtn)) { sfx("door"); startNewCareer(); }
    else if (layout.careerMenuBtn && pointInRect(px, py, layout.careerMenuBtn)) { sfx("back"); game.state = STATE.MENU; }
    return;   // başka dokunuş yutulur
  }
  if (game.state === STATE.DAYEND) {
    if (layout.depotFromDayEndBtn && pointInRect(px, py, layout.depotFromDayEndBtn)) { sfx("pc"); openDepot(); return; }
    if (pointInRect(px, py, layout.nextDayBtn)) { sfx("tap"); startNextDay(); }
    return;
  }
  if (game.state !== STATE.PLAYING) return;

  // HUD ev butonu → menüye dön (oyun verisi SİLİNMEZ; menüden DEVAM ET ile geri gelinir)
  if (layout.homeBtn && pointInRect(px, py, layout.homeBtn)) {
    if (game.bagAnim) return;                          // poşet havada: karar uygulanınca çıkılabilir
    sfx("back"); game.state = STATE.MENU; return;
  }

  // tezgahtaki PC'ye dokun → depo sipariş ekranını aç
  if (layout.pcBtn && pointInRect(px, py, layout.pcBtn)) { sfx("pc"); openPc(); return; }

  // tezgahtaki radyo → aç / kapat
  if (layout.radioBtn && pointInRect(px, py, layout.radioBtn)) { sfx("knob"); Radio.toggle(); return; }

  // tezgahtaki kapalı deftere dokun → açılma animasyonunu başlat
  if (layout.bookClosedRect && pointInRect(px, py, layout.bookClosedRect)) {
    sfx("page");
    game.bookState = "opening";
    return;
  }

  // sekmeler feedback sırasında da değiştirilebilir
  if (layout.tabsArea && pointInRect(px, py, layout.tabsArea)) { sfx("tab"); selectTabAt(px, py); return; }

  if (game.feedback) return;

  // borcunu ödemeye gelen dilenci: tek buton, tek dokunuş
  if (activeBeggarPay()) {
    if (layout.beggarPayBtn && pointInRect(px, py, layout.beggarPayBtn)) { sfx("coin"); beggarPayCollect(); }
    return;   // borçlu tezgahtayken raf/sepet dokunuşları yutulur
  }

  // dilenci karar fazı: üç seçenek. Reçete fazından ÖNCE bakılır (ikisi aynı şeridi
  // paylaşıyor ama asla aynı anda görünmez; sıra yine de belirsizlik bırakmasın).
  if (activeBeggar() && layout.beggarBtns) {
    for (const b of layout.beggarBtns) {
      if (!pointInRect(px, py, b)) continue;
      if (!b.enabled) { sfx("deny"); return; }     // pasif seçenek: dokunuş yutulur
      if (b.key === "med") { sfx("box"); beggarGiveMedicine(); }
      else if (b.key === "money") { sfx("coin"); beggarGiveMoney(); }
      else { sfx("back"); beggarRefuse(false); }
      return;
    }
    return;   // dilenci tezgahtayken raf/defter/PC dışı dokunuşlar yutulur
  }

  // reçete karar fazı: önce ONAYLA/REDDET
  if (activeNeedsDecision()) {
    if (pointInRect(px, py, layout.approveBtn)) { sfx("stamp"); approvePrescription(); }
    else if (pointInRect(px, py, layout.rejectBtn)) { sfx("paper"); rejectPrescription(); }
    return;
  }

  // Tezgahta tepsi kalmadı: geri alma SATIŞ ekranındaki − butonundan yapılır.
  // raf kartları: içerik koordinatında saklanır, scroll düşülür; gridArea dışı (kırpılan kısım) tıklanamaz
  const shelfScroll = layout.shelfScroll || 0;
  for (const btn of layout.shelfButtons) {
    const r2 = { x: btn.x, y: btn.y - shelfScroll, w: btn.w, h: btn.h };
    if (pointInRect(px, py, r2) && layout.gridArea && pointInRect(px, py, layout.gridArea)) {
      // eklendiyse karttan PC'ye uçuş: dokunuşun kaydedildiği görünür olsun
      if (tapMedicine(btn.id)) { sfx("box"); startFlyToPc(btn.id, r2); } else sfx("deny");
      return;
    }
  }
}

function getEventPos(e) {
  const rect = canvas.getBoundingClientRect();
  let clientX, clientY;
  if (e.changedTouches && e.changedTouches.length) {
    clientX = e.changedTouches[0].clientX;
    clientY = e.changedTouches[0].clientY;
  } else {
    clientX = e.clientX;
    clientY = e.clientY;
  }
  return { x: clientX - rect.left, y: clientY - rect.top };
}

// Karttan PC'ye uçuş animasyonunu kuyruğa ekler (salt görsel geri bildirim).
function startFlyToPc(id, cardRect) {
  const pc = layout.pcBtn;
  if (!pc) return;
  game.flyAnims.push({
    id: id, t: 0,
    x0: cardRect.x + cardRect.w / 2, y0: cardRect.y + cardRect.h / 2,
    x1: pc.x + pc.w / 2, y1: pc.y + pc.h / 2,
    size: Math.min(cardRect.w, cardRect.h) * 0.62
  });
}

// işaretçi: tap + sekme şeridinde YATAY, ilaç grid'inde DİKEY kaydırma (drag)
const pointer = { down: false, startX: 0, startY: 0, dragging: false, inTabs: false, inGrid: false, scrollStart: 0, scrollStartY: 0 };

function onDown(x, y) {
  pointer.down = true;
  pointer.startX = x;
  pointer.startY = y;
  pointer.dragging = false;
  const interactive = game.bookState === "closed" && !game.depotOpen && game.state === STATE.PLAYING;
  pointer.inTabs = interactive && layout.tabsArea && pointInRect(x, y, layout.tabsArea);
  pointer.inGrid = interactive && !pointer.inTabs && layout.gridArea && pointInRect(x, y, layout.gridArea);
  pointer.scrollStart = layout.tabScroll || 0;
  pointer.scrollStartY = layout.shelfScroll || 0;
}
function onMove(x, y) {
  if (!pointer.down) return;
  if (pointer.inTabs) {
    const dx = x - pointer.startX;
    if (Math.abs(dx) > 6) pointer.dragging = true;
    if (pointer.dragging) {
      const ta = layout.tabsArea;
      const maxS = Math.max(0, (layout.tabsTotal || 0) - ta.w);
      layout.tabScroll = clamp(pointer.scrollStart - dx, 0, maxS);
    }
  } else if (pointer.inGrid) {
    const dy = y - pointer.startY;
    if (Math.abs(dy) > 6) pointer.dragging = true;
    if (pointer.dragging) {
      layout.shelfScroll = clamp(pointer.scrollStartY - dy, 0, layout.shelfMaxScroll || 0);
    }
  }
}
function onUp(x, y) {
  if (!pointer.down) return;
  pointer.down = false;
  if (!pointer.dragging) { handleTap(x, y); noteState(); }  // kaydırma değilse tap
}

// Ekran (state) değişiminden hemen sonraki dokunuşlar yutulur: çift dokunuşun ikincisi yeni
// ekranda bir butona basmasın (ör. KARİYERİ BİTİR → kariyer kartında YENİ KARİYER).
const _stateWatch = { s: null, at: 0 };
const TAP_GUARD_MS = 250;
function noteState() {
  if (game.state !== _stateWatch.s) { _stateWatch.s = game.state; _stateWatch.at = performance.now(); }
}

// Çoklu dokunuş: sürükleme/kaydırma YALNIZ ilk parmağa bağlıdır; o basılıyken inen diğer
// parmaklar kendi başına kısa dokunuş sayılır. Eskiden tek `pointer` vardı: iki başparmakla
// hızlı ad yazarken ikinci harf kayboluyor, sürüklerken ikinci parmak kaydırmayı zıplatıyordu.
const extraTouches = {};
function touchXY(t) {
  const r = canvas.getBoundingClientRect();
  return { x: t.clientX - r.left, y: t.clientY - r.top };
}
canvas.addEventListener("touchstart", (e) => {
  e.preventDefault();
  for (const t of Array.from(e.changedTouches)) {
    const p = touchXY(t);
    if (!pointer.down) { pointer.id = t.identifier; onDown(p.x, p.y); }
    else extraTouches[t.identifier] = p;
  }
}, { passive: false });
canvas.addEventListener("touchmove", (e) => {
  e.preventDefault();
  for (const t of Array.from(e.changedTouches)) {
    if (pointer.down && t.identifier === pointer.id) { const p = touchXY(t); onMove(p.x, p.y); }
  }
}, { passive: false });
canvas.addEventListener("touchend", (e) => {
  e.preventDefault();
  for (const t of Array.from(e.changedTouches)) {
    const p = touchXY(t);
    if (pointer.down && t.identifier === pointer.id) { onUp(p.x, p.y); continue; }
    const st = extraTouches[t.identifier];
    if (!st) continue;
    delete extraTouches[t.identifier];
    if (Math.hypot(p.x - st.x, p.y - st.y) < 12) { handleTap(p.x, p.y); noteState(); }
  }
}, { passive: false });
canvas.addEventListener("touchcancel", (e) => {
  for (const t of Array.from(e.changedTouches)) {
    if (t.identifier === pointer.id) pointer.down = false;
    delete extraTouches[t.identifier];
  }
}, { passive: false });

canvas.addEventListener("mousedown", (e) => { const p = getEventPos(e); onDown(p.x, p.y); });
canvas.addEventListener("mousemove", (e) => { if (pointer.down) { const p = getEventPos(e); onMove(p.x, p.y); } });
canvas.addEventListener("mouseup", (e) => { const p = getEventPos(e); onUp(p.x, p.y); });

//  ANA DÖNGÜ (60 FPS)
// =====================================================================
let lastTime = performance.now();
let _loopErrors = 0;
function loop(now) {
  requestAnimationFrame(loop);      // ÖNCE: bu karede istisna olsa da döngü sürer (eskiden oyun donardı)
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;
  noteState();
  try {
    update(dt);
    render();
  } catch (err) {
    if (_loopErrors++ < 5) console.error("[döngü] kare atlandı:", err);
    canvas.width = canvas.width;    // yarım kalan save/clip/alfa durumunu sıfırla (render her kare baştan kurar)
  }
}

// =====================================================================
//  ANA EKRAN YERLEŞİM DENETİMİ
// =====================================================================
// SATIŞ ve geliştirme ekranlarının sığması yalnız dışarıdan ölçülebiliyordu (DURUM.md §16).
// Menü ailesi için o hata tekrarlanmasın: dokunulabilir her dikdörtgen sahnenin içinde mi,
// üst üste biniyor mu, dokunma hedefi yeterli mi — boot'ta denetlenir.
// Çizim fonksiyonları burada BİR KEZ çağrılır (rect'leri onlar kuruyor); ilk kare zaten
// hemen üstüne yazılacağı için görsel bir yan etkisi yoktur.
// Radyo yerleşimi: ev çubuğuna taşmıyor mu, 44 pt dokunma yüksekliği var mı, butonlarla çakışıyor mu.
function verifyRadioLayout() {
  const r = radioRect(), S = layout.stage;
  if (!r || !S) return;
  const warn = [], hit = r.hit;
  if (r.y + r.h > layout.h - (window.__safeRawBottom || 0) + 0.5) warn.push("radyo ev çubuğu bölgesine taşıyor");
  if (r.x < S.x || r.x + r.w > S.x + S.w) warn.push("radyo sahne genişliğinin dışında");
  if (hit.h < 44 - 0.5) warn.push("radyo dokunma yüksekliği " + hit.h.toFixed(1) + " pt (< 44)");
  for (const [tag, b] of [["REDDET", layout.rejectBtn], ["ONAYLA", layout.approveBtn]]) {
    if (b && r.y < b.y + b.h) warn.push("radyo " + tag + " butonuyla çakışıyor");
  }
  if (warn.length) console.warn("[radyo yerleşimi] " + warn.join(" · "));
}

function verifyMenuLayout() {
  if (!layout.stage || !layout.stage.w) return;
  const warn = [];
  const S = layout.stage;
  // Apple asgarisi 44 pt. KLAVYEDE yalnız YÜKSEKLİK denetlenir: 12 harflik sıra 390 pt'ye
  // ancak ~28 pt'lik tuşlarla sığar ve telefon klavyelerinin tamamı böyledir — genişliği
  // zorlamak Türkçe Q düzenini bozardı, oysa asıl ıskalama ekseni dikeydir.
  const TAP = 44, EPS = 0.5;
  const inside = (r, tag, heightOnly) => {
    if (!r) { warn.push(tag + ": rect yok"); return; }
    if (r.x < S.x - 1 || r.x + r.w > S.x + S.w + 1 || r.y < S.y - 1 || r.y + r.h > S.y + S.h + 1)
      warn.push(tag + ": sahnenin dışına taşıyor");
    if (r.h < TAP - EPS) warn.push(tag + ": dokunma yüksekliği " + r.h.toFixed(1) + " pt (< " + TAP + ")");
    if (!heightOnly && r.w < TAP - EPS) warn.push(tag + ": dokunma genişliği " + r.w.toFixed(1) + " pt (< " + TAP + ")");
  };
  const prev = { state: game.state, name: game.pharmacyName, input: game.nameInput, run: game.hasRun };

  try {
    // --- ANA EKRAN: en uzun adla ---
    game.pharmacyName = "ŞĞÜİÖÇŞĞÜİÖÇŞĞ".slice(0, NAME_MAX);
    game.hasRun = true;
    game.state = STATE.MENU;
    drawMenu();
    const btns = [["YENİ KARİYER", layout.menuStartBtn], ["DEVAM ET", layout.menuResumeBtn],
                  ["NASIL OYNANIR", layout.menuHowBtn], ["ADI DEĞİŞTİR", layout.menuNameBtn]];
    for (const [tag, r] of btns) inside(r, "menü/" + tag);
    inside(layout.menuSoundBtn, "menü/SES levhası");
    if (layout.menuSoundBtn) {
      const sb = layout.menuSoundBtn, tb = S.y + S.h * (menuST().tabela || 0.226);
      if (sb.y + sb.h > tb) warn.push("SES levhası tabelaya biniyor");
    }
    for (let i = 1; i < btns.length; i++) {
      const a = btns[i - 1][1], b = btns[i][1];
      if (a && b && b.y < a.y + a.h) warn.push("menü butonları çakışıyor: " + btns[i - 1][0] + " ↔ " + btns[i][0]);
    }

    // Tabeladaki ad KUTUYA SIĞMALI: punto küçültme döngüsü gerçekten devreye giriyor mu
    {
      const M = menuST(), tw = S.w * M.tabelaW, th = S.h * M.tabelaH;
      let ns = th * 0.165, sp = ns * 0.24, wdt = 0, guard = 0;
      const measure = () => {
        ctx.font = "600 " + ns + "px " + RX_FONT;
        let t = 0; for (const ch of Array.from(game.pharmacyName)) t += ctx.measureText(ch).width + sp;
        return t - sp;
      };
      while (ns > 6 && (wdt = measure()) > tw * 0.86 && guard++ < 200) { ns -= 0.5; sp = ns * 0.24; }
      if (wdt > tw * 0.87) warn.push(NAME_MAX + " harflik ad tabelaya sığmıyor (" + Math.round(wdt) + " > " + Math.round(tw * 0.86) + ")");
    }

    // --- AD GİRİŞİ: klavye ---
    game.nameInput = "DENEME";
    game.state = STATE.NAMING;
    drawNaming();
    if (!layout.kbKeys || layout.kbKeys.length !== 32)
      warn.push("klavye tuş sayısı beklenenden farklı: " + (layout.kbKeys ? layout.kbKeys.length : 0) + " (12+11+9=32)");
    let lo = Infinity, hi = -Infinity;
    for (const k of (layout.kbKeys || [])) {
      if (k.x < S.x - 1 || k.x + k.w > S.x + S.w + 1) warn.push("klavye tuşu '" + k.ch + "' sahne dışında");
      if (k.h < TAP - EPS) warn.push("klavye tuşu '" + k.ch + "' dokunma yüksekliği " + k.h.toFixed(1) + " pt (< " + TAP + ")");
      lo = Math.min(lo, k.y); hi = Math.max(hi, k.y + k.h);
    }
    for (const [tag, r] of [["⌫", layout.kbDel], ["BOŞLUK", layout.kbSpace], ["TAMAM", layout.kbOk]]) inside(r, "klavye/" + tag, true);
    if (layout.kbOk && hi > layout.kbOk.y + 1.5) warn.push("harf sırası aksiyon sırasının üstüne biniyor");
    if (layout.kbOk && layout.kbOk.y + layout.kbOk.h > S.y + S.h) warn.push("klavye sahnenin altından taşıyor");
    // Türkçe alfabenin tamamı klavyede mi
    for (const ch of "ÇĞİÖŞÜ") if (!(layout.kbKeys || []).some(k => k.ch === ch)) warn.push("klavyede Türkçe harf eksik: " + ch);

    // --- NASIL OYNANIR ---
    game.state = STATE.HOWTO;
    drawHowTo();
    inside(layout.howBackBtn, "nasıl-oynanır/ANLADIM");
  } catch (e) {
    warn.push("yerleşim denetimi hata verdi: " + e.message);
  } finally {
    game.state = prev.state; game.pharmacyName = prev.name;
    game.nameInput = prev.input; game.hasRun = prev.run;
  }

  for (const w of warn) console.warn("[yerleşim] " + w);
  return warn.length === 0;
}

// hedefi tutturmak için gereken en az DOĞRU işlem sayısı (N üzerinden).
// Geçerli hastalarda: k×ortCiro − (V−k)×ortCost ≥ hedef  →  k ≥ (hedef + C) / missCost
// Sahte reçeteler zaten reddedilmek zorunda (0₺ katkı) — onlar da doğru işlem sayılır.
function neededCorrectFor(day) {
  const sch = getDaySchedule(day);
  if (sch.missCost <= 0) return sch.N;
  const k = Math.ceil((sch.goal + sch.C) / sch.missCost - 1e-9);
  return Math.min(sch.N, Math.max(0, k) + sch.fakeCount);
}

// --- Üretilmiş günde senaryo kazancı ---
// missCount kadar geçerli hasta yanlış ilaç alır (ciro kaçar + cost zararı yazılır),
// kalan geçerli hastalar doğru servis edilir. order: hataların hangi hastalara düştüğü.
//   "ucuz"   = en düşük swing'li hastalarda hata (oyuncu lehine EN İYİ hâl)
//   "pahalı" = en yüksek swing'li hastalarda hata (EN KÖTÜ hâl)
//   "ortalama" = hatalar ortalama değerli hastalara düşer (formülün varsaydığı hâl)
// Sahte reçetelerin yakalama bonusu (fakeCatchBonus) KASITLI sayılmaz — hedef de onları
// 0₺ kabul ediyor; bonus oyuncu lehine ekstra paydır.
function simulateDayScenario(day, missCount, order) {
  const sch = getDaySchedule(day);
  if (order === "ortalama") return sch.R - missCount * sch.missCost;
  const swing = p => p.refRevenue + p.refCost;
  const list = sch.patients.filter(p => p.refValid).slice()
    .sort((a, b) => order === "pahalı" ? swing(b) - swing(a) : swing(a) - swing(b));
  const m = clamp(missCount, 0, list.length);
  let earn = sch.R;
  for (let i = 0; i < m; i++) earn -= swing(list[i]);
  return earn;
}

// --- Denge doğrulaması: KESİN (üretilmiş gün listesinden; olasılık/örnekleme yok) ---
// İki ayrı ölçüt:
//  1) FORMÜL ÖLÇÜTÜ — hatalar ortalama değerli hastalara düştüğünde izinli hata kadar hata
//     hedefi tutturmalı, bir fazlası tutturmamalı. (round/clamp bunu bozarsa yakalanır.)
//  2) ZARF — hatalar EN UCUZ/EN PAHALI hastalara düşerse ne olur. Hastalar heterojen
//     olduğu için (reçete hastası semptom hastasının ~2.8 katı değerinde) bu aralık geniştir;
//     sadece patolojik uçlarda uyarı verilir: izinli hata kadar hata EN İYİ hâlde bile
//     tutmuyorsa hedef imkânsız, bir fazlası EN KÖTÜ hâlde bile tutuyorsa hedef anlamsız.
function verifyGoalBalance(verbose, days) {
  days = days || 10;
  let allOk = true;
  for (let d = 1; d <= days; d++) {
    const sch = getDaySchedule(d);
    const mInt = Math.floor(sch.misses + 1e-9);
    const g = sch.goal;

    // Güvenlik bandı devreye girdiyse hedef KASITLI olarak tolerans değerinde değildir;
    // tolerans ölçütü bu günde geçerli olmaz. Tipik sebep: günün büyük kısmı sahte reçete
    // olduğunda R küçülür, izinli hata (N × missRate, N sahteleri de sayar) geçerli hasta
    // sayısına göre absürtleşir ve alt bant hedefi yukarı çeker. Bu bir denge hatası değil,
    // bandın işini yapmasıdır — ama sessiz geçmesin diye verbose'ta bildirilir.
    if (sch.clampedAt) {
      if (verbose) {
        console.log("Gün " + d + " | hedef " + g + "₺ | GÜVENLİK BANDI (" + sch.clampedAt +
          ") devrede: ham hedef " + Math.round(sch.raw) + "₺ → banda çekildi" +
          " (geçerli hasta " + sch.validCount + "/" + sch.N + ", izinli hata " + sch.misses.toFixed(2) + ")");
      }
      continue;
    }

    // 1) formül ölçütü (kesin)
    const avgPass = simulateDayScenario(d, mInt, "ortalama");
    const avgFail = simulateDayScenario(d, mInt + 1, "ortalama");
    if (!(avgPass >= g)) {
      allOk = false;
      console.warn("[denge] Gün " + d + ": izinli " + sch.misses.toFixed(2) + " hataya rağmen " +
        mInt + " ortalama hata (" + Math.round(avgPass) + "₺) hedefi (" + g + "₺) TUTMUYOR." +
        " R=" + Math.round(sch.R) + "₺ C=" + Math.round(sch.C) + "₺ missCost=" + Math.round(sch.missCost) + "₺");
    }
    // "bir fazlası tutmamalı" — ama izinli hata 2.99 gibi tam sayıya çok yakınsa, 3. hatanın
    // beklenen açığı (0.01 × missCost) 10'a yuvarlama adımından küçük olur. Yuvarlamanın
    // açıklayabildiği ihlal gerçek denge hatası değildir; yalnız onu aşanı bildir.
    const failMargin = (mInt + 1 - sch.misses) * sch.missCost;
    if (!(avgFail < g) && failMargin > 10) {
      allOk = false;
      console.warn("[denge] Gün " + d + ": " + (mInt + 1) + " ortalama hata (" + Math.round(avgFail) +
        "₺) hâlâ hedefi (" + g + "₺) tutuyor — hedef fazla GEVŞEK." +
        " (izinli hata " + sch.misses.toFixed(2) + ", beklenen açık " + Math.round(failMargin) + "₺)");
    }

    // 2) zarf (patolojik uçlar)
    const best = simulateDayScenario(d, mInt, "ucuz");
    const worst = simulateDayScenario(d, mInt, "pahalı");
    const worstNext = simulateDayScenario(d, mInt + 1, "pahalı");
    if (best < g) {
      allOk = false;
      console.warn("[denge] Gün " + d + ": " + mInt + " hata EN İYİ hâlde bile (" + Math.round(best) +
        "₺) hedefi (" + g + "₺) tutmuyor — hedef imkânsız.");
    }
    if (worstNext >= g) {
      allOk = false;
      console.warn("[denge] Gün " + d + ": " + (mInt + 1) + " hata EN KÖTÜ hâlde bile (" +
        Math.round(worstNext) + "₺) hedefi (" + g + "₺) tutuyor — hedef anlamsız.");
    }

    if (verbose) {
      const kesin = worst >= g ? "garanti geçer" : (best < g ? "garanti kalır" : "hangi hastada hata yaptığına bağlı");
      console.log("Gün " + d + " | hedef " + g + "₺ | ortalama " + mInt + " hata: " + Math.round(avgPass) +
        "₺ " + (avgPass >= g ? "✓" : "✗") + " | " + (mInt + 1) + " hata: " + Math.round(avgFail) +
        "₺ " + (avgFail < g ? "✓" : "✗") + " | " + mInt + " hata zarfı: " + Math.round(worst) + "–" +
        Math.round(best) + "₺ → " + kesin);
    }
  }
  if (verbose) console.log(allOk ? "Denge doğrulaması: TÜM GÜNLER GEÇTİ ✓" : "Denge doğrulaması: BAŞARISIZ ✗");
  return allOk;
}
// Belirli geliştirme seviyeleri altında fn'i çalıştır (gün cache'i her iki yönde de
// geçersiz kılınır — vitrin seviyesi hasta karışımını değiştirir).
function withUpgradeLevels(levels, fn) {
  const prev = game.upgrades;
  const prevSch = game.daySchedule;
  game.upgrades = levels;
  game.daySchedule = null;          // snapshot sabitlemesi doğrulamayı maskelemesin
  invalidateDaySchedules();
  try { return fn(); }
  finally {
    game.upgrades = prev;
    game.daySchedule = prevSch;
    invalidateDaySchedules();
  }
}
function allLevels(pick) {
  const o = {};
  for (const u of UPGRADES) o[u.id] = pick(u);
  return o;
}

// --- Konsantrasyon tavanı doğrulaması ---
// Hiçbir GEÇERLİ hastanın payı o günün tavanını aşmamalı. Sahteler kapsam dışı.
function concItemsLabel(request) {
  const items = request.items || [];
  if (request.type === "symptom") return items.map(it => it.symptom.label + "×" + it.qty).join(" + ");
  return items.map(it => { const m = getMedicine(it.id); return (m ? m.name : it.id) + "×" + it.qty; }).join(", ");
}
function verifyConcentrationCap(verbose, days) {
  days = days || 10;
  let ok = true;
  for (let d = 1; d <= days; d++) {
    const sch = getDaySchedule(d);
    const cap = sch.concCap;
    // sağlanamaz gün (tavan × geçerli hasta ≤ 1, yani ≤2 geçerli hasta): kural uygulanmadı,
    // ölçüt de geçerli değil
    if (cap * sch.validCount <= 1 || sch.R <= 0) {
      if (verbose) console.log("Gün " + d + " | geçerli hasta " + sch.validCount + " — tavan sağlanamaz, kural uygulanmadı");
      continue;
    }
    let top = null;
    for (const p of sch.patients) {
      if (!p.refValid) continue;
      const share = p.refRevenue / sch.R;
      if (!top || p.refRevenue > top.refRevenue) top = p;
      if (share > cap + 1e-9) {
        ok = false;
        console.warn("[konsantrasyon] Gün " + d + ": bir hasta R'nin %" + (share * 100).toFixed(1) +
          "'ini tutuyor — tavan %" + (cap * 100).toFixed(1) + " (geçerli hasta " + sch.validCount +
          ", R " + Math.round(sch.R) + "₺, sipariş " + Math.round(p.refRevenue) + "₺)" +
          " | ilaçlar: " + concItemsLabel(p.request));
      }
    }
    if (verbose) {
      console.log("Gün " + d + " | geçerli hasta " + sch.validCount + " | tavan %" + (cap * 100).toFixed(1) +
        " | en yüksek pay %" + (top ? ((top.refRevenue / sch.R) * 100).toFixed(1) : "0") +
        " (" + (top ? Math.round(top.refRevenue) : 0) + "₺) " +
        (top && top.refRevenue / sch.R <= cap + 1e-9 ? "✓" : "✗") +
        " | yeniden üretilen " + sch.concRegen + ", zorla sığdırma " + sch.concForced);
    }
  }
  if (verbose) console.log(ok ? "Konsantrasyon tavanı: TÜM GÜNLER GEÇTİ ✓" : "Konsantrasyon tavanı: BAŞARISIZ ✗");
  return ok;
}

// Semptom isteği için birkaç geçerli cevap üret: her kalemin kategorisindeki İLK ve SON
// ilaç ayrı ayrı denenir (kategori içi her ilaç doğru sayılmalı).
function symptomAnswerCombos(items) {
  const mk = pickIdx => {
    const out = [];
    for (const it of items) {
      const cands = MEDICINES.filter(m => m.category === it.symptom.category);
      if (!cands.length) return null;
      const m = cands[pickIdx === "last" ? cands.length - 1 : 0];
      for (let i = 0; i < it.qty; i++) out.push(m.id);
    }
    return out;
  };
  return [mk("first"), mk("last")].filter(Boolean);
}

// Oyunda çizilen TÜM emojiler — denetim buradan gezer. (Veriden gelenler + sabit UI'lar.)

    ["💵", "HUD para"], ["😡", "HUD itibar (düşük)"], ["😑", "HUD itibar (orta)"],
