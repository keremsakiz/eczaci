// =====================================================================
//  TÜRETİLEN EKONOMİ — tüm denge sayıları MEDICINES'ten hesaplanır (sabit yok)
// =====================================================================
const MED_AVG = (function () {
  let sp = 0, sc = 0;
  for (const m of MEDICINES) { sp += m.price; sc += m.cost; }
  const n = MEDICINES.length || 1;
  return { price: sp / n, cost: sc / n };
})();
const avgPrice = MED_AVG.price;   // tüm ilaçların ortalama satış fiyatı (₺)
const avgCost  = MED_AVG.cost;    // tüm ilaçların ortalama alış fiyatı (₺)

// CONFIG'in fiyat türevli alanlarını doldur (CONFIG yukarıda tanımlı, game aşağıda kurulur)
// NOT: missCost artık genel ortalamadan değil, her günün kendi listesinden hesaplanır
// (buildDaySchedule). Buradaki ortalamalar yalnız startMoney ve sabit para cezası için.
(function deriveEconomy() {
  CONFIG.startMoney = Math.round(avgCost * 30 / 100) * 100;          // 100'e yuvarlı
  CONFIG.fakeApproveMoneyPenalty = Math.round(avgPrice * 2);         // sahteyi servis etme cezası
})();

// =====================================================================

// costK'da HER SATIN ALMAYA birebir bir katsayı düşer: costK.length === maxLevel - 1.
// costK[0] = ilk satın alma (Lv1→2), costK[1] = ikinci (Lv2→3) …
// Fiyat = round100(avgPrice × costK[satınAlmaSırası]) → fiyat tablosu değişirse ölçeklenir.
const UPGRADES = [

    id: "tezgah", name: "Tezgah", emoji: "🧾", maxLevel: 3, costK: [15, 30],

  },

    id: "depo", name: "Depo Rafı", emoji: "📦", maxLevel: 3, costK: [15, 30],

  {
    id: "bekleme", name: "Bekleme Alanı", emoji: "🪑", maxLevel: 3, costK: [15, 30],
    desc: "Hasta sabır süresi",
    valueAt: lv => (lv === 1 ? "normal" : "+%" + Math.round((lv - 1) * 20))

    desc: "Reçetede kontrol edilecek alanı işaretler",
    // hints[lv-1] = kaç alan işaretlenir. Lv1 = 0: satın alınmamış terminal ipucu vermez.
    // İşaret sahte/gerçek ayrımı YAPMAZ — gerçek reçetede de aynı sayıda alan işaretlenir.
    hints: [0, 1],
    valueAt: lv => UPGRADE_BY_ID.medula.hints[lv - 1] + " alan işaretlenir"
  }
];
const UPGRADE_BY_ID = {};
for (const u of UPGRADES) UPGRADE_BY_ID[u.id] = u;

// hedef seviyenin fiyatı (₺). Lv1 zaten elde => 0.
// Lv2 ilk satın alma olduğu için costK[0]'ı kullanır (kaydırma yok: n'inci alım = costK[n-1]).
function upgradeCost(id, targetLevel) {
  const u = UPGRADE_BY_ID[id];
  if (!u || targetLevel < 2 || targetLevel > u.maxLevel) return 0;
  return Math.round(avgPrice * u.costK[targetLevel - 2] / 100) * 100;
}
function upgradeLevel(id) {
  const lv = game.upgrades ? game.upgrades[id] : 1;
  return lv || 1;
}
function upgradeMaxed(id) { return upgradeLevel(id) >= UPGRADE_BY_ID[id].maxLevel; }

// --- Efektif değerler: kod ARTIK CONFIG.maxQueue/maxStock/basePatience'ı doğrudan okumaz ---
function effMaxQueue()    { return CONFIG.maxQueue + (upgradeLevel("tezgah") - 1); }        // 3 / 4 / 5
function effMaxStock()    { return CONFIG.maxStock + (upgradeLevel("depo") - 1) * 15; }     // 30 / 45 / 60
function effExtraPatients() { return (upgradeLevel("vitrin") - 1) * 2; }                    // 0 / +2 / +4
function effPatience()    { return CONFIG.basePatience * (1 + (upgradeLevel("bekleme") - 1) * 0.2); }
function effMedulaHints() { return UPGRADE_BY_ID.medula.hints[upgradeLevel("medula") - 1]; }

// =====================================================================
//  ASSET KATMANI — sonradan PNG giydirmek için soyutlama
//  (şu an hiçbir dosya yüklenmiyor; images boş => her zaman fallback çizilir)
// =====================================================================
const Assets = {
  images: {},   // key -> yüklenmiş Image
  loaded: 0,
  total: 0,
  // Image objesi oluşturur, onload'da images[key] doldurur. Şimdilik çağrılmıyor.
  load(key, src) {
    this.total++;
    const img = new Image();
    img.onload = () => { this.images[key] = img; this.loaded++; };
    img.onerror = () => { this.loaded++; };
    img.src = src;
    return img;
  }
};

const Sprite = {
  // Asset yüklüyse onu çizer; değilse fallback(ctx,x,y,w,h) ile mevcut çizimi yapar.
  // fit: "stretch" (varsayılan), "contain" (kutuya sığdır, kırpma yok),
  //      "cover" (kutuyu doldur, taşan kenarlar kırpılır). Oran korunur.
  draw(ctx, key, x, y, w, h, fallback, fit) {
    const img = Assets.images[key];
    if (img && img.complete && img.naturalWidth > 0) {
      if (!fit || fit === "stretch") {
        ctx.drawImage(img, x, y, w, h);
        return;
      }
      const iw = img.naturalWidth, ih = img.naturalHeight;
      const scale = fit === "cover"
        ? Math.max(w / iw, h / ih)
        : Math.min(w / iw, h / ih);
      const dw = iw * scale, dh = ih * scale;
      const dx = x + (w - dw) / 2, dy = y + (h - dh) / 2;
      if (fit === "cover") {
        ctx.save();
        ctx.beginPath();
        ctx.rect(x, y, w, h);
        ctx.clip();
        ctx.drawImage(img, dx, dy, dw, dh);
        ctx.restore();
      } else {
        ctx.drawImage(img, dx, dy, dw, dh);
      }
    } else if (fallback) {
      fallback(ctx, x, y, w, h);
    }
  }
};

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let DPR = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  canvas.width = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  layout.w = w;
  layout.h = h;
  computeLayout();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

// =====================================================================
//  LAYOUT HESABI
// =====================================================================
function computeLayout() {
  const W = layout.w, H = layout.h;

  // --- Merkezî 9:16 oyun kolonu (stage). Geniş ekranda ortada dikey kolon,
  //     kenarlar arka plan PNG'si ile dolar. Tüm UI bu kolona göre konumlanır. ---
  const aspect = 9 / 16;
  let sw, sh;
  if (W / H > aspect) { sh = H; sw = H * aspect; }
  else { sw = W; sh = W / aspect; }
  const sx = (W - sw) / 2;
  const sy = (H - sh) / 2;
  layout.stage = { x: sx, y: sy, w: sw, h: sh };

  // yatay iç boşluk (stage genişliğine göre)
  const padX = sw * 0.05;
  const left = sx + padX;
  const colW = sw - padX * 2;

  // --- Dikey düzen (Büfeci mantığı) ---
  //   üst (ince)           : HUD
  //   üst-orta (büyük)     : konuşma balonu + DEV müşteri
  //   tezgah çizgisi       : ahşap bant (müşteriyi göğüsten keser, üstüne seçilen ilaçlar dizilir)
  //   alt                  : ilaç seçim grid'i (2x3) + SERVİS ET (en altta)
  const hudY = sy + (window.__safeTop || 0) + sh * 0.018;
  const hudH = sh * 0.082;

  // tezgah (ahşap bant) — müşterinin kesildiği çizgi
  const counterLine = sy + sh * 0.555;
  const bandH = sh * 0.12;
  layout._counterLine = counterLine;
  layout._band = { x: sx, y: counterLine, w: sw, h: bandH };

  // seçilen ilaçların dizildiği tezgah alanı (ahşap bandın üstünde, müşterinin önünde)
  layout._counterArea = {
    x: left,
    y: counterLine + sh * 0.024,
    w: colW,
    h: bandH - sh * 0.042
  };

  // --- Servis butonu (en alt) ---
  const btnH = sh * 0.082;
  const btnY = sy + sh - btnH - sh * 0.02 - (window.__safeBottom || 0);
  layout.serveBtn = { x: left, y: btnY, w: colW, h: btnH };
  // ONAYLA / REDDET (reçete karar fazında SERVİS yerine gösterilir)
  const halfGap = colW * 0.04;
  const halfW = (colW - halfGap) / 2;
  layout.rejectBtn = { x: left, y: btnY, w: halfW, h: btnH };
  layout.approveBtn = { x: left + halfW + halfGap, y: btnY, w: halfW, h: btnH };

  // --- Kategori sekmeleri + ilaç seçim grid'i ---
  // Sekmeler bandın GÖRÜNÜR yüzeyinin hemen altına alındı: counter.png'nin alt ~%35'i
  // koyu ön panel (boş şerit gibi okunuyordu); sekmeler o panelin üstüne biner.
  // Yüzey çizgisi ~0.58×bandH (defter/PC oturma hizası) + nefes payı ~0.15×bandH.
  const zoneTop = counterLine + bandH * 0.73;
  const tabH = sh * 0.056;
  layout.tabsArea = { x: left, y: zoneTop, w: colW, h: tabH };
  const gridTop = zoneTop + tabH + sh * 0.006;
  const gridBottom = btnY - sh * 0.008;
  layout.gridArea = { x: left, y: gridTop, w: colW, h: gridBottom - gridTop };

  if (!game.activeGroup) {
    const first = groupsWithMeds()[0];
    game.activeGroup = first ? first.id : null;
  }
  buildTabs();
  buildShelf();

  layout._hud = { x: left, y: hudY, w: colW, h: hudH };

  // tezgahın SOL tarafında duran kapalı defter (obje) — ~%35 büyütüldü, daha görünür/tıklanır
  const dbw = sw * 0.32, dbh = sh * 0.10;
  const dbx = layout._band.x + sw * 0.02;
  const dby = (layout._band.y + layout._band.h * 0.58) - dbh;  // alt kenar tezgah yüzeyinde
  layout.bookClosedRect = { x: dbx, y: dby, w: dbw, h: dbh };

  // hasta alanı: HUD altı .. tezgah çizgisi (DEV müşteri burada, alttan banda gömülür)
  const patientTop = hudY + hudH + sh * 0.004;
  layout._patientArea = {
    x: sx,
    y: patientTop,
    w: sw,
    h: counterLine - patientTop
  };

  rebuildCounterSlots();
}

function rebuildCounterSlots() {
  const b = layout._band;
  if (!b) return;
  layout.counterSlots = [];
  // counter verisi düz id listesi kalır (multiset/checkOrder aynı); sadece ÇİZİM
  // ilaç bazında gruplanır: benzersiz ilaç = tek kutu + adet (×N rozeti için)
  const order = [], countById = {};
  for (const id of game.counter) {
    if (!(id in countById)) { countById[id] = 0; order.push(id); }
    countById[id]++;
  }
  const n = order.length;
  if (n === 0) return;
  const sw = layout.stage.w;
  // tezgah bandının ~%78'i kadar büyük tile'lar
  let slot = Math.min(b.h * 0.78, sw * 0.17);
  let gap = sw * 0.025;
  // çok ilaç varsa sığacak şekilde küçült
  const maxW = b.w * 0.92;
  let totalW = n * slot + (n - 1) * gap;
  if (totalW > maxW) { const k = maxW / totalW; slot *= k; gap *= k; totalW = maxW; }
  // alt kenar tezgah yüzeyine otursun (yüzey ~bandın üst %58'i)
  const baseline = b.y + b.h * 0.60;
  const sy = baseline - slot;
  let sx = b.x + (b.w - totalW) / 2;
  for (let i = 0; i < n; i++) {
    layout.counterSlots.push({ id: order[i], count: countById[order[i]], x: sx, y: sy, w: slot, h: slot });
    sx += slot + gap;
  }
}

// kategori sekmelerinin yatay yerleşimi (içerik koordinatında x; tabScroll ile kaydırılır)
function buildTabs() {
  const ta = layout.tabsArea;
  layout.tabs = [];
  if (!ta) return;
  const groups = groupsWithMeds();
  const fs = ta.h * 0.36;
  ctx.font = "800 " + fs + "px " + RX_FONT;   // çizimdeki en geniş ağırlıkla ölç
  const gap = ta.h * 0.22;                      // sekmeler arası net boşluk
  const padInner = ta.h * 0.42;                 // metin etrafı iç boşluk
  const minW = ta.h * 2.0;                      // dokunma için makul alt sınır
  let x = 0;
  for (const g of groups) {
    // emojisiz sekme: sadece metin ölçülür
    const btnW = Math.max(minW, ctx.measureText(g.label).width + padInner * 2);
    layout.tabs.push({ group: g, x, w: btnW + gap });  // w = buton + arkasındaki boşluk
    x += btnW + gap;
  }
  const total = x - gap;                 // son boşluğu sayma
  layout.tabsTotal = total;
  if (total <= ta.w) {
    // sığıyorsa şeridi ortala, kaydırma yok
    layout.tabsOffset = (ta.w - total) / 2;
    layout.tabScroll = 0;
  } else {
    // sığmıyorsa soldan başla, sağa kaydırılabilir
    layout.tabsOffset = 0;
    layout.tabScroll = clamp(layout.tabScroll || 0, 0, total - ta.w);
  }
  ensureActiveTabVisible();
}

// aktif sekmeyi görünür alana kaydır (gerekiyorsa)
function ensureActiveTabVisible() {
  const ta = layout.tabsArea;
  if (!ta || !layout.tabs || (layout.tabsTotal || 0) <= ta.w) return;
  const t = layout.tabs.find(t => t.group.id === game.activeGroup);
  if (!t) return;
  const left = t.x, right = t.x + t.w;
  if (left < layout.tabScroll) layout.tabScroll = left;
  else if (right > layout.tabScroll + ta.w) layout.tabScroll = right - ta.w;
  layout.tabScroll = clamp(layout.tabScroll, 0, layout.tabsTotal - ta.w);
}

// Seçili gruptaki ilaçları BÜYÜK KARTLAR halinde yerleştir (Büfeci kalıbı):
// satırda 3 kart, kare-ye yakın; sığmazsa grid aşağı devam eder ve DİKEY
// drag-scroll ile kaydırılır (layout.shelfScroll; çizim/tıklamada düşülür).
function buildShelf() {
  const area = layout.gridArea;
  layout.shelfButtons = [];
  layout.shelfMaxScroll = 0;
  if (!area) return;
  const meds = medsInGroup(game.activeGroup);
  const n = meds.length;
  if (n === 0) return;

  const S = layout.stage;
  const cols = 3;
  const cardW = S.w * 0.26;            // büyük kart (~%26 stage genişliği)
  const cardH = cardW * 0.94;          // kare-ye yakın
  const gap = S.w * 0.03;
  const rows = Math.ceil(n / cols);
  const contentH = rows * cardH + (rows - 1) * gap;
  // içerik alandan kısaysa dikeyde ortala (kaydırma yok)
  const topPad = contentH <= area.h ? (area.h - contentH) / 2 : 0;
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols);
    const c = i % cols;
    const rowCount = Math.min(cols, n - r * cols);          // son satır eksikse o satırı ortala
    const rowW = rowCount * cardW + gap * (rowCount - 1);
    const startX = area.x + (area.w - rowW) / 2;
    layout.shelfButtons.push({
      id: meds[i].id,
      x: startX + c * (cardW + gap),
      y: area.y + topPad + r * (cardH + gap),   // içerik koordinatı; shelfScroll çizimde düşülür
      w: cardW,
      h: cardH
    });
  }
  layout.shelfMaxScroll = Math.max(0, contentH - area.h);
  layout.shelfScroll = clamp(layout.shelfScroll || 0, 0, layout.shelfMaxScroll);
}

// =====================================================================
//  OYUN MANTIĞI
// =====================================================================
function getMedicine(id) { return MEDICINES.find(m => m.id === id); }

// --- Değiştirilebilir rastgelelik kaynağı ---
// Normalde Math.random; gün listesi üretilirken withSeed() bunu seed'li RNG ile değiştirir.
// Böylece üretim kodu (makePrescription, makePatient…) hiç değişmeden deterministik olur.
let _rngSource = Math.random;
function rng() { return _rngSource(); }
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// fn'i seed'li RNG altında çalıştırır. pickKnownDoctor game.lastDoctor'a bakıp yazdığı için
// o da izole edilir — aynı seed + aynı gün her zaman aynı listeyi verir.
function withSeed(seed, fn) {
  const prevSrc = _rngSource, prevDoc = game.lastDoctor;
  _rngSource = mulberry32(seed);
  // lastDoctor SIFIRLANIR (yalnız geri yüklenmesi yetmez): pickKnownDoctor
  // "d.name === game.lastDoctor" olduğu sürece döngüde kalıp fazladan rng() harcar.
  // Dışarıdan gelen bir isim ilk çekilişle çakışırsa tüm RNG akışı kayar ve aynı gün
  // farklı üretilir. Sıfırlamak üretimi dış duruma tamamen kapatır.
  game.lastDoctor = null;
  try { return fn(); }
  finally { _rngSource = prevSrc; game.lastDoctor = prevDoc; }
}

function rand(n) { return Math.floor(rng() * n); }
function pick(arr) { return arr[rand(arr.length)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

function activePatient() { return game.queue.length ? game.queue[0] : null; }

// o günün müşteri limiti (gün bağımsız hesap; hedef fonksiyonu da bunu kullanır)
function patientLimitFor(day) {
  return CONFIG.patientsPerDayBase + (day - 1) * CONFIG.patientsPerDayStep + effExtraPatients();
}
// OYNANAN gün, üretildiği andaki listeye SABİTLENİR — gün ortasında vitrin yükseltilirse
// o günün müşteri sayısı ve hedefi değişmez, etki bir sonraki günden başlar.
function patientsForDay() {
  if (game.daySchedule && game.daySchedule.day === game.dayNumber) return game.daySchedule.N;
  return patientLimitFor(game.dayNumber);
}

// --- NÖBET ---
// Nöbet, günün ikinci bölümüdür: aynı gün programına night:true hastalar eklenir.
// Böylece R, C ve hedef mevcut formülle kendiliğinden doğru çıkar (formüle dokunulmadı).
const _forcedNightDays = {};   // yalnız cheats.forceNight() doldurur; normal oyunda boş
function isNightDutyDay(day) {
  if (_forcedNightDays[day]) return true;
  return CONFIG.nightDutyEvery > 0 && day % CONFIG.nightDutyEvery === 0;
}
function nightPatientsFor(day) {
  if (!isNightDutyDay(day)) return 0;
  return Math.max(CONFIG.nightPatientMin, Math.round(patientLimitFor(day) * CONFIG.nightPatientRatio));
}
// gece sahte reçete ihtimali — çarpan uygulanır ama tavanı aşamaz
function nightFakeChance() {
  return Math.min(CONFIG.nightFakeRateCap, CONFIG.fakeChance * CONFIG.nightFakeRateBoost);
}
// günün TOPLAM hasta sayısı (gündüz + gece)
function totalPatientsFor(day) { return patientLimitFor(day) + nightPatientsFor(day); }

// hasta başına izinli hata oranı — gün ilerledikçe daralır, floor'un altına inmez
function missRateFor(day) {
  return Math.max(CONFIG.missRateFloor, CONFIG.missRateBase - (day - 1) * CONFIG.missRateDecay);
}
// o gün kaç yanlış servise tolerans var — müşteri sayısıyla ÖLÇEKLENİR
function allowedMissesFor(day) {
  return totalPatientsFor(day) * missRateFor(day);
}

// --- Bir siparişin referans değeri (doğru servis edilirse ciro / mal maliyeti) ---
// Reçete: kalemlerin adetli price/cost toplamı — kesin.
// Semptom: o kategorideki ilaçların ORTALAMASI; oyuncu kategoriden herhangi birini
// verebilir ve hepsi doğru sayılır, tek "doğru fiyat" yoktur. Kategori içi fiyat
// yayılımı genel havuzdan çok daha dar olduğu için tahmin hatası küçüktür.
// priceMul: gece hastalarında CONFIG.nightPriceMultiplier (nöbet farkı). Yalnız SATIŞ
// fiyatına uygulanır — mal maliyeti (cost) değişmez.
function refValuesFor(request, priceMul) {
  const mul = priceMul || 1;
  if (request.type === "prescription") {
    if (request.fake) return { rev: 0, cost: 0, valid: false };   // doğru oynanış = reddetmek
    let rev = 0, cost = 0;
    for (const it of request.items) {
      const m = getMedicine(it.id);
      if (m) { rev += m.price * it.qty; cost += m.cost * it.qty; }
    }
    return { rev: rev * mul, cost, valid: true };
  }
  const cands = MEDICINES.filter(m => m.category === request.symptom.category);
  if (!cands.length) return { rev: 0, cost: 0, valid: false };
  let rev = 0, cost = 0;
  for (const m of cands) { rev += m.price; cost += m.cost; }
  return { rev: (rev / cands.length) * mul, cost: cost / cands.length, valid: true };
}

// --- Günün tam listesini seed'li üret ve ekonomisini çıkar ---
// Aynı seed + aynı gün => aynı liste (test edilebilirlik).
function buildDaySchedule(day) {
  const dayN = patientLimitFor(day);
  const nightN = nightPatientsFor(day);
  const N = dayN + nightN;
  const prevDateDay = _dateDayOverride;
  _dateDayOverride = day;                 // reçete tarihleri o güne göre damgalansın
  let patients;
  try {
    patients = withSeed(CONFIG.daySeedBase + day * 7919, function () {
      const out = [];
      for (let i = 0; i < dayN; i++) out.push(makePatient());
      // NÖBET bölümü — listenin sonuna eklenir, spawn sırayla çektiği için gece sonra gelir
      for (let i = 0; i < nightN; i++) out.push(makePatient({ night: true }));
      // Gece bölümünde EN AZ BİR gerçek (servis edilebilir) reçete garanti edilir:
      // aksi halde nöbet yalnızca red kararlarından ibaret olabiliyor.
      if (nightN > 0) {
        const hasReal = out.slice(dayN).some(p => p.request.type === "prescription" && !p.request.fake);
        if (!hasReal) out[out.length - 1] = makePatient({ night: true, forcePrescription: true, forceFake: false });
      }
      return out;
    });
  } finally { _dateDayOverride = prevDateDay; }

  let R = 0, C = 0, validCount = 0;
  for (const p of patients) {
    // nöbet farkı: gece hastalarının satış fiyatı çarpanlı olarak R'ye girer
    const v = refValuesFor(p.request, p.night ? CONFIG.nightPriceMultiplier : 1);
    p.refRevenue = v.rev;                 // teşhis/doğrulama için hastada da dursun
    p.refCost = v.cost;
    p.refValid = v.valid;
    if (v.valid) { R += v.rev; C += v.cost; validCount++; }
  }

  const misses = allowedMissesFor(day);
  // o güne özel gerçek hata maliyeti: kaçan ciro + yazılan cost zararı, geçerli hasta başına
  const missCost = validCount > 0 ? (R + C) / validCount : 0;
  const lo = CONFIG.goalRatioClamp[0], hi = CONFIG.goalRatioClamp[1];
  const raw = R - misses * missCost;
  // 10'a AŞAĞI yuvarla: yukarı yuvarlamak formülün az önce verdiği toleransın bir kısmını
  // geri alır (gün 1'de hedefi 648.6 → 650 yapıp gereken doğruyu 6'dan 7'ye çıkarıyordu).
  const goal = Math.floor(clamp(raw, R * lo, R * hi) / 10) * 10;

  return { day, patients, N, dayN, nightN, isNight: nightN > 0,
           R, C, validCount, fakeCount: N - validCount, misses, missCost, raw, goal };
}

// gün listesi cache'i — hedef sorulunca üretilir, oynanınca AYNI liste kullanılır (iki kez üretilmez)
const _dayScheduleCache = {};
// Vitrin seviyesi patientLimitFor'u değiştirir => önden üretilmiş günler ve hedefleri
// geçersizleşir. Oynanan gün game.daySchedule snapshot'ından okunduğu için etkilenmez.
function invalidateDaySchedules() {
  for (const k in _dayScheduleCache) delete _dayScheduleCache[k];
}
function getDaySchedule(day) {
  if (!_dayScheduleCache[day]) _dayScheduleCache[day] = buildDaySchedule(day);
  return _dayScheduleCache[day];
}

// günlük para hedefi — o günün gerçek hasta listesinden
function dailyGoalFor(day) { return getDaySchedule(day).goal; }

// hedefin fiilen karşılık geldiği oran (hedef / geçerli ciro) — teşhis için
function effectiveGoalRatio(day) {
  const sch = getDaySchedule(day);
  return sch.R > 0 ? sch.goal / sch.R : 0;
}
function goalForDay() {
  if (game.daySchedule && game.daySchedule.day === game.dayNumber) return game.daySchedule.goal;
  return dailyGoalFor(game.dayNumber);
}

// --- tarih sistemi: gün 1 = 17 Haziran 2026, her gün +1 ---
const MONTHS_TR = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
// Gün listesi önden üretilirken (buildDaySchedule) reçetelere O GÜNÜN tarihi basılmalı,
// oynanan günün değil. Üretim sırasında bu override doldurulur.
let _dateDayOverride = 0;
function gameDate(offsetDays) {
  const d = new Date(2026, 5, 17);
  d.setDate(d.getDate() + ((_dateDayOverride || game.dayNumber) - 1) + (offsetDays || 0));
  return d;
}
// gün değişmediği sürece cache'lenir (HUD her frame çağırır; frame'de new Date olmasın)
let _dateCacheDay = 0, _dateCacheStr = "";
function dateShort() {
  if (_dateCacheDay === game.dayNumber) return _dateCacheStr;
  _dateCacheDay = game.dayNumber;
  const d = gameDate(0);
  _dateCacheStr = d.getDate() + " " + MONTHS_TR[d.getMonth()];
  return _dateCacheStr;
}

// --- KOZMETİK hava durumu: gün başında DETERMİNİSTİK seçilir, mantığa etkisi yok ---
const WEATHERS = [
  ["GÜNEŞLİ", "☀️"],
  ["BULUTLU", "⛅"],
  ["PARÇALI", "🌤️"],
  ["YAĞMURLU", "🌧️"]
];
// sabit pseudo-random karışım (ardışık tekrar yok; dizide dönerek tekrar hissi vermez)
const WEATHER_SEQ = [0, 2, 1, 0, 3, 1, 2, 0, 1, 3, 2, 0, 3, 1, 0, 2];
function weatherForDay(n) { return WEATHERS[WEATHER_SEQ[(n - 1) % WEATHER_SEQ.length]]; }

// Türkçe binlik ayraçlı para formatı: 1100 → "1.100₺" (toLocaleString YOK — her ortamda
// aynı görünüm). Basit cache: para değişmediği sürece string yeniden hesaplanmaz.
let _moneyCacheVal = null, _moneyCacheStr = "";
function formatMoney(n) {
  if (n === _moneyCacheVal) return _moneyCacheStr;
  _moneyCacheVal = n;
  let s = String(Math.abs(Math.trunc(n)));
  let out = "";
  while (s.length > 3) { out = "." + s.slice(-3) + out; s = s.slice(0, -3); }
  _moneyCacheStr = (n < 0 ? "-" : "") + s + out + "₺";
  return _moneyCacheStr;
}
function dateRx(offsetDays) {
  const d = gameDate(offsetDays);
  return d.getDate() + " " + MONTHS_TR[d.getMonth()] + " '" + String(d.getFullYear()).slice(2);
}

// ardışık aynı doktoru seçmeden tanınan doktor seç
function pickKnownDoctor() {
  let d;
  do { d = pick(KNOWN_DOCTORS); } while (KNOWN_DOCTORS.length > 1 && d.name === game.lastDoctor);
  game.lastDoctor = d.name;
  return d;
}

// --- Kusur sınıfları ---
// DETECTABLE: yalnız reçete kağıdına + doktor defterine bakarak doğrulanabilir.
// SUBTLE: alan bilgisi ister (ilaç etkileşimi); tek başına kusur olarak KULLANILMAZ.
const DETECTABLE_FLAWS = ["fake_doctor", "expired", "overdose", "no_stamp", "bad_signature"];
const SUBTLE_FLAWS = ["conflict"];

// bir reçetede oyuncunun kağıttan tespit edebileceği kusurları döndür (teşhis + self-test)
function detectableFlawsOf(req) {
  const out = [];
  if (!req || req.type !== "prescription") return out;
  const known = KNOWN_DOCTORS.some(d => d.name === req.doctor);
  if (!known) out.push("doktor defterde yok (" + req.doctor + ")");
  if (req.hasStamp === false) out.push("kaşe yok");
  if (req.sig === "???" || req.sig === "—" || req.sig === "") out.push("imza geçersiz");
  if (req.items.some(it => it.qty >= 8)) out.push("aşırı doz (×" + Math.max.apply(null, req.items.map(it => it.qty)) + ")");
  if (req.expired) out.push("tarihi geçmiş (" + req.date + ")");
  return out;
}

// Reçetede gerçekten kusurlu olan alanlar (self-test ve ipucu sıralaması için).
// SADECE teşhis amaçlı; sahtelik kararına (request.fake) HİÇBİR etkisi yoktur.
function flawFieldsOf(req) {
  const out = [];
  if (!req || req.type !== "prescription") return out;
  if (!KNOWN_DOCTORS.some(d => d.name === req.doctor)) out.push("doctor");
  if (req.hasStamp === false) out.push("stamp");
  if (req.expired) out.push("date");
  if (req.items.some(it => it.qty >= 8)) out.push("qty");
  if (req.sig === "???" || req.sig === "—" || req.sig === "") out.push("sig");
  return out;
}

// --- MEDULA İPUCU ---
// İpucu "buraya bak" der, "yakaladım" DEMEZ: hem sahte hem GERÇEK reçetede aynı sayıda
// alan işaretlenir. Sahtede kusurlu alanlar öne alınır, gerçekte alanlar tamamen rastgeledir.
// Böylece işaretin VARLIĞI sahtelik bilgisi taşımaz; sadece bakılacak yeri daraltır.
// Sıra ÜRETİM anında (seed'li rng altında) kurulur → aynı gün = aynı işaretler, frame'de oynamaz.
const HINT_FIELDS = ["doctor", "stamp", "sig", "qty", "date"];
function shuffledCopy(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}
// üretim anında çağrılır (makePrescription sonu). Tüm alanları kapsayan bir sıra döner:
// önce (varsa) kusurlu alanlar karışık, sonra kalanlar karışık.
function buildHintFields(req) {
  const flawed = flawFieldsOf(req);
  const rest = HINT_FIELDS.filter(f => flawed.indexOf(f) < 0);
  return shuffledCopy(flawed).concat(shuffledCopy(rest));
}
// o an işaretlenecek alanlar (terminal seviyesi kadar) — rng TÜKETMEZ, sadece dilim alır
function medulaMarks(req) {
  const n = effMedulaHints();
  if (n <= 0 || !req || req.type !== "prescription") return [];
  const src = req.hintFields || flawFieldsOf(req);   // eski kayıtlar için güvenli düşüş
  return src.slice(0, n);
}

// reçete üret (gerçek/sahte + kusurlar). fakeForce: true/false => zorla; undefined => rastgele
function makePrescription(fakeForce, fakeChance) {
  const count = CONFIG.minPrescriptionItems +
    rand(CONFIG.maxPrescriptionItems - CONFIG.minPrescriptionItems + 1);
  const pool = MEDICINES.slice();
  const items = [];
  for (let i = 0; i < count && pool.length; i++) {
    const m = pool.splice(rand(pool.length), 1)[0];
    const roll = rng();
    const qty = roll < 0.70 ? 1 : roll < 0.92 ? 2 : 3;
    items.push({ id: m.id, qty });
  }

  const chance = (fakeChance === undefined) ? CONFIG.fakeChance : fakeChance;
  const fake = (fakeForce === undefined) ? (rng() < chance) : !!fakeForce;
  const flaws = [];
  if (fake) {
    // Sahte reçetenin EN AZ BİR kusuru kağıda bakarak doğrulanabilir olmalı.
    // "conflict" (uyku ilacı + enerji takviyesi bir arada) oyunun hiçbir yerinde
    // öğretilmiyor: doktor gerçek, kaşe var, imza düzgün, adetler ×1 → oyuncu için
    // görünmez bir kusurdu ve tek kusur olarak çıkabiliyordu. Artık yalnız EK kusur.
    const detectable = DETECTABLE_FLAWS.slice();
    for (let i = detectable.length - 1; i > 0; i--) { const j = rand(i + 1); [detectable[i], detectable[j]] = [detectable[j], detectable[i]]; }
    flaws.push(detectable[0]);        // garanti: tespit edilebilir 1 kusur
    if (rand(2) === 0) {              // %50 ihtimalle 2. kusur (ince kusur da olabilir)
      const rest = detectable.slice(1).concat(SUBTLE_FLAWS);
      flaws.push(rest[rand(rest.length)]);
    }
  }

  // varsayılan (gerçek) üst bilgi
  let doc = pickKnownDoctor();
  let doctor = doc.name, sig = doc.sig;
  let date = dateRx(0);               // güncel tarih
  let hasStamp = true, expired = false;

  // kusurları uygula
  if (flaws.includes("conflict")) {
    const sleepIds = MEDICINES.filter(m => m.group === "uyku_sinir").map(m => m.id);
    const energyIds = ["med_b12guc", "med_dvitamin", "cvitamin"].filter(id => getMedicine(id));
    items.length = 0;
    items.push({ id: pick(sleepIds), qty: 1 });
    items.push({ id: pick(energyIds), qty: 1 });
  }
  if (flaws.includes("overdose")) {
    items[rand(items.length)].qty = pick([8, 10]);
  }
  if (flaws.includes("fake_doctor")) { const f = pick(FAKE_DOCTORS); doctor = f.name; sig = f.sig; }
  if (flaws.includes("expired")) { expired = true; date = dateRx(-183); }  // ~6 ay önce
  if (flaws.includes("no_stamp")) { hasStamp = false; }
  if (flaws.includes("bad_signature")) { sig = pick(["???", "—", ""]); }

  const req = { type: "prescription", items, fake, flaws, doctor, sig, date, hasStamp, expired };
  // Medula ipucu sırası ve "doz" işareti hangi kaleme düşecek — ikisi de seed'li rng ile,
  // üretim anında sabitlenir (çizimde rastgelelik yok).
  const odIdx = items.findIndex(it => it.qty >= 8);
  req.hintQty = odIdx >= 0 ? odIdx : (items.length ? rand(items.length) : 0);
  req.hintFields = buildHintFields(req);
  return req;
}

// tek hasta nesnesi üret (kuyruğa EKLEMEZ). opts: {forcePrescription, forceFake}
// Gün listesi bunu seed altında toplu çağırır; cheat'ler tek tek çağırır.
function makePatient(opts) {
  opts = opts || {};
  const night = !!opts.night;
  const avatarDef = pick(PATIENT_AVATARS);
  const isPrescription = opts.forcePrescription ? true : (rng() < CONFIG.prescriptionChance);

  let request;
  if (isPrescription) {
    // gece: sahte reçete girişimi artar (tavanla sınırlı)
    request = makePrescription(opts.forceFake, night ? nightFakeChance() : CONFIG.fakeChance);
  } else {
    const symptom = pick(SYMPTOMS);
    request = { type: "symptom", symptom };
  }

  return {
    avatar: avatarDef.emoji,
    avatarKey: avatarDef.assetKey,
    request,
    line: request.type === "prescription" ? pick(PRESCRIPTION_LINES) : null,  // balon repliği (üretimde sabitlenir)
    decided: null,            // reçeteliler için: null | "approve" | "reject"
    maxPatience: CONFIG.basePatience,   // taban; enqueuePatient güncel seviyeyle ezer
    patience: CONFIG.basePatience,
    enterT: 0,
    posCurrent: 0,            // kuyruğa girerken ayarlanır
    bonus: false,             // true => cheat ile enjekte, günün programı dışında
    night: night              // true => günün NÖBET bölümüne ait
  };
}

// hastayı kuyruğa al (giriş animasyonu + sayaç). Program dışı (bonus) hastalar sayılmaz.
function enqueuePatient(patient) {
  // sabır sahneye çıkış anındaki Bekleme Alanı seviyesine göre kurulur (gün ortasında
  // yükseltme yapılırsa sonraki hastalar hemen faydalanır)
  patient.maxPatience = effPatience() * (patient.night ? CONFIG.nightPatienceMultiplier : 1);
  patient.patience = patient.maxPatience;
  patient.posCurrent = game.queue.length + 0.85;   // sağdan kayarak girsin
  game.queue.push(patient);
  if (!patient.bonus) game.daySpawned++;
}

// Sıradaki hastayı sahneye çıkar.
// opts YOKSA: günün ÖNCEDEN ÜRETİLMİŞ listesinden sıradakini çeker (hedef bu listeden hesaplandı).
// opts VARSA: cheat enjeksiyonu — anlık üretilir, bonus işaretlenir, hedefe/sayaca karışmaz.
function spawnPatient(opts) {
  if (game.queue.length >= effMaxQueue()) return;

  if (opts) {
    const p = makePatient(opts);
    p.bonus = true;
    enqueuePatient(p);
    return p;
  }

  const sch = game.daySchedule;
  if (!sch || game.dayScheduleIdx >= sch.patients.length) return;
  const p = sch.patients[game.dayScheduleIdx++];
  enqueuePatient(p);
  return p;
}

// aktif hastanın beklediği ilaç çoklu-kümesi (adetli => id tekrarlı liste)
function expectedMedicineIds() {
  const p = activePatient();
  if (!p) return [];
  if (p.request.type === "prescription") {
    const out = [];
    for (const it of p.request.items) for (let i = 0; i < it.qty; i++) out.push(it.id);
    return out;
  } else {
    return MEDICINES.filter(m => m.category === p.request.symptom.category).map(m => m.id);
  }
}

// iki listeyi çoklu-küme olarak karşılaştır (sıra önemsiz, adet önemli)
function sameMultiset(a, b) {
  if (a.length !== b.length) return false;
  const m = {};
  for (const x of a) m[x] = (m[x] || 0) + 1;
  for (const x of b) { if (!m[x]) return false; m[x]--; }
  return true;
}

// reçeteli hasta henüz ONAYLA/REDDET kararı bekliyor mu?
function activeNeedsDecision() {
  const p = activePatient();
  return !!(p && !game.feedback && p.request.type === "prescription" && !p.decided);
}
// ilaç seçip servis edilebilir mi? (semptom => evet; reçete => onaylanmışsa)
function servingAllowed() {
  const p = activePatient();
  if (!p || game.feedback) return false;
  if (p.request.type === "prescription") return p.decided === "approve";
  return true;
}

function approvePrescription() {
  const p = activePatient();
  if (!activeNeedsDecision() || p.request.type !== "prescription") return;
  p.decided = "approve";          // ilaç verme moduna geç
  game.counter = [];
  rebuildCounterSlots();
}

function rejectPrescription() {
  const p = activePatient();
  if (!activeNeedsDecision() || p.request.type !== "prescription") return;
  p.decided = "reject";
  game.dayStats.served++;
  if (p.request.fake) {
    // doğru yakalama
    game.money += CONFIG.fakeCatchBonus;
    addDayMoney(CONFIG.fakeCatchBonus);
    game.dayStats.correct++;
    game.reputation = clamp(game.reputation + CONFIG.fakeCatchRepGain, CONFIG.minReputation, CONFIG.maxReputation);
    game.feedback = { ok: true, angry: false, text: "✓ Sahte reçete yakaladın!  +" + CONFIG.fakeCatchBonus + "₺", t: 0 };
    explainDecision(p, [], "DOĞRU", "sahte reçete reddedildi (+" + CONFIG.fakeCatchBonus + "₺)");
  } else {
    // gerçeği boşuna reddetti
    game.dayStats.wrong++;
    game.feedback = { ok: false, angry: false, text: "Müşteriyi boşuna çevirdin", t: 0 };
    explainDecision(p, [], "YANLIŞ", "geçerli reçete reddedildi (satış kaybı + itibar)");
    loseReputation(CONFIG.wrongRejectRepLoss);
  }
}

// kısa uyarı toast'u — game.feedback'i EZMEZ (ayrı, süreli flash)
function flashStockToast(txt) {
  game.stockToast = { text: txt, until: game.clock + CONFIG.stockToastDuration };
}

function tapMedicine(id) {
  if (!servingAllowed()) return;
  const stock = game.stock[id] || 0;
  const m = getMedicine(id);
  // stok yoksa tezgaha ekleme
  if (stock <= 0) { flashStockToast("⛔ " + (m ? m.name : "İlaç") + " — Stok yok!"); return; }
  // tezgahtaki aynı ilaç adedi stoğu aşamaz
  let onCounter = 0;
  for (const cId of game.counter) if (cId === id) onCounter++;
  if (onCounter >= stock) { flashStockToast("⛔ " + (m ? m.name : "İlaç") + " — Stok yetersiz!"); return; }
  game.counter.push(id);
  rebuildCounterSlots();
}

// --- Ecza deposu (PC sipariş ekranı) ---
function openDepot() {
  if (!game.depotGroup) { const g = groupsWithMeds()[0]; game.depotGroup = g ? g.id : null; }
  game.depotPending = {};      // sepet her açılışta temiz
  game.depotOpen = true;
  game.pcScreen = "depot";
}
// PC'ye dokununca: doğrudan depo değil, iki butonlu ANA EKRAN
function openPc() {
  game.depotPending = {};
  game.depotOpen = true;
  game.pcScreen = "home";
}
function openUpgrades() {
  game.depotPending = {};      // depo sepetini taşıma
  game.depotOpen = true;
  game.pcScreen = "upgrades";
}
function pcHome() { game.depotPending = {}; game.pcScreen = "home"; }
function closeDepot() { game.depotOpen = false; game.depotPending = {}; game.pcScreen = "home"; }

// sepetteki adedi değiştir: 0..(maxStock - mevcut stok) aralığına clamp
function changePending(id, delta) {
  const cur = game.depotPending[id] || 0;
  const maxAdd = Math.max(0, effMaxStock() - (game.stock[id] || 0));
  game.depotPending[id] = clamp(cur + delta, 0, maxAdd);
}

// sepet toplamı (₺) — ilaç bazında alış fiyatı (cost) üzerinden
function depotOrderTotal() {
  let sum = 0;
  for (const id in game.depotPending) {
    const q = game.depotPending[id];
    if (!q) continue;
    const m = getMedicine(id);
    if (m) sum += m.cost * q;
  }
  return sum;
}

// tüm bekleyen siparişleri tek seferde uygula (para düşer, stoklar artar, sepet sıfırlanır)
function placeDepotOrder() {
  const total = depotOrderTotal();
  if (total <= 0 || game.money < total) return;
  game.money -= total;
  for (const id in game.depotPending) {
    const q = game.depotPending[id];
    if (!q) continue;
    game.stock[id] = Math.min(effMaxStock(), (game.stock[id] || 0) + q);
  }
  game.depotPending = {};
}

// --- Geliştirme satın alma ---
// Kasadan düşer, kasa negatife inemez. Vitrin seviyesi gün üretimini etkilediği için
// önden üretilmiş günler geçersiz kılınır (oynanan gün snapshot'tan okunduğu için değişmez).
function buyUpgrade(id) {
  const u = UPGRADE_BY_ID[id];
  if (!u) return false;
  const cur = upgradeLevel(id);
  if (cur >= u.maxLevel) return false;              // TAM — satın alınamaz
  const cost = upgradeCost(id, cur + 1);
  if (game.money < cost) return false;              // yetersiz bakiye
  game.money -= cost;
  game.upgrades[id] = cur + 1;
  if (id === "vitrin") invalidateDaySchedules();
  return true;
}

// gruplu kutuya tıklayınca o ilaçtan BİR adet çıkar (tek tek geri alma korunur)
function removeOneFromCounter(id) {
  if (!servingAllowed()) return;
  const idx = game.counter.lastIndexOf(id);
  if (idx < 0) return;
  game.counter.splice(idx, 1);
  rebuildCounterSlots();
}

// --- TEŞHİS: her servis/red kararında tek okunabilir blok ---
// countList: ["a","a","b"] -> "a×2, b×1" (ilaç ADI ile, id de parantezde)
function fmtCounts(ids) {
  if (!ids || !ids.length) return "(boş)";
  const order = [], n = {};
  for (const id of ids) { if (!(id in n)) { n[id] = 0; order.push(id); } n[id]++; }
  return order.map(id => {
    const m = getMedicine(id);
    return (m ? m.name : "?") + "×" + n[id] + " [" + id + "]";
  }).join(", ");
}

function explainDecision(p, given, verdict, reason) {
  if (!CONFIG.debugDecisions || !p) return;
  const r = p.request;
  const L = [];
  L.push("── KARAR · Gün " + game.dayNumber + " · " + (p.bonus ? "BONUS hasta (cheat)" : "programlı hasta"));
  if (r.type === "prescription") {
    const need = [];
    for (const it of r.items) for (let i = 0; i < it.qty; i++) need.push(it.id);
    L.push("   tip      : reçete" + (r.fake ? " (SAHTE)" : " (gerçek)") + " · karar: " + (p.decided || "—"));
    L.push("   istenen  : " + fmtCounts(need));
    L.push("   verilen  : " + fmtCounts(given));
    const known = KNOWN_DOCTORS.some(d => d.name === r.doctor);
    L.push("   doktor   : " + JSON.stringify(r.doctor) + " → defterde " + (known ? "VAR" : "YOK"));
    const today = dateRx(0);
    L.push("   kusurlar : " +
      "doktor " + (known ? "✓" : "✗") +
      " | kaşe " + (r.hasStamp === false ? "✗ (yok)" : "✓") +
      " | imza " + ((r.sig === "???" || r.sig === "—" || r.sig === "") ? "✗ " + JSON.stringify(r.sig) : "✓ " + JSON.stringify(r.sig)) +
      " | doz " + (r.items.some(it => it.qty >= 8) ? "✗ (×" + Math.max.apply(null, r.items.map(it => it.qty)) + ")" : "✓") +
      " | tarih " + (r.expired ? "✗" : "✓") + " (reçete " + r.date + " ↔ oyun " + today + ")");
    L.push("   iç bayrak: fake=" + r.fake + " flaws=[" + (r.flaws || []).join(", ") + "]");
    L.push("   tespit edilebilir kusur: " + (detectableFlawsOf(r).join(" · ") || "(yok)"));
  } else {
    const cands = MEDICINES.filter(m => m.category === r.symptom.category);
    L.push("   tip      : semptom · " + JSON.stringify(r.symptom.label) + " [kategori: " + r.symptom.category + "]");
    L.push("   kabul    : " + cands.map(m => m.name).join(", ") + "  (tek kutu, herhangi biri)");
    L.push("   verilen  : " + fmtCounts(given));
  }
  L.push("   SONUÇ    : " + verdict + " — " + reason);
  console.log(L.join("\n"));
}

// Günlük kazanç sayacına yaz — aktif bölüme (gündüz/gece) de ayrı işlenir.
function addDayMoney(delta) {
  game.dayStats.money += delta;
  if (game.phase === "night") game.dayStats.moneyNight += delta;
  else game.dayStats.moneyDay += delta;
}

function checkOrder() {
  const p = activePatient();
  if (!servingAllowed() || !p) return;
  if (game.counter.length === 0) return;

  // onaylanmış SAHTE reçeteye ilaç verme => ağır ceza (ilaç doğru olsa bile)
  if (p.request.type === "prescription" && p.request.fake) {
    game.dayStats.served++;
    game.dayStats.wrong++;
    game.money = Math.max(0, game.money - CONFIG.fakeApproveMoneyPenalty);
    addDayMoney(-CONFIG.fakeApproveMoneyPenalty);
    game.feedback = { ok: false, angry: false, text: "⚠️ Sahte reçeteye ilaç verdin!  -" + CONFIG.fakeApproveMoneyPenalty + "₺", t: 0 };
    explainDecision(p, game.counter.slice(), "YANLIŞ", "reçete SAHTE — ilaçlar doğru olsa bile onaylamak hatalı");
    loseReputation(CONFIG.fakeApproveRepLoss);
    return;
  }

  const expected = expectedMedicineIds();
  const given = game.counter.slice();

  let correct = false;
  if (p.request.type === "prescription") {
    correct = sameMultiset(expected, given);   // doğru ilaçlar + doğru adet
  } else {
    correct = given.length === 1 && expected.includes(given[0]);
  }

  game.dayStats.served++;
  if (correct) {
    // stok tüketimi — verilen her ilaç stoktan düşer (negatife inmez; ekleme zaten stokla sınırlı)
    for (const gid of given) game.stock[gid] = Math.max(0, (game.stock[gid] || 0) - 1);
    // kazanç = servis edilen ilaçların satış fiyatı toplamı (adet dahil; given id tekrarlı liste)
    let earn = 0;
    for (const gid of given) { const gm = getMedicine(gid); if (gm) earn += gm.price; }
    if (p.night) earn = Math.round(earn * CONFIG.nightPriceMultiplier);   // nöbet farkı
    game.money += earn;
    addDayMoney(earn);
    game.dayStats.correct++;
    game.reputation = clamp(game.reputation + CONFIG.repGainCorrect, CONFIG.minReputation, CONFIG.maxReputation);
    game.feedback = { ok: true, angry: false, text: "✓ Teşekkürler!  +" + earn + "₺", t: 0 };
    explainDecision(p, given, "DOĞRU", "istenen ilaç(lar) tam eşleşti (+" + earn + "₺)");
  } else {
    // yanlış ilaç: kutu açıldı sayılır — stok düşer, para GELMEZ, üstüne o ilaçların
    // alış maliyeti (cost) zarar olarak yazılır.
    let loss = 0;
    for (const gid of given) {
      game.stock[gid] = Math.max(0, (game.stock[gid] || 0) - 1);
      const gm = getMedicine(gid);
      if (gm) loss += gm.cost;
    }
    loss = Math.round(loss);
    game.money = Math.max(0, game.money - loss);
    addDayMoney(-loss);
    game.dayStats.wrong++;
    game.feedback = { ok: false, angry: false, text: "✗ Yanlış ilaç!  -" + loss + "₺", t: 0 };
    explainDecision(p, given, "YANLIŞ",
      p.request.type === "prescription"
        ? "reçete kalem/adet eşleşmedi (istenen ile verilen farklı)"
        : "verilen ilaç semptom kategorisinde değil ya da tek kutu verilmedi");
    loseReputation(CONFIG.repLossWrong);
  }
}

// feedback bitince aktif hasta çıkar (tamamlandı), sıra kayar; hedef dolduysa gün biter
function onFeedbackEnd() {
  // feedback bitiminde oyun bittiyse kuyruk kaydırma / yeni gün mantığı çalışmaz
  if (game.state === STATE.GAMEOVER) { game.feedback = null; return; }
  const done = game.queue.shift();
  game.counter = [];
  game.feedback = null;
  rebuildCounterSlots();
  if (done && done.bonus) return;          // cheat hastası: günün programına sayılmaz
  game.dayCompleted++;
  const sch = game.daySchedule;
  // gündüz bölümü bitti ve o gün nöbetçiyse: DAYEND'e gitme, gece bölümüne geç
  if (sch && game.phase === "day" && sch.nightN > 0 && game.dayCompleted >= sch.dayN) {
    beginNightShift();
    return;
  }
  if (game.dayCompleted >= patientsForDay()) endDay();
}

// Gündüz bitti → NÖBET bölümü. Kuyruk boş, kısa geçiş kartı, sahne kararır.
function beginNightShift() {
  game.phase = "night";
  game.nightIntro = 0;                       // geçiş kartı açılır (tap ya da süreyle kapanır)
  game.spawnTimer = CONFIG.spawnInterval;    // gece ilk hasta hemen dalmasın
}

function endDay() {
  game.state = STATE.DAYEND;
  game.feedback = null;
  game.dayResult = {
    goal: goalForDay(),
    met: game.dayStats.money >= goalForDay()
  };
}

// günün listesini hazırla ve sayaçları sıfırla (hedef artık bu listeden geliyor).
// Cache'teki hasta nesneleri OYNANIRKEN değişir (sabır, decided); aynı gün tekrar
// oynanabildiği için (yeni oyun) her seferinde taze kopya verilir. request paylaşılır —
// oynanış sırasında değiştirilmez, sadece okunur.
function beginDaySchedule(day) {
  const sch = getDaySchedule(day);
  game.daySchedule = Object.assign({}, sch, {
    patients: sch.patients.map(p => Object.assign({}, p))
  });
  game.dayScheduleIdx = 0;
}

function startNextDay() {
  game.dayNumber++;
  game.phase = "day";
  game.nightIntro = null;
  game.weather = weatherForDay(game.dayNumber);   // kozmetik; günde bir kez
  beginDaySchedule(game.dayNumber);
  game.spawnTimer = CONFIG.spawnInterval;
  game.daySpawned = 0;
  game.dayCompleted = 0;
  game.queue = [];
  game.counter = [];
  game.feedback = null;
  game.dayStats = { served: 0, correct: 0, wrong: 0, angry: 0, money: 0, moneyDay: 0, moneyNight: 0 };
  rebuildCounterSlots();
  game.state = STATE.PLAYING;
  spawnPatient();
}

// Geliştirmeleri Lv1'e kur. Stok ile AYNI kalıcılık yolu: yalnız startNewGame çağırır,
// startNextDay dokunmaz => günler arası korunur, DEVAM ET'te korunur, BAŞLA'da sıfırlanır.
function initUpgrades() {
  game.upgrades = {};
  for (const u of UPGRADES) game.upgrades[u.id] = 1;
  invalidateDaySchedules();
}

// Stoğu başlangıç değerine kur (her ilaç ayrı). MEDICINES dizisi değişmez; runtime obje.
function initStock() {
  game.stock = {};
  for (const m of MEDICINES) game.stock[m.id] = CONFIG.startStock;
}

// Oyunu sıfırdan kurar (MENU/GAMEOVER → PLAYING). Gün, para, itibar, STOK dahil her şey resetlenir.
function startNewGame() {
  game.money = CONFIG.startMoney;
  game.reputation = CONFIG.startReputation;
  game.dayNumber = 1;
  game.phase = "day";
  game.nightIntro = null;
  game.nightT = 0;
  game.weather = weatherForDay(1);   // kozmetik; günde bir kez
  beginDaySchedule(1);
  game.spawnTimer = 0;
  game.daySpawned = 0;
  game.dayCompleted = 0;
  game.queue = [];
  game.counter = [];
  game.feedback = null;
  game.stockToast = null;
  game.depotOpen = false;
  game.pcScreen = "home";
  game.depotPending = {};
  initUpgrades();         // geliştirmeler yalnızca yeni oyunda sıfırlanır (günler arası kalıcı)
  initStock();            // stok yalnızca yeni oyunda sıfırlanır (günler arası kalıcı)
  game.dayStats = { served: 0, correct: 0, wrong: 0, angry: 0, money: 0, moneyDay: 0, moneyNight: 0 };
  game.state = STATE.PLAYING;
  game.hasRun = true;               // menüde DEVAM ET görünebilir
  rebuildCounterSlots();
  spawnPatient();
}

// İtibar kaybını tek noktadan uygula: clamp + sıfıra inince oyun biter.
function loseReputation(amount) {
  game.reputation = clamp(game.reputation - amount, CONFIG.minReputation, CONFIG.maxReputation);
  if (game.reputation <= CONFIG.minReputation) triggerGameOver();
}

// Oyun biter: kuyruk olduğu yerde donar (update PLAYING dışında çalışmaz).
function triggerGameOver() {
  game.state = STATE.GAMEOVER;
  game.hasRun = false;              // bitmiş oyuna DEVAM ET yok
  game.feedback = null;
}

// =====================================================================
//  UPDATE
// =====================================================================
function update(dt) {
  game.clock += dt;

  // doktor defteri açılma/kapanma animasyonu
  if (game.bookState === "opening") {
    game.bookT += dt / CONFIG.bookAnimTime;
    if (game.bookT >= 1) { game.bookT = 1; game.bookState = "open"; }
  } else if (game.bookState === "closing") {
    game.bookT -= dt / CONFIG.bookAnimTime;
    if (game.bookT <= 0) { game.bookT = 0; game.bookState = "closed"; }
  }

  // gece katmanı yumuşak otursun (panel açıkken de ilerlesin; ani geçiş olmasın)
  {
    const target = (game.phase === "night" && game.state !== STATE.MENU) ? 1 : 0;
    const step = dt / Math.max(0.01, CONFIG.nightFadeTime);
    if (game.nightT < target) game.nightT = Math.min(target, game.nightT + step);
    else if (game.nightT > target) game.nightT = Math.max(target, game.nightT - step);
  }

  // depo paneli açıkken oyun donsun (sabır/spawn/feedback işlemesin) — clock akmaya devam eder
  if (game.depotOpen) return;

  // "NÖBET BAŞLIYOR" kartı açıkken oyun donar (depo paneliyle aynı kalıp)
  if (game.nightIntro !== null) {
    game.nightIntro += dt;
    if (game.nightIntro >= CONFIG.nightIntroDuration) game.nightIntro = null;
    return;
  }

  if (game.state !== STATE.PLAYING) return;

  // hasta spawn — günün hedef müşteri sayısı kadar üret, kuyruk doluysa bekle
  const goalN = patientsForDay();
  game.spawnTimer += dt;
  const prog = goalN > 0 ? game.dayCompleted / goalN : 0;       // gün ilerledikçe hızlan
  const interval = lerp(CONFIG.spawnInterval, CONFIG.minSpawnInterval, prog);
  if (game.spawnTimer >= interval && game.queue.length < effMaxQueue() && game.daySpawned < goalN) {
    game.spawnTimer = 0;
    spawnPatient();
  }

  // pozisyon + giriş animasyonları
  for (let i = 0; i < game.queue.length; i++) {
    const p = game.queue[i];
    p.posCurrent += (i - p.posCurrent) * Math.min(1, dt * 10);
    if (p.enterT < CONFIG.patientEnterTime) p.enterT += dt;
  }

  // sabır + feedback
  if (game.feedback) {
    game.feedback.t += dt;
    if (game.feedback.t >= CONFIG.feedbackDuration) onFeedbackEnd();
  } else {
    for (let i = 0; i < game.queue.length; i++) {
      const p = game.queue[i];
      let rate = i === 0 ? 1 : CONFIG.queuePatienceMultiplier;
      // reçete inceleme fazında aktif hastanın sabrı DONUK (acele baskısı yok)
      if (i === 0 && p.request.type === "prescription" && !p.decided) rate = 0;
      p.patience -= dt * rate;
    }
    const act = activePatient();
    if (act && act.patience <= 0) {
      act.patience = 0;
      game.dayStats.angry++;
      game.feedback = { ok: false, angry: true, text: "😠 Çok beklettin!", t: 0 };
      loseReputation(CONFIG.angryRepLoss);
    }
  }
}

// =====================================================================
//  RENDER YARDIMCILARI
// =====================================================================
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fillRoundRect(x, y, w, h, r, color) {
  roundRect(x, y, w, h, r);
  ctx.fillStyle = color;
  ctx.fill();
}
function strokeRoundRect(x, y, w, h, r, color, lineW) {
  roundRect(x, y, w, h, r);
  ctx.lineWidth = lineW;
  ctx.strokeStyle = color;
  ctx.stroke();
}
// Büfeci tarzı koyu yarı saydam panel: yumuşak gölge + ince amber kenarlık
function drawPanel(x, y, w, h, r, fill, border) {
  const c = CONFIG.colors;
  ctx.save();
  ctx.shadowColor = c.panelShadow;
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 5;
  fillRoundRect(x, y, w, h, r, fill || c.panelBg);
  ctx.restore();
  strokeRoundRect(x, y, w, h, r, border || c.panelBorder, Math.max(1, w * 0.004));
}
function text(str, x, y, size, color, align, weight) {
  ctx.fillStyle = color;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  ctx.font = (weight || "600") + " " + size + "px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.fillText(str, x, y);
}

// =====================================================================
//  RENDER — bölümler
// =====================================================================
function drawBackground() {
  const w = layout.w, h = layout.h;
  Sprite.draw(ctx, "bg_pharmacy", 0, 0, w, h, (ctx, x, y, bw, bh) => {
    const g = ctx.createLinearGradient(0, 0, 0, bh);
    g.addColorStop(0, CONFIG.colors.bgTop);
    g.addColorStop(0.5, CONFIG.colors.bg);
    g.addColorStop(1, CONFIG.colors.bg);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, bw, bh);
  }, "cover");
}

// Retro kart HUD (Büfeci düzeni): iki koyu, kalın kenarlıklı iki satırlı kutu + ortada EV.
// SOL: [GÜN N | tarih] / [HAVA ADI | hava emojisi] — SAĞ: [😊 | %N] / [💵 | 1.100₺]
function drawHUD() {
  const hud = layout._hud;
  const c = CONFIG.colors;
  const r = hud.h * 0.16;                    // köşeli-yumuşak
  const bw = Math.max(2, hud.h * 0.055);     // kalın retro kenarlık

  const retroBox = (bx, bwid) => {
    ctx.save();
    ctx.shadowColor = c.panelShadow; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    fillRoundRect(bx, hud.y, bwid, hud.h, r, c.panelBgSolid);
    ctx.restore();
    strokeRoundRect(bx, hud.y, bwid, hud.h, r, c.panelBorder, bw);
  };

  const y1 = hud.y + hud.h * 0.30;   // üst satır
  const y2 = hud.y + hud.h * 0.71;   // alt satır
  const fs1 = hud.h * 0.26, fs2 = hud.h * 0.23;

  // SOL kutu: satır1 solda GÜN, sağda tarih (emojisiz); satır2 solda hava adı, sağda hava emojisi
  const lw = hud.w * 0.36;
  const lpad = lw * 0.09;
  retroBox(hud.x, lw);
  const wtr = game.weather || WEATHERS[0];
  text("GÜN " + game.dayNumber, hud.x + lpad, y1, fs1, c.neon, "left", "800");
  fitText(dateShort(), hud.x + lw - lpad, y1, lw * 0.46, fs2 * 0.9, c.creamSoft, "right", "700");
  fitText(wtr[0], hud.x + lpad, y2, lw * 0.60, fs2, c.creamSoft, "left", "800");
  text(wtr[1], hud.x + lw - lpad, y2, fs2, "#000", "right", "400");

  // SAĞ kutu: satır1 solda itibar emojisi, sağda %N; satır2 solda 💵, sağda para
  const rw = hud.w * 0.36;
  const rx = hud.x + hud.w - rw;
  const rpad = rw * 0.09;
  retroBox(rx, rw);
  const pct = clamp(Math.round(game.reputation), 0, 100);
  const repEmoji = pct < 35 ? "😡" : pct < 70 ? "😑" : "😊";
  text(repEmoji, rx + rpad, y1, fs1, "#000", "left", "400");
  text("%" + pct, rx + rw - rpad, y1, fs1, c.neon, "right", "800");
  text("💵", rx + rpad, y2, fs2, "#000", "left", "400");
  fitText(formatMoney(game.money), rx + rw - rpad, y2, rw * 0.64, fs2, "#8fe3a8", "right", "800");

  // NÖBET rozeti — sol kutu ile EV butonu arasındaki boşlukta (HUD düzeni değişmez).
  // Nöbet günü boyunca durur; gece bölümünde dolgusu parlar.
  if (isNightDutyDay(game.dayNumber)) {
    // Rozet, sol kutu ile EV butonu arasındaki BOŞLUĞA sığdırılır (ikisine de binmez).
    const homeS = hud.h * 0.78;                       // EV butonu ölçüsü (aşağıda aynısı)
    const gapL = hud.x + lw;                          // sol kutunun sağ kenarı
    const gapR = hud.x + hud.w / 2 - homeS / 2;       // EV butonunun sol kenarı
    const bs = Math.min(hud.h * 0.56, Math.max(0, gapR - gapL) * 0.78);
    const bx = gapL + ((gapR - gapL) - bs) / 2;       // boşlukta ortala
    const by = hud.y + (hud.h - bs) / 2;
    if (bs > hud.h * 0.18) {
    const on = game.phase === "night";
    ctx.save();
    ctx.globalAlpha = on ? 1 : 0.75;
    fillRoundRect(bx, by, bs, bs, bs * 0.30, on ? "rgba(96, 78, 168, 0.95)" : "rgba(40, 34, 68, 0.85)");
    strokeRoundRect(bx, by, bs, bs, bs * 0.30, on ? "#c9b6ff" : "rgba(160, 140, 235, 0.7)", Math.max(1.5, bs * 0.07));
    text("🌙", bx + bs / 2, by + bs / 2 + bs * 0.03, bs * 0.56, "#000", "center", "400");
    ctx.restore();
    }
  }

  // ORTA: kare EV butonu — menüye döner (oyun verisi silinmez)
  const hs = hud.h * 0.78;
  const hx = hud.x + hud.w / 2 - hs / 2;
  const hy = hud.y + (hud.h - hs) / 2;
  layout.homeBtn = { x: hx, y: hy, w: hs, h: hs };
  ctx.save();
  ctx.shadowColor = c.panelShadow; ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
  fillRoundRect(hx, hy, hs, hs, hs * 0.18, c.panelBgSolid);
  ctx.restore();
  strokeRoundRect(hx, hy, hs, hs, hs * 0.18, c.panelBorder, Math.max(2, hs * 0.06));
  // emoji tam merkez + minik optik offset (emoji baseline'ı hafif yukarı render olur)
  text("🏠", hx + hs / 2, hy + hs / 2 + hs * 0.03, hs * 0.48, "#000", "center", "400");
}

// ---- kuyruk yerleşimi: pozisyon değerini sahne koordinatına çevir ----
//  Aktif müşteri: DEV, ortada, tezgah bandının ardına göğüsten gömülü.
//  Bekleyenler: görünmez (tezgahın altında); öne gelince banttan yükselir.
function slotLayout(i) {
  const S = layout.stage;
  const counterLine = layout._counterLine;
  // reçeteli aktif hastada sol panel açılır => müşteri küçülüp sağa kayar
  const ap = activePatient();
  const presc = !!(ap && ap.request.type === "prescription");
  const cx = presc ? S.x + S.w * 0.745 : S.x + S.w * 0.5;
  const charH = presc ? S.h * 0.40 : S.h * 0.675;
  if (i <= 0) {
    return {
      cx,
      baseY: presc ? counterLine + S.h * 0.13 : counterLine + S.h * 0.345,
      charH,
      alpha: 1,
      active: 1
    };
  }
  // bekleyen: aynı konumda ama tezgahın altında ve görünmez (öne gelince yükselir)
  return {
    cx,
    baseY: counterLine + S.h * 0.55,
    charH,
    alpha: 0,
    active: 0
  };
}
function getPatientLayout(pos) {
  const i0 = Math.floor(pos), f = pos - i0;
  const a = slotLayout(i0), b = slotLayout(i0 + 1);
  return {
    cx: lerp(a.cx, b.cx, f),
    baseY: lerp(a.baseY, b.baseY, f),
    charH: lerp(a.charH, b.charH, f),
    alpha: lerp(a.alpha, b.alpha, f),
    active: lerp(a.active, b.active, f)
  };
}

// şeffaf karakterler için yumuşak, sıcak elips zemin gölgesi
function drawGroundShadow(cx, cy, rx, ry) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, "rgba(70, 45, 25, 0.38)");
  g.addColorStop(0.55, "rgba(70, 45, 25, 0.18)");
  g.addColorStop(1, "rgba(70, 45, 25, 0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, rx, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Sabır barı ÇİZİLMİYOR (görsel olarak gizli) — sabır sistemi aynen işler:
// update() azaltır, biten hasta küser, itibar düşer, reçete incelemede donar.
// Konsoldan takip: cheats.setPatience(n) ve cheats.state().activePatience

function drawOnePatient(p) {
  const counterLine = layout._counterLine;
  const L = getPatientLayout(p.posCurrent);
  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const ease = 1 - Math.pow(1 - enter, 3);
  const alpha = L.alpha * ease;

  const ratio = clamp(p.patience / p.maxPatience, 0, 1);
  // sabır azaldıkça hafif titreme (kızgınlık)
  let dx = 0;
  if (ratio < 0.35) dx = Math.sin(game.clock * 24) * L.charH * 0.018 * (1 - ratio / 0.35);

  const cx = L.cx + dx;
  const charH = L.charH;

  ctx.globalAlpha = alpha;

  // 1) zemin gölgesi (tezgah çizgisinde, karakterin yere/tezgaha bastığı his)
  drawGroundShadow(cx, counterLine - charH * 0.012, charH * 0.34, charH * 0.075);

  // 2) karakter — şeffaf PNG, contain (oran korunur, gerilme/kırpma yok)
  //    Kutu kare; 3:4 karakter yükseklikten sınırlanır => yatayda ortalı oturur.
  const boxX = cx - charH / 2;
  const boxY = L.baseY - charH;
  Sprite.draw(ctx, p.avatarKey, boxX, boxY, charH, charH, () => {
    text(p.avatar, cx, L.baseY - charH * 0.5, charH * 0.82, "#000", "center", "400");
  }, "contain");

  ctx.globalAlpha = 1;
  // (sabır barı bilinçli olarak çizilmiyor; sabır mantığı update()'te aynen işler)
}

// semptomlu hasta — baş üstü konuşma balonu (reçetelilerde sol panel kullanılır)
function drawSymptomBubble(p) {
  const area = layout._patientArea;
  const counterLine = layout._counterLine;
  const areaH = counterLine - area.y;
  const L = getPatientLayout(p.posCurrent);
  if (L.active < 0.12) return;

  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const a = L.active * (1 - Math.pow(1 - enter, 3));
  const headTop = L.baseY - L.charH;
  const cx = L.cx;

  const bubbleW = Math.min(area.w * 0.72, areaH * 1.5);
  const bubbleH = areaH * 0.25;
  let bubbleY = headTop - areaH * 0.03 - bubbleH;
  if (bubbleY < area.y) bubbleY = area.y;
  const bubbleX = cx - bubbleW / 2;
  ctx.globalAlpha = a;
  drawSpeechBubble(bubbleX, bubbleY, bubbleW, bubbleH, cx, bubbleY + bubbleH);
  drawSymptom(p.request.symptom, bubbleX, bubbleY, bubbleW, bubbleH);
  ctx.globalAlpha = 1;
}

// reçeteli hasta — baş üstü kısa replik balonu (replik spawn'da seçilir, p.line).
// Reçete paneli SOLDA (stage %4-46); balon hastanın üstünde sağda, panele girmez.
function drawPrescriptionBubble(p) {
  if (!p.line) return;
  const area = layout._patientArea;
  const S = layout.stage;
  const L = getPatientLayout(p.posCurrent);
  if (L.active < 0.12) return;
  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const a = L.active * (1 - Math.pow(1 - enter, 3));

  const bubbleW = S.w * 0.42, bubbleH = S.h * 0.072;
  let bx = L.cx - bubbleW / 2;
  bx = Math.min(bx, S.x + S.w * 0.97 - bubbleW);   // sağdan taşmasın
  bx = Math.max(bx, S.x + S.w * 0.48);             // reçete panelinin (sağ kenar %46) sağında kal
  const headTop = L.baseY - L.charH;
  let by = headTop - bubbleH - S.h * 0.015;
  if (by < area.y) by = area.y;
  const tailX = clamp(L.cx, bx + bubbleW * 0.15, bx + bubbleW * 0.85);

  ctx.globalAlpha = a;
  drawSpeechBubble(bx, by, bubbleW, bubbleH, tailX, by + bubbleH);
  fitText(p.line, bx + bubbleW / 2, by + bubbleH / 2, bubbleW * 0.88, bubbleH * 0.30, "#3a3326", "center", "700");
  ctx.globalAlpha = 1;
}

// reçeteli hasta — stage SOL ÜST köşesinde, sabit makul boyutlu DÜZ reçete paneli
function drawPrescriptionPanel(p) {
  const S = layout.stage;
  const area = layout._patientArea;
  const L = getPatientLayout(p.posCurrent);
  if (L.active < 0.12) return;
  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const a = L.active * (1 - Math.pow(1 - enter, 3));

  const w = S.w * 0.42;
  const h = Math.min(S.h * 0.40, area.h * 0.94);
  const x = S.x + S.w * 0.04;
  const top = area.y + S.h * 0.006;
  drawPrescriptionPaper(p, x + w / 2, top, w, h, a);
}

function drawQueue() {
  const area = layout._patientArea;
  const counterLine = layout._counterLine;
  if (game.queue.length === 0) {
    text("🚪 Müşteri bekleniyor...", area.x + area.w / 2, area.y + area.h * 0.6,
      area.h * 0.06, CONFIG.colors.cream, "center", "600");
    return;
  }
  // Sadece AKTİF müşteriyi çiz; tezgah çizgisinde kırp (göğüsten gömülü).
  // Bekleyenler görünmez (banttan yükselerek öne gelirler).
  ctx.save();
  ctx.beginPath();
  ctx.rect(area.x, area.y - area.h * 0.2, area.w, counterLine - (area.y - area.h * 0.2));
  ctx.clip();
  drawOnePatient(game.queue[0]);
  ctx.restore();

  // reçeteli => sol büyük panel + baş üstü replik balonu; semptomlu => baş üstü balon
  const p0 = game.queue[0];
  if (p0.request.type === "prescription") {
    drawPrescriptionPanel(p0);
    drawPrescriptionBubble(p0);
  } else {
    drawSymptomBubble(p0);
  }
  // (bekleyen "+N" rozeti kaldırıldı — kuyruk bilgisi oyuncuya sızdırılmıyor)
}

// tezgahta duran kapalı defter (yalnız bookState === "closed" iken)
function drawClosedBook() {
  if (game.bookState !== "closed") return;
  const b = layout.bookClosedRect;
  if (!b) return;
  // yumuşak zemin gölgesi (tezgaha yaslanmış his)
  drawGroundShadow(b.x + b.w / 2, b.y + b.h * 0.96, b.w * 0.5, b.h * 0.16);
  Sprite.draw(ctx, "doctor_book_closed", b.x, b.y, b.w, b.h, () => {
    // fallback: koyu kapalı defter + "Doktorlar"
    fillRoundRect(b.x, b.y, b.w, b.h, b.h * 0.18, "#6b4a2f");
    strokeRoundRect(b.x, b.y, b.w, b.h, b.h * 0.18, "rgba(245,200,140,0.5)", 2);
    text("📕 Doktorlar", b.x + b.w / 2, b.y + b.h / 2, b.h * 0.42, "#f8ecd9", "center", "800");
  }, "contain");
}

// açık defterin ekran ortasındaki hedef dikdörtgeni (contain)
function openBookBox() {
  const S = layout.stage;
  const boxW = S.w * 0.94, boxH = S.h * 0.64;
  const boxX = S.x + (S.w - boxW) / 2, boxY = S.y + (S.h - boxH) / 2;
  const img = Assets.images["doctor_book"];
  const aspect = (img && img.naturalWidth) ? (img.naturalWidth / img.naturalHeight) : 1.5;
  let dw, dh;
  if (boxW / boxH > aspect) { dh = boxH; dw = dh * aspect; } else { dw = boxW; dh = dw / aspect; }
  return { x: boxX + (boxW - dw) / 2, y: boxY + (boxH - dh) / 2, w: dw, h: dh };
}

// açık defter içeriği — 20 doktor, iki sütun; her isim kağıttaki ÇİZGİNİN üstüne
// oturur (baseline çizgide). Hiza CONFIG.bookTextStartY / bookLineStep ile elle ayarlanır
// (ikisi de kitap yüksekliğine oran). Başlık kitabın DIŞINDA (drawBookOverlay'de plaka).
function drawBookContent(r) {
  const ink = "#3a3326";
  const names = KNOWN_DOCTORS.map(d => d.name).slice().sort((a, b) => a.localeCompare(b, "tr"));
  const perCol = Math.ceil(names.length / 2);
  const startY = r.y + r.h * CONFIG.bookTextStartY;
  const step = r.h * CONFIG.bookLineStep;
  const colX = [r.x + r.w * 0.15, r.x + r.w * 0.55];   // sol/sağ sayfa iç kenarları
  const colW = r.w * 0.30;
  const fsMax = step * 0.52;
  ctx.save();
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";           // baseline = kağıt çizgisi
  ctx.fillStyle = ink;
  for (let i = 0; i < names.length; i++) {
    const col = i < perCol ? 0 : 1;
    const rowI = i % perCol;
    const ny = startY + rowI * step;
    // sütuna sığdır: punto gerekirse hafif küçülür, taşma yok
    let s = fsMax;
    ctx.font = "600 " + s + "px " + RX_FONT;
    while (s > 6 && ctx.measureText(names[i]).width > colW) { s -= 0.5; ctx.font = "600 " + s + "px " + RX_FONT; }
    ctx.fillText(names[i], colX[col], ny);
  }
  ctx.restore();
}

// açık defter çizim yardımcısı (contain + krem fallback)
function drawOpenBookImage(r) {
  Sprite.draw(ctx, "doctor_book", r.x, r.y, r.w, r.h, () => {
    fillRoundRect(r.x, r.y, r.w, r.h, r.w * 0.03, "#efe2c8");
    strokeRoundRect(r.x, r.y, r.w, r.h, r.w * 0.03, "rgba(120,90,50,0.5)", 2);
    ctx.strokeStyle = "rgba(120,90,50,0.35)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(r.x + r.w / 2, r.y + r.h * 0.06); ctx.lineTo(r.x + r.w / 2, r.y + r.h * 0.94); ctx.stroke();
  }, "contain");
}

// açılma/kapanma animasyonu + açık panel (en üstte)
function drawBookOverlay() {
  if (game.bookState === "closed") return;
  // eased ilerleme
  const t = game.bookT;
  const prog = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  // arka karartma (modal)
  ctx.fillStyle = "rgba(8,6,12," + (0.6 * prog).toFixed(3) + ")";
  ctx.fillRect(0, 0, layout.w, layout.h);

  const start = layout.bookClosedRect;
  const end = openBookBox();
  const cur = {
    x: lerp(start.x, end.x, prog),
    y: lerp(start.y, end.y, prog),
    w: lerp(start.w, end.w, prog),
    h: lerp(start.h, end.h, prog)
  };

  if (game.bookState === "open") {
    // tam açık: net açık defter + içerik + kapatma
    drawOpenBookImage(end);
    drawBookContent(end);
    // "Tanınan Doktorlar" başlığı — kitabın DIŞINDA, üst kenarın hemen üstünde krem plaka
    const plW = end.w * 0.56, plH = end.h * 0.075;
    const plX = end.x + (end.w - plW) / 2;
    const plY = end.y - plH - end.h * 0.015;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    fillRoundRect(plX, plY, plW, plH, plH * 0.35, "#f6efdd");
    ctx.restore();
    strokeRoundRect(plX, plY, plW, plH, plH * 0.35, "rgba(120,90,50,0.5)", 2);
    fitText("Tanınan Doktorlar", plX + plW / 2, plY + plH / 2, plW * 0.9, plH * 0.48, "#3a3326", "center", "800");
    layout.bookBox = end;
    const cs = layout.stage.w * 0.085;
    layout.bookCloseBtn = { x: end.x + end.w - cs * 0.85, y: end.y - cs * 0.35, w: cs, h: cs };
    const cb = layout.bookCloseBtn;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    ctx.beginPath(); ctx.arc(cb.x + cb.w / 2, cb.y + cb.h / 2, cb.w / 2, 0, Math.PI * 2);
    ctx.fillStyle = "#3a2230"; ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "#e8736b"; ctx.lineWidth = Math.max(2, cs * 0.06);
    ctx.beginPath(); ctx.arc(cb.x + cb.w / 2, cb.y + cb.h / 2, cb.w / 2, 0, Math.PI * 2); ctx.stroke();
    text("✕", cb.x + cb.w / 2, cb.y + cb.h / 2, cs * 0.5, "#e8736b", "center", "800");
  } else {
    // geçiş (opening/closing): kapalı defter fade-out, açık defter fade-in (crossfade + scale)
    ctx.globalAlpha = 1 - prog;
    Sprite.draw(ctx, "doctor_book_closed", cur.x, cur.y, cur.w, cur.h, () => {
      fillRoundRect(cur.x, cur.y, cur.w, cur.h, cur.h * 0.18, "#6b4a2f");
    }, "contain");
    ctx.globalAlpha = prog;
    drawOpenBookImage(cur);
    ctx.globalAlpha = 1;
  }
}

// --- GECE KATMANI ---
// Yeni asset yok: mevcut sahnenin üzerine koyu mavi/mor bir katman + tezgahta sıcak ışık.
// drawBackground'ın hemen ardından çizilir; hasta/tezgah/UI üstte kalır (lambanın altı).
function drawNightOverlay() {
  const t = game.nightT || 0;
  if (t <= 0.002) return;
  const w = layout.w, h = layout.h;

  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  ctx.globalAlpha = 0.66 * t;
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#2a2560");      // üstte gece mavisi
  g.addColorStop(0.55, "#3b2f6b");   // ortada mor
  g.addColorStop(1, "#4a3a70");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();

  // tezgah aydınlatması sıcak kalsın — bandın üstüne yumuşak amber hâle
  const b = layout._band;
  if (b) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.30 * t;
    const cx = b.x + b.w / 2, cy = b.y;
    const rad = Math.max(b.w * 0.75, b.h * 3);
    const rg = ctx.createRadialGradient(cx, cy, b.h * 0.15, cx, cy, rad);
    rg.addColorStop(0, "rgba(255, 196, 120, 0.95)");
    rg.addColorStop(0.55, "rgba(255, 170, 80, 0.28)");
    rg.addColorStop(1, "rgba(255, 160, 70, 0)");
    ctx.fillStyle = rg;
    ctx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
    ctx.restore();
  }
}

// --- "NÖBET BAŞLIYOR" geçiş kartı --- (mevcut kart dili: koyu panel + amber şerit)
function drawNightIntro() {
  if (game.nightIntro === null || game.nightIntro === undefined) return;
  const c = CONFIG.colors, S = layout.stage;
  const dur = CONFIG.nightIntroDuration;
  const t = clamp(game.nightIntro / dur, 0, 1);
  // kısa fade-in / fade-out (ani girip ani çıkmasın)
  const a = clamp(Math.min(game.nightIntro / 0.25, (dur - game.nightIntro) / 0.35), 0, 1);

  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = "rgba(10, 8, 24, 0.62)";
  ctx.fillRect(0, 0, layout.w, layout.h);

  const cardW = S.w * 0.74, cardH = S.h * 0.20;
  const cardX = S.x + (S.w - cardW) / 2;
  const cardY = S.y + (S.h - cardH) / 2;
  const cr = cardW * 0.08;
  drawPanel(cardX, cardY, cardW, cardH, cr, c.panelBgSolid);

  const headerH = cardH * 0.34;
  ctx.save();
  roundRect(cardX, cardY, cardW, cardH, cr);
  ctx.clip();
  ctx.fillStyle = "#4a3a86";                      // gece moru şerit
  ctx.fillRect(cardX, cardY, cardW, headerH);
  ctx.restore();
  fitText("🌙 NÖBET BAŞLIYOR", cardX + cardW / 2, cardY + headerH / 2, cardW * 0.86, headerH * 0.50,
    "#f0e6ff", "center", "800");

  const sch = game.daySchedule;
  const n = sch ? sch.nightN : 0;
  fitText(n + " gece hastası bekleniyor", cardX + cardW / 2, cardY + headerH + (cardH - headerH) * 0.34,
    cardW * 0.84, cardH * 0.115, c.cream, "center", "700");
  fitText("Sahte reçete girişimi artar — dikkatli incele", cardX + cardW / 2,
    cardY + headerH + (cardH - headerH) * 0.66, cardW * 0.86, cardH * 0.095, c.creamSoft, "center", "600");
  ctx.restore();
}

// Krem/açık zeminli kuyruklu konuşma balonu (Büfeci kalıbı) — semptom + reçete replikleri
function drawSpeechBubble(x, y, w, h, tailX, tailBaseY) {
  const paper = "#f6efdd";
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.28)";
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 4;
  fillRoundRect(x, y, w, h, h * 0.20, paper);
  ctx.beginPath();
  ctx.moveTo(tailX - w * 0.06, tailBaseY - 2);
  ctx.lineTo(tailX + w * 0.02, tailBaseY + h * 0.14);
  ctx.lineTo(tailX + w * 0.06, tailBaseY - 2);
  ctx.closePath();
  ctx.fillStyle = paper;
  ctx.fill();
  ctx.restore();
  strokeRoundRect(x, y, w, h, h * 0.20, "rgba(120,90,50,0.45)", Math.max(1.5, w * 0.006));
}

// Bir metni verilen maxW'ye sığacak şekilde küçülterek çiz (taşmayı önler).
const RX_FONT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
function fitText(str, x, y, maxW, px, color, align, weight) {
  let s = px;
  const wgt = weight || "600";
  ctx.font = wgt + " " + s + "px " + RX_FONT;
  while (s > 6 && ctx.measureText(str).width > maxW) {
    s -= 0.5;
    ctx.font = wgt + " " + s + "px " + RX_FONT;
  }
  ctx.fillStyle = color;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  ctx.fillText(str, x, y);
  return s;
}

// Metni SABİT puntoyla verilen genişliğe sığdır: taşarsa sonunu "…" ile kısalt.
// (fitText'in aksine font küçültmez; sütunlu listelerde satırlar aynı boyda kalır)
function ellipsisText(str, x, y, maxW, px, color, align, weight) {
  const wgt = weight || "600";
  ctx.font = wgt + " " + px + "px " + RX_FONT;
  let s = str;
  if (ctx.measureText(s).width > maxW) {
    while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
    s += "…";
  }
  ctx.fillStyle = color;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  ctx.fillText(s, x, y);
}

// Reçete kağıdı: kod ile çizilen DÜZ, temiz krem panel + dinamik içerik.
// Tüm içerik iç padding içinde kalır (taşma yok; gerekirse font küçülür).
// Sabit yükseklikli reçete kağıdı (krem zemin + dinamik içerik).
function drawPrescriptionPaper(p, cx, top, w, h, alpha) {
  const items = p.request.items;
  const x = cx - w / 2, y = top;
  const r = Math.min(w, h) * 0.05;
  ctx.save();
  ctx.globalAlpha = alpha;

  // kağıt zemini — krem + yumuşak gölge + ince kenar
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.28)";
  ctx.shadowBlur = h * 0.05;
  ctx.shadowOffsetY = h * 0.015;
  fillRoundRect(x, y, w, h, r, "#f6efdd");
  ctx.restore();
  strokeRoundRect(x, y, w, h, r, "rgba(120,90,50,0.35)", Math.max(1, w * 0.006));

  // içeriği kağıt iç alanına kırp
  const padX = w * 0.09, padY = h * 0.06;
  const lx = x + padX, rx = x + w - padX;
  const innerW = rx - lx;
  ctx.save();
  roundRect(x + w * 0.03, y + h * 0.03, w * 0.94, h * 0.94, r);
  ctx.clip();

  const ink = "#3a3326", inkSoft = "#8a7c5e";
  const req = p.request;

  // Medula terminali: İNCELENECEK alanın arkasına nötr (mavi) vurgu. Kasıtlı olarak
  // uyarı rengi DEĞİL — işaret "kusur bulundu" değil "buraya bak" demeli; gerçek
  // reçetelerde de aynı sayıda işaret çıkar.
  const marks = medulaMarks(req);
  const markBg = (mx, my, mw, mh) => {
    fillRoundRect(mx, my, mw, mh, mh * 0.30, "rgba(70, 130, 200, 0.20)");
    ctx.save();
    ctx.setLineDash([Math.max(2, h * 0.012), Math.max(2, h * 0.010)]);
    strokeRoundRect(mx, my, mw, mh, mh * 0.30, "rgba(45, 95, 160, 0.80)", Math.max(1, h * 0.0035));
    ctx.restore();
  };

  // üst: kaşe (✚) + doktor adı + tarih
  const headY = y + padY + h * 0.045;
  // tarih — sahte/eski olsa da renkle ele vermez; oyuncu tarihi OKUYUP anlamalı
  if (marks.includes("date")) markBg(rx - innerW * 0.34, headY - h * 0.033, innerW * 0.34, h * 0.066);
  fitText(req.date, rx, headY, innerW * 0.34, h * 0.05, inkSoft, "right", "600");
  // kaşe rozeti (gerçeklerde HER ZAMAN çizilir; no_stamp kusurunda HİÇ çizilmez)
  let docX = lx;
  if (marks.includes("stamp")) {
    // kaşe varsa rozetin, yoksa olması gereken boşluğun çevresi işaretlenir
    const br = h * 0.052;
    markBg(lx - br * 0.15, headY - br * 1.15, br * 2.3, br * 2.3);
  }
  if (req.hasStamp !== false) {
    const br = h * 0.052;
    const bx = lx + br, by = headY;
    ctx.save();
    ctx.strokeStyle = "#2e7d32"; ctx.lineWidth = Math.max(1.2, h * 0.006);
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    text("✚", bx, by + h * 0.002, br * 1.5, "#2e7d32", "center", "800");
    docX = lx + br * 2 + w * 0.025;
  }
  if (marks.includes("doctor")) markBg(docX - w * 0.012, headY - h * 0.036, (rx - innerW * 0.36) - docX + w * 0.024, h * 0.072);
  fitText(req.doctor, docX, headY, (rx - innerW * 0.36) - docX, h * 0.052, ink, "left", "700");

  // ayraç
  ctx.strokeStyle = "rgba(120,90,50,0.35)";
  ctx.lineWidth = Math.max(1, h * 0.005);
  const sep1 = y + padY + h * 0.11;
  ctx.beginPath(); ctx.moveTo(lx, sep1); ctx.lineTo(rx, sep1); ctx.stroke();

  // orta: ilaç listesi (renk noktası + ad + adet)
  const listTop = sep1 + h * 0.03;
  const listBot = y + h - padY - h * 0.14;
  const lineH = Math.min(h * 0.13, (listBot - listTop) / Math.max(1, items.length));
  const fs = Math.min(lineH * 0.55, h * 0.062);
  const qtyW = innerW * 0.20;
  let ly = listTop + lineH * 0.5;
  for (const it of items) {
    const m = getMedicine(it.id);
    const dotR = fs * 0.36;
    ctx.beginPath();
    ctx.arc(lx + dotR, ly, dotR, 0, Math.PI * 2);
    ctx.fillStyle = m.color; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.18)"; ctx.lineWidth = 1; ctx.stroke();
    // adet renkle ele vermez; ×8/×10 yine yazılır ama normal renkte (oyuncu mantığı yakalar)
    if (marks.includes("qty") && items.indexOf(it) === (req.hintQty || 0)) {
      markBg(rx - qtyW, ly - fs * 0.75, qtyW, fs * 1.5);
    }
    fitText("× " + it.qty, rx, ly, qtyW, fs, ink, "right", "800");
    const nameX = lx + dotR * 2 + fs * 0.5;
    fitText(m.name, nameX, ly, rx - qtyW - fs * 0.5 - nameX, fs, ink, "left", "600");
    ly += lineH;
  }

  // alt: ince ayraç + küçük italik imza
  const sep2 = y + h - padY - h * 0.10;
  ctx.strokeStyle = "rgba(120,90,50,0.28)";
  ctx.lineWidth = Math.max(1, h * 0.004);
  ctx.beginPath(); ctx.moveTo(lx, sep2); ctx.lineTo(rx, sep2); ctx.stroke();

  let sg = h * 0.06;
  ctx.font = "italic 700 " + sg + "px 'Segoe Script','Snell Roundhand','Brush Script MT',cursive";
  while (sg > 7 && ctx.measureText(p.request.sig).width > innerW * 0.55) {
    sg -= 0.5;
    ctx.font = "italic 700 " + sg + "px 'Segoe Script','Snell Roundhand','Brush Script MT',cursive";
  }
  // Medula açıklaması — işaretin ne anlama geldiğini net söyler (bulgu değil, görev)
  if (marks.length) {
    fitText("🖥️ Medula: işaretli alanı kontrol et", lx, sep2 + h * 0.055, innerW * 0.42, h * 0.036,
      "rgba(45, 95, 160, 0.95)", "left", "700");
  }
  if (marks.includes("sig")) markBg(rx - innerW * 0.58, sep2 + h * 0.055 - h * 0.036, innerW * 0.58, h * 0.072);
  ctx.fillStyle = inkSoft;
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.fillText(p.request.sig, rx, sep2 + h * 0.055);

  ctx.restore();   // içerik kırpması
  ctx.restore();   // ana
}

// semptom balonu içeriği — açık zemin üstüne koyu mürekkep
function drawSymptom(symptom, x, y, w, h) {
  const ink = "#3a3326";
  text(symptom.emoji, x + w / 2, y + h * 0.40, h * 0.42, "#000", "center", "400");
  fitText(symptom.label, x + w / 2, y + h * 0.80, w * 0.86, h * 0.155, ink, "center", "700");
}

// Sekme içeriğini (emoji + metin, bir grup olarak) kutunun yatay/dikey TAM ortasına çiz.
// Emoji'nin advance'ı yanlış ölçüldüğü için sabit bir emoji genişliği varsayıp grubu elle ortalar.
function drawTabLabel(emoji, label, cx, cy, maxW, fs, color, weight) {
  let s = fs, emojiW, gapE, textW, total;
  const measure = () => {
    ctx.font = weight + " " + s + "px " + RX_FONT;
    textW = ctx.measureText(label).width;   // düz metin doğru ölçülür
    emojiW = s * 1.05;                       // emoji ~1em (sabit tahmin)
    gapE = s * 0.28;
    total = emojiW + gapE + textW;
  };
  measure();
  while (s > 7 && total > maxW) { s -= 0.5; measure(); }  // sığmazsa küçült

  const startX = cx - total / 2;             // grubu yatayda ortala
  ctx.fillStyle = color;
