"use strict";

// =====================================================================
//  CONFIG — tüm sayısal ayarlar burada
// =====================================================================
const CONFIG = {
  // startMoney: MEDICINES ortalamalarindan turetilir (asagida deriveEconomy ile atanir).
  // Amac: oyuncu ilk depo siparisini rahat versin, ikincisinde zorlansin.
  startMoney: 0,
  startReputation: 50,
  maxReputation: 100,       // KULLANILMIYOR — yumuşak tavandan sonra üst sınır repMax'tir
                            // (aşağıya bak). Clamp'lerde bunu KULLANMA: 100 üstü yastığı siler.
  minReputation: 0,

  // kazanç ilaç bazında: her MEDICINES öğesinin price alanından hesaplanır (sabit yok)
  repGainCorrect: 2,        // doğru serviste itibar artışı
  repLossWrong: 5,          // yanlış serviste itibar kaybı
  // Günlük hedefi TUTTURAN gün itibar kazandırır. İtibar 100'de tavanlı olduğu için
  // servis başına kazanç iyi günlerde tavana çarpıp kayboluyor, kayıplar ise her zaman
  // işliyordu: oyuncu iyi oynasa bile yastık biriktiremiyordu. Bu, gün ÖLÇEĞİNDE bir
  // tampon verir. Hedefi KAÇIRMAK hâlâ hiçbir ceza getirmez (bilinçli tasarım kararı).
  goalMetReputation: 3,     // hedef tutturulan günün sonunda itibar artışı

  // --- Yumuşak itibar tavanı ---
  // Sert 100 tavanı, tavana çarpan kazancı tamamen yok ediyordu; kayıplar ise her zaman
  // tam işliyordu. Sonuç: iyi oynamak yastık biriktirmiyordu (%85 doğrulukla oynayan bot
  // ham bütçesi POZİTİF olmasına rağmen 24/24 ölüyordu). Artık kazancın repSoftCap'e kadar
  // olan kısmı TAM, üstü repOverflowFactor ile kısılarak eklenir; toplam repMax'i aşmaz.
  // KAYIPLARDA yumuşatma YOKTUR — tam değerle işler. Oyun sonu koşulu değişmedi (itibar 0).
  repSoftCap: 100,          // buraya kadar kazanç tam değerle
  repMax: 150,              // itibarın çıkabileceği mutlak tavan
  repOverflowFactor: 0.5,   // repSoftCap üstündeki kazanç bu katsayıyla eklenir

  // --- Sahte reçete inceleme ---
  // --- Sahte oranı GÜN NUMARASINA bağlı rampa ---
  // Sabit 0.42, gün 11'den sonra ilerlemeyen eksenlerden biriydi. Artık gün 1'de
  // fakeChance, fakeChanceLateDay'de fakeChanceLate; ikisinin arası doğrusal, üstü
  // fakeChanceMax'ta durur. GECE yolu değişmedi: aynı çarpan (nightFakeRateBoost) ve
  // aynı tavan (nightFakeRateCap), sadece çarptığı taban artık güne duyarlı.
  fakeChance: 0.42,             // GÜN 1 sahte olma ihtimali (inceleme mekaniği devreye girsin)
  fakeChanceLate: 0.55,         // fakeChanceLateDay'de ulaşılan oran
  fakeChanceLateDay: 25,        // rampanın fakeChanceLate'e vardığı gün
  fakeChanceMax: 0.60,          // rampa bu oranı ASLA aşmaz (gündüzde de ≥ %40 gerçek)
  // NOT (ölçüm geçmişi): repGainCorrect / fakeCatchRepGain / angryRepLoss bir ara
  // %85 doğrulukla oynayan oyuncunun ölmesini telafi etmek için yükseltilmişti; sonra
  // TABAN değerlere geri alındı. Sebep: o ölümün kaynağı itibar ekonomisi değil, geç
  // oyundaki stok/nakit sarmalıydı — oyuncu rafı boşken kasayı geliştirmeye yatırınca
  // stok tükeniyor, satış düşüyor, sarmal kapanıyor. Bu değerleri denge sorunu sanıp
  // tekrar oynatma; önce stok kapsamını ölç.
  fakeApproveRepLoss: 15,       // sahteyi onaylayıp ilaç verince itibar cezası
  fakeApproveMoneyPenalty: 0,   // sahteyi onaylayınca para cezası (₺) — deriveEconomy: round(avgPrice × 2)
  fakeCatchRepGain: 8,          // sahteyi reddedince (yakalayınca) itibar
  fakeCatchBonus: 20,           // sahteyi yakalayınca küçük para bonusu (₺)
  wrongRejectRepLoss: 5,        // gerçeği yanlışlıkla reddedince itibar cezası (PARA CEZASI YOK — sadece satış kaybı)

  // --- Hasta karışımı + VİTRİN ---
  // Vitrin ARTIK MÜŞTERİ SAYISI EKLEMEZ. Gün büyüklüğü maxPatientsPerDay'de tavanlandığı
  // için "+2/+4 müşteri" 10. günden sonra hiçbir şey yapmıyordu (ölçüldü: Lv1 ile Lv3
  // aynı günü üretiyordu). Yeni işlevi müşteri SAYISINI değil DEĞERİNİ artırmak:
  // seviye başına reçeteli hasta payı yükselir. Reçeteli hasta semptomludan ~2,8 kat
  // değerli olduğu için bu R'yi büyütür; hedef R'den türediği için hedef kendiliğinden
  // ölçeklenir (hedef formülüne DOKUNULMADI).
  prescriptionChance: 0.5,     // Vitrin Lv1: %50 reçeteli, %50 semptomlu
  vitrinRxBonus: 0.05,         // Vitrin seviyesi başına reçeteli payına eklenen oran
  vitrinSymptomFloor: 0.40,    // semptomlu hasta payı BUNUN ALTINA İNEMEZ (karışım tek tipe dönmesin)
  minPrescriptionItems: 1,
  maxPrescriptionItems: 3,

  feedbackDuration: 0.8,    // feedback gösterim süresi (sn)
  patientEnterTime: 0.35,   // hasta giriş animasyon süresi (sn)
  bookAnimTime: 0.35,       // defter açılma/kapanma animasyon süresi (sn)

  // --- Gün = müşteri limiti (süre değil) ---
  patientsPerDayBase: 8,    // gün 1 müşteri hedefi
  patientsPerDayStep: 2,    // her gün +2 müşteri (gün2=10, gün3=12...)
  // --- GÜN BÜYÜKLÜĞÜ ÜST SINIRI ---
  // Sınırsız artış İKİ ayrı sorunu birden üretiyordu:
  //  (1) İtibar ölçeği sabit (0–repMax) ama kazanç/kayıp müşteri sayısıyla ölçeklendiği için
  //      geç oyunda tek kötü gün 30–40 puan sallıyor, yumuşak tavanın verdiği yastık
  //      (en fazla 50 puan) bir günde siliniyordu. Ödül/ceza değerlerini oynatmak bunu
  //      ÇÖZMEDİ (ölçüldü) — sorun değerlerde değil, gün ölçeğinin itibar ölçeğine göre
  //      sınırsız büyümesindeydi.
  //  (2) 90 müşterilik gün mobilde 15–20 dakika kesintisiz dokunma demek; oturum uzunluğu
  //      sürdürülebilir değildi.
  // Bu sınırdan sonra zorluk müşteri SAYISINDAN değil KOMPOZİSYONDAN gelir: sahte oranı,
  // daralan hata toleransı (missRate → 0.10 tabanına doğru), nöbet geceleri.
  // NOT: sınır GÜNDÜZ müşteri sayısına uygulanır ve VİTRİN bonusunu da kapsar (bonus
  // sınırı aşamaz). Nöbet bölümü bunun üstüne oranla eklenir (nightPatientRatio).
  maxPatientsPerDay: 26,
  // --- Günlük para hedefi: ORANSAL TOLERANS + GERÇEK GÜN LİSTESİ ---
  // Tolerans müşteri sayısıyla ölçeklenir (sabit hata payı büyüyen günde kusursuzluk
  // dayatıyordu). Hedef, o günün ÖNCEDEN ÜRETİLMİŞ gerçek hasta listesinden hesaplanır:
  //   izinliHata(gün) = N × missRate(gün)
  //   hedef(gün)      = floor10( clamp( R − izinliHata × missCost, R×0.40, R×0.90 ) )
  // R/C/missCost o güne özel gerçek rakamlar (avgPrice/avgCost tahmini değil).
  // Daralma hızı ARTIK ELLE VERİLMEZ: tabana kaç günde inileceğinden türetilir.
  // Eski missRateDecay 0.015 idi => taban 11. GÜNDE doluyordu ve kalan 20 gün boyunca
  // hata toleransı hiç değişmiyordu (ölçüldü: 11–30 arası düz plato). Artık taban
  // missRateFloorDay'de dolar, yani daralma tüm koşuya yayılır.
  // NOT: base/floor değiştirilirse hız kendiliğinden yeniden türetilir — tek kaynak burası.
  missRateBase: 0.25,       // gün 1'de hasta başına izinli hata oranı
  missRateFloor: 0.10,      // oran bunun altına inmez
  missRateFloorDay: 30,     // tabana bu günde ulaşılır (daralma bu güne kadar sürer)
  goalRatioClamp: [0.40, 0.90],  // hedef/R oranı güvenlik bandı
  daySeedBase: 20260617,    // gün üretimi seed TABANI (koşu tohumuyla harmanlanır)

  // --- Sipariş konsantrasyon tavanı ---
  // Tek bir hastanın o günün cirosunda tutabileceği en yüksek pay. Sabit yüzde İŞE YARAMAZ:
  // 6 geçerli hastalı bir günde kimsenin %15'in altında kalması matematiksel olarak
  // imkânsızdır. Bu yüzden tavan ADİL PAYA (1/hasta) oranlıdır:
  //   tavan = clamp(concentrationCapFactor / geçerliHasta, min, max)
  //   9 hasta → %24 | 6 hasta → %37 | 20 hasta → %15
  // Amaç: "hangi müşteride hata yaptığın" faktörü günü tek başına belirlemesin.
  // Sahte reçeteliler kapsam DIŞI — R'ye 0 katkı yapıyorlar, cezaları zaten sabit.
  concentrationCapFactor: 2.2,
  concentrationCapMin: 0.15,
  concentrationCapMax: 0.40,
  concentrationMaxPasses: 25,   // yeniden üretme turu üst sınırı (sonsuz döngü olmasın)

  // --- Nöbetçi eczane (aynı günün İKİNCİ bölümü; ayrı gün tipi değil) ---
  // Nöbet sıklığı da geç oyunda artar: erken oyunda her nightDutyEvery günde bir,
  // nightDutyLateFromDay'den itibaren her nightDutyEveryLate günde bir.
  nightDutyEvery: 4,           // gün < nightDutyLateFromDay: her 4. gün (4, 8, 12)
  nightDutyEveryLate: 3,       // gün ≥ nightDutyLateFromDay: her 3. gün (18, 21, 24, 27, 30)
  nightDutyLateFromDay: 16,    // sıklığın arttığı gün
  nightPatientRatio: 0.4,      // gündüz müşteri sayısının oranı; taban 3
  nightPatientMin: 3,          // gece en az bu kadar hasta
  nightFakeRateBoost: 1.8,     // gece sahte reçete oranı çarpanı
  nightFakeRateCap: 0.60,      // …ama bu tavanı aşmaz (gecede bile ≥ %40 gerçek)
  nightPriceMultiplier: 1.25,  // nöbet farkı — YALNIZ gece hastalarının satış fiyatına
  nightPatienceMultiplier: 1.2,// gece hastası daha sabırlı (gidecek başka yeri yok)
  nightIntroDuration: 2.2,     // "NÖBET BAŞLIYOR" kartının otomatik kapanma süresi (sn)
  nightFadeTime: 0.9,          // gece katmanının oturma süresi (sn)

  // --- Medula / e-reçete (terminal Lv2 alınınca açılır) ---
  medulaPatientRatio: 0.30,    // terminal açıkken reçeteli hastaların ~%30'u Medula hastası
  medulaPayDelayDays: 2,       // SGK ödemesi hizmetten kaç gün sonra kasaya girer
  medulaCodeLen: 6,            // kod uzunluğu (ilk karakter daima "2")
  medulaToastDuration: 3.2,    // "ödeme yattı" bilgi şeridi süresi (sn)
  debugDecisions: true,     // her servis/red kararında konsola teşhis bloğu bas

  // --- Stok + ecza deposu (toptancı) ---
  startStock: 10,           // her ilaç için oyun başı stok
  maxStock: 30,             // ilaç başına stok tavanı
  // depo alış fiyatı ilaç bazında: MEDICINES.cost (sabit birim fiyat yok)
  stockToastDuration: 1.1,  // "stok yok" uyarısı gösterim süresi (sn)

  // --- Tezgah PC'si ince ayar ---
  pcScale: 1.0,             // PC boyut çarpanı (1 = varsayılan, defterle benzer ağırlık)
  pcOffsetX: 0,             // PC yatay kaydırma (px; negatif = sola, pozitif = sağa)

  // --- Açık defter yazı hizası (kitap YÜKSEKLİĞİNE oran; elle ince ayar için) ---
  bookTextStartY: 0.225,    // ilk isim satırının baseline'ı (kağıttaki ilk çizgi)
  bookLineStep: 0.0723,     // satır adımı (kağıtta iki çizgi arası ×2 — isimler ferah otursun)

  // --- Faz 1: hasta sırası (kuyruk) ---
  maxQueue: 3,              // ekranda aynı anda max hasta
  spawnInterval: 4,         // yeni hasta gelme aralığı (sn) — gün başı
  minSpawnInterval: 1.5,    // gün sonuna doğru alt sınır

  // --- Faz 1: sabır ---
  basePatience: 38,         // hasta sabrı (sn) — rahat tempo
  angryRepLoss: 8,          // sabrı biten hasta küserse itibar kaybı
  queuePatienceMultiplier: 0.2, // sırada bekleyenlerin sabır azalma hızı (aktife göre)

  // tasarım referans çözünürlüğü (9:16)
  designW: 540,
  designH: 960,

  // renk paleti — Büfeci tarzı koyu yarı saydam paneller + neon
  colors: {
    bg: "#f3ecf7",
    bgTop: "#e7d9f0",

    // koyu yarı saydam paneller (arka plan hafif görünsün)
    panelBg: "rgba(26, 21, 36, 0.84)",
    panelBgSolid: "rgba(20, 16, 28, 0.92)",
    panelBorder: "rgba(245, 170, 70, 0.85)",
    panelShadow: "rgba(0, 0, 0, 0.35)",

    // metinler (koyu zeminde okunur)
    cream: "#f8ecd9",
    creamSoft: "#cdbcae",

    // neon (buton)
    neon: "#ff9d2f",
    neonGlow: "rgba(255, 150, 40, 0.75)",
    neonDim: "#7a5a36",
    btnDark: "rgba(18, 14, 22, 0.92)",

    // eski uyumluluk / aksan
    accent: "#e89a3c",
    counterBg: "rgba(26, 21, 36, 0.78)",

    good: "#5ec48a",
    bad: "#e8736b",
    repBar: "#f6c453",
    timeBar: "#79c0e8",
    repTrack: "rgba(255,255,255,0.16)",
    timeTrack: "rgba(255,255,255,0.16)",
    patGood: "#5ec48a",
    patMid: "#f6c453",
    patBad: "#e8736b"
  }
};

  let sp = 0, sc = 0;
  for (const m of MEDICINES) { sp += m.price; sc += m.cost; }
  const n = MEDICINES.length || 1;
  return { price: sp / n, cost: sc / n };
})();

// (buildDaySchedule). Buradaki ortalamalar yalnız startMoney ve sabit para cezası için.

// hedef seviyenin fiyatı (₺). Lv1 zaten elde => 0.
// Lv2 ilk satın alma olduğu için costK[0]'ı kullanır (kaydırma yok: n'inci alım = costK[n-1]).
function upgradeCost(id, targetLevel) {
  const u = UPGRADE_BY_ID[id];
  if (!u || targetLevel < 2 || targetLevel > u.maxLevel) return 0;
  return Math.round(avgPrice * u.costK[targetLevel - 2] / 100) * 100;
}
function upgradeLevel(id) {
  const lv = game.upgrades ? game.upgrades[id] : 1;
  return lv || 1;
}
function upgradeMaxed(id) { return upgradeLevel(id) >= UPGRADE_BY_ID[id].maxLevel; }

function effMaxQueue()    { return CONFIG.maxQueue + (upgradeLevel("tezgah") - 1); }        // 3 / 4 / 5
function effMaxStock()    { return CONFIG.maxStock + (upgradeLevel("depo") - 1) * 15; }     // 30 / 45 / 60

// altına inemez => Lv3'te bile karışım tek tipe dönüşmez.
function vitrinRxShare(lv) {
  const raw = CONFIG.prescriptionChance + (lv - 1) * CONFIG.vitrinRxBonus;
  return clamp(raw, 0, 1 - CONFIG.vitrinSymptomFloor);                                      // 0.50 / 0.55 / 0.60
}
function effPrescriptionChance() { return vitrinRxShare(upgradeLevel("vitrin")); }

// Vitrin'in getirdiği fazladan reçeteliler GERÇEK olmalı — yoksa geliştirme ZARAR ettirir.
// ÖLÇÜLDÜ: geçerli bir reçete semptomlu hastanın 1,44 katı değerinde, ama reçetelilerin
// ~%51'i sahte (rev 0) olduğu için bir reçeteli hastanın BEKLENEN değeri semptomlunun
// yalnızca 0,70 katı. Payı ham hâliyle yükseltmek R'yi Lv3'te %4,2 DÜŞÜRÜYORDU.
// Çözüm: reçete başına sahte ihtimali, payın büyüdüğü oranda seyreltilir. Böylece
// GÜN BAŞINA DÜŞEN SAHTE SAYISI değişmez (inceleme mekaniği ve sahte oranı ekseni
// aynen korunur), Vitrin'in eklediği hastalar ise gerçek reçete olur.
//   sahte/hasta = pay × sahteŞansı × (taban/pay) = taban × sahteŞansı  → paydan bağımsız
function vitrinFakeDilution() {
  const share = effPrescriptionChance();
  return share > 0 ? Math.min(1, CONFIG.prescriptionChance / share) : 1;                    // 1.00 / 0.91 / 0.83
}

// =====================================================================
//  ASSET KATMANI — sonradan PNG giydirmek için soyutlama
//  (şu an hiçbir dosya yüklenmiyor; images boş => her zaman fallback çizilir)
// =====================================================================
const Assets = {
  images: {},   // key -> yüklenmiş Image
  loaded: 0,
  total: 0,
  // Image objesi oluşturur, onload'da images[key] doldurur. Şimdilik çağrılmıyor.
  load(key, src) {
    this.total++;
    const img = new Image();
    img.onload = () => { this.images[key] = img; this.loaded++; };
    img.onerror = () => { this.loaded++; };
    img.src = src;
    return img;
  }
};

const Sprite = {
  // Asset yüklüyse onu çizer; değilse fallback(ctx,x,y,w,h) ile mevcut çizimi yapar.
  // fit: "stretch" (varsayılan), "contain" (kutuya sığdır, kırpma yok),
  //      "contain-bottom" (contain + kutunun ALT çizgisine otur, yatayda ortalı),
  //      "cover" (kutuyu doldur, taşan kenarlar kırpılır). Oran korunur.

  // Görselin kutu içinde GERÇEKTEN kaplayacağı dikdörtgen (asset yoksa null).
  // Oran korunduğu için görsel kutuyu genelde doldurmaz: en dar şişe kutunun
  // ~%34'ünü, en geniş kutu %100'ünü kaplar; aradaki fark boşluktur. Rozet ve
  // dokunma alanı gibi şeyler kutuya değil BU dikdörtgene bağlanmalı.
  rect(key, x, y, w, h, fit) {
    const img = Assets.images[key];
    if (!(img && img.complete && img.naturalWidth > 0)) return null;
    if (!fit || fit === "stretch") return { x, y, w, h };
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = fit === "cover"
      ? Math.max(w / iw, h / ih)
      : Math.min(w / iw, h / ih);
    const dw = iw * scale, dh = ih * scale;
    // contain-bottom: dikeyde ortalama yerine taban hizası — dar/uzun ve geniş/kısa
    // ürünler aynı yüzeye otursun diye.
    const dy = fit === "contain-bottom" ? y + h - dh : y + (h - dh) / 2;
    return { x: x + (w - dw) / 2, y: dy, w: dw, h: dh };
  },

  draw(ctx, key, x, y, w, h, fallback, fit) {
    const r = this.rect(key, x, y, w, h, fit);
    if (!r) {
      if (fallback) fallback(ctx, x, y, w, h);
      return;
    }
    const img = Assets.images[key];
    if (fit === "cover") {
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();
      ctx.drawImage(img, r.x, r.y, r.w, r.h);
      ctx.restore();
    } else {
      ctx.drawImage(img, r.x, r.y, r.w, r.h);
    }
  }
};

  dayStats: { served: 0, correct: 0, wrong: 0, angry: 0, money: 0, moneyDay: 0, moneyNight: 0, medulaAccrued: 0 },

// =====================================================================
//  CANVAS / RETINA KURULUMU
// =====================================================================
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let DPR = 1;

function resize() {
  DPR = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  canvas.width = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  layout.w = w;
  layout.h = h;
  computeLayout();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

// =====================================================================
//  LAYOUT HESABI
// =====================================================================
function computeLayout() {
  const W = layout.w, H = layout.h;

  // --- Merkezî 9:16 oyun kolonu (stage). Geniş ekranda ortada dikey kolon,
  //     kenarlar arka plan PNG'si ile dolar. Tüm UI bu kolona göre konumlanır. ---
  const aspect = 9 / 16;
  let sw, sh;
  if (W / H > aspect) { sh = H; sw = H * aspect; }
  else { sw = W; sh = W / aspect; }
  const sx = (W - sw) / 2;
  const sy = (H - sh) / 2;
  layout.stage = { x: sx, y: sy, w: sw, h: sh };

  // yatay iç boşluk (stage genişliğine göre)
  const padX = sw * 0.05;
  const left = sx + padX;
  const colW = sw - padX * 2;

  // --- Dikey düzen (Büfeci mantığı) ---
  //   üst (ince)           : HUD
  //   üst-orta (büyük)     : konuşma balonu + DEV müşteri
  //   tezgah çizgisi       : ahşap bant (müşteriyi göğüsten keser, üstüne seçilen ilaçlar dizilir)
  //   alt                  : ilaç seçim grid'i (2x3) + SERVİS ET (en altta)
  const hudY = sy + (window.__safeTop || 0) + sh * 0.018;
  const hudH = sh * 0.082;

  // tezgah (ahşap bant) — müşterinin kesildiği çizgi
  const counterLine = sy + sh * 0.555;
  const bandH = sh * 0.12;
  layout._counterLine = counterLine;
  layout._band = { x: sx, y: counterLine, w: sw, h: bandH };

  // seçilen ilaçların dizildiği tezgah alanı (ahşap bandın üstünde, müşterinin önünde)
  layout._counterArea = {
    x: left,
    y: counterLine + sh * 0.024,
    w: colW,
    h: bandH - sh * 0.042
  };

  // --- Servis butonu (en alt) ---
  const btnH = sh * 0.082;
  const btnY = sy + sh - btnH - sh * 0.02 - (window.__safeBottom || 0);
  layout.serveBtn = { x: left, y: btnY, w: colW, h: btnH };
  // ONAYLA / REDDET (reçete karar fazında SERVİS yerine gösterilir)
  const halfGap = colW * 0.04;
  const halfW = (colW - halfGap) / 2;
  layout.rejectBtn = { x: left, y: btnY, w: halfW, h: btnH };
  layout.approveBtn = { x: left + halfW + halfGap, y: btnY, w: halfW, h: btnH };

  // --- Kategori sekmeleri + ilaç seçim grid'i ---
  // Sekmeler bandın GÖRÜNÜR yüzeyinin hemen altına alındı: counter.png'nin alt ~%35'i
  // koyu ön panel (boş şerit gibi okunuyordu); sekmeler o panelin üstüne biner.
  // Yüzey çizgisi ~0.58×bandH (defter/PC oturma hizası) + nefes payı ~0.15×bandH.
  const zoneTop = counterLine + bandH * 0.73;
  const tabH = sh * 0.056;
  layout.tabsArea = { x: left, y: zoneTop, w: colW, h: tabH };
  const gridTop = zoneTop + tabH + sh * 0.006;
  const gridBottom = btnY - sh * 0.008;
  layout.gridArea = { x: left, y: gridTop, w: colW, h: gridBottom - gridTop };

  if (!game.activeGroup) {
    const first = groupsWithMeds()[0];
    game.activeGroup = first ? first.id : null;
  }
  buildTabs();
  buildShelf();

  layout._hud = { x: left, y: hudY, w: colW, h: hudH };

  // tezgahın SOL tarafında duran kapalı defter (obje) — ~%35 büyütüldü, daha görünür/tıklanır
  const dbw = sw * 0.32, dbh = sh * 0.10;
  const dbx = layout._band.x + sw * 0.02;
  const dby = (layout._band.y + layout._band.h * 0.58) - dbh;  // alt kenar tezgah yüzeyinde
  layout.bookClosedRect = { x: dbx, y: dby, w: dbw, h: dbh };

  // hasta alanı: HUD altı .. tezgah çizgisi (DEV müşteri burada, alttan banda gömülür)
  const patientTop = hudY + hudH + sh * 0.004;
  layout._patientArea = {
    x: sx,
    y: patientTop,
    w: sw,
    h: counterLine - patientTop
  };

  rebuildCounterSlots();
}

function rebuildCounterSlots() {
  const b = layout._band;
  if (!b) return;
  layout.counterSlots = [];
  // counter verisi düz id listesi kalır (multiset/checkOrder aynı); sadece ÇİZİM
  // ilaç bazında gruplanır: benzersiz ilaç = tek kutu + adet (×N rozeti için)
  const order = [], countById = {};
  for (const id of game.counter) {
    if (!(id in countById)) { countById[id] = 0; order.push(id); }
    countById[id]++;
  }
  const n = order.length;
  if (n === 0) return;
  const sw = layout.stage.w;
  // tezgah bandının ~%78'i kadar büyük tile'lar
  let slot = Math.min(b.h * 0.78, sw * 0.17);
  let gap = sw * 0.025;
  // çok ilaç varsa sığacak şekilde küçült
  const maxW = b.w * 0.92;
  let totalW = n * slot + (n - 1) * gap;
  if (totalW > maxW) { const k = maxW / totalW; slot *= k; gap *= k; totalW = maxW; }
  // alt kenar tezgah yüzeyine otursun (yüzey ~bandın üst %58'i)
  const baseline = b.y + b.h * 0.60;
  const sy = baseline - slot;
  let sx = b.x + (b.w - totalW) / 2;
  for (let i = 0; i < n; i++) {
    layout.counterSlots.push({ id: order[i], count: countById[order[i]], x: sx, y: sy, w: slot, h: slot });
    sx += slot + gap;
  }
}

// Tezgahtaki bir ürünün GERÇEK çizim dikdörtgeni + ✕ / ×N rozet merkezleri + dokunma kutusu.
// Slot kare, görsel değil: dar şişe slotun ~%34'ünü, geniş kutu %100'ünü kaplar. Rozetler
// eskiden slot köşesine sabitlendiği için şişelerde boşluğa düşüyordu; artık hepsi bu
// dikdörtgenden türetiliyor. Çizim ve tıklama AYNI fonksiyondan beslenir ki ayrışmasın;
// asset geç yüklenirse de anlık hesaplandığı için bayatlamaz.
function counterItemRects(slot) {
  const m = getMedicine(slot.id);
  const img = Sprite.rect(m.assetKey, slot.x, slot.y, slot.w, slot.h, "contain-bottom")
    || { x: slot.x, y: slot.y, w: slot.w, h: slot.h };   // PNG yoksa fallback slotu doldurur

  // rozet çapı görselle ölçeklenir, ama dar şişede okunmaz / geniş kutuda devasa
  // olmasın diye slot'a göre sınırlanır
  const br = clamp(img.w * 0.26, slot.w * 0.10, slot.w * 0.18);
  const inset = br * 0.85;                                // köşeye otursun, görselin üstünde kalsın
  const cy = img.y + inset;
  const del = { x: img.x + inset, y: cy, r: br };                 // ✕ (sol üst)
  const cnt = { x: img.x + img.w - inset, y: cy, r: br };         // ×N (sağ üst)

  // dokunma alanı çizimle EŞMERKEZLİ; parmak payı kadar büyür ama slotu aşmaz
  // (slotlar arası boşluğa taşıp komşu ürünü çalmasın)
  const pad = slot.w * 0.06;
  const hx = Math.max(slot.x, img.x - pad), hy = Math.max(slot.y, img.y - pad);
  const hit = {
    x: hx,
    y: hy,
    w: Math.min(slot.x + slot.w, img.x + img.w + pad) - hx,
    h: Math.min(slot.y + slot.h, img.y + img.h + pad) - hy
  };
  return { img, del, cnt, hit };
}

// Tezgah yerleşimini 39 ilacın HEPSİ için ölçer: rozetler gerçek görselin üstünde mi,
// dokunma alanı çizimle örtüşüyor mu, taban hizası tutuyor mu, slot dışına taşan var mı.
// Sapma varsa ilaç adıyla console.warn. Assetler yüklenince bir kez otomatik çalışır;
// elle: cheats.checkCounter()
function verifyCounterLayout() {
  const b = layout._band;
  const slotW = b ? Math.min(b.h * 0.78, layout.stage.w * 0.17) : 100;
  const baseline = b ? b.y + b.h * 0.60 : slotW;
  const T = 0.5;                       // px tolerans (ondalık yuvarlama payı)
  const rows = [];
  let bad = 0;

  for (const m of MEDICINES) {
    const slot = { id: m.id, count: 2, x: 0, y: baseline - slotW, w: slotW, h: slotW };
    const { img, del, cnt, hit } = counterItemRects(slot);
    const inRect = (p, r) => p.x >= r.x - T && p.x <= r.x + r.w + T &&
                             p.y >= r.y - T && p.y <= r.y + r.h + T;
    const errs = [];

    // 1) slot dışına taşma
    if (img.x < slot.x - T || img.y < slot.y - T ||
        img.x + img.w > slot.x + slot.w + T || img.y + img.h > slot.y + slot.h + T) {
      errs.push("görsel slot dışına taşıyor");
    }
    // 2) rozetler gerçek görselin üstünde mi
    if (!inRect(del, img)) errs.push("✕ rozeti görselin dışında");
    if (!inRect(cnt, img)) errs.push("×N rozeti görselin dışında");
    if (del.x >= cnt.x)    errs.push("✕ ile ×N rozeti yer değiştirmiş/üst üste");
    // 3) dokunma alanı çizimi kapsıyor mu (çizim bir yerde, tıklama başka yerde olmasın)
    if (hit.x > img.x + T || hit.y > img.y + T ||
        hit.x + hit.w < img.x + img.w - T || hit.y + hit.h < img.y + img.h - T) {
      errs.push("✕ dokunma alanı çizimi kapsamıyor");
    }
    // 4) dokunma alanı slotu aşmasın (komşu ürünü çalmasın)
    if (hit.x < slot.x - T || hit.x + hit.w > slot.x + slot.w + T) {
      errs.push("dokunma alanı slot dışına taşıyor");
    }
    // 5) taban hizası: her ürün slotun alt çizgisine otursun
    if (Math.abs((img.y + img.h) - (slot.y + slot.h)) > T) errs.push("taban hizası kaymış");
    // 6) yatayda ortalı kalsın
    if (Math.abs((img.x + img.w / 2) - (slot.x + slot.w / 2)) > T) errs.push("yatay ortalama kaymış");

    if (errs.length) { bad++; console.warn("Tezgah yerleşimi — " + m.name + ": " + errs.join("; ")); }
    rows.push({
      ilaç: m.name,
      oran: +(img.w / img.h).toFixed(2),
      "slot dolum %": Math.round((img.w / slot.w) * 100),
      "taban boşluk px": +((slot.y + slot.h) - (img.y + img.h)).toFixed(2),
      durum: errs.length ? "SAPMA" : "ok"
    });
  }

  rows.sort((p, q) => p.oran - q.oran);
  console.log("Tezgah yerleşim kontrolü: " + (MEDICINES.length - bad) + "/" + MEDICINES.length +
    " ilaç sorunsuz" + (bad ? " — " + bad + " SAPMA (yukarıda)" : ""));
  return { toplam: MEDICINES.length, sapma: bad, satırlar: rows };
}

// kategori sekmelerinin yatay yerleşimi (içerik koordinatında x; tabScroll ile kaydırılır)
function buildTabs() {
  const ta = layout.tabsArea;
  layout.tabs = [];
  if (!ta) return;
  const groups = groupsWithMeds();
  const fs = ta.h * 0.36;
  ctx.font = "800 " + fs + "px " + RX_FONT;   // çizimdeki en geniş ağırlıkla ölç
  const gap = ta.h * 0.22;                      // sekmeler arası net boşluk
  const padInner = ta.h * 0.42;                 // metin etrafı iç boşluk
  const minW = ta.h * 2.0;                      // dokunma için makul alt sınır
  let x = 0;
  for (const g of groups) {
    // emojisiz sekme: sadece metin ölçülür
    const btnW = Math.max(minW, ctx.measureText(g.label).width + padInner * 2);
    layout.tabs.push({ group: g, x, w: btnW + gap });  // w = buton + arkasındaki boşluk
    x += btnW + gap;
  }
  const total = x - gap;                 // son boşluğu sayma
  layout.tabsTotal = total;
  if (total <= ta.w) {
    // sığıyorsa şeridi ortala, kaydırma yok
    layout.tabsOffset = (ta.w - total) / 2;
    layout.tabScroll = 0;
  } else {
    // sığmıyorsa soldan başla, sağa kaydırılabilir
    layout.tabsOffset = 0;
    layout.tabScroll = clamp(layout.tabScroll || 0, 0, total - ta.w);
  }
  ensureActiveTabVisible();
}

// aktif sekmeyi görünür alana kaydır (gerekiyorsa)
function ensureActiveTabVisible() {
  const ta = layout.tabsArea;
  if (!ta || !layout.tabs || (layout.tabsTotal || 0) <= ta.w) return;
  const t = layout.tabs.find(t => t.group.id === game.activeGroup);
  if (!t) return;
  const left = t.x, right = t.x + t.w;
  if (left < layout.tabScroll) layout.tabScroll = left;
  else if (right > layout.tabScroll + ta.w) layout.tabScroll = right - ta.w;
  layout.tabScroll = clamp(layout.tabScroll, 0, layout.tabsTotal - ta.w);
}

// Seçili gruptaki ilaçları BÜYÜK KARTLAR halinde yerleştir (Büfeci kalıbı):
// satırda 3 kart, kare-ye yakın; sığmazsa grid aşağı devam eder ve DİKEY
// drag-scroll ile kaydırılır (layout.shelfScroll; çizim/tıklamada düşülür).
function buildShelf() {
  const area = layout.gridArea;
  layout.shelfButtons = [];
  layout.shelfMaxScroll = 0;
  if (!area) return;
  const meds = medsInGroup(game.activeGroup);
  const n = meds.length;
  if (n === 0) return;

  const S = layout.stage;
  const cols = 3;
  const cardW = S.w * 0.26;            // büyük kart (~%26 stage genişliği)
  const cardH = cardW * 0.94;          // kare-ye yakın
  const gap = S.w * 0.03;
  const rows = Math.ceil(n / cols);
  const contentH = rows * cardH + (rows - 1) * gap;
  // içerik alandan kısaysa dikeyde ortala (kaydırma yok)
  const topPad = contentH <= area.h ? (area.h - contentH) / 2 : 0;
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols);
    const c = i % cols;
    const rowCount = Math.min(cols, n - r * cols);          // son satır eksikse o satırı ortala
    const rowW = rowCount * cardW + gap * (rowCount - 1);
    const startX = area.x + (area.w - rowW) / 2;
    layout.shelfButtons.push({
      id: meds[i].id,
      x: startX + c * (cardW + gap),
      y: area.y + topPad + r * (cardH + gap),   // içerik koordinatı; shelfScroll çizimde düşülür
      w: cardW,
      h: cardH
    });
  }
  layout.shelfMaxScroll = Math.max(0, contentH - area.h);
  layout.shelfScroll = clamp(layout.shelfScroll || 0, 0, layout.shelfMaxScroll);
}

// =====================================================================
//  OYUN MANTIĞI
// =====================================================================
function getMedicine(id) { return MEDICINES.find(m => m.id === id); }

// --- Değiştirilebilir rastgelelik kaynağı ---
// Normalde Math.random; gün listesi üretilirken withSeed() bunu seed'li RNG ile değiştirir.
// Böylece üretim kodu (makePrescription, makePatient…) hiç değişmeden deterministik olur.
let _rngSource = Math.random;
function rng() { return _rngSource(); }
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// fn'i seed'li RNG altında çalıştırır. pickKnownDoctor game.lastDoctor'a bakıp yazdığı için
// o da izole edilir — aynı seed + aynı gün her zaman aynı listeyi verir.
// --- KOŞU TOHUMU ---
// Gün tohumu artık yalnız gün numarasından değil, KOŞU tohumundan da türer:
//   aynı koşu + aynı gün  → bit-bit aynı liste (cache, hedef ve testler bozulmaz)
//   farklı koşu           → tamamen farklı hastalar/reçeteler/kodlar
const TEST_RUN_SEED = 20260617;      // self-test'ler ve denge doğrulaması bu tohumla koşar
function newRunSeed() {
  return ((Math.floor(Math.random() * 0x7FFFFFFF) ^ Date.now()) >>> 0) || 1;
}
// runSeed + gün → iyi dağılmış 32-bit tohum (ardışık gün/koşu korelasyon vermesin)
function daySeedFor(day) {
  let h = ((game.runSeed >>> 0) ^ (CONFIG.daySeedBase >>> 0)) >>> 0;
  h = (h ^ Math.imul(day, 0x9E3779B1)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 13), 0xC2B2AE35);
  return (h ^ (h >>> 16)) >>> 0;
}
// fn'i belirli bir koşu tohumuyla çalıştır (testler için); gün cache'i iki yönde de temizlenir
function withRunSeed(seed, fn) {
  const prev = game.runSeed;
  const prevSch = game.daySchedule;
  game.runSeed = seed >>> 0;
  game.daySchedule = null;
  invalidateDaySchedules();
  try { return fn(); }
  finally {
    game.runSeed = prev;
    game.daySchedule = prevSch;
    invalidateDaySchedules();
  }
}

function withSeed(seed, fn) {
  const prevSrc = _rngSource, prevDoc = game.lastDoctor;
  _rngSource = mulberry32(seed);
  // lastDoctor SIFIRLANIR (yalnız geri yüklenmesi yetmez): pickKnownDoctor
  // "d.name === game.lastDoctor" olduğu sürece döngüde kalıp fazladan rng() harcar.
  // Dışarıdan gelen bir isim ilk çekilişle çakışırsa tüm RNG akışı kayar ve aynı gün
  // farklı üretilir. Sıfırlamak üretimi dış duruma tamamen kapatır.
  game.lastDoctor = null;
  try { return fn(); }
  finally { _rngSource = prevSrc; game.lastDoctor = prevDoc; }
}

function rand(n) { return Math.floor(rng() * n); }
function pick(arr) { return arr[rand(arr.length)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

function activePatient() { return game.queue.length ? game.queue[0] : null; }

// o günün müşteri limiti (gün bağımsız hesap; hedef fonksiyonu da bunu kullanır)
// Geliştirmelerden BAĞIMSIZDIR: Vitrin artık sayıyı değil karışımı etkiliyor.
// Hedef formülü, konsantrasyon tavanı ve nöbet oranları hep bu fonksiyonun ürettiği
// GERÇEK listeden hesaplandığı için tavana kendiliğinden uyum sağlar.
function patientLimitFor(day) {
  const raw = CONFIG.patientsPerDayBase + (day - 1) * CONFIG.patientsPerDayStep;
  return Math.min(CONFIG.maxPatientsPerDay, raw);
}
// OYNANAN gün, üretildiği andaki listeye SABİTLENİR — gün ortasında vitrin yükseltilirse
// o günün hasta karışımı ve hedefi değişmez, etki bir sonraki günden başlar.
function patientsForDay() {
  if (game.daySchedule && game.daySchedule.day === game.dayNumber) return game.daySchedule.N;
  return patientLimitFor(game.dayNumber);
}

// --- NÖBET ---
// Nöbet, günün ikinci bölümüdür: aynı gün programına night:true hastalar eklenir.
// Böylece R, C ve hedef mevcut formülle kendiliğinden doğru çıkar (formüle dokunulmadı).
const _forcedNightDays = {};   // yalnız cheats.forceNight() doldurur; normal oyunda boş
// Nöbet sıklığı geç oyunda artar (bkz. CONFIG.nightDutyEveryLate).
function nightDutyEveryFor(day) {
  return day >= CONFIG.nightDutyLateFromDay ? CONFIG.nightDutyEveryLate : CONFIG.nightDutyEvery;
}
function isNightDutyDay(day) {
  if (_forcedNightDays[day]) return true;
  const every = nightDutyEveryFor(day);
  return every > 0 && day % every === 0;
}
function nightPatientsFor(day) {
  if (!isNightDutyDay(day)) return 0;
  return Math.max(CONFIG.nightPatientMin, Math.round(patientLimitFor(day) * CONFIG.nightPatientRatio));
}
// GÜNDÜZ sahte reçete ihtimali — gün numarasına bağlı rampa (bkz. CONFIG.fakeChanceLate).
// Gün 1'de CONFIG.fakeChance, fakeChanceLateDay'de fakeChanceLate, üstü fakeChanceMax'ta durur.
function fakeChanceFor(day) {
  const d0 = Math.max(1, CONFIG.fakeChanceLateDay - 1);
  const step = (CONFIG.fakeChanceLate - CONFIG.fakeChance) / d0;
  return Math.min(CONFIG.fakeChanceMax, CONFIG.fakeChance + (day - 1) * step);
}
// gece sahte reçete ihtimali — ÇARPAN VE TAVAN DEĞİŞMEDİ, yalnız çarptığı taban güne duyarlı
function nightFakeChance(day) {
  return Math.min(CONFIG.nightFakeRateCap, fakeChanceFor(day) * CONFIG.nightFakeRateBoost);
}
// günün TOPLAM hasta sayısı (gündüz + gece)
function totalPatientsFor(day) { return patientLimitFor(day) + nightPatientsFor(day); }

// hasta başına izinli hata oranı — gün ilerledikçe daralır, floor'un altına inmez.
// Daralma hızı CONFIG'te elle verilmez: tabana missRateFloorDay'de varacak şekilde türetilir.
function missRateDecayPerDay() {
  const d0 = Math.max(1, CONFIG.missRateFloorDay - 1);
  return (CONFIG.missRateBase - CONFIG.missRateFloor) / d0;
}
function missRateFor(day) {
  return Math.max(CONFIG.missRateFloor, CONFIG.missRateBase - (day - 1) * missRateDecayPerDay());
}
// o gün kaç yanlış servise tolerans var — müşteri sayısıyla ÖLÇEKLENİR
function allowedMissesFor(day) {
  return totalPatientsFor(day) * missRateFor(day);
}

// --- Bir siparişin referans değeri (doğru servis edilirse ciro / mal maliyeti) ---
// Reçete: kalemlerin adetli price/cost toplamı — kesin.
// Semptom: o kategorideki ilaçların ORTALAMASI; oyuncu kategoriden herhangi birini
// verebilir ve hepsi doğru sayılır, tek "doğru fiyat" yoktur. Kategori içi fiyat
// yayılımı genel havuzdan çok daha dar olduğu için tahmin hatası küçüktür.
// priceMul: gece hastalarında CONFIG.nightPriceMultiplier (nöbet farkı). Yalnız SATIŞ
// fiyatına uygulanır — mal maliyeti (cost) değişmez.
function refValuesFor(request, priceMul) {
  const mul = priceMul || 1;
  // Medula: kağıt reçete gibi hesaplanır, ASLA sahte olmaz => daima geçerli
  if (request.type === "prescription" || request.type === "medula") {
    if (request.fake) return { rev: 0, cost: 0, valid: false };   // doğru oynanış = reddetmek
    let rev = 0, cost = 0;
    for (const it of request.items) {
      const m = getMedicine(it.id);
      if (m) { rev += m.price * it.qty; cost += m.cost * it.qty; }
    }
    return { rev: rev * mul, cost, valid: true };
  }
  // Semptomlu hasta: her kalem için o kategorinin ORTALAMASI × adet.
  let rev = 0, cost = 0;
  for (const it of (request.items || [{ symptom: request.symptom, qty: 1 }])) {
    const cands = MEDICINES.filter(m => m.category === it.symptom.category);
    if (!cands.length) return { rev: 0, cost: 0, valid: false };
    let r = 0, c = 0;
    for (const m of cands) { r += m.price; c += m.cost; }
    rev += (r / cands.length) * it.qty;
    cost += (c / cands.length) * it.qty;
  }
  return { rev: rev * mul, cost, valid: true };
}

// =====================================================================
//  SİPARİŞ KONSANTRASYON TAVANI
//  Tek hastanın günün R'sinde tuttuğu payı sınırlar. Tavan adil paya oranlıdır
//  (bkz. CONFIG.concentrationCap*). Ölçüm NİHAİ değer üzerinden yapılır: nöbet
//  farkı (×1.25) uygulanmış hâli, ham fiyat değil.
// =====================================================================
function concentrationCapFor(validN) {
  if (validN <= 0) return CONFIG.concentrationCapMax;
  return clamp(CONFIG.concentrationCapFactor / validN, CONFIG.concentrationCapMin, CONFIG.concentrationCapMax);
}

// Listenin R'si, geçerli hasta sayısı ve EN YÜKSEK paylı geçerli hastası.
// Sahteler (refValuesFor → valid:false) hem R'ye hem sayıma hem adaylığa girmez.
function concScan(list) {
  let R = 0, validN = 0, wi = -1, wv = -1;
  for (let i = 0; i < list.length; i++) {
    const p = list[i];
    const v = refValuesFor(p.request, p.night ? CONFIG.nightPriceMultiplier : 1);
    if (!v.valid) continue;
    R += v.rev; validN++;
    if (v.rev > wv) { wv = v.rev; wi = i; }
  }
  return { R, validN, wi, wv };
}

// Siparişin İÇERİĞİNİ yeniden üretir; TİPİ KORUNUR (reçeteli/semptomlu, sahte/gerçek,
// gündüz/gece). Tip değişirse yukarıdaki garantiler — her günde ≥1 gerçek reçete,
// 2. günden itibaren ≥1 sahte, nöbet gecesinde ≥1 gerçek — bozulur.
function concRegenRequest(p) {
  const t = p.request.type;
  if (t === "symptom") {
    p.request = makeSymptomRequest();
    p.line = p.request.line;                          // balon repliği semptomları anlatır
  } else if (t === "medula") {
    p.request = makeMedulaRequest();                  // Medula asla sahte olmaz
  } else {
    p.request = makePrescription(p.request.fake, 0);  // sahte/gerçek bayrağı aynen korunur
  }
}

// ZORLA SIĞDIRMA: en pahalı kalemi bir kademe küçültür (adet −1; adet 1'de kalemi çıkarır).
// Her çağrı siparişi kesin küçültür, küçültülemiyorsa false döner => döngü mutlaka durur.
function concShrinkOnce(p) {
  const request = p.request;
  const items = request.items;
  if (!items || !items.length) return false;
  const unitPrice = it => {
    if (request.type === "symptom") {
      const cands = MEDICINES.filter(m => m.category === it.symptom.category);
      if (!cands.length) return 0;
      let r = 0; for (const m of cands) r += m.price;
      return r / cands.length;                        // semptomda kategori ORTALAMASI
    }
    const m = getMedicine(it.id);
    return m ? m.price : 0;
  };
  let bi = -1, bv = -1;
  for (let i = 0; i < items.length; i++) {
    const v = unitPrice(items[i]) * items[i].qty;
    if (v > bv) { bv = v; bi = i; }
  }
  if (bi < 0) return false;
  if (items[bi].qty > 1) items[bi].qty--;
  else if (items.length > 1) items.splice(bi, 1);
  else return false;                                  // tek kalem ×1 — daha fazla küçülemez
  if (request.type === "symptom") {
    request.symptom = items[0].symptom;               // geriye uyum alanı (tek kalemli yollar/emoji)
    request.line = buildSymptomLine(items);
    p.line = request.line;
  }
  return true;
}

// Tavanı uygular. Önce yeniden üretme (en fazla concentrationMaxPasses tur), sonra
// hâlâ aşan varsa zorla sığdırma. withSeed İÇİNDE çağrılır => determinizm korunur.
function applyConcentrationCap(list) {
  let regen = 0, forced = 0;
  // Matematiksel olarak sağlanamayan günlerde kural hiç uygulanmaz: geçerli hasta
  // sayısı validN ise en iyi ihtimalle (herkes eşit) en yüksek pay 1/validN olur.
  // tavan × validN ≤ 1 ise hiçbir dağılım tavanı sağlayamaz (validN ≤ 2) — sonsuz döngü
  // yerine dokunmadan çıkılır.
  const satisfiable = s => concentrationCapFor(s.validN) * s.validN > 1;

  for (let pass = 0; pass < CONFIG.concentrationMaxPasses; pass++) {
    const s = concScan(list);
    if (s.wi < 0 || s.R <= 0 || !satisfiable(s)) break;
    if (s.wv <= s.R * concentrationCapFor(s.validN)) break;   // tavan sağlandı
    concRegenRequest(list[s.wi]);
    regen++;
  }
  // 25 tur yetmediyse: kalemleri düşürerek zorla sığdır (her adım R'yi kesin küçültür)
  for (let guard = 0; guard < 200; guard++) {
    const s = concScan(list);
    if (s.wi < 0 || s.R <= 0 || !satisfiable(s)) break;
    if (s.wv <= s.R * concentrationCapFor(s.validN)) break;
    if (!concShrinkOnce(list[s.wi])) break;                   // daha fazla küçülemiyor
    forced++;
  }
  return { regen, forced };
}

// --- Günün tam listesini seed'li üret ve ekonomisini çıkar ---
// Aynı seed + aynı gün => aynı liste (test edilebilirlik).
function buildDaySchedule(day) {
  const dayN = patientLimitFor(day);
  const nightN = nightPatientsFor(day);
  const N = dayN + nightN;
  const prevDateDay = _dateDayOverride;
  _dateDayOverride = day;                 // reçete tarihleri o güne göre damgalansın
  let patients, concRegen = 0, concForced = 0;
  try {
    const built = withSeed(daySeedFor(day), function () {
      const out = [];
      for (let i = 0; i < dayN; i++) out.push(makePatient());
      // NÖBET bölümü — listenin sonuna eklenir, spawn sırayla çektiği için gece sonra gelir
      for (let i = 0; i < nightN; i++) out.push(makePatient({ night: true }));

      // --- Reçete garantileri (hepsi withSeed içinde => determinizm bozulmaz) ---
      const isRx = p => p.request.type === "prescription";
      const isReal = p => isRx(p) && !p.request.fake;
      const isFake = p => isRx(p) && p.request.fake;

      // (a) Günde EN AZ BİR gerçek reçete: yoksa ilk gündüz hastası gerçek reçeteli olur.
      if (!out.some(isReal)) out[0] = makePatient({ forcePrescription: true, forceFake: false });

      // (b) 2. GÜNDEN İTİBAREN günde en az bir SAHTE reçete: inceleme mekaniği her gün
      // devreye girsin. Gün 1 öğretici kalır, garanti uygulanmaz.
      // Hedef olarak SON gündüz hastası seçilir — (a)'nın koyduğu 0. indeks korunur.
      if (day >= 2 && !out.some(isFake) && dayN >= 2) {
        out[dayN - 1] = makePatient({ forcePrescription: true, forceFake: true });
      }

      // (c) Gece bölümünde EN AZ BİR gerçek reçete: aksi halde nöbet yalnızca red
      // kararlarından ibaret olabiliyor (servis yok, ciro yok, karşıt örnek yok).
      if (nightN > 0 && !out.slice(dayN).some(isReal)) {
        out[out.length - 1] = makePatient({ night: true, forcePrescription: true, forceFake: false });
      }

      // (d) Sipariş konsantrasyon tavanı — GARANTİLERDEN SONRA çalışır ve yalnız sipariş
      // içeriğini değiştirir, tipleri korur; (a)(b)(c) bozulmaz.
      const conc = applyConcentrationCap(out);
      return { out, conc };
    });
    patients = built.out;
    concRegen = built.conc.regen;
    concForced = built.conc.forced;
  } finally { _dateDayOverride = prevDateDay; }

  let R = 0, C = 0, validCount = 0;
  for (const p of patients) {
    // nöbet farkı: gece hastalarının satış fiyatı çarpanlı olarak R'ye girer
    const v = refValuesFor(p.request, p.night ? CONFIG.nightPriceMultiplier : 1);
    p.refRevenue = v.rev;                 // teşhis/doğrulama için hastada da dursun
    p.refCost = v.cost;
    p.refValid = v.valid;
    if (v.valid) { R += v.rev; C += v.cost; validCount++; }
  }

  const misses = allowedMissesFor(day);
  // o güne özel gerçek hata maliyeti: kaçan ciro + yazılan cost zararı, geçerli hasta başına
  const missCost = validCount > 0 ? (R + C) / validCount : 0;
  const lo = CONFIG.goalRatioClamp[0], hi = CONFIG.goalRatioClamp[1];
  const raw = R - misses * missCost;
  // 10'a AŞAĞI yuvarla: yukarı yuvarlamak formülün az önce verdiği toleransın bir kısmını
  // geri alır (gün 1'de hedefi 648.6 → 650 yapıp gereken doğruyu 6'dan 7'ye çıkarıyordu).
  const goal = Math.floor(clamp(raw, R * lo, R * hi) / 10) * 10;

  // Güvenlik bandı devreye girdi mi? (girdiyse hedef artık tolerans türevli DEĞİLDİR)
  const clampedAt = raw < R * lo ? "lo" : (raw > R * hi ? "hi" : null);
  return { day, patients, N, dayN, nightN, isNight: nightN > 0,
           R, C, validCount, fakeCount: N - validCount, misses, missCost, raw, goal, clampedAt,
           // konsantrasyon tavanı teşhisi (cheats.concentration / verifyConcentrationCap)
           concCap: concentrationCapFor(validCount), concRegen, concForced };
}

// gün listesi cache'i — hedef sorulunca üretilir, oynanınca AYNI liste kullanılır (iki kez üretilmez)
const _dayScheduleCache = {};
// Vitrin seviyesi hasta karışımını değiştirir => önden üretilmiş günler ve hedefleri
// geçersizleşir. Oynanan gün game.daySchedule snapshot'ından okunduğu için etkilenmez.
function invalidateDaySchedules() {
  for (const k in _dayScheduleCache) delete _dayScheduleCache[k];
}
function getDaySchedule(day) {
  if (!_dayScheduleCache[day]) _dayScheduleCache[day] = buildDaySchedule(day);
  return _dayScheduleCache[day];
}

// günlük para hedefi — o günün gerçek hasta listesinden
function dailyGoalFor(day) { return getDaySchedule(day).goal; }

// hedefin fiilen karşılık geldiği oran (hedef / geçerli ciro) — teşhis için
function effectiveGoalRatio(day) {
  const sch = getDaySchedule(day);
  return sch.R > 0 ? sch.goal / sch.R : 0;
}
function goalForDay() {
  if (game.daySchedule && game.daySchedule.day === game.dayNumber) return game.daySchedule.goal;
  return dailyGoalFor(game.dayNumber);
}

// --- tarih sistemi: gün 1 = 17 Haziran 2026, her gün +1 ---
const MONTHS_TR = ["Oca", "Şub", "Mar", "Nis", "May", "Haz", "Tem", "Ağu", "Eyl", "Eki", "Kas", "Ara"];
// Gün listesi önden üretilirken (buildDaySchedule) reçetelere O GÜNÜN tarihi basılmalı,
// oynanan günün değil. Üretim sırasında bu override doldurulur.
let _dateDayOverride = 0;
// ÜRETİLEN gün: buildDaySchedule içindeysek o gün, değilse oynanan gün. Sahte oranı gibi
// güne bağlı üretim parametreleri bunu okur — böylece önden üretilen her gün KENDİ
// gününün oranlarıyla kurulur, oynanan günün oranlarıyla değil.
function genDay() { return _dateDayOverride || game.dayNumber; }
function gameDate(offsetDays) {
  const d = new Date(2026, 5, 17);
  d.setDate(d.getDate() + ((_dateDayOverride || game.dayNumber) - 1) + (offsetDays || 0));
  return d;
}
// gün değişmediği sürece cache'lenir (HUD her frame çağırır; frame'de new Date olmasın)
let _dateCacheDay = 0, _dateCacheStr = "";
function dateShort() {
  if (_dateCacheDay === game.dayNumber) return _dateCacheStr;
  _dateCacheDay = game.dayNumber;
  const d = gameDate(0);
  _dateCacheStr = d.getDate() + " " + MONTHS_TR[d.getMonth()];
  return _dateCacheStr;
}

// Türkçe binlik ayraçlı para formatı: 1100 → "1.100₺" (toLocaleString YOK — her ortamda
// aynı görünüm). Basit cache: para değişmediği sürece string yeniden hesaplanmaz.
let _moneyCacheVal = null, _moneyCacheStr = "";
function formatMoney(n) {
  if (n === _moneyCacheVal) return _moneyCacheStr;
  _moneyCacheVal = n;
  let s = String(Math.abs(Math.trunc(n)));
  let out = "";
  while (s.length > 3) { out = "." + s.slice(-3) + out; s = s.slice(0, -3); }
  _moneyCacheStr = (n < 0 ? "-" : "") + s + out + "₺";
  return _moneyCacheStr;
}
function dateRx(offsetDays) {
  const d = gameDate(offsetDays);
  return d.getDate() + " " + MONTHS_TR[d.getMonth()] + " '" + String(d.getFullYear()).slice(2);
}

// ardışık aynı doktoru seçmeden tanınan doktor seç
function pickKnownDoctor() {
  let d;
  do { d = pick(KNOWN_DOCTORS); } while (KNOWN_DOCTORS.length > 1 && d.name === game.lastDoctor);
  game.lastDoctor = d.name;
  return d;
}

// --- Kusur sınıfları ---
// DETECTABLE: yalnız reçete kağıdına + doktor defterine bakarak doğrulanabilir.
// SUBTLE: alan bilgisi ister (ilaç etkileşimi); tek başına kusur olarak KULLANILMAZ.
// NOT: "overdose" (aşırı adet) KUSUR OLMAKTAN ÇIKARILDI. Yüksek adet artık normal bir
// reçete özelliğidir — doktor 5-6 kutu yazabilir ve bu reçeteyi sahte yapmaz.
const DETECTABLE_FLAWS = ["fake_doctor", "expired", "no_stamp", "bad_signature"];
const SUBTLE_FLAWS = ["conflict"];

// bir reçetede oyuncunun kağıttan tespit edebileceği kusurları döndür (teşhis + self-test)
function detectableFlawsOf(req) {
  const out = [];
  if (!req || req.type !== "prescription") return out;
  const known = KNOWN_DOCTORS.some(d => d.name === req.doctor);
  if (!known) out.push("doktor defterde yok (" + req.doctor + ")");
  if (req.hasStamp === false) out.push("kaşe yok");
  if (req.sig === "???" || req.sig === "—" || req.sig === "") out.push("imza geçersiz");
  if (req.expired) out.push("tarihi geçmiş (" + req.date + ")");
  return out;
}

// Medula panellerinin ÖLÇÜLEN çakışma denetimi — göz kararı değil, rect kesişimi.
// Hasta başına bir kez uyarır (her frame konsolu doldurmasın).
const _medulaLayoutChecked = {};
function rectsHit(a, b) {
  return !!(a && b && a.x < b.x + b.w && b.x < a.x + a.w && a.y < b.y + b.h && b.y < a.y + a.h);
}
function checkMedulaLayout(code) {
  if (_medulaLayoutChecked[code]) return true;
  _medulaLayoutChecked[code] = true;
  const hud = layout._hud, bub = layout.medulaBubbleRect, card = layout.medulaCardRect;
  const pairs = [["HUD", hud, "kod balonu", bub], ["HUD", hud, "kayıt kartı", card],
                 ["kod balonu", bub, "kayıt kartı", card]];
  let ok = true;
  for (const [n1, r1, n2, r2] of pairs) {
    if (r1 && r2 && rectsHit(r1, r2)) {
      ok = false;
      console.warn("[medula] Panel çakışması: " + n1 + " ↔ " + n2 +
        "  " + n1 + "=" + JSON.stringify(rectRound(r1)) + "  " + n2 + "=" + JSON.stringify(rectRound(r2)));
    }
  }
  return ok;
}
function rectRound(r) { return { x: Math.round(r.x), y: Math.round(r.y), w: Math.round(r.w), h: Math.round(r.h) }; }

// Sorgulanmış kod kaydı — gün+kod ile anahtarlanır (istek nesnesi cache'le PAYLAŞILDIĞI
// için oraya YAZILMAZ; yoksa yeni oyunda eski sorgular açık gelirdi).
function medulaKey(code) { return game.dayNumber + ":" + code; }
function medulaIsRevealed(code) { return !!game.medulaRevealed[medulaKey(code)]; }
function medulaReveal(code) { game.medulaRevealed[medulaKey(code)] = true; }

// --- MEDULA KODU ---
// 6 karakter, DAİMA "2" ile başlar. Alfabe TAM: 0-9 + A-Z (36 karakter) — klavyede eksik
// tuş kalmasın diye karıştırılabilir karakterler de dahil edildi.
const MEDULA_ALPHABET = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
function makeMedulaCode() {
  let out = "2";
  for (let i = 1; i < CONFIG.medulaCodeLen; i++) out += MEDULA_ALPHABET.charAt(rand(MEDULA_ALPHABET.length));
  return out;
}

// Karıştırma yardımcısı (semptom kategorisi seçiminde ve Medula kodunda kullanılır)
function shuffledCopy(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = rand(i + 1); const t = a[i]; a[i] = a[j]; a[j] = t; }
  return a;
}

// reçete üret (gerçek/sahte + kusurlar). fakeForce: true/false => zorla; undefined => rastgele
function makePrescription(fakeForce, fakeChance) {
  const count = CONFIG.minPrescriptionItems +
    rand(CONFIG.maxPrescriptionItems - CONFIG.minPrescriptionItems + 1);
  const pool = MEDICINES.slice();
  const items = [];
  for (let i = 0; i < count && pool.length; i++) {
    const m = pool.splice(rand(pool.length), 1)[0];
    // adet dağılımı — yüksek adet NORMAL bir reçete özelliği (sahtelikle ilgisi yok)
    const roll = rng();
    const qty = roll < 0.70 ? 1 : roll < 0.90 ? 2 : roll < 0.97 ? 3 : pick([4, 5, 6]);
    items.push({ id: m.id, qty });
  }

  const chance = (fakeChance === undefined) ? CONFIG.fakeChance : fakeChance;
  const fake = (fakeForce === undefined) ? (rng() < chance) : !!fakeForce;
  const flaws = [];
  if (fake) {
    // Sahte reçetenin EN AZ BİR kusuru kağıda bakarak doğrulanabilir olmalı.
    // "conflict" (uyku ilacı + enerji takviyesi bir arada) oyunun hiçbir yerinde
    // öğretilmiyor: doktor gerçek, kaşe var, imza düzgün, adetler ×1 → oyuncu için
    // görünmez bir kusurdu ve tek kusur olarak çıkabiliyordu. Artık yalnız EK kusur.
    const detectable = DETECTABLE_FLAWS.slice();
    for (let i = detectable.length - 1; i > 0; i--) { const j = rand(i + 1); [detectable[i], detectable[j]] = [detectable[j], detectable[i]]; }
    flaws.push(detectable[0]);        // garanti: tespit edilebilir 1 kusur
    if (rand(2) === 0) {              // %50 ihtimalle 2. kusur (ince kusur da olabilir)
      const rest = detectable.slice(1).concat(SUBTLE_FLAWS);
      flaws.push(rest[rand(rest.length)]);
    }
  }

  // varsayılan (gerçek) üst bilgi
  let doc = pickKnownDoctor();
  let doctor = doc.name, sig = doc.sig;
  let date = dateRx(0);               // güncel tarih
  let hasStamp = true, expired = false;

  // kusurları uygula
  if (flaws.includes("conflict")) {
    const sleepIds = MEDICINES.filter(m => m.group === "uyku_sinir").map(m => m.id);
    const energyIds = ["med_b12guc", "med_dvitamin", "cvitamin"].filter(id => getMedicine(id));
    items.length = 0;
    items.push({ id: pick(sleepIds), qty: 1 });
    items.push({ id: pick(energyIds), qty: 1 });
  }
  if (flaws.includes("fake_doctor")) { const f = pick(FAKE_DOCTORS); doctor = f.name; sig = f.sig; }
  if (flaws.includes("expired")) { expired = true; date = dateRx(-183); }  // ~6 ay önce
  if (flaws.includes("no_stamp")) { hasStamp = false; }
  if (flaws.includes("bad_signature")) { sig = pick(["???", "—", ""]); }

  return { type: "prescription", items, fake, flaws, doctor, sig, date, hasStamp, expired };
}

// --- SEMPTOMLU HASTA İSTEĞİ ---
// 1-3 kalem; her kalem FARKLI kategoriden (oyuncu birden çok sekmeye gitmek zorunda kalsın).
// Adet semptomlu hastada 1 veya 2 ile sınırlı.
function trLower1(str) { return str.charAt(0).toLocaleLowerCase("tr") + str.slice(1); }

// Doğal Türkçe cümle — her kombinasyon için şablon yazmak yerine 2-3 kalıptan kurulur.
function buildSymptomLine(items) {
  const L = items.map(it => it.symptom.label);
  if (items.length === 1) {
    if (items[0].qty === 2) return L[0] + ", iki kutu alayım.";
    return pick([L[0] + ".", L[0] + ", bir şey verir misiniz?", L[0] + ", ne önerirsiniz?"]);
  }
  if (items.length === 2) {
    return pick([
      "Hem " + trLower1(L[0]) + " hem " + trLower1(L[1]) + ", ikisine de bakar mısınız?",
      L[0] + ", ayrıca " + trLower1(L[1]) + ". İkisi için de lazım.",
      L[0] + " bir de " + trLower1(L[1]) + ", ikisini de alayım."
    ]);
  }
  return pick([
    L[0] + ", " + trLower1(L[1]) + ", bir de " + trLower1(L[2]) + ". Üçüne de bakar mısınız?",
    "Hem " + trLower1(L[0]) + " hem " + trLower1(L[1]) + " hem de " + trLower1(L[2]) + ", hepsine bir şey lazım."
  ]);
}

function makeSymptomRequest() {
  const roll = rng();
  const n = roll < 0.60 ? 1 : roll < 0.90 ? 2 : 3;   // %60 / %30 / %10
  // farklı KATEGORİLERDEN seç: önce kategorileri karıştır, sonra her birinden bir semptom
  const cats = shuffledCopy(SYMPTOM_CATEGORIES);
  const items = [];
  for (let i = 0; i < n && i < cats.length; i++) {
    const pool = SYMPTOMS.filter(x => x.category === cats[i]);
    if (!pool.length) continue;
    const qty = rng() < 0.20 ? 2 : 1;               // ara sıra "iki kutu"
    items.push({ symptom: pick(pool), qty });
  }
  return {
    type: "symptom",
    items,
    symptom: items[0].symptom,        // geriye uyum: tek kalemli yollar ve emoji
    line: buildSymptomLine(items)
  };
}

// Çok kalemli semptom hastası daha uzun bekler: tek ilaç isteyenle aynı sürede
// beklemek haksızlık — oyuncunun birden çok sekmeye gitmesi gerekiyor.
// 1 kalem ×1, 2 kalem ×1.25, 3 kalem ×1.5. Reçete ve Medula hastalarına uygulanmaz.
function symptomPatienceMul(request) {
  if (!request || request.type !== "symptom") return 1;
  const n = (request.items || []).length;
  return n >= 3 ? 1.5 : n === 2 ? 1.25 : 1;
}

// semptomlu hastanın istediği KATEGORİ çoklu-kümesi (adet dahil, id tekrarlı liste kalıbı)
function expectedCategoryList(request) {
  const out = [];
  for (const it of (request.items || [{ symptom: request.symptom, qty: 1 }])) {
    for (let i = 0; i < it.qty; i++) out.push(it.symptom.category);
  }
  return out;
}

// tek hasta nesnesi üret (kuyruğa EKLEMEZ). opts: {forcePrescription, forceFake}
// Gün listesi bunu seed altında toplu çağırır; cheat'ler tek tek çağırır.
// Medula (e-reçete) isteği — kağıt YOK, kod var. ASLA sahte değildir: sahtelik kontrolü,
// doktor defteri ve kusur mantığı bu hastada hiç çalışmaz.
function makeMedulaRequest() {
  const count = CONFIG.minPrescriptionItems +
    rand(CONFIG.maxPrescriptionItems - CONFIG.minPrescriptionItems + 1);
  const pool = MEDICINES.slice();
  const items = [];
  for (let i = 0; i < count && pool.length; i++) {
    const m = pool.splice(rand(pool.length), 1)[0];
    const roll = rng();
    const qty = roll < 0.70 ? 1 : roll < 0.90 ? 2 : roll < 0.97 ? 3 : pick([4, 5, 6]);
    items.push({ id: m.id, qty });
  }
  return { type: "medula", items, code: makeMedulaCode(), fake: false };
}

// opts: {forcePrescription, forceFake, forceMedula, night}
function makePatient(opts) {
  opts = opts || {};
  const night = !!opts.night;
  const avatarDef = pick(PATIENT_AVATARS);
  const day = genDay();
  // Reçeteli payı VİTRİN seviyesiyle yükselir (semptomlu payı vitrinSymptomFloor'da korunur)
  const isPrescription = opts.forcePrescription ? true : (rng() < effPrescriptionChance());

  let request;
  if (isPrescription) {
    // Terminal açıksa reçeteli hastaların bir kısmı kağıt yerine Medula kodu getirir.
    // forceFake verilmişse (garanti mekanizması) Medula'ya çevrilmez — Medula sahte olamaz.
    const medula = opts.forceMedula ||
      (medulaUnlocked() && opts.forceFake === undefined && rng() < CONFIG.medulaPatientRatio);
    if (medula) request = makeMedulaRequest();
    // gece: sahte reçete girişimi artar (tavanla sınırlı)
    else request = makePrescription(opts.forceFake,
      (night ? nightFakeChance(day) : fakeChanceFor(day)) * vitrinFakeDilution());
  } else {
    request = makeSymptomRequest();
  }

  return {
    avatar: avatarDef.emoji,
    avatarKey: avatarDef.assetKey,
    request,
    line: request.type === "prescription" ? pick(PRESCRIPTION_LINES)
        : request.type === "medula" ? pick(MEDULA_LINES) : request.line,   // balon repliği (üretimde sabitlenir)
    decided: null,            // reçeteliler için: null | "approve" | "reject"
    maxPatience: CONFIG.basePatience,   // taban; enqueuePatient güncel seviyeyle ezer
    patience: CONFIG.basePatience,
    enterT: 0,
    posCurrent: 0,            // kuyruğa girerken ayarlanır
    bonus: false,             // true => cheat ile enjekte, günün programı dışında
    night: night              // true => günün NÖBET bölümüne ait
  };
}

// hastayı kuyruğa al (giriş animasyonu + sayaç). Program dışı (bonus) hastalar sayılmaz.
function enqueuePatient(patient) {
  // Sabır sahneye çıkış anındaki Bekleme Alanı seviyesine göre kurulur (gün ortasında
  // yükseltme yapılırsa sonraki hastalar hemen faydalanır). Çarpanlar BİRBİRİYLE ÇARPILIR,
  // biri diğerinin yerine geçmez: geliştirme × nöbet × kalem sayısı.
  patient.maxPatience = effPatience()
    * (patient.night ? CONFIG.nightPatienceMultiplier : 1)
    * symptomPatienceMul(patient.request);
  patient.patience = patient.maxPatience;
  patient.posCurrent = game.queue.length + 0.85;   // sağdan kayarak girsin
  game.queue.push(patient);
  if (!patient.bonus) game.daySpawned++;
}

// Sıradaki hastayı sahneye çıkar.
// opts YOKSA: günün ÖNCEDEN ÜRETİLMİŞ listesinden sıradakini çeker (hedef bu listeden hesaplandı).
// opts VARSA: cheat enjeksiyonu — anlık üretilir, bonus işaretlenir, hedefe/sayaca karışmaz.
function spawnPatient(opts) {
  if (game.queue.length >= effMaxQueue()) return;

  if (opts) {
    const p = makePatient(opts);
    p.bonus = true;
    enqueuePatient(p);
    return p;
  }

  const sch = game.daySchedule;
  if (!sch || game.dayScheduleIdx >= sch.patients.length) return;
  const p = sch.patients[game.dayScheduleIdx++];
  enqueuePatient(p);
  return p;
}

// aktif hastanın beklediği ilaç çoklu-kümesi (adetli => id tekrarlı liste)
function expectedMedicineIds() {
  const p = activePatient();
  if (!p) return [];
  if (p.request.type === "prescription" || p.request.type === "medula") {
    const out = [];
    for (const it of p.request.items) for (let i = 0; i < it.qty; i++) out.push(it.id);
    return out;
  }
  // Semptomlu hasta: kategoride birden çok ilaç doğru kabul edilir, tek "doğru liste" yok.
  // Burada TEMSİLİ bir doğru cevap döndürülür (her kalem için o kategorinin ilk ilacı, adetli);
  // gerçek karar checkOrder içinde KATEGORİ çoklu-kümesi karşılaştırmasıyla verilir.
  const out = [];
  for (const it of (p.request.items || [{ symptom: p.request.symptom, qty: 1 }])) {
    const m = MEDICINES.find(x => x.category === it.symptom.category);
    if (m) for (let i = 0; i < it.qty; i++) out.push(m.id);
  }
  return out;
}

// iki listeyi çoklu-küme olarak karşılaştır (sıra önemsiz, adet önemli)
function sameMultiset(a, b) {
  if (a.length !== b.length) return false;
  const m = {};
  for (const x of a) m[x] = (m[x] || 0) + 1;
  for (const x of b) { if (!m[x]) return false; m[x]--; }
  return true;
}

// reçeteli hasta henüz ONAYLA/REDDET kararı bekliyor mu?
function activeNeedsDecision() {
  const p = activePatient();
  // Medula hastasında sahtelik incelemesi YOKTUR — ONAYLA/REDDET fazı hiç çalışmaz.
  return !!(p && !game.feedback && p.request.type === "prescription" && !p.decided);
}
// ilaç seçip servis edilebilir mi? (semptom => evet; reçete => onaylanmışsa)
function servingAllowed() {
  const p = activePatient();
  if (!p || game.feedback) return false;
  if (p.request.type === "prescription") return p.decided === "approve";
  return true;
}

function approvePrescription() {
  const p = activePatient();
  if (!activeNeedsDecision() || p.request.type !== "prescription") return;
  p.decided = "approve";          // ilaç verme moduna geç
  game.counter = [];
  rebuildCounterSlots();
}

function rejectPrescription() {
  const p = activePatient();
  if (!activeNeedsDecision() || p.request.type !== "prescription") return;
  p.decided = "reject";
  game.dayStats.served++;
  if (p.request.fake) {
    // doğru yakalama
    game.money += CONFIG.fakeCatchBonus;
    addDayMoney(CONFIG.fakeCatchBonus);
    game.dayStats.correct++;
    gainReputation(CONFIG.fakeCatchRepGain);
    game.feedback = { ok: true, angry: false, text: "✓ Sahte reçete yakaladın!  +" + CONFIG.fakeCatchBonus + "₺", t: 0 };
    explainDecision(p, [], "DOĞRU", "sahte reçete reddedildi (+" + CONFIG.fakeCatchBonus + "₺)");
  } else {
    // gerçeği boşuna reddetti
    game.dayStats.wrong++;
    game.feedback = { ok: false, angry: false, text: "Müşteriyi boşuna çevirdin", t: 0 };
    explainDecision(p, [], "YANLIŞ", "geçerli reçete reddedildi (satış kaybı + itibar)");
    loseReputation(CONFIG.wrongRejectRepLoss);
  }
}

// kısa uyarı toast'u — game.feedback'i EZMEZ (ayrı, süreli flash)
function flashStockToast(txt) {
  game.stockToast = { text: txt, until: game.clock + CONFIG.stockToastDuration };
}

function tapMedicine(id) {
  if (!servingAllowed()) return;
  const stock = game.stock[id] || 0;
  const m = getMedicine(id);
  // stok yoksa tezgaha ekleme
  if (stock <= 0) { flashStockToast("⛔ " + (m ? m.name : "İlaç") + " — Stok yok!"); return; }
  // tezgahtaki aynı ilaç adedi stoğu aşamaz
  let onCounter = 0;
  for (const cId of game.counter) if (cId === id) onCounter++;
  if (onCounter >= stock) { flashStockToast("⛔ " + (m ? m.name : "İlaç") + " — Stok yetersiz!"); return; }
  game.counter.push(id);
  rebuildCounterSlots();
}

// --- Ecza deposu (PC sipariş ekranı) ---
function openDepot() {

  game.depotPending = {};      // sepet her açılışta temiz

  game.pcScreen = "depot";
}
// PC'ye dokununca: doğrudan depo değil, iki butonlu ANA EKRAN
function openPc() {

  game.depotOpen = true;
  game.pcScreen = "home";
}
function openUpgrades() {
  game.depotPending = {};      // depo sepetini taşıma
  game.depotOpen = true;

}
// NOT: girilen kod BURADA TEMİZLENMEZ — oyuncu koda tekrar bakmak için PC'yi kapatıp
// açtığında yazdıkları durmalı. Temizlenme yalnız şurada olur: başarılı sorgu,
// "Kayıt bulunamadı", SİL tuşu, gün değişimi ve yeni oyun.
function openMedulaScreen() {
  game.depotPending = {};
  game.depotOpen = true;
  game.pcScreen = "medula";
}
function pcHome() { game.depotPending = {}; game.pcScreen = "home"; }
