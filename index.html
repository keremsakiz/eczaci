<script>
"use strict";

// ═════════════════════════════════════════════════════════════════════════════
//  ADMIN BLOK BAŞLANGIÇ — YAYINDAN ÖNCE SİL
// ═════════════════════════════════════════════════════════════════════════════
//  GEÇİCİ GELİŞTİRME ARACI. Yayına ÇIKMAZ. Bu blok (bu satırdan, dosyanın aşağısındaki
//  BİTİŞ şeridine kadar) OLDUĞU GİBİ SİLİNEBİLİR — oyun kodunun hiçbir yeri
//  buradaki hiçbir isme referans vermez. Silme testi yapıldı: blok çıkarılınca
//  dosya sözdizimi geçerli kalır, boot self-test'leri geçer, oyun açılır.
//
//  NE YAPAR
//  Elle test etmek için 15. güne ya da 3. sezona ulaşmak gerektiğinde, oyunu O NOKTAYA
//  GERÇEKTEN OYNAYARAK gelmiş bir oyuncunun durumuyla bırakır. Hiçbir sayı UYDURULMAZ:
//  "gün 15'te şu kadar para olur" diye elle yazılmış bir tablo YOKTUR. Bunun yerine
//  oyunun kendi gün döngüsü çizim yapılmadan hızlıca oynatılır — hasta üretimi, servis
//  kararları, stok tamamlama, geliştirme satın alma, itibar, SGK alacakları, fiyat
//  turları, dilenci ve ruhsat bedelleri hepsi NORMAL YOLDAN, gerçek fonksiyonlarla
//  işler (buildDaySchedule, checkOrder, rejectPrescription, placeDepotOrder,
//  buyUpgrade, beginSeason, tryStartNextSeason, startNextDay...). Sonuçta ortaya çıkan
//  kasa / stok / itibar / geliştirme / alacak / fiyat geçmişi TANIM GEREĞİ tutarlıdır.
//
//  BOT POLİTİKASI, DURUM.md 14.1'deki headless ölçüm harness'ının politikasıdır —
//  böylece buradan çıkan durum, belgede yayımlanmış A/B profili ölçümleriyle
//  karşılaştırılabilir kalır:
//    1. Sabah o günün gerçek listesinden ihtiyaç çıkarılıp stok tamamlanır
//       (ihtiyaç × 1,5, effMaxStock'a kırpık). Bedel rezervinden ETKİLENMEZ.
//    2. Yarın zam haberi varsa, o kategorilerde bir sonraki tura kadar gerçekten
//       satılacak miktarın %20'si bugünden alınır. Sezonun son 2 gününde alınmaz.
//    3. Geliştirme ancak 20 × avgCost rezervin üstündeki fazladan alınır; sezonun
//       son 3 gününde rezerve sonraki sezonun ruhsat bedeli de eklenir.
//    4. Dilenci: stok bolsa (≥3) ilaç, değilse para, ikisi de yoksa reddet.
//       Borcunu ödemeye gelenden ödeme her zaman alınır.
//    5. skill = HASTA BAŞINA doğru karar ihtimali (i.i.d.). Tek zar hem inceleme
//       kararını (sahteyi yakalama) hem ilaç seçimini belirler — DURUM.md'deki
//       "B profili %85" tam olarak budur. skill:1 = kusursuz oyuncu (A profili).
//
//  MODELLEME KARARLARI (bilinçli, ölçümü okurken bilinmesi gereken)
//   • Bot sabah stoğunu O GÜNÜN listesine bakarak tamamlar; gerçek oyuncu bunu
//     deneyimle tahmin eder. Yani stok tarafında bot İDEALİZE bir oyuncudur ve
//     buradan çıkan kasa gerçek oyuncunun ulaşacağının üst bandına yakındır.
//   • Rafta hiçbir uygun ilaç kalmadıysa hasta bekletilir ve sabrı biter (küser).
//     Ceza mantığı KOPYALANMAZ, gerçek update() yolundan geçirilir.
//   • Dilencinin kuyrukta yer tutma maliyeti modellenmez (sim'de zaman yok).
//
//  DETERMİNİZM
//  Botun kendi zarı OYUNUN rastgelelik akışına HİÇ dokunmaz: _rngSource'a el
//  sürülmez, ayrı bir mulberry32 akışı kullanılır ve HER GÜN BAŞINDA (runSeed, gün,
//  skill) üçlüsünden yeniden tohumlanır. Sonuçları:
//    • aynı runSeed + aynı hedef + aynı skill → her zaman aynı durum
//    • sim(10) sonra sim(15) === doğrudan sim(15)  (gün tohumu yola bağlı değil)
//    • hedef günden sonrası, oraya elle oynanarak gelinmiş gibi devam eder
//
//  KULLANIM — EKRANDAN (telefonda asıl yol)
//  Sol alt köşedeki kırmızı ADMIN rozetine dokun → panel açılır. Panelde GÜN ve
//  SEZON seçicileri (− / + / GİT), üç hazır SKILL seviyesi, o anki durum özeti ve
//  KAPAT var. Panel açıkken oyun DONAR (depo panelinin kalıbı). GİT'e basınca önce
//  "hesaplanıyor" karesi boyanır, sonra simülasyon koşar; biterken sonuç ve değişmez
//  denetimi panelde tek satır olarak görünür. Sebep: iPhone Safari'de konsol yok.
//
//  KULLANIM (konsol)
//    cheats.panel(true) / cheats.panel(false) → paneli aç / kapat
//    cheats.panel()                     → panelin durumu + dokunma alanları (okur, değiştirmez)
//    cheats.sim(15)                     → aynı sezonda 15. günün BAŞINA, skill 0,85
//    cheats.sim(15, { skill: 1 })       → kusursuz oyuncunun 15. gün durumu
//    cheats.sim(15, { seed: 42 })       → kariyeri 42 tohumuyla kurup oynat
//    cheats.simSeason(3)                → 3. sezonun 1. gününe (bedeller ödenmiş)
//    cheats.simSeason(3, { gün: 12 })   → 3. sezonun 12. gününe   (day: 12 de olur)
//    cheats.simVerify()                 → denge/tavan/self-test/kariyer değişmezleri
//    cheats.simLog()                    → son simülasyonun gün gün dökümü
//    cheats.simState()                  → özet nesne (konsola basmaz)
//  Her sim SONUNDA değişmez denetimi kendiliğinden koşar ve tek satır basar
//  (~30 ms). Kapatmak için: cheats.sim(15, { verify: false }).
//
//  MALİYET (ölçüldü, headless Node, 20 tohum ortalaması). Simülasyonun kendisi:
//  sim(15) ≈ 11 ms · sim(30) ≈ 23 ms · simSeason(3) ≈ 46 ms · simSeason(6) ≈ 100 ms.
//  Otomatik değişmez denetimi bunlara ~31 ms ekler → en pahalı çağrı bile ~130 ms.
//  Çizim ve animasyon HİÇ çalıştırılmaz; render/requestAnimationFrame'e girilmez.
// ═════════════════════════════════════════════════════════════════════════════
const ADMIN_MODE = true;

if (ADMIN_MODE) {

  // --- Bot politikası sayıları (DURUM.md 14.1 ile birebir) ---
  const ADM = {
    defaultSkill: 0.85,        // "iyi oyuncu" (B profili)
    restockBufferK: 1.5,       // sabah stoğu: ihtiyaç × bu
    upgradeReserveK: 20,       // geliştirme rezervi = bu × avgCost
    priceBuyShare: 0.20,       // zam haberinde alınacak pay
    priceBuyStopBefore: 2,     // sezonun son bu kadar gününde zam avı yok
    feeReserveLastDays: 3,     // son bu kadar günde rezerve sonraki bedel eklenir
    beggarStockMin: 3,         // "stok bol" eşiği (ilaç vermek için)
    upgradeOrder: ["tezgah", "depo", "vitrin", "bekleme", "medula"],
    guard: 4000,               // gün içi kilitlenme koruması
    maxSeason: 20              // panelin sezon seçicisinin üst sınırı
  };

  // --- Botun kendi rastgeleliği: oyunun akışına DOKUNMAZ ---
  let _admRnd = mulberry32(1);
  let _admLastCheck = null;     // son değişmez denetimi sonucu (panel gösterir)
  let _admOrigUpdate = null;    // sarmalanmadan önceki update (bkz. admLetGo)
  function admSeedFor(day, skill) {
    let h = ((game.runSeed >>> 0) ^ 0xAD31FEED) >>> 0;
    h = (h ^ Math.imul(day, 0x9E3779B1)) >>> 0;
    h = (h ^ Math.imul(Math.round(skill * 10000) | 0, 0x85EBCA77)) >>> 0;
    h = Math.imul(h ^ (h >>> 16), 0x2545F491);
    h = Math.imul(h ^ (h >>> 13), 0xC2B2AE35);
    return ((h ^ (h >>> 16)) >>> 0) || 1;
  }
  function admReseed(day, skill) { _admRnd = mulberry32(admSeedFor(day, skill)); }
  function admNow() {
    return (typeof performance !== "undefined" && performance.now) ? performance.now() : Date.now();
  }
  function admSkillOf(v) { return clamp(typeof v === "number" ? v : ADM.defaultSkill, 0, 1); }

  // ---------------------------------------------------------------------------
  //  TALEP MODELİ — bir günün gerçek listesinden ilaç ihtiyacı (id -> adet)
  //  Sahte reçeteler reddedilecekleri için sayılmaz. Semptomlu hastada oyuncu
  //  kategoriden istediğini verebildiği için ihtiyaç kategoriye EŞİT DAĞITILIR
  //  (toplam adet aynı kalır) — servis fonksiyonu da stoğu bol olanı seçiyor.
  // ---------------------------------------------------------------------------
  function admNeedOf(sch) {
    const need = {};
    if (!sch || !sch.patients) return need;
    for (const p of sch.patients) {
      const r = p.request;
      if (!r || r.fake || isBeggarType(r.type)) continue;
      if (r.type === "prescription" || r.type === "medula") {
        for (const it of r.items) need[it.id] = (need[it.id] || 0) + it.qty;
      } else {
        for (const it of (r.items || [{ symptom: r.symptom, qty: 1 }])) {
          const cands = MEDICINES.filter(m => m.category === it.symptom.category);
          if (!cands.length) continue;
          const share = it.qty / cands.length;
          for (const m of cands) need[m.id] = (need[m.id] || 0) + share;
        }
      }
    }
    return need;
  }

  // Sepeti gerçek depo fonksiyonlarıyla doldur ve siparişi ver. Bütçe aşılmaz.
  // Dönüş: harcanan ₺.
  function admOrder(want, budget) {
    const rows = [];
    for (const id in want) {
      const q = Math.floor(want[id]);
      if (q > 0) rows.push({ id: id, q: q, w: want[id] });
    }
    if (!rows.length) return 0;
    rows.sort((a, b) => (b.w - a.w) || (a.id < b.id ? -1 : 1));   // en çok gerekenden başla
    openDepot();                                   // gerçek yol: PC → ECZA DEPOSU
    let left = Math.max(0, Math.min(budget, game.money));
    for (const r of rows) {
      const m = getMedicine(r.id);
      if (!m) continue;
      const unit = Math.max(1, medCost(m));
      const maxAdd = Math.max(0, effMaxStock() - (game.stock[r.id] || 0));
      const q = Math.min(r.q, maxAdd, Math.floor(left / unit));
      if (q <= 0) continue;
      changePending(r.id, q);
      left -= unit * q;
    }
    const total = depotOrderTotal();
    placeDepotOrder();
    closeDepot();
    return total;
  }

  // 1) Sabah stok tamamlama — o günün ihtiyacı × restockBufferK
  function admRestock() {
    const need = admNeedOf(game.daySchedule);
    const want = {};
    for (const id in need) {
      const target = Math.min(effMaxStock(), Math.ceil(need[id] * ADM.restockBufferK));
      const q = target - (game.stock[id] || 0);
      if (q > 0) want[id] = q;
    }
    return admOrder(want, game.money);
  }

  // 2) Zam avı — yarın ALIŞI artacak kategorilerde, bir sonraki tura kadar gerçekten
  //    satılacak miktarın priceBuyShare'i bugünden alınır (bugün hâlâ ucuz).
  function admPreBuy() {
    if (game.dayNumber > CONFIG.seasonDays - ADM.priceBuyStopBefore) return 0;
    const r = priceRoundOn(game.dayNumber + 1);
    if (!r) return 0;
    const upCat = {};
    let any = false;
    for (const c of r.cats) if (c.up) { upCat[c.category] = true; any = true; }
    if (!any) return 0;
    // yarından, BİR SONRAKİ tur gününün bir öncesine kadar
    let end = game.dayNumber + 1;
    while (end < CONFIG.seasonDays && !isPriceUpdateDay(end + 1)) end++;
    const need = {};
    for (let d = game.dayNumber + 1; d <= Math.min(end, CONFIG.seasonDays); d++) {
      const n = admNeedOf(getDaySchedule(d));
      for (const id in n) need[id] = (need[id] || 0) + n[id];
    }
    const want = {};
    for (const id in need) {
      const m = getMedicine(id);
      if (!m || !upCat[m.category]) continue;
      const q = Math.ceil(need[id] * ADM.priceBuyShare);
      if (q > 0) want[id] = q;
    }
    return admOrder(want, Math.max(0, game.money - ADM.upgradeReserveK * avgCost));
  }

  // 3) Geliştirme — rezervin üstündeki fazladan, öncelik sırasıyla
  function admBuyUpgrades(bought) {
    let reserve = ADM.upgradeReserveK * avgCost;
    if (game.dayNumber > CONFIG.seasonDays - ADM.feeReserveLastDays) reserve += nextSeasonFee();
    for (let pass = 0; pass < 16; pass++) {
      let did = false;
      for (const id of ADM.upgradeOrder) {
        const u = UPGRADE_BY_ID[id];
        if (!u) continue;
        const lv = upgradeLevel(id);
        if (lv >= u.maxLevel) continue;
        const cost = upgradeCost(id, lv + 1);
        if (game.money - cost < reserve) continue;
        if (buyUpgrade(id)) { bought.push(u.name + " Lv" + (lv + 1)); did = true; }
      }
      if (!did) break;
    }
  }

  // ---------------------------------------------------------------------------
  //  SERVİS — sepet gerçek tapMedicine() ile kurulur, karar gerçek checkOrder()
  // ---------------------------------------------------------------------------
  // Doğru cevap. Reçete/Medula: kalemlerin kendisi. Semptom: kategoriden STOĞU EN BOL
  // olan ilaç (gerçek oyuncu da rafta ne varsa onu verir).
  function admCorrectIds(p) {
    const r = p.request;
    const out = [];
    if (r.type === "prescription" || r.type === "medula") {
      for (const it of r.items) for (let i = 0; i < it.qty; i++) out.push(it.id);
      return out;
    }
    for (const it of (r.items || [{ symptom: r.symptom, qty: 1 }])) {
      const cands = MEDICINES.filter(m => m.category === it.symptom.category);
      for (let i = 0; i < it.qty; i++) {
        let best = null, bestN = -Infinity;
        for (const m of cands) {
          let used = 0;
          for (const x of out) if (x === m.id) used++;
          const n = (game.stock[m.id] || 0) - used;
          if (n > bestN) { bestN = n; best = m; }
        }
        if (best) out.push(best.id);
      }
    }
    return out;
  }
  // Yanlış cevap: bir kalem BAŞKA KATEGORİDEN bir ilaçla değiştirilir (hem reçete
  // hem semptom eşleşmesini kesin bozar). Değiştirecek stok yoksa kalem eksiltilir /
  // adet fazlalaştırılır — her hâlde sepet boş kalmaz.
  function admWrongIds(correct) {
    const out = correct.slice();
    if (!out.length) return out;
    const m0 = getMedicine(out[0]);
    const cat = m0 ? m0.category : null;
    for (const m of MEDICINES) {
      if (m.category === cat) continue;
      if ((game.stock[m.id] || 0) > 0 && out.indexOf(m.id) < 0) { out[0] = m.id; return out; }
    }
    if (out.length > 1) out.pop(); else out.push(out[0]);
    return out;
  }
  // Rafta hiçbir şey kalmadı: hasta bekletilir, sabrı biter. Ceza/sayaç mantığı
  // kopyalanmaz — gerçek update() yolundan geçer.
  function admLetGo(p) {
    p.patience = 0;
    const open = game.depotOpen, scr = game.pcScreen, intro = game.nightIntro;
    game.depotOpen = false; game.nightIntro = null;
    // DİKKAT: SARMALANMAMIŞ update çağrılır. Sarmalanmış olan, ekran içi panel
    // açıkken oyunu dondurup hemen dönüyor; panelden başlatılan simülasyonda bu
    // hastanın küsme yolunu hiç çalıştırmaz ve gün döngüsü ilerlemezdi.
    (_admOrigUpdate || update)(0);
    game.depotOpen = open; game.pcScreen = scr; game.nightIntro = intro;
  }
  function admServe(p, ids) {
    game.counter = [];
    let placed = 0;
    for (const id of ids) if (tapMedicine(id)) placed++;
    if (!placed) { admLetGo(p); return; }
    checkOrder();                       // gerçek karar/ekonomi/itibar yolu
  }

  // Bir hastayı baştan sona işle. Tek zar (skill) hem inceleme hem servis kararını verir.
  function admHandle(p, skill) {
    const t = p.request.type;
    if (t === "beggarpay") { beggarPayCollect(); return; }
    if (t === "beggar") {
      // stok bolsa ilaç · değilse para · ikisi de yoksa reddet (DURUM.md 14.1 politikası)
      const gift = beggarGiftMedicine();
      if (gift && (game.stock[gift.id] || 0) >= ADM.beggarStockMin) beggarGiveMedicine();
      else if (game.money > 0) beggarGiveMoney();
      // Yakalayıcı: yukarıdaki iki yol da sessizce dönebilir (raf boş / kasa boş).
      // O durumda karar VERİLMEMİŞ olur ve gün döngüsü ilerlemez — reddetmek hem
      // politikanın son maddesi hem kilitlenmeye karşı garanti.
      if (!game.feedback) beggarRefuse(false);
      return;
    }
    const right = _admRnd() < skill;
    if (t === "medula") {
      openMedulaScreen();                       // gerçek yol: kodu terminale gir
      game.medulaInput = p.request.code;
      medulaSubmit();
      closeDepot();
    }
    if (t === "prescription") {
      const approve = right ? !p.request.fake : p.request.fake;
      if (!approve) { rejectPrescription(); return; }
      approvePrescription();
    }
    const correct = admCorrectIds(p);
    admServe(p, right ? correct : admWrongIds(correct));
  }

  // ---------------------------------------------------------------------------
  //  GÜN DÖNGÜSÜ — çizim/animasyon yok, oyunun kendi fonksiyonları
  // ---------------------------------------------------------------------------
  let _admLog = [];
  // Simülasyon sırasında karar teşhis bloğu (CONFIG.debugDecisions) SUSTURULUR: 14 günde
  // ~300 blok basıyor ve özeti konsolda görünmez hâle getiriyor. Değer sim bitince
  // aynen geri konur — oyunun normal oynanışında teşhis açık kalır.
  let _admQuietDepth = 0, _admDebugBak = null;
  function admQuietOn() {
    if (_admQuietDepth++ === 0) { _admDebugBak = CONFIG.debugDecisions; CONFIG.debugDecisions = false; }
  }
  function admQuietOff() {
    if (--_admQuietDepth <= 0) { _admQuietDepth = 0; CONFIG.debugDecisions = _admDebugBak; }
  }
  function admPlayDay(skill) {
    const day = game.dayNumber;
    const money0 = game.money, rep0 = game.reputation;
    admReseed(day, skill);
    const bought = [];
    const spentStock = admRestock() + admPreBuy();
    admBuyUpgrades(bought);

    let guard = 0;
    while (game.state === STATE.PLAYING && game.dayNumber === day && guard++ < ADM.guard) {
      if (game.nightIntro !== null) game.nightIntro = null;    // "NÖBET BAŞLIYOR" kartına dokun
      maybeSpawnBeggar();                                      // program DIŞI hastalar önce
      maybeSpawnBeggarPay();
      while (game.queue.length < effMaxQueue() && game.daySpawned < patientsForDay()) {
        if (!spawnPatient()) break;
      }
      const p = activePatient();
      if (!p) break;
      admHandle(p, skill);
      if (game.feedback) onFeedbackEnd();
      else if (activePatient() === p) break;                   // ilerleme yok: kilitlenme
    }
    const st = game.dayStats;
    _admLog.push({
      sezon: careerSeason(), gün: day, N: game.daySchedule ? game.daySchedule.N : 0,
      hedef: (game.dayResult ? game.dayResult.goal : 0) + "₺",
      "gün kazancı": Math.round(st.money) + "₺",
      "hedef tuttu": game.dayResult && game.dayResult.met ? "✓" : "✗",
      doğru: st.correct, yanlış: st.wrong, küsen: st.angry,
      "sahte yakalanan": st.fakeCaught, "sahte KAÇAN": st.fakeMissed,
      "stok siparişi": Math.round(spentStock) + "₺",
      geliştirme: bought.length ? bought.join(" · ") : "—",
      kasa: Math.round(game.money) + "₺",
      "kasa Δ": (game.money - money0 >= 0 ? "+" : "") + Math.round(game.money - money0) + "₺",
      itibar: Math.round(game.reputation * 10) / 10,
      "itibar Δ": Math.round((game.reputation - rep0) * 10) / 10
    });
  }

  // Oynanabilir mi (gün ilerletilebilir mi)?
  function admAlive() { return game.state === STATE.PLAYING || game.state === STATE.DAYEND; }

  // Sezonu sonuna kadar oynat (SEASONEND ya da CAREEREND'e kadar).
  function admPlaySeasonOut(skill) {
    // Tur başına ya bir gün oynanır ya da bir gün ilerletilir => sezon başına en fazla
    // 2 × seasonDays tur. Sınır bunun üstünde tutulur, yoksa sezon yarıda kesilir.
    let guard = 0;
    while (admAlive() && guard++ < CONFIG.seasonDays * 2 + 8) {
      if (game.state === STATE.DAYEND) { startNextDay(); continue; }
      admPlayDay(skill);
    }
  }

  // Hedef günün BAŞINA kadar oynat (aynı sezon içinde).
  function admPlayToDay(targetDay, skill) {
    let guard = 0;
    while (game.dayNumber < targetDay && admAlive() && guard++ < CONFIG.seasonDays * 2 + 8) {
      if (game.state === STATE.DAYEND) { startNextDay(); continue; }
      admPlayDay(skill);
      if (game.state === STATE.DAYEND && game.dayNumber < targetDay) startNextDay();
    }
  }

  // ---------------------------------------------------------------------------
  //  HAZIRLIK — hedef, bulunduğumuz noktanın gerisindeyse kariyer TOHUM KORUNARAK
  //  baştan kurulur; böylece sim(15) sonra sim(5) yine aynı koşunun 5. gününü verir.
  // ---------------------------------------------------------------------------
  function admPos() {
    if (!game.career) return Infinity;
    if (game.state === STATE.SEASONEND) return careerSeason() * 1000 + 999;
    if (!admAlive()) return Infinity;
    return careerSeason() * 1000 + game.dayNumber;
  }
  function admPrepare(opts, wantSeason, wantDay) {
    const want = wantSeason * 1000 + wantDay;
    const restart = (opts.seed != null) || admPos() > want;
    if (!restart) {
      if (game.state === STATE.DAYEND && game.dayNumber < wantDay) startNextDay();
      return false;
    }
    const seed = ((opts.seed != null) ? (opts.seed >>> 0)
                 : (game.career ? game.career.seed : newRunSeed())) || 1;
    startNewCareer();
    game.career.seed = seed;      // tohum sabitlensin: aynı çağrı aynı kariyeri kursun
    beginSeason(1);               // 1. sezon bedelsiz — kasa/stok/geliştirme startNewCareer'dan
    return true;
  }

  // ---------------------------------------------------------------------------
  //  RAPOR
  // ---------------------------------------------------------------------------
  function admTotals() {
    const t = (game.career && game.career.totals) || {};
    const s = game.seasonStats || {};
    const d = game.dayStats || {};
    const add = k => (t[k] || 0) + (s[k] || 0) + (d[k] || 0);
    return { fakeCaught: add("fakeCaught"), fakeMissed: add("fakeMissed"),
             served: add("served"), correct: add("correct"), wrong: add("wrong"),
             angry: add("angry") };
  }
  function admStockTotal() {
    let n = 0, kinds = 0;
    for (const m of MEDICINES) { const q = game.stock[m.id] || 0; n += q; if (q > 0) kinds++; }
    return { n: n, kinds: kinds };
  }
  function admPriceHistory() {
    const out = [];
    for (let d = 1; d <= game.dayNumber; d++) {
      const r = priceRoundOn(d);
      if (r) out.push("gün " + d + " (" + priceRoundLabel(r) + ")");
    }
    return out;
  }
  function admReport(title, skill, days, ms) {
    const st = admStockTotal(), tot = admTotals();
    const ph = admPriceHistory();
    const stateNote = game.state === STATE.CAREEREND
        ? "  ⛔ KARİYER BİTTİ (" + (game.careerResult && game.careerResult.reason) + ")"
      : game.state === STATE.SEASONEND ? "  ⏸ SEZON SONU ekranı" : "";
    console.log("%c[ADMIN] " + title + stateNote, "color:#ff9d2f;font-weight:bold");
    console.log("  konum ............ Sezon " + careerSeason() + " · Gün " + game.dayNumber +
                " / " + CONFIG.seasonDays + " (gün başı)");
    console.log("  skill ............ " + skill + "  ·  oynanan gün: " + days +
                "  ·  süre: " + Math.round(ms) + " ms");
    console.log("  kasa ............. " + formatMoney(Math.round(game.money)) +
                "   (kariyer peak " + formatMoney(Math.round(game.career ? game.career.peakMoney : 0)) + ")");
    console.log("  itibar ........... " + (Math.round(game.reputation * 10) / 10) +
                " / " + CONFIG.repMax);
    console.log("  geliştirmeler .... " + UPGRADES.map(u =>
                u.name + " Lv" + upgradeLevel(u.id) + "/" + u.maxLevel).join(" · "));
    console.log("  toplam stok ...... " + st.n + " kutu (" + st.kinds + "/" + MEDICINES.length +
                " ilaçta stok var, tavan " + effMaxStock() + ")");
    console.log("  bekleyen SGK ..... " + formatMoney(pendingReceivables()) +
                "   (yazılan " + formatMoney(Math.round(game.medulaBooked)) +
                " · yatan " + formatMoney(Math.round(game.medulaCollected)) + ")");
    console.log("  sahte reçete ..... yakalanan " + tot.fakeCaught + " · KAÇAN " + tot.fakeMissed +
                "  (servis " + tot.served + " · doğru " + tot.correct + " · yanlış " + tot.wrong +
                " · küsen " + tot.angry + ")");
    console.log("  ödenen bedel ..... " + formatMoney(Math.round((game.career && game.career.totals.feePaid) || 0)) +
                "   (bu sezon " + formatMoney(Math.round(game.seasonFeePaid || 0)) +
                " · sonraki " + formatMoney(nextSeasonFee()) + ")");
    console.log("  dilenci defteri .. bekleyen geri ödeme " + formatMoney(pendingBeggarReturns()) +
                " (" + game.beggarReturns.length + " borçlu)");
    console.log("  fiyat turları .... " + (ph.length ? ph.join(" · ") : "(henüz yok)"));
    console.log("  tohum ............ kariyer " + (game.career ? game.career.seed : "-") +
                " · sezon(runSeed) " + game.runSeed);
    console.log("  → cheats.simLog() gün dökümü · cheats.simVerify() değişmez denetimi");
  }

  // ---------------------------------------------------------------------------
  //  DEĞİŞMEZ DENETİMİ — testler oyun state'ini kirletir, o yüzden tam yedek/geri yükleme
  // ---------------------------------------------------------------------------
  // structuredClone TERCİH EDİLİR: game içindeki PAYLAŞILAN REFERANSLARI korur.
  // Kritik olan şu paylaşım: game.queue[i] ile game.daySchedule.patients[k] AYNI hasta
  // nesnesidir (spawnPatient listeden itip kuyruğa koyar). JSON turu bu bağı koparır ve
  // kuyruktaki hasta ile programdaki hasta iki ayrı nesneye bölünür. Zararsız olduğu
  // ölçüldü ama denetim aracının oyun durumunu HİÇ değiştirmemesi gerekir; bu yüzden
  // JSON yalnız structuredClone bulunmayan ortamlarda yedek yoldur.
  const _admClone = (typeof structuredClone === "function")
    ? structuredClone
    : (o => JSON.parse(JSON.stringify(o)));
  function admSnapshot() {
    const s = {};
    for (const k in game) s[k] = game[k];
    return _admClone(s);
  }
  function admRestoreSnap(s) {
    for (const k in s) game[k] = s[k];
    invalidateDaySchedules();
  }
  function admVerify(verbose) {
    const res = admRunChecks(verbose);
    console.log("%c[ADMIN] Değişmez denetimi: " + (res.ok ? "TÜMÜ GEÇTİ ✓" : "BAŞARISIZ ✗"),
                "color:" + (res.ok ? "#5ec48a" : "#e8736b") + ";font-weight:bold");
    admPrintChecks(res);
    return res;
  }
  // Sim sonunda basılan TEK satır; bir şey düşerse ayrıntı da basılır.
  function admVerifyLine(res) {
    console.log("  değişmezler ...... " + (res.ok
      ? "denge ✓ · konsantrasyon ✓ · selfTestPatients ✓ · SGK defteri ✓ · kariyer ✓"
      : "BAŞARISIZ ✗ — ayrıntı aşağıda"));
    if (!res.ok) admPrintChecks(res);
  }
  function admPrintChecks(res) {
    console.log("  verifyGoalBalanceAllTiers ....... " + (res.denge ? "✓" : "✗"));
    console.log("  verifyConcentrationCapAllTiers .. " + (res.konsantrasyon ? "✓" : "✗"));
    console.log("  selfTestPatients ................ " + (res.selfTestPatients ? "✓" : "✗"));
    console.log("  verifyMedulaLedger .............. " + (res.medulaDefteri ? "✓" : "✗"));
    console.log("  kariyer değişmezleri ............ " +
                (res.kariyerDeğişmezleri ? "✓" : "✗ — " + res.ihlaller.join(" | ")));
  }
  function admRunChecks(verbose) {
    const snap = admSnapshot();
    const res = {};
    try {
      res.denge = verifyGoalBalanceAllTiers(!!verbose);
      res.konsantrasyon = verifyConcentrationCapAllTiers(!!verbose);
      res.selfTestPatients = selfTestPatients();
      res.medulaDefteri = verifyMedulaLedger();
    } finally { admRestoreSnap(snap); }
    // kariyer değişmezleri — simülasyon SONRASI canlı state üzerinde
    const cr = game.career;
    const inv = [];
    if (cr) {
      // NOT: peak gün SONUNDA güncellenir; gün başında yatan SGK alacağı kasayı
      // geçici olarak peak'in üstüne çıkarabilir — bu bir hata DEĞİL. Denetlenebilir
      // olan şey peak'in kapanmış sezon skorlarının hepsini kapsaması.
      for (const sx of cr.seasons) if (cr.peakMoney < sx.score) inv.push("peak kasa sezon " + sx.season + " skorunun altında");
      if (cr.season < 1) inv.push("sezon numarası < 1");
      if (cr.totals.feePaid < 0) inv.push("ödenen bedel negatif");
      let sumFee = 0;
      for (let n = 2; n <= cr.season; n++) sumFee += seasonFeeFor(n);
      if (Math.abs(cr.totals.feePaid - sumFee) > 0.5)
        inv.push("ödenen bedel toplamı formülle tutmuyor: " + Math.round(cr.totals.feePaid) + " ≠ " + sumFee);
      if (cr.seasons.length !== cr.totals.seasonsPlayed)
        inv.push("kariyer sezon listesi ile sayaç tutmuyor");
    }
    if (game.dayNumber < 1 || game.dayNumber > CONFIG.seasonDays) inv.push("gün numarası sezon dışında");
    if (game.reputation < CONFIG.minReputation || game.reputation > CONFIG.repMax) inv.push("itibar bant dışında");
    if (game.money < 0) inv.push("kasa negatif");
    for (const m of MEDICINES) {
      const q = game.stock[m.id] || 0;
      if (q < 0 || q > effMaxStock()) { inv.push("stok bant dışında: " + m.id + "=" + q); break; }
    }
    res.kariyerDeğişmezleri = inv.length === 0;
    res.ihlaller = inv;
    res.ok = res.denge && res.konsantrasyon && res.selfTestPatients &&
             res.medulaDefteri && res.kariyerDeğişmezleri;
    _admLastCheck = res;        // ekran içi panel bu sonucu gösterir
    return res;
  }

  // ---------------------------------------------------------------------------
  //  DIŞ API
  // ---------------------------------------------------------------------------
  function admSim(targetDay, opts) {
    opts = opts || {};
    const skill = admSkillOf(opts.skill);
    let target = Math.round(targetDay || 1);
    if (target < 1) target = 1;
    if (target > CONFIG.seasonDays) {
      console.warn("[ADMIN] Sezon " + CONFIG.seasonDays + " günlük; hedef " + target +
                   " → " + CONFIG.seasonDays + "'a kırpıldı. Sonraki sezon için cheats.simSeason().");
      target = CONFIG.seasonDays;
    }
    const t0 = admNow();
    _admLog = [];
    let day0 = game.dayNumber;
    admQuietOn();
    try {
      admPrepare(opts, careerSeason(), target);
      day0 = game.dayNumber;
      admPlayToDay(target, skill);
    } finally { admQuietOff(); }
    if (game.dayNumber < target) {
      console.warn("[ADMIN] Gün " + target + "'e ULAŞILAMADI — koşu " + game.dayNumber +
                   ". günde bitti (" + (game.careerResult ? game.careerResult.reason : game.state) +
                   "). Bu bir hata değil: bu skill'de oyuncu o güne gelemiyor demek.");
    }
    admReport("sim(" + target + ")", skill, Math.max(0, game.dayNumber - day0), admNow() - t0);
    if (opts.verify !== false) admVerifyLine(admRunChecks(false));
    return admState();
  }

  function admSimSeason(targetSeason, opts) {
    opts = opts || {};
    const skill = admSkillOf(opts.skill);
    const wantDay = clamp(Math.round(opts["gün"] || opts.day || 1), 1, CONFIG.seasonDays);
    let target = Math.round(targetSeason || 1);
    if (target < 1) target = 1;
    const t0 = admNow();
    _admLog = [];
    let days0 = 0, days1 = 0;
    admQuietOn();
    try {
      admPrepare(opts, target, wantDay);
      days0 = (game.career ? game.career.totals.daysPlayed : 0) + game.dayNumber;
      let guard = 0;
      while (careerSeason() < target && guard++ < 64) {
        admPlaySeasonOut(skill);
        if (game.state !== STATE.SEASONEND) break;        // itibar çöktü → kariyer bitti
        if (!tryStartNextSeason()) break;                 // ruhsat bedeli ödenemedi
      }
      if (careerSeason() === target && admAlive()) admPlayToDay(wantDay, skill);
      days1 = (game.career ? game.career.totals.daysPlayed : 0) + game.dayNumber;
    } finally { admQuietOff(); }
    if (careerSeason() !== target) {
      console.warn("[ADMIN] Sezon " + target + "'e ULAŞILAMADI — kariyer " +
                   careerSeason() + ". sezonda bitti (" +
                   (game.careerResult ? game.careerResult.reason : game.state) +
                   "). skill'i yükselt ya da hedefi düşür.");
    }
    admReport("simSeason(" + target + ", gün " + wantDay + ")", skill,
              Math.max(0, days1 - days0), admNow() - t0);
    if (opts.verify !== false) admVerifyLine(admRunChecks(false));
    return admState();
  }

  function admState() {
    const st = admStockTotal(), tot = admTotals();
    return {
      sezon: careerSeason(), gün: game.dayNumber, kasa: Math.round(game.money),
      itibar: Math.round(game.reputation * 10) / 10,
      geliştirmeler: UPGRADES.reduce((o, u) => { o[u.id] = upgradeLevel(u.id); return o; }, {}),
      stok: st.n, bekleyenSGK: pendingReceivables(),
      sahteKaçan: tot.fakeMissed, sahteYakalanan: tot.fakeCaught,
      ödenenBedel: Math.round((game.career && game.career.totals.feePaid) || 0),
      kariyerTohumu: game.career ? game.career.seed : null, runSeed: game.runSeed,
      state: game.state
    };
  }

  function admLogTable() {
    if (!_admLog.length) { console.log("[ADMIN] Kayıt yok — önce cheats.sim() çalıştır."); return []; }
    console.table(_admLog);
    return _admLog;
  }

  // ---------------------------------------------------------------------------
  //  EKRAN İÇİ PANEL
  //  Asıl test telefonda yapılıyor ve iPhone Safari'de konsol yok. Rozete dokununca
  //  açılan bu panel, cheats.sim / cheats.simSeason'ı parmakla çağırılabilir kılar.
  //  YENİ GÖRSEL DİL İCAT EDİLMEZ: panel, buton ve pill çizimi oyunun kendi
  //  yardımcılarıyla yapılır (drawPanel · drawSolidButton · fillRoundRect · fitText),
  //  PC ekranlarıyla (drawPcScreen) aynı kalıp — koyu kart + neon buton + ✕ düğmesi.
  //  Tek bilinçli fark BAŞLIK ŞERİDİNİN KIRMIZI olması: bu panel oyunun parçası değil.
  // ---------------------------------------------------------------------------
  const ADM_TAP_MIN = 48;        // en küçük dokunma alanı kenarı (CSS px)
  const ADM_SKILLS = [
    { label: "Acemi",    pct: "%70",  v: 0.70 },
    { label: "Ortalama", pct: "%85",  v: 0.85 },
    { label: "Kusursuz", pct: "%100", v: 1.00 }
  ];
  const admPanel = {
    open: false, busy: false, busyLabel: "", t: 0,
    day: 1, season: 1, skill: ADM.defaultSkill,
    msg: null, msg2: null, bad: false
  };
  // Son çizilen dokunma alanları. Çizim ve dokunma AYNI yerleşimi okur (oyunun
  // layout.* kalıbı) — panel her karede yeniden ölçülür, ekran döndürülse de tutar.
  let _admHit = { badge: null, badgeTap: null, panel: null };

  function admIn(px, py, r, grow) {
    if (!r) return false;
    const g = grow || 0;
    return px >= r.x - g && px <= r.x + r.w + g && py >= r.y - g && py <= r.y + r.h + g;
  }

  // --- Ekrandaki ADMIN rozeti (sol alt köşe) — aynı zamanda panelin açma düğmesi ---
  function admDrawBadge() {
    const w = layout.w, h = layout.h;
    if (!w || !h) return;
    const s = Math.max(12, Math.round(Math.min(w, h) * 0.032));
    const pad = Math.round(s * 0.62);
    const label = "ADMIN";
    ctx.save();
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.font = "800 " + s + "px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
    const tw = ctx.measureText(label).width;
    const bw = tw + pad * 2.6, bh = s + pad * 2.2;
    const x = pad * 1.2, y = h - bh - pad * 1.2;
    // Çizilen rozet ile DOKUNMA ALANI ayrı: rozet küçük kalsın (oyunu örtmesin) ama
    // parmakla basılabilsin. Alan ADM_TAP_MIN'e kadar simetrik büyütülür — sabit bir
    // yüzde eklemek dar ekranda yetmiyor, geniş ekranda gereksiz yer kaplıyordu.
    _admHit.badge = { x: x, y: y, w: bw, h: bh };
    const gx = Math.max(0, (ADM_TAP_MIN - bw) / 2), gy = Math.max(0, (ADM_TAP_MIN - bh) / 2);
    const tw2 = bw + gx * 2, th2 = bh + gy * 2;
    // Büyütülen alan ekran dışına taşarsa KAYDIRILIR, küçültülmez: rozet köşede
    // olduğu için kaydırılmış alan rozeti yine tamamen kapsar.
    _admHit.badgeTap = { x: clamp(x - gx, 0, Math.max(0, w - tw2)),
                         y: clamp(y - gy, 0, Math.max(0, h - th2)), w: tw2, h: th2 };
    ctx.globalAlpha = admPanel.open ? 0.55 : 0.95;
    fillRoundRect(x, y, bw, bh, bh * 0.28, "#c3122b");
    strokeRoundRect(x, y, bw, bh, bh * 0.28, "rgba(255,255,255,0.85)", Math.max(1, s * 0.08));
    ctx.fillStyle = "#ffffff";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, x + bw / 2 - s * 0.22, y + bh / 2 + s * 0.04);
    // küçük "dokun" oku — rozetin tıklanabilir olduğunu göstersin
    ctx.font = "800 " + Math.round(s * 0.8) + "px -apple-system, sans-serif";
    ctx.fillText("▸", x + bw - pad * 0.95, y + bh / 2 + s * 0.04);
    ctx.restore();
  }

  // --- Yerleşim: panel her karede ölçülür (oyunun computeLayout kalıbı) ---
  function admStepRow(x, y, w, h) {
    const gap = w * 0.028, sq = h, git = w * 0.30;
    const val = w - sq * 2 - git - gap * 3;
    return {
      minus: { x: x,                               y: y, w: sq,  h: h },
      value: { x: x + sq + gap,                    y: y, w: val, h: h },
      plus:  { x: x + sq + gap + val + gap,        y: y, w: sq,  h: h },
      git:   { x: x + w - git,                     y: y, w: git, h: h }
    };
  }
  function admPanelLayout() {
    const S = layout.stage || { x: 0, y: 0, w: layout.w, h: layout.h };
    const pw = S.w * 0.92, ph = S.h * 0.90;
    const px = S.x + (S.w - pw) / 2, py = S.y + (S.h - ph) / 2;
    const R = { panel: { x: px, y: py, w: pw, h: ph } };
    R.barH = ph * 0.072;
    R.pad = pw * 0.055;
    R.cx = px + R.pad;
    R.cw = pw - R.pad * 2;
    // ✕ görünüşü oyunun depo panelininkiyle AYNI ölçüde (S.w * 0.085) — görsel dil
    // değişmesin. Dokunma alanı ayrıca ADM_TAP_MIN'e büyütülür (rozetteki kalıp).
    const cs = S.w * 0.085;
    R.close = { x: px + pw - cs * 0.85, y: py - cs * 0.35, w: cs, h: cs };
    const cg = Math.max(0, (ADM_TAP_MIN - cs) / 2);
    R.closeTap = { x: R.close.x - cg, y: R.close.y - cg, w: cs + cg * 2, h: cs + cg * 2 };

    let y = py + R.barH + ph * 0.028;
    R.status = { x: R.cx, y: y, w: R.cw, h: ph * 0.185 };
    y += R.status.h + ph * 0.026;

    R.skillLabelY = y + ph * 0.016;  y += ph * 0.038;
    const sh = ph * 0.080, sgap = R.cw * 0.025, sw = (R.cw - sgap * 2) / 3;
    R.skills = ADM_SKILLS.map((sk, i) => ({ x: R.cx + i * (sw + sgap), y: y, w: sw, h: sh, i: i }));
    y += sh + ph * 0.028;

    const rowH = ph * 0.088;
    R.dayLabelY = y + ph * 0.014;    y += ph * 0.035;
    R.dayRow = admStepRow(R.cx, y, R.cw, rowH);     y += rowH + ph * 0.026;
    R.seasonLabelY = y + ph * 0.014; y += ph * 0.035;
    R.seasonRow = admStepRow(R.cx, y, R.cw, rowH);  y += rowH + ph * 0.022;
    R.msgY = y;

    const kh = ph * 0.088;
    R.kapat = { x: R.cx, y: py + ph - ph * 0.030 - kh, w: R.cw, h: kh };
    return R;
  }

  function admStatusLines() {
    const st = admStockTotal(), tot = admTotals();
    return [
      "Sezon " + careerSeason() + " · Gün " + game.dayNumber + " / " + CONFIG.seasonDays +
        (game.state === STATE.PLAYING ? "" : "  [" + game.state + "]"),
      "💰 " + formatMoney(Math.round(game.money)) +
        "   ⭐ " + (Math.round(game.reputation * 10) / 10) + "/" + CONFIG.repMax +
        "   📦 " + st.n + " kutu",
      UPGRADES.map(u => u.emoji + upgradeLevel(u.id)).join("  ") +
        "   🏦 " + formatMoney(pendingReceivables()),
      "sahte kaçan " + tot.fakeMissed + " · yakalanan " + tot.fakeCaught +
        " · bedel " + formatMoney(Math.round((game.career && game.career.totals.feePaid) || 0))
    ];
  }

  function admDrawPanel() {
    const c = CONFIG.colors;
    const R = admPanelLayout();
    _admHit.panel = R;
    const P = R.panel;

    // tam ekran karartma (drawPcScreen ile aynı modal kalıbı)
    ctx.fillStyle = "rgba(8,6,12,0.82)";
    ctx.fillRect(0, 0, layout.w, layout.h);
    drawPanel(P.x, P.y, P.w, P.h, P.w * 0.05, c.panelBgSolid, "#e8736b");

    // başlık şeridi — PC ekranındaki yeşil şeridin kırmızı eşleniği
    ctx.save();
    roundRect(P.x, P.y, P.w, P.h, P.w * 0.05);
    ctx.clip();
    ctx.fillStyle = "rgba(96, 26, 34, 0.95)";
    ctx.fillRect(P.x, P.y, P.w, R.barH);
    ctx.fillStyle = "rgba(255, 160, 150, 0.35)";
    ctx.fillRect(P.x, P.y + R.barH - Math.max(1, P.h * 0.004), P.w, Math.max(1, P.h * 0.004));
    ctx.restore();
    ctx.beginPath();
    ctx.arc(P.x + P.w * 0.045, P.y + R.barH * 0.5, R.barH * 0.16, 0, Math.PI * 2);
    ctx.fillStyle = "#ff6b6b"; ctx.fill();
    fitText("ADMIN — SİMÜLASYON", P.x + P.w * 0.5, P.y + R.barH * 0.5,
            P.w * 0.72, R.barH * 0.42, "#ffd9d4", "center", "800");

    // ✕ kapat (depo panelinin kalıbı)
    const cb = R.close;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    ctx.beginPath(); ctx.arc(cb.x + cb.w / 2, cb.y + cb.h / 2, cb.w / 2, 0, Math.PI * 2);
    ctx.fillStyle = "#3a2230"; ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "#e8736b"; ctx.lineWidth = Math.max(2, cb.w * 0.06);
    ctx.beginPath(); ctx.arc(cb.x + cb.w / 2, cb.y + cb.h / 2, cb.w / 2, 0, Math.PI * 2); ctx.stroke();
    text("✕", cb.x + cb.w / 2, cb.y + cb.h / 2, cb.w * 0.5, "#e8736b", "center", "800");

    // --- DURUM kutusu ---
    const st = R.status;
    fillRoundRect(st.x, st.y, st.w, st.h, st.h * 0.14, "rgba(10,8,14,0.55)");
    strokeRoundRect(st.x, st.y, st.w, st.h, st.h * 0.14, "rgba(245,170,70,0.35)", 1.5);
    const lines = admStatusLines();
    const lh = st.h / (lines.length + 0.6);
    for (let i = 0; i < lines.length; i++) {
      fitText(lines[i], st.x + st.w * 0.5, st.y + lh * (i + 0.8), st.w * 0.90,
              lh * (i === 0 ? 0.62 : 0.52), i === 0 ? c.neon : c.cream, "center", i === 0 ? "800" : "700");
    }

    // --- SKILL ---
    fitText("SERVİS DOĞRULUĞU (skill)", R.cx, R.skillLabelY, R.cw, P.h * 0.026, c.creamSoft, "left", "700");
    for (const b of R.skills) {
      const sk = ADM_SKILLS[b.i];
      const on = Math.abs(admPanel.skill - sk.v) < 1e-9;
      fillRoundRect(b.x, b.y, b.w, b.h, b.h * 0.30, on ? "rgba(255,157,47,0.92)" : c.btnDark);
      strokeRoundRect(b.x, b.y, b.w, b.h, b.h * 0.30, on ? "#ffd9a0" : "rgba(245,170,70,0.45)",
                      Math.max(1.5, b.w * 0.010));
      fitText(sk.label, b.x + b.w / 2, b.y + b.h * 0.36, b.w * 0.86, b.h * 0.30,
              on ? "#2b1a06" : c.cream, "center", "800");
      fitText(sk.pct, b.x + b.w / 2, b.y + b.h * 0.71, b.w * 0.86, b.h * 0.26,
              on ? "#5a3a0a" : c.creamSoft, "center", "800");
    }

    // --- GÜN / SEZON satırları ---
    admDrawStepRow(R, R.dayRow, R.dayLabelY, "GÜN (bu sezon içinde)", admPanel.day);
    admDrawStepRow(R, R.seasonRow, R.seasonLabelY, "SEZON (bedeller ödenerek)", admPanel.season);

    // --- son sonuç mesajı ---
    if (admPanel.msg) {
      const col = admPanel.bad ? c.bad : c.good;
      fitText(admPanel.msg, R.cx + R.cw / 2, R.msgY + P.h * 0.020, R.cw, P.h * 0.026, col, "center", "800");
      if (admPanel.msg2)
        fitText(admPanel.msg2, R.cx + R.cw / 2, R.msgY + P.h * 0.050, R.cw, P.h * 0.023,
                c.creamSoft, "center", "700");
    } else {
      fitText("Hedefe kadar bot oynar; oyun o günün BAŞINDA bırakılır.",
              R.cx + R.cw / 2, R.msgY + P.h * 0.020, R.cw, P.h * 0.023, c.creamSoft, "center", "700");
      fitText("Geri gitmek kariyeri aynı tohumla baştan kurar.",
              R.cx + R.cw / 2, R.msgY + P.h * 0.050, R.cw, P.h * 0.023, c.creamSoft, "center", "700");
    }

    drawSolidButton(R.kapat, "KAPAT", "rgba(40,18,18,0.92)", "#e8736b", "rgba(232,115,107,0.55)");

    if (admPanel.busy) admDrawBusy(P);
  }

  function admDrawStepRow(R, row, labelY, label, value) {
    const c = CONFIG.colors;
    fitText(label, R.cx, labelY, R.cw, R.panel.h * 0.026, c.creamSoft, "left", "700");
    drawSolidButton(row.minus, "−", "rgba(26,21,36,0.95)", c.cream, null);
    drawSolidButton(row.plus,  "+", "rgba(26,21,36,0.95)", c.cream, null);
    const v = row.value;
    fillRoundRect(v.x, v.y, v.w, v.h, v.h * 0.26, "rgba(10,8,14,0.7)");
    strokeRoundRect(v.x, v.y, v.w, v.h, v.h * 0.26, "rgba(245,170,70,0.5)", 1.5);
    fitText(String(value), v.x + v.w / 2, v.y + v.h / 2, v.w * 0.8, v.h * 0.54, c.neon, "center", "800");
    drawSolidButton(row.git, "GİT →", "rgba(46,30,10,0.95)", c.neon, c.neonGlow);
  }

  // "hesaplanıyor" göstergesi — simülasyon ana iş parçacığını kilitler, bu kare
  // hesaplama BAŞLAMADAN önce boyanır (bkz. admAfterPaint).
  function admDrawBusy(P) {
    ctx.fillStyle = "rgba(8,6,12,0.72)";
    roundRect(P.x, P.y, P.w, P.h, P.w * 0.05);
    ctx.fill();
    const bw = P.w * 0.76, bh = P.h * 0.17;
    const bx = P.x + (P.w - bw) / 2, by = P.y + (P.h - bh) / 2;
    drawPanel(bx, by, bw, bh, bw * 0.06, CONFIG.colors.panelBgSolid);
    // Math.abs: ana döngü dt'yi negatiften korumuyor (loop yalnız üst sınırı kırpıyor).
    // Negatif t burada repeat(-1) ile patlardı — admin paneli oyunu düşürmemeli.
    const dots = ".".repeat(1 + (Math.floor(Math.abs(admPanel.t) * 4) % 3));
    fitText("⏳ HESAPLANIYOR" + dots, bx + bw / 2, by + bh * 0.36, bw * 0.86, bh * 0.28,
            CONFIG.colors.neon, "center", "800");
    fitText(admPanel.busyLabel, bx + bw / 2, by + bh * 0.70, bw * 0.86, bh * 0.22,
            CONFIG.colors.creamSoft, "center", "700");
  }

  // --- Panel davranışı ---
  function admOpenPanel() {
    admPanel.open = true;
    admPanel.t = 0;
    admPanel.day = clamp(game.dayNumber, 1, CONFIG.seasonDays);
    admPanel.season = clamp(careerSeason(), 1, ADM.maxSeason);
  }
  // Simülasyon ana iş parçacığını kilitler; "hesaplanıyor" karesinin GERÇEKTEN
  // boyanması için iki kare beklenir (bir rAF yetmez: ilk geri çağrı boyamadan
  // ÖNCE koşar). rAF yoksa (headless) doğrudan çalışır.
  function admAfterPaint(fn) {
    if (typeof requestAnimationFrame !== "function") { fn(); return; }
    requestAnimationFrame(function () { requestAnimationFrame(fn); });
  }
  function admRun(kind, value) {
    if (admPanel.busy) return;
    admPanel.busy = true;
    admPanel.msg = null; admPanel.msg2 = null;
    admPanel.busyLabel = (kind === "day" ? "Gün " : "Sezon ") + value + "'e kadar oynanıyor";
    admAfterPaint(function () {
      const t0 = admNow();
      let err = null;
      try {
        if (kind === "day") admSim(value, { skill: admPanel.skill });
        else admSimSeason(value, { skill: admPanel.skill });
      } catch (e) {
        err = e;
        console.error("[ADMIN] simülasyon hatası:", e);
      }
      const ms = Math.round(admNow() - t0);
      admPanel.busy = false;
      admPanel.day = clamp(game.dayNumber, 1, CONFIG.seasonDays);
      admPanel.season = clamp(careerSeason(), 1, ADM.maxSeason);
      if (err) {
        admPanel.bad = true;
        admPanel.msg = "✗ HATA — konsola bakılmalı";
        admPanel.msg2 = String(err.message || err).slice(0, 80);
        return;
      }
      const reached = (kind === "day") ? (game.dayNumber >= value) : (careerSeason() >= value);
      const chk = !!(_admLastCheck && _admLastCheck.ok);
      admPanel.bad = !reached || !chk;
      admPanel.msg = (reached ? "✓ " : "⚠ ") + "Sezon " + careerSeason() + " · Gün " + game.dayNumber +
                     " · " + ms + " ms";
      admPanel.msg2 = reached
        ? ("değişmezler " + (chk ? "✓ geçti" : "✗ DÜŞTÜ — konsola bak") +
           " · kasa " + formatMoney(Math.round(game.money)))
        : ("hedefe ulaşılamadı: koşu bitti (" +
           (game.careerResult ? game.careerResult.reason : game.state) + ") — skill'i yükselt");
    });
  }

  // Dokunma: rozet + panel HER ŞEYDEN ÖNCE gelir (defter/depo/gün sonu kartı dahil),
  // yoksa açık bir modalin arkasında panele ulaşılamaz. true dönerse oyun görmez.
  function admTapOverlay(px, py) {
    if (admPanel.busy) return true;                       // hesaplarken her dokunuş yutulur
    if (!admPanel.open) {
      if (admIn(px, py, _admHit.badgeTap || _admHit.badge)) { admOpenPanel(); return true; }
      return false;
    }
    const R = _admHit.panel;
    if (!R) { admPanel.open = false; return true; }       // henüz çizilmedi: güvenli çıkış
    if (admIn(px, py, R.closeTap || R.close) || admIn(px, py, R.kapat)) { admPanel.open = false; return true; }
    for (const b of R.skills) if (admIn(px, py, b)) { admPanel.skill = ADM_SKILLS[b.i].v; return true; }
    const d = R.dayRow, se = R.seasonRow;
    if (admIn(px, py, d.minus)) { admPanel.day = clamp(admPanel.day - 1, 1, CONFIG.seasonDays); return true; }
    if (admIn(px, py, d.plus))  { admPanel.day = clamp(admPanel.day + 1, 1, CONFIG.seasonDays); return true; }
    if (admIn(px, py, d.git))   { admRun("day", admPanel.day); return true; }
    if (admIn(px, py, se.minus)){ admPanel.season = clamp(admPanel.season - 1, 1, ADM.maxSeason); return true; }
    if (admIn(px, py, se.plus)) { admPanel.season = clamp(admPanel.season + 1, 1, ADM.maxSeason); return true; }
    if (admIn(px, py, se.git))  { admRun("season", admPanel.season); return true; }
    if (!admIn(px, py, R.panel)) { admPanel.open = false; return true; }   // dışına dokunuş = kapat
    return true;                                          // panel içi boşluk: modal, yut
  }

  function admDrawOverlay() {
    if (admPanel.open) admDrawPanel();
    admDrawBadge();                                       // rozet panelin de üstünde kalsın
  }

  // --- Boot: cheats'e bağlan, oyunun giriş/çizim/güncelleme kancalarını SARMALA ---
  // Bu blok dosyanın EN ÜSTÜNDE durduğu için (silinmesi kolay olsun diye) render,
  // handleTap ve window.cheats henüz tanımlı değil; setTimeout(0) script'in tamamı
  // çalıştıktan SONRA — boot self-test'lerinin hemen ardından — koşar.
  //
  // SARMALAMA TEK YÖNLÜDÜR: admin oyunu çağırır, oyun admin'i ÇAĞIRMAZ. Blok
  // silindiğinde sarmalama hiç kurulmaz ve fonksiyonlar orijinal hâlleriyle kalır.
  // Uyarı da BİLEREK buradan basılır: selfTestPatients'ın içine yazılsaydı oyun kodu
  // ADMIN_MODE'a referans verirdi ve blok silinince ReferenceError atardı.
  function admBoot() {
    if (typeof window === "undefined") return;
    if (!window.cheats) window.cheats = {};
    window.cheats.sim = admSim;
    window.cheats.simSeason = admSimSeason;
    window.cheats.simVerify = admVerify;
    window.cheats.simLog = admLogTable;
    window.cheats.simState = admState;
    // Paneli konsoldan aç/kapa VE içini oku. Argümansız çağrı hiçbir şeyi
    // değiştirmez — masaüstünde ve headless testte panelin durumunu ve dokunma
    // alanlarını (rects) okumanın tek yolu budur.
    window.cheats.panel = function (on) {
      if (on === true) admOpenPanel();
      else if (on === false) admPanel.open = false;
      return { open: admPanel.open, busy: admPanel.busy, skill: admPanel.skill,
               day: admPanel.day, season: admPanel.season,
               msg: admPanel.msg, msg2: admPanel.msg2, bad: admPanel.bad,
               lastCheck: !!(_admLastCheck && _admLastCheck.ok),
               rects: _admHit, t: admPanel.t };
    };

    if (typeof render === "function" && !render.__admWrapped) {
      const orig = render;
      render = function () { orig(); admDrawOverlay(); };
      render.__admWrapped = true;
    }
    // Panel açıkken oyun DONAR — depo panelinin kalıbı (bkz. pcFreezesGame).
    if (typeof update === "function" && !update.__admWrapped) {
      _admOrigUpdate = update;
      update = function (dt) {
        if (admPanel.open) { admPanel.t += Math.max(0, dt); return; }   // yalnız panel animasyonu ilerler
        _admOrigUpdate(dt);
      };
      update.__admWrapped = true;
    }
    if (typeof handleTap === "function" && !handleTap.__admWrapped) {
      const orig = handleTap;
      handleTap = function (px, py) {
        if (admTapOverlay(px, py)) return;
        orig(px, py);
      };
      handleTap.__admWrapped = true;
    }
    // Panel açıkken raf/sekme kaydırması altta çalışmasın (dokunuş panele ait).
    if (typeof onDown === "function" && !onDown.__admWrapped) {
      const orig = onDown;
      onDown = function (x, y) {
        orig(x, y);
        if (admPanel.open || admPanel.busy) { pointer.inTabs = false; pointer.inGrid = false; }
      };
      onDown.__admWrapped = true;
    }

    console.warn("⚠️ ADMIN MODU AÇIK — yayına çıkmadan kaldır (index.html'deki ADMIN BLOK'u sil).");
    console.log("[ADMIN] Ekrandaki kırmızı ADMIN rozetine dokun → panel. " +
                "Konsoldan: cheats.sim(gün,{skill}) · cheats.simSeason(sezon,{skill,gün}) · " +
                "cheats.simVerify() · cheats.simLog()");
  }
  setTimeout(admBoot, 0);
}

// yarım saniye kadar geciktiriyorlardı. Her biri kendi try/catch'inde: biri patlarsa açılış durmaz.
const SELFTEST = true;
function bootCheck(name, fn) {
  if (!SELFTEST) return;
  try { fn(); } catch (e) { console.warn("[self-test] " + name + " istisna:", e && e.message); }
}

  seasonDays: 30,

  // --- Gün = müşteri limiti (süre değil) ---

  // --- GÜN BÜYÜKLÜĞÜ ÜST SINIRI ---
  // Sınırsız artış İKİ ayrı sorunu birden üretiyordu:
  //  (1) İtibar ölçeği sabit (0–repMax) ama kazanç/kayıp müşteri sayısıyla ölçeklendiği için
  //      geç oyunda tek kötü gün 30–40 puan sallıyor, yumuşak tavanın verdiği yastık
  //      (en fazla 50 puan) bir günde siliniyordu. Ödül/ceza değerlerini oynatmak bunu

  // dayatıyordu). Hedef, o günün ÖNCEDEN ÜRETİLMİŞ gerçek hasta listesinden hesaplanır:
  //   izinliHata(gün) = N × missRate(gün)
  //   hedef(gün)      = floor10( clamp( R − izinliHata × missCost, R×0.40, R×0.90 ) )
  // R/C/missCost o güne özel gerçek rakamlar (avgPrice/avgCost tahmini değil).
  // Daralma hızı ARTIK ELLE VERİLMEZ: tabana kaç günde inileceğinden türetilir.
  // Eski missRateDecay 0.015 idi => taban 11. GÜNDE doluyordu ve kalan 20 gün boyunca

  missRateBase: 0.25,       // gün 1'de hasta başına izinli hata oranı
  missRateFloor: 0.10,      // oran bunun altına inmez
  missRateFloorDay: 30,     // tabana bu günde ulaşılır (daralma bu güne kadar sürer)
  goalRatioClamp: [0.40, 0.90],  // hedef/R oranı güvenlik bandı

  // imkânsızdır. Bu yüzden tavan ADİL PAYA (1/hasta) oranlıdır:
  //   tavan = clamp(concentrationCapFactor / geçerliHasta, min, max)
  //   9 hasta → %24 | 6 hasta → %37 | 20 hasta → %15
  // Amaç: "hangi müşteride hata yaptığın" faktörü günü tek başına belirlemesin.

  // ve tavan ancak son günlerde yaklaşır.
  nightFakeBonusEarly: 0.08,   // gün 1'de gece, gündüzün bu kadar üstünde
  nightFakeBonusLate: 0.18,    // son günde bu kadar üstünde (arası doğrusal)

  tier2CostMul: 1.0,           // İŞLETME katmanı fiyat çarpanı (kalibrasyon knob'u)
  musavirFeeStep: 0.10,        // seviye başına RUHSAT BEDELİ indirimi

// NOT: missCost artık genel ortalamadan değil, her günün kendi listesinden hesaplanır
// (buildDaySchedule). Buradaki ortalamalar yalnız startMoney ve sabit para cezası için.
// KRİTİK — avgPrice/avgCost SEZON BAŞI TABAN ortalamalarıdır ve ASLA yeniden hesaplanmaz.
// Fiyat güncellemeleri MEDICINES'i değiştirmez (çarpan katmanı ayrı: medPrice/medCost), bu
// yüzden buradan türeyen her şey — startMoney, geliştirme fiyatları (upgradeCost), sahte
// servis cezası, dilenciye verilen para — sezon boyunca SABİT kalır. Fiyatlar dalgalanırken
// geliştirme fiyatı da oynarsa oyuncu hiçbir plan yapamaz; bu dondurma bilinçli bir karardır.
(function deriveEconomy() {
  CONFIG.startMoney = Math.round(avgCost * 30 / 100) * 100;          // 100'e yuvarlı
  CONFIG.fakeApproveMoneyPenalty = Math.round(avgPrice * 2);         // sahteyi servis etme cezası
  CONFIG.beggarMoneyGive = Math.round(avgPrice * CONFIG.beggarMoneyK);  // dilenciye verilen tutar
  // Ruhsat bedeli de fiyat tablosuyla ölçeklenir (sabit sayı gömülmez). TABAN ortalamadan
  // türer ve kariyer boyunca DEĞİŞMEZ — fiyat turları bedeli oynatmaz, yoksa oyuncu
  // sezon bütçesini planlayamaz.
  CONFIG.seasonFeeBase = Math.round(avgPrice * CONFIG.seasonFeeBaseK / CONFIG.seasonFeeRound) * CONFIG.seasonFeeRound;
})();

// Lv2 ilk satın alma olduğu için costK[0]'ı kullanır (kaydırma yok: n'inci alım = costK[n-1]).
function upgradeCost(id, targetLevel) {
  const u = UPGRADE_BY_ID[id];
  if (!u || targetLevel < 2 || targetLevel > u.maxLevel) return 0;
  const mul = (u.tier || 1) >= 2 ? CONFIG.tier2CostMul : 1;
  return Math.round(avgPrice * u.costK[targetLevel - 2] * mul / 100) * 100;
}
function upgradeLevel(id) {
  const lv = game.upgrades ? game.upgrades[id] : 1;
  return lv || 1;
}

// --- Efektif değerler: kod ARTIK CONFIG.maxQueue/maxStock/basePatience'ı doğrudan okumaz ---
function effMaxQueue()    { return CONFIG.maxQueue + (upgradeLevel("tezgah") - 1); }        // 3 / 4 / 5
function effMaxStock()    { return CONFIG.maxStock + (upgradeLevel("depo") - 1) * 15; }     // 30 / 45 / 60
// VİTRİN: müşteri sayısı değil, reçeteli hasta PAYI. Semptomlu payı vitrinSymptomFloor'un
// altına inemez => Lv3'te bile karışım tek tipe dönüşmez.
function vitrinRxShare(lv) {
  const raw = CONFIG.prescriptionChance + (lv - 1) * CONFIG.vitrinRxBonus;
  return clamp(raw, 0, 1 - CONFIG.vitrinSymptomFloor);                                      // 0.50 / 0.55 / 0.60
}
function effPrescriptionChance() { return vitrinRxShare(upgradeLevel("vitrin")); }

// Vitrin'in getirdiği fazladan reçeteliler GERÇEK olmalı — yoksa geliştirme ZARAR ettirir.
// ÖLÇÜLDÜ: geçerli bir reçete semptomlu hastanın 1,44 katı değerinde, ama reçetelilerin
// ~%51'i sahte (rev 0) olduğu için bir reçeteli hastanın BEKLENEN değeri semptomlunun
// yalnızca 0,70 katı. Payı ham hâliyle yükseltmek R'yi Lv3'te %4,2 DÜŞÜRÜYORDU.
// Çözüm: reçete başına sahte ihtimali, payın büyüdüğü oranda seyreltilir. Böylece
// GÜN BAŞINA DÜŞEN SAHTE SAYISI değişmez (inceleme mekaniği ve sahte oranı ekseni
// aynen korunur), Vitrin'in eklediği hastalar ise gerçek reçete olur.
//   sahte/hasta = pay × sahteŞansı × (taban/pay) = taban × sahteŞansı  → paydan bağımsız
function vitrinFakeDilution() {
  const share = effPrescriptionChance();
  return share > 0 ? Math.min(1, CONFIG.prescriptionChance / share) : 1;                    // 1.00 / 0.91 / 0.83
}
function effPatience()    { return CONFIG.basePatience * (1 + (upgradeLevel("bekleme") - 1) * 0.2); }
// Terminal Lv2'de açılır: PC'de MEDULA SİSTEMİ sekmesinin kilidi kalkar ve
// Medula hastaları gelmeye başlar. Reçete sahteliğiyle HİÇBİR ilgisi yoktur.
function medulaUnlocked() { return upgradeLevel("medula") >= 2; }

// --- İŞLETME katmanı: kilit ve efektif değerler ---
// Kilit KARİYER SEZONUNA bağlı. initUpgrades her kalemi Lv1'e kurar; kilitli kalem
// yalnız SATIN ALINAMAZ, ekranda görünür — oyuncu ağacın devamı olduğunu bilsin.
function upgradeUnlockSeason(id) { const u = UPGRADE_BY_ID[id]; return (u && u.unlockSeason) || 1; }
function upgradeUnlocked(id) { return careerSeason() >= upgradeUnlockSeason(id); }

// Ruhsat bedeli indirimi (Mali Müşavir). Kariyeri bitiren şey bedel olduğu için bu
// kalem doğrudan ÖMÜR satın alır — katmanın en değerli ve en pahalı olması gereken yanı.
function effFeeDiscount() {
  return Math.min(0.60, Math.max(0, (upgradeLevel("musavir") - 1) * CONFIG.musavirFeeStep));

// Depo alış indirimi. YALNIZ sipariş ekranında geçerlidir: medCost()'a dokunmaz, yoksa
// C ve hedef formülü kayardı (yanlış servis zararı da ucuzlardı — indirim oyuncuyu
// hatadan korumamalı).
function effDepotDiscount() {
  return Math.min(0.60, Math.max(0, (upgradeLevel("toptanci") - 1) * CONFIG.toptanciDiscountStep));
}
// Nöbet farkı. R'ye giriyor => hedef kendiliğinden ölçeklenir (formüle dokunulmadı).
function effNightPriceMul() {
  return CONFIG.nightPriceMultiplier + (upgradeLevel("nobet") - 1) * CONFIG.nobetRuhsatStep;

function voiceOf(p) { return VOICES[AVATAR_VOICE[p.avatarKey]] || VOICES.kibar; }
function fillSym(tpl, label) {
  return tpl.replace("{L}", label).replace("{l}", trLower1(label));
}
// Durum girişi: nöbet gecesi, günün ilk müşterisi, fiyat güncellemesi günü. Yoksa null.
function contextOpener(p, v) {
  if (p.night && crng() < 0.6) return cpick(v.night);
  if (!p.bonus && game.daySpawned === 0 && !p.night) return cpick(v.morning);
  if (typeof priceRoundOn === "function" && priceRoundOn(game.dayNumber) && crng() < 0.35) return cpick(v.price);
  return null;
}
const DIALOG_MAX = { sym: 78, rx: 36, medula: 36, react: 34, imp: 28 };

// Hasta sahneye çıkarken: söyleyeceği cümleyi, sabırsızlık sözlerini kur.
function assignDialog(p) {
  if (!p || !p.request || isBeggarType(p.request.type)) return;
  const v = voiceOf(p), ex = AVATAR_EXTRA[p.avatarKey];
  const ctxOpen = contextOpener(p, v);
  const opener = ctxOpen || (ex && crng() < 0.4 ? cpick(ex.open) : null);
  const t = p.request.type;
  let line;
  if (t === "prescription") {
    line = opener ? opener + " reçetem var." : cpick(v.rx);
    if (line.length > DIALOG_MAX.rx) line = cpick(v.rx);
  } else if (t === "medula") {
    line = opener ? opener + " e-reçetem var." : cpick(v.medula);
    if (line.length > DIALOG_MAX.medula) line = cpick(v.medula);
  } else {
    const items = p.request.items || [{ symptom: p.request.symptom, qty: 1 }];
    if (items.length === 1) {
      const lab = items[0].symptom.label, two = items[0].qty > 1;
      if (opener) line = opener + " " + trLower1(lab) + (two ? ". İki kutu lütfen." : ".");
      else line = fillSym(cpick(two ? v.sym2 : v.sym), lab);
    } else {
      const core = p.request.line || "";
      const op = opener || (crng() < 0.5 ? cpick(v.open) : null);
      line = op && (op.length + 1 + core.length) <= DIALOG_MAX.sym ? op + " " + trLower1(core) : core;
    }
    if (line.length > DIALOG_MAX.sym) line = p.request.line;
  }
  p.line = line;
  p.imp1 = ex && crng() < 0.5 ? cpick(ex.imp) : cpick(v.imp1);
  p.imp2 = cpick(v.imp2);
  p.reaction = null;
}

// Karar anında müşterinin cevabı (feedback süresince balonunda görünür).
//   thanks · wrong · caught (sahte yakalandı) · sly (sahteye ilaç verildi) ·
//   wrongReject (gerçek reçete reddedildi) · angry (beklemekten küstü)
function patientReact(p, kind) {
  if (!p || !p.request || isBeggarType(p.request.type)) return;
  const v = voiceOf(p);
  if (v[kind]) p.reaction = cpick(v[kind]);
}
// Sabırsızlık sözü: sabır %35'in altında (hasta zaten titremeye başlıyor), %15'te sertleşir.
function impatienceLine(p) {
  if (!p || p.reaction || game.feedback || isBeggarType(p.request.type)) return null;
  const r = p.patience / p.maxPatience;
  if (r >= 0.35) return null;
  return r < 0.15 ? p.imp2 : p.imp1;
}

// Boot denetimi: her ağızda her söz türü var, hiçbiri balona sığmayacak kadar uzun değil,
// kurulan cümlelerde "undefined"/boş kalmıyor.
function verifyDialog() {
  const warn = [];
  const kinds = { sym: 60, sym2: 60, open: 30, rx: DIALOG_MAX.rx, medula: DIALOG_MAX.medula, thanks: DIALOG_MAX.react,
                  wrong: DIALOG_MAX.react, caught: DIALOG_MAX.react, sly: DIALOG_MAX.react, wrongReject: DIALOG_MAX.react,
                  angry: DIALOG_MAX.react, imp1: DIALOG_MAX.imp, imp2: DIALOG_MAX.imp, night: 34, morning: 34, price: 34 };
  for (const [vn, v] of Object.entries(VOICES)) for (const [k, max] of Object.entries(kinds)) {
    if (!v[k] || !v[k].length) { warn.push(vn + "." + k + " boş"); continue; }
    for (const s of v[k]) if (s.length > max) warn.push(vn + "." + k + " uzun (" + s.length + "): " + s);
  }
  for (const [ak, e] of Object.entries(AVATAR_EXTRA)) {
    if (!AVATAR_VOICE[ak]) warn.push(ak + " için ağız tanımlı değil");
    for (const s of e.imp) if (s.length > DIALOG_MAX.imp) warn.push(ak + ".imp uzun: " + s);
  }
  for (const a of PATIENT_AVATARS) if (!AVATAR_VOICE[a.assetKey]) warn.push(a.assetKey + " için ağız tanımlı değil");
  // kurma denemesi (gün listesi etkilenmez: tohumlu rng kullanılmıyor)
  const savedSp = game.daySpawned;
  try {
    withSeed(0x5EED, function () { for (let i = 0; i < 400; i++) {
      const p = makePatient();
      p.avatarKey = PATIENT_AVATARS[i % PATIENT_AVATARS.length].assetKey;
      p.night = i % 5 === 0;
      assignDialog(p);
      if (isBeggarType(p.request.type)) continue;
      const lim = p.request.type === "symptom" ? DIALOG_MAX.sym : DIALOG_MAX.rx;
      if (!p.line || /undefined|\{/.test(p.line) || (p.line.length > lim && p.line !== p.request.line)) { warn.push("kurulan cümle bozuk: " + p.line); return; }
      if (p.request.type === "symptom") {
        const items = p.request.items || [{ symptom: p.request.symptom }];
        for (const it of items) if (p.line.toLocaleLowerCase("tr").indexOf(it.symptom.label.toLocaleLowerCase("tr").slice(0, 6)) < 0) {
          warn.push("semptom adı cümlede yok: " + p.line); return;
        }
      }
    } });
  } catch (e) { warn.push("istisna: " + (e && e.message)); }
  finally { game.daySpawned = savedSp; }
  for (const w of warn) console.warn("[diyalog] " + w);
  return warn.length === 0;
}

// =====================================================================
//  ASSET KATMANI — sonradan PNG giydirmek için soyutlama
//  (şu an hiçbir dosya yüklenmiyor; images boş => her zaman fallback çizilir)
// =====================================================================
const Assets = {
  images: {},   // key -> yüklenmiş Image
  loaded: 0,
  total: 0,
  // Image objesi oluşturur, onload'da images[key] doldurur. Şimdilik çağrılmıyor.
  load(key, src) {
    this.total++;
    const img = new Image();
    img.onload = () => { this.images[key] = img; this.loaded++; };
    img.onerror = () => { this.loaded++; };
    img.src = src;
    return img;
  }
};

const Sprite = {
  // Asset yüklüyse onu çizer; değilse fallback(ctx,x,y,w,h) ile mevcut çizimi yapar.
  // fit: "stretch" (varsayılan), "contain" (kutuya sığdır, kırpma yok),
  //      "contain-bottom" (contain + kutunun ALT çizgisine otur, yatayda ortalı),
  //      "cover" (kutuyu doldur, taşan kenarlar kırpılır). Oran korunur.

  // Görselin kutu içinde GERÇEKTEN kaplayacağı dikdörtgen (asset yoksa null).
  // Oran korunduğu için görsel kutuyu genelde doldurmaz: en dar şişe kutunun
  // ~%34'ünü, en geniş kutu %100'ünü kaplar; aradaki fark boşluktur. Rozet ve
  // dokunma alanı gibi şeyler kutuya değil BU dikdörtgene bağlanmalı.
  rect(key, x, y, w, h, fit) {
    const img = Assets.images[key];
    if (!(img && img.complete && img.naturalWidth > 0)) return null;
    if (!fit || fit === "stretch") return { x, y, w, h };
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const scale = fit === "cover"
      ? Math.max(w / iw, h / ih)
      : Math.min(w / iw, h / ih);
    const dw = iw * scale, dh = ih * scale;
    // contain-bottom: dikeyde ortalama yerine taban hizası — dar/uzun ve geniş/kısa
    // ürünler aynı yüzeye otursun diye.
    const dy = fit === "contain-bottom" ? y + h - dh : y + (h - dh) / 2;
    return { x: x + (w - dw) / 2, y: dy, w: dw, h: dh };
  },

  draw(ctx, key, x, y, w, h, fallback, fit) {
    const r = this.rect(key, x, y, w, h, fit);
    if (!r) {
      if (fallback) fallback(ctx, x, y, w, h);
      return;
    }
    const img = Assets.images[key];
    if (fit === "cover") {
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();
      ctx.drawImage(img, r.x, r.y, r.w, r.h);
      ctx.restore();
    } else {
      ctx.drawImage(img, r.x, r.y, r.w, r.h);
    }
  }
};

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
let DPR = 1;

// --- iOS guvenli alan (centik / home indicator) olcumu ---------------------
// env(safe-area-inset-*) yalniz CSS'ten okunabilir; gorunmez bir prob elemanin
// padding'ine yazilip buradan geri okunur. Tarayici env() bilmiyorsa 0 doner.
let _safeProbe = null;
function readSafeInsets() {
  if (!_safeProbe) _safeProbe = document.getElementById("safeprobe");
  if (!_safeProbe) return;
  const cs = getComputedStyle(_safeProbe);
  window.__safeRawTop    = parseFloat(cs.paddingTop)    || 0;
  window.__safeRawBottom = parseFloat(cs.paddingBottom) || 0;
  window.__safeRawLeft   = parseFloat(cs.paddingLeft)   || 0;
  window.__safeRawRight  = parseFloat(cs.paddingRight)  || 0;
}

function resize() {
  DPR = window.devicePixelRatio || 1;
  const w = window.innerWidth;
  const h = window.innerHeight;
  canvas.style.width = w + "px";
  canvas.style.height = h + "px";
  canvas.width = Math.round(w * DPR);
  canvas.height = Math.round(h * DPR);
  layout.w = w;
  layout.h = h;
  computeLayout();
}
window.addEventListener("resize", resize);
window.addEventListener("orientationchange", resize);

// =====================================================================
//  LAYOUT HESABI
// =====================================================================
function computeLayout() {
  const W = layout.w, H = layout.h;

  // --- Merkezî 9:16 oyun kolonu (stage). Geniş ekranda ortada dikey kolon,
  //     kenarlar arka plan PNG'si ile dolar. Tüm UI bu kolona göre konumlanır. ---
  const aspect = 9 / 16;
  let sw, sh;
  if (W / H > aspect) { sh = H; sw = H * aspect; }
  else { sw = W; sh = W / aspect; }
  const sx = (W - sw) / 2;
  const sy = (H - sh) / 2;
  layout.stage = { x: sx, y: sy, w: sw, h: sh };

  // --- Guvenli alan: ham inset'in TAMAMI degil, letterbox'i ASAN kismi ---
  // 9:16 kolon dikeyde zaten ortalandigi icin ustte/altta sy kadar bos bant var.
  // Centik o bandin icinde kaliyorsa ek itme gerekmez; aksi halde HUD iki kez
  // asagi kayar. __safeTop/__safeBottom bu yuzden FAZLA kismi tutar.
  readSafeInsets();
  window.__safeTop    = Math.max(0, (window.__safeRawTop    || 0) - sy);
  window.__safeBottom = Math.max(0, (window.__safeRawBottom || 0) - sy);

  // yatay iç boşluk (stage genişliğine göre)
  const padX = sw * 0.05;
  const left = sx + padX;
  const colW = sw - padX * 2;

  // --- Dikey düzen (Büfeci mantığı) ---
  //   üst (ince)           : HUD
  //   üst-orta (büyük)     : konuşma balonu + DEV müşteri
  //   tezgah çizgisi       : ahşap bant (müşteriyi göğüsten keser) — ÜSTÜ BOŞ KALIR
  //   alt                  : ilaç seçim grid'i (2x3)
  // NOT: tezgahta artık ürün tepsisi YOK. Seçilen ilaçlar PC'deki SATIŞ ekranında
  // listelenir; tezgah yüzeyi defter ve PC dışında boş kalır (defterle çakışma bitti).
  const hudY = sy + (window.__safeTop || 0) + sh * 0.018;
  const hudH = sh * 0.082;

  // tezgah (ahşap bant) — müşterinin kesildiği çizgi
  const counterLine = sy + sh * 0.555;
  const bandH = sh * 0.12;
  layout._counterLine = counterLine;
  layout._band = { x: sx, y: counterLine, w: sw, h: bandH };

  // --- Alt buton şeridi: yalnız ONAYLA / REDDET (reçete karar fazı) ---
  // SERVİS ET butonu kaldırıldı; servis artık PC → SATIŞ ekranından yapılıyor.
  const btnH = sh * 0.082;
  // --- RADYO YUVASI: aksiyon butonlarının ALTI ---
  // Uzun telefonlarda (19,5:9) sahnenin altında boş bir bant var: radyo oraya, ev çubuğunun
  // üstüne oturur ve oyun alanından hiçbir şey çalmaz. Bant yoksa (iPhone SE, iPad) sahnenin
  // en altında yer açılır: butonlar ve ilaç ızgarası radyo boyu kadar yukarı kayar.
  const radH = sh * 0.052, radGap = sh * 0.010;
  const below = (layout.h - (window.__safeRawBottom || 0)) - (sy + sh);   // sahne altı, ev çubuğu üstü
  const radInBand = below >= radH * 0.8 + 4;           // biraz küçülerek de sığıyorsa bant
  const radReserve = radInBand ? 0 : radH + radGap;
  const btnY = sy + sh - btnH - sh * 0.02 - (window.__safeBottom || 0) - radReserve;
  {
    const rh = radInBand ? Math.min(radH, below - 4) : radH;
    const rw = rh * 2.5;
    const ry = radInBand ? sy + sh + (below - rh) / 2 : btnY + btnH + radGap;
    layout.radio = { x: sx + sw / 2 - rw / 2, y: ry, w: rw, h: rh, inBand: radInBand };
  }
  const halfGap = colW * 0.04;
  const halfW = (colW - halfGap) / 2;
  layout.rejectBtn = { x: left, y: btnY, w: halfW, h: btnH };
  layout.approveBtn = { x: left + halfW + halfGap, y: btnY, w: halfW, h: btnH };
  // Dilenci üç seçenekli: AYNI şerit, aynı yükseklik/hiza, üç eşit kolon. Reçetenin
  // ikili şeridiyle asla aynı anda görünmez (tezgahta ya reçeteli hasta var ya dilenci).
  const triGap = colW * 0.025;
  const triW = (colW - triGap * 2) / 3;
  layout.beggarBtns = [
    { key: "med",   x: left,                       y: btnY, w: triW, h: btnH },
    { key: "money", x: left + triW + triGap,       y: btnY, w: triW, h: btnH },
    { key: "no",    x: left + (triW + triGap) * 2, y: btnY, w: triW, h: btnH }
  ];
  // Borcunu ödemeye gelen dilencinin TEK seçeneği var: ödemeyi al. Aynı şerit, aynı
  // yükseklik/hiza; üç kolon yerine tam genişlik (yapay ikinci seçenek uydurulmaz).
  layout.beggarPayBtn = { x: left, y: btnY, w: colW, h: btnH };

  // --- Kategori sekmeleri + ilaç seçim grid'i ---
  // Sekmeler bandın GÖRÜNÜR yüzeyinin hemen altına alındı: counter.png'nin alt ~%35'i
  // koyu ön panel (boş şerit gibi okunuyordu); sekmeler o panelin üstüne biner.
  // Yüzey çizgisi ~0.58×bandH (defter/PC oturma hizası) + nefes payı ~0.15×bandH.
  const zoneTop = counterLine + bandH * 0.73;
  const tabH = sh * 0.056;
  layout.tabsArea = { x: left, y: zoneTop, w: colW, h: tabH };
  const gridTop = zoneTop + tabH + sh * 0.006;
  const gridBottom = btnY - sh * 0.008;
  layout.gridArea = { x: left, y: gridTop, w: colW, h: gridBottom - gridTop };

  if (!game.activeGroup) {
    const first = groupsWithMeds()[0];
    game.activeGroup = first ? first.id : null;
  }
  buildTabs();
  buildShelf();

  layout._hud = { x: left, y: hudY, w: colW, h: hudH };

  // tezgahın SOL tarafında duran kapalı defter (obje) — ~%35 büyütüldü, daha görünür/tıklanır
  const dbw = sw * 0.32, dbh = sh * 0.10;
  const dbx = layout._band.x + sw * 0.02;
  const dby = (layout._band.y + layout._band.h * 0.58) - dbh;  // alt kenar tezgah yüzeyinde
  layout.bookClosedRect = { x: dbx, y: dby, w: dbw, h: dbh };

  // hasta alanı: HUD altı .. tezgah çizgisi (DEV müşteri burada, alttan banda gömülür)
  const patientTop = hudY + hudH + sh * 0.004;
  layout._patientArea = {
    x: sx,
    y: patientTop,
    w: sw,
    h: counterLine - patientTop
  };

}

// (KALDIRILDI) rebuildCounterSlots / counterItemRects / verifyCounterLayout
// Tezgah ürün tepsisi tamamen sökülünce üçü de işlevsiz kaldı: slot yerleşimi, rozet ve
// dokunma dikdörtgeni hesabı, ve o hesabı denetleyen self-test. Seçilen ilaçlar artık
// PC → SATIŞ ekranında satır olarak listeleniyor (drawSale). Sprite.rect KORUNDU —
// Sprite.draw hâlâ onu kullanıyor.

function buildTabs() {
  const ta = layout.tabsArea;
  layout.tabs = [];
  if (!ta) return;
  const groups = groupsWithMeds();
  const fs = ta.h * 0.36;
  ctx.font = "800 " + fs + "px " + RX_FONT;   // çizimdeki en geniş ağırlıkla ölç
  const gap = ta.h * 0.22;                      // sekmeler arası net boşluk
  const padInner = ta.h * 0.42;                 // metin etrafı iç boşluk
  const minW = ta.h * 2.0;                      // dokunma için makul alt sınır
  let x = 0;
  for (const g of groups) {
    // emojisiz sekme: sadece metin ölçülür
    const btnW = Math.max(minW, ctx.measureText(g.label).width + padInner * 2);
    layout.tabs.push({ group: g, x, w: btnW + gap });  // w = buton + arkasındaki boşluk
    x += btnW + gap;
  }
  const total = x - gap;                 // son boşluğu sayma
  layout.tabsTotal = total;
  if (total <= ta.w) {
    // sığıyorsa şeridi ortala, kaydırma yok
    layout.tabsOffset = (ta.w - total) / 2;
    layout.tabScroll = 0;
  } else {
    // sığmıyorsa soldan başla, sağa kaydırılabilir
    layout.tabsOffset = 0;
    layout.tabScroll = clamp(layout.tabScroll || 0, 0, total - ta.w);
  }
  ensureActiveTabVisible();
}

// aktif sekmeyi görünür alana kaydır (gerekiyorsa)
function ensureActiveTabVisible() {
  const ta = layout.tabsArea;
  if (!ta || !layout.tabs || (layout.tabsTotal || 0) <= ta.w) return;
  const t = layout.tabs.find(t => t.group.id === game.activeGroup);
  if (!t) return;
  const left = t.x, right = t.x + t.w;
  if (left < layout.tabScroll) layout.tabScroll = left;
  else if (right > layout.tabScroll + ta.w) layout.tabScroll = right - ta.w;
  layout.tabScroll = clamp(layout.tabScroll, 0, layout.tabsTotal - ta.w);
}

// Seçili gruptaki ilaçları BÜYÜK KARTLAR halinde yerleştir (Büfeci kalıbı):
// satırda 3 kart, kare-ye yakın; sığmazsa grid aşağı devam eder ve DİKEY
// drag-scroll ile kaydırılır (layout.shelfScroll; çizim/tıklamada düşülür).
function buildShelf() {
  const area = layout.gridArea;
  layout.shelfButtons = [];
  layout.shelfMaxScroll = 0;
  if (!area) return;
  const meds = medsInGroup(game.activeGroup);
  const n = meds.length;
  if (n === 0) return;

  const S = layout.stage;
  const cols = 3;
  const cardW = S.w * 0.26;            // büyük kart (~%26 stage genişliği)
  const cardH = cardW * 0.94;          // kare-ye yakın
  const gap = S.w * 0.03;
  const rows = Math.ceil(n / cols);
  const contentH = rows * cardH + (rows - 1) * gap;
  // içerik alandan kısaysa dikeyde ortala (kaydırma yok)
  const topPad = contentH <= area.h ? (area.h - contentH) / 2 : 0;
  for (let i = 0; i < n; i++) {
    const r = Math.floor(i / cols);
    const c = i % cols;
    const rowCount = Math.min(cols, n - r * cols);          // son satır eksikse o satırı ortala
    const rowW = rowCount * cardW + gap * (rowCount - 1);
    const startX = area.x + (area.w - rowW) / 2;
    layout.shelfButtons.push({
      id: meds[i].id,
      x: startX + c * (cardW + gap),
      y: area.y + topPad + r * (cardH + gap),   // içerik koordinatı; shelfScroll çizimde düşülür
      w: cardW,
      h: cardH
    });
  }
  layout.shelfMaxScroll = Math.max(0, contentH - area.h);
  layout.shelfScroll = clamp(layout.shelfScroll || 0, 0, layout.shelfMaxScroll);
}

//  OYUN MANTIĞI

function getMedicine(id) { return MEDICINES.find(m => m.id === id); }

// --- Değiştirilebilir rastgelelik kaynağı ---
// Normalde Math.random; gün listesi üretilirken withSeed() bunu seed'li RNG ile değiştirir.
// Böylece üretim kodu (makePrescription, makePatient…) hiç değişmeden deterministik olur.
let _rngSource = Math.random;
function rng() { return _rngSource(); }
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// fn'i seed'li RNG altında çalıştırır. pickKnownDoctor game.lastDoctor'a bakıp yazdığı için
// o da izole edilir — aynı seed + aynı gün her zaman aynı listeyi verir.
// --- KOŞU TOHUMU ---
// Gün tohumu artık yalnız gün numarasından değil, KOŞU tohumundan da türer:
//   aynı koşu + aynı gün  → bit-bit aynı liste (cache, hedef ve testler bozulmaz)
//   farklı koşu           → tamamen farklı hastalar/reçeteler/kodlar
const TEST_RUN_SEED = 20260617;      // self-test'ler ve denge doğrulaması bu tohumla koşar
function newRunSeed() {
  return ((Math.floor(Math.random() * 0x7FFFFFFF) ^ Date.now()) >>> 0) || 1;
}
// runSeed + gün → iyi dağılmış 32-bit tohum (ardışık gün/koşu korelasyon vermesin)
function daySeedFor(day) {
  let h = ((game.runSeed >>> 0) ^ (CONFIG.daySeedBase >>> 0)) >>> 0;
  h = (h ^ Math.imul(day, 0x9E3779B1)) >>> 0;
  h = Math.imul(h ^ (h >>> 16), 0x85EBCA6B);
  h = Math.imul(h ^ (h >>> 13), 0xC2B2AE35);
  return (h ^ (h >>> 16)) >>> 0;
}
// fn'i belirli bir koşu tohumuyla çalıştır (testler için); gün cache'i iki yönde de temizlenir
function withRunSeed(seed, fn) {
  const prev = game.runSeed;
  const prevSch = game.daySchedule;
  game.runSeed = seed >>> 0;
  game.daySchedule = null;
  invalidateDaySchedules();
  try { return fn(); }
  finally {
    game.runSeed = prev;
    game.daySchedule = prevSch;
    invalidateDaySchedules();
  }
}

function withSeed(seed, fn) {
  const prevSrc = _rngSource, prevDoc = game.lastDoctor;
  _rngSource = mulberry32(seed);
  // lastDoctor SIFIRLANIR (yalnız geri yüklenmesi yetmez): pickKnownDoctor
  // "d.name === game.lastDoctor" olduğu sürece döngüde kalıp fazladan rng() harcar.
  // Dışarıdan gelen bir isim ilk çekilişle çakışırsa tüm RNG akışı kayar ve aynı gün
  // farklı üretilir. Sıfırlamak üretimi dış duruma tamamen kapatır.
  game.lastDoctor = null;
  try { return fn(); }
  finally { _rngSource = prevSrc; game.lastDoctor = prevDoc; }
}

function rand(n) { return Math.floor(rng() * n); }
function pick(arr) { return arr[rand(arr.length)]; }
function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
function lerp(a, b, t) { return a + (b - a) * t; }

function activePatient() { return game.queue.length ? game.queue[0] : null; }

// o günün müşteri limiti (gün bağımsız hesap; hedef fonksiyonu da bunu kullanır)
// Geliştirmelerden BAĞIMSIZDIR: Vitrin artık sayıyı değil karışımı etkiliyor.
// Hedef formülü, konsantrasyon tavanı ve nöbet oranları hep bu fonksiyonun ürettiği
// GERÇEK listeden hesaplandığı için tavana kendiliğinden uyum sağlar.
function patientLimitFor(day) {
  const raw = CONFIG.patientsPerDayBase + (day - 1) * CONFIG.patientsPerDayStep;
  return Math.min(CONFIG.maxPatientsPerDay, raw);
}
// OYNANAN gün, üretildiği andaki listeye SABİTLENİR — gün ortasında vitrin yükseltilirse
// o günün hasta karışımı ve hedefi değişmez, etki bir sonraki günden başlar.
function patientsForDay() {
  if (game.daySchedule && game.daySchedule.day === game.dayNumber) return game.daySchedule.N;
  return patientLimitFor(game.dayNumber);
}

// --- NÖBET ---
// Nöbet, günün ikinci bölümüdür: aynı gün programına night:true hastalar eklenir.
