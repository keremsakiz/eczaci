// sepetteki adedi değiştir: 0..(maxStock - mevcut stok) aralığına clamp
function changePending(id, delta) {
  const cur = game.depotPending[id] || 0;
  const maxAdd = Math.max(0, effMaxStock() - (game.stock[id] || 0));
  game.depotPending[id] = clamp(cur + delta, 0, maxAdd);
}

// sepet toplamı (₺) — ilaç bazında alış fiyatı (cost) üzerinden
function depotOrderTotal() {
  let sum = 0;
  for (const id in game.depotPending) {
    const q = game.depotPending[id];
    if (!q) continue;
    const m = getMedicine(id);
    if (m) sum += m.cost * q;
  }
  return sum;
}

// tüm bekleyen siparişleri tek seferde uygula (para düşer, stoklar artar, sepet sıfırlanır)
function placeDepotOrder() {
  const total = depotOrderTotal();
  if (total <= 0 || game.money < total) return;
  game.money -= total;
  for (const id in game.depotPending) {
    const q = game.depotPending[id];
    if (!q) continue;
    game.stock[id] = Math.min(effMaxStock(), (game.stock[id] || 0) + q);
  }
  game.depotPending = {};
}

// --- Geliştirme satın alma ---
// Kasadan düşer, kasa negatife inemez. Vitrin seviyesi gün üretimini etkilediği için
// önden üretilmiş günler geçersiz kılınır (oynanan gün snapshot'tan okunduğu için değişmez).
function buyUpgrade(id) {
  const u = UPGRADE_BY_ID[id];
  if (!u) return false;
  const cur = upgradeLevel(id);
  if (cur >= u.maxLevel) return false;              // TAM — satın alınamaz
  const cost = upgradeCost(id, cur + 1);
  if (game.money < cost) return false;              // yetersiz bakiye
  game.money -= cost;
  game.upgrades[id] = cur + 1;
  // Vitrin hasta KARIŞIMINI (reçeteli payı), Medula ise reçeteli hastaların tipini
  // değiştirir => önden üretilmiş günler geçersizleşir. Oynanan gün snapshot'tan
  // okunduğu için etkilenmez.
  if (id === "vitrin" || id === "medula") invalidateDaySchedules();
  return true;
}

// --- MEDULA SORGUSU ---
// Kod KUYRUKTAKİ hastalar arasında aranır (gelmemiş hastanın kodunu oyuncu zaten bilemez).
// Bulunursa kayıt açılır ve o hasta için kalıcı olur; bulunmazsa giriş temizlenir.
function medulaSubmit() {
  const code = game.medulaInput;
  if (code.length !== CONFIG.medulaCodeLen) return;
  const hit = game.queue.find(p => p.request.type === "medula" && p.request.code === code);
  if (!hit) {
    game.medulaResult = { error: "Kayıt bulunamadı" };
    game.medulaInput = "";
    return;
  }
  medulaReveal(code);                       // zaten girilmişse de sorun değil, yine gösterilir
  game.medulaResult = { code: code, items: hit.request.items.slice() };
  game.medulaInput = "";
}
function medulaKeyPress(ch) {
  if (game.medulaInput.length >= CONFIG.medulaCodeLen) return;
  game.medulaInput += ch;
  if (game.medulaResult && game.medulaResult.error) game.medulaResult = null;
}
function medulaBackspace() { game.medulaInput = game.medulaInput.slice(0, -1); }

// gruplu kutuya tıklayınca o ilaçtan BİR adet çıkar (tek tek geri alma korunur)
function removeOneFromCounter(id) {
  if (!servingAllowed()) return;
  const idx = game.counter.lastIndexOf(id);
  if (idx < 0) return;
  game.counter.splice(idx, 1);
  rebuildCounterSlots();
}

// --- TEŞHİS: her servis/red kararında tek okunabilir blok ---
// countList: ["a","a","b"] -> "a×2, b×1" (ilaç ADI ile, id de parantezde)
function fmtCounts(ids) {
  if (!ids || !ids.length) return "(boş)";
  const order = [], n = {};
  for (const id of ids) { if (!(id in n)) { n[id] = 0; order.push(id); } n[id]++; }
  return order.map(id => {
    const m = getMedicine(id);
    return (m ? m.name : "?") + "×" + n[id] + " [" + id + "]";
  }).join(", ");
}

function explainDecision(p, given, verdict, reason) {
  if (!CONFIG.debugDecisions || !p) return;
  const r = p.request;
  const L = [];
  L.push("── KARAR · Gün " + game.dayNumber + " · " + (p.bonus ? "BONUS hasta (cheat)" : "programlı hasta"));
  if (r.type === "medula") {
    const need = [];
    for (const it of r.items) for (let i = 0; i < it.qty; i++) need.push(it.id);
    L.push("   tip      : MEDULA (e-reçete) · kod " + r.code + " · sorgulandı: " + (medulaIsRevealed(r.code) ? "evet" : "hayır"));
    L.push("   istenen  : " + fmtCounts(need));
    L.push("   verilen  : " + fmtCounts(given));
    L.push("   not      : Medula reçetesi asla sahte değildir; sahtelik/doktor kontrolü çalışmaz.");
    L.push("   ödeme    : gün kazancına BUGÜN, kasaya gün " + (game.dayNumber + CONFIG.medulaPayDelayDays) + "'de");
  } else if (r.type === "prescription") {
    const need = [];
    for (const it of r.items) for (let i = 0; i < it.qty; i++) need.push(it.id);
    L.push("   tip      : reçete" + (r.fake ? " (SAHTE)" : " (gerçek)") + " · karar: " + (p.decided || "—"));
    L.push("   istenen  : " + fmtCounts(need));
    L.push("   verilen  : " + fmtCounts(given));
    const known = KNOWN_DOCTORS.some(d => d.name === r.doctor);
    L.push("   doktor   : " + JSON.stringify(r.doctor) + " → defterde " + (known ? "VAR" : "YOK"));
    const today = dateRx(0);
    L.push("   kusurlar : " +
      "doktor " + (known ? "✓" : "✗") +
      " | kaşe " + (r.hasStamp === false ? "✗ (yok)" : "✓") +
      " | imza " + ((r.sig === "???" || r.sig === "—" || r.sig === "") ? "✗ " + JSON.stringify(r.sig) : "✓ " + JSON.stringify(r.sig)) +
      " | doz " + Math.max.apply(null, r.items.map(it => it.qty)) + " (kusur değil) " +
      " | tarih " + (r.expired ? "✗" : "✓") + " (reçete " + r.date + " ↔ oyun " + today + ")");
    L.push("   iç bayrak: fake=" + r.fake + " flaws=[" + (r.flaws || []).join(", ") + "]");
    L.push("   tespit edilebilir kusur: " + (detectableFlawsOf(r).join(" · ") || "(yok)"));
  } else {
    const items = r.items || [{ symptom: r.symptom, qty: 1 }];
    L.push("   tip      : semptom · " + items.length + " kalem · " + JSON.stringify(r.line || ""));
    for (const it of items) {
      const cands = MEDICINES.filter(m => m.category === it.symptom.category);
      L.push("     · " + JSON.stringify(it.symptom.label) + " ×" + it.qty +
        " [" + it.symptom.category + "] → kabul: " + cands.map(m => m.name).join(", "));
    }
    L.push("   istenen kategoriler: " + expectedCategoryList(r).join(", "));
    L.push("   verilen  : " + fmtCounts(given));
    L.push("   verilen kategoriler: " + given.map(id => { const m = getMedicine(id); return m ? m.category : "?"; }).join(", "));
  }
  L.push("   SONUÇ    : " + verdict + " — " + reason);
  console.log(L.join("\n"));
}

// --- SGK ALACAK DEFTERİ ---
// Medula satışının parası kasaya GECİKMELİ girer. Günün kazanç sayacına (hedefin ölçüldüğü
// dayStats.money) hizmet günü yazılır — hedef formülü, R ve missCost hiç etkilenmez.
function addReceivable(amount) {
  if (!(amount > 0)) return;
  const due = game.dayNumber + CONFIG.medulaPayDelayDays;
  const row = game.receivables.find(r => r.dueDay === due);
  if (row) row.amount += amount;
  else game.receivables.push({ dueDay: due, amount: amount });
  game.medulaBooked += amount;
}

// Defter bütünlüğü: deftere yazılan toplam === kasaya giren + hâlâ bekleyen.
// Bir kuruş kaybolursa/iki kez sayılırsa burada yakalanır.
function verifyMedulaLedger() {
  const diff = game.medulaBooked - (game.medulaCollected + pendingReceivables());
  if (Math.abs(diff) > 0.5) {
    console.warn("[medula] Alacak defteri tutmuyor: yazılan " + Math.round(game.medulaBooked) +
      "₺ ≠ yatan " + Math.round(game.medulaCollected) + "₺ + bekleyen " + pendingReceivables() +
      "₺ (fark " + Math.round(diff) + "₺)");
    return false;
  }
  return true;
}

// Gün başında o güne (ve geçmişe kalmışsa ona) düşen alacakları kasaya aktar.
function collectReceivables() {
  let total = 0;
  game.receivables = game.receivables.filter(r => {
    if (r.dueDay <= game.dayNumber) { total += r.amount; return false; }
    return true;
  });
  game.collectedToday = Math.round(total);
  if (game.collectedToday > 0) {
    game.money += game.collectedToday;
    game.medulaCollected += game.collectedToday;
    flashInfoToast("🏦 SGK ödemesi yattı: +" + formatMoney(game.collectedToday));
  }
  verifyMedulaLedger();
  return game.collectedToday;
}
function pendingReceivables() {
  let t = 0;
  for (const r of game.receivables) t += r.amount;
  return Math.round(t);
}

// bilgi şeridi — stok uyarısından ayrı kanal (birbirini ezmezler)
function flashInfoToast(txt) {
  game.infoToast = { text: txt, until: game.clock + CONFIG.medulaToastDuration };
}

// Günlük kazanç sayacına yaz — aktif bölüme (gündüz/gece) de ayrı işlenir.
function addDayMoney(delta) {
  game.dayStats.money += delta;
  if (game.phase === "night") game.dayStats.moneyNight += delta;
  else game.dayStats.moneyDay += delta;
}

function checkOrder() {
  const p = activePatient();
  if (!servingAllowed() || !p) return;
  if (game.counter.length === 0) return;

  // onaylanmış SAHTE reçeteye ilaç verme => ağır ceza (ilaç doğru olsa bile)
  if (p.request.type === "prescription" && p.request.fake) {
    game.dayStats.served++;
    game.dayStats.wrong++;
    game.money = Math.max(0, game.money - CONFIG.fakeApproveMoneyPenalty);
    addDayMoney(-CONFIG.fakeApproveMoneyPenalty);
    game.feedback = { ok: false, angry: false, text: "⚠️ Sahte reçeteye ilaç verdin!  -" + CONFIG.fakeApproveMoneyPenalty + "₺", t: 0 };
    explainDecision(p, game.counter.slice(), "YANLIŞ", "reçete SAHTE — ilaçlar doğru olsa bile onaylamak hatalı");
    loseReputation(CONFIG.fakeApproveRepLoss);
    return;
  }

  const expected = expectedMedicineIds();
  const given = game.counter.slice();

  let correct = false;
  if (p.request.type === "prescription" || p.request.type === "medula") {
    correct = sameMultiset(expected, given);   // doğru ilaçlar + doğru adet
  } else {
    // Semptomlu hasta: verilen ilaçların KATEGORİ çoklu-kümesi, istenen semptomların
    // kategori çoklu-kümesiyle birebir eşleşmeli (aynı sameMultiset kalıbı, id yerine kategori).
    const wantCats = expectedCategoryList(p.request);
    const gotCats = given.map(id => { const m = getMedicine(id); return m ? m.category : "?"; });
    correct = sameMultiset(wantCats, gotCats);
  }

  game.dayStats.served++;
  if (correct) {
    // stok tüketimi — verilen her ilaç stoktan düşer (negatife inmez; ekleme zaten stokla sınırlı)
    for (const gid of given) game.stock[gid] = Math.max(0, (game.stock[gid] || 0) - 1);
    // kazanç = servis edilen ilaçların satış fiyatı toplamı (adet dahil; given id tekrarlı liste)
    let earn = 0;
    for (const gid of given) { const gm = getMedicine(gid); if (gm) earn += gm.price; }
    if (p.night) earn = Math.round(earn * CONFIG.nightPriceMultiplier);   // nöbet farkı (Medula'ya da uygulanır)
    if (p.request.type === "medula") {
      // SGK ödemesi GECİKMELİ: günün kazancına BUGÜN yazılır (hedef ölçümü değişmez),
      // kasaya medulaPayDelayDays gün sonra girer.
      addReceivable(earn);
      game.dayStats.medulaAccrued += earn;
    } else {
      game.money += earn;
    }
    addDayMoney(earn);
    game.dayStats.correct++;
    gainReputation(CONFIG.repGainCorrect);
    game.feedback = p.request.type === "medula"
      ? { ok: true, angry: false, text: "✓ Medula kaydı işlendi!  +" + earn + "₺ (SGK, gün " + (game.dayNumber + CONFIG.medulaPayDelayDays) + ")", t: 0 }
      : { ok: true, angry: false, text: "✓ Teşekkürler!  +" + earn + "₺", t: 0 };
    explainDecision(p, given, "DOĞRU", "istenen ilaç(lar) tam eşleşti (+" + earn + "₺)");
  } else {
    // yanlış ilaç: kutu açıldı sayılır — stok düşer, para GELMEZ, üstüne o ilaçların
    // alış maliyeti (cost) zarar olarak yazılır.
    let loss = 0;
    for (const gid of given) {
      game.stock[gid] = Math.max(0, (game.stock[gid] || 0) - 1);
      const gm = getMedicine(gid);
      if (gm) loss += gm.cost;
    }
    loss = Math.round(loss);
    game.money = Math.max(0, game.money - loss);
    addDayMoney(-loss);
    game.dayStats.wrong++;
    game.feedback = { ok: false, angry: false, text: "✗ Yanlış ilaç!  -" + loss + "₺", t: 0 };
    explainDecision(p, given, "YANLIŞ",
      (p.request.type === "prescription" || p.request.type === "medula")
        ? "kalem/adet eşleşmedi (istenen ile verilen farklı)"
        : "verilen ilaçların kategorileri istenen semptomlarla eşleşmedi");
    loseReputation(CONFIG.repLossWrong);
  }
}

// feedback bitince aktif hasta çıkar (tamamlandı), sıra kayar; hedef dolduysa gün biter
function onFeedbackEnd() {
  // feedback bitiminde oyun bittiyse kuyruk kaydırma / yeni gün mantığı çalışmaz
  if (game.state === STATE.GAMEOVER) { game.feedback = null; return; }
  const done = game.queue.shift();
  game.counter = [];
  game.feedback = null;
  rebuildCounterSlots();
  if (done && done.bonus) return;          // cheat hastası: günün programına sayılmaz
  game.dayCompleted++;
  const sch = game.daySchedule;
  // gündüz bölümü bitti ve o gün nöbetçiyse: DAYEND'e gitme, gece bölümüne geç
  if (sch && game.phase === "day" && sch.nightN > 0 && game.dayCompleted >= sch.dayN) {
    beginNightShift();
    return;
  }
  if (game.dayCompleted >= patientsForDay()) endDay();
}

// Gündüz bitti → NÖBET bölümü. Kuyruk boş, kısa geçiş kartı, sahne kararır.
function beginNightShift() {
  game.phase = "night";
  game.nightIntro = 0;                       // geçiş kartı açılır (tap ya da süreyle kapanır)
  game.spawnTimer = CONFIG.spawnInterval;    // gece ilk hasta hemen dalmasın
}

function endDay() {
  game.state = STATE.DAYEND;
  game.feedback = null;
  const goal = goalForDay();
  const met = game.dayStats.money >= goal;
  // Hedef tutan gün itibar kazandırır (tavan korunur => zaten 100'deyse kazanç 0 olur).
  // Kaçıran gün CEZA ALMAZ. Buraya konması cheat ile atlanan günlerde de tutarlı çalışmasını
  // sağlar: skipDay da endDay üzerinden geçer.
  // yumuşak tavan yüzünden fiilen eklenen değer repGain'e yazılır (kart bunu gösterir)
  const repGain = met ? gainReputation(CONFIG.goalMetReputation) : 0;
  game.dayResult = { goal: goal, met: met, repGain: repGain };
}

// günün listesini hazırla ve sayaçları sıfırla (hedef artık bu listeden geliyor).
// Cache'teki hasta nesneleri OYNANIRKEN değişir (sabır, decided); aynı gün tekrar
// oynanabildiği için (yeni oyun) her seferinde taze kopya verilir. request paylaşılır —
// oynanış sırasında değiştirilmez, sadece okunur.
function beginDaySchedule(day) {
  const sch = getDaySchedule(day);
  game.daySchedule = Object.assign({}, sch, {
    patients: sch.patients.map(p => Object.assign({}, p))
  });
  game.dayScheduleIdx = 0;
}

function startNextDay() {
  game.dayNumber++;
  game.phase = "day";
  game.nightIntro = null;
  collectReceivables();          // vadesi gelen SGK alacakları kasaya girer
  game.medulaInput = "";         // gün değişti: yarım kalan kod girişi anlamını yitirir
  game.medulaResult = null;
  beginDaySchedule(game.dayNumber);
  game.spawnTimer = CONFIG.spawnInterval;
  game.daySpawned = 0;
  game.dayCompleted = 0;
  game.queue = [];
  game.counter = [];
  game.feedback = null;
  game.dayStats = { served: 0, correct: 0, wrong: 0, angry: 0, money: 0, moneyDay: 0, moneyNight: 0, medulaAccrued: 0 };
  rebuildCounterSlots();
  game.state = STATE.PLAYING;
  spawnPatient();
}

// Geliştirmeleri Lv1'e kur. Stok ile AYNI kalıcılık yolu: yalnız startNewGame çağırır,
// startNextDay dokunmaz => günler arası korunur, DEVAM ET'te korunur, BAŞLA'da sıfırlanır.
function initUpgrades() {
  game.upgrades = {};
  for (const u of UPGRADES) game.upgrades[u.id] = 1;
  invalidateDaySchedules();
}

// Stoğu başlangıç değerine kur (her ilaç ayrı). MEDICINES dizisi değişmez; runtime obje.
function initStock() {
  game.stock = {};
  for (const m of MEDICINES) game.stock[m.id] = CONFIG.startStock;
}

// Oyunu sıfırdan kurar (MENU/GAMEOVER → PLAYING). Gün, para, itibar, STOK dahil her şey resetlenir.
function startNewGame() {
  game.money = CONFIG.startMoney;
  game.reputation = CONFIG.startReputation;
  game.dayNumber = 1;
  game.phase = "day";
  game.nightIntro = null;
  game.nightT = 0;
  // SIRA ÖNEMLİ: koşu tohumu ve geliştirmeler, gün 1 listesi kurulmadan ÖNCE ayarlanır —
  // yoksa gün 1 eski tohumla/eski seviyelerle üretilir.
  game.runSeed = newRunSeed();   // HER YENİ OYUN farklı: stok/geliştirme ile aynı kalıcılık yolu
  initUpgrades();         // geliştirmeler yalnızca yeni oyunda sıfırlanır (günler arası kalıcı)
  invalidateDaySchedules();
  beginDaySchedule(1);
  game.spawnTimer = 0;
  game.daySpawned = 0;
  game.dayCompleted = 0;
  game.queue = [];
  game.counter = [];
  game.feedback = null;
  game.stockToast = null;
  game.depotOpen = false;
  game.pcScreen = "home";
  game.depotPending = {};
  game.receivables = [];  // SGK alacakları: stok/geliştirme ile aynı kalıcılık yolu
  game.medulaBooked = 0;
  game.medulaCollected = 0;
  game.medulaRevealed = {};
  game.medulaInput = "";
  game.medulaResult = null;
  game.collectedToday = 0;
  game.infoToast = null;
  initStock();            // stok yalnızca yeni oyunda sıfırlanır (günler arası kalıcı)
  game.dayStats = { served: 0, correct: 0, wrong: 0, angry: 0, money: 0, moneyDay: 0, moneyNight: 0, medulaAccrued: 0 };
  game.state = STATE.PLAYING;
  game.hasRun = true;               // menüde DEVAM ET görünebilir
  rebuildCounterSlots();
  spawnPatient();
}

// İtibar KAZANCINI tek noktadan uygula (yumuşak tavan).
// repSoftCap'e kadar tam değer, üstü repOverflowFactor ile kısılmış; toplam repMax'i aşmaz.
// Örnek: itibar 98, kazanç +6 -> 2 puan tam (100'e kadar) + 4 puanın yarısı = 102.
// Uygulanan GERÇEK artışı döndürür (DAYEND kartı bunu gösterir).
function gainReputation(amount) {
  if (!(amount > 0)) return 0;
  const before = game.reputation;
  let rep = before, left = amount;
  if (rep < CONFIG.repSoftCap) {                 // yumuşak tavanın altı: tam değer
    const take = Math.min(left, CONFIG.repSoftCap - rep);
    rep += take;
    left -= take;
  }
  if (left > 0) rep += left * CONFIG.repOverflowFactor;   // tavan üstü: kısılarak
  game.reputation = clamp(rep, CONFIG.minReputation, CONFIG.repMax);
  return game.reputation - before;
}

// İtibar kaybını tek noktadan uygula: TAM değer (yumuşatma yok), sıfıra inince oyun biter.
// Üst sınır repMax'tir; maxReputation olsaydı 100 üstü yastık ilk kayıpta silinirdi.
function loseReputation(amount) {
  game.reputation = clamp(game.reputation - amount, CONFIG.minReputation, CONFIG.repMax);
  if (game.reputation <= CONFIG.minReputation) triggerGameOver();
}

// Oyun biter: kuyruk olduğu yerde donar (update PLAYING dışında çalışmaz).
function triggerGameOver() {
  game.state = STATE.GAMEOVER;
  game.hasRun = false;              // bitmiş oyuna DEVAM ET yok
  game.feedback = null;
}

// =====================================================================
//  UPDATE
// =====================================================================
function update(dt) {
  game.clock += dt;

  // doktor defteri açılma/kapanma animasyonu
  if (game.bookState === "opening") {
    game.bookT += dt / CONFIG.bookAnimTime;
    if (game.bookT >= 1) { game.bookT = 1; game.bookState = "open"; }
  } else if (game.bookState === "closing") {
    game.bookT -= dt / CONFIG.bookAnimTime;
    if (game.bookT <= 0) { game.bookT = 0; game.bookState = "closed"; }
  }

  // gece katmanı yumuşak otursun (panel açıkken de ilerlesin; ani geçiş olmasın)
  {
    const target = (game.phase === "night" && game.state !== STATE.MENU) ? 1 : 0;
    const step = dt / Math.max(0.01, CONFIG.nightFadeTime);
    if (game.nightT < target) game.nightT = Math.min(target, game.nightT + step);
    else if (game.nightT > target) game.nightT = Math.max(target, game.nightT - step);
  }

  // depo paneli açıkken oyun donsun (sabır/spawn/feedback işlemesin) — clock akmaya devam eder
  if (game.depotOpen) return;

  // "NÖBET BAŞLIYOR" kartı açıkken oyun donar (depo paneliyle aynı kalıp)
  if (game.nightIntro !== null) {
    game.nightIntro += dt;
    if (game.nightIntro >= CONFIG.nightIntroDuration) game.nightIntro = null;
    return;
  }

  if (game.state !== STATE.PLAYING) return;

  // hasta spawn — günün hedef müşteri sayısı kadar üret, kuyruk doluysa bekle
  const goalN = patientsForDay();
  game.spawnTimer += dt;
  const prog = goalN > 0 ? game.dayCompleted / goalN : 0;       // gün ilerledikçe hızlan
  const interval = lerp(CONFIG.spawnInterval, CONFIG.minSpawnInterval, prog);
  if (game.spawnTimer >= interval && game.queue.length < effMaxQueue() && game.daySpawned < goalN) {
    game.spawnTimer = 0;
    spawnPatient();
  }

  // pozisyon + giriş animasyonları
  for (let i = 0; i < game.queue.length; i++) {
    const p = game.queue[i];
    p.posCurrent += (i - p.posCurrent) * Math.min(1, dt * 10);
    if (p.enterT < CONFIG.patientEnterTime) p.enterT += dt;
  }

  // sabır + feedback
  if (game.feedback) {
    game.feedback.t += dt;
    if (game.feedback.t >= CONFIG.feedbackDuration) onFeedbackEnd();
  } else {
    for (let i = 0; i < game.queue.length; i++) {
      const p = game.queue[i];
      let rate = i === 0 ? 1 : CONFIG.queuePatienceMultiplier;
      // reçete inceleme fazında aktif hastanın sabrı DONUK (acele baskısı yok)
      if (i === 0 && p.request.type === "prescription" && !p.decided) rate = 0;
      p.patience -= dt * rate;
    }
    const act = activePatient();
    if (act && act.patience <= 0) {
      act.patience = 0;
      game.dayStats.angry++;
      game.feedback = { ok: false, angry: true, text: "😠 Çok beklettin!", t: 0 };
      loseReputation(CONFIG.angryRepLoss);
    }
  }
}

// =====================================================================
//  RENDER YARDIMCILARI
// =====================================================================
function roundRect(x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function fillRoundRect(x, y, w, h, r, color) {
  roundRect(x, y, w, h, r);
  ctx.fillStyle = color;
  ctx.fill();
}
function strokeRoundRect(x, y, w, h, r, color, lineW) {
  roundRect(x, y, w, h, r);
  ctx.lineWidth = lineW;
  ctx.strokeStyle = color;
  ctx.stroke();
}
// Büfeci tarzı koyu yarı saydam panel: yumuşak gölge + ince amber kenarlık
function drawPanel(x, y, w, h, r, fill, border) {
  const c = CONFIG.colors;
  ctx.save();
  ctx.shadowColor = c.panelShadow;
  ctx.shadowBlur = 16;
  ctx.shadowOffsetY = 5;
  fillRoundRect(x, y, w, h, r, fill || c.panelBg);
  ctx.restore();
  strokeRoundRect(x, y, w, h, r, border || c.panelBorder, Math.max(1, w * 0.004));
}
function text(str, x, y, size, color, align, weight) {
  ctx.fillStyle = color;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  ctx.font = (weight || "600") + " " + size + "px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  ctx.fillText(str, x, y);
}

// =====================================================================
//  RENDER — bölümler
// =====================================================================
function drawBackground() {
  const w = layout.w, h = layout.h;
  Sprite.draw(ctx, "bg_pharmacy", 0, 0, w, h, (ctx, x, y, bw, bh) => {
    const g = ctx.createLinearGradient(0, 0, 0, bh);
    g.addColorStop(0, CONFIG.colors.bgTop);
    g.addColorStop(0.5, CONFIG.colors.bg);
    g.addColorStop(1, CONFIG.colors.bg);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, bw, bh);
  }, "cover");
}

// Retro kart HUD (Büfeci düzeni): iki koyu, kalın kenarlıklı iki satırlı kutu + ortada EV.
// SOL: [GÜN N | tarih] / [HAVA ADI | hava emojisi] — SAĞ: [😊 | %N] / [💵 | 1.100₺]
function drawHUD() {
  const hud = layout._hud;
  const c = CONFIG.colors;
  const r = hud.h * 0.16;                    // köşeli-yumuşak
  const bw = Math.max(2, hud.h * 0.055);     // kalın retro kenarlık

  const retroBox = (bx, bwid) => {
    ctx.save();
    ctx.shadowColor = c.panelShadow; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    fillRoundRect(bx, hud.y, bwid, hud.h, r, c.panelBgSolid);
    ctx.restore();
    strokeRoundRect(bx, hud.y, bwid, hud.h, r, c.panelBorder, bw);
  };

  const y1 = hud.y + hud.h * 0.30;   // üst satır
  const y2 = hud.y + hud.h * 0.71;   // alt satır
  const fs1 = hud.h * 0.26, fs2 = hud.h * 0.23;

  // SOL kutu: satır1 GÜN, satır2 tarih. (Hava durumu kaldırıldı; iki öğe kendi satırına
  // yayıldı — eskiden GÜN ve tarih tek satırı paylaşıp sıkışıyordu.)
  const lw = hud.w * 0.36;
  const lpad = lw * 0.09;
  retroBox(hud.x, lw);
  fitText("GÜN " + game.dayNumber, hud.x + lpad, y1, lw * 0.82, fs1 * 1.06, c.neon, "left", "800");
  fitText(dateShort(), hud.x + lpad, y2, lw * 0.82, fs2, c.creamSoft, "left", "700");

  // SAĞ kutu: satır1 solda itibar emojisi, sağda %N; satır2 solda 💵, sağda para
  const rw = hud.w * 0.36;
  const rx = hud.x + hud.w - rw;
  const rpad = rw * 0.09;
  retroBox(rx, rw);
  // itibar %100'ü aşabilir (yumuşak tavan) — kırpma YOK, yastık görünsün
  const pct = clamp(Math.round(game.reputation), 0, Math.round(CONFIG.repMax));
  const repEmoji = pct < 35 ? "😡" : pct < 70 ? "😑" : pct < 100 ? "😊" : "😄";
  drawEmoji(repEmoji, rx + rpad + fs1 * 0.5, y1, fs1, "#000");
  text("%" + pct, rx + rw - rpad, y1, fs1, c.neon, "right", "800");
  drawEmoji("💵", rx + rpad + fs2 * 0.5, y2, fs2, "#000");
  fitText(formatMoney(game.money), rx + rw - rpad, y2, rw * 0.64, fs2, "#8fe3a8", "right", "800");

  // NÖBET rozeti — sol kutu ile EV butonu arasındaki boşlukta (HUD düzeni değişmez).
  // Nöbet günü boyunca durur; gece bölümünde dolgusu parlar.
  if (isNightDutyDay(game.dayNumber)) {
    // Rozet, sol kutu ile EV butonu arasındaki BOŞLUĞA sığdırılır (ikisine de binmez).
    const homeS = hud.h * 0.78;                       // EV butonu ölçüsü (aşağıda aynısı)
    const gapL = hud.x + lw;                          // sol kutunun sağ kenarı
    const gapR = hud.x + hud.w / 2 - homeS / 2;       // EV butonunun sol kenarı
    const bs = Math.min(hud.h * 0.56, Math.max(0, gapR - gapL) * 0.78);
    const bx = gapL + ((gapR - gapL) - bs) / 2;       // boşlukta ortala
    const by = hud.y + (hud.h - bs) / 2;
    if (bs > hud.h * 0.18) {
    const on = game.phase === "night";
    ctx.save();
    ctx.globalAlpha = on ? 1 : 0.75;
    fillRoundRect(bx, by, bs, bs, bs * 0.30, on ? "rgba(96, 78, 168, 0.95)" : "rgba(40, 34, 68, 0.85)");
    strokeRoundRect(bx, by, bs, bs, bs * 0.30, on ? "#c9b6ff" : "rgba(160, 140, 235, 0.7)", Math.max(1.5, bs * 0.07));
    drawEmoji("🌙", bx + bs / 2, by + bs / 2, bs * 0.56, "#000");
    ctx.restore();
    }
  }

  // ORTA: kare EV butonu — menüye döner (oyun verisi silinmez)
  const hs = hud.h * 0.78;
  const hx = hud.x + hud.w / 2 - hs / 2;
  const hy = hud.y + (hud.h - hs) / 2;
  layout.homeBtn = { x: hx, y: hy, w: hs, h: hs };
  ctx.save();
  ctx.shadowColor = c.panelShadow; ctx.shadowBlur = 8; ctx.shadowOffsetY = 2;
  fillRoundRect(hx, hy, hs, hs, hs * 0.18, c.panelBgSolid);
  ctx.restore();
  strokeRoundRect(hx, hy, hs, hs, hs * 0.18, c.panelBorder, Math.max(2, hs * 0.06));
  // emoji tam merkez + minik optik offset (emoji baseline'ı hafif yukarı render olur)
  drawEmoji("🏠", hx + hs / 2, hy + hs / 2, hs * 0.48, "#000");
}

// ---- kuyruk yerleşimi: pozisyon değerini sahne koordinatına çevir ----
//  Aktif müşteri: DEV, ortada, tezgah bandının ardına göğüsten gömülü.
//  Bekleyenler: görünmez (tezgahın altında); öne gelince banttan yükselir.
function slotLayout(i) {
  const S = layout.stage;
  const counterLine = layout._counterLine;
  // reçeteli aktif hastada sol panel açılır => müşteri küçülüp sağa kayar
  const ap = activePatient();
  const presc = !!(ap && ap.request.type === "prescription");
  const cx = presc ? S.x + S.w * 0.745 : S.x + S.w * 0.5;
  const charH = presc ? S.h * 0.40 : S.h * 0.675;
  if (i <= 0) {
    return {
      cx,
      baseY: presc ? counterLine + S.h * 0.13 : counterLine + S.h * 0.345,
      charH,
      alpha: 1,
      active: 1
    };
  }
  // bekleyen: aynı konumda ama tezgahın altında ve görünmez (öne gelince yükselir)
  return {
    cx,
    baseY: counterLine + S.h * 0.55,
    charH,
    alpha: 0,
    active: 0
  };
}
function getPatientLayout(pos) {
  const i0 = Math.floor(pos), f = pos - i0;
  const a = slotLayout(i0), b = slotLayout(i0 + 1);
  return {
    cx: lerp(a.cx, b.cx, f),
    baseY: lerp(a.baseY, b.baseY, f),
    charH: lerp(a.charH, b.charH, f),
    alpha: lerp(a.alpha, b.alpha, f),
    active: lerp(a.active, b.active, f)
  };
}

// şeffaf karakterler için yumuşak, sıcak elips zemin gölgesi
function drawGroundShadow(cx, cy, rx, ry) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, "rgba(70, 45, 25, 0.38)");
  g.addColorStop(0.55, "rgba(70, 45, 25, 0.18)");
  g.addColorStop(1, "rgba(70, 45, 25, 0)");
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, rx, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();
}

// Sabır barı ÇİZİLMİYOR (görsel olarak gizli) — sabır sistemi aynen işler:
// update() azaltır, biten hasta küser, itibar düşer, reçete incelemede donar.
// Konsoldan takip: cheats.setPatience(n) ve cheats.state().activePatience

function drawOnePatient(p) {
  const counterLine = layout._counterLine;
  const L = getPatientLayout(p.posCurrent);
  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const ease = 1 - Math.pow(1 - enter, 3);
  const alpha = L.alpha * ease;

  const ratio = clamp(p.patience / p.maxPatience, 0, 1);
  // sabır azaldıkça hafif titreme (kızgınlık)
  let dx = 0;
  if (ratio < 0.35) dx = Math.sin(game.clock * 24) * L.charH * 0.018 * (1 - ratio / 0.35);

  const cx = L.cx + dx;
  const charH = L.charH;

  ctx.globalAlpha = alpha;

  // 1) zemin gölgesi (tezgah çizgisinde, karakterin yere/tezgaha bastığı his)
  drawGroundShadow(cx, counterLine - charH * 0.012, charH * 0.34, charH * 0.075);

  // 2) karakter — şeffaf PNG, contain (oran korunur, gerilme/kırpma yok)
  //    Kutu kare; 3:4 karakter yükseklikten sınırlanır => yatayda ortalı oturur.
  const boxX = cx - charH / 2;
  const boxY = L.baseY - charH;
  Sprite.draw(ctx, p.avatarKey, boxX, boxY, charH, charH, () => {
    drawEmoji(p.avatar, cx, L.baseY - charH * 0.5, charH * 0.82, "#000");
  }, "contain");

  ctx.globalAlpha = 1;
  // (sabır barı bilinçli olarak çizilmiyor; sabır mantığı update()'te aynen işler)
}

// semptomlu hasta — baş üstü konuşma balonu (reçetelilerde sol panel kullanılır)
function drawSymptomBubble(p) {
  const area = layout._patientArea;
  const counterLine = layout._counterLine;
  const areaH = counterLine - area.y;
  const L = getPatientLayout(p.posCurrent);
  if (L.active < 0.12) return;

  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const a = L.active * (1 - Math.pow(1 - enter, 3));
  const headTop = L.baseY - L.charH;
  const cx = L.cx;

  const bubbleW = Math.min(area.w * 0.76, areaH * 1.6);
  const bubbleH = areaH * 0.28;
  let bubbleY = headTop - areaH * 0.03 - bubbleH;
  if (bubbleY < area.y) bubbleY = area.y;
  const bubbleX = cx - bubbleW / 2;
  ctx.globalAlpha = a;
  drawSpeechBubble(bubbleX, bubbleY, bubbleW, bubbleH, cx, bubbleY + bubbleH);
  drawSymptom(p.request, bubbleX, bubbleY, bubbleW, bubbleH);
  ctx.globalAlpha = 1;
}

// reçeteli hasta — baş üstü kısa replik balonu (replik spawn'da seçilir, p.line).
// Reçete paneli SOLDA (stage %4-46); balon hastanın üstünde sağda, panele girmez.
function drawPrescriptionBubble(p) {
  if (!p.line) return;
  const area = layout._patientArea;
  const S = layout.stage;
  const L = getPatientLayout(p.posCurrent);
  if (L.active < 0.12) return;
  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const a = L.active * (1 - Math.pow(1 - enter, 3));

  const bubbleW = S.w * 0.42, bubbleH = S.h * 0.072;
  let bx = L.cx - bubbleW / 2;
  bx = Math.min(bx, S.x + S.w * 0.97 - bubbleW);   // sağdan taşmasın
  bx = Math.max(bx, S.x + S.w * 0.48);             // reçete panelinin (sağ kenar %46) sağında kal
  const headTop = L.baseY - L.charH;
  let by = headTop - bubbleH - S.h * 0.015;
  if (by < area.y) by = area.y;
  const tailX = clamp(L.cx, bx + bubbleW * 0.15, bx + bubbleW * 0.85);

  ctx.globalAlpha = a;
  drawSpeechBubble(bx, by, bubbleW, bubbleH, tailX, by + bubbleH);
  fitText(p.line, bx + bubbleW / 2, by + bubbleH / 2, bubbleW * 0.88, bubbleH * 0.30, "#3a3326", "center", "700");
  ctx.globalAlpha = 1;
}

// reçeteli hasta — stage SOL ÜST köşesinde, sabit makul boyutlu DÜZ reçete paneli
function drawPrescriptionPanel(p) {
  const S = layout.stage;
  const area = layout._patientArea;
  const L = getPatientLayout(p.posCurrent);
  if (L.active < 0.12) return;
  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const a = L.active * (1 - Math.pow(1 - enter, 3));

  const w = S.w * 0.42;
  const h = Math.min(S.h * 0.40, area.h * 0.94);
  const x = S.x + S.w * 0.04;
  const top = area.y + S.h * 0.006;
  drawPrescriptionPaper(p, x + w / 2, top, w, h, a);
}

function drawQueue() {
  const area = layout._patientArea;
  const counterLine = layout._counterLine;
  if (game.queue.length === 0) {
    text("🚪 Müşteri bekleniyor...", area.x + area.w / 2, area.y + area.h * 0.6,
      area.h * 0.06, CONFIG.colors.cream, "center", "600");
    return;
  }
  // Sadece AKTİF müşteriyi çiz; tezgah çizgisinde kırp (göğüsten gömülü).
  // Bekleyenler görünmez (banttan yükselerek öne gelirler).
  ctx.save();
  ctx.beginPath();
  ctx.rect(area.x, area.y - area.h * 0.2, area.w, counterLine - (area.y - area.h * 0.2));
  ctx.clip();
  drawOnePatient(game.queue[0]);
  ctx.restore();

  // reçeteli => sol büyük panel + baş üstü replik balonu; semptomlu => baş üstü balon
  const p0 = game.queue[0];
  if (p0.request.type === "prescription") {
    drawPrescriptionPanel(p0);
    drawPrescriptionBubble(p0);
  } else if (p0.request.type === "medula") {
    layout.medulaCardRect = null;
    if (medulaIsRevealed(p0.request.code)) drawMedulaRecordPanel(p0);   // sorgulanmışsa liste solda kalır
    drawMedulaBubble(p0);
    checkMedulaLayout(p0.request.code + (layout.medulaCardRect ? ":k" : ""));
  } else {
    drawSymptomBubble(p0);
  }
  // (bekleyen "+N" rozeti kaldırıldı — kuyruk bilgisi oyuncuya sızdırılmıyor)
}

// tezgahta duran kapalı defter (yalnız bookState === "closed" iken)
function drawClosedBook() {
  if (game.bookState !== "closed") return;
  const b = layout.bookClosedRect;
  if (!b) return;
  // yumuşak zemin gölgesi (tezgaha yaslanmış his)
  drawGroundShadow(b.x + b.w / 2, b.y + b.h * 0.96, b.w * 0.5, b.h * 0.16);
  Sprite.draw(ctx, "doctor_book_closed", b.x, b.y, b.w, b.h, () => {
    // fallback: koyu kapalı defter + "Doktorlar"
    fillRoundRect(b.x, b.y, b.w, b.h, b.h * 0.18, "#6b4a2f");
    strokeRoundRect(b.x, b.y, b.w, b.h, b.h * 0.18, "rgba(245,200,140,0.5)", 2);
    text("📕 Doktorlar", b.x + b.w / 2, b.y + b.h / 2, b.h * 0.42, "#f8ecd9", "center", "800");

// açık defterin ekran ortasındaki hedef dikdörtgeni (contain)
function openBookBox() {
  const S = layout.stage;
  const boxW = S.w * 0.94, boxH = S.h * 0.64;
  const boxX = S.x + (S.w - boxW) / 2, boxY = S.y + (S.h - boxH) / 2;
  const img = Assets.images["doctor_book"];
  const aspect = (img && img.naturalWidth) ? (img.naturalWidth / img.naturalHeight) : 1.5;
  let dw, dh;
  if (boxW / boxH > aspect) { dh = boxH; dw = dh * aspect; } else { dw = boxW; dh = dw / aspect; }
  return { x: boxX + (boxW - dw) / 2, y: boxY + (boxH - dh) / 2, w: dw, h: dh };
}

// açık defter içeriği — 20 doktor, iki sütun; her isim kağıttaki ÇİZGİNİN üstüne
// oturur (baseline çizgide). Hiza CONFIG.bookTextStartY / bookLineStep ile elle ayarlanır
// (ikisi de kitap yüksekliğine oran). Başlık kitabın DIŞINDA (drawBookOverlay'de plaka).
function drawBookContent(r) {
  const ink = "#3a3326";
  const names = KNOWN_DOCTORS.map(d => d.name).slice().sort((a, b) => a.localeCompare(b, "tr"));
  const perCol = Math.ceil(names.length / 2);
  const startY = r.y + r.h * CONFIG.bookTextStartY;
  const step = r.h * CONFIG.bookLineStep;
  const colX = [r.x + r.w * 0.15, r.x + r.w * 0.55];   // sol/sağ sayfa iç kenarları
  const colW = r.w * 0.30;
  const fsMax = step * 0.52;
  ctx.save();
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";           // baseline = kağıt çizgisi
  ctx.fillStyle = ink;
  for (let i = 0; i < names.length; i++) {
    const col = i < perCol ? 0 : 1;
    const rowI = i % perCol;
    const ny = startY + rowI * step;
    // sütuna sığdır: punto gerekirse hafif küçülür, taşma yok
    let s = fsMax;
    ctx.font = "600 " + s + "px " + RX_FONT;
    while (s > 6 && ctx.measureText(names[i]).width > colW) { s -= 0.5; ctx.font = "600 " + s + "px " + RX_FONT; }
    ctx.fillText(names[i], colX[col], ny);
  }
  ctx.restore();
}

// açık defter çizim yardımcısı (contain + krem fallback)
function drawOpenBookImage(r) {
  Sprite.draw(ctx, "doctor_book", r.x, r.y, r.w, r.h, () => {
    fillRoundRect(r.x, r.y, r.w, r.h, r.w * 0.03, "#efe2c8");
    strokeRoundRect(r.x, r.y, r.w, r.h, r.w * 0.03, "rgba(120,90,50,0.5)", 2);
    ctx.strokeStyle = "rgba(120,90,50,0.35)"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(r.x + r.w / 2, r.y + r.h * 0.06); ctx.lineTo(r.x + r.w / 2, r.y + r.h * 0.94); ctx.stroke();
  }, "contain");
}

// açılma/kapanma animasyonu + açık panel (en üstte)
function drawBookOverlay() {
  if (game.bookState === "closed") return;
  // eased ilerleme
  const t = game.bookT;
  const prog = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;

  // arka karartma (modal)
  ctx.fillStyle = "rgba(8,6,12," + (0.6 * prog).toFixed(3) + ")";
  ctx.fillRect(0, 0, layout.w, layout.h);

  const start = layout.bookClosedRect;
  const end = openBookBox();
  const cur = {
    x: lerp(start.x, end.x, prog),
    y: lerp(start.y, end.y, prog),
    w: lerp(start.w, end.w, prog),
    h: lerp(start.h, end.h, prog)
  };

  if (game.bookState === "open") {
    // tam açık: net açık defter + içerik + kapatma
    drawOpenBookImage(end);
    drawBookContent(end);
    // "Tanınan Doktorlar" başlığı — kitabın DIŞINDA, üst kenarın hemen üstünde krem plaka
    const plW = end.w * 0.56, plH = end.h * 0.075;
    const plX = end.x + (end.w - plW) / 2;
    const plY = end.y - plH - end.h * 0.015;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    fillRoundRect(plX, plY, plW, plH, plH * 0.35, "#f6efdd");
    ctx.restore();
    strokeRoundRect(plX, plY, plW, plH, plH * 0.35, "rgba(120,90,50,0.5)", 2);
    fitText("Tanınan Doktorlar", plX + plW / 2, plY + plH / 2, plW * 0.9, plH * 0.48, "#3a3326", "center", "800");
    layout.bookBox = end;
    const cs = layout.stage.w * 0.085;
    layout.bookCloseBtn = { x: end.x + end.w - cs * 0.85, y: end.y - cs * 0.35, w: cs, h: cs };
    const cb = layout.bookCloseBtn;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.45)"; ctx.shadowBlur = 10; ctx.shadowOffsetY = 3;
    ctx.beginPath(); ctx.arc(cb.x + cb.w / 2, cb.y + cb.h / 2, cb.w / 2, 0, Math.PI * 2);
    ctx.fillStyle = "#3a2230"; ctx.fill();
    ctx.restore();
    ctx.strokeStyle = "#e8736b"; ctx.lineWidth = Math.max(2, cs * 0.06);
    ctx.beginPath(); ctx.arc(cb.x + cb.w / 2, cb.y + cb.h / 2, cb.w / 2, 0, Math.PI * 2); ctx.stroke();
    text("✕", cb.x + cb.w / 2, cb.y + cb.h / 2, cs * 0.5, "#e8736b", "center", "800");
  } else {
    // geçiş (opening/closing): kapalı defter fade-out, açık defter fade-in (crossfade + scale)
    ctx.globalAlpha = 1 - prog;
    Sprite.draw(ctx, "doctor_book_closed", cur.x, cur.y, cur.w, cur.h, () => {
      fillRoundRect(cur.x, cur.y, cur.w, cur.h, cur.h * 0.18, "#6b4a2f");
    }, "contain");
    ctx.globalAlpha = prog;
    drawOpenBookImage(cur);
    ctx.globalAlpha = 1;
  }
}

// --- GECE KATMANI ---
// Yeni asset yok: mevcut sahnenin üzerine koyu mavi/mor bir katman + tezgahta sıcak ışık.
// drawBackground'ın hemen ardından çizilir; hasta/tezgah/UI üstte kalır (lambanın altı).
function drawNightOverlay() {
  const t = game.nightT || 0;
  if (t <= 0.002) return;
  const w = layout.w, h = layout.h;

  ctx.save();
  ctx.globalCompositeOperation = "multiply";
  ctx.globalAlpha = 0.66 * t;
  const g = ctx.createLinearGradient(0, 0, 0, h);
  g.addColorStop(0, "#2a2560");      // üstte gece mavisi
  g.addColorStop(0.55, "#3b2f6b");   // ortada mor
  g.addColorStop(1, "#4a3a70");
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, w, h);
  ctx.restore();

  // tezgah aydınlatması sıcak kalsın — bandın üstüne yumuşak amber hâle
  const b = layout._band;
  if (b) {
    ctx.save();
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.30 * t;
    const cx = b.x + b.w / 2, cy = b.y;
    const rad = Math.max(b.w * 0.75, b.h * 3);
    const rg = ctx.createRadialGradient(cx, cy, b.h * 0.15, cx, cy, rad);
    rg.addColorStop(0, "rgba(255, 196, 120, 0.95)");
    rg.addColorStop(0.55, "rgba(255, 170, 80, 0.28)");
    rg.addColorStop(1, "rgba(255, 160, 70, 0)");
    ctx.fillStyle = rg;
    ctx.fillRect(cx - rad, cy - rad, rad * 2, rad * 2);
    ctx.restore();
  }
}

// --- "NÖBET BAŞLIYOR" geçiş kartı --- (mevcut kart dili: koyu panel + amber şerit)
function drawNightIntro() {
  if (game.nightIntro === null || game.nightIntro === undefined) return;
  const c = CONFIG.colors, S = layout.stage;
  const dur = CONFIG.nightIntroDuration;
  const t = clamp(game.nightIntro / dur, 0, 1);
  // kısa fade-in / fade-out (ani girip ani çıkmasın)
  const a = clamp(Math.min(game.nightIntro / 0.25, (dur - game.nightIntro) / 0.35), 0, 1);

  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = "rgba(10, 8, 24, 0.62)";
  ctx.fillRect(0, 0, layout.w, layout.h);

  const cardW = S.w * 0.74, cardH = S.h * 0.20;
  const cardX = S.x + (S.w - cardW) / 2;
  const cardY = S.y + (S.h - cardH) / 2;
  const cr = cardW * 0.08;
  drawPanel(cardX, cardY, cardW, cardH, cr, c.panelBgSolid);

  const headerH = cardH * 0.34;
  ctx.save();
  roundRect(cardX, cardY, cardW, cardH, cr);
  ctx.clip();
  ctx.fillStyle = "#4a3a86";                      // gece moru şerit
  ctx.fillRect(cardX, cardY, cardW, headerH);
  ctx.restore();
  fitText("🌙 NÖBET BAŞLIYOR", cardX + cardW / 2, cardY + headerH / 2, cardW * 0.86, headerH * 0.50,
    "#f0e6ff", "center", "800");

  const sch = game.daySchedule;
  const n = sch ? sch.nightN : 0;
  fitText(n + " gece hastası bekleniyor", cardX + cardW / 2, cardY + headerH + (cardH - headerH) * 0.34,
    cardW * 0.84, cardH * 0.115, c.cream, "center", "700");
  fitText("Sahte reçete girişimi artar — dikkatli incele", cardX + cardW / 2,
    cardY + headerH + (cardH - headerH) * 0.66, cardW * 0.86, cardH * 0.095, c.creamSoft, "center", "600");
  ctx.restore();
}

// Krem/açık zeminli kuyruklu konuşma balonu (Büfeci kalıbı) — semptom + reçete replikleri
function drawSpeechBubble(x, y, w, h, tailX, tailBaseY) {
  const paper = "#f6efdd";
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.28)";
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 4;
  fillRoundRect(x, y, w, h, h * 0.20, paper);
  ctx.beginPath();
  ctx.moveTo(tailX - w * 0.06, tailBaseY - 2);
  ctx.lineTo(tailX + w * 0.02, tailBaseY + h * 0.14);
  ctx.lineTo(tailX + w * 0.06, tailBaseY - 2);
  ctx.closePath();
  ctx.fillStyle = paper;
  ctx.fill();
  ctx.restore();
  strokeRoundRect(x, y, w, h, h * 0.20, "rgba(120,90,50,0.45)", Math.max(1.5, w * 0.006));
}

// =====================================================================
//  EMOJİ ÇİZİMİ — gerçek glif kutusuna göre ortalama
// =====================================================================
// Sorun: ctx.textBaseline="middle" glifi FONTUN em kutusuna göre ortalar, glifin
// kendi kutusuna göre değil. Emoji glifleri arasında yükseklik/genişlik farkı olduğu
// için tek bir dikey ofset hepsine uymaz — kimi yukarı kimi aşağı kayar, kimi taşar.
// Çözüm: her emojiyi measureText'in actualBoundingBox* değerleriyle ölçüp GERÇEK
// çizim kutusunu bul, hedef kutuya sığdır ve o kutunun merkezine hizala.
// Emoji başına elle ofset tablosu YOK — ölçüm her glif için kendi kendine çalışır.
function emojiMetrics(ch, size, weight) {
  ctx.save();
  ctx.font = (weight || "400") + " " + size + "px " + RX_FONT;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  const m = ctx.measureText(ch);
  ctx.restore();
  const L = m.actualBoundingBoxLeft, R = m.actualBoundingBoxRight;
  const A = m.actualBoundingBoxAscent, D = m.actualBoundingBoxDescent;
  const has = [L, R, A, D].every(v => typeof v === "number" && isFinite(v));
  if (!has) return null;                      // tarayıcı desteklemiyorsa: eski yola düş
  return { left: L, right: R, asc: A, desc: D, w: L + R, h: A + D };
}

// Emojiyi (cx, cy) merkezli, kenarı `box` olan kareye sığdırarak çiz.
// Dönüş: gerçek çizim kutusu { x, y, w, h } (denetim için) ya da null.
function drawEmoji(ch, cx, cy, box, color, weight) {
  let size = box;
  let m = emojiMetrics(ch, size, weight);
  if (!m || !(m.w > 0) || !(m.h > 0)) {
    // ölçüm yoksa eski davranış (em kutusuna göre ortalama)
    text(ch, cx, cy, box * 0.92, color || "#000", "center", weight || "400");
    return null;
  }
  // taşıyorsa puntoyu kutuya sığacak orana çek (ölçüm punto ile doğrusal ölçeklenir)
  const over = Math.max(m.w / box, m.h / box);
  if (over > 1) { size = size / over; m = emojiMetrics(ch, size, weight) || m; }

  // glif kutusunun merkezi (cx, cy) olacak şekilde çizim noktası
  const drawX = cx - (m.right - m.left) / 2;
  const drawY = cy + (m.asc - m.desc) / 2;
  ctx.save();
  ctx.font = (weight || "400") + " " + size + "px " + RX_FONT;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = color || "#000";
  ctx.fillText(ch, drawX, drawY);
  ctx.restore();
  return { x: drawX - m.left, y: drawY - m.asc, w: m.w, h: m.h };
}

// Bir metni verilen maxW'ye sığacak şekilde küçülterek çiz (taşmayı önler).
const RX_FONT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
function fitText(str, x, y, maxW, px, color, align, weight) {
  let s = px;
  const wgt = weight || "600";
  ctx.font = wgt + " " + s + "px " + RX_FONT;
  while (s > 6 && ctx.measureText(str).width > maxW) {
    s -= 0.5;
    ctx.font = wgt + " " + s + "px " + RX_FONT;
  }
  ctx.fillStyle = color;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  ctx.fillText(str, x, y);
  return s;
}

// Metni SABİT puntoyla verilen genişliğe sığdır: taşarsa sonunu "…" ile kısalt.
// (fitText'in aksine font küçültmez; sütunlu listelerde satırlar aynı boyda kalır)
function ellipsisText(str, x, y, maxW, px, color, align, weight) {
  const wgt = weight || "600";
  ctx.font = wgt + " " + px + "px " + RX_FONT;
  let s = str;
  if (ctx.measureText(s).width > maxW) {
    while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
    s += "…";
  }
  ctx.fillStyle = color;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  ctx.fillText(s, x, y);
}

// Reçete kağıdı: kod ile çizilen DÜZ, temiz krem panel + dinamik içerik.
// Tüm içerik iç padding içinde kalır (taşma yok; gerekirse font küçülür).
// Sabit yükseklikli reçete kağıdı (krem zemin + dinamik içerik).
function drawPrescriptionPaper(p, cx, top, w, h, alpha) {
  const items = p.request.items;
  const x = cx - w / 2, y = top;
  const r = Math.min(w, h) * 0.05;
  ctx.save();
  ctx.globalAlpha = alpha;

  // kağıt zemini — krem + yumuşak gölge + ince kenar
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.28)";
  ctx.shadowBlur = h * 0.05;
  ctx.shadowOffsetY = h * 0.015;
  fillRoundRect(x, y, w, h, r, "#f6efdd");
  ctx.restore();
  strokeRoundRect(x, y, w, h, r, "rgba(120,90,50,0.35)", Math.max(1, w * 0.006));

  // içeriği kağıt iç alanına kırp
  const padX = w * 0.09, padY = h * 0.06;
  const lx = x + padX, rx = x + w - padX;
  const innerW = rx - lx;
  ctx.save();
  roundRect(x + w * 0.03, y + h * 0.03, w * 0.94, h * 0.94, r);
  ctx.clip();

  const ink = "#3a3326", inkSoft = "#8a7c5e";
  const req = p.request;


  // üst: kaşe (✚) + doktor adı + tarih
  const headY = y + padY + h * 0.045;
  // tarih — sahte/eski olsa da renkle ele vermez; oyuncu tarihi OKUYUP anlamalı
  fitText(req.date, rx, headY, innerW * 0.34, h * 0.05, inkSoft, "right", "600");
  // kaşe rozeti (gerçeklerde HER ZAMAN çizilir; no_stamp kusurunda HİÇ çizilmez)
  let docX = lx;
  if (req.hasStamp !== false) {
    const br = h * 0.052;
    const bx = lx + br, by = headY;
    ctx.save();
    ctx.strokeStyle = "#2e7d32"; ctx.lineWidth = Math.max(1.2, h * 0.006);
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    drawEmoji("✚", bx, by, br * 1.5, "#2e7d32", "800");
    docX = lx + br * 2 + w * 0.025;
  }
  fitText(req.doctor, docX, headY, (rx - innerW * 0.36) - docX, h * 0.052, ink, "left", "700");

  // ayraç
  ctx.strokeStyle = "rgba(120,90,50,0.35)";
  ctx.lineWidth = Math.max(1, h * 0.005);
  const sep1 = y + padY + h * 0.11;
  ctx.beginPath(); ctx.moveTo(lx, sep1); ctx.lineTo(rx, sep1); ctx.stroke();

  // orta: ilaç listesi (renk noktası + ad + adet)
  const listTop = sep1 + h * 0.03;
  const listBot = y + h - padY - h * 0.14;
  const lineH = Math.min(h * 0.13, (listBot - listTop) / Math.max(1, items.length));
  const fs = Math.min(lineH * 0.55, h * 0.062);
  const qtyW = innerW * 0.20;
  let ly = listTop + lineH * 0.5;
  for (const it of items) {
    const m = getMedicine(it.id);
    const dotR = fs * 0.36;
    ctx.beginPath();
    ctx.arc(lx + dotR, ly, dotR, 0, Math.PI * 2);
    ctx.fillStyle = m.color; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.18)"; ctx.lineWidth = 1; ctx.stroke();
    // adet renkle ele vermez; ×8/×10 yine yazılır ama normal renkte (oyuncu mantığı yakalar)
    fitText("× " + it.qty, rx, ly, qtyW, fs, ink, "right", "800");
    const nameX = lx + dotR * 2 + fs * 0.5;
    fitText(m.name, nameX, ly, rx - qtyW - fs * 0.5 - nameX, fs, ink, "left", "600");
    ly += lineH;
  }

  // alt: ince ayraç + küçük italik imza
  const sep2 = y + h - padY - h * 0.10;
  ctx.strokeStyle = "rgba(120,90,50,0.28)";
  ctx.lineWidth = Math.max(1, h * 0.004);
  ctx.beginPath(); ctx.moveTo(lx, sep2); ctx.lineTo(rx, sep2); ctx.stroke();

  let sg = h * 0.06;
  ctx.font = "italic 700 " + sg + "px 'Segoe Script','Snell Roundhand','Brush Script MT',cursive";
  while (sg > 7 && ctx.measureText(p.request.sig).width > innerW * 0.55) {
    sg -= 0.5;
    ctx.font = "italic 700 " + sg + "px 'Segoe Script','Snell Roundhand','Brush Script MT',cursive";
  }
  ctx.fillStyle = inkSoft;
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.fillText(p.request.sig, rx, sep2 + h * 0.055);

  ctx.restore();   // içerik kırpması
  ctx.restore();   // ana
}

// --- MEDULA: kod balonu ---
// Hasta kağıt uzatmaz; kodu söyler. Kod, hasta tezgahtayken HER AN okunabilir kalmalı —
// bu yüzden balon sahnenin SAĞ boşluğuna oturur (kayıt kartı solda, HUD üstte).
// Yerleşim sabit piksel değil: HUD'ın ALT SINIRI ve sahne genişliği üzerinden hesaplanır.
function medulaBubbleRect() {
  const S = layout.stage, area = layout._patientArea, hud = layout._hud;
  const hudBottom = hud ? hud.y + hud.h : area.y;
  const bubbleW = S.w * 0.42;                       // reçete balonuyla aynı genişlik
  // sağ boşluk: kayıt kartının sağ kenarının (S.w*0.46) sağında kal, sahne kenarına yaslan
  const bubbleX = Math.max(S.x + S.w * 0.55, S.x + S.w * 0.97 - bubbleW);
  const bubbleH = S.h * 0.115;
  const bubbleY = Math.max(area.y, hudBottom + S.h * 0.014);   // HUD'ın altında, nefes payıyla
  return { x: bubbleX, y: bubbleY, w: bubbleW, h: bubbleH };
}

function drawMedulaBubble(p) {
  const L = getPatientLayout(p.posCurrent);
  if (L.active < 0.12) return;
  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const a = L.active * (1 - Math.pow(1 - enter, 3));

  const r = medulaBubbleRect();
  layout.medulaBubbleRect = r;
  const tailX = clamp(L.cx, r.x + r.w * 0.12, r.x + r.w * 0.5);

  ctx.globalAlpha = a;
  drawSpeechBubble(r.x, r.y, r.w, r.h, tailX, r.y + r.h);
  // replik ikinci planda: küçük ve soluk
  fitText(p.line || "E-reçetem var.", r.x + r.w / 2, r.y + r.h * 0.21,
    r.w * 0.90, r.h * 0.155, "#6b5f4a", "center", "600");
  // KOD balonun en belirgin öğesi: geniş şerit + büyük punto
  const codeW = r.w * 0.84, codeH = r.h * 0.50;
  const codeX = r.x + (r.w - codeW) / 2, codeY = r.y + r.h * 0.40;
  fillRoundRect(codeX, codeY, codeW, codeH, codeH * 0.26, "rgba(38, 74, 54, 0.95)");
  strokeRoundRect(codeX, codeY, codeW, codeH, codeH * 0.26, "rgba(140, 220, 170, 0.75)", 2);
  fitText(p.request.code, codeX + codeW / 2, codeY + codeH / 2, codeW * 0.90, codeH * 0.66,
    "#d8f0e0", "center", "800");
  ctx.globalAlpha = 1;
}

// Sorgulanmış Medula kaydı — reçete panelinin yerinde, aynı ölçülerde kart.
function drawMedulaRecordPanel(p) {
  const S = layout.stage;
  const area = layout._patientArea;
  const L = getPatientLayout(p.posCurrent);
  if (L.active < 0.12) return;
  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const a = L.active * (1 - Math.pow(1 - enter, 3));

  // Kart TAMAMEN HUD'ın altında kalır ve tezgah çizgisini aşmaz (sabit piksel yok).
  const hud = layout._hud;
  const hudBottom = hud ? hud.y + hud.h : area.y;
  const w = S.w * 0.42;
  const x = S.x + S.w * 0.04;
  const y = Math.max(area.y, hudBottom + S.h * 0.014);
  const h = Math.min(S.h * 0.40, (layout._counterLine - y) * 0.94);
  layout.medulaCardRect = { x: x, y: y, w: w, h: h };
  const items = p.request.items;

  ctx.save();
  ctx.globalAlpha = a;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.28)"; ctx.shadowBlur = h * 0.05; ctx.shadowOffsetY = h * 0.015;
  fillRoundRect(x, y, w, h, Math.min(w, h) * 0.05, "#eef4ee");
  ctx.restore();
  strokeRoundRect(x, y, w, h, Math.min(w, h) * 0.05, "rgba(60, 120, 85, 0.55)", Math.max(1, w * 0.006));

  // sistem başlık şeridi (PC ekranıyla aynı dil)
  const barH = h * 0.13;
  ctx.save();
  roundRect(x, y, w, h, Math.min(w, h) * 0.05); ctx.clip();
  ctx.fillStyle = "rgba(38, 74, 54, 0.95)";
  ctx.fillRect(x, y, w, barH);
  ctx.restore();
  fitText("MEDULA KAYDI", x + w * 0.5, y + barH * 0.5, w * 0.8, barH * 0.44, "#d8f0e0", "center", "800");

  const padX = w * 0.09;
  fitText(p.request.code, x + w / 2, y + barH + h * 0.075, w * 0.7, h * 0.058, "#2e7d32", "center", "800");

  const listTop = y + barH + h * 0.14;
  const lineH = Math.min(h * 0.13, (y + h - h * 0.06 - listTop) / Math.max(1, items.length));
  const fs = Math.min(lineH * 0.55, h * 0.062);
  const qtyW = (w - padX * 2) * 0.20;
  let ly = listTop + lineH * 0.5;
  for (const it of items) {
    const m = getMedicine(it.id);
    const dotR = fs * 0.36;
    ctx.beginPath();
    ctx.arc(x + padX + dotR, ly, dotR, 0, Math.PI * 2);
    ctx.fillStyle = m.color; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.18)"; ctx.lineWidth = 1; ctx.stroke();
    fitText("× " + it.qty, x + w - padX, ly, qtyW, fs, "#2c3a2c", "right", "800");
    const nameX = x + padX + dotR * 2 + fs * 0.5;
    fitText(m.name, nameX, ly, (x + w - padX) - qtyW - fs * 0.5 - nameX, fs, "#2c3a2c", "left", "600");
    ly += lineH;
  }
  ctx.restore();
}

// semptom balonu içeriği — açık zemin üstüne koyu mürekkep
// Semptom balonu: üstte istenen kalemlerin emojileri (adet 2 ise ×2 rozeti — reçete
// kağıdındaki "× N" diliyle aynı), altta doğal Türkçe cümle (gerekirse iki satır).
function drawSymptom(request, x, y, w, h) {
  const ink = "#3a3326";
  const items = request.items || [{ symptom: request.symptom, qty: 1 }];

  // --- emoji satırı ---
  const eSize = h * (items.length >= 3 ? 0.30 : items.length === 2 ? 0.34 : 0.40);
  const eGap = eSize * 0.55;
  const cellW = [];
  ctx.font = "400 " + eSize + "px " + RX_FONT;
  for (const it of items) {
    const badge = it.qty > 1 ? eSize * 0.62 : 0;
    cellW.push(eSize * 1.05 + badge);
  }
  let totalW = cellW.reduce((a, b) => a + b, 0) + eGap * (items.length - 1);
  const maxRowW = w * 0.88;
  let scale = totalW > maxRowW ? maxRowW / totalW : 1;
  const eY = y + h * 0.34;
  let ex = x + (w - totalW * scale) / 2;
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const es = eSize * scale;
    drawEmoji(it.symptom.emoji, ex + es * 0.525, eY, es, "#000");
    if (it.qty > 1) {
      fitText("×" + it.qty, ex + es * 1.05 + es * 0.30, eY + es * 0.08, es * 0.62, es * 0.46,
        "#7a3a2a", "center", "800");
    }
    ex += cellW[i] * scale + eGap * scale;
  }

  // --- cümle (tek satıra sığmazsa ikiye böl) ---
  const txt = request.line || (items[0].symptom.label);
  const fs = h * 0.145;
  const maxW = w * 0.90;
  ctx.font = "700 " + fs + "px " + RX_FONT;
  if (ctx.measureText(txt).width <= maxW) {
    fitText(txt, x + w / 2, y + h * 0.78, maxW, fs, ink, "center", "700");
  } else {
    // boşluklardan ortaya en yakın yerde böl
    const words = txt.split(" ");
    let best = 1, bestDiff = Infinity;
    for (let i = 1; i < words.length; i++) {
      const a = words.slice(0, i).join(" "), b = words.slice(i).join(" ");
      const d = Math.abs(ctx.measureText(a).width - ctx.measureText(b).width);
      if (d < bestDiff) { bestDiff = d; best = i; }
    }
    const l1 = words.slice(0, best).join(" "), l2 = words.slice(best).join(" ");
    fitText(l1, x + w / 2, y + h * 0.70, maxW, fs * 0.92, ink, "center", "700");
    fitText(l2, x + w / 2, y + h * 0.87, maxW, fs * 0.92, ink, "center", "700");
  }
}

// Sekme içeriğini (emoji + metin, bir grup olarak) kutunun yatay/dikey TAM ortasına çiz.
// Emoji'nin advance'ı yanlış ölçüldüğü için sabit bir emoji genişliği varsayıp grubu elle ortalar.
function drawTabLabel(emoji, label, cx, cy, maxW, fs, color, weight) {
  let s = fs, emojiW, gapE, textW, total;
  const measure = () => {
    ctx.font = weight + " " + s + "px " + RX_FONT;
    textW = ctx.measureText(label).width;    // düz metin doğru ölçülür
    const em = emojiMetrics(emoji, s, "400");
    emojiW = em && em.w > 0 ? em.w : s * 1.05;   // ÖLÇÜLEN genişlik (tahmin değil)
    gapE = s * 0.28;
    total = emojiW + gapE + textW;
  };
  measure();
  while (s > 7 && total > maxW) { s -= 0.5; measure(); }  // sığmazsa küçült

  const startX = cx - total / 2;             // grubu yatayda ortala
  // emoji kendi ölçülen kutusunun merkezine hizalanır; etiket normal metin akışında
  drawEmoji(emoji, startX + emojiW / 2, cy, emojiW, color, "400");
  ctx.fillStyle = color;
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.font = weight + " " + s + "px " + RX_FONT;
  ctx.fillText(label, startX + emojiW + gapE, cy);
}

// kategori sekmeleri (yatay, kaydırılabilir; aktif sekme amber vurgulu)
function drawTabs() {
  const ta = layout.tabsArea;
  if (!ta || !layout.tabs) return;
  const c = CONFIG.colors;
  ctx.save();
  ctx.beginPath();
  ctx.rect(ta.x, ta.y, ta.w, ta.h);
  ctx.clip();
  const gap = ta.h * 0.22;
  const off = layout.tabsOffset || 0;
  for (const t of layout.tabs) {
    const sx = ta.x + off + t.x - (layout.tabScroll || 0);
    const bw = t.w - gap;                              // buton genişliği (boşluk hariç)
    if (sx + bw < ta.x || sx > ta.x + ta.w) continue;  // görünmeyen sekmeyi atla
    const active = t.group.id === game.activeGroup;
    const r = ta.h * 0.28;
    const maxTextW = bw * 0.86;                         // içerik butona sığsın (taşma yok)
    const cx = sx + bw / 2, cy = ta.y + ta.h / 2;
    if (active) {
      ctx.save();
      ctx.shadowColor = c.neonGlow;
      ctx.shadowBlur = 10;
      fillRoundRect(sx, ta.y, bw, ta.h, r, "rgba(58,40,20,0.95)");
      ctx.restore();
      strokeRoundRect(sx, ta.y, bw, ta.h, r, c.neon, Math.max(1.5, ta.h * 0.04));
      fitText(t.group.label, cx, cy, maxTextW, ta.h * 0.36, c.neon, "center", "800");
    } else {
      fillRoundRect(sx, ta.y, bw, ta.h, r, "rgba(26,21,36,0.82)");
      strokeRoundRect(sx, ta.y, bw, ta.h, r, "rgba(245,170,70,0.25)", 1);
      fitText(t.group.label, cx, cy, maxTextW, ta.h * 0.34, c.creamSoft, "center", "700");
    }
  }
  ctx.restore();
  // kaydırılabilir olduğunu belli eden kenar gölgeleri
  if ((layout.tabsTotal || 0) > ta.w) {
    const fadeW = ta.w * 0.06;
    if ((layout.tabScroll || 0) > 1) {
      const gl = ctx.createLinearGradient(ta.x, 0, ta.x + fadeW, 0);
      gl.addColorStop(0, "rgba(20,15,26,0.9)"); gl.addColorStop(1, "rgba(20,15,26,0)");
      ctx.fillStyle = gl; ctx.fillRect(ta.x, ta.y, fadeW, ta.h);
    }
    if ((layout.tabScroll || 0) < layout.tabsTotal - ta.w - 1) {
      const gr = ctx.createLinearGradient(ta.x + ta.w - fadeW, 0, ta.x + ta.w, 0);
      gr.addColorStop(0, "rgba(20,15,26,0)"); gr.addColorStop(1, "rgba(20,15,26,0.9)");
      ctx.fillStyle = gr; ctx.fillRect(ta.x + ta.w - fadeW, ta.y, fadeW, ta.h);
    }
  }
}

// Büyük ilaç kartları (Büfeci kalıbı): krem opak kart + üstte büyük görsel (contain,
// oran korunur) + altta ad. Grid dikey kaydırılır; gridArea'ya kırpılır.
function drawShelf() {
  const area = layout.gridArea;
  if (!area) return;
  const disabled = !servingAllowed();
  const scroll = layout.shelfScroll || 0;
  ctx.save();
  ctx.beginPath();
  ctx.rect(area.x, area.y, area.w, area.h);
  ctx.clip();
  for (const btn of layout.shelfButtons) {
    const by = btn.y - scroll;
    if (by + btn.h < area.y || by > area.y + area.h) continue;   // görünmeyen kartı atla
    const m = getMedicine(btn.id);
    const stock = game.stock[btn.id] || 0;
    const out = stock <= 0;
    ctx.globalAlpha = out ? 0.45 : (disabled ? 0.6 : 1);

    // kart zemini — krem, OPAK (arka plan şeffaf, kartlar okunur)
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.25)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    fillRoundRect(btn.x, by, btn.w, btn.h, btn.w * 0.10, "#f2e8d4");
    ctx.restore();
    strokeRoundRect(btn.x, by, btn.w, btn.h, btn.w * 0.10, "rgba(120,90,50,0.45)", Math.max(1.5, btn.w * 0.012));

    // ilaç görseli — kartın üst kısmı, büyük, EN-BOY ORANI KORUNUR (contain)
    const imgPad = btn.w * 0.07;
    const ix = btn.x + imgPad, iy = by + imgPad;
    const iw = btn.w - imgPad * 2, ih = btn.h * 0.64;
    Sprite.draw(ctx, m.assetKey, ix, iy, iw, ih, () => {
      // fallback (görselsiz ilaçlar): renkli yumuşak kutu + emoji
      fillRoundRect(ix, iy, iw, ih, iw * 0.16, m.color);
      drawEmoji(m.emoji, ix + iw / 2, iy + ih / 2, ih * 0.55, "#000");
    }, "contain");

    // ad — kartın altında, koyu mürekkep
    fitText(m.name, btn.x + btn.w / 2, by + btn.h * 0.84, btn.w * 0.86, btn.h * 0.135, "#3a2f20", "center", "800");
    ctx.globalAlpha = 1;

    // --- stok overlay ---
    if (out) {
      const lh = btn.h * 0.17;
      const ly = by + btn.h * 0.38;
      fillRoundRect(btn.x + btn.w * 0.10, ly, btn.w * 0.80, lh, lh * 0.4, "rgba(20,16,28,0.80)");
      text("TÜKENDİ", btn.x + btn.w / 2, ly + lh / 2, lh * 0.55, "rgba(230,215,200,0.95)", "center", "800");
    } else {
      // sağ-üst stok rozeti (kart boyutuna göre daha okunur)
      const br = btn.w * 0.115;
      const bx = btn.x + btn.w - br * 0.9;
      const bcy = by + br * 0.9;
      ctx.beginPath(); ctx.arc(bx, bcy, br, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(20,16,28,0.85)"; ctx.fill();
      ctx.strokeStyle = CONFIG.colors.panelBorder; ctx.lineWidth = Math.max(1, br * 0.12);
      ctx.beginPath(); ctx.arc(bx, bcy, br, 0, Math.PI * 2); ctx.stroke();
      text(String(stock), bx, bcy, br * 1.0, "#f2e6d4", "center", "800");
    }
  }

  // retro scrollbar — SALT görsel gösterge (tıklama hedefi değil, rect kaydedilmez);
  // sadece içerik taşıyorsa görünür, grid clip'inin içinde kartların sağında
  if ((layout.shelfMaxScroll || 0) > 0) {
    const trackW = Math.max(3, area.w * 0.012);
    const tx = area.x + area.w - trackW;
    fillRoundRect(tx, area.y, trackW, area.h, trackW / 2, "rgba(20,16,28,0.45)");
    const contentH = area.h + layout.shelfMaxScroll;
    const thumbH = Math.max(area.h * 0.12, area.h * (area.h / contentH));
    const ty = area.y + (area.h - thumbH) * (scroll / layout.shelfMaxScroll);
    fillRoundRect(tx, ty, trackW, thumbH, trackW / 2, "rgba(255,157,47,0.75)");
  }
  ctx.restore();
}

// Ahşap tezgah bandı — müşteriyi göğüsten keser, üstüne seçilen ilaçlar dizilir.
function drawCounterBand() {
  const b = layout._band;
  if (!b) return;
  // karakterin alt kenarını hafifçe örtmek için bandı bir tık yukarıdan başlat
  const top = b.y - layout.stage.h * 0.006;
  const bandH = (b.y + b.h) - top;
  // counter.png varsa onu kullan (stage boyunca yatay bant, cover); yoksa kod gradyan
  Sprite.draw(ctx, "counter", b.x, top, b.w, bandH, () => {
    const bot = b.y + b.h;
    const g = ctx.createLinearGradient(0, top, 0, bot);
    g.addColorStop(0, "#9a6a40");
    g.addColorStop(0.10, "#85572f");
    g.addColorStop(0.5, "#6e4527");
    g.addColorStop(1, "#4f311d");
    ctx.fillStyle = g;
    ctx.fillRect(b.x, top, b.w, bot - top);
    ctx.fillStyle = "rgba(245, 200, 140, 0.55)";
    ctx.fillRect(b.x, top, b.w, Math.max(2, b.h * 0.05));
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(b.x, bot - b.h * 0.10, b.w, b.h * 0.10);
  }, "cover");
}

// Tezgah çizgisinin ALTINI temiz koyu zemine boyar — bg_pharmacy'nin kendi
// gömülü ahşap tezgahını gizler ki tek tezgah (counter.png) kalsın, grid
// ahşapsız temiz bir alanda dursun ("çift tezgah" görüntüsünü engeller).
function drawLowerBackdrop() {
  const S = layout.stage;
  const y0 = layout._counterLine;
  const y1 = S.y + S.h;
  // Bandın ahşap tonlarından türetilmiş OPAK zemin: bg_pharmacy'nin gömülü alt tezgahı
  // tamamen örtülür ("iki ayrı görüntü sıkışmış" hissi biter). Kartlar/sekmeler üstüne çizilir.
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, "#4f311d");      // banda yakın koyu ahşap (drawCounterBand alt tonu)
  g.addColorStop(0.4, "#3a2415");
  g.addColorStop(1, "#221610");      // alta doğru daha koyu/nötr
  ctx.fillStyle = g;
  ctx.fillRect(S.x, y0, S.w, y1 - y0);
  // hafif yatay ahşap doku çizgileri — SABİT aralık/alfa (frame'de random yok)
  ctx.fillStyle = "rgba(0,0,0,0.10)";
  const grain = S.h * 0.028;
  for (let gy = y0 + grain; gy < y1; gy += grain) {
    ctx.fillRect(S.x, gy, S.w, 1);
  }
}

function drawCounter() {
  const c = CONFIG.colors;
  const area = layout._counterArea;
  if (!area) return;

  // bg'nin gömülü tezgahını gizleyen temiz koyu zemin (tek tezgah için)
  drawLowerBackdrop();
  // tek ahşap bant (counter.png) — müşterinin önünde
  drawCounterBand();

  if (game.counter.length === 0) return;  // tezgah temiz kalsın
  for (const slot of layout.counterSlots) {
    const m = getMedicine(slot.id);
    // rozetler slot köşesine değil GERÇEK çizim dikdörtgenine bağlanır
    const R = counterItemRects(slot);
    // ilaç görseli — raftaki gibi şeffaf PNG, ama tezgahta taban hizalı (contain-bottom);
    // PNG yoksa renkli kutu + emoji (o zaman slotu doldurur, R.img de slot olur)
    Sprite.draw(ctx, m.assetKey, slot.x, slot.y, slot.w, slot.h, () => {
      ctx.save();
      ctx.shadowColor = c.panelShadow;
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 2;
      fillRoundRect(slot.x, slot.y, slot.w, slot.h, slot.w * 0.24, m.color);
      ctx.restore();
      drawEmoji(m.emoji, slot.x + slot.w / 2, slot.y + slot.h * 0.5, slot.w * 0.55, "#000");
    }, "contain-bottom");
    // kaldır işareti (görselin sol üst köşesi; sağ üst adet rozetine ayrıldı)
    text("✕", R.del.x, R.del.y, R.del.r * 1.2, "rgba(255,235,210,0.85)", "center", "800");
    // aynı ilaçtan 2+ varsa görselin sağ üst köşesinde adet rozeti
    if (slot.count >= 2) {
      const br = R.cnt.r;
      const bx = R.cnt.x, by = R.cnt.y;
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(20,16,28,0.88)"; ctx.fill();
      ctx.strokeStyle = c.panelBorder; ctx.lineWidth = Math.max(1, br * 0.10);
      ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.stroke();
      text("×" + slot.count, bx, by, br * 0.95, CONFIG.colors.neon, "center", "800");
    }
  }
}

// basit dolgu buton (onay/red için)
function drawSolidButton(b, label, fillCol, textCol, glowCol) {
  const r = b.h * 0.32;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.35)";
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 4;
  fillRoundRect(b.x, b.y, b.w, b.h, r, fillCol);
  ctx.restore();
  ctx.save();
  if (glowCol) { ctx.shadowColor = glowCol; ctx.shadowBlur = 14; }
  strokeRoundRect(b.x, b.y, b.w, b.h, r, textCol, Math.max(1.5, b.w * 0.008));
  text(label, b.x + b.w / 2, b.y + b.h / 2, b.h * 0.32, textCol, "center", "800");
  ctx.restore();
}

// reçete karar fazı: REDDET / ONAYLA butonları
function drawDecisionButtons() {
  drawSolidButton(layout.rejectBtn, "✕ REDDET", "rgba(40,18,18,0.92)", "#e8736b", "rgba(232,115,107,0.6)");
  drawSolidButton(layout.approveBtn, "✓ ONAYLA", "rgba(20,38,24,0.92)", "#5ec48a", "rgba(94,196,138,0.6)");
}

function drawServeButton() {
  const c = CONFIG.colors;
  const b = layout.serveBtn;
  const enabled = game.counter.length > 0 && servingAllowed();

  Sprite.draw(ctx, "btn_serve", b.x, b.y, b.w, b.h, () => {
    const r = b.h * 0.32;
    // koyu zemin
    ctx.save();
    ctx.shadowColor = c.panelShadow;
    ctx.shadowBlur = 14;
    ctx.shadowOffsetY = 5;
    fillRoundRect(b.x, b.y, b.w, b.h, r, c.btnDark);
    ctx.restore();

    // neon çerçeve + glow (aktifken nabız gibi parlar)
    ctx.save();
    if (enabled) {
      const pulse = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(game.clock * 4));
      ctx.shadowColor = c.neonGlow;
      ctx.shadowBlur = 22 * pulse;
    }
    strokeRoundRect(b.x, b.y, b.w, b.h, r, enabled ? c.neon : c.neonDim, Math.max(2, b.w * 0.006));
    ctx.restore();
  });

  // neon yazı (glow'lu)
  ctx.save();
  if (enabled) { ctx.shadowColor = c.neonGlow; ctx.shadowBlur = 16; }
  text("SERVİS ET", b.x + b.w / 2, b.y + b.h / 2, b.h * 0.34,
    enabled ? c.neon : c.neonDim, "center", "800");
