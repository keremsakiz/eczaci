// =====================================================================
//  EMOJİ ÇİZİMİ — gerçek glif kutusuna göre ortalama
// =====================================================================
// Sorun: ctx.textBaseline="middle" glifi FONTUN em kutusuna göre ortalar, glifin
// kendi kutusuna göre değil. Emoji glifleri arasında yükseklik/genişlik farkı olduğu
// için tek bir dikey ofset hepsine uymaz — kimi yukarı kimi aşağı kayar, kimi taşar.
// Çözüm: her emojiyi measureText'in actualBoundingBox* değerleriyle ölçüp GERÇEK
// çizim kutusunu bul, hedef kutuya sığdır ve o kutunun merkezine hizala.
// Emoji başına elle ofset tablosu YOK — ölçüm her glif için kendi kendine çalışır.
function emojiMetrics(ch, size, weight) {
  ctx.save();
  ctx.font = (weight || "400") + " " + size + "px " + RX_FONT;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  const m = ctx.measureText(ch);
  ctx.restore();
  const L = m.actualBoundingBoxLeft, R = m.actualBoundingBoxRight;
  const A = m.actualBoundingBoxAscent, D = m.actualBoundingBoxDescent;
  const has = [L, R, A, D].every(v => typeof v === "number" && isFinite(v));
  if (!has) return null;                      // tarayıcı desteklemiyorsa: eski yola düş
  return { left: L, right: R, asc: A, desc: D, w: L + R, h: A + D };
}

// Emojiyi (cx, cy) merkezli, kenarı `box` olan kareye sığdırarak çiz.
// Dönüş: gerçek çizim kutusu { x, y, w, h } (denetim için) ya da null.
function drawEmoji(ch, cx, cy, box, color, weight) {
  let size = box;
  let m = emojiMetrics(ch, size, weight);
  if (!m || !(m.w > 0) || !(m.h > 0)) {
    // ölçüm yoksa eski davranış (em kutusuna göre ortalama)
    text(ch, cx, cy, box * 0.92, color || "#000", "center", weight || "400");
    return null;
  }
  // taşıyorsa puntoyu kutuya sığacak orana çek (ölçüm punto ile doğrusal ölçeklenir)
  const over = Math.max(m.w / box, m.h / box);
  if (over > 1) { size = size / over; m = emojiMetrics(ch, size, weight) || m; }

  // glif kutusunun merkezi (cx, cy) olacak şekilde çizim noktası
  const drawX = cx - (m.right - m.left) / 2;
  const drawY = cy + (m.asc - m.desc) / 2;
  ctx.save();
  ctx.font = (weight || "400") + " " + size + "px " + RX_FONT;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.fillStyle = color || "#000";
  ctx.fillText(ch, drawX, drawY);
  ctx.restore();
  return { x: drawX - m.left, y: drawY - m.asc, w: m.w, h: m.h };
}

// Bir metni verilen maxW'ye sığacak şekilde küçülterek çiz (taşmayı önler).
const RX_FONT = "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
// Yazı tipi geçersiz kılma: bilgisayar ekranı çizilirken fitText / text / ellipsisText
// terminal fontuna (EczTerm) geçer. VT323'ün x-yüksekliği küçük → punto UI_FONT_K ile büyütülür.
let UI_FONT = null, UI_FONT_K = 1, UI_FONT_W = false;
function uiFont(weight, size) {
  if (!UI_FONT) return weight + " " + size + "px " + RX_FONT;
  // UI_FONT_W: fontun kendi kalınlıkları var (Zilla Slab 600/700) → istenen kalınlık eşlenir;
  // yoksa tek kalınlıklı terminal fontu (VT323) için 400.
  const w = UI_FONT_W ? ((+weight || 600) >= 700 ? "700" : "600") : "400";
  return w + " " + (size * UI_FONT_K) + "px " + UI_FONT;
}
// Kart ekranları (gün / sezon / kariyer sonu) ana ekranın dolap dilinde: ceviz + pirinç, Zilla Slab.
// Kart satırlarında SAYI: Zilla Slab'ın rakamları eski usul (0 → 'o' gibi) — değerler tabela fontuyla.
function cardNumFont(weight, size) {
  return UI_FONT_W ? "600 " + (size * 1.06) + "px " + SIGN_FONT : uiFont(weight, size);
}
function withCardFont(fn) {
  const a = UI_FONT, k = UI_FONT_K, w = UI_FONT_W;
  UI_FONT = SLAB_FONT; UI_FONT_K = 1.04; UI_FONT_W = true;
  try { fn(); } finally { UI_FONT = a; UI_FONT_K = k; UI_FONT_W = w; }
}
// Kartların mürekkebi: turuncu neon yerine pirinç sarısı, krem yerine eski kâğıt.
function cardColors() {
  return Object.assign({}, CONFIG.colors, {
    neon: "#f3cf7a", neonGlow: "rgba(255, 200, 110, 0.35)",
    cream: "#efe0bf", creamSoft: "#cdb68f"
  });
}
// Ceviz kart + pirinç çerçeve + üstte lake/pirinç başlık levhası. Başlık levhasının altını döndürür.
function cabinetCard(x, y, w, h, headerH, title, tone) {
  const b = woodPanel(x, y, w, h, false, Math.max(4, w * 0.018));
  // iç gölge: kartın ortası biraz daha koyu (okunurluk)
  ctx.save(); roundRect(x + b, y + b, w - b * 2, h - b * 2, 6); ctx.clip();
  const g = ctx.createRadialGradient(x + w / 2, y + h * 0.55, w * 0.1, x + w / 2, y + h * 0.55, w * 0.8);
  g.addColorStop(0, "rgba(20,10,4,0.30)"); g.addColorStop(1, "rgba(20,10,4,0)");
  ctx.fillStyle = g; ctx.fillRect(x, y, w, h); ctx.restore();
  // vidalar pirinç çerçevenin köşelerinde (uiScrews küçük butonlara göre ölçekli, kartta içeri kaçıyor)
  const sr = Math.max(1.6, b * 0.3), si = b * 0.5 + sr * 1.6;
  for (const [sx, sy] of [[x + si, y + si], [x + w - si, y + si], [x + si, y + h - si], [x + w - si, y + h - si]]) uiScrew(sx, sy, sr, true);
  const px = x + b * 3.2, pw = w - b * 6.4, py = y + b * 2.4, ph = Math.max(12, headerH - b * 2.2);
  if (tone === "navy") enamelPlate(px, py, pw, ph, "navy");        // gece: lacivert emaye levha
  else woodPanel(px, py, pw, ph, tone === "brass" ? true : tone, Math.max(3, ph * 0.09));
  const brass = tone === "brass";
  fitTextF(title, px + pw / 2, py + ph / 2 + ph * 0.02, pw * 0.84, ph * 0.5,
    brass ? "#3a2213" : "#fbe7a6", "center", "700", SLAB_FONT, brass ? "engrave" : "emboss");
  return py + ph;
}
function fitText(str, x, y, maxW, px, color, align, weight) {
  let s = px;
  const wgt = weight || "600";
  ctx.font = uiFont(wgt, s);
  while (s > 6 && ctx.measureText(str).width > maxW) {
    s -= 0.5;
    ctx.font = uiFont(wgt, s);
  }
  ctx.fillStyle = color;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  ctx.fillText(str, x, y);
  if (_crtAlerts) crtNote(str, x, y, color, s * UI_FONT_K);
  return s;
}

// --- CRT UYARILARI ---
// Fosfor filtresi her şeyi tek renk yeşile çeviriyor: kırmızı uyarılar (⛔ yetersiz bakiye,
// ⚠️ kod bulunamadı) koyu yeşile dönüp kayboluyordu. Tek renkli terminallerin çözümü:
// TERS VİDEO. PC çizilirken bu tür satırlar kaydedilir, filtreden SONRA parlak fosfor
// zemin + koyu yazı olarak yeniden basılır ve yavaşça yanıp söner.
let _crtAlerts = null;
function crtNote(str, x, y, color, size) {
  if (color !== CONFIG.colors.bad || !/^(⛔|⚠️)/.test(str)) return;
  _crtAlerts.push({ str: str.replace(/^(⛔|⚠️)\uFE0F?\s*/, ""), x, y, font: ctx.font, align: ctx.textAlign,
                    size, m: ctx.getTransform() });
}
function drawCrtAlerts(sc) {
  const list = _crtAlerts;
  _crtAlerts = null;
  if (!sc || !list || !list.length) return;
  const on = ((game.clock || 0) * 1.6) % 1 < 0.7;          // %70 ters video, %30 düz parlak
  ctx.save();
  roundRect(sc.x, sc.y, sc.w, sc.h, sc.r); ctx.clip();
  for (const a of list) {
    ctx.save();
    ctx.setTransform(a.m);
    ctx.font = a.font; ctx.textBaseline = "middle"; ctx.textAlign = a.align;
    const label = "!! " + a.str + " !!";
    const w = ctx.measureText(label).width, pad = a.size * 0.35, h = a.size * 1.25;
    const x0 = a.align === "center" ? a.x - w / 2 : a.align === "right" ? a.x - w : a.x;
    // alttaki sönük (filtrelenmiş) satırı ört
    ctx.fillStyle = on ? "#8dffb0" : "#041a0c";
    ctx.fillRect(x0 - pad, a.y - h / 2, w + pad * 2, h);
    if (on) { ctx.shadowColor = "rgba(141,255,176,0.8)"; ctx.shadowBlur = a.size * 0.6; ctx.fillRect(x0 - pad, a.y - h / 2, w + pad * 2, h); ctx.shadowBlur = 0; }
    ctx.fillStyle = on ? "#041a0c" : "#c8ffd8";
    if (!on) { ctx.shadowColor = "rgba(141,255,176,0.9)"; ctx.shadowBlur = a.size * 0.5; }
    ctx.fillText(label, a.x, a.y);
    ctx.restore();
  }
  ctx.restore();
}

// Metni SABİT puntoyla verilen genişliğe sığdır: taşarsa sonunu "…" ile kısalt.
// (fitText'in aksine font küçültmez; sütunlu listelerde satırlar aynı boyda kalır)
function ellipsisText(str, x, y, maxW, px, color, align, weight) {
  const wgt = weight || "600";
  ctx.font = uiFont(wgt, px);
  let s = str;
  if (ctx.measureText(s).width > maxW) {
    while (s.length > 1 && ctx.measureText(s + "…").width > maxW) s = s.slice(0, -1);
    s += "…";
  }
  ctx.fillStyle = color;
  ctx.textAlign = align || "left";
  ctx.textBaseline = "middle";
  ctx.fillText(s, x, y);
}

// Reçete kağıdı: kod ile çizilen DÜZ, temiz krem panel + dinamik içerik.
// Tüm içerik iç padding içinde kalır (taşma yok; gerekirse font küçülür).
// Sabit yükseklikli reçete kağıdı (krem zemin + dinamik içerik).
function drawPrescriptionPaper(p, cx, top, w, h, alpha) {
  const items = p.request.items;
  const x = cx - w / 2, y = top;
  const r = Math.min(w, h) * 0.05;
  ctx.save();
  ctx.globalAlpha = alpha;

  // kağıt zemini — krem + yumuşak gölge + ince kenar
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.28)";
  ctx.shadowBlur = h * 0.05;
  ctx.shadowOffsetY = h * 0.015;
  fillRoundRect(x, y, w, h, r, "#f6efdd");
  ctx.restore();
  strokeRoundRect(x, y, w, h, r, "rgba(120,90,50,0.35)", Math.max(1, w * 0.006));

  // içeriği kağıt iç alanına kırp
  const padX = w * 0.09, padY = h * 0.06;
  const lx = x + padX, rx = x + w - padX;
  const innerW = rx - lx;
  ctx.save();
  roundRect(x + w * 0.03, y + h * 0.03, w * 0.94, h * 0.94, r);
  ctx.clip();

  const ink = "#3a3326", inkSoft = "#8a7c5e";
  const req = p.request;


  // üst: kaşe (✚) + doktor adı + tarih
  const headY = y + padY + h * 0.045;
  // tarih — sahte/eski olsa da renkle ele vermez; oyuncu tarihi OKUYUP anlamalı
  fitText(req.date, rx, headY, innerW * 0.34, h * 0.05, inkSoft, "right", "600");
  // kaşe rozeti (gerçeklerde HER ZAMAN çizilir; no_stamp kusurunda HİÇ çizilmez)
  let docX = lx;
  if (req.hasStamp !== false) {
    const br = h * 0.052;
    const bx = lx + br, by = headY;
    ctx.save();
    ctx.strokeStyle = "#2e7d32"; ctx.lineWidth = Math.max(1.2, h * 0.006);
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    drawEmoji("✚", bx, by, br * 1.5, "#2e7d32", "800");
    docX = lx + br * 2 + w * 0.025;
  }
  fitText(req.doctor, docX, headY, (rx - innerW * 0.36) - docX, h * 0.052, ink, "left", "700");

  // ayraç
  ctx.strokeStyle = "rgba(120,90,50,0.35)";
  ctx.lineWidth = Math.max(1, h * 0.005);
  const sep1 = y + padY + h * 0.11;
  ctx.beginPath(); ctx.moveTo(lx, sep1); ctx.lineTo(rx, sep1); ctx.stroke();

  // orta: ilaç listesi (renk noktası + ad + adet)
  const listTop = sep1 + h * 0.03;
  const listBot = y + h - padY - h * 0.14;
  const lineH = Math.min(h * 0.13, (listBot - listTop) / Math.max(1, items.length));
  const fs = Math.min(lineH * 0.55, h * 0.062);
  const qtyW = innerW * 0.20;
  let ly = listTop + lineH * 0.5;
  for (const it of items) {
    const m = getMedicine(it.id);
    const dotR = fs * 0.36;
    ctx.beginPath();
    ctx.arc(lx + dotR, ly, dotR, 0, Math.PI * 2);
    ctx.fillStyle = m.color; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.18)"; ctx.lineWidth = 1; ctx.stroke();
    // adet renkle ele vermez; ×8/×10 yine yazılır ama normal renkte (oyuncu mantığı yakalar)
    fitText("× " + it.qty, rx, ly, qtyW, fs, ink, "right", "800");
    const nameX = lx + dotR * 2 + fs * 0.5;
    fitText(m.name, nameX, ly, rx - qtyW - fs * 0.5 - nameX, fs, ink, "left", "600");
    ly += lineH;
  }

  // alt: ince ayraç + küçük italik imza
  const sep2 = y + h - padY - h * 0.10;
  ctx.strokeStyle = "rgba(120,90,50,0.28)";
  ctx.lineWidth = Math.max(1, h * 0.004);
  ctx.beginPath(); ctx.moveTo(lx, sep2); ctx.lineTo(rx, sep2); ctx.stroke();

  // İmza: Kerem'in beğendiği iPad görüntüsündeki (iOS Snell Roundhand) bakır uçlu el yazısı —
  // her cihazda aynı görünsün diye onun açık kaynak benzeri gömülü: EczSig = Pinyon Script.
  // Türkçe harfler tam; SİYAH mürekkep.
  const SIG_FONT = "EczSig, 'Snell Roundhand', cursive";
  let sg = h * 0.078;
  ctx.font = "400 " + sg + "px " + SIG_FONT;
  while (sg > 7 && ctx.measureText(p.request.sig).width > innerW * 0.55) {
    sg -= 0.5;
    ctx.font = "400 " + sg + "px " + SIG_FONT;
  }
  ctx.fillStyle = "#111111";
  ctx.textAlign = "right"; ctx.textBaseline = "middle";
  ctx.fillText(p.request.sig, rx, sep2 + h * 0.055);

  ctx.restore();   // içerik kırpması
  ctx.restore();   // ana
}

// --- MEDULA: kod balonu ---
// Hasta kağıt uzatmaz; kodu söyler. Kod, hasta tezgahtayken HER AN okunabilir kalmalı —
// bu yüzden balon sahnenin SAĞ boşluğuna oturur (kayıt kartı solda, HUD üstte).
// Yerleşim sabit piksel değil: HUD'ın ALT SINIRI ve sahne genişliği üzerinden hesaplanır.
function medulaBubbleRect() {
  const S = layout.stage, area = layout._patientArea, hud = layout._hud;
  const hudBottom = hud ? hud.y + hud.h : area.y;
  const bubbleW = S.w * 0.42;                       // reçete balonuyla aynı genişlik
  // sağ boşluk: kayıt kartının sağ kenarının (S.w*0.46) sağında kal, sahne kenarına yaslan
  const bubbleX = Math.max(S.x + S.w * 0.55, S.x + S.w * 0.97 - bubbleW);
  const bubbleH = S.h * 0.115;
  const bubbleY = Math.max(area.y, hudBottom + S.h * 0.014);   // HUD'ın altında, nefes payıyla
  return { x: bubbleX, y: bubbleY, w: bubbleW, h: bubbleH };
}

function drawMedulaBubble(p) {
  const L = getPatientLayout(p.posCurrent);
  if (L.active < 0.12) return;
  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const a = L.active * (1 - Math.pow(1 - enter, 3));

  const r = medulaBubbleRect();
  layout.medulaBubbleRect = r;
  layout._talkRect = r;
  const tailX = clamp(L.cx, r.x + r.w * 0.12, r.x + r.w * 0.5);

  ctx.globalAlpha = a;
  drawSpeechBubble(r.x, r.y, r.w, r.h, tailX, r.y + r.h);
  // replik ikinci planda: küçük ve soluk
  fitText(p.line || "E-reçetem var.", r.x + r.w / 2, r.y + r.h * 0.21,
    r.w * 0.90, r.h * 0.155, "#6b5f4a", "center", "600");
  // KOD balonun en belirgin öğesi: geniş şerit + büyük punto
  const codeW = r.w * 0.84, codeH = r.h * 0.50;
  const codeX = r.x + (r.w - codeW) / 2, codeY = r.y + r.h * 0.40;
  fillRoundRect(codeX, codeY, codeW, codeH, codeH * 0.26, "rgba(38, 74, 54, 0.95)");
  strokeRoundRect(codeX, codeY, codeW, codeH, codeH * 0.26, "rgba(140, 220, 170, 0.75)", 2);
  fitText(p.request.code, codeX + codeW / 2, codeY + codeH / 2, codeW * 0.90, codeH * 0.66,
    "#d8f0e0", "center", "800");
  ctx.globalAlpha = 1;
}

// Sorgulanmış Medula kaydı — reçete panelinin yerinde, aynı ölçülerde kart.
function drawMedulaRecordPanel(p) {
  const S = layout.stage;
  const area = layout._patientArea;
  const L = getPatientLayout(p.posCurrent);
  if (L.active < 0.12) return;
  const enter = clamp(p.enterT / CONFIG.patientEnterTime, 0, 1);
  const a = L.active * (1 - Math.pow(1 - enter, 3));

  // Kart TAMAMEN HUD'ın altında kalır ve tezgah çizgisini aşmaz (sabit piksel yok).
  const hud = layout._hud;
  const hudBottom = hud ? hud.y + hud.h : area.y;
  const w = S.w * 0.42;
  const x = S.x + S.w * 0.04;
  const y = Math.max(area.y, hudBottom + S.h * 0.014);
  const h = Math.min(S.h * 0.40, (layout._counterLine - y) * 0.94);
  layout.medulaCardRect = { x: x, y: y, w: w, h: h };
  const items = p.request.items;

  ctx.save();
  ctx.globalAlpha = a;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.28)"; ctx.shadowBlur = h * 0.05; ctx.shadowOffsetY = h * 0.015;
  fillRoundRect(x, y, w, h, Math.min(w, h) * 0.05, "#eef4ee");
  ctx.restore();
  strokeRoundRect(x, y, w, h, Math.min(w, h) * 0.05, "rgba(60, 120, 85, 0.55)", Math.max(1, w * 0.006));

  // sistem başlık şeridi (PC ekranıyla aynı dil)
  const barH = h * 0.13;
  ctx.save();
  roundRect(x, y, w, h, Math.min(w, h) * 0.05); ctx.clip();
  ctx.fillStyle = "rgba(38, 74, 54, 0.95)";
  ctx.fillRect(x, y, w, barH);
  ctx.restore();
  fitText("MELUDA KAYDI", x + w * 0.5, y + barH * 0.5, w * 0.8, barH * 0.44, "#d8f0e0", "center", "800");

  const padX = w * 0.09;
  fitText(p.request.code, x + w / 2, y + barH + h * 0.075, w * 0.7, h * 0.058, "#2e7d32", "center", "800");

  const listTop = y + barH + h * 0.14;
  const lineH = Math.min(h * 0.13, (y + h - h * 0.06 - listTop) / Math.max(1, items.length));
  const fs = Math.min(lineH * 0.55, h * 0.062);
  const qtyW = (w - padX * 2) * 0.20;
  let ly = listTop + lineH * 0.5;
  for (const it of items) {
    const m = getMedicine(it.id);
    const dotR = fs * 0.36;
    ctx.beginPath();
    ctx.arc(x + padX + dotR, ly, dotR, 0, Math.PI * 2);
    ctx.fillStyle = m.color; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.18)"; ctx.lineWidth = 1; ctx.stroke();
    fitText("× " + it.qty, x + w - padX, ly, qtyW, fs, "#2c3a2c", "right", "800");
    const nameX = x + padX + dotR * 2 + fs * 0.5;
    fitText(m.name, nameX, ly, (x + w - padX) - qtyW - fs * 0.5 - nameX, fs, "#2c3a2c", "left", "600");
    ly += lineH;
  }
  ctx.restore();
}

// semptom balonu içeriği — açık zemin üstüne koyu mürekkep
// Semptom balonu: üstte istenen kalemlerin emojileri (adet 2 ise ×2 rozeti — reçete
// kağıdındaki "× N" diliyle aynı), altta doğal Türkçe cümle (gerekirse iki satır).
function drawSymptom(request, x, y, w, h, say) {
  const ink = "#3a3326";
  const items = request.items || [{ symptom: request.symptom, qty: 1 }];

  // --- emoji satırı ---
  const eSize = h * (items.length >= 3 ? 0.30 : items.length === 2 ? 0.34 : 0.40);
  const eGap = eSize * 0.55;
  const cellW = [];
  ctx.font = "400 " + eSize + "px " + RX_FONT;
  for (const it of items) {
    const badge = it.qty > 1 ? eSize * 0.62 : 0;
    cellW.push(eSize * 1.05 + badge);
  }
  let totalW = cellW.reduce((a, b) => a + b, 0) + eGap * (items.length - 1);
  const maxRowW = w * 0.88;
  let scale = totalW > maxRowW ? maxRowW / totalW : 1;
  const eY = y + h * 0.34;
  let ex = x + (w - totalW * scale) / 2;
  for (let i = 0; i < items.length; i++) {
    const it = items[i];
    const es = eSize * scale;
    drawEmoji(it.symptom.emoji, ex + es * 0.525, eY, es, "#000");
    if (it.qty > 1) {
      fitText("×" + it.qty, ex + es * 1.05 + es * 0.30, eY + es * 0.08, es * 0.62, es * 0.46,
        "#7a3a2a", "center", "800");
    }
    ex += cellW[i] * scale + eGap * scale;
  }

  // --- cümle (tek satıra sığmazsa ikiye böl) ---
  const txt = say || request.line || (items[0].symptom.label);   // say: müşterinin kendi ağzıyla (assignDialog)
  const fs = h * 0.145;
  const maxW = w * 0.90;
  ctx.font = "700 " + fs + "px " + RX_FONT;
  if (ctx.measureText(txt).width <= maxW) {
    fitText(txt, x + w / 2, y + h * 0.78, maxW, fs, ink, "center", "700");
  } else {
    // boşluklardan ortaya en yakın yerde böl
    const words = txt.split(" ");
    let best = 1, bestDiff = Infinity;
    for (let i = 1; i < words.length; i++) {
      const a = words.slice(0, i).join(" "), b = words.slice(i).join(" ");
      const d = Math.abs(ctx.measureText(a).width - ctx.measureText(b).width);
      if (d < bestDiff) { bestDiff = d; best = i; }
    }
    const l1 = words.slice(0, best).join(" "), l2 = words.slice(best).join(" ");
    fitText(l1, x + w / 2, y + h * 0.70, maxW, fs * 0.92, ink, "center", "700");
    fitText(l2, x + w / 2, y + h * 0.87, maxW, fs * 0.92, ink, "center", "700");
  }
}

// Sekme içeriğini (emoji + metin, bir grup olarak) kutunun yatay/dikey TAM ortasına çiz.
// Emoji'nin advance'ı yanlış ölçüldüğü için sabit bir emoji genişliği varsayıp grubu elle ortalar.
function drawTabLabel(emoji, label, cx, cy, maxW, fs, color, weight) {
  let s = fs, emojiW, gapE, textW, total;
  const measure = () => {
    ctx.font = uiFont(weight, s);
    textW = ctx.measureText(label).width;    // düz metin doğru ölçülür
    const em = emojiMetrics(emoji, s, "400");
    emojiW = em && em.w > 0 ? em.w : s * 1.05;   // ÖLÇÜLEN genişlik (tahmin değil)
    gapE = s * 0.28;
    total = emojiW + gapE + textW;
  };
  measure();
  while (s > 7 && total > maxW) { s -= 0.5; measure(); }  // sığmazsa küçült

  const startX = cx - total / 2;             // grubu yatayda ortala
  // emoji kendi ölçülen kutusunun merkezine hizalanır; etiket normal metin akışında
  drawEmoji(emoji, startX + emojiW / 2, cy, emojiW, color, "400");
  ctx.fillStyle = color;
  ctx.textBaseline = "middle";
  ctx.textAlign = "left";
  ctx.font = uiFont(weight, s);
  ctx.fillText(label, startX + emojiW + gapE, cy);
}

// kategori sekmeleri (yatay, kaydırılabilir; aktif sekme amber vurgulu)
function drawTabs() {
  const ta = layout.tabsArea;
  if (!ta || !layout.tabs) return;
  const c = CONFIG.colors;
  ctx.save();
  ctx.beginPath();
  ctx.rect(ta.x, ta.y, ta.w, ta.h);
  ctx.clip();
  const gap = ta.h * 0.22;
  const off = layout.tabsOffset || 0;
  for (const t of layout.tabs) {
    const sx = ta.x + off + t.x - (layout.tabScroll || 0);
    const bw = t.w - gap;                              // buton genişliği (boşluk hariç)
    if (sx + bw < ta.x || sx > ta.x + ta.w) continue;  // görünmeyen sekmeyi atla
    const active = t.group.id === game.activeGroup;
    const r = ta.h * 0.28;
    const maxTextW = bw * 0.86;                         // içerik butona sığsın (taşma yok)
    const cx = sx + bw / 2, cy = ta.y + ta.h / 2;
    // dolap çekmecesi etiketi gibi: seçili sekme PİRİNÇ plaka, diğerleri ceviz
    cabinetButton({ x: sx, y: ta.y, w: bw, h: ta.h }, t.group.label, active ? "brass" : "wood", { size: active ? 0.40 : 0.37 });
  }
  ctx.restore();
  // kaydırılabilir olduğunu belli eden kenar gölgeleri
  if ((layout.tabsTotal || 0) > ta.w) {
    const fadeW = ta.w * 0.06;
    if ((layout.tabScroll || 0) > 1) {
      const gl = ctx.createLinearGradient(ta.x, 0, ta.x + fadeW, 0);
      gl.addColorStop(0, "rgba(20,15,26,0.9)"); gl.addColorStop(1, "rgba(20,15,26,0)");
      ctx.fillStyle = gl; ctx.fillRect(ta.x, ta.y, fadeW, ta.h);
    }
    if ((layout.tabScroll || 0) < layout.tabsTotal - ta.w - 1) {
      const gr = ctx.createLinearGradient(ta.x + ta.w - fadeW, 0, ta.x + ta.w, 0);
      gr.addColorStop(0, "rgba(20,15,26,0)"); gr.addColorStop(1, "rgba(20,15,26,0.9)");
      ctx.fillStyle = gr; ctx.fillRect(ta.x + ta.w - fadeW, ta.y, fadeW, ta.h);
    }
  }
}

// Büyük ilaç kartları (Büfeci kalıbı): krem opak kart + üstte büyük görsel (contain,
// oran korunur) + altta ad. Grid dikey kaydırılır; gridArea'ya kırpılır.
function drawShelf() {
  const area = layout.gridArea;
  if (!area) return;
  const disabled = !servingAllowed();
  const scroll = layout.shelfScroll || 0;
  ctx.save();
  ctx.beginPath();
  ctx.rect(area.x, area.y, area.w, area.h);
  ctx.clip();
  for (const btn of layout.shelfButtons) {
    const by = btn.y - scroll;
    if (by + btn.h < area.y || by > area.y + area.h) continue;   // görünmeyen kartı atla
    const m = getMedicine(btn.id);
    const stock = game.stock[btn.id] || 0;
    const out = stock <= 0;
    ctx.globalAlpha = out ? 0.45 : (disabled ? 0.6 : 1);

    // kart zemini — krem, OPAK (arka plan şeffaf, kartlar okunur)
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.25)"; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2;
    fillRoundRect(btn.x, by, btn.w, btn.h, btn.w * 0.10, "#f2e8d4");
    ctx.restore();
    strokeRoundRect(btn.x, by, btn.w, btn.h, btn.w * 0.10, "rgba(120,90,50,0.45)", Math.max(1.5, btn.w * 0.012));

    // ilaç görseli — kartın üst kısmı, büyük, EN-BOY ORANI KORUNUR (contain)
    const imgPad = btn.w * 0.07;
    const ix = btn.x + imgPad, iy = by + imgPad;
    const iw = btn.w - imgPad * 2, ih = btn.h * 0.64;
    Sprite.draw(ctx, m.assetKey, ix, iy, iw, ih, () => {
      // fallback (görselsiz ilaçlar): renkli yumuşak kutu + emoji
      fillRoundRect(ix, iy, iw, ih, iw * 0.16, m.color);
      drawEmoji(m.emoji, ix + iw / 2, iy + ih / 2, ih * 0.55, "#000");
    }, "contain");

    // ad — kartın altında, koyu mürekkep
    fitText(m.name, btn.x + btn.w / 2, by + btn.h * 0.84, btn.w * 0.86, btn.h * 0.135, "#3a2f20", "center", "800");
    ctx.globalAlpha = 1;

    // --- stok overlay ---
    if (out) {
      const lh = btn.h * 0.17;
      const ly = by + btn.h * 0.38;
      fillRoundRect(btn.x + btn.w * 0.10, ly, btn.w * 0.80, lh, lh * 0.4, "rgba(20,16,28,0.80)");
      text("TÜKENDİ", btn.x + btn.w / 2, ly + lh / 2, lh * 0.55, "rgba(230,215,200,0.95)", "center", "800");
    } else {
      // sağ-üst stok rozeti (kart boyutuna göre daha okunur)
      const br = btn.w * 0.115;
      const bx = btn.x + btn.w - br * 0.9;
      const bcy = by + br * 0.9;
      ctx.beginPath(); ctx.arc(bx, bcy, br, 0, Math.PI * 2);
      ctx.fillStyle = "rgba(20,16,28,0.85)"; ctx.fill();
      ctx.strokeStyle = CONFIG.colors.panelBorder; ctx.lineWidth = Math.max(1, br * 0.12);
      ctx.beginPath(); ctx.arc(bx, bcy, br, 0, Math.PI * 2); ctx.stroke();
      text(String(stock), bx, bcy, br * 1.0, "#f2e6d4", "center", "800");
    }
  }

  // retro scrollbar — SALT görsel gösterge (tıklama hedefi değil, rect kaydedilmez);
  // sadece içerik taşıyorsa görünür, grid clip'inin içinde kartların sağında
  if ((layout.shelfMaxScroll || 0) > 0) {
    const trackW = Math.max(3, area.w * 0.012);
    const tx = area.x + area.w - trackW;
    fillRoundRect(tx, area.y, trackW, area.h, trackW / 2, "rgba(20,16,28,0.45)");
    const contentH = area.h + layout.shelfMaxScroll;
    const thumbH = Math.max(area.h * 0.12, area.h * (area.h / contentH));
    const ty = area.y + (area.h - thumbH) * (scroll / layout.shelfMaxScroll);
    fillRoundRect(tx, ty, trackW, thumbH, trackW / 2, "rgba(255,157,47,0.75)");
  }
  ctx.restore();
}

// Ahşap tezgah bandı — müşteriyi göğüsten keser, üstüne seçilen ilaçlar dizilir.
function drawCounterBand() {
  const b = layout._band;
  if (!b) return;
  // karakterin alt kenarını hafifçe örtmek için bandı bir tık yukarıdan başlat
  const top = b.y - layout.stage.h * 0.006;
  const bandH = (b.y + b.h) - top;
  // counter.png varsa onu kullan (stage boyunca yatay bant, cover); yoksa kod gradyan
  Sprite.draw(ctx, "counter", b.x, top, b.w, bandH, () => {
    const bot = b.y + b.h;
    const g = ctx.createLinearGradient(0, top, 0, bot);
    g.addColorStop(0, "#9a6a40");
    g.addColorStop(0.10, "#85572f");
    g.addColorStop(0.5, "#6e4527");
    g.addColorStop(1, "#4f311d");
    ctx.fillStyle = g;
    ctx.fillRect(b.x, top, b.w, bot - top);
    ctx.fillStyle = "rgba(245, 200, 140, 0.55)";
    ctx.fillRect(b.x, top, b.w, Math.max(2, b.h * 0.05));
    ctx.fillStyle = "rgba(0,0,0,0.25)";
    ctx.fillRect(b.x, bot - b.h * 0.10, b.w, b.h * 0.10);
  }, "cover");
}

// Tezgah çizgisinin ALTINI temiz koyu zemine boyar — bg_pharmacy'nin kendi
// gömülü ahşap tezgahını gizler ki tek tezgah (counter.png) kalsın, grid
// ahşapsız temiz bir alanda dursun ("çift tezgah" görüntüsünü engeller).
function drawLowerBackdrop() {
  const S = layout.stage;
  const y0 = layout._counterLine;
  const y1 = S.y + S.h;
  // Bandın ahşap tonlarından türetilmiş OPAK zemin: bg_pharmacy'nin gömülü alt tezgahı
  // tamamen örtülür ("iki ayrı görüntü sıkışmış" hissi biter). Kartlar/sekmeler üstüne çizilir.
  const g = ctx.createLinearGradient(0, y0, 0, y1);
  g.addColorStop(0, "#4f311d");      // banda yakın koyu ahşap (drawCounterBand alt tonu)
  g.addColorStop(0.4, "#3a2415");
  g.addColorStop(1, "#221610");      // alta doğru daha koyu/nötr
  ctx.fillStyle = g;
  ctx.fillRect(S.x, y0, S.w, y1 - y0);
  // hafif yatay ahşap doku çizgileri — SABİT aralık/alfa (frame'de random yok)
  ctx.fillStyle = "rgba(0,0,0,0.10)";
  const grain = S.h * 0.028;
  for (let gy = y0 + grain; gy < y1; gy += grain) {
    ctx.fillRect(S.x, gy, S.w, 1);
  }
}

function drawCounter() {
  // bg'nin gömülü tezgahını gizleyen temiz koyu zemin (tek tezgah için)
  drawLowerBackdrop();
  // tek ahşap bant (counter.png) — müşterinin önünde
  drawCounterBand();
  // Tezgah yüzeyi: defter (sol), PC (sağ). Ürün tepsisi yok (kalemler PC → SATIŞ ekranında).
  drawBagFly();
}

// SERVİS ET sonrası: dolu eczane poşeti tezgahtan hastaya doğru kayar. Yeni asset YOK —
// kağıt poşet gövdesi + katlanmış ağız + yeşil haç kodla çizilir.
function drawBagFly() {
  if (!game.bagAnim) return;
  const b = layout._band, S = layout.stage;
  if (!b) return;
  const t = clamp(game.bagAnim.t / CONFIG.bagFlyTime, 0, 1);
  const e = 1 - Math.pow(1 - t, 3);                 // ease-out: hızlı çıkış, yumuşak varış
  const w = S.w * 0.15, h = w * 1.25;
  // tezgah yüzeyinden hastanın göğüs hizasına: sağa değil YUKARI-ORTAYA doğru
  const x0 = b.x + b.w * 0.5 - w / 2, y0 = b.y + b.h * 0.10;
  const x1 = b.x + b.w * 0.5 - w / 2, y1 = b.y - S.h * 0.16;
  const x = lerp(x0, x1, e), y = lerp(y0, y1, e);
  const alpha = t < 0.75 ? 1 : 1 - (t - 0.75) / 0.25;   // varışta söner
  ctx.save();
  ctx.globalAlpha = alpha;
  drawGroundShadow(x + w / 2, y + h * 0.98, w * 0.42, h * 0.10);
  // gövde (kraft kağıt)
  fillRoundRect(x, y + h * 0.18, w, h * 0.82, w * 0.08, "#c9a06a");
  strokeRoundRect(x, y + h * 0.18, w, h * 0.82, w * 0.08, "rgba(90,60,30,0.55)", Math.max(1, w * 0.02));
  // katlanmış ağız
  fillRoundRect(x, y + h * 0.10, w, h * 0.16, w * 0.05, "#b98d58");
  // yan kat çizgisi (kağıt hissi)
  ctx.strokeStyle = "rgba(90,60,30,0.30)"; ctx.lineWidth = Math.max(1, w * 0.015);
  ctx.beginPath(); ctx.moveTo(x + w * 0.30, y + h * 0.26); ctx.lineTo(x + w * 0.30, y + h * 0.98); ctx.stroke();
  // yeşil haç
  const cx = x + w * 0.62, cy = y + h * 0.58, arm = w * 0.19, th = arm * 0.40;
  ctx.fillStyle = "#3f9c63";
  ctx.fillRect(cx - arm / 2, cy - th / 2, arm, th);
  ctx.fillRect(cx - th / 2, cy - arm / 2, th, arm);
  ctx.restore();
}

// Sepete eklenen ilacın karttan PC'ye uçuşu — dokunuşun kaydedildiğini gösteren
// kısa geri bildirim. Salt görsel: oyun durumuna hiç dokunmaz.
function drawFlyAnims() {
  if (!game.flyAnims.length) return;
  for (const f of game.flyAnims) {
    const t = clamp(f.t / CONFIG.flyTime, 0, 1);
    const e = 1 - Math.pow(1 - t, 2);
    const size = lerp(f.size, f.size * 0.35, e);
    const x = lerp(f.x0, f.x1, e);
    const y = lerp(f.y0, f.y1, e) - Math.sin(e * Math.PI) * layout.stage.h * 0.06;  // hafif kavis
    ctx.save();
    ctx.globalAlpha = 1 - t * 0.7;
    const m = getMedicine(f.id);
    if (m) Sprite.draw(ctx, m.assetKey, x - size / 2, y - size / 2, size, size, () => {
      fillRoundRect(x - size / 2, y - size / 2, size, size, size * 0.24, m.color);
      drawEmoji(m.emoji, x, y, size * 0.55, "#000");
    }, "contain");
    ctx.restore();
  }
}

// basit dolgu buton (onay/red için)
function drawSolidButton(b, label, fillCol, textCol, glowCol) {
  const r = b.h * 0.32;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.35)";
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 4;
  fillRoundRect(b.x, b.y, b.w, b.h, r, fillCol);
  ctx.restore();
  ctx.save();
  if (glowCol) { ctx.shadowColor = glowCol; ctx.shadowBlur = 14; }
  strokeRoundRect(b.x, b.y, b.w, b.h, r, textCol, Math.max(1.5, b.w * 0.008));
  text(label, b.x + b.w / 2, b.y + b.h / 2, b.h * 0.32, textCol, "center", "800");
  ctx.restore();
}

// Borcunu ödemeye gelen dilencinin şeridi: tek, tam genişlikte buton. Tutar butonun
// üstünde yazılı ki oyuncu neyi aldığını görsün.
function drawBeggarPayButton(p) {
  const b = layout.beggarPayBtn;
  if (!b) return;
  const amount = Math.max(0, Math.round(p.request.amount || 0));
  cabinetButton(b, "💵 ÖDEMEYİ AL", "green", { sub: "+" + formatMoney(amount), glint: true });
}

// Dilenci karar şeridi — reçetenin ikili şeridiyle aynı yerde, aynı buton dili, üç kolon.
// Her buton iki satır: üstte ne yapıldığı, altta bedeli (hangi ilaç / kaç ₺ / itibar).
// Pasif seçenek (stok yok, kasa boş) soluk çizilir ve layout'ta enabled:false alır.
function drawBeggarButtons() {
  const btns = layout.beggarBtns;
  if (!btns) return;
  const gift = beggarGiftMedicine();
  const canMoney = game.money >= CONFIG.beggarMoneyGive && CONFIG.beggarMoneyGive > 0;
  const spec = {
    med:   { on: !!gift,   top: "💊 İLAÇ VER", sub: gift ? gift.name : "stok yok", tone: "green" },
    money: { on: canMoney, top: "💵 PARA VER", sub: CONFIG.beggarMoneyGive + "₺",   tone: "brass" },
    no:    { on: true,     top: "✕ REDDET",   sub: "−" + CONFIG.beggarRepReject + " itibar", tone: "red" }
  };
  for (const b of btns) {
    const sp = spec[b.key];
    b.enabled = sp.on;
    cabinetButton(b, sp.top, sp.tone, { sub: sp.sub, disabled: !sp.on });
  }
}

// (KALDIRILDI) drawServeButton — alt şeritteki SERVİS ET butonu. Servis artık
// PC → SATIŞ ekranındaki butondan yapılıyor (drawSale).

function drawFeedback() {
  if (!game.feedback) return;
  const c = CONFIG.colors;
  const f = game.feedback;
  const S = layout.stage;

  const t = clamp(f.t / CONFIG.feedbackDuration, 0, 1);
  const pop = t < 0.25 ? (t / 0.25) : 1;
  const fade = t > 0.75 ? (1 - (t - 0.75) / 0.25) : 1;
  const scale = 0.7 + 0.3 * pop;

  ctx.save();
  ctx.globalAlpha = fade;
  const cx = S.x + S.w / 2;
  const cy = layout._patientArea.y + layout._patientArea.h * 0.58;
  ctx.translate(cx, cy);
  ctx.scale(scale, scale);
  ctx.translate(-cx, -cy);

  const boxW = S.w * 0.74;
  const boxH = S.h * 0.10;
  const col = f.ok ? c.good : c.bad;

  // yeşil / kırmızı lake levha (ONAYLA / REDDET butonlarıyla aynı dil)
  woodPanel(cx - boxW / 2, cy - boxH / 2, boxW, boxH, f.ok ? "green" : "red", Math.max(3, boxH * 0.08));
  uiScrews(cx - boxW / 2, cy - boxH / 2, boxW, boxH, Math.max(1.6, boxH * 0.04), true);
  fitTextF(f.text, cx, cy, boxW * 0.8, boxH * 0.32, "#fbeec4", "center", "700", SLAB_FONT, "emboss");
  ctx.restore();
}

// ---- Gün sonu özet kartı ----
// Kart yüksekliği İÇERİKTEN hesaplanır (başlık + satırlar + rozet + butonlar + boşluklar).
// Sıkışıklık boşlukla çözülür, punto küçültülmez; taşma olursa yalnız alt boşluktan kırpılır.
function drawDayEnd() {
  const w = layout.w, h = layout.h, c = cardColors();
  const S = layout.stage;
  const s = game.dayStats;
  const res = game.dayResult || { goal: goalForDay(), met: s.money >= goalForDay(), repGain: 0 };

  // tüm ekranı karart
  ctx.fillStyle = "rgba(10, 8, 16, 0.55)";
  ctx.fillRect(0, 0, w, h);

  // --- içerik ölçüleri (puntolar eski kartla aynı ya da daha büyük) ---
  const fs = S.h * 0.028;             // istatistik satırı puntosu
  const rowStep = fs * 2.1;           // satır aralığı (≥ 1.8× punto)
  const gap = rowStep * 0.5;          // blok arası nefes payı (rozet/buton/pill)
  const headerH = fs * 3.0;           // amber başlık şeridi
  const padTop = rowStep * 0.8;
  const goalH = fs * 1.8;
  const btnH = fs * 2.2;
  const pillH = fs * 1.3;
  let padBottom = rowStep * 0.6;
  const wasNight = !!(game.daySchedule && game.daySchedule.day === game.dayNumber && game.daySchedule.isNight);
  const nextIsNight = isNightDutyDay(game.dayNumber + 1);
  const accrued = Math.round(s.medulaAccrued || 0);
  const collected = Math.round(game.collectedToday || 0);
  const nRows = 5 + (wasNight ? 2 : 0) + (collected > 0 ? 1 : 0) + (accrued > 0 ? 1 : 0);
  const warnH = nextIsNight ? fs * 1.5 : 0;        // "yarın nöbetçisin" uyarı şeridi
  const warnGap = nextIsNight ? gap * 0.7 : 0;
  // BİR GÜN ÖNCEDEN FİYAT HABERİ — sistemin şartı. Haber olmasa oyuncu fiyat turunu
  // ancak olduktan sonra görür ve kâr karardan değil şanstan gelir. Yalnız YÖN verilir.
  const nextRound = priceRoundOn(game.dayNumber + 1);
  const priceH = nextRound ? fs * 2.5 : 0;         // iki satırlı şerit (başlık + kategoriler)
  const priceGap = nextRound ? gap * 0.7 : 0;
  // Hedef şeridi: tutan günde ödül, kaçıran günde durum. Kaçıran gün de GÖSTERİLİR —
  // ceza sessiz olursa oyuncu kuralı hiç öğrenemez; bedava olan ilk gün de yazılır ki
  // "bir gün serbest, üst üstesi pahalı" kuralı kartın kendisinden okunsun.
  const showRep = true;
  const repH = fs * 1.5;
  const repGap = gap * 0.7;
  const stackH = () => headerH + padTop + nRows * rowStep + gap + goalH + repGap + repH +
    warnGap + warnH + priceGap + priceH + gap + btnH + gap + pillH + padBottom;
  let cardH = stackH();
  const maxH = S.h * 0.88;
  if (cardH > maxH) {                 // taşma: satır aralığından değil, alt boşluktan kırp
    padBottom = Math.max(gap * 0.4, padBottom - (cardH - maxH));
    cardH = stackH();
  }

  const cardW = S.w * 0.82;
  const cardX = S.x + (S.w - cardW) / 2;
  const cardY = S.y + (S.h - cardH) / 2;   // dikeyde ortalı
  const cr = cardW * 0.08;

  // ceviz kart + pirinç başlık levhası (ana ekranın dolap dili)
  cabinetCard(cardX, cardY, cardW, cardH, headerH,
    wasNight ? "Gün " + game.dayNumber + " + Nöbet Bitti" : "Gün " + game.dayNumber + " Bitti", "brass");

  // istatistik satırları
  const lx = cardX + cardW * 0.12;
  const rx = cardX + cardW * 0.88;
  let ly = cardY + headerH + padTop + rowStep * 0.5;
  const row = (icon, label, val) => {
    // emoji metin akışında değil, kendi kare kutusunda ortalanır (glif yüksekliği
    // farkları satırı kaydırmasın); etiket emojinin sağından başlar
    drawEmoji(icon, lx + fs * 0.5, ly, fs, c.cream);
    const labelX = lx + fs * 1.35;
    text(label, labelX, ly, fs, c.cream, "left", "600");
    // Uzun değer ("220₺ (gün 5)" gibi) sağa dayalı olduğu için etiketin ÜSTÜNE biniyordu.
    // Etiketin bittiği yerden sağa kalan boşluğa sığana kadar yalnız DEĞERİN puntosu kısılır;
    // kısa değerlerde hiç devreye girmez, diğer satırların yerleşimi değişmez.
    ctx.font = uiFont("600", fs);
    const avail = Math.max(fs * 2, rx - (labelX + ctx.measureText(label).width + fs * 0.5));
    let vs = fs;
    ctx.font = cardNumFont("800", vs);
    while (vs > fs * 0.55 && ctx.measureText(val).width > avail) {
      vs -= 0.5;
      ctx.font = cardNumFont("800", vs);
    }
    ctx.fillStyle = c.neon; ctx.textAlign = "right"; ctx.textBaseline = "middle"; ctx.font = cardNumFont("800", vs); ctx.fillText(val, rx, ly);
    ly += rowStep;
  };
  row("👥", "Servis edilen", String(s.served));
  row("✓", "Doğru", String(s.correct));
  row("✗", "Yanlış", String(s.wrong));
  row("😠", "Küsen müşteri", String(s.angry));
  if (wasNight) {
    row("☀️", "Gündüz kazancı", Math.round(s.moneyDay) + "₺");
    row("🌙", "Gece kazancı", Math.round(s.moneyNight) + "₺");
  }
  row("💰", "Günlük kazanç", s.money + "₺");
  if (collected > 0) row("🏦", "SGK ödemesi yattı", "+" + collected + "₺");
  if (accrued > 0) row("🧾", "SGK alacağı", accrued + "₺ (gün " + (game.dayNumber + CONFIG.medulaPayDelayDays) + ")");

  // hedef durumu rozeti
  const rowsBottom = cardY + headerH + padTop + nRows * rowStep;
  const goalY = rowsBottom + gap;
  const goalCol = res.met ? c.good : c.bad;
  const goalTxt = res.met
    ? "🎯 Hedef tuttu! (" + res.goal + "₺)"
    : "⚠️ Hedef tutmadı (" + res.goal + "₺)";
  fillRoundRect(cardX + cardW * 0.08, goalY, cardW * 0.84, goalH, goalH * 0.5,
    res.met ? "rgba(94,196,138,0.18)" : "rgba(232,115,107,0.18)");
  strokeRoundRect(cardX + cardW * 0.08, goalY, cardW * 0.84, goalH, goalH * 0.5, goalCol, 1.5);
  text(goalTxt, cardX + cardW / 2, goalY + goalH / 2, fs * 0.95, goalCol, "center", "800");

  // Hedef ödülü şeridi — oyuncu kuralı buradan öğrenir, gizli kalmasın
  if (showRep) {
    const rY = goalY + goalH + repGap;
    const loss = Math.round(res.repLoss || 0);
    const streak = res.missStreak || 0;
    const okStrip = !!res.met;
    const col = okStrip ? c.good : (loss > 0 ? c.bad : "#e0b062");
    const bg = okStrip ? "rgba(94,196,138,0.18)"
             : (loss > 0 ? "rgba(224,96,96,0.18)" : "rgba(224,176,98,0.16)");
    const txt = okStrip
      ? (res.repGain > 0 ? "⭐ Hedef tutturuldu · +" + (Math.round(res.repGain * 10) / 10) + " itibar"
                         : "⭐ Hedef tutturuldu · itibar tavanda")
      : (loss > 0 || res.moneyLoss ? "⚠️ Hedef kaçtı (üst üste " + streak + ". gün) · " +
            [loss > 0 ? "−" + loss + " itibar" : null,
             res.moneyLoss ? "−" + formatMoney(res.moneyLoss) : null].filter(Boolean).join(" · ")
                  : "⚠️ Hedef kaçtı — bu gün cezasız, üst üstesi pahalı");
    fillRoundRect(cardX + cardW * 0.08, rY, cardW * 0.84, repH, repH * 0.5, bg);
    strokeRoundRect(cardX + cardW * 0.08, rY, cardW * 0.84, repH, repH * 0.5, col, 1.5);
    fitText(txt, cardX + cardW / 2, rY + repH / 2, cardW * 0.78, fs * 0.88, col, "center", "800");
  }

  // "Yarın nöbetçisin" uyarısı — oyuncu depoya gidip hazırlanabilsin
  if (nextIsNight) {
    const wY = goalY + goalH + repGap + repH + warnGap;
    fillRoundRect(cardX + cardW * 0.08, wY, cardW * 0.84, warnH, warnH * 0.5, "rgba(90, 74, 150, 0.30)");
    strokeRoundRect(cardX + cardW * 0.08, wY, cardW * 0.84, warnH, warnH * 0.5, "rgba(160, 140, 235, 0.85)", 1.5);
    fitText("🌙 Yarın nöbetçisin — stoklarını kontrol et", cardX + cardW / 2, wY + warnH / 2,
      cardW * 0.78, fs * 0.88, "#d8ccff", "center", "800");
  }

  // "Yarın fiyatlar değişiyor" haberi — oyuncu BUGÜN depodan ucuz stok alabilsin.
  // Kesin tutar YOK, yalnız kategori + yön: karar hesaba değil öngörüye dayansın.
  if (nextRound) {
    const pY = goalY + goalH + repGap + repH + warnGap + warnH + priceGap;
    fillRoundRect(cardX + cardW * 0.08, pY, cardW * 0.84, priceH, priceH * 0.28, "rgba(150, 110, 40, 0.28)");
    strokeRoundRect(cardX + cardW * 0.08, pY, cardW * 0.84, priceH, priceH * 0.28, "rgba(245, 190, 90, 0.85)", 1.5);
    fitText("💱 Yarın alış fiyatları değişiyor", cardX + cardW / 2, pY + priceH * 0.32,
      cardW * 0.78, fs * 0.88, "#ffe0a8", "center", "800");
    fitText(priceRoundLabel(nextRound), cardX + cardW / 2, pY + priceH * 0.72,
      cardW * 0.78, fs * 0.95, c.neon, "center", "800");
  }

  // Sonraki Gün butonu (neon)
  const bW = cardW * 0.7;
  const bX = cardX + (cardW - bW) / 2;
  const bY = goalY + goalH + repGap + repH + warnGap + warnH + priceGap + priceH + gap;
  layout.nextDayBtn = { x: bX, y: bY, w: bW, h: btnH };
  cabinetButton(layout.nextDayBtn, "Sonraki Gün →", "red", { glint: true });

  // 📦 Depodan Sipariş — Sonraki Gün'ün altında soluk pill (aynı depo panelini açar)
  const dW = cardW * 0.62;
  const dX = cardX + (cardW - dW) / 2;
  const dY = bY + btnH + gap;
  layout.depotFromDayEndBtn = { x: dX, y: dY, w: dW, h: pillH };
  cabinetButton(layout.depotFromDayEndBtn, "📦 Depodan Sipariş", "wood", { size: 0.46 });
}

// =====================================================================
//  RADYO — tezgahta küçük, açılıp kapanan radyo
// =====================================================================
// Müzik DOSYASI YOK: Web Audio ile kodda üretilen sakin bir lo-fi döngü çalar (telif derdi
// yok, indirilecek asset yok, 0 KB). Radyo karakteri: bant geçiren filtre + açılışta kısa
// parazit. AudioContext ilk dokunuşta kurulur — iOS sesi ancak kullanıcı dokunuşuyla başlatır.
// Menüdeyken ve uygulama arka plandayken susar; oyuna dönünce kaldığı yerden devam eder.
// Not: iOS'ta telefonun sessiz anahtarı açıksa Web Audio da susar (Capacitor'da ses oturumu
// ayarıyla değiştirilebilir — şimdilik dokunulmadı).

// 8 ölçülük döngü, dört akor: Am9 – Dm9 – G13 – Cmaj9. Akor sesleri yakın dizili (ses yürüyüşü
// yumuşak): her geçişte tek-iki nota yarım/tam ses kayar.
// Katmanlar frekansta ayrık tutuldu (telefon hoparlörü 200 Hz altını zaten vermez):
// bas ~100-150 Hz, piyano ~330-660 Hz, melodi ~0.9-1.6 kHz, zil ~4 kHz.
const RADIO_SONG = {
  bpm: 74,
  chords: [
    { bass: 45, notes: [67, 71, 72, 76] },   // Am9   (G B C E, kök basta)
    { bass: 50, notes: [65, 69, 72, 76] },   // Dm9   (F A C E)
    { bass: 43, notes: [65, 69, 71, 76] },   // G13   (F A B E)
    { bass: 48, notes: [64, 67, 71, 74] }    // Cmaj9 (E G B D)
  ],
  scale: [81, 84, 86, 88, 91, 93],            // La minör pentatonik (melodi, piyanonun üstünde)
  station: "ECZA FM"
};
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);

// Ses grafiği: kanallar → (melodi yankısı) → radyo filtresi → sıkıştırıcı → ana ses.
// Canlı radyo da, önizleme betiği de (OfflineAudioContext) AYNI grafiği kurar.
function radioBuildGraph(ac, dest) {
  const g = {};
  g.master = ac.createGain(); g.master.gain.value = 0;
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -16; comp.ratio.value = 3; comp.attack.value = 0.01; comp.release.value = 0.2;
  const hp = ac.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 140;
  const lp = ac.createBiquadFilter(); lp.type = "lowpass";  lp.frequency.value = 6500; lp.Q.value = 0.5;
  g.bus = ac.createGain(); g.bus.gain.value = 1;
  // MÜZİK KISMA (reklam arası): bütün müzik g.duck'tan geçer; spiker sesi (g.voice) geçmez.
  g.duck = ac.createGain(); g.duck.gain.value = 1;
  g.voice = ac.createGain(); g.voice.gain.value = 1.0;
  g.bus.connect(hp); hp.connect(lp); lp.connect(g.duck); g.duck.connect(comp);
  g.voice.connect(comp); comp.connect(g.master); g.master.connect(dest);
  // Hazır şarkı dosyaları (istasyon "file") dar radyo bandını ATLAR: üretilmiş bir parçayı
  // 140 Hz–6,5 kHz'e sıkıştırmak onu boğuyordu. Yalnız hafif bir tepe kesimi + aynı sıkıştırıcı.
  g.fileIn = ac.createGain(); g.fileIn.gain.value = 1;
  const flp = ac.createBiquadFilter(); flp.type = "lowpass"; flp.frequency.value = 12000; flp.Q.value = 0.5;
  g.fileIn.connect(flp); flp.connect(g.duck);
  // piyano kanalı biraz yumuşak
  g.keys = ac.createBiquadFilter(); g.keys.type = "lowpass"; g.keys.frequency.value = 3200;
  g.keys.connect(g.bus);
  // melodi: hafif yankı (lo-fi hissi)
  g.mel = ac.createGain(); g.mel.gain.value = 1;
  const dly = ac.createDelay(1.0); dly.delayTime.value = 60 / RADIO_SONG.bpm * 0.75;
  const fb = ac.createGain(); fb.gain.value = 0.32;
  const wet = ac.createGain(); wet.gain.value = 0.30;
  g.mel.connect(g.bus); g.mel.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(wet); wet.connect(g.bus);
  // ELEKTRO SAZ kanalı: hafif doyum (tanh) + kısa "slapback" yankı — düğün sazı sesi
  g.saz = ac.createGain(); g.saz.gain.value = 1;
  const shp = ac.createWaveShaper(), curve = new Float32Array(1024);
  for (let i = 0; i < curve.length; i++) { const v = i / 511.5 - 1; curve[i] = Math.tanh(v * 2.4) / Math.tanh(2.4); }
  shp.curve = curve;
  const sazHp = ac.createBiquadFilter(); sazHp.type = "highpass"; sazHp.frequency.value = 170;
  const slap = ac.createDelay(0.5); slap.delayTime.value = 0.11;
  const slapFb = ac.createGain(); slapFb.gain.value = 0.18;
  const slapWet = ac.createGain(); slapWet.gain.value = 0.22;
  g.saz.connect(shp); shp.connect(sazHp); sazHp.connect(g.bus);
  sazHp.connect(slap); slap.connect(slapFb); slapFb.connect(slap); slap.connect(slapWet); slapWet.connect(g.bus);
  // Anadolu bası: testere dişi, alçak geçiren ile yuvarlatılmış
  g.abass = ac.createBiquadFilter(); g.abass.type = "lowpass"; g.abass.frequency.value = 900; g.abass.Q.value = 0.7;
  g.abass.connect(g.bus);
  g.ks = new Map();                             // saz tel sesleri önbelleği (nota → tampon)
  // gürültü tamponu (davul, cızırtı, parazit için) — bir kez üretilir
  const n = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  g.noise = n;
  // plak cızırtısı: seyrek tıkırtılar + çok hafif hışırtı, sürekli döngü
  const cb = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate), cd = cb.getChannelData(0);
  for (let i = 0; i < cd.length; i++) cd[i] = (Math.random() * 2 - 1) * 0.015;
  for (let k = 0; k < 26; k++) {
    const at = Math.floor(Math.random() * (cd.length - 60)), amp = 0.25 + Math.random() * 0.5;
    for (let j = 0; j < 40; j++) cd[at + j] += (Math.random() * 2 - 1) * amp * Math.exp(-j / 6);
  }
  g.crackle = ac.createBufferSource(); g.crackle.buffer = cb; g.crackle.loop = true;
  const cg = ac.createGain(); cg.gain.value = 0.05;
  g.crackle.connect(cg); cg.connect(g.bus);
  g.crackle.start();
  return g;
}

function radioVoice(ac, out, type, freq, t, dur, peak, decayTo) {
  const o = ac.createOscillator(), e = ac.createGain();
  o.type = type; o.frequency.value = freq;
  e.gain.setValueAtTime(0.0001, t);
  e.gain.exponentialRampToValueAtTime(peak, t + 0.008);
  e.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak * decayTo), t + Math.min(0.6, dur * 0.6));
  e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(e); e.connect(out);
  o.start(t); o.stop(t + dur + 0.02);
}
function radioNoiseHit(ac, g, t, type, freq, q, peak, dur) {
  const s = ac.createBufferSource(); s.buffer = g.noise;
  const f = ac.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const e = ac.createGain();
  e.gain.setValueAtTime(peak, t); e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  s.connect(f); f.connect(e); e.connect(g.bus);
  s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.02);
}

// Tek on altılık (16'lık) adımı zamanla. step: döngü başından beri geçen adım sayısı.
function radioScheduleLofi(ac, g, step, t) {
  const SONG = RADIO_SONG, sd = 60 / SONG.bpm / 4;          // bir 16'lık
  const bar = Math.floor(step / 16), s = step % 16;
  const ch = SONG.chords[bar % SONG.chords.length];
  const phrase = Math.floor(bar / 4) % 2;                   // 0: melodili, 1: seyrek
  const sw = (s % 4 === 2) ? sd * 0.34 : 0;                 // swing: arka 8'likler geç
  const tt = t + sw;

  // --- piyano (Rhodes benzeri: sinüs + oktav "tine" + üçgen gövde) ---
  if (s === 0 || s === 10) {
    const vel = s === 0 ? 1 : 0.55, dur = (s === 0 ? 10 : 6) * sd;
    ch.notes.forEach((m, i) => {
      const ts = t + i * 0.016, f = mtof(m) * (1 + (Math.random() - 0.5) * 0.003);
      radioVoice(ac, g.keys, "sine", f, ts, dur, 0.060 * vel, 0.35);
      radioVoice(ac, g.keys, "sine", f * 2, ts, dur * 0.5, 0.018 * vel, 0.1);
      radioVoice(ac, g.keys, "triangle", f, ts, dur, 0.016 * vel, 0.3);
    });
  }
  // --- bas ---
  const bassAt = { 0: [0, 7], 10: [0, 3], 14: [7, 2] };
  if (bassAt[s]) {
    const [iv, len] = bassAt[s];
    radioVoice(ac, g.bus, "triangle", mtof(ch.bass + iv), tt, len * sd, 0.17, 0.6);
    radioVoice(ac, g.bus, "sine", mtof(ch.bass + iv), tt, len * sd, 0.05, 0.6);
  }
  // --- davul (yumuşak boom-bap) ---
  if (s === 0 || s === 10 || (s === 7 && bar % 2 === 1)) {
    const o = ac.createOscillator(), e = ac.createGain();
    o.frequency.setValueAtTime(150, tt); o.frequency.exponentialRampToValueAtTime(58, tt + 0.10);
    e.gain.setValueAtTime(0.26, tt); e.gain.exponentialRampToValueAtTime(0.0001, tt + 0.24);
    o.connect(e); e.connect(g.bus); o.start(tt); o.stop(tt + 0.3);
  }
  if (s === 4 || s === 12) {
    radioNoiseHit(ac, g, tt, "bandpass", 1900, 0.7, 0.20, 0.16);
    radioVoice(ac, g.bus, "triangle", 190, tt, 0.08, 0.05, 0.2);
  }
  if (s % 2 === 0) radioNoiseHit(ac, g, tt, "bandpass", 4300, 1.1, s % 4 === 0 ? 0.13 : 0.075, 0.05);

  // --- melodi: pentatonik, yarı rastgele ama 8 ölçüde bir TEKRAR eder (besteli his) ---
  if (phrase === 0 && [0, 3, 6, 8, 11, 14].indexOf(s) >= 0) {
    const r = streetRand(bar % 4 * 31 + s + 900);
    if (r < 0.46) {
      const m = SONG.scale[Math.floor(streetRand(bar % 4 * 17 + s + 1300) * SONG.scale.length)];
      const len = (r < 0.18 ? 4 : 2) * sd;
      radioVoice(ac, g.mel, "sine", mtof(m), tt, len * 1.6, 0.034, 0.4);
      radioVoice(ac, g.mel, "triangle", mtof(m), tt, len, 0.008, 0.3);
    }
  }
}

// =====================================================================
//  ANADOLU FM — oynak 9/8 oyun havası (Ankara havası tadında)
// =====================================================================
// Elektro bağlama + darbuka + el çırpma + bas. Makam: La HİCAZ (A Bb C# D E F G) —
// Bb→C# artık ikilisi makamın imzası. Usul 9/8 = 2+2+2+3 ("düm-tek-düm-tek-tek").
// Saz sesi Karplus-Strong tel sentezi: gürültüyle vurulan, kendi kendine sönen tel;
// çift tel (hafif akort farkı) + oktav teli = bağlamanın çınlaması. Uzun notalar TEZENE
// TREMOLOSU ile, çeyrekler üstten ÇARPMA süsüyle çalınır.
const ANADOLU = {
  eighth: 0.128,                              // sekizlik ≈ 0,13 sn → ölçü ≈ 1,15 sn
  scale: [62, 64, 65, 67, 69, 70, 73, 74, 76, 77, 79, 81, 82, 85],
  // ölçüler: [konum (sekizlik), uzunluk (sekizlik), nota]
  bars: [
    [[0,2,76],[2,1,74],[3,1,73],[4,2,74],[6,1,73],[7,1,70],[8,1,69]],   // A1 — ana motif, iniş
    [[0,1,70],[1,1,73],[2,2,74],[4,2,76],[6,1,77],[7,1,76],[8,1,74]],   // A2 — Bb→C# sıçrayışı
    [[0,2,76],[2,1,74],[3,1,73],[4,2,74],[6,1,73],[7,1,70],[8,1,73]],   // A3
    [[0,4,69],[4,2,69],[6,1,67],[7,2,69]],                             // A4 — La'da karar
    [[0,1,81],[1,1,79],[2,1,77],[3,1,76],[4,2,77],[6,1,76],[7,1,74],[8,1,76]], // B1 — tizde coşku
    [[0,1,77],[1,1,76],[2,1,74],[3,1,73],[4,2,74],[6,1,73],[7,1,70],[8,1,73]], // B2
    [[0,1,74],[1,1,76],[2,1,77],[3,1,79],[4,2,81],[6,1,79],[7,1,77],[8,1,76]], // B3 — tırmanış
    [[0,1,74],[1,1,73],[2,1,70],[3,1,73],[4,5,69]]                     // B4 — karar
  ],
  roots: [45, 46, 45, 45, 50, 46, 43, 45],    // La, Si♭, La, La | Re, Si♭, Sol, La
  form: [0, 1, 2, 3, 0, 1, 2, 3, 4, 5, 6, 7, 0, 1, 2, 3]   // A A B A = 16 ölçü
};

// Karplus-Strong: bir kez hesaplanır, nota başına önbelleğe alınır.
// AKORT: tel döngüsünün gecikmesi tamsayı örnek olmak zorunda; tek hızda tizde 20+ sent
// sapıyordu (bas ile melodi ayrı düşer). Tel 4 kat örnekleme hızında sentezlenip ortalamayla
// indirilir → sapma en tizde bile ~5 sent. Filtre gecikmesi (OS·bright) de telafi edilir.
function sazBuffer(ac, g, midi) {
  if (g.ks.has(midi)) return g.ks.get(midi);
  const sr = ac.sampleRate, OS = 4, len = Math.floor(sr * 1.1), out = new Float32Array(len);
  const string = (freq, amp, damp, bright) => {
    const N = Math.max(8, Math.round(sr * OS / freq + OS * bright)), ring = new Float32Array(N);
    for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
    let idx = 0;
    for (let i = 0; i < len; i++) {
      let acc = 0;
      for (let k = 0; k < OS; k++) {
        const a = ring[idx], b = ring[(idx + OS) % N];
        acc += a;
        ring[idx] = damp * ((1 - bright) * a + bright * b);
        if (++idx === N) idx = 0;
      }
      out[i] += (acc / OS) * amp;
    }
  };
  const f = mtof(midi);
  string(f, 0.55, 0.9978, 0.38);             // ana tel
  string(f * 1.0035, 0.45, 0.9975, 0.40);    // eş tel (hafif akort farkı → çınlama)
  string(f * 2, 0.18, 0.9965, 0.45);         // oktav teli
  let peak = 0; for (let i = 0; i < len; i++) peak = Math.max(peak, Math.abs(out[i]));
  const buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = out[i] / (peak || 1);
  g.ks.set(midi, buf);
  return buf;
}
// İstasyon açılırken bütün saz notalarını önceden hazırla (çalarken hesap takılması olmasın).
function prepareAnadolu(ac, g) {
  const need = new Set();
  const sc = ANADOLU.scale;
  for (const bar of ANADOLU.bars) for (const [, , m] of bar) {
    need.add(m); need.add(sc[Math.min(sc.length - 1, sc.indexOf(m) + 1)]);
  }
  for (const r of ANADOLU.roots) { need.add(r + 12); need.add(r + 19); }
  for (const m of need) if (m) sazBuffer(ac, g, m);
}
function sazPluck(ac, g, midi, t, dur, vel) {
  const s = ac.createBufferSource(); s.buffer = sazBuffer(ac, g, midi);
  const e = ac.createGain();
  e.gain.setValueAtTime(vel, t);
  e.gain.setValueAtTime(vel, t + Math.max(0.01, dur - 0.02));
  e.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.04);
  s.connect(e); e.connect(g.saz);
  s.start(t); s.stop(t + dur + 0.06);
}
function darbuka(ac, g, t, kind, vel) {
  if (kind === "D") {                          // düm: tok, aşağı kayan
    const o = ac.createOscillator(), e = ac.createGain();
    o.frequency.setValueAtTime(140, t); o.frequency.exponentialRampToValueAtTime(78, t + 0.12);
    e.gain.setValueAtTime(0.42 * vel, t); e.gain.exponentialRampToValueAtTime(0.0001, t + 0.32);
    o.connect(e); e.connect(g.bus); o.start(t); o.stop(t + 0.34);
    radioVoice(ac, g.bus, "triangle", 210, t, 0.09, 0.07 * vel, 0.2);
  } else {                                     // tek / ka: çınlayan kenar vuruşu
    const hard = kind === "T";
    radioNoiseHit(ac, g, t, "bandpass", hard ? 3400 : 2500, 1.3, (hard ? 0.22 : 0.10) * vel, hard ? 0.06 : 0.04);
    radioVoice(ac, g.bus, "sine", hard ? 820 : 700, t, 0.05, (hard ? 0.10 : 0.04) * vel, 0.2);
  }
}
function handClap(ac, g, t, vel) {
  for (let k = 0; k < 3; k++) radioNoiseHit(ac, g, t + k * 0.011, "bandpass", 1350, 0.9, 0.12 * vel, 0.05 + k * 0.03);
}

function radioScheduleAnadolu(ac, g, step, t) {
  const A = ANADOLU, e8 = A.eighth;
  const barN = Math.floor(step / 9), pos = step % 9;
  const formI = barN % A.form.length, bi = A.form[formI];
  const bar = A.bars[bi], root = A.roots[bi];
  const fill = formI % 4 === 3;                // her dörtlünün sonunda darbuka dolgusu

  // --- darbuka: 9/8 "düm . tek . düm . tek tek tek" + yumuşak ka'lar ---
  const pat = { 0: "D", 2: "T", 4: "D", 6: "T", 7: "k", 8: "T" };
  if (pat[pos]) darbuka(ac, g, t, pat[pos], pat[pos] === "k" ? 0.8 : 1);
  else darbuka(ac, g, t, "k", 0.55);
  if (fill && pos >= 6) darbuka(ac, g, t + e8 * 0.5, "k", 0.7);   // "tırrr"
  // --- el çırpma (arka vuruşlar) + def zili ---
  if (pos === 2 || pos === 6) handClap(ac, g, t, 0.9);
  if (pos % 2 === 0 && pos < 8) radioNoiseHit(ac, g, t, "bandpass", 5200, 0.8, 0.035, 0.10);

  // --- bas: kök – beşli – kök – oktav – beşli (oynak yürüyüş) ---
  const bassAt = { 0: [0, 2], 4: [7, 2], 6: [0, 1], 7: [12, 1], 8: [7, 1] };
  if (bassAt[pos]) {
    const [iv, len] = bassAt[pos];
    radioVoice(ac, g.abass, "sawtooth", mtof(root + iv), t, len * e8 * 0.95, 0.10, 0.5);
    radioVoice(ac, g.bus, "triangle", mtof(root + iv), t, len * e8 * 0.95, 0.12, 0.5);
  }
  // --- ritim sazı: grup başlarında kısa tın-tın (kök + beşli, bir oktav yukarıda) ---
  if (pos === 2 || pos === 6) {
    sazPluck(ac, g, root + 12, t, 0.16, 0.16);
    sazPluck(ac, g, root + 19, t + 0.012, 0.16, 0.12);
  }

  // --- melodi: elektro bağlama ---
  for (const [p0, len, m] of bar) {
    if (p0 !== pos) continue;
    const dur = len * e8;
    if (len >= 3) {                            // tezene tremolosu
      for (let k = 0, tt = t; tt < t + dur - 0.02; k++, tt += 0.062) {
        sazPluck(ac, g, m, tt, 0.07, k % 2 ? 0.27 : 0.36);
      }
    } else {
      if (len === 2) {                         // çarpma: üst komşudan kısa süs
        const sc = A.scale, up = sc[Math.min(sc.length - 1, sc.indexOf(m) + 1)] || m + 1;
        sazPluck(ac, g, up, t - 0.034, 0.04, 0.26);
      }
      sazPluck(ac, g, m, t, Math.min(0.85, dur * 1.7), 0.40);
    }
    // B bölümünde bir oktav aşağıdan "org" eşlik (düğün klavyesi)
    if (bi >= 4) radioVoice(ac, g.keys, "square", mtof(m - 12), t, dur * 0.92, 0.018, 0.6);
  }
}

// Hazır şarkı dosyası yükleyici: radyo ilk açıldığında arka planda indirilip çözülür.
// Hazır değilken o istasyon kodla üretilen yedek şarkıyı çalar (sessizlik olmaz).
const RADIO_FILES = {};
const RADIO_FILE_STEP = 0.25;                   // dosya çalarken zamanlayıcının adımı (sn)
const RADIO_WAIT = 4;                           // dosya henüz çözülmediyse en fazla bu kadar parazitle bekle (sn)
// ID3v2 etiketini at: iOS'a aktarılan dosyalara masaüstü uygulaması 5,8 KB'lık bir C2PA
// (içerik kimliği) GEOB çerçevesi ekliyor; WebKit'in decodeAudioData'sı bu tür büyük etiketlerde
// çözümlemeden vazgeçebiliyor (simülatörde ANADOLU/COSMIC FM ve reklamlar sessizdi). MP3 çerçeveleri
// etiketten hemen sonra başlar — etiketi atmak sesi değiştirmez.
function stripId3(ab) {
  const u = new Uint8Array(ab);
  if (u.length > 10 && u[0] === 0x49 && u[1] === 0x44 && u[2] === 0x33) {
    const size = ((u[6] & 0x7f) << 21) | ((u[7] & 0x7f) << 14) | ((u[8] & 0x7f) << 7) | (u[9] & 0x7f);
    const off = 10 + size + ((u[5] & 0x10) ? 10 : 0);
    if (off < u.length - 1024) return ab.slice(off);
  }
  return ab;
}
// decodeAudioData'nın hem eski (geri çağrılı) hem yeni (Promise) Safari imzasıyla tek sonuç
function decodeAB(ac, ab) {
  return new Promise((res, rej) => {
    let done = false;
    const ok = b => { if (!done) { done = true; res(b); } };
    const bad = e => { if (!done) { done = true; rej(e || new Error("decode")); } };
    try { const pr = ac.decodeAudioData(ab, ok, bad); if (pr && typeof pr.then === "function") pr.then(ok, bad); }
    catch (e) { bad(e); }
  });
}
// iOS UYGULAMASINDA dosyalar <audio> öğesiyle çalınır. Tarayıcıda çalışan yol (fetch +
// decodeAudioData) iOS'un uygulama içi web görünümünde sessiz kalıyordu — kodla üretilen ECZA FM
// çalarken üç şarkı ve bütün reklamlar susuyordu. Açılış videosu aynı klasörden <video> ile sorunsuz
// oynadığı için şarkılar da aynı yoldan (medya öğesi) okunur; ses yine radyonun süzgecinden,
// kısma (reklam arası) ve açma/kapama geçişlerinden geçer (createMediaElementSource).
// Yan kazanç: şarkı belleğe çözülmez, akıtılır (≈ 0 MB yerine ≈ 40 MB).
// Süreler ölçüldü (ffprobe); öğenin kendi süresi gelince onunla güncellenir.
const RADIO_DUR = {
  "assets/radio_anadolu.mp3": 182.8, "assets/radio_cosmic.mp3": 34.04, "assets/radio_marsi.mp3": 117.0,
  "assets/ad_anadolu.mp3": 5.38, "assets/ad_cosmic.mp3": 4.05, "assets/ad_ecza.mp3": 5.54
};
function radioUseElement() {
  if (typeof window === "undefined") return false;
  if (window.__RADIO_ELEMENT) return true;                 // tarayıcıda denemek için
  const C = window.Capacitor;
  try { return !!(C && ((C.isNativePlatform && C.isNativePlatform()) || (C.getPlatform && C.getPlatform() !== "web"))); }
  catch (err) { return false; }
}
function radioLoadElement(url, e) {
  e.tries = (e.tries || 0) + 1; e.failed = false; e.loading = false;
  const el = new Audio();
  el.preload = "auto";
  el.setAttribute("playsinline", ""); el.setAttribute("webkit-playsinline", "");
  const buf = { el: el, entry: e, duration: RADIO_DUR[url] || 30 };
  el.addEventListener("loadedmetadata", () => { if (isFinite(el.duration) && el.duration > 0) buf.duration = el.duration; });
  el.addEventListener("error", () => {
    const code = el.error ? el.error.code : "?";
    e.error = "öğe hatası " + code; console.warn("[radyo] öğe yüklenemedi:", url, e.error);
    if (e.buf === buf) { e.buf = null; e.failed = true; }
  });
  el.src = url;
  try { el.load(); } catch (err) { /* bazı tarayıcılar gerektirmez */ }
  e.buf = buf;                                              // süre biliniyor: hemen hazır say
  return e;
}
// Öğeyi radyonun ses grafiğine BİR KEZ bağlar (createMediaElementSource her öğe için tek sefer).
// Bağlanamazsa öğe doğrudan çalar (süzgeçsiz ama sesli).
function radioElRoute(ac, e, dest) {
  if (e.routed) return;
  e.routed = true;
  try {
    const n = ac.createMediaElementSource(e.buf.el), gg = ac.createGain();
    n.connect(gg); gg.connect(dest);
    e.gain = gg;
  } catch (err) { e.gain = null; console.warn("[radyo] öğe grafiğe bağlanamadı, doğrudan çalınacak:", err && err.message); }
}
function radioElPlay(el, offset, e) {
  try { el.currentTime = Math.max(0, offset || 0); } catch (err) { /* meta gelmeden atlanamaz */ }
  let pr;
  try { pr = el.play(); } catch (err) { e.error = "play: " + (err && err.message); }
  if (pr && pr.catch) pr.catch(err => { e.error = "play: " + (err && (err.name || err.message)); console.warn("[radyo] çalınamadı:", e.error); });
}

function radioLoadFile(ac, url) {
  const e = RADIO_FILES[url] || (RADIO_FILES[url] = {});
  if (radioUseElement()) {
    if (!e.buf && !(e.failed && e.tries >= 2)) radioLoadElement(url, e);
    return e;
  }
  if (e.buf || e.loading || typeof fetch !== "function") return e;
  if (e.failed && e.tries >= 2) return e;          // iki kez olmadıysa bir daha zorlama
  e.loading = true; e.failed = false; e.tries = (e.tries || 0) + 1;
  // Önizleme sayfaları (artefakt) dosyayı base64 olarak gömebilir: orada fetch'i güvenlik
  // politikası engelleyebiliyor. Oyunun kendisinde bu yok, doğrudan dosyadan okunur.
  const emb = typeof window !== "undefined" && window.__RADIO_EMBED && window.__RADIO_EMBED[url];
  const bytes = emb
    ? Promise.resolve().then(() => { const b = atob(emb), u = new Uint8Array(b.length);
        for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u.buffer; })
    : radioFetchBytes(url);
  bytes
    .then(ab => {
      const orig = ab.slice(0);                      // decodeAudioData tamponu tüketir: yedek kopya
      return decodeAB(ac, stripId3(ab)).catch(err => {
        console.warn("[radyo] etiketsiz çözülemedi, özgün deneniyor:", url, err && (err.name || err.message));
        return decodeAB(ac, orig);
      });
    })
    .then(buf => { e.buf = buf; e.loading = false; })
    .catch(err => {
      e.failed = true; e.loading = false; e.error = String(err && (err.name || err.message) || err);
      console.warn("[radyo] dosya yüklenemedi:", url, e.error);
    });

}
// Radyo 24 kHz'te çalışır: dosya yolu 12 kHz'te, sentez 6,5 kHz'te alçak geçiren süzgeçten
// geçiyor → duyulur fark yok, ama çözülmüş şarkılar bellekte YARI yer kaplar.
function radioNewContext(AC) {
  try { return new AC({ sampleRate: 24000 }); } catch (e) { return new AC(); }
}
// Safari Web Inspector konsolunda teşhis: radyoDurum()
if (typeof window !== "undefined") window.radyoDurum = () => Object.entries(RADIO_FILES).map(([u, e]) =>
  u + " → " + (e.buf ? "hazır (" + e.buf.duration.toFixed(1) + " sn" + (e.buf.el ? ", öğe" + (e.gain ? "+grafik" : "") + (e.error ? ", " + e.error : "") : "") + ")" : e.loading ? "yükleniyor" : e.failed ? "HATA " + (e.error || "") : "?"));

// REKLAM ARASI: her şarkının 13. saniyesinde spiker müziği kısar, anonsu okur, müzik geri gelir.
// Anons dosyası kendi jingle'ını içerir (tools/make-ads.py). Oyun ve önizleme betiği AYNI işlevi kullanır.
// Ses dosyasını bayt olarak oku. Önce fetch; olmazsa (iOS WKWebView'in capacitor:// şemasında
// bazı sürümlerde fetch boş/hata dönüyor) XMLHttpRequest ile bir kez daha dene.
function radioFetchBytes(url) {
  const viaXhr = () => new Promise((res, rej) => {
    const x = new XMLHttpRequest();
    x.open("GET", url, true); x.responseType = "arraybuffer";
    x.onload = () => (x.status === 0 || (x.status >= 200 && x.status < 300)) && x.response && x.response.byteLength
      ? res(x.response) : rej(new Error("XHR " + x.status));
    x.onerror = () => rej(new Error("XHR ağ hatası"));
    x.send();
  });
  if (typeof fetch !== "function") return viaXhr();
  return fetch(url)
    .then(r => { if (!r.ok) throw new Error("HTTP " + r.status); return r.arrayBuffer(); })
    .then(ab => { if (!ab || !ab.byteLength) throw new Error("boş yanıt"); return ab; })
    .catch(err => { console.warn("[radyo] fetch olmadı, XHR deneniyor:", url, err && err.message); return viaXhr(); });
}

// iOS SES OTURUMU: WKWebView'de Web Audio varsayılan olarak "ambient" oturumda çalar → telefon
// SESSİZ MODDAYSA (yan tuş) ana ekran müziği, radyo ve tık sesleri HİÇ duyulmaz; açılış videosu
// ise duyulur (o ayrı oturum). Oyunun sesi açıkken "playback" isteriz: sessiz modda da çalar.
// Ses levhası ve radyo kapalıyken "ambient"e döner → oyuncunun Spotify'ı vb. kesilmez.
function iosAudioSession() {
  try {
    const as = typeof navigator !== "undefined" && navigator.audioSession;
    if (!as) return;
    const want = (MenuMusic.on || Radio.on) ? "playback" : "ambient";
    if (as.type !== want) as.type = want;
  } catch (e) { /* desteklenmiyor */ }
}

const RADIO_AD_AT = 13;                         // şarkının kaçıncı saniyesinde
const RADIO_DUCK = 0.22;                        // kısılan müzik düzeyi (≈ −13 dB)
function radioPlayAd(ac, g, buf, t) {
  g.duck.gain.cancelScheduledValues(t);
  g.duck.gain.setValueAtTime(1, t);
  g.duck.gain.linearRampToValueAtTime(RADIO_DUCK, t + 0.35);        // spiker müziği kısar…
  const t0 = t + 0.3, end = t0 + buf.duration;
  let s;
  if (buf.el) {                                                     // iOS: <audio> öğesi
    radioElRoute(ac, buf.entry, g.voice);
    const el = buf.el, h = setTimeout(() => radioElPlay(el, 0, buf.entry), Math.max(0, (t0 - ac.currentTime) * 1000));
    s = { stop() { clearTimeout(h); try { el.pause(); } catch (err) { /* durdu */ } } };
  } else {
    s = ac.createBufferSource(); s.buffer = buf; s.connect(g.voice);
    s.start(t0);
  }
  g.duck.gain.setValueAtTime(RADIO_DUCK, end - 0.15);
  g.duck.gain.linearRampToValueAtTime(1, end + 0.8);                // …anons bitince geri açar
  return s;
}

// Açılış paraziti: frekansı kayan bant geçiren gürültü (istasyon aranıyormuş gibi).
function radioTuneStatic(ac, g, t) {
  const s = ac.createBufferSource(); s.buffer = g.noise; s.loop = true;
  const f = ac.createBiquadFilter(); f.type = "bandpass"; f.Q.value = 1.4;
  f.frequency.setValueAtTime(700, t); f.frequency.exponentialRampToValueAtTime(2600, t + 0.45);
  const e = ac.createGain();
  e.gain.setValueAtTime(0.0001, t); e.gain.exponentialRampToValueAtTime(0.16, t + 0.05);
  e.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
  s.connect(f); f.connect(e); e.connect(ac.destination);
  s.start(t); s.stop(t + 0.6);
}

const Radio = {
  on: false,              // oyuncunun seçimi (profil kaydında kalıcı)
  station: -1,            // her AÇILIŞTA sıradaki istasyona geçilir; ilk açılış → 0
  toast: null,            // { text, t0 } — istasyon adı kısa süre radyonun yanında görünür
  needle: 0.2,            // kadran iğnesi (istasyona doğru kayar)
  running: false,         // ses gerçekten çalıyor mu
  ac: null, g: null, timer: null, step: 0, nextT: 0, token: 0,
  volume: 0.85,
  toggle() {
    this.on = !this.on;
    iosAudioSession();
    if (this.on) this.tuneTo((this.station + 1) % RADIO_STATIONS.length);
    this.sync(true);
    saveProfile();
  },
  mode: "synth",          // o anki istasyon: "file" (hazır şarkı) ya da "synth" (kodla üretilen)
  fileSteps: 0, src: null, fileStartPending: false,
  enterStation(ac, g, st) {
    const f = st.file ? RADIO_FILES[st.file] : null;
    if (f && !f.buf && !f.loading && f.failed && (f.tries || 0) < 2) radioLoadFile(ac, st.file);   // bir kez daha dene
    if (f && !f.buf && f.loading && !this.waitUntil) {
      // Dosya hâlâ çözülüyor (3 dk'lık şarkı iOS'ta birkaç saniye sürer): hemen yedeğe/atlamaya
      // geçme, en fazla RADIO_WAIT sn parazitle bekle. Eskiden COSMIC FM bu yüzden atlanıyordu.
      this.mode = "wait"; this.waitUntil = this.nextT + RADIO_WAIT;
      return;
    }
    this.waitUntil = 0;
    if (f && f.buf) {
      this.mode = "file";
      this.fileSteps = Math.ceil(f.buf.duration / RADIO_FILE_STEP);
      this.fileStartPending = true;
    } else if (!st.schedule) {
      this.mode = "skip";                                    // dosyası hazır değil, yedeği yok
    } else {
      this.mode = "synth";
      if (st.prepare) st.prepare(ac, g);
      g.bus.gain.setValueAtTime(st.gain, this.nextT);        // istasyonlar arası ses eşitliği
    }
  },
  playFile(ac, g, st, t, offset) {
    const buf = RADIO_FILES[st.file].buf;
    this.stopFile(t);
    if (buf.el) {                                                   // iOS: <audio> öğesi
      const e = RADIO_FILES[st.file], el = buf.el;
      radioElRoute(ac, e, g.fileIn);
      if (e.gain) e.gain.gain.value = st.fileGain;
      radioElPlay(el, Math.min(Math.max(0, offset), Math.max(0, buf.duration - 0.05)), e);
      this.src = { buffer: buf, stop() { try { el.pause(); } catch (err) { /* durdu */ } } };
      return;
    }
    const s = ac.createBufferSource(), gg = ac.createGain();
    s.buffer = buf; gg.gain.value = st.fileGain;
    s.connect(gg); gg.connect(g.fileIn);
    s.start(t, Math.min(Math.max(0, offset), Math.max(0, buf.duration - 0.05)));
    this.src = s;
  },
  stopFile(t) {
    if (!this.src) return;
    try { this.src.stop(t); } catch (e) { /* zaten durmuş */ }
    this.src = null;
  },
  adDone: false, adSrc: null,
  tuneTo(i) {
    this.station = i; this.step = 0; this.adDone = false; this.waitUntil = 0;
    if (this.mode === "wait") this.mode = "synth";
    this.toast = { text: RADIO_STATIONS[i].name, t0: game.clock || 0 };
    this.prefetch();
  },
  // BELLEK: çözülmüş şarkı büyüktür (3 dk ≈ 35 MB, 24 kHz'te bile). Eskiden radyo açılınca ÜÇ
  // şarkı birden çözülüp oturum boyu tutuluyordu (~130 MB). Artık yalnız çalan ve SIRADAKİ
  // istasyonun dosyası bellekte; sıradaki, çalan şarkı sürerken arkada hazırlanır.
  prefetch() {
    const ac = this.ac;
    if (!ac || this.station < 0) return;
    const n = RADIO_STATIONS.length, keep = new Set();
    for (const j of [this.station, (this.station + 1) % n]) {
      const f = RADIO_STATIONS[j].file;
      if (f) keep.add(f);
    }
    for (const st of RADIO_STATIONS) {
      if (!st.file) continue;
      if (keep.has(st.file)) { radioLoadFile(ac, st.file); continue; }
      const e = RADIO_FILES[st.file];
      if (e && e.buf && !e.buf.el && !(this.src && this.src.buffer === e.buf)) e.buf = null;   // çalanı bırakma
    }
  },
  // İstenen durumla gerçek durumu eşitle. Her karede çağrılır (ucuz).
  sync(fromTap) {
    const inGame = game.state !== STATE.MENU && game.state !== STATE.NAMING && game.state !== STATE.HOWTO && game.state !== STATE.ABOUT;
    const want = this.on && inGame && !(typeof document !== "undefined" && document.hidden);
    if (want && !this.running) this.start(fromTap);
    else if (!want && this.running) this.stop();
  },
  start(withStatic) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ac) { this.ac = radioNewContext(AC); this.g = radioBuildGraph(this.ac, this.ac.destination); }
    const ac = this.ac, g = this.g, my = ++this.token;
    if (ac.resume) ac.resume();
    this.running = true;
    const t = ac.currentTime + 0.02;
    if (withStatic) radioTuneStatic(ac, g, t);
    const fadeAt = t + (withStatic ? 0.35 : 0);
    g.master.gain.cancelScheduledValues(t);
    g.master.gain.setValueAtTime(Math.max(0.0001, g.master.gain.value), t);
    g.master.gain.exponentialRampToValueAtTime(0.0001, fadeAt + 0.001);
    g.master.gain.exponentialRampToValueAtTime(this.volume, fadeAt + 0.6);
    this.nextT = Math.max(this.nextT, fadeAt);
    if (this.nextT < ac.currentTime) this.nextT = fadeAt;
    clearInterval(this.timer);
    if (this.station < 0) this.tuneTo(0);
    for (const st of RADIO_STATIONS) if (st.ad) radioLoadFile(ac, st.ad);      // reklamlar küçük: hepsi
    this.prefetch();                                                          // şarkılar: çalan + sıradaki
    g.duck.gain.cancelScheduledValues(ac.currentTime);                          // yarım kalan anons
    g.duck.gain.setValueAtTime(1, ac.currentTime);
    if (this.mode === "file" && this.step > 0) this.fileStartPending = true;  // menüden dönüş: kaldığı yerden
    this.timer = setInterval(() => {
      if (my !== this.token) return;
      while (this.nextT < ac.currentTime + 0.12) {
        let st = RADIO_STATIONS[this.station];
        const steps = this.step > 0 && this.mode === "file" ? this.fileSteps : st.steps;
        if (this.step > 0 && this.step >= steps) {   // şarkı bitti → parazit + sıradaki istasyon
          this.stopFile(this.nextT);
          radioTuneStatic(ac, g, this.nextT);
          this.nextT += 0.4;
          this.tuneTo((this.station + 1) % RADIO_STATIONS.length);
          st = RADIO_STATIONS[this.station];
        }
        if (this.step === 0 && this.mode !== "wait") this.enterStation(ac, g, st);
        if (this.mode === "wait") {
          const f = RADIO_FILES[st.file];
          if ((f && f.buf) || !(f && f.loading) || this.nextT >= this.waitUntil) {
            this.mode = "synth"; this.enterStation(ac, g, st);          // hazır / vazgeç → normal yol
            this.waitUntil = 0;
          } else {
            if (Math.floor(this.nextT / 0.5) !== Math.floor((this.nextT + RADIO_FILE_STEP) / 0.5)) radioTuneStatic(ac, g, this.nextT);
            this.nextT += RADIO_FILE_STEP;
            continue;
          }
        }
        if (this.mode === "skip") { this.tuneTo((this.station + 1) % RADIO_STATIONS.length); continue; }
        // reklam arası: şarkının 13. saniyesi
        const stT = this.step * (this.mode === "file" ? RADIO_FILE_STEP : st.stepDur());
        if (!this.adDone && st.ad && stT >= RADIO_AD_AT) {
          this.adDone = true;
          const ad = RADIO_FILES[st.ad];
          if (ad && ad.buf) this.adSrc = radioPlayAd(ac, g, ad.buf, this.nextT);
        }
        if (this.mode === "file") {
          if (this.fileStartPending) {
            this.playFile(ac, g, st, this.nextT, this.step * RADIO_FILE_STEP);
            this.fileStartPending = false;
          }
          this.step++; this.nextT += RADIO_FILE_STEP;
        } else {
          st.schedule(ac, g, this.step, this.nextT);
          this.step++; this.nextT += st.stepDur();
        }
      }
    }, 25);
  },
  stop() {
    if (!this.ac) { this.running = false; return; }
    const ac = this.ac, g = this.g, my = ++this.token, t = ac.currentTime;
    this.running = false;
    g.master.gain.cancelScheduledValues(t);
    g.master.gain.setValueAtTime(Math.max(0.0001, g.master.gain.value), t);
    g.master.gain.exponentialRampToValueAtTime(0.0001, t + 0.3);
    this.stopFile(t + 0.32);
    if (this.adSrc) { try { this.adSrc.stop(t + 0.32); } catch (e) { /* bitti */ } this.adSrc = null; }
    setTimeout(() => {
      if (my !== this.token) return;       // bu arada yeniden açıldıysa dokunma
      clearInterval(this.timer); this.timer = null;
      if (ac.suspend) ac.suspend();
    }, 360);
  }
};
if (typeof document !== "undefined" && document.addEventListener) {
  document.addEventListener("visibilitychange", () => Radio.sync(false));
}

// =====================================================================
//  ANA EKRAN SESİ — "Sokak Teması": özgün müzik + sokak ambiyansı
// =====================================================================
// Ana ekran ailesinde (menü, ad girişi, menüden açılan "nasıl oynanır") çalar; oyuna girince
// susar, orada radyo devralır. Varsayılan AÇIK. Sağ üstteki emaye SES levhası açıp kapatır.
// Müzik yerel saate göre iki düzenlemede çalar (arka planla aynı eşikler, menuPhaseNow()):
//   GÜNDÜZ 96 BPM — naylon telli gitar parmak vuruşu, kontrbas, fırça + çalkalayıcı, çelesta/flüt;
//                    ambiyans: kuş cıvıltıları, ara sıra eczane kapısının zili.
//   GECE   72 BPM — Rhodes, yumuşak pad, bas, fırça; vibrafon melodi (hafif eko);
//                    ambiyans: cırcır böcekleri, ara sıra baykuş.
// Aynı 16 ölçülük beste (Re majör) iki düzenlemede de çalar; her 3 turda bir melodi çalgısı
// değişir, 3. turun ilk yarısında melodi susar (tekrar yorgunluğu olmasın).
// SÜREKLİ gürültü katmanı YOK (trafik uğultusu vb.) — yalnız tek tek olaylar: sessizlik sessiz kalır.
// AudioContext açılışta kurulur; tarayıcı izin vermezse ilk dokunuşta başlar (iOS uygulamasında
// WKWebView ayarı izin veriyorsa hemen).
const MENU_THEME = (() => {

    Dmaj7: [62, 66, 69, 73], Bm7: [59, 62, 66, 69], Em7: [59, 62, 64, 67],
    A7sus: [57, 62, 64, 67], A7: [57, 61, 64, 67], Fsm7: [57, 61, 64, 66],

    [[0, 43, C.Gmaj7]], [[0, 42, C.Fsm7]], [[0, 40, C.Em7]], [[0, 45, C.A7]],

  const mel = [
    [0,0,3,78],[0,3,1,76],[0,4,2,74],[0,6,2,69],   [1,0,2,71],[1,2,2,74],[1,4,4,78],
    [2,0,3,79],[2,3,1,78],[2,4,2,76],[2,6,2,74],   [3,0,4,76],[3,4,2,73],[3,6,2,76],
    [4,0,3,78],[4,3,1,76],[4,4,2,74],[4,6,2,81],   [5,0,2,85],[5,2,2,81],[5,4,4,78],
    [6,0,2,79],[6,2,2,83],[6,4,2,81],[6,6,2,79],   [7,0,6,76],[7,6,2,73],
    [8,0,3,83],[8,3,1,81],[8,4,4,79],              [9,0,3,81],[9,3,1,78],[9,4,4,76],
    [10,0,2,79],[10,2,2,78],[10,4,2,76],[10,6,2,74],[11,0,4,76],[11,4,2,79],[11,6,2,81],
    [12,0,3,83],[12,3,1,81],[12,4,2,78],[12,6,2,74],[13,0,2,76],[13,2,2,79],[13,4,4,83],
    [14,0,2,81],[14,2,2,79],[14,4,2,76],[14,6,2,73],[15,0,8,74]

const MM_BPM = { day: 96, night: 72 };
function mmEighth(phase) { return 60 / MM_BPM[phase] / 2; }
function mmChord(bar, pos) {
  let c = MENU_THEME.bars[bar][0];
  for (const x of MENU_THEME.bars[bar]) if (x[0] <= pos) c = x;
  return c;
}
function mmChordChangeAt(bar, pos) { return MENU_THEME.bars[bar].some(x => x[0] === pos); }
// bir akorun kaç sekizlik süreceği (sonraki akor değişimine kadar)
function mmChordLen(bar, pos) {
  let n = 0, b = bar, p = pos;
  do { n++; p++; if (p === 8) { p = 0; b = (b + 1) % 16; } } while (!mmChordChangeAt(b, p) && n < 16);
