// Açık hava yankısı: 15 ms ön gecikme, yumuşak başlangıç, 2,4 sn sönüm. Erken yansıma YOK
// (kapalı oda hissini erken yansımalar verir).
function mmImpulse(ac) {
  const sr = ac.sampleRate, sec = 2.4, n = Math.floor(sr * sec), b = ac.createBuffer(2, n, sr);
  for (let ch = 0; ch < 2; ch++) {
    const d = b.getChannelData(ch); let lp = 0;
    for (let i = 0; i < n; i++) {
      const t = i / sr;
      const on = t < 0.015 ? 0 : Math.min(1, (t - 0.015) / 0.06);
      lp = lp * 0.35 + (Math.random() * 2 - 1) * 0.65;
      d[i] = lp * on * Math.exp(-t / 0.55) * (1 - t / sec);
    }
  }
  return b;
}
function mmPan(ac, v) {

  g.send.connect(revLo); revLo.connect(g.rev); g.rev.connect(g.mix);

  g.tone = ac.createBiquadFilter(); g.tone.type = "highshelf"; g.tone.frequency.value = 2200; g.tone.gain.value = 0;
  g.music.connect(g.tone); g.tone.connect(g.mix); g.mSend.connect(g.send);
  g.amb = ac.createGain(); g.aSend = ac.createGain(); g.aSend.gain.value = 1;
  g.amb.connect(g.mix); g.aSend.connect(g.send);
  g.gtr  = mmChannel(ac, g.music, g.mSend, -0.28, 0.16);
  g.bass = mmChannel(ac, g.music, g.mSend, 0.0, 0.03);
  g.drum = mmChannel(ac, g.music, g.mSend, 0.12, 0.10);
  g.keys = mmChannel(ac, g.music, g.mSend, -0.12, 0.18);
  g.pad  = mmChannel(ac, g.music, g.mSend, 0.0, 0.30);

  const fb = ac.createGain(); fb.gain.value = 0.28;
  const fbLp = ac.createBiquadFilter(); fbLp.type = "lowpass"; fbLp.frequency.value = 3200;
  g.melWet = ac.createGain(); g.melWet.gain.value = 0.12;
  g.mel.connect(g.melDly); g.melDly.connect(fbLp); fbLp.connect(fb); fb.connect(g.melDly);
  g.melDly.connect(g.melWet); g.melWet.connect(melCh);
  g.pluck = new Map();                             // gitar teli tamponları (nota → {buf, rate})
  const n = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = n.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  g.noise = n;
  return g;
}
// düzenlemeye göre kanal ayarı (gece ekosu daha belirgin)
// düzenleme başına düzey (ölçüldü: ikisi de ≈ −23 LUFS) ve ton
const MM_TRIM = { day: 1.13, night: 1.9 }, MM_TONE = { day: 0, night: 6 };
function mmApplyPhase(g, phase, t) {
  g.mix.gain.setValueAtTime(MM_TRIM[phase], t);
  g.tone.gain.setValueAtTime(MM_TONE[phase], t);
  g.melDly.delayTime.setValueAtTime(mmEighth(phase) * 1.5, t);
  g.melWet.gain.setValueAtTime(phase === "night" ? 0.22 : 0.10, t);
}

// --- çalgılar ---
// Naylon tel: Karplus-Strong. Periyot tam sayı örneğe yuvarlanır, perde playbackRate ile düzeltilir
// (ortalama süzgecinin yarım örnek gecikmesi hesaba katılır) → akort ±1 cent.
function mmPluckBuf(ac, g, midi) {
  let e = g.pluck.get(midi);
  if (e) return e;
  const sr = ac.sampleRate, f = mtof(midi);
  const N = Math.max(2, Math.round(sr / f - 0.5));
  const len = Math.floor(sr * 2.4), buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0);
  const line = new Float32Array(N); let lp = 0;
  for (let i = 0; i < N; i++) { lp = lp * 0.55 + (Math.random() * 2 - 1) * 0.45; line[i] = lp; }   // yumuşak (parmak) vuruş
  let idx = 0; const loss = 0.9985;
  for (let i = 0; i < len; i++) {
    const nx = idx + 1 === N ? 0 : idx + 1, v = line[idx];
    d[i] = v; line[idx] = loss * 0.5 * (v + line[nx]); idx = nx;
  }
  let pk = 0; for (let i = 0; i < 2000 && i < len; i++) pk = Math.max(pk, Math.abs(d[i]));
  if (pk > 0) for (let i = 0; i < len; i++) d[i] /= pk;
  e = { buf, rate: f / (sr / (N + 0.5)) };
  g.pluck.set(midi, e);
  return e;
}
function mmPluck(ac, g, midi, t, vel, dur) {
  const p = mmPluckBuf(ac, g, midi), s = ac.createBufferSource(), e = ac.createGain();
  s.buffer = p.buf; s.playbackRate.value = p.rate;
  e.gain.setValueAtTime(vel, t);
  e.gain.setValueAtTime(vel, t + dur);
  e.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.25);
  s.connect(e); e.connect(g.gtr); s.start(t); s.stop(t + dur + 0.3);
}
function mmTone(ac, out, type, f, t, att, dur, peak) {
  const o = ac.createOscillator(), e = ac.createGain();
  o.type = type; o.frequency.value = f;
  e.gain.setValueAtTime(0.0001, t);
  e.gain.exponentialRampToValueAtTime(peak, t + att);
  e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(e); e.connect(out); o.start(t); o.stop(t + dur + 0.02);
  return o;
}
// çelesta: harmonik kısmi sesler, üsttekiler hızlı söner
function mmCelesta(ac, g, midi, t, len, vel) {
  const f = mtof(midi), d = Math.max(0.9, len + 0.6);
  mmTone(ac, g.mel, "sine", f, t, 0.004, d, 0.050 * vel);
  mmTone(ac, g.mel, "sine", f * 2, t, 0.003, d * 0.45, 0.014 * vel);
  mmTone(ac, g.mel, "sine", f * 4, t, 0.002, 0.18, 0.006 * vel);
}
// flüt: yumuşak atak, gecikmeli vibrato, hafif nefes
function mmFlute(ac, g, midi, t, len, vel) {
  const f = mtof(midi), d = len + 0.12;
  const o = ac.createOscillator(), o2 = ac.createOscillator(), e = ac.createGain();
  const lfo = ac.createOscillator(), lg = ac.createGain();
  o.type = "sine"; o2.type = "triangle"; o.frequency.value = f; o2.frequency.value = f;
  lfo.frequency.value = 5.2; lg.gain.setValueAtTime(0, t); lg.gain.linearRampToValueAtTime(f * 0.006, t + Math.min(0.35, d * 0.6));
  lfo.connect(lg); lg.connect(o.frequency); lg.connect(o2.frequency);
  const mix2 = ac.createGain(); mix2.gain.value = 0.25; o2.connect(mix2); mix2.connect(e);
  o.connect(e);
  e.gain.setValueAtTime(0.0001, t);
  e.gain.exponentialRampToValueAtTime(0.040 * vel, t + 0.07);
  e.gain.setValueAtTime(0.036 * vel, t + Math.max(0.08, d - 0.1));
  e.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.08);
  e.connect(g.mel);
  const nb = ac.createBufferSource(), nf = ac.createBiquadFilter(), ne = ac.createGain();   // nefes
  nb.buffer = g.noise; nf.type = "bandpass"; nf.frequency.value = f * 2; nf.Q.value = 2;
  ne.gain.setValueAtTime(0.012 * vel, t); ne.gain.exponentialRampToValueAtTime(0.0001, t + 0.12);
  nb.connect(nf); nf.connect(ne); ne.connect(g.mel);
  for (const x of [o, o2, lfo]) { x.start(t); x.stop(t + d + 0.1); }
  nb.start(t, Math.random() * 0.5); nb.stop(t + 0.14);
}
// vibrafon: sinüs + dördüncü kısmi, motor tremolosu
function mmVibes(ac, g, midi, t, len, vel) {
  const f = mtof(midi), d = Math.max(1.4, len + 1.0);
  const e = ac.createGain(), trem = ac.createOscillator(), tg = ac.createGain();
  e.gain.value = 1; trem.frequency.value = 4.8; tg.gain.value = 0.22;
  trem.connect(tg); tg.connect(e.gain);
  mmTone(ac, e, "sine", f, t, 0.004, d, 0.070 * vel);
  mmTone(ac, e, "sine", f * 2, t, 0.003, d * 0.35, 0.024 * vel);
  mmTone(ac, e, "sine", f * 4, t, 0.002, 0.3, 0.012 * vel);
  mmTone(ac, e, "sine", f * 9.9, t, 0.001, 0.06, 0.004 * vel);            // tokmak "tık"ı
  e.connect(g.mel); trem.start(t); trem.stop(t + d + 0.05);
}
// Rhodes (FM): vuruşta parlak, sonra yumuşak gövde
function mmRhodes(ac, out, midi, t, dur, peak) {
  const f = mtof(midi), c = ac.createOscillator(), m = ac.createOscillator(), md = ac.createGain(), e = ac.createGain();
  c.frequency.value = f; m.frequency.value = f;
  md.gain.setValueAtTime(f * 1.8, t); md.gain.exponentialRampToValueAtTime(f * 0.35, t + 0.4);
  md.gain.exponentialRampToValueAtTime(f * 0.08, t + dur);
  m.connect(md); md.connect(c.frequency);
  e.gain.setValueAtTime(0.0001, t);
  e.gain.exponentialRampToValueAtTime(peak, t + 0.006);
  e.gain.exponentialRampToValueAtTime(peak * 0.45, t + Math.min(0.8, dur * 0.5));
  e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  c.connect(e); e.connect(out);
  c.start(t); m.start(t); c.stop(t + dur + 0.02); m.stop(t + dur + 0.02);
}
function mmPad(ac, g, notes, t, dur) {
  const lp = ac.createBiquadFilter(), e = ac.createGain();
  lp.type = "lowpass"; lp.frequency.value = 1500; lp.Q.value = 0.5;
  e.gain.setValueAtTime(0.0001, t);
  e.gain.exponentialRampToValueAtTime(1, t + Math.min(0.9, dur * 0.4));
  e.gain.setValueAtTime(1, t + Math.max(0.2, dur - 0.3));
  e.gain.exponentialRampToValueAtTime(0.0001, t + dur + 0.9);
  lp.connect(e); e.connect(g.pad);
  for (const m of notes) for (const det of [-7, 6]) {
    const o = ac.createOscillator(), og = ac.createGain();
    o.type = "sawtooth"; o.frequency.value = mtof(m); o.detune.value = det; og.gain.value = 0.008;
    o.connect(og); og.connect(lp); o.start(t); o.stop(t + dur + 1.0);
  }
}
function mmBass(ac, g, midi, t, dur, vel) {
  const f = mtof(midi);
  mmTone(ac, g.bass, "sine", f, t, 0.006, dur, 0.13 * vel);
  mmTone(ac, g.bass, "triangle", f, t, 0.004, dur * 0.5, 0.05 * vel);
}
function mmNoise(ac, g, out, t, type, freq, q, peak, att, dur) {
  const s = ac.createBufferSource(), f = ac.createBiquadFilter(), e = ac.createGain();
  s.buffer = g.noise; f.type = type; f.frequency.value = freq; f.Q.value = q;
  e.gain.setValueAtTime(0.0001, t);
  e.gain.exponentialRampToValueAtTime(peak, t + att);
  e.gain.exponentialRampToValueAtTime(0.0001, t + att + dur);
  s.connect(f); f.connect(e); e.connect(out);
  s.start(t, Math.random() * 0.5); s.stop(t + att + dur + 0.02);
}
function mmKick(ac, g, t, vel) {
  const o = ac.createOscillator(), e = ac.createGain();
  o.frequency.setValueAtTime(120, t); o.frequency.exponentialRampToValueAtTime(62, t + 0.08);
  e.gain.setValueAtTime(0.16 * vel, t); e.gain.exponentialRampToValueAtTime(0.0001, t + 0.2);
  o.connect(e); e.connect(g.drum); o.start(t); o.stop(t + 0.22);
}

// Tek sekizlik adımı zamanla. step: döngü başından beri geçen sekizlik.
function mmSchedule(ac, g, phase, step, t) {
  const bar = Math.floor(step / 8) % 16, pos = step % 8, pass = Math.floor(step / 128) % 3;
  const e = mmEighth(phase), [, root, notes] = mmChord(bar, pos);
  const change = mmChordChangeAt(bar, pos);
  const hum = () => (Math.random() - 0.5) * 0.012;                      // insan eli: ±6 ms
  const mel = MENU_THEME.melAt[bar * 8 + pos];
  if (phase === "day") {
    // naylon gitar: parmak vuruşu (bas-orta-alt-üst), kök/beşli basta
    const pat = ["R", 2, 1, 3, "F", 2, 1, 3];
    const k = pat[pos], m = k === "R" ? root + 12 : k === "F" ? (change ? root + 12 : root + 19) : notes[k];
    mmPluck(ac, g, m, t + hum(), pos === 0 ? 0.30 : (typeof k === "string" ? 0.24 : 0.17), e * (typeof k === "string" ? 3.6 : 2.2));
    if (pos === 0 || pos === 4) mmBass(ac, g, pos === 4 && !change ? root + 7 : root, t, e * 3.4, pos === 0 ? 1 : 0.8);
    if (pos === 0 || (pos === 5 && bar % 2 === 1)) mmKick(ac, g, t, pos === 0 ? 1 : 0.6);
    if (pos === 2 || pos === 6) mmNoise(ac, g, g.drum, t + hum(), "bandpass", 2600, 0.6, 0.050, 0.004, 0.13);   // fırça
    mmNoise(ac, g, g.drum, t + hum(), "highpass", 6500, 0.7, pos % 2 ? 0.030 : 0.018, 0.012, 0.05);          // çalkalayıcı
    if (mel && !(pass === 2 && bar < 8)) {
      if (pass === 1) mmFlute(ac, g, mel[1], t, mel[0] * e, 1);
      else mmCelesta(ac, g, mel[1] + (pass === 2 ? 12 : 0), t, mel[0] * e, pass === 2 ? 0.8 : 1);
    }
  } else {
    const sw = pos % 2 ? e * 0.14 : 0, tt = t + sw;                     // gece: hafif swing
    if (change) {
      const L = mmChordLen(bar, pos);
      mmPad(ac, g, notes, t, L * e);
      notes.forEach((m, i) => mmRhodes(ac, g.keys, m, t + i * 0.012, Math.min(L, 4) * e * 0.95, 0.050));
    } else if (pos === 5 || (pos === 3 && mmChordChangeAt(bar, 4) === false && bar % 2 === 1)) {
      notes.forEach((m, i) => mmRhodes(ac, g.keys, m, tt + i * 0.01, e * 1.6, 0.026));
    }
    if (pos === 0 || pos === 4) mmBass(ac, g, pos === 4 && !change ? root + 7 : root, t, e * 3.6, pos === 0 ? 0.9 : 0.7);
    if (pos === 2 || pos === 6) mmNoise(ac, g, g.drum, tt, "bandpass", 3600, 0.5, 0.06, 0.03, 0.22);            // fırça süpürme
    if (pos % 2 === 1) mmNoise(ac, g, g.drum, tt, "highpass", 7000, 0.7, 0.026, 0.004, 0.06);                  // hafif zil
    if (mel && !(pass === 2 && bar < 8)) {
      if (pass === 1) mmRhodes(ac, g.mel, mel[1] - 12, tt, Math.max(1.2, mel[0] * e + 0.5), 0.060);
      else mmVibes(ac, g, mel[1], tt, mel[0] * e, pass === 2 ? 0.8 : 1);
    }
  }
}

// --- sokak ambiyansı: tek tek olaylar (sürekli katman yok) ---
function mmAmbInit(phase, t) {
  return phase === "day"
    ? { bird: t + 0.8, bell: t + 14 + Math.random() * 10 }
    : { c1: t + 0.3, c2: t + 0.9, pause: t + 9 + Math.random() * 5, owl: t + 12 + Math.random() * 8 };
}
function mmAmbOut(ac, g, pan, send) {
  const inp = ac.createGain(), p = mmPan(ac, pan), s = ac.createGain();
  s.gain.value = send; inp.connect(p); p.connect(g.amb); p.connect(s); s.connect(g.aSend);
  return inp;
}
function mmBird(ac, g, t) {
  const out = mmAmbOut(ac, g, (Math.random() * 2 - 1) * 0.75, 0.25), kind = Math.random();
  const base = 2700 + Math.random() * 1600, amp = 0.010 + Math.random() * 0.012;
  const chirp = (at, f0, f1, d, a) => {
    const o = ac.createOscillator(), e = ac.createGain();
    o.frequency.setValueAtTime(f0, at); o.frequency.exponentialRampToValueAtTime(f1, at + d);
    e.gain.setValueAtTime(0.0001, at); e.gain.exponentialRampToValueAtTime(a, at + 0.006);
    e.gain.exponentialRampToValueAtTime(0.0001, at + d);
    o.connect(e); e.connect(out); o.start(at); o.stop(at + d + 0.01);
  };
  if (kind < 0.45) {                                   // yükselen cik-cik
    const n = 2 + Math.floor(Math.random() * 4);
    for (let i = 0; i < n; i++) chirp(t + i * (0.09 + Math.random() * 0.08), base, base * 1.35, 0.06 + Math.random() * 0.04, amp);
  } else if (kind < 0.75) {                            // hızlı tril
    for (let i = 0; i < 8; i++) chirp(t + i * 0.036, base * 1.1, base * 0.9, 0.03, amp * (1 - i * 0.07));
  } else {                                             // iki notalı ıslık "fi-fiu"
    chirp(t, base * 0.8, base * 0.82, 0.14, amp * 0.9);
    chirp(t + 0.2, base * 1.05, base * 0.7, 0.2, amp);
  }
}
// eczane kapısının pirinç zili: sallanan zil, birkaç düzensiz vuruş
function mmDoorBell(ac, g, t) {
  const out = mmAmbOut(ac, g, 0.35, 0.3);
  let at = t, v = 1;
  for (let k = 0; k < 5; k++) {
    for (const [r, a] of [[1, 1], [1.33, 0.6], [1.9, 0.35]]) {
      const f = 2350 * r * (1 + (Math.random() - 0.5) * 0.01);
      mmTone(ac, out, "sine", f, at, 0.002, 0.9, 0.010 * a * v);
    }
    at += 0.09 + Math.random() * 0.11; v *= 0.72;
  }
}
function mmCricket(ac, g, t, f, pan) {
  const out = mmAmbOut(ac, g, pan, 0.2);
  for (let i = 0; i < 3; i++) mmTone(ac, out, "sine", f, t + i * 0.042, 0.004, 0.022, 0.0065);
}
function mmOwl(ac, g, t) {
  const out = mmAmbOut(ac, g, (Math.random() < 0.5 ? -1 : 1) * (0.4 + Math.random() * 0.3), 0.45);
  const hoo = (at, d) => {
    const o = ac.createOscillator(), o2 = ac.createOscillator(), lp = ac.createBiquadFilter(), e = ac.createGain();
    o.frequency.setValueAtTime(392, at); o.frequency.exponentialRampToValueAtTime(366, at + d);
    o2.frequency.setValueAtTime(784, at); o2.frequency.exponentialRampToValueAtTime(732, at + d);
    const g2 = ac.createGain(); g2.gain.value = 0.18; o2.connect(g2); g2.connect(lp);
    lp.type = "lowpass"; lp.frequency.value = 1100;
    e.gain.setValueAtTime(0.0001, at); e.gain.exponentialRampToValueAtTime(0.026, at + 0.07);
    e.gain.exponentialRampToValueAtTime(0.0001, at + d);
    o.connect(lp); lp.connect(e); e.connect(out);
    o.start(at); o2.start(at); o.stop(at + d + 0.02); o2.stop(at + d + 0.02);
  };
  hoo(t, 0.42); hoo(t + 0.95, 0.2); hoo(t + 1.25, 0.34);
}
// [t0, t1) aralığına düşen olayları zamanla
function mmAmbience(ac, g, phase, A, t0, t1) {
  if (phase === "day") {
    while (A.bird < t1) { if (A.bird >= t0 - 0.05) mmBird(ac, g, A.bird); A.bird += 1.8 + Math.random() * 4.5; }
    while (A.bell < t1) { if (A.bell >= t0 - 0.05) mmDoorBell(ac, g, A.bell); A.bell += 38 + Math.random() * 30; }
  } else {
    while (A.pause < t1) {                            // cırcırlar ara sıra hep birlikte susar
      const len = 3 + Math.random() * 4;
      A.c1 = Math.max(A.c1, A.pause + len); A.c2 = Math.max(A.c2, A.pause + len + 0.4);
      A.pause += len + 8 + Math.random() * 8;
    }
    while (A.c1 < t1) { if (A.c1 >= t0 - 0.05) mmCricket(ac, g, A.c1, 4450, -0.55); A.c1 += 0.62 + Math.random() * 0.12; }
    while (A.c2 < t1) { if (A.c2 >= t0 - 0.05) mmCricket(ac, g, A.c2, 4920, 0.6); A.c2 += 0.81 + Math.random() * 0.2; }
    while (A.owl < t1) { if (A.owl >= t0 - 0.05) mmOwl(ac, g, A.owl); A.owl += 32 + Math.random() * 28; }
  }
}

// =====================================================================
//  STÜDYO AÇILIŞI — COSMIC INTERACTION logo animasyonu (≈4 sn, assets/intro_cosmic.mp4)
// =====================================================================
// Her açılışta bir kez (Supercell gibi). Dokununca geçilir (ilk 0,6 sn hariç: yanlışlıkla
// geçilmesin). SES levhası kapalıysa sessiz oynar. Oynatılamazsa (dosya yok, tarayıcı izin
// vermedi, jsdom testi) hiç beklemeden menüye geçer; 8 sn'lik emniyet süresi de var.
// Video: Higgsfield'da üretildi (Kerem, 25 Eylül) — 1080×1920, 24 fps, sesli. Değiştirmek için
// aynı adla assets/'e koymak yeter.
// Ana ekran müziği açılış bitene kadar susar (MenuMusic.wanted).
const INTRO_HOLD_MS = 1000;   // logo videosu bittikten sonra oyuna geçmeden önce bekleme
const Intro = {
  // açılış öğesi sayfada varsa BAŞTAN etkin: boot sırasında menü müziği bir an bile başlamasın
  active: typeof document !== "undefined" && !!document.getElementById("intro"), done: false, t0: 0, box: null, v: null, guard: 0,
  start() {
    const box = typeof document !== "undefined" && document.getElementById("intro");
    const v = box && document.getElementById("introVideo");
    this.box = box; this.v = v;
    // Bu tarayıcı H.264 MP4'ü oynatamıyorsa (jsdom testi, bazı Chromium derlemeleri) hiç deneme:
    // jsdom play()/pause() çağrısını "Not implemented" hatası olarak raporluyor (npm test).
    const canMp4 = v && typeof v.canPlayType === "function" && v.canPlayType('video/mp4; codecs="avc1.4D401E, mp4a.40.2"');
    if (!box || !v || typeof v.play !== "function" || !canMp4) { this.finish(true); return; }
    this.started = true;
    this.active = true; this.t0 = Date.now();
    v.muted = !MenuMusic.on;
    // Video bitince son kare (logo) INTRO_HOLD_MS boyunca ekranda kalır, sonra oyuna geçilir
    // (Kerem: önce 2 sn istedi, "çok olmuş" → 1 sn). Dokunuş yine anında geçer.
    v.addEventListener("ended", () => { clearTimeout(this.guard); this.hold = setTimeout(() => this.finish(), INTRO_HOLD_MS); });
    v.addEventListener("error", () => this.finish(true));
    box.addEventListener("pointerdown", () => { if (Date.now() - this.t0 > 600) this.finish(); });
    box.addEventListener("touchstart", (e) => { e.preventDefault(); if (Date.now() - this.t0 > 600) this.finish(); }, { passive: false });
    const tryPlay = () => {
      let pr = null;
      try { pr = v.play(); } catch (e) { pr = null; }
      if (!pr || typeof pr.then !== "function") { if (v.paused) this.finish(true); return; }
      // sesli otomatik oynatma reddedilirse (tarayıcı önizlemesi) sessiz dene; o da olmazsa geç
      pr.catch(() => { if (!v.muted) { v.muted = true; tryPlay(); } else this.finish(true); });
    };
    tryPlay();
    this.guard = setTimeout(() => this.finish(), 8000 + INTRO_HOLD_MS);   // emniyet: video takılırsa
  },
  finish(instant) {
    if (this.done) return;
    this.done = true; this.active = false;
    clearTimeout(this.guard); clearTimeout(this.hold);
    try { if (this.v && this.started) this.v.pause(); } catch (e) { /* zaten durdu */ }
    const box = this.box, v = this.v, started = this.started;
    const drop = () => {
      if (box && box.parentNode) box.parentNode.removeChild(box);
      try { if (v && started) { v.removeAttribute("src"); v.load(); } } catch (e) { /* çözücü zaten bırakıldı */ }
    };
    if (box && !instant) { box.classList.add("done"); setTimeout(drop, 520); }
    else drop();
    MenuMusic.sync();
  }
};

const MenuMusic = {
  on: true,               // varsayılan AÇIK; seçim profil kaydında kalıcı
  running: false, ac: null, g: null, timer: null, token: 0,
  step: 0, nextT: 0, phase: null, amb: null, switchAt: 0,
  volume: 0.9,
  toggle() { this.on = !this.on; iosAudioSession(); this.sync(); if (this.on) this.unlock(); saveProfile(); },
  // dokunuşla ses motorunu uyandır (tarayıcı/iOS otomatik başlatmaya izin vermediyse)
  unlock() { if (this.ac && this.running && this.ac.state !== "running" && this.ac.resume) this.ac.resume(); },
  wanted() {
    const s = game.state;
    const home = s === STATE.MENU || s === STATE.NAMING || s === STATE.ABOUT || (s === STATE.HOWTO && game.howtoBack !== STATE.PLAYING);
    return this.on && home && !Intro.active && !(typeof document !== "undefined" && document.hidden);
  },
  sync() {
    const want = this.wanted();
    if (want && !this.running) this.start();
    else if (!want && this.running) this.stop();
  },
  start() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    if (!this.ac) { this.ac = new AC(); this.g = mmBuildGraph(this.ac, this.ac.destination); }
    const ac = this.ac, g = this.g, my = ++this.token;
    if (ac.resume) ac.resume();
    this.running = true;
    const t = ac.currentTime + 0.03;
    g.master.gain.cancelScheduledValues(t);
    g.master.gain.setValueAtTime(Math.max(0.0001, g.master.gain.value), t);
    g.master.gain.exponentialRampToValueAtTime(this.volume, t + 1.2);
    if (this.nextT < t) this.nextT = t;
    this.switchAt = 0;
    const ph = menuPhaseNow();
    if (this.phase !== ph) {                    // ilk açılış ya da menü dışındayken saat eşiği geçti
      this.phase = ph; this.step = 0; this.amb = null;
      mmApplyPhase(g, ph, t);
      for (const p of [g.music.gain, g.mSend.gain]) { p.cancelScheduledValues(t); p.setValueAtTime(1, t); }
    }
    if (!this.amb) { this.amb = mmAmbInit(this.phase, this.nextT); this.amb.phase = this.phase; }
    else for (const k in this.amb) if (typeof this.amb[k] === "number" && this.amb[k] < t) this.amb[k] = t + Math.random() * 2;
    clearInterval(this.timer);
    this.timer = setInterval(() => {
      if (my !== this.token) return;
      const now = ac.currentTime, until = now + 0.15;
      // gündüz/gece değiştiyse: müzik 1,5 sn'de kısılır, yeni düzenleme baştan başlar
      const want = menuPhaseNow();
      if (want !== this.phase && !this.switchAt) {
        this.switchAt = Math.max(this.nextT, now) + 1.6;
        for (const p of [g.music.gain, g.mSend.gain]) {
          p.cancelScheduledValues(now); p.setValueAtTime(p.value, now); p.linearRampToValueAtTime(0, now + 1.5);
        }
      }
      if (this.switchAt) {
        if (now + 0.15 < this.switchAt) return;
        this.phase = want; this.step = 0; this.nextT = this.switchAt; this.switchAt = 0;
        mmApplyPhase(g, this.phase, this.nextT);
        for (const p of [g.music.gain, g.mSend.gain]) { p.setValueAtTime(0, this.nextT); p.linearRampToValueAtTime(1, this.nextT + 1.2); }
        this.amb = mmAmbInit(this.phase, this.nextT); this.amb.phase = this.phase;
      }
      mmAmbience(ac, g, this.phase, this.amb, now, until);
      while (this.nextT < until) {
        mmSchedule(ac, g, this.phase, this.step, this.nextT);
        this.step++; this.nextT += mmEighth(this.phase);
      }
    }, 25);
  },
  stop() {
    if (!this.ac) { this.running = false; return; }
    const ac = this.ac, g = this.g, my = ++this.token, t = ac.currentTime;
    this.running = false;
    g.master.gain.cancelScheduledValues(t);
    g.master.gain.setValueAtTime(Math.max(0.0001, g.master.gain.value), t);
    g.master.gain.exponentialRampToValueAtTime(0.0001, t + 0.6);
    setTimeout(() => {
      if (my !== this.token) return;
      clearInterval(this.timer); this.timer = null;
      if (ac.suspend) ac.suspend();
    }, 650);
  }
};
if (typeof document !== "undefined" && document.addEventListener) {
  document.addEventListener("visibilitychange", () => MenuMusic.sync());
  // iOS/tarayıcı: ses ancak bir dokunuşun İÇİNDE başlatılabilir → ilk dokunuşta uyandır
  for (const ev of ["touchend", "mousedown", "pointerdown", "keydown"])
    document.addEventListener(ev, () => {
      iosAudioSession();
      MenuMusic.unlock();
      // kayıttan "radyo açık" gelirse radyo dokunuşsuz kurulur ve askıda kalabilir → uyandır
      if (Radio.ac && Radio.running && Radio.ac.state !== "running" && Radio.ac.resume) Radio.ac.resume();
    }, { capture: true, passive: true });
}

// =====================================================================
//  TIKLAMA SESLERİ — her dokunuş yaptığı işe göre ses verir (kodla üretilir, dosya yok)
// =====================================================================
// Emaye SES levhası (MenuMusic.on) oyunun GENEL ses düğmesidir: kapalıyken bunlar da susar.
// Radyo kendi düğmesiyle ayrıca çalışır. Kendi küçük AudioContext'i var; ilk dokunuşun İÇİNDE
// kurulur (iOS kuralı) ve açık kalır — ses yokken işlemci harcamaz.
//   tap     menü/genel buton: yumuşak tahta tık        back   geri/kapat: daha pes tık
//   tab     sekme değişimi: hafif tık                   deny   pasif butona dokunuş: boğuk tık
//   key     ad klavyesi: plastik tuş                    pckey  bilgisayar tuş takımı
//   pc      bilgisayarı aç / ekran değiştir: eski PC "bip"i
//   box     raftan ilaç: karton kutu                     plus / minus  adet artır/azalt
//   stamp   ONAYLA: reçeteye kaşe                        paper  REDDET: kâğıt hışırtısı
//   kasa    doğru satış: yazar kasa zili                 wrong  yanlış satış: boğuk "bonk"
//   coin    para (dilenci, sahte yakalama bonusu)        order  depo siparişi: koli + bozuk para
//   upgrade geliştirme satın alma: kısa üçlü çan        page   defter aç/kapa: sayfa hışırtısı
//   knob    radyo düğmesi                                door   YENİ KARİYER: eczane kapısının zili
const Sfx = {
  ac: null, out: null, noise: null, last: {},
  volume: 0.55,
  get on() { return MenuMusic.on; },
  ensure() {
    if (this.ac) { if (this.ac.state !== "running" && this.ac.resume) this.ac.resume(); return this.ac; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    const ac = this.ac = new AC();
    this.out = ac.createGain(); this.out.gain.value = this.volume;
    const lim = ac.createDynamicsCompressor();
    lim.threshold.value = -10; lim.ratio.value = 6; lim.attack.value = 0.002; lim.release.value = 0.1;
    this.out.connect(lim); lim.connect(ac.destination);
    const n = ac.createBuffer(1, ac.sampleRate, ac.sampleRate), d = n.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    this.noise = n;
    return ac;
  },
  play(name) {
    if (!this.on) return;
    const f = SFX[name];
    if (!f) return;
    const ac = this.ensure();
    if (!ac) return;
    const t = ac.currentTime + 0.005;
    if (this.last[name] && t - this.last[name] < 0.03) return;   // aynı anda iki kez çalmasın
    this.last[name] = t;
    f(ac, this.out, t, this);
  }
};
// SES levhası: kapatırken tık ÖNCE, açarken SONRA çalar (ikisinde de duyulsun)
function toggleSound() {
  const was = MenuMusic.on;
  if (was) sfx("knob");
  MenuMusic.toggle();
  if (!was) sfx("knob");
}
function sfx(name) { try { Sfx.play(name); } catch (e) { /* ses asla oyunu durdurmasın */ } }

// --- yapı taşları ---
function sfxTone(ac, out, type, f0, f1, t, att, dur, peak) {
  const o = ac.createOscillator(), e = ac.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  e.gain.setValueAtTime(0.0001, t);
  e.gain.exponentialRampToValueAtTime(peak, t + att);
  e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(e); e.connect(out); o.start(t); o.stop(t + dur + 0.02);
}
function sfxNoise(ac, out, S, t, type, f0, f1, q, att, dur, peak) {
  const s = ac.createBufferSource(), fl = ac.createBiquadFilter(), e = ac.createGain();
  s.buffer = S.noise; fl.type = type; fl.Q.value = q;
  fl.frequency.setValueAtTime(f0, t);
  if (f1 && f1 !== f0) fl.frequency.exponentialRampToValueAtTime(f1, t + att + dur);
  e.gain.setValueAtTime(0.0001, t);
  e.gain.exponentialRampToValueAtTime(peak, t + att);
  e.gain.exponentialRampToValueAtTime(0.0001, t + att + dur);
  s.connect(fl); fl.connect(e); e.connect(out);
  s.start(t, Math.random() * 0.8); s.stop(t + att + dur + 0.02);
}
function sfxBell(ac, out, f, t, dur, peak) {                 // metal çan: hafif uyumsuz kısmi sesler
  for (const [r, a] of [[1, 1], [2.01, 0.45], [2.76, 0.25], [4.07, 0.12]])
    sfxTone(ac, out, "sine", f * r, 0, t, 0.002, dur / (0.6 + r * 0.4), peak * a);
}

const SFX = {
  tap:   (ac, o, t, S) => { sfxNoise(ac, o, S, t, "bandpass", 1900, 0, 1.4, 0.001, 0.035, 0.30); sfxTone(ac, o, "sine", 820, 620, t, 0.002, 0.05, 0.10); },
  back:  (ac, o, t, S) => { sfxNoise(ac, o, S, t, "bandpass", 1300, 0, 1.4, 0.001, 0.04, 0.26); sfxTone(ac, o, "sine", 560, 430, t, 0.002, 0.06, 0.10); },
  tab:   (ac, o, t, S) => { sfxNoise(ac, o, S, t, "bandpass", 2600, 0, 1.6, 0.001, 0.025, 0.40); },
  deny:  (ac, o, t, S) => { sfxNoise(ac, o, S, t, "lowpass", 600, 0, 0.7, 0.002, 0.06, 0.30); sfxTone(ac, o, "triangle", 150, 120, t, 0.003, 0.08, 0.10); },
  key:   (ac, o, t, S) => { const p = 0.9 + Math.random() * 0.2;
                            sfxNoise(ac, o, S, t, "highpass", 3200 * p, 0, 0.7, 0.001, 0.018, 0.22);
                            sfxNoise(ac, o, S, t + 0.012, "bandpass", 900 * p, 0, 1.2, 0.001, 0.03, 0.14); },
  pckey: (ac, o, t, S) => { sfxNoise(ac, o, S, t, "highpass", 4000, 0, 0.7, 0.001, 0.012, 0.16); sfxTone(ac, o, "square", 1180, 0, t, 0.002, 0.035, 0.035); },
  pc:    (ac, o, t, S) => { sfxTone(ac, o, "square", 1760, 0, t, 0.002, 0.07, 0.11); },
  box:   (ac, o, t, S) => { sfxNoise(ac, o, S, t, "bandpass", 750, 0, 1.1, 0.002, 0.06, 0.45); sfxTone(ac, o, "sine", 210, 95, t, 0.003, 0.08, 0.22);
                            sfxNoise(ac, o, S, t + 0.03, "bandpass", 3000, 0, 2, 0.002, 0.05, 0.06); },    // içindeki blister şıkırtısı
  plus:  (ac, o, t, S) => { sfxNoise(ac, o, S, t, "bandpass", 2300, 0, 1.6, 0.001, 0.025, 0.22); sfxTone(ac, o, "sine", 980, 0, t, 0.002, 0.04, 0.07); },
  minus: (ac, o, t, S) => { sfxNoise(ac, o, S, t, "bandpass", 1500, 0, 1.6, 0.001, 0.025, 0.22); sfxTone(ac, o, "sine", 700, 0, t, 0.002, 0.04, 0.07); },
  stamp: (ac, o, t, S) => { sfxTone(ac, o, "sine", 140, 55, t, 0.002, 0.16, 0.30);                       // tok gövde
                            sfxNoise(ac, o, S, t, "bandpass", 450, 0, 0.8, 0.001, 0.07, 0.32);           // kaşenin kâğıda vuruşu
                            sfxNoise(ac, o, S, t, "highpass", 3500, 0, 0.7, 0.001, 0.012, 0.25);         // "tak"
                            sfxNoise(ac, o, S, t + 0.11, "bandpass", 1200, 0, 1.5, 0.002, 0.03, 0.10); }, // kaldırış
  paper: (ac, o, t, S) => { for (let i = 0; i < 5; i++)
                              sfxNoise(ac, o, S, t + i * 0.035 + Math.random() * 0.015, "bandpass", 2200 + Math.random() * 2500, 0, 1.2,
                                       0.004, 0.04 + Math.random() * 0.03, 0.18 + Math.random() * 0.12);
                            sfxNoise(ac, o, S, t, "bandpass", 1800, 4200, 0.8, 0.03, 0.16, 0.12); },
  kasa:  (ac, o, t, S) => { sfxNoise(ac, o, S, t, "bandpass", 1400, 0, 1.2, 0.001, 0.04, 0.30);               // tuş/çekmece "ka"
                            sfxNoise(ac, o, S, t + 0.05, "lowpass", 500, 0, 0.7, 0.003, 0.08, 0.30);       // çekmece açılışı
                            sfxBell(ac, o, 2093, t + 0.09, 1.1, 0.10); },                                   // "çıng"
  wrong: (ac, o, t, S) => { sfxTone(ac, o, "sine", 196, 150, t, 0.006, 0.28, 0.20); sfxTone(ac, o, "triangle", 147, 110, t + 0.12, 0.006, 0.3, 0.12); },
  coin:  (ac, o, t, S) => { sfxBell(ac, o, 3150, t, 0.35, 0.07); sfxBell(ac, o, 3620, t + 0.07, 0.4, 0.06); },
  order: (ac, o, t, S) => { SFX.box(ac, o, t, S); SFX.coin(ac, o, t + 0.12, S); },
  upgrade: (ac, o, t, S) => { [[1047, 0], [1319, 0.08], [1568, 0.16]].forEach(([f, d]) => sfxBell(ac, o, f, t + d, 0.9, 0.07)); },
  page:  (ac, o, t, S) => { sfxNoise(ac, o, S, t, "bandpass", 1500, 3200, 0.9, 0.06, 0.18, 0.20); sfxNoise(ac, o, S, t + 0.2, "lowpass", 700, 0, 0.7, 0.003, 0.05, 0.12); },
  knob:  (ac, o, t, S) => { sfxNoise(ac, o, S, t, "highpass", 2500, 0, 0.7, 0.001, 0.01, 0.20); sfxNoise(ac, o, S, t + 0.028, "highpass", 2000, 0, 0.7, 0.001, 0.014, 0.16);
                            sfxTone(ac, o, "sine", 300, 0, t, 0.002, 0.03, 0.06); },
  door:  (ac, o, t, S) => { let at = t, v = 1;
                            for (let k = 0; k < 5; k++) { sfxBell(ac, o, 2350 * (1 + (Math.random() - 0.5) * 0.01), at, 0.9, 0.09 * v); at += 0.08 + Math.random() * 0.09; v *= 0.7; } }
};

  // vidalar
  for (const [fx, fy] of [[0.1, 0.16], [0.9, 0.16], [0.1, 0.84], [0.9, 0.84]]) {
    const cx = x + w * fx, cy = y + h * fy, sr = Math.max(1.3, h * 0.045);
    ctx.beginPath(); ctx.arc(cx, cy, sr, 0, Math.PI * 2);
    ctx.fillStyle = "#b9b4a8"; ctx.fill();
    ctx.strokeStyle = "rgba(40,36,30,0.8)"; ctx.lineWidth = 0.6; ctx.stroke();
    ctx.beginPath(); ctx.moveTo(cx - sr * 0.7, cy - sr * 0.3); ctx.lineTo(cx + sr * 0.7, cy + sr * 0.3);
    ctx.strokeStyle = "rgba(40,36,30,0.9)"; ctx.lineWidth = 0.7; ctx.stroke();
  }
  // hoparlör simgesi
  const cream = "#f6f2e6", s = h * 0.42, cx = x + w * (on ? 0.40 : 0.38), cy = y + h * 0.5;
  ctx.fillStyle = cream;
  ctx.beginPath();
  ctx.moveTo(cx - s * 0.62, cy - s * 0.22); ctx.lineTo(cx - s * 0.30, cy - s * 0.22);
  ctx.lineTo(cx + s * 0.08, cy - s * 0.56); ctx.lineTo(cx + s * 0.08, cy + s * 0.56);
  ctx.lineTo(cx - s * 0.30, cy + s * 0.22); ctx.lineTo(cx - s * 0.62, cy + s * 0.22);
  ctx.closePath(); ctx.fill();
  ctx.strokeStyle = cream; ctx.lineCap = "round"; ctx.lineWidth = Math.max(1.4, h * 0.06);
  if (on) {
    // ses dalgaları: çalıyorken hafifçe nabız atar
    const pulse = MenuMusic.running ? 0.55 + 0.45 * (0.5 + 0.5 * Math.sin(t * 3.2)) : 1;
    for (let i = 0; i < 2; i++) {
      ctx.globalAlpha = (i === 0 ? 1 : pulse);
      ctx.beginPath(); ctx.arc(cx + s * 0.12, cy, s * (0.34 + i * 0.28), -0.8, 0.8); ctx.stroke();
    }
  } else {
    const k = s * 0.22, ox = cx + s * 0.52;
    ctx.beginPath(); ctx.moveTo(ox - k, cy - k); ctx.lineTo(ox + k, cy + k);
    ctx.moveTo(ox + k, cy - k); ctx.lineTo(ox - k, cy + k); ctx.stroke();
  }
  ctx.restore();
}

// Radyo: aksiyon butonlarının ALTINDA (yuva computeLayout'ta). Görsel dikdörtgen + dokunma
// dikdörtgeni (44 pt'ye genişletilir).
function radioRect() {
  const r = layout.radio;
  if (!r) return null;
  const ex = Math.max(0, (44 - r.h) / 2);
  return Object.assign({}, r, { hit: { x: r.x - 6, y: r.y - ex, w: r.w + 12, h: r.h + ex * 2 } });
}

// NOSTALJİK LAMBALI RADYO — cevizli ahşap kasa, krem hoparlör bezi, altın çerçeve, ışıklı
// kadran, iki pirinç düğme ve ortada "sihirli göz" yeşil lamba (eski lambalı radyoların
// ayar göstergesi). Açık/kapalı YEŞİL LAMBADAN okunur; açıkken kadran da amber yanar,
// kasa hafif bir hale saçar ve hoparlörden nota yükselir.
const radioNotes = [];
function drawRadio() {
  const r = radioRect();
  if (!r) return;
  layout.radioBtn = r.hit;
  const { x, y, w, h } = r, on = Radio.on, t = game.clock || 0;
  const breathe = 0.5 + 0.5 * Math.sin(t * 2.2);

  // açıkken sıcak hale (ışıltı)
  if (on) {
    const R = w * 0.95, g = ctx.createRadialGradient(x + w * 0.62, y + h * 0.45, 0, x + w * 0.62, y + h * 0.45, R);
    g.addColorStop(0, "rgba(255,190,90," + (0.20 + 0.06 * breathe).toFixed(3) + ")");
    g.addColorStop(1, "rgba(255,190,90,0)");
    ctx.fillStyle = g; ctx.fillRect(x + w * 0.62 - R, y + h * 0.45 - R, R * 2, R * 2);
  }
  drawGroundShadow(x + w / 2, y + h * 1.02, w * 0.52, h * 0.14);
  // ayaklar
  ctx.fillStyle = "#24140a";
  fillRoundRect(x + w * 0.10, y + h * 0.90, w * 0.10, h * 0.14, h * 0.04, "#24140a");
  fillRoundRect(x + w * 0.80, y + h * 0.90, w * 0.10, h * 0.14, h * 0.04, "#24140a");

  // kasa: cevizli ahşap + vernik parlaması
  const rad = h * 0.26;
  const wood = ctx.createLinearGradient(0, y, 0, y + h);
  wood.addColorStop(0, "#9a5e30"); wood.addColorStop(0.45, "#6f3e1c"); wood.addColorStop(1, "#4a2710");
  fillRoundRect(x, y, w, h * 0.94, rad, wood);
  ctx.save();                                   // ahşap damarları
  ctx.beginPath(); ctx.rect(x, y, w, h * 0.94); ctx.clip();
  ctx.strokeStyle = "rgba(40,18,6,0.22)"; ctx.lineWidth = 1;
  for (let k = 0; k < 5; k++) {
    const yy = y + h * (0.16 + k * 0.17);
    ctx.beginPath(); ctx.moveTo(x, yy);
    ctx.bezierCurveTo(x + w * 0.3, yy - h * 0.05, x + w * 0.6, yy + h * 0.06, x + w, yy - h * 0.02);
    ctx.stroke();
  }
  ctx.restore();
  strokeRoundRect(x, y, w, h * 0.94, rad, "#2a1508", 1.5);
  const gloss = ctx.createLinearGradient(0, y, 0, y + h * 0.4);
  gloss.addColorStop(0, "rgba(255,235,200,0.38)"); gloss.addColorStop(1, "rgba(255,235,200,0)");
  fillRoundRect(x + rad * 0.5, y + 1.5, w - rad, h * 0.36, rad * 0.7, gloss);
  // ışıltı: vernikte birkaç saniyede bir kayan parıltı
  {
    const cyc = (t % 4.2) / 1.1;
    if (cyc < 1) {
      const gxp = x - w * 0.2 + cyc * w * 1.4;
      ctx.save();
      ctx.beginPath(); ctx.rect(x, y, w, h * 0.94); ctx.clip();
      const sg = ctx.createLinearGradient(gxp - w * 0.12, 0, gxp + w * 0.12, 0);
      sg.addColorStop(0, "rgba(255,248,225,0)"); sg.addColorStop(0.5, "rgba(255,248,225,0.30)"); sg.addColorStop(1, "rgba(255,248,225,0)");
      ctx.fillStyle = sg;
      ctx.beginPath();
      ctx.moveTo(gxp - w * 0.10, y); ctx.lineTo(gxp + w * 0.02, y); ctx.lineTo(gxp - w * 0.06, y + h); ctx.lineTo(gxp - w * 0.18, y + h);
      ctx.closePath(); ctx.fill();
      ctx.restore();
    }
  }

  // altın iç çerçeve
  const ix = x + h * 0.10, iy = y + h * 0.10, iw = w - h * 0.20, ih = h * 0.74;
  strokeRoundRect(ix, iy, iw, ih, rad * 0.6, "#d8b064", 1.3);

  // SOL: hoparlör bezi (krem, dikey örgü)
  const gx = ix + h * 0.08, gy = iy + h * 0.08, gw = iw * 0.42, gh = ih - h * 0.16;
  const cloth = ctx.createLinearGradient(0, gy, 0, gy + gh);
  cloth.addColorStop(0, "#e9d6aa"); cloth.addColorStop(1, "#bf9f68");
  fillRoundRect(gx, gy, gw, gh, gh * 0.18, cloth);
  ctx.save();
  ctx.beginPath(); ctx.rect(gx, gy, gw, gh); ctx.clip();
  ctx.fillStyle = "rgba(92,58,24,0.30)";
  const lines = 9;
  for (let k = 1; k < lines; k++) ctx.fillRect(gx + gw * k / lines, gy, 1, gh);
  ctx.restore();
  strokeRoundRect(gx, gy, gw, gh, gh * 0.18, "#a7823f", 1);
  if (on) {                                    // hoparlör titreşimi: bezin üstünde yumuşak nabız
    ctx.fillStyle = "rgba(255,240,200," + (0.10 + 0.10 * Math.abs(Math.sin(t * 7.3))).toFixed(3) + ")";
    fillRoundRect(gx, gy, gw, gh, gh * 0.18, ctx.fillStyle);
  }

  // SAĞ ÜST: kadran penceresi
  const dx = gx + gw + h * 0.10, dy = gy, dw = ix + iw - h * 0.08 - dx, dh = gh * 0.46;
  if (on) {
    const dg = ctx.createLinearGradient(0, dy, 0, dy + dh);
    dg.addColorStop(0, "#fff1c4"); dg.addColorStop(1, "#f2b457");
    ctx.save(); ctx.shadowColor = "rgba(255,190,90,0.9)"; ctx.shadowBlur = h * 0.35;
    fillRoundRect(dx, dy, dw, dh, dh * 0.3, dg);
    ctx.restore();
  } else {
    fillRoundRect(dx, dy, dw, dh, dh * 0.3, "#2b2116");
  }
  strokeRoundRect(dx, dy, dw, dh, dh * 0.3, "#d8b064", 1);
  ctx.fillStyle = on ? "rgba(90,50,10,0.75)" : "rgba(216,176,100,0.35)";   // frekans çentikleri
  for (let k = 1; k < 10; k++) {
    const tk = dx + dw * k / 10, th2 = k % 2 ? dh * 0.25 : dh * 0.42;
    ctx.fillRect(tk, dy + dh * 0.14, 1, th2);
  }
  const target = on && Radio.station >= 0 ? RADIO_STATIONS[Radio.station].dial : 0.12;
  Radio.needle += (target - Radio.needle) * 0.08;          // istasyon değişince iğne kayar
  const needle = dx + dw * (Radio.needle + (on ? 0.008 * Math.sin(t * 1.3) : 0));
  ctx.fillStyle = on ? "#c8281e" : "#6b4a2a";
  ctx.fillRect(needle - 0.75, dy + dh * 0.10, 1.5, dh * 0.80);

  // SAĞ ALT: iki pirinç düğme + ortada "sihirli göz" yeşil lamba
  const ky = dy + dh + (gy + gh - (dy + dh)) * 0.55, kr = h * 0.105;
  const knob = (cx) => {
    const kg = ctx.createRadialGradient(cx - kr * 0.35, ky - kr * 0.35, kr * 0.1, cx, ky, kr);
    kg.addColorStop(0, "#fff0b8"); kg.addColorStop(0.45, "#d9ae55"); kg.addColorStop(1, "#7a5418");
    ctx.fillStyle = kg; ctx.beginPath(); ctx.arc(cx, ky, kr, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = "rgba(60,36,8,0.8)"; ctx.lineWidth = 1; ctx.stroke();
  };
  knob(dx + dw * 0.16); knob(dx + dw * 0.84);
  const ex = dx + dw * 0.5, er = h * 0.095;
  ctx.save();
  if (on) {
    ctx.shadowColor = "rgba(90,255,130,0.95)"; ctx.shadowBlur = h * (0.45 + 0.2 * breathe);
    const eg = ctx.createRadialGradient(ex, ky, 0, ex, ky, er);
    eg.addColorStop(0, "#eaffea"); eg.addColorStop(0.4, "#7dff9a"); eg.addColorStop(1, "#1f9c45");
    ctx.fillStyle = eg;
  } else {
    const eg = ctx.createRadialGradient(ex - er * 0.3, ky - er * 0.3, 0, ex, ky, er);
    eg.addColorStop(0, "#56655a"); eg.addColorStop(1, "#1d2620");
    ctx.fillStyle = eg;
  }
  ctx.beginPath(); ctx.arc(ex, ky, er, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
  ctx.strokeStyle = "#d8b064"; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(ex, ky, er + 1, 0, Math.PI * 2); ctx.stroke();

  // istasyon adı: açılışta ve istasyon değişince radyonun sağında 2,4 sn görünür
  if (Radio.toast && on) {
    const age = t - Radio.toast.t0;
    if (age >= 0 && age < 2.4) {
      const a = Math.min(1, age * 4) * Math.min(1, (2.4 - age) * 2.5);
      ctx.save(); ctx.globalAlpha = a;
      const th = h * 0.52, tx0 = x + w + h * 0.35, ty0 = y + (h - th) / 2;
      ctx.font = "800 " + (th * 0.55).toFixed(1) + "px " + RX_FONT;
      const tw = ctx.measureText(Radio.toast.text).width + th * 0.9;
      fillRoundRect(tx0, ty0, tw, th, th * 0.45, "rgba(20,14,10,0.88)");
      strokeRoundRect(tx0, ty0, tw, th, th * 0.45, "rgba(216,176,100,0.8)", 1);
      fitText(Radio.toast.text, tx0 + tw / 2, ty0 + th / 2, tw * 0.9, th * 0.55, "#ffd98a", "center", "800");
      ctx.restore();
    }
  }

  // açıkken hoparlörden yükselen notalar
  if (on) {
    if (!radioNotes.length || t - radioNotes[radioNotes.length - 1].t0 > 0.9) {
      radioNotes.push({ t0: t, side: radioNotes.length % 2 ? 1 : -1, glyph: Math.random() < 0.5 ? "♪" : "♫" });
    }
  }
  for (let k = radioNotes.length - 1; k >= 0; k--) {
    const n = radioNotes[k], age = t - n.t0;
    if (age > 2.2 || age < 0) { radioNotes.splice(k, 1); continue; }
    const a = Math.min(1, age * 3) * (1 - age / 2.2);
    ctx.save();
    ctx.globalAlpha = a * (on ? 1 : 0.6);
    ctx.shadowColor = "rgba(255,210,120,0.9)"; ctx.shadowBlur = h * 0.3;
    ctx.fillStyle = "#ffe2a0";
    ctx.font = "700 " + (h * 0.42).toFixed(1) + "px " + RX_FONT;
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    // yukarı değil YANA süzülür: üstteki REDDET/ONAYLA yazılarının üstüne binmesin
    const nx = n.side < 0 ? x - age * h * 0.9 : x + w + age * h * 0.9;
    ctx.fillText(n.glyph, nx, y + h * 0.35 - age * h * 0.18 + Math.sin(age * 4 + k) * h * 0.08);
    ctx.restore();
  }
}

// Tezgahın SAĞ tarafında duran bilgisayar (kapalı defterin simetriği) — depo
// sipariş ekranını açar. Defterle benzer görsel ağırlıkta (küçük), bandın EN SAĞINA
// yaslı (sağ boşluk = defterin sol boşluğu, S.w*0.02) ve alt kenarı defterin alt
// kenarıyla aynı hizada (tezgah yüzeyi) — ortadaki hastanın önünü kesmez.
// CONFIG.pcScale / pcOffsetX ile elle ince ayar. Rect burada hesaplanır.
function drawCounterPC() {
  const b = layout._band, S = layout.stage;
  if (!b) return;
  const scale = CONFIG.pcScale || 1;
  const pw = S.w * 0.21 * scale, ph = S.h * 0.10 * scale;
  const px = b.x + b.w - pw - S.w * 0.02 + (CONFIG.pcOffsetX || 0);
  const surfaceY = b.y + b.h * 0.58;    // defterin oturduğu tezgah yüzey çizgisi (aynı hiza)
  const py = surfaceY - ph;
  // tıklama alanı görselden her yönde ~9px geniş (dokunma kolaylığı)
  const hitPad = 9;
  layout.pcBtn = { x: px - hitPad, y: py - hitPad, w: pw + hitPad * 2, h: ph + hitPad * 2 };
  drawGroundShadow(px + pw / 2, surfaceY - ph * 0.04, pw * 0.5, ph * 0.14);
  const img = Assets.images["pc"];
  if (img && img.complete && img.naturalWidth > 0) {
    // Defterle aynı oturma mantığı: görsel ALT KENARA yaslanır (contain ortalayıp
    // havada bırakabiliyordu). Genişliğe sığdır, oran koru; alt kenar = yüzey çizgisi.
    let dw = pw, dh = pw * (img.naturalHeight / img.naturalWidth);
    const maxDh = ph * 1.35;            // aşırı dik görselde tavan (oran korunarak)
    if (dh > maxDh) { dw *= maxDh / dh; dh = maxDh; }
    ctx.drawImage(img, px + (pw - dw) / 2, surfaceY - dh, dw, dh);
  } else {
    // fallback: koyu monitör + soluk yeşilimsi ekran + ayak + 🖥️ (taban yüzey çizgisinde biter)
    const mh = ph * 0.78;
    fillRoundRect(px, py, pw, mh, mh * 0.12, "#241d30");
    strokeRoundRect(px, py, pw, mh, mh * 0.12, "rgba(245,170,70,0.4)", 1.5);
    const inPad = pw * 0.06;
    fillRoundRect(px + inPad, py + mh * 0.12, pw - inPad * 2, mh * 0.70, mh * 0.08, "rgba(120,180,150,0.28)");
    text("🖥️", px + pw / 2, py + mh * 0.47, mh * 0.48, "#000", "center", "400");
    // monitör ayağı + taban
    fillRoundRect(px + pw * 0.42, py + mh, pw * 0.16, ph * 0.12, 2, "#1c1626");
    fillRoundRect(px + pw * 0.30, py + ph * 0.92, pw * 0.40, ph * 0.08, 2, "#2a2138");
  }

  // --- sepet rozeti (PC'nin sağ üst köşesi) ---
  // Tezgah tepsisi kaldırıldığı için oyuncunun "seçtiklerim nerede" sorusunun tek
  // görünür cevabı bu rozet: sepetteki TOPLAM kalem sayısını gösterir.
  const nCart = game.counter.length;
  if (nCart > 0) {
    const br = Math.max(pw * 0.13, S.w * 0.022);
    const bx = px + pw - br * 0.35, by = surfaceY - ph - br * 0.15;
    ctx.save();
    ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2);
    ctx.fillStyle = CONFIG.colors.neon; ctx.fill();
    ctx.restore();
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(20,16,28,0.85)"; ctx.lineWidth = Math.max(1, br * 0.14); ctx.stroke();
    text(String(nCart), bx, by, br * 1.15, "#1a1420", "center", "800");
  }
}

// Kısa stok uyarısı toast'u (feedback'ten bağımsız, süreli; random yok — clock ile fade).
// Bilgi şeridi (SGK ödemesi vb.) — stok uyarısından AYRI kanal, birbirini ezmez.
function drawInfoToast() {
  const t = game.infoToast;
  if (!t || game.clock > t.until) return;
  const S = layout.stage, c = CONFIG.colors;
  const left = Math.max(0, t.until - game.clock);
  const a = clamp(Math.min(left / 0.4, 1), 0, 1);
  const boxW = S.w * 0.76, boxH = S.h * 0.052;
  const bx = S.x + (S.w - boxW) / 2;
  const by = layout._hud ? layout._hud.y + layout._hud.h + S.h * 0.015 : S.y + S.h * 0.12;
  ctx.save();
  ctx.globalAlpha = a;
  woodPanel(bx, by, boxW, boxH, "green", Math.max(2.5, boxH * 0.09));      // yeşil lake şerit
  fitTextF(t.text, bx + boxW / 2, by + boxH / 2, boxW * 0.88, boxH * 0.42, "#fbeec4", "center", "700", SLAB_FONT, "emboss");
  ctx.restore();
}

function drawStockToast() {
  const t = game.stockToast;
  if (!t) return;
  const remain = t.until - game.clock;
  if (remain <= 0) { game.stockToast = null; return; }
  const c = CONFIG.colors, S = layout.stage;
  const dur = CONFIG.stockToastDuration;
  const alpha = clamp(remain / (dur * 0.4), 0, 1);   // son %40'ta yumuşak sönme
  const boxW = S.w * 0.62, boxH = S.h * 0.055;
  const bx = S.x + (S.w - boxW) / 2;
  const by = layout.gridArea ? layout.gridArea.y - boxH - S.h * 0.008 : S.y + S.h * 0.5;
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.shadowColor = "rgba(0,0,0,0.35)"; ctx.shadowBlur = 12; ctx.shadowOffsetY = 3;
  ctx.shadowColor = "transparent";
  woodPanel(bx, by, boxW, boxH, "red", Math.max(2.5, boxH * 0.09));        // kırmızı lake şerit
  fitTextF(t.text, bx + boxW / 2, by + boxH / 2, boxW * 0.88, boxH * 0.42, "#fbeec4", "center", "700", SLAB_FONT, "emboss");
  ctx.restore();
}

// PC ekranı kapsayıcısı: karartma + koyu panel + yeşilimsi sistem başlık şeridi + ✕.
// İleride Medula / E-reçete gibi ekranlar da bu kapsayıcıyla çizilecek; içerik rect'i döner.
// =====================================================================
//  BİLGİSAYAR EKRANI — eski yeşil fosforlu terminal (Kerem: "Fallout'taki bilgisayar gibi")
// =====================================================================
// Tezgahtaki pc.png'ye DOKUNULMAZ; bu, açılan ekranın kendisi. Zeytin-gri metal kasa, bombeli CRT
// cam, VT323 terminal yazısı; içerik normal çizilir, sonra crtPost() ekranı tek renk yeşil fosfora
// çevirir (renk doygunluğu alınır, yeşille çarpılır) ve tarama çizgileri + köşe kararması ekler.
const PC_FONT = "EczTerm, 'Courier New', monospace";
function drawPcScreen(title) {
  const w = layout.w, h = layout.h, S = layout.stage;

  // tam ekran karartma (modal) — sahnenin TAMAMEN üstüne
  ctx.fillStyle = "rgba(8,6,12,0.80)";
  ctx.fillRect(0, 0, w, h);

  const panelW = S.w * 0.92, panelH = S.h * 0.82;
  const panelX = S.x + (S.w - panelW) / 2, panelY = S.y + (S.h - panelH) / 2;
  layout.depotPanel = { x: panelX, y: panelY, w: panelW, h: panelH };

  // --- metal kasa ---
  const kr = panelW * 0.06;
  uiShadow(() => {
    const g = ctx.createLinearGradient(0, panelY, 0, panelY + panelH);
    g.addColorStop(0, "#6a6955"); g.addColorStop(0.5, "#4a4a3c"); g.addColorStop(1, "#2e2d24");
    fillRoundRect(panelX, panelY, panelW, panelH, kr, g);
  });
  strokeRoundRect(panelX + 1.5, panelY + 1.5, panelW - 3, panelH - 3, kr * 0.9, "rgba(255,255,230,0.14)", 1.5);
  strokeRoundRect(panelX, panelY, panelW, panelH, kr, "rgba(0,0,0,0.7)", 1.5);
  const sideB = panelW * 0.05, topB = panelH * 0.04, botB = panelH * 0.075;
  const sx = panelX + sideB, sy = panelY + topB, sw = panelW - sideB * 2, sh = panelH - topB - botB;
  const sr = panelW * 0.045;
  // cam çerçevesi (içe gömük)
  fillRoundRect(sx - 4, sy - 4, sw + 8, sh + 8, sr + 3, "#1a1a14");
  strokeRoundRect(sx - 4, sy - 4, sw + 8, sh + 8, sr + 3, "rgba(255,255,230,0.10)", 1);
  // ekran zemini
  const bg = ctx.createRadialGradient(sx + sw / 2, sy + sh / 2, sw * 0.1, sx + sw / 2, sy + sh / 2, sw * 0.8);
  bg.addColorStop(0, "#0c1a10"); bg.addColorStop(1, "#040806");
  fillRoundRect(sx, sy, sw, sh, sr, bg);
  layout._pcScreen = { x: sx, y: sy, w: sw, h: sh, r: sr };
  // alt şerit: marka plakası + güç ışığı + iki düğme
  const by = panelY + panelH - botB / 2;
  fitTextF("TERMİNAL", panelX + panelW * 0.5, by, panelW * 0.4, botB * 0.42, "#c9c6ad", "center", "700", SIGN_FONT, "emboss");
  for (const kx of [0.10, 0.18]) {
    const cx = panelX + panelW * kx, rr = botB * 0.22;
    const kg = ctx.createRadialGradient(cx - rr * 0.3, by - rr * 0.3, rr * 0.1, cx, by, rr);
    kg.addColorStop(0, "#8a8878"); kg.addColorStop(1, "#262519");
    ctx.beginPath(); ctx.arc(cx, by, rr, 0, Math.PI * 2); ctx.fillStyle = kg; ctx.fill();
    ctx.strokeStyle = "rgba(0,0,0,0.6)"; ctx.lineWidth = 1; ctx.stroke();
  }
  const lx = panelX + panelW * 0.9;
  ctx.save(); ctx.shadowColor = "#5cff8f"; ctx.shadowBlur = 8;
  ctx.beginPath(); ctx.arc(lx, by, botB * 0.11, 0, Math.PI * 2); ctx.fillStyle = "#7dffa8"; ctx.fill();
  ctx.restore();
  { const r0 = Math.max(1.8, panelW * 0.009);                      // vidalar kasanın köşelerinde (camın dışında)
    for (const [fx, fy] of [[sideB * 0.5, topB * 0.55], [panelW - sideB * 0.5, topB * 0.55],
                            [sideB * 0.5, panelH - botB * 0.5], [panelW - sideB * 0.5, panelH - botB * 0.5]])
      uiScrew(panelX + fx, panelY + fy, r0, false); }

  // --- ekran başlığı (terminal satırları) ---
  const barH = sh * 0.085, px = sx + sw * 0.05;
  fitText("ECZA-TERM İŞLETİM SİSTEMİ v2.3  ·  " + formatMoney(game.money), px, sy + barH * 0.30,
    sw * 0.9, barH * 0.30, "#cfeed8", "left", "400");
  const cur = (game.clock % 1) < 0.5 ? "_" : " ";
  fitText("> " + title.toLocaleUpperCase("tr-TR") + cur, px, sy + barH * 0.72, sw * 0.9, barH * 0.40, "#ffffff", "left", "700");
  ctx.fillStyle = "rgba(220,255,230,0.55)";
  ctx.fillRect(px, sy + barH - 2, sw * 0.9, 1.5);

  // kapat butonu — kasanın sağ üst köşesinde metal düğme
  const cs = S.w * 0.085;
  layout.depotCloseBtn = { x: panelX + panelW - cs * 0.85, y: panelY - cs * 0.35, w: cs, h: cs };
  const cb = layout.depotCloseBtn, ccx = cb.x + cb.w / 2, ccy = cb.y + cb.h / 2;
  ctx.save();
  ctx.shadowColor = "rgba(0,0,0,0.5)"; ctx.shadowBlur = 8; ctx.shadowOffsetY = 3;
  const cg = ctx.createRadialGradient(ccx - cs * 0.15, ccy - cs * 0.15, cs * 0.05, ccx, ccy, cs / 2);
  cg.addColorStop(0, "#c84a44"); cg.addColorStop(1, "#6e1c19");
  ctx.beginPath(); ctx.arc(ccx, ccy, cb.w / 2, 0, Math.PI * 2); ctx.fillStyle = cg; ctx.fill();
  ctx.restore();
  ctx.strokeStyle = "#2e2d24"; ctx.lineWidth = Math.max(2, cs * 0.07);
  ctx.beginPath(); ctx.arc(ccx, ccy, cb.w / 2, 0, Math.PI * 2); ctx.stroke();
  fitTextF("✕", ccx, ccy, cs * 0.6, cs * 0.5, "#f6e6d0", "center", "700", RX_FONT, "emboss");

  // Kapat düğmesi terminal fontuna düşmesin diye başlık çizimi fitText ile, içerik ise
  // drawPcPanel'in açtığı UI_FONT altında çizilir.
  return { x: sx, y: sy + barH, w: sw, h: sh - barH };
}

let _crtLayer = null;
function crtStaticLayer(sc) {
  const key = Math.round(sc.w) + "x" + Math.round(sc.h) + "@" + DPR;
  if (_crtLayer && _crtLayer.key === key) return _crtLayer.cv;
  const cv = document.createElement("canvas");
  cv.width = Math.max(1, Math.ceil(sc.w * DPR)); cv.height = Math.max(1, Math.ceil(sc.h * DPR));
  const g = cv.getContext("2d"), w = sc.w, h = sc.h;
  g.scale(DPR, DPR);
  g.fillStyle = "rgba(0,0,0,0.20)";                                   // tarama çizgileri
  for (let y = 0; y < h; y += 3) g.fillRect(0, y, w, 1);
  const vg = g.createRadialGradient(w / 2, h / 2, Math.min(w, h) * 0.35, w / 2, h / 2, Math.max(w, h) * 0.72);
  vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.55)");   // bombeli cam kararması
  g.fillStyle = vg; g.fillRect(0, 0, w, h);
  const gl = g.createRadialGradient(w * 0.25, h * 0.12, 2, w * 0.25, h * 0.12, w * 0.6);
  gl.addColorStop(0, "rgba(255,255,255,0.07)"); gl.addColorStop(1, "rgba(255,255,255,0)");   // cam yansıması
  g.fillStyle = gl; g.fillRect(0, 0, w, h);
  _crtLayer = { key, cv };
  return cv;
}
// Ekranı yeşil fosfora çevir + CRT dokusu (içerik çizildikten SONRA çağrılır)
function crtPost(sc) {
  if (!sc) return;
  const t = game.clock || 0;
  ctx.save();
  roundRect(sc.x, sc.y, sc.w, sc.h, sc.r); ctx.clip();
  ctx.globalCompositeOperation = "saturation"; ctx.fillStyle = "#808080"; ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  ctx.globalCompositeOperation = "multiply";   ctx.fillStyle = "#4dff8e"; ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  ctx.globalCompositeOperation = "screen";     ctx.fillStyle = "#06170c"; ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  ctx.globalCompositeOperation = "source-over";
  // Sabit doku (tarama çizgileri + köşe kararması + cam yansıması) ekran ölçüsü değişmedikçe
  // aynıdır → bir kez ayrı tuvale çizilir, her karede tek drawImage (ölçüldü: yazılım
  // çiziminde karede ~5 ms kazanç; iPhone'da GPU'ya daha az iş).
  ctx.drawImage(crtStaticLayer(sc), sc.x, sc.y, sc.w, sc.h);
  // yavaşça aşağı kayan tazeleme bandı + çok hafif titreme (her kare değişir)
  const bandY = sc.y + ((t * 0.18) % 1) * (sc.h + sc.h * 0.3) - sc.h * 0.15, bh = sc.h * 0.15;
  const bg = ctx.createLinearGradient(0, bandY, 0, bandY + bh);
  bg.addColorStop(0, "rgba(120,255,170,0)"); bg.addColorStop(0.5, "rgba(120,255,170,0.045)"); bg.addColorStop(1, "rgba(120,255,170,0)");
  ctx.fillStyle = bg; ctx.fillRect(sc.x, bandY, sc.w, bh);
  ctx.fillStyle = "rgba(120,255,170," + (0.012 + 0.012 * Math.sin(t * 47)) + ")"; ctx.fillRect(sc.x, sc.y, sc.w, sc.h);
  ctx.restore();
}

// --- SATIŞ ekranı: İSTENEN (üstte) + SEPET (altta) + SERVİS ET ---
// Oyuncu paneli kapatmadan istenenle sepeti karşılaştırabilsin diye ikisi AYNI ekranda.
// Bu ekran oyunu DONDURMAZ (bkz. pcFreezesGame) — sabır işlemeye devam eder.
function drawSale() {
  const c = CONFIG.colors;
  const r = drawPcScreen("SATIŞ — Sipariş Hazırla");
  layout.saleRows = [];
  layout.saleServeBtn = null;

  // GERİ (diğer ekranlarla aynı buton dili)
  const backW = r.w * 0.26, backH = r.h * 0.055;
  const backX = r.x + r.w * 0.95 - backW, backY = r.y + r.h * 0.028;
  layout.pcBackBtn = { x: backX, y: backY, w: backW, h: backH };
  fillRoundRect(backX, backY, backW, backH, backH * 0.35, c.btnDark);
  strokeRoundRect(backX, backY, backW, backH, backH * 0.35, "rgba(245,170,70,0.55)", 1.5);
  text("‹ GERİ", backX + backW / 2, backY + backH / 2, backH * 0.46, c.neon, "center", "800");

  const p = activePatient();
  const pad = r.w * 0.06;
  const colX = r.x + pad, colW = r.w - pad * 2;

  // Tezgahta hasta yoksa: ekran bunu söyler, sepet boş.
  if (!p) {
    fitText("🚪 Tezgahta hasta yok", r.x + r.w / 2, r.y + r.h * 0.45, colW, r.h * 0.045, c.creamSoft, "center", "800");
    fitText("Hasta gelince siparişi buradan hazırlarsın.", r.x + r.w / 2, r.y + r.h * 0.53,
      colW, r.h * 0.028, c.creamSoft, "center", "600");
    return;
  }

  // ============ ÜST: İSTENEN ============
  const wantTop = r.y + r.h * 0.115;
  fitText("İSTENEN", colX, wantTop, colW * 0.5, r.h * 0.030, c.neon, "left", "800");

  const wantRows = saleWantRows(p);
  const wantH = r.h * 0.245;
  const wantY = wantTop + r.h * 0.022;
  fillRoundRect(colX, wantY, colW, wantH, r.h * 0.018, "rgba(255,255,255,0.05)");
  strokeRoundRect(colX, wantY, colW, wantH, r.h * 0.018, "rgba(245,170,70,0.22)", 1);

  if (!wantRows.length) {
    fitText("—", colX + colW / 2, wantY + wantH / 2, colW * 0.8, r.h * 0.028, c.creamSoft, "center", "600");
  } else {
    // 6 kalemlik reçete de sığsın: satır yüksekliği kalem sayısına göre daralır,
    // taban punto fitText ile zaten kırpılıyor => taşma olmaz.
    const lineH = Math.min(wantH / 6.4, wantH / (wantRows.length + 0.4));
    let ly = wantY + lineH * 0.7;
    for (const w of wantRows) {
      drawEmoji(w.emoji, colX + colW * 0.045, ly, lineH * 0.62, c.cream);
      fitText(w.label, colX + colW * 0.10, ly, colW * 0.66, lineH * 0.52, c.cream, "left", "700");
      if (w.qty > 1) text("×" + w.qty, colX + colW * 0.955, ly, lineH * 0.56, c.neon, "right", "800");
      ly += lineH;
    }
  }

  // ============ ALT: SEPET ============
  const serveH = r.h * 0.085;
  const serveY = r.y + r.h * 0.905 - serveH;
  const cartTop = wantY + wantH + r.h * 0.030;
  fitText("SEPET", colX, cartTop, colW * 0.5, r.h * 0.030, c.neon, "left", "800");
  const rows = cartRows();
  const totalQty = game.counter.length;
  text(totalQty + " kalem", colX + colW, cartTop, r.h * 0.026, c.creamSoft, "right", "700");

  const cartY = cartTop + r.h * 0.022;
  const cartH = serveY - cartY - r.h * 0.022;
  fillRoundRect(colX, cartY, colW, cartH, r.h * 0.018, "rgba(255,255,255,0.05)");
  strokeRoundRect(colX, cartY, colW, cartH, r.h * 0.018, "rgba(245,170,70,0.22)", 1);

  if (!rows.length) {
    fitText("Sepet boş — aşağıdaki raftan ilaç seç", colX + colW / 2, cartY + cartH / 2,
      colW * 0.86, r.h * 0.028, c.creamSoft, "center", "600");
  } else {
    // 6 satır referans yükseklik; daha azsa satırlar ferahlar, daha çoksa sıkışır (taşmaz)
    const rowH = Math.min(cartH / 6.2, cartH / (rows.length + 0.2));
    const btnR = Math.min(rowH * 0.34, colW * 0.055);
    let ry = cartY + rowH * 0.15;
    for (const row of rows) {
      const cy = ry + rowH / 2;
      const m = row.med;
      Sprite.draw(ctx, m.assetKey, colX + colW * 0.02, ry + rowH * 0.10, rowH * 0.8, rowH * 0.8, () => {
        fillRoundRect(colX + colW * 0.02, ry + rowH * 0.10, rowH * 0.8, rowH * 0.8, rowH * 0.18, m.color);
        drawEmoji(m.emoji, colX + colW * 0.02 + rowH * 0.4, cy, rowH * 0.45, "#000");
      }, "contain");
      fitText(m.name, colX + colW * 0.15, cy, colW * 0.42, rowH * 0.42, c.cream, "left", "700");

      // − / + adımlayıcı (depo ekranıyla aynı dil)
      const plusX = colX + colW * 0.93, minusX = colX + colW * 0.70;
      const qtyX = (plusX + minusX) / 2;
      const stock = game.stock[row.id] || 0;
      const plusOn = row.qty < stock;
      const minus = { id: row.id, x: minusX - btnR, y: cy - btnR, w: btnR * 2, h: btnR * 2, delta: -1, on: true };
      const plus  = { id: row.id, x: plusX - btnR, y: cy - btnR, w: btnR * 2, h: btnR * 2, delta: 1, on: plusOn };
      layout.saleRows.push(minus, plus);
      for (const b of [minus, plus]) {
        fillRoundRect(b.x, b.y, b.w, b.h, b.w * 0.32, c.btnDark);
        strokeRoundRect(b.x, b.y, b.w, b.h, b.w * 0.32, b.on ? "rgba(245,170,70,0.65)" : c.neonDim, 1.5);
        text(b.delta > 0 ? "+" : "−", b.x + b.w / 2, b.y + b.h / 2, b.h * 0.62,
          b.on ? c.neon : c.neonDim, "center", "800");
      }
      text(String(row.qty), qtyX, cy, rowH * 0.48, c.cream, "center", "800");
      ry += rowH;
    }
  }

  // ============ SERVİS ET ============
  const enabled = game.counter.length > 0 && servingAllowed();
  layout.saleServeBtn = { x: colX, y: serveY, w: colW, h: serveH, enabled };
  fillRoundRect(colX, serveY, colW, serveH, serveH * 0.32, c.btnDark);
  ctx.save();
  if (enabled) {
    const pulse = 0.6 + 0.4 * (0.5 + 0.5 * Math.sin(game.clock * 4));
    ctx.shadowColor = c.neonGlow; ctx.shadowBlur = 20 * pulse;
  }
  strokeRoundRect(colX, serveY, colW, serveH, serveH * 0.32,
    enabled ? c.neon : c.neonDim, Math.max(2, colW * 0.005));
  ctx.restore();
  text("SERVİS ET", colX + colW / 2, serveY + serveH / 2, serveH * 0.36,
    enabled ? c.neon : c.neonDim, "center", "800");
}

// İSTENEN listesinin satırları. Reçete/Medula => kalem + adet; semptom => semptomlar.
// Medula hastasında kod HENÜZ sorgulanmadıysa liste gizli kalır (oyuncu önce sorgulamalı).
function saleWantRows(p) {
  const req = p.request;
  if (req.type === "beggar") {
    return [{ emoji: "🤝", label: "Dilenci — karar alt şeritteki üç butonda", qty: 1 }];
  }
  if (req.type === "beggarpay") {
    return [{ emoji: "💵", label: "Borcunu ödemeye geldi — alt şeritten al", qty: 1 }];
  }
  if (req.type === "prescription" || req.type === "medula") {
    if (req.type === "medula" && !medulaIsRevealed(req.code)) {
      return [{ emoji: "🖥️", label: "Kod " + req.code + " — önce MELUDA'dan sorgula", qty: 1 }];
    }
    if (req.type === "prescription" && p.decided !== "approve") {
      return [{ emoji: "📋", label: "Reçete henüz onaylanmadı", qty: 1 }];
    }
    return req.items.map(it => {
      const m = getMedicine(it.id);
      return { emoji: m ? m.emoji : "💊", label: m ? m.name : it.id, qty: it.qty };
    });
  }
  const items = req.items || [{ symptom: req.symptom, qty: 1 }];
  return items.map(it => ({ emoji: it.symptom.emoji || "🩺", label: it.symptom.label || it.symptom.text || "—", qty: it.qty }));
}

// --- MEDULA SİSTEMİ ekranı: kod girişi + tuş takımı + sonuç ---
function drawMedula() {
  const c = CONFIG.colors;
  const r = drawPcScreen("MELUDA SİSTEMİ — E-Reçete Sorgu");

  if (!medulaUnlocked()) {
    fitText("🔒 Meluda terminali kurulu değil", r.x + r.w / 2, r.y + r.h * 0.42, r.w * 0.8, r.h * 0.045, c.creamSoft, "center", "800");

    layout.medulaKeys = null; layout.medulaOk = null; layout.medulaDel = null;

  }

  // --- giriş kutusu ---
  const inW = r.w * 0.72, inH = r.h * 0.075;
  const inX = r.x + (r.w - inW) / 2, inY = r.y + r.h * 0.10;
